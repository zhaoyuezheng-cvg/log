<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>七年级英语期中 · 易错知识点精讲与逐条检验</title>
<style>
:root{
  --bg:#f3f5fc; --surface:#ffffff; --surface2:#f8f9ff; --ink:#1c2338; --ink2:#414a66;
  --muted:#77819c; --line:#e6e9f4; --brand:#4f46e5; --brand2:#7c3aed; --teal:#0d9488;
  --ok:#0f9d76; --warn:#cf7a10; --fix:#d92d48; --amber:#d97706; --soft-ok:#e9f8f2; --soft-warn:#fff5e6;
  --soft-fix:#ffeef0; --soft-brand:#eef0ff; --soft-teal:#e7f7f5;
  --shadow:0 6px 26px rgba(28,35,56,.065); --shadow2:0 18px 46px rgba(28,35,56,.13);
  --r:18px; --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --en:"Georgia","Times New Roman",serif;
  --cn:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;
}
html[data-theme="dark"]{
  --bg:#0b1020; --surface:#151c30; --surface2:#1b2339; --ink:#e9edfa; --ink2:#c3cbe0;
  --muted:#a4b0cd; --line:#283251; --brand:#8b83ff; --brand2:#a78bfa; --teal:#2dd4bf;
  --ok:#34d399; --warn:#fbbf24; --fix:#fb7185; --soft-ok:#12362e; --soft-warn:#3a2d13;
  --soft-fix:#3c1d28; --soft-brand:#232448; --soft-teal:#123634;
  --shadow:0 6px 26px rgba(0,0,0,.25); --shadow2:0 18px 46px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--cn);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 500px at 8% -10%,rgba(79,70,229,.10),transparent 70%),radial-gradient(800px 460px at 95% 8%,rgba(13,148,136,.09),transparent 70%)}
button,input{font-family:inherit;font-size:inherit}
button{cursor:pointer}
a{color:var(--brand)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 90px;position:relative;z-index:1}

/* ===== Hero ===== */
.hero{position:relative;overflow:hidden;color:#fff;padding:44px 0 88px;background:linear-gradient(118deg,#211b57 0%,#4338ca 46%,#0e7490 100%)}
.hero::before{content:"";position:absolute;width:620px;height:620px;right:-120px;top:-300px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.20),transparent 66%)}
.hero::after{content:"";position:absolute;width:420px;height:420px;left:-140px;bottom:-280px;border-radius:50%;background:radial-gradient(circle,rgba(45,212,191,.24),transparent 66%)}
.hero .wrap{padding-bottom:0;z-index:2}
.hero .kicker{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.14em;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.24);padding:6px 14px;border-radius:999px;backdrop-filter:blur(6px)}
.hero h1{margin:18px 0 8px;font-size:clamp(27px,4.2vw,42px);font-weight:800;letter-spacing:.5px;line-height:1.3}
.hero h1 em{font-style:normal;color:#a5f3ea}
.hero p.sub{margin:0;color:rgba(255,255,255,.85);font-size:15px;max-width:720px}
.hero .pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.hero .pills span{font-size:12.5px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);padding:5px 13px;border-radius:999px}
.dots{position:absolute;inset:0;pointer-events:none}
.dots i{position:absolute;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-14px);opacity:.9}}

/* ===== Stats ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:-52px;position:relative;z-index:3}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.stat .n{font-size:29px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:2px}
.stat:nth-child(1) .n{color:var(--brand)} .stat:nth-child(2) .n{color:var(--fix)}
.stat:nth-child(3) .n{color:var(--warn)} .stat:nth-child(4) .n{color:var(--teal)}

/* ===== Toolbar ===== */
.toolbar{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.toolrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1 1 260px;min-width:190px}
.search input{width:100%;padding:11px 14px 11px 38px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:11px;outline:none;transition:.2s}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.13)}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
.btn{border:1.5px solid var(--line);background:var(--surface2);color:var(--ink2);padding:9px 14px;border-radius:11px;font-size:13.5px;white-space:nowrap;transition:.18s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(79,70,229,.28)}
.btn.primary:hover{color:#fff;filter:brightness(1.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--muted);font-size:12.5px;padding:5px 13px;border-radius:999px;transition:.18s}
.chip:hover{color:var(--brand);border-color:var(--brand)}
.chip.on{background:var(--soft-brand);border-color:var(--brand);color:var(--brand);font-weight:700}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* ===== Tabs / progress ===== */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 0}
.tab{border:1.5px solid var(--line);background:var(--surface);color:var(--ink2);padding:10px 18px;border-radius:12px;font-size:14px;font-weight:600;transition:.18s;box-shadow:var(--shadow)}
.tab:hover{transform:translateY(-2px);border-color:var(--brand)}
.tab.on{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(79,70,229,.25)}
.tab small{opacity:.75;font-weight:400;margin-left:6px;font-size:12px}
.prog{display:flex;align-items:center;gap:12px;margin:18px 0 8px;color:var(--muted);font-size:13px}
.prog .track{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--brand));border-radius:99px;transition:width .4s}
.prog b{color:var(--teal);font-variant-numeric:tabular-nums}

/* ===== Section head ===== */
.sec-head{display:flex;align-items:baseline;gap:12px;margin:22px 0 14px;flex-wrap:wrap}
.sec-head h2{margin:0;font-size:21px;font-weight:800}
.sec-head .desc{color:var(--muted);font-size:13px}
.sec-head .count{margin-left:auto;color:var(--muted);font-size:13px}

/* ===== Cards ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden;transition:.22s;position:relative}
.card:hover{box-shadow:var(--shadow2);transform:translateY(-2px)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ok)}
.card[data-s="warn"]::before{background:var(--warn)} .card[data-s="fix"]::before{background:var(--fix)}
.card.done{opacity:.72}
.card-head{display:flex;align-items:center;gap:14px;padding:16px 20px 14px 22px;cursor:pointer;user-select:none}
.card-head:hover .chev{color:var(--brand)}
.idx{flex:0 0 34px;height:34px;border-radius:10px;background:var(--soft-brand);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.ttl{flex:1;min-width:0}
.ttl h3{margin:0;font-family:var(--en);font-size:22px;font-weight:700;letter-spacing:.2px;line-height:1.35;word-break:break-word}
.ttl h3.sent{font-size:17.5px;line-height:1.5}
.ttl p{margin:2px 0 0;color:var(--muted);font-size:13px}
.badge{font-size:11.5px;padding:3px 10px;border-radius:999px;white-space:nowrap;font-weight:700;border:1px solid transparent}
.badge.ok{background:var(--soft-ok);color:var(--ok)} .badge.warn{background:var(--soft-warn);color:var(--warn)}
.badge.fix{background:var(--soft-fix);color:var(--fix)}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:270px}
.badge.tag{background:var(--surface2);color:var(--muted);font-weight:500;border-color:var(--line)}
.acts{display:flex;align-items:center;gap:8px}
.star{border:1.5px solid var(--line);background:var(--surface2);color:var(--muted);width:32px;height:32px;border-radius:10px;font-size:15px;line-height:1;transition:.18s}
.star:hover{border-color:var(--warn);color:var(--warn);transform:scale(1.08)}
.star.on{background:var(--soft-warn);border-color:var(--warn);color:var(--warn)}
.chev{color:var(--muted);font-size:17px;transition:transform .22s;display:inline-block;width:16px;text-align:center}
.card.open .chev{transform:rotate(180deg)}
.core{padding:0 22px 15px 70px;color:var(--ink2);font-size:14px;margin-top:-4px}
.core b{color:var(--brand)}
.detail{border-top:1px dashed var(--line);padding:18px 22px 22px;background:var(--surface2)}
.detail.collapsed{display:none}
.block{margin-bottom:16px}
.block:last-child{margin-bottom:0}
.blk-t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin-bottom:8px;letter-spacing:.4px}
.blk-t .bi{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;color:#fff;flex:0 0 22px}
.b-check .bi{background:var(--ok)} .b-fix .bi{background:var(--fix)} .b-warn .bi{background:var(--warn)}
.b-note .bi{background:#8b93ad} .b-exp .bi{background:var(--brand2)} .b-con .bi{background:var(--teal)} .b-ex .bi{background:var(--amber)}
html[data-theme="dark"] .tip{color:#ffe7b3}
html[data-theme="dark"] .blk-body{color:var(--ink)}
.blk-body{border-radius:12px;padding:12px 15px;font-size:14px;line-height:1.85}
.b-check .blk-body{background:var(--soft-ok);border-left:3px solid var(--ok)}
.b-fix .blk-body{background:var(--soft-fix);border-left:3px solid var(--fix)}
.b-warn .blk-body{background:var(--soft-warn);border-left:3px solid var(--warn)}
.b-note .blk-body{background:var(--surface);border:1px solid var(--line)}
.b-exp .blk-body{background:var(--soft-brand);border-left:3px solid var(--brand2)}
.b-con .blk-body{background:var(--soft-teal);border-left:3px solid var(--teal)}
.blk-body ul{margin:0;padding-left:19px} .blk-body li{margin:3px 0}
.blk-body .en{font-family:var(--en);font-size:15px}
.blk-body em{font-style:normal;color:var(--fix);font-weight:700}
.blk-body strong{color:var(--brand)}
.correction{display:flex;flex-direction:column;gap:7px;margin-top:9px}
.corr-line{display:flex;gap:9px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13.5px}
.corr-line .lbl{flex:0 0 52px;font-weight:800;font-size:12px;padding-top:2px}
.corr-line.bad .lbl{color:var(--fix)} .corr-line.good .lbl{color:var(--ok)}

/* ===== Exercise ===== */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:9px}
.ex-q{font-size:14px;margin-bottom:9px;line-height:1.7}
.ex-q .no{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--soft-brand);color:var(--brand);font-size:11px;font-weight:800;margin-right:7px}
.ex-q .en{font-family:var(--en);font-size:15px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink2);padding:8px 13px;border-radius:9px;font-size:13.5px;transition:.16s;line-height:1.6}
.opt:hover{border-color:var(--brand);background:var(--soft-brand)}
.opt.right{background:var(--soft-ok);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--soft-fix);border-color:var(--fix);color:var(--fix)}
.opt.dim{opacity:.55}
.opt .k{font-weight:800;margin-right:7px}
.ex-e{margin-top:9px;padding:9px 12px;border-radius:9px;background:var(--soft-teal);color:var(--ink2);font-size:13px;line-height:1.75;display:none}
.ex-e.show{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ===== Report / Cheats ===== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
.panel h3{margin:0 0 4px;font-size:18px;font-weight:800}
.panel .lead{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.rev{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:var(--surface2)}
.rev.fix{border-left:4px solid var(--fix)} .rev.warn{border-left:4px solid var(--warn)}
.rev .rh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.rev .rh b{font-size:14.5px}
.rev .rh .pos{font-size:11.5px;background:var(--soft-brand);color:var(--brand);padding:2px 9px;border-radius:999px;font-weight:700}
.rev .rl{display:flex;gap:10px;font-size:13.5px;line-height:1.8;margin:5px 0}
.rev .rl .t{flex:0 0 62px;font-weight:800;font-size:12.5px;padding-top:2px}
.rev .rl.bad .t{color:var(--fix)} .rev .rl.good .t{color:var(--ok)} .rev .rl.why .t{color:var(--brand)}
.rev .rl .c{flex:1}
.rev .rl .c code{font-family:var(--en);font-size:14.5px;background:var(--surface);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
.miss-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.miss{background:var(--soft-brand);border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-size:13.5px}
.miss b{color:var(--brand)}
.cheat-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.ctab{border:1.5px solid var(--line);background:var(--surface2);color:var(--ink2);padding:7px 13px;border-radius:10px;font-size:13px;transition:.18s}
.ctab:hover{border-color:var(--teal)} .ctab.on{background:var(--soft-teal);border-color:var(--teal);color:var(--teal);font-weight:700}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:420px}
th,td{border:1px solid var(--line);padding:9px 12px;text-align:left;line-height:1.7}
th{background:var(--soft-brand);color:var(--brand);font-weight:800;white-space:nowrap}
td:first-child{font-family:var(--en);font-size:14.5px;white-space:nowrap}
tr:nth-child(even) td{background:var(--surface2)}
.tip{margin-top:12px;padding:10px 14px;background:var(--soft-warn);border-left:3px solid var(--warn);border-radius:9px;font-size:13.5px}

/* ===== Quiz ===== */
.quiz-mask{position:fixed;inset:0;background:rgba(13,18,38,.62);backdrop-filter:blur(5px);z-index:50;display:grid;place-items:center;padding:18px}
.quiz-mask.hidden{display:none}
.quiz-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;width:min(620px,100%);max-height:88vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.3);padding:22px}
.quiz-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.quiz-top b{font-size:18px;flex:1}
.quiz-top .p{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.quiz-top .x{border:none;background:var(--surface2);color:var(--muted);width:30px;height:30px;border-radius:9px;font-size:16px}
.qbar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--brand));transition:width .3s}
.q-title{font-size:16px;line-height:1.85;margin-bottom:6px}
.q-src{font-size:12px;color:var(--muted);margin-bottom:14px}
.q-score{text-align:center;padding:14px 0}
.q-score .big{font-size:48px;font-weight:800;color:var(--brand);line-height:1.2}
.q-score .msg{color:var(--muted);font-size:14px;margin-bottom:16px}
.q-wrong{background:var(--soft-fix);border-radius:10px;padding:10px 13px;margin-top:8px;font-size:13px;text-align:left}
.q-actions{display:flex;gap:9px;justify-content:center;margin-top:18px;flex-wrap:wrap}

/* ===== misc ===== */
.empty{text-align:center;padding:60px 20px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty .big{font-size:38px;margin-bottom:8px}
#toTop{position:fixed;right:22px;bottom:22px;width:44px;height:44px;border-radius:14px;border:none;background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;font-size:18px;box-shadow:0 10px 26px rgba(79,70,229,.35);display:none;z-index:20}
.foot{text-align:center;color:var(--muted);font-size:12.5px;padding:26px 0 0}
.hidden{display:none!important}

@media(max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)} .badges{max-width:120px}
  .card-head{padding:14px 14px 12px 16px;gap:10px} .core{padding-left:16px;padding-right:14px}
  .detail{padding:16px 14px} .ttl h3{font-size:19px} .ttl h3.sent{font-size:15.5px}
  .hero{padding:32px 0 76px} .wrap{padding:0 13px 70px}
}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface2:#fff;--ink:#111;--ink2:#222;--muted:#555;--line:#bbb;--shadow:none;--shadow2:none}
  body{font-size:11.5pt;line-height:1.55;background:#fff}
  body::before,.dots,.toolbar,.tabs,.prog,.acts,.hero .pills,#toTop,.foot,.quiz-mask,.ex .opts .opt:hover{display:none!important}
  .hero{background:#fff!important;color:#111;padding:0 0 10px;border-bottom:2px solid #111}
  .hero h1,.hero p.sub,.hero .kicker{color:#111!important;background:none;border:none;padding:0}
  .hero h1 em{color:#111} .hero .kicker{letter-spacing:0}
  .stats{margin-top:12px} .stat{box-shadow:none;border:1px solid #bbb;break-inside:avoid}
  .wrap{max-width:100%;padding:0}
  .detail.collapsed{display:block!important}
  .card{break-inside:avoid;page-break-inside:avoid;box-shadow:none;border:1px solid #bbb;margin-bottom:9px}
  .card::before{display:none} .card:hover{transform:none;box-shadow:none}
  .block{break-inside:avoid} .blk-body{background:#fff!important;border:1px solid #ddd}
  .ex{break-inside:avoid} .ex-e{display:block!important}
  .opt{border:1px solid #ddd;background:#fff}
  .sec-head{margin:12px 0 8px} .panel{box-shadow:none;border:1px solid #bbb}
  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>

<header class="hero">
  <div class="dots" id="dots"></div>
  <div class="wrap">
    <div class="kicker">📘 逐条核对 · 拓展精讲 · 交互练习</div>
    <h1>七年级英语期中 <em>易错知识点</em> 精讲</h1>
    <p class="sub">对孩子整理的笔记逐条检验，标出需要修正与澄清的地方，并补充拓展用法、易混辨析和即时可做的例题。</p>
    <div class="pills">
      <span>鲁教版（五四制）· 七年级上册</span>
      <span>期中复习范围</span>
      <span>92 条考点逐条核对</span>
      <span>可搜索 / 可自测 / 可打印</span>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="toolrow">
      <div class="search"><span class="ico">🔍</span><input id="q" type="search" placeholder="搜索单词、短语、考点……（按 / 快速定位）" autocomplete="off"></div>
      <button class="btn" data-action="expand-all">📂 全部展开</button>
      <button class="btn" data-action="collapse-all">📁 全部折叠</button>

"core":"可数名词，复数 <b>diaries</b>（辅音 + y 变 ies）；固定搭配 <b>keep a diary</b> 写日记。",
"check":"✅ 核对无误：复数变化、keep a diary、与 dairy 的拼写辨析都准确，例句也规范。",
"note":["可数名词，复数 diaries","搭配：keep a diary 写日记","易错点：易与 dairy（奶制品）拼写混淆","例句：She keeps a diary every day."],
"expand":["记忆法：<span class='en'>di<b>a</b>ry</span> 日记里有「a day（一天）」；<span class='en'>d<b>ai</b>ry</span> 奶制品来自「牛奶 dairy products」。","同类 y → ies 的复数：<span class='en'>city → cities</span>、<span class='en'>story → stories</span>、<span class='en'>baby → babies</span>、<span class='en'>country → countries</span>。","<span class='en'>keep a diary in English</span> 用英语记日记；<span class='en'>write in one's diary</span> 写在日记本里。"],
"confuse":"<span class='en'>diary</span> 日记（可数，写的东西/本子）｜ <span class='en'>dairy</span> 奶制品、乳品店。两个词字母完全相同、只换顺序，是拼写题最爱考的一对。",
"ex":[{"q":"Keep a ______ in English, and you'll write better.","o":["dairy","diary","diaries"],"a":1,"e":"句意为「用英语记日记」，且不定冠词 a 后用单数名词；diary 是日记，dairy 是奶制品。"}]},
{"id":"w13","t":"directly","cn":"直接地","s":"ok","tags":["词性","同根词"],

"note":["副词，修饰动词","拓展：direct adj. 直接的；v. 指导","例句：You can go directly to the teacher's office."],
"expand":["同根词一串记：<span class='en'>direct</span>(adj./v.) / <span class='en'>directly</span>(adv.) / <span class='en'>direction</span>(n. 方向) / <span class='en'>director</span>(n. 导演、主任) / <span class='en'>indirect</span>(adj. 间接的)。","反义词 <span class='en'>indirectly</span>；<span class='en'>direct</span> 本身也可作副词「径直」：<span class='en'>go direct to the station</span>。","<span class='en'>in the direction of</span> 朝……方向；<span class='en'>in all directions</span> 四面八方。"],
"confuse":"修饰<strong>名词</strong>用 direct（<span class='en'>a direct answer</span> 直截了当的回答），修饰<strong>动词/整句</strong>用 directly。别与 direction（方向，名词）混淆。",
"ex":[{"q":"Go ______ to the teacher's office; don't wait here.","o":["direct","directly","direction"],"a":1,"e":"修饰动词 go 要用副词 directly；direct 是形容词，direction 是名词「方向」。"}]},
{"id":"w14","t":"leaf","cn":"叶子","s":"ok","tags":["名词复数"],
"core":"可数名词，复数 <b>leaves</b>；部分以 f / fe 结尾的名词变复数时改 f / fe 为 <b>ves</b>。",
"check":"✅ 核对无误：复数形式与规律说明准确，例句 <span class='en'>The leaves turn yellow in autumn.</span> 中 turn + 颜色形容词的用法也正确。",
"note":["可数名词，复数 leaves（f/fe 结尾变 ves）","例句：The leaves turn yellow in autumn."],
"expand":["同类「f / fe → ves」口诀：<strong>小偷(thief)之妻(wife)用刀(knife)和树叶(leaf)结束狼(wolf)的生命(life)，把半(half)个架子(shelf)留给自己(self)</strong> → <span class='en'>thieves, wives, knives, leaves, wolves, lives, halves, shelves, selves</span>。","<strong>但有不变 ves 的例外</strong>（直接加 -s）：<span class='en'>roof → roofs</span>、<span class='en'>chief → chiefs</span>、<span class='en'>belief → beliefs</span>、<span class='en'>safe → safes</span>。考试常拿 roof 设陷阱。","<span class='en'>turn + 颜色</span> 表「变成……颜色」：<span class='en'>The leaves turn yellow / red.</span>"],
"confuse":"<span class='en'>leaf → leaves</span> 是不规则变化；别与动词 <span class='en'>leave</span>（离开、留下）搞混，两者只差一个字母顺序。也别写成 <span class='en'>leafs</span>。",
"ex":[{"q":"In autumn the ______ on the trees turn yellow.","o":["leafs","leaves","leafes"],"a":1,"e":"leaf 以 f 结尾，复数变 f 为 ves：leaves；谓语 turn 用原形也提示主语是复数。"}]},
{"id":"w15","t":"realize","cn":"意识到；实现","s":"warn","tags":["时态","拼写易混"],
"core":"及物动词，后接名词 / 代词 / <b>that 从句</b>；<b>realize one's dream</b> 实现梦想。",
"check":"🟡 释义与搭配无误，但例句时态可以更严谨：<span class='en'>I realized I made a mistake.</span> 中「犯错」发生在「意识到」<strong>之前</strong>，规范写法是过去完成时 <span class='en'>had made</span>。七年级阶段用一般过去时常被接受，但按考试标准建议改。",
"fix":{"bad":"<code>I realized I made a mistake.</code>","good":"<code>I realized (that) I had made a mistake.</code> 或 <code>I realized my mistake.</code>"},
"note":["及物动词，后接名词、代词或 that 从句","搭配：realize one's dream 实现梦想","易错点：易与 recognize（认出）混淆","例句：I realized I made a mistake."],
"expand":["英式拼写 <span class='en'>realise</span>，美式 <span class='en'>realize</span>，同一份卷子保持一致。","同根词：<span class='en'>real</span>(adj. 真的) / <span class='en'>really</span>(adv.) / <span class='en'>reality</span>(n. 现实) / <span class='en'>realization</span>(n. 领悟)。","「实现梦想」三种说法：<span class='en'>realize one's dream</span> = <span class='en'>achieve one's dream</span> = <span class='en'>make one's dream come true</span>。注意 <span class='en'>come true</span> 的主语必须是<strong>梦想本身</strong>，不能说 <span class='en'>come true a dream</span>。"],
"confuse":"<span class='en'>realize</span> 意识到 / 实现 ｜ <span class='en'>recognize</span> 认出（认出某人、某物）。「我意识到错了」用 realize；「我没认出他」用 <span class='en'>I didn't recognize him.</span>",
"ex":[{"q":"I didn't ______ that I had left my book at home.","o":["recognize","realize","remember"],"a":1,"e":"「没有意识到」用 realize + that 从句；recognize 是「认出（人或物）」，remember 是「记得」，都不合句意。"},{"q":"Which is the better sentence?","o":["I realized I made a mistake.","I realized that I had made a mistake.","I realize I make a mistake yesterday."],"a":1,"e":"「犯错」先于「意识到」，先发生的动作用过去完成时 had made；选项 C 时间词 yesterday 与一般现在时冲突。"}]},
{"id":"w16","t":"mean / meaning / meaningful / meaningless","cn":"意思是 / 含义 / 有意义的 / 无意义的","s":"ok","tags":["同根词","to do / doing"],
"core":"<b>mean to do</b> 打算做；<b>mean doing</b> 意味着；<em>过去式 / 过去分词是 meant</em>（不规则）。",
"check":"✅ 词族、两个句型和例句都准确。<strong>补一个笔记漏掉的高频失分点</strong>：mean 的过去式是 <span class='en'>meant</span>，不是 <span class='en'>meaned</span>。",
"note":["mean v. 意思是；意味着","mean to do 打算做；mean doing 意味着","meaning n.；meaningful adj.；meaningless adj.","例句：What does this word mean? / It's a meaningful book."],
"expand":["三个同义问句：<span class='en'>What does this word mean?</span> = <span class='en'>What's the meaning of this word?</span> = <span class='en'>What do you mean by this word?</span>","不规则变形：<span class='en'>mean — meant — meant</span>；<span class='en'>I meant to call you, but I forgot.</span> 我本打算给你打电话。","后缀成对记：<span class='en'>careful / careless</span>、<span class='en'>hopeful / hopeless</span>、<span class='en'>useful / useless</span>、<span class='en'>helpful / helpless</span>、<span class='en'>meaningful / meaningless</span>。-ful 表「充满」，-less 表「没有」。","mean 还可作形容词「吝啬的、刻薄的」：<span class='en'>Don't be mean to others.</span>"],
"confuse":"<span class='en'>mean to do</span>（主语是人，打算做）vs <span class='en'>mean doing</span>（主语常是事，意味着）：<span class='en'>Missing the bus means waiting another hour.</span> 错过公交意味着要再等一小时。",
"ex":[{"q":"I ______ to call you yesterday, but I forgot.","o":["mean","meant","am meaning"],"a":1,"e":"yesterday 要求过去时，mean 的过去式是不规则的 meant，不能写 meaned。"},{"q":"Missing the bus means ______ for another hour.","o":["to wait","waiting","wait"],"a":1,"e":"mean doing 表示「意味着……」，主语 Missing the bus 是事情；mean to do 则表「某人打算做」。"}]},
{"id":"w17","t":"dirty","cn":"脏的","s":"ok","tags":["形容词","比较级"],
"core":"adj. 脏的 / v. 弄脏；反义词 <b>clean</b>；比较级 <b>dirtier</b>、最高级 <b>dirtiest</b>。",
"check":"✅ 核对无误：词性、反义词与例句都正确。补充一条变形规律，考试常考。",
"note":["形容词 / 动词","反义词：clean 干净的","例句：Your hands are dirty. Go and wash them."],
"expand":["以「辅音字母 + y」结尾的形容词，变比较级 / 最高级要 <strong>把 y 变 i</strong>：<span class='en'>dirty → dirtier → dirtiest</span>，同类 <span class='en'>easy → easier</span>、<span class='en'>happy → happier</span>、<span class='en'>early → earlier</span>。","名词 <span class='en'>dirt</span> 污物、灰尘（不可数）；动词 <span class='en'>dirty</span> 弄脏：<span class='en'>Don't dirty your new coat.</span>","近义辨析：<span class='en'>clean</span> 干净的（对应 dirty），<span class='en'>tidy</span> 整洁的（强调整齐，反义 untidy）。"],
"confuse":"<span class='en'>dirtier</span> 别写成 <span class='en'>dirtyer</span>；注意对比 <span class='en'>sad → sadder</span>（重读闭音节双写 d），两条规则不同：一个是 y 变 i，一个是双写末尾辅音。",
"ex":[{"q":"Your hands are even ______ than mine. Go and wash them.","o":["dirty","dirtier","dirtiest"],"a":1,"e":"than 提示用比较级；dirty 以辅音 + y 结尾，变 y 为 i 再加 -er → dirtier。"}]},
{"id":"w18","t":"temperature","cn":"温度；气温","s":"warn","tags":["可数性","固定搭配"],
"core":"问温度用 <b>What's the temperature?</b>；高低用 <b>high / low</b>；<b>take one's temperature</b> 量体温。",
"check":"🟡 「不可数名词」这个标注<strong>过于绝对</strong>，容易把孩子带偏。泛指「气温」时确实常用单数、不加冠词（<span class='en'>The temperature is low.</span>），但在 <span class='en'>take one's temperature</span>、<span class='en'>have a temperature</span>（发烧）、<span class='en'>a temperature of 30℃</span> 里是可数名词，也可以说 <span class='en'>high temperatures</span>。",
"fix":{"bad":"不可数名词","good":"泛指气温时常用单数、不加冠词；<code>take one's temperature</code>、<code>have a temperature</code>、<code>a temperature of 30℃</code> 等搭配中作可数名词。"},
"note":["用法：不可数名词","搭配：take one's temperature 量体温；below zero 零度以下","例句：The temperature is very low today."],
"expand":["<strong>问句与描述词（高频）</strong>：问温度用 <span class='en'>What's the temperature?</span>（不用 How much）；描述温度<strong>高 / 低</strong>用 <span class='en'>high / low</span>（不用 big / small）；<span class='en'>hot / cold</span> 是形容<strong>天气</strong>，不形容 temperature。","拼写关：<span class='en'>tem-per-a-ture</span>，中间那个 a 最容易漏，别写成 <span class='en'>temprature / temperture</span>。","温度相关：<span class='en'>below zero</span> 零度以下 / <span class='en'>above zero</span> 零度以上 / <span class='en'>below freezing</span> 冰点以下 / <span class='en'>degree(s) centigrade</span> 摄氏度。","英式口语 <span class='en'>have a temperature</span> = 发烧（=<span class='en'>have a fever</span>）。"],
"confuse":"<span class='en'>The temperature is very <strong>low</strong> today.</span> ✓（不说 very cold / very small）；<span class='en'>It's very <strong>cold</strong> today.</span> ✓（主语是天气 it）。主语是 temperature 用 high/low，主语是天气用 hot/cold。",
"ex":[{"q":"— ______ the temperature today? — It's about 30℃.","o":["How much is","What's","How many is"],"a":1,"e":"问温度固定用 What's the temperature?；temperature 不是价格或数量，不用 How much / How many。"},{"q":"The nurse ______ my temperature and said I had a fever.","o":["took","made","did"],"a":0,"e":"「量体温」是固定搭配 take one's temperature；这里 temperature 前有 my，是可数用法的典型例子。"}]},
{"id":"w19","t":"sad / sadness","cn":"难过的 / 悲伤","s":"ok","tags":["词缀","词性"],

"note":["sad adj. 难过的；伤心的","sadness n. 悲伤；难过","拓展：sadly adv. 伤心地；-ness 是常见名词后缀","例句：She felt sad when she heard the bad news."],
"expand":["变形：<span class='en'>sad → sadder → saddest</span>（重读闭音节，双写 d）；<span class='en'>sadly</span> 副词。","-ness 名词后缀一串记：<span class='en'>happy → happiness</span>、<span class='en'>kind → kindness</span>、<span class='en'>ill → illness</span>、<span class='en'>dark → darkness</span>、<span class='en'>careless → carelessness</span>。","<span class='en'>sadly</span> 也可置于句首修饰整句：<span class='en'>Sadly, he failed the exam.</span> 遗憾的是，他没考及格。","<span class='en'>feel + adj.</span> 系表结构：<span class='en'>She felt sad.</span> 不能说 <span class='en'>She felt sadly.</span>"],

"ex":[{"q":"To my ______, the little dog died last night.","o":["sad","sadly","sadness"],"a":2,"e":"to one's 后面接情感名词，sadness 是名词；sad 是形容词，sadly 是副词。"}]}

,{"id":"w20","t":"amazing","cn":"令人惊叹的；惊人的","s":"ok","tags":["-ing / -ed"],

{"id":"w21","t":"experience","cn":"经历；经验","s":"ok","tags":["可数性"],

"check":"✅ 核对无误：可数性差异是这条的核心，两条例句分别对应两种含义，选得很准。",
"note":["表「经历」时可数；表「经验」时不可数","易错点：七年级高频考点，注意可数性差异","例句（经历）：It was a terrible experience.","例句（经验）：He has much teaching experience."],
"expand":["修饰词是判断线索：可数用 <span class='en'>a / an / many / a few</span>，不可数用 <span class='en'>much / a lot of / a little</span>，且<strong>不加 s</strong>。<span class='en'>much teaching experience ✓</span>，<span class='en'>many teaching experiences ✗</span>（此处指经验）。","也可作动词「经历、体验」：<span class='en'>We experienced a cold winter.</span>","形容词 <span class='en'>experienced</span> 有经验的：<span class='en'>an experienced teacher</span> 一位经验丰富的老师。"],
"confuse":"<span class='en'>experience</span> 与 <span class='en'>experiment</span>（实验）拼写接近；另外「经验」不可数，与 <span class='en'>progress / homework / information / advice / news</span> 同属不可数名词家族，都不能加 a / -s。",

{"id":"w22","t":"explain","cn":"解释；说明","s":"ok","tags":["双宾语"],

"expand":["<strong>同类「不能接双宾语」的动词</strong>（都要借介词 to）：<span class='en'>explain sth. to sb.</span>、<span class='en'>describe sth. to sb.</span>、<span class='en'>introduce sth. to sb.</span>、<span class='en'>say sth. to sb.</span>、<span class='en'>suggest sth. to sb.</span>、<span class='en'>report sth. to sb.</span>","对比<strong>可以接双宾语</strong>的动词：<span class='en'>give / tell / show / teach / buy / send sb. sth.</span>（= sth. to / for sb.）。","名词 <span class='en'>explanation</span> 解释——注意拼写去掉了 i：<span class='en'>explain → explanation</span>，别写成 explaination。","也可接从句：<span class='en'>explain that...</span> / <span class='en'>explain why...</span>"],

"ex":[{"q":"Which sentence is RIGHT?","o":["Can you explain me this word?","Can you explain this word to me?","Can you explain this word me?"],"a":1,"e":"explain 不能接双宾语，必须用 explain sth. to sb.；物在前、人在后，介词 to 不能省。"}]},
{"id":"w23","t":"freezing / frozen","cn":"极冷的 / 冻住的","s":"ok","tags":["词义辨析"],
"core":"<b>freezing</b> 极冷的（天气、体感）／<b>frozen</b> 冻住、结冰的（物体）。",
"check":"✅ 核对无误：两条例句把两个词的区别演示得很清楚。",
"note":["freezing adj. 极冷的；冰冻的（修饰天气、体感）","frozen adj. 冻住的；结冰的（修饰物体）","例句：It's freezing outside today. / The lake is frozen in winter."],
"expand":["动词 <span class='en'>freeze</span> 的不规则变形：<span class='en'>freeze — froze — frozen — freezing</span>（不是 freezed）。第三部分第 12 句 <span class='en'>If the temperature drops below zero, the water will freeze.</span> 用了原形。","<span class='en'>frozen food</span> 冷冻食品、<span class='en'>freezing cold</span> 极冷、<span class='en'>I'm freezing!</span> 我快冻僵了、<span class='en'>freezer</span> 冷冻室。","<span class='en'>below freezing</span> = <span class='en'>below zero</span> 零度以下。"],
"confuse":"<span class='en'>It's freezing.</span>（天气 / 我觉得冷）vs <span class='en'>The river is frozen.</span>（河面结冰了）。一个说「冷的程度」，一个说「物体被冻住的状态」。",
"ex":[{"q":"It's ______ outside; the lake is ______.","o":["frozen; freezing","freezing; frozen","freezing; freezing"],"a":1,"e":"前半句说天气极冷用 freezing，后半句说湖面结冰的状态用 frozen。"}]},
{"id":"w24","t":"certainly","cn":"当然；无疑","s":"ok","tags":["口语应答"],
"core":"副词，常用于口语应答，相当于 <b>sure / of course</b>；adj. <b>certain</b> 确定的。",
"check":"✅ 核对无误：用法与对话例句都正确。",
"note":["副词，常用于口语应答，相当于 sure / of course","例句：—Can I use your pen? —Certainly."],
"expand":["同根词：<span class='en'>certain</span>(adj. 确定的) / <span class='en'>certainly</span>(adv.) / <span class='en'>uncertain</span>(adj. 不确定的)。","<span class='en'>be certain to do</span> 一定会…… / <span class='en'>be certain that...</span> 确信……；<span class='en'>I'm not certain.</span> 我不确定。","否定应答 <span class='en'>Certainly not.</span> 当然不行；位置通常在 be 动词 / 助动词之后、实义动词之前：<span class='en'>He will certainly come.</span>"],
"confuse":"<span class='en'>Certainly.</span> / <span class='en'>Sure.</span> / <span class='en'>Of course.</span> 都可回答「可以吗」，语气依次更肯定；回答感谢要用 <span class='en'>You're welcome.</span> 而不是 Certainly。",
"ex":[{"q":"—Could you help me with the box? —______","o":["Certainly","Never mind","You're welcome"],"a":0,"e":"对请求作肯定应答用 Certainly（=Sure / Of course）；Never mind 用于「没关系」，You're welcome 用于回应感谢。"}]},
{"id":"w25","t":"true / truth / truly","cn":"真的 / 真相 / 真正地","s":"ok","tags":["词族","拼写"],
"core":"adj. <b>true</b> / n. <b>truth</b> / adv. <b>truly</b>；<em>没有 truthly 这个词</em>。",
"check":"✅ 核对无误：词族、例句与「不存在 truthly」的提醒都正确，这是拼写题的高频陷阱。",
"note":["true adj. 真实的；真的","truth n. 真相；事实","truly adv. 真正地；真诚地","易错点：不存在 truthly 这个单词，正确拼写是 truly","例句：It's a true story. / Please tell me the truth."],
"expand":["构词：<span class='en'>true → truly</span>（去 e 加 -ly）、<span class='en'>truth → truthful</span>（adj. 诚实的）。同类去 e 加 ly：<span class='en'>possible → possibly</span>、<span class='en'>gentle → gently</span>。","<span class='en'>come true</span> 实现，主语必须是梦想 / 愿望：<span class='en'>My dream came true.</span>（不能说 <span class='en'>I came true my dream</span>）。","<span class='en'>to tell (you) the truth</span> 说实话；<span class='en'>tell the truth</span> 讲真话（对应 <span class='en'>tell a lie</span> 撒谎）。"],
"confuse":"<span class='en'>true</span> 强调「符合事实、不是假的」（a true story 真实故事）；<span class='en'>real</span> 强调「真实存在、不是仿造的」（a real diamond 真钻石）。另外别把 <span class='en'>truly</span> 写成 <span class='en'>truely / truthly</span>。",
"ex":[{"q":"Please tell me the ______. I'm ______ sorry about it.","o":["true; truly","truth; truly","truth; truthly"],"a":1,"e":"第一空在 the 后要名词 truth；第二空修饰形容词 sorry 要副词 truly，且不存在 truthly 这个拼写。"}]},
{"id":"w26","t":"other / others / another","cn":"其他的 / 其他人 / 另一个","s":"warn","tags":["代词辨析","句子标点"],
"core":"<b>other</b> + 复数名词；<b>others</b> 后不接名词；<b>another</b> + 单数名词 / <b>another + 数词 + 复数名词</b>；<b>the other</b> 两者中的另一个。",
"check":"🟡 词义与用法说明基本准确。两点补充：① another 更准确的说法是「不定数目中的再一个 / 另一个」，与「两者中的另一个 the other」相对；② 例句 <span class='en'>Some students are reading, others are writing.</span> 用逗号连接两个完整句子，属于逗号拼接（comma splice），书面考试里建议改成分号、句号或加 and。",
"fix":{"bad":"<code>Some students are reading, others are writing.</code>","good":"<code>Some students are reading and others are writing.</code> 或用分号 / 句号分成两句。"},
"note":["other adj. 其他的，后接复数名词","others pron. 其他的人/物，后不接名词","another adj./pron.（三者及以上中的）另一个；也可 another + 数词 + 名词","拓展：the other 特指两者中的另一个；the others 特指剩余的全部","例句：Some students are reading, others are writing. / Give me another apple, please."],
"expand":["<strong>固定对照句型</strong>：<span class='en'>one... the other...</span>（两者：一个……另一个……）；<span class='en'>some... others...</span>（一些……另一些……）；<span class='en'>some... the others...</span>（一些……其余全部……）。","<span class='en'>another two apples</span> = <span class='en'>two more apples</span> 再来两个苹果；<span class='en'>another + 数词 + 复数名词</span> 是常考结构。","<span class='en'>each other</span> 互相（见短语第 9 条），不能作主语；<span class='en'>the other day</span> 几天前（<strong>过去时</strong>！别与 some day 混）。","<span class='en'>others</span> 泛指「别人」，<span class='en'>the others</span> 特指某一范围里「剩下的全部」，范围明确时才能用 the。"],
"confuse":"<span class='en'>other</span> 后面<strong>必须</strong>跟名词，<span class='en'>others</span> 后面<strong>不能</strong>跟名词：<span class='en'>other students ✓ / others students ✗ / other students = others ✓</span>。判断看空格后面有没有名词。",
"ex":[{"q":"Some students are reading, and ______ are writing.","o":["other","others","another"],"a":1,"e":"空格后没有名词，需要能单独作主语的代词 others；other 后必须接名词，another 表单数。"},{"q":"I have two pens. One is red; ______ is blue.","o":["another","the other","others"],"a":1,"e":"明确是「两支笔」这个范围，两者中的另一个用 the other；another 用于不定数目中的再一个。"}]},
{"id":"w27","t":"a few / few / a little / little","cn":"几个 / 几乎没有 / 一点儿 / 几乎没有","s":"ok","tags":["数量词","可数性"],
"core":"<b>a few / few</b> + 可数名词复数；<b>a little / little</b> + 不可数名词；带 <b>a</b> 表肯定，不带 <b>a</b> 表否定。",
"check":"✅ 核对无误：四个词的搭配与肯定 / 否定含义全部正确，两条例句也很典型。",
"note":["a few 一些；几个（+可数名词复数，肯定）","few 几乎没有（+可数名词复数，否定）","a little 一点儿（+不可数名词，肯定）","little 几乎没有（+不可数名词，否定）","例句：There are a few books... / There is little milk..."],
"expand":["<strong>高频陷阱：quite a few = 很多</strong>（不是「很少」），后接可数复数：<span class='en'>Quite a few students joined the club.</span> 相当多学生参加了社团。同理 <span class='en'>only a few / very few</span> 才是「很少」。","<span class='en'>a little</span> 还可作副词修饰形容词或比较级：<span class='en'>a little tired</span> 有点累、<span class='en'>a little bigger</span> 大一点点。","比较级：<span class='en'>few → fewer → fewest</span>（修饰可数）、<span class='en'>little → less → least</span>（修饰不可数）。第三部分第 16 句 <span class='en'>less homework</span> 就是 little 的比较级。","<span class='en'>a bit of + 不可数名词</span> = a little + 不可数名词。"],
"confuse":"两步判断：<strong>先看名词可不可数</strong>（决定 few / little），<strong>再看语气肯不肯</strong>（决定加不加 a）。<span class='en'>There is little milk.</span> 意思是「几乎没牛奶了」（否定），不是「有一点」。",
"ex":[{"q":"There is ______ milk in the bottle. Let's buy some.","o":["a little","little","a few"],"a":1,"e":"后句「去买一些」说明几乎没了，是否定含义；milk 不可数，用 little。a little 表「还有一点」，与语境矛盾。"},{"q":"Quite ______ students took part in the sports meeting.","o":["a few","few","a little"],"a":0,"e":"quite a few 是固定表达，意为「相当多」，后接可数名词复数 students；few 单独用表否定，不能与 quite 搭配。"}]},
{"id":"w28","t":"see","cn":"看见；明白","s":"ok","tags":["感官动词","被动语态"],
"core":"saw / seen；<b>see sb. do</b> 看见全过程 / 经常做；<b>see sb. doing</b> 看见正在做；被动语态中要<strong>还原 to</strong>。",
"check":"✅ 核对无误：变形、两个宾语补足语结构、被动还原 to、两条例句都准确。这是七上最难也最常考的动词句型之一。",
"note":["变形：saw（过去式）；seen（过去分词）","see sb. do sth. 看见某人做某事（全过程/经常）","see sb. doing sth. 看见某人正在做某事","易错点：被动语态中要还原 to：sb. be seen to do","例句：I saw her cross the street. / I saw her dancing in the room."],
"expand":["<strong>同类感官动词</strong>都适用 do / doing 的区别：<span class='en'>hear, watch, notice, feel, listen to, look at</span>。第三部分第 29 句 <span class='en'>heard two hunters discussing...</span> 就是 hear sb. doing。","被动还原 to <strong>只针对 do 形式</strong>：<span class='en'>He was seen to cross the street.</span>；doing 形式变被动时保持 -ing：<span class='en'>He was seen crossing the street.</span>","see 还有「明白」义：<span class='en'>I see.</span> 我明白了；<span class='en'>Let me see.</span> 让我想想；<span class='en'>see a doctor</span> 看医生；<span class='en'>see sb. off</span> 为某人送行。"],
"confuse":"<span class='en'>see sb. do</span> 强调「看到动作从头到尾 / 经常性」；<span class='en'>see sb. doing</span> 强调「撞见那一刻正在进行」。看到 <span class='en'>when I passed by / at that moment / Listen!</span> 这类提示，优先用 doing。",
"ex":[{"q":"When I passed the room, I saw her ______ a letter.","o":["write","writing","to write"],"a":1,"e":"「我经过房间时」强调那一刻正在进行的动作，用 see sb. doing；write 表全过程，to write 不能作 see 的宾补（被动才还原 to）。"},{"q":"He was seen ______ the street by a policeman.","o":["cross","to cross","crossing"],"a":1,"e":"感官动词 see 用于被动语态时，宾补的不带 to 不定式必须还原成 to do：be seen to do。"}]}
]},

{"id":"p1","t":"make a promise","cn":"许下诺言","s":"ok","tags":["固定搭配"],
"core":"<b>make a promise</b> 许诺；<b>make a promise to sb.</b> 向某人许诺；<b>make a promise to do sth.</b> 许诺做某事。",
"check":"✅ 核对无误：三个结构和 keep / break 的拓展都准确，例句也规范。",
"note":["固定动宾短语","搭配：make a promise to sb.；make a promise to do sth.","拓展：keep a promise 遵守诺言；break a promise 违背诺言","例句：He made a promise to study harder."],
"expand":["也可接从句：<span class='en'>He made a promise that he would study harder.</span>","三件套对照：<span class='en'>make</span>（许下）→ <span class='en'>keep</span>（遵守）→ <span class='en'>break</span>（违背）。呼应单词第 11 条 promise 与易错句第 6 句。","注意 <span class='en'>promise sb. to do</span> 是错误结构，但 <span class='en'>make a promise to do</span> 是对的——后者 to do 修饰 promise，不是「sb. + to do」。"],
"confuse":"<span class='en'>make a promise to <strong>sb.</strong></span>（介词 to + 人）与 <span class='en'>make a promise to <strong>do</strong></span>（不定式 to + 动词原形）形似而功能不同，看 to 后面跟的是人还是动词。",
"ex":[{"q":"If you ______ a promise, you must keep it.","o":["make","do","take"],"a":0,"e":"「许下诺言」固定用 make a promise；keep a promise 是遵守，break a promise 是违背，动词不能随意替换。"}]},
{"id":"p2","t":"instead of","cn":"代替；而不是","s":"ok","tags":["介词短语","instead"],
"core":"<b>instead of</b> 是介词短语，后接名词 / 代词 / <b>动名词 doing</b>；<b>instead</b> 是副词，单独使用。",
"check":"✅ 核对无误：词性、后接成分、与 instead 的辨析、两条例句都正确。",
"note":["介词短语，后接名词、代词或动名词 doing","辨析：instead 是副词，单独使用，放句首或句末","例句：I will go to the meeting instead of you. / He stayed at home instead."],
"expand":["<strong>最常考的一句</strong>：<span class='en'>instead of + doing</span>，不能接 to do：<span class='en'>He stayed at home instead of going out.</span>","instead 放句首时常用逗号隔开：<span class='en'>Instead, he stayed at home.</span>","同义表达 <span class='en'>rather than</span>（而不是），后面常接并列成分：<span class='en'>I'd like tea rather than coffee.</span>","句型转换练习：<span class='en'>He didn't go out. He stayed at home instead.</span> = <span class='en'>He stayed at home instead of going out.</span>"],
"confuse":"<span class='en'>instead of</span> 后面<strong>必须带宾语</strong>；<span class='en'>instead</span> 后面<strong>不接宾语</strong>。空后面有名词 / doing 就用 instead of，空在句末且后面没东西就用 instead。",
"ex":[{"q":"He played computer games ______ doing his homework.","o":["instead","instead of","instead to"],"a":1,"e":"空格后有动名词 doing his homework，需要能带宾语的介词短语 instead of；instead 是副词，后面不能接宾语。"}]},
{"id":"p3","t":"succeed in doing sth.","cn":"成功做成某事","s":"fix","tags":["固定搭配","已修正"],
"core":"固定搭配 <b>succeed in doing sth.</b>，介词 <b>in 不能省略</b>；<em>没有 succeed to do sth.</em>；success / successful / successfully。",
"check":"🔴 <strong>笔记这里写错了一处</strong>：原文标注「in 可省略」。标准搭配中 <span class='en'>succeed in doing sth.</span> 的 in 是介词，<strong>不能省</strong>；考试中写 <span class='en'>succeed doing sth.</span> 会判错。另外 <span class='en'>succeed to sth.</span> 是「继承（王位 / 财产）」，意思完全不同，不能混淆。笔记对「不能说 succeed to do sth.」的判断是正确的。<strong>补充一层</strong>：极随意的口语里偶尔能听到省略 in 的说法，但书面语、作文和考试一律要带 in，复习时按「不可省」记最稳妥。",
"fix":{"bad":"用法：固定搭配，<code>in 可省略</code>","good":"用法：固定搭配 <code>succeed in doing sth.</code>，<code>in 不可省略</code>；后不能接不定式。"},
"note":["用法：固定搭配，in 可省略 ←（此处有误）","拓展：success n. 成功；successful adj. 成功的","易错点：不能说 succeed to do sth.","例句：He succeeded in working out the math problem."],
"expand":["词族完整版：<span class='en'>succeed</span>(v.) → <span class='en'>success</span>(n.) → <span class='en'>successful</span>(adj.) → <span class='en'>successfully</span>(adv.)。注意拼写 <span class='en'>suc<b>ceed</b></span> / <span class='en'>suc<b>cess</b></span>。","<span class='en'>success</span> 泛指成功时不可数，但表「一件成功的事 / 一个成功的人」可数：<span class='en'>The show was a great success.</span>","反义：<span class='en'>fail to do sth.</span> 未能做成 / <span class='en'>fail (in) doing</span>；<span class='en'>failure</span>(n.)。","<span class='en'>be successful in doing</span> = <span class='en'>succeed in doing</span>；第三部分第 26 句正是 <span class='en'>succeeded in climbing...</span>"],
"confuse":"<span class='en'>succeed <strong>in</strong> doing ✓</span> ／ <span class='en'>succeed doing ✗</span> ／ <span class='en'>succeed to do ✗</span> ／ <span class='en'>succeed to the throne</span> 继承王位（另一义）。对比 <span class='en'>manage to do</span> 设法做成（后接 to do），别混。",
"ex":[{"q":"At last he succeeded ______ out the math problem.","o":["in working","to work","working"],"a":0,"e":"succeed 后必须接 in + 动名词；不能接不定式，也不能省略 in。选 C 正是笔记原表述容易诱导出的错误答案。"},{"q":"The show was a great ______.","o":["success","succeed","successful"],"a":0,"e":"a great 后接名词；success 表「一件成功的事」时可数。succeed 是动词，successful 是形容词。"}]},
{"id":"p4","t":"all over","cn":"到处；遍及","s":"ok","tags":["介词短语"],
"core":"<b>all over + 地点名词</b> 遍及……；也可单独作副词「到处、全身」。",
"check":"✅ 核对无误：用法与例句正确。提示：短语第 18 条 <span class='en'>all over the city</span> 与这条是同一结构，可以合并记忆。",
"note":["后接地点名词","拓展：all over the world 全世界","例句：There are trees all over the mountain."],
"expand":["常见组合：<span class='en'>all over the world / country / city / mountain</span>。","单独作副词：<span class='en'>He was wet all over.</span> 他全身湿透了；<span class='en'>I looked all over for my key.</span> 我到处找钥匙。","<span class='en'>all over again</span> 重新再来；<span class='en'>be all over</span> 结束了。"],
"confuse":"<span class='en'>all over + 地点</span> 表「遍及某范围」，与 <span class='en'>everywhere</span>（到处，副词，前面不加 in / at）区分：<span class='en'>He looked everywhere.</span> 见易错句第 24 句。",
"ex":[{"q":"English is spoken ______ the world.","o":["all over","all of","over all"],"a":0,"e":"「遍及全世界」固定说 all over the world；all of / over all 都不能表达这个意思。"}]},
{"id":"p5","t":"hope to do sth.","cn":"希望做某事","s":"ok","tags":["动词句型"],
"core":"<b>hope to do</b> / <b>hope + that 从句</b>；<em>没有 hope sb. to do sth.</em>",
"check":"✅ 核对无误：「不存在 hope sb. to do sth.」是高频考点，笔记抓得很准；例句正确。",
"note":["hope 后可接 to do 或 that 从句","易错点：不存在 hope sb. to do sth. 结构（高频考点）","例句：I hope to visit Beijing someday."],
"expand":["想带「人」要改成从句：<span class='en'>✗ I hope you to come.</span> → <span class='en'>✓ I hope (that) you will come.</span>","<span class='en'>hope for sth.</span> 期待某事：<span class='en'>We are hoping for good weather.</span>；<span class='en'>I hope so. / I hope not.</span> 希望如此 / 希望不是。","<span class='en'>wish</span> 与 hope 不同：<span class='en'>wish sb. to do ✓</span>、<span class='en'>wish sb. sth.</span>（祝愿）、<span class='en'>wish + 虚拟语气</span>（但愿，难实现）。","hope 后不接动名词：<span class='en'>hope doing ✗</span>。"],
"confuse":"<span class='en'>hope to do</span> 主语自己做；<span class='en'>hope that sb. will...</span> 希望别人做。<span class='en'>wish sb. to do</span> 可以带人，<span class='en'>hope sb. to do</span> 不行，这是选择题最爱设的陷阱。",
"ex":[{"q":"Which sentence is RIGHT?","o":["I hope you to pass the exam.","I hope that you will pass the exam.","I hope you passing the exam."],"a":1,"e":"hope 不能接「sb. + to do」，也不接动名词；要表达希望别人做某事，必须用 that 从句。"}]},
{"id":"p6","t":"walk on","cn":"继续走；在……上面走","s":"ok","tags":["on 的词性"],
"core":"<b>on</b> 作副词时表「继续」，作介词时表「在……之上」——靠语境判断。",
"check":"✅ 核对无误：两种词性的说明与例句都正确。",
"note":["on 作副词时表「继续」；作介词时表「在……之上」","例句：Walk on, and you'll find the hospital."],
"expand":["<strong>on 作副词「继续」的动词家族</strong>：<span class='en'>go on</span> 继续、<span class='en'>move on</span> 继续前进、<span class='en'>carry on</span> 继续、<span class='en'>keep on doing</span> 持续做、<span class='en'>read on</span> 继续读下去。","on 作介词：<span class='en'>walk on the grass</span> 在草地上走；<span class='en'>on the table</span> 在桌上。","祈使句 + and + 陈述句是高频句型：<span class='en'>Walk on, and you'll find the hospital.</span> = <span class='en'>If you walk on, you'll find the hospital.</span>"],
"confuse":"<span class='en'>Walk on.</span>（继续走，on 是副词，后面无宾语）vs <span class='en'>Walk on the road.</span>（在马路上走，on 是介词，后面有地点）。看 on 后面有没有名词最直接。",
"ex":[{"q":"______ on, and you will see the park at the end of the road.","o":["Walking","Walk","To walk"],"a":1,"e":"「祈使句 + and + 将来时」结构，句首用动词原形 Walk；这里 on 是副词，意为「继续」。"}]},
{"id":"p7","t":"walk along","cn":"沿着……走","s":"ok","tags":["介词"],
"core":"<b>along</b> 是介词，后接道路、河流等<strong>线状</strong>地点。",
"check":"✅ 核对无误：词性说明与例句都正确。",
"note":["along 为介词，后接道路、河流等线状地点","例句：Walk along the road, and you can see the park."],
"expand":["同义表达：<span class='en'>walk along = go along = go down / walk down + 道路</span>。","along 也可作副词「一起、向前」：<span class='en'>Come along with us.</span> 跟我们一起走吧。","易混短语：<span class='en'>along with</span> 与……一起、<span class='en'>get along (well) with sb.</span> 与某人相处（融洽）、<span class='en'>all along</span> 一直。"],
"confuse":"<span class='en'>walk along the road</span>（沿路走，线状）vs <span class='en'>walk across the road</span>（横穿马路）vs <span class='en'>walk through the forest</span>（穿过森林，立体空间）。三个介词考看图说话时经常一起出现。",
"ex":[{"q":"______ along this street, and you'll find the bank on your left.","o":["Walk","Walking","To walk"],"a":0,"e":"祈使句句首用动词原形；along this street 表示「沿着这条街」。"}]},
{"id":"p8","t":"lie to sb.","cn":"对某人撒谎；欺骗某人","s":"ok","tags":["不规则动词","词义辨析"],
"core":"lie 作「撒谎」时是规则动词：<b>lied / lied / lying</b>；<b>tell a lie / tell lies</b> 撒谎。",
"check":"✅ 核对无误：过去式 lied 的判断准确，与 cheat 的辨析也到位。<strong>建议把 lie / lay 的变形表补进笔记</strong>——易错句第 23 句正好考了 laid。",
"note":["lie 此处为动词「撒谎」，过去式 lied","辨析：cheat sb. 多指骗取财物、作弊","例句：Don't lie to your parents."],
"expand":["<strong>lie / lay 变形总表（务必背）</strong>：<span class='en'>lie(撒谎) — lied — lied — lying</span>；<span class='en'>lie(躺/位于) — lay — lain — lying</span>；<span class='en'>lay(下蛋/放置) — laid — laid — laying</span>。速记卡里有完整表格。","相关词：<span class='en'>liar</span> 骗子、<span class='en'>tell a lie / tell lies</span> 撒谎、<span class='en'>lie down</span> 躺下。","<span class='en'>cheat sb. (out) of sth.</span> 骗走某人某物、<span class='en'>cheat in the exam</span> 考试作弊；cheat 也可作名词「骗子」。","注意 <span class='en'>lying</span> 既是「撒谎」的动名词也是「躺」的现在分词，易错句第 17 句 <span class='en'>by lying to others</span> 是前者。"],
"confuse":"<span class='en'>lie to sb.</span> 对某人说谎（说话内容不实）；<span class='en'>cheat sb.</span> 欺骗 / 骗取（多涉及财物、作弊）；<span class='en'>lie in / lie on</span> 则是「位于 / 躺在」。三个 lie 一定要靠搭配区分。",
"ex":[{"q":"He ______ to his parents about the exam result yesterday.","o":["lay","lied","lain"],"a":1,"e":"「撒谎」的 lie 是规则动词，过去式 lied；lay 是「躺」的过去式或「放置」的原形，lain 是「躺」的过去分词。"},{"q":"Don't tell ______. We all know the truth.","o":["a lie","lie","lies'"],"a":0,"e":"「撒谎」的固定说法是 tell a lie 或 tell lies；lie 作名词「谎言」时可数，单数前要加 a。"}]},
{"id":"p9","t":"look at each other","cn":"相互看看；彼此看着","s":"ok","tags":["相互代词"],
"core":"<b>each other</b> 互相，作宾语；<b>one another</b> 彼此，初中阶段基本通用。",
"check":"✅ 核对无误：用法、拓展与例句都正确。",
"note":["each other 互相，作宾语","拓展：one another 彼此，初中阶段基本通用","例句：They looked at each other and laughed."],
"expand":["所有格形式 <span class='en'>each other's</span>：<span class='en'>They borrowed each other's books.</span> 他们互借了对方的书。","<strong>each other 不能作主语</strong>（易错）：要说 <span class='en'>They help each other.</span> 不能说 <span class='en'>Each other help them.</span>","严格说 each other 多用于两者之间，one another 多用于三者以上，但初中阶段不作硬性区分。","与反身代词区分：<span class='en'>They looked at themselves.</span>（他们看自己）vs <span class='en'>They looked at each other.</span>（他们互相看）。"],
"confuse":"<span class='en'>each other</span> 表「彼此互动」，<span class='en'>themselves / ourselves</span> 表「对自己做」。看动作是双向还是回到自身。",
"ex":[{"q":"The two boys often help ______ with their homework.","o":["each other","themselves","one other"],"a":0,"e":"两人「互相」帮助用 each other；themselves 意为「他们自己」，语义不对；固定短语是 one another 而非 one other。"}]},
{"id":"p10","t":"arrive in / arrive at / get to / reach","cn":"到达","s":"ok","tags":["动词辨析","介词"],
"core":"<b>arrive in</b> + 大地点，<b>arrive at</b> + 小地点；<b>get to</b> + 地点；<b>reach</b> 是及物动词，直接加宾语。遇到 here / there / home 一律<strong>不加介词</strong>。",
"check":"✅ 核对无误：四个词的区别与两条例句都正确。补一条笔记未写的规则，考试很爱考。",
"note":["arrive in + 大地点（城市、国家）","arrive at + 小地点（车站、学校）","get to + 地点（接 here/there/home 时省略 to）","reach + 地点（及物动词，直接加宾语）","例句：We arrived in Shanghai yesterday. / She gets to school at 7."],
"expand":["<strong>地点副词前零介词</strong>：<span class='en'>arrive home / get there / reach here</span> 都对，<span class='en'>arrive at home ✗ / get to there ✗ / reach to the station ✗</span>。","arrive 是<strong>不及物</strong>动词，若不指明地点可单用：<span class='en'>The train arrived late.</span>（易错句第 5 句正是这个用法）。","大 / 小是相对的：<span class='en'>arrive in Shanghai</span>（城市）但 <span class='en'>arrive at the airport / at the station</span>（具体场所）。","同义替换：<span class='en'>get to = arrive at/in = reach</span>；<span class='en'>reach</span> 后还可接「达到（数量、程度）」：<span class='en'>The temperature reached 30℃.</span>"],
"confuse":"<span class='en'>reach</span> 后<strong>绝不</strong>加 at / in / to；<span class='en'>get</span> 后若不接 to，意思变成「得到」；<span class='en'>arrive</span> 后不接地点时不需要介词。",
"ex":[{"q":"We ______ the small village at dusk yesterday.","o":["arrived","arrived at","reached to"],"a":1,"e":"小地点前用 arrive at；arrive 不及物不能直接接宾语，reach 是及物动词不能加 to。"},{"q":"When did you ______ home last night?","o":["get to","arrive at","reach"],"a":2,"e":"home 是地点副词，前面不加任何介词：reach home / get home / arrive home 都对；get to home、arrive at home 都错。"}]},
{"id":"p11","t":"take turns to do sth.","cn":"轮流做某事","s":"ok","tags":["固定句型"],
"core":"<b>take turns to do sth.</b> = <b>take turns (at) doing sth.</b> 轮流做；<b>It's one's turn to do sth.</b> 轮到某人做。",
"check":"✅ 核对无误：句型与拓展都正确，例句规范。",
"note":["take turns to do sth. 轮流做某事","拓展：It's one's turn to do sth. 轮到某人做某事","例句：We take turns to clean the classroom."],
"expand":["两种形式都对：<span class='en'>take turns to do</span> / <span class='en'>take turns doing</span>（也可写 <span class='en'>take turns at doing</span>）。第三部分第 28 句考的是 to do 形式。","turn 作名词的其他用法：<span class='en'>It's your turn.</span> 轮到你了；<span class='en'>in turn</span> 依次；<span class='en'>by turns</span> 轮流；<span class='en'>turn left / right</span> 向左 / 右转。","turn 短语家族见短语第 25 条 <span class='en'>turn...into...</span> 与易错句第 15 句 <span class='en'>turn out</span>。"],
"confuse":"<span class='en'>take turns <strong>to do</strong></span>（轮流做，主语是复数）vs <span class='en'>It's <strong>one's turn</strong> to do</span>（轮到某人，主语是形式主语 it）。别把 It's one's turn 写成 It's one's turns。",
"ex":[{"q":"It's ______ turn to clean the blackboard today.","o":["you","your","yours"],"a":1,"e":"It's one's turn to do 中 one's 用形容词性物主代词 your；yours 是名词性物主代词，后面不能再接名词 turn。"}]},
{"id":"p12","t":"used to do / be used to doing","cn":"过去常常做 / 习惯于做","s":"ok","tags":["三兄弟辨析"],
"core":"<b>used to do</b> 过去常常（现在不做了）；<b>be used to doing</b> 习惯于（to 是介词）；<em>笔记漏了第三个</em>：<b>be used to do</b> 被用来做（被动）。",
"check":"✅ 核对无误：两个结构的辨析与例句都准确，to 的词性判断（不定式符号 vs 介词）尤其到位。<strong>补上第三个结构</strong>，这三个几乎是必考题。",
"note":["used to do：过去常常（现在不做了），to 是不定式符号，加动词原形","be used to doing：习惯于，to 是介词，加动名词","例句：He used to play football after school. / I am used to getting up early."],
"expand":["<strong>三兄弟一次记全</strong>：① <span class='en'>used to do</span> 过去常常 → <span class='en'>He used to walk to school.</span> ② <span class='en'>be / get used to doing</span> 习惯于 → <span class='en'>He is used to walking to school.</span> ③ <span class='en'>be used to do</span> 被用来做 → <span class='en'>Wood is used to make paper.</span>","used to 的否定与疑问：<span class='en'>He didn't use to smoke.</span> / <span class='en'>Did you use to...?</span>（助动词 did 后还原为 use）；也可 <span class='en'>used not to</span>。","<span class='en'>There used to be...</span> 过去曾经有：<span class='en'>There used to be a river here.</span>","<span class='en'>be used for doing</span> = <span class='en'>be used to do</span> 被用来做某事；<span class='en'>be used as</span> 被当作……用。"],
"confuse":"判断只看 <strong>to 后面</strong>：跟<strong>动词原形</strong>→ 过去常常 / 被用来；跟 <strong>doing / 名词</strong> → 习惯于。再看主语是<strong>人</strong>（过去常常、习惯）还是<strong>物</strong>（被用来）。",
"ex":[{"q":"My father ______ smoke, but he gave it up last year.","o":["used to","is used to","was used to"],"a":0,"e":"「过去常常、现在不做了」用 used to do，后接动词原形 smoke；be used to 后要接动名词。"},{"q":"Wood is used ______ paper.","o":["to make","to making","for make"],"a":0,"e":"主语 Wood 是物，表「被用来制造纸」，用 be used to do（被动 + 不定式）；to making 是「习惯于」，语义不通。"}]}

,{"id":"p13","t":"run into / come across","cn":"偶然碰见","s":"ok","tags":["短语动词"],
"core":"后接<strong>人</strong>表意外遇见；同义 <b>meet... by chance / happen to meet</b>。",
"check":"✅ 核对无误：用法与例句正确。补一组 run 短语，容易一起考。",
"note":["后接某人，表意外遇见","例句：I ran into an old friend in the street."],
"expand":["<span class='en'>run into</span> 还有「撞上、遇上（麻烦）」义：<span class='en'>run into trouble</span> 遇上麻烦；<span class='en'>The car ran into a tree.</span>","<span class='en'>come across</span> 也可指「偶然发现某物」：<span class='en'>I came across an old photo.</span>","run 短语家族：<span class='en'>run after</span> 追赶、<span class='en'>run away</span> 逃跑、<span class='en'>run out of</span> 用完、<span class='en'>run into</span> 偶遇 / 撞上。","同义表达：<span class='en'>happen to meet sb.</span> / <span class='en'>meet sb. by chance / by accident</span>。"],
"confuse":"<span class='en'>run into sb.</span>（偶遇人）vs <span class='en'>run into sth.</span>（撞上物 / 遇到麻烦）；<span class='en'>run after</span> 是「追」，别与「偶遇」混。",
"ex":[{"q":"Guess who I ______ in the supermarket yesterday!","o":["ran after","ran into","ran out of"],"a":1,"e":"「偶然碰见某人」用 run into sb.；run after 追赶，run out of 用完，都不合句意。"}]},
{"id":"p14","t":"after all","cn":"毕竟；终究","s":"ok","tags":["all 短语"],
"core":"副词短语，放句首或句末，用于<strong>缓和语气 / 补充说明原因</strong>。",
"check":"✅ 核对无误：用法与例句都正确。笔记未提的是：这一组含 all 的短语最容易互相混淆，考试中常四个一起放选项里。",
"note":["副词短语，放句首或句末，用于缓和语气","例句：Don't blame him. After all, he is only a child."],
"expand":["<strong>all 短语四兄弟</strong>：<span class='en'>after all</span> 毕竟、终究／<span class='en'>above all</span> 最重要的是／<span class='en'>first of all</span> 首先（列顺序）／<span class='en'>in all</span> 总共／<span class='en'>at all</span> 根本（常用于否定句 not... at all）。","<span class='en'>all in all</span> 总而言之；<span class='en'>not at all</span> 一点也不 / 不客气。","after all 放句首时后面常用逗号隔开：<span class='en'>After all, he is only a child.</span>"],
"confuse":"<span class='en'>After all</span>（毕竟，用于解释 / 让步）≠ <span class='en'>Above all</span>（最重要的是，用于强调）≠ <span class='en'>First of all</span>（首先，用于列举步骤）。看到「解释原因」选 after all，看到「列第一条」选 first of all。",
"ex":[{"q":"Don't be angry with him. ______, he is only eight years old.","o":["Above all","After all","First of all"],"a":1,"e":"后句是解释「别生气」的原因，用「毕竟」after all；above all 表强调最重要，first of all 表列举顺序。"}]},
{"id":"p15","t":"some day / someday","cn":"将来某一天","s":"ok","tags":["时间状语"],
"core":"都表示<strong>将来</strong>有一天；<b>one day</b> 既可用于过去也可用于将来；<b>the other day</b> 只用于<strong>过去</strong>。",

"note":["都表示将来有一天，初中阶段基本同义","辨析：some day 分开写更强调具体某一天；someday 合写更常用作副词","易错点：二者都不用于过去时态；one day 可用于过去或将来","例句：I will travel around the world some day."],
"expand":["<span class='en'>some day / someday</span> 常与<strong>一般将来时</strong>连用：<span class='en'>I hope to visit Beijing <b>some day</b>.</span>（短语第 5 条例句正是这个用法）。","<span class='en'>one day</span> 可过去可将来：<span class='en'>One day last year, I met him.</span>（过去）／<span class='en'>One day you'll understand.</span>（将来）。","<strong>易混陷阱</strong>：<span class='en'>the other day</span> = a few days ago 几天前，只能用于<strong>过去时</strong>；<span class='en'>another day</span> 改天。","<span class='en'>some day</span> 与 <span class='en'>someday</span> 意义上可互换，但同一篇文章里保持写法一致。"],
"confuse":"<span class='en'>some day</span>（将来）｜<span class='en'>one day</span>（过去或将来）｜<span class='en'>the other day</span>（过去，几天前）｜<span class='en'>some days</span>（几天，表一段时间，别误当「某天」）。",
"ex":[{"q":"I met an old friend in the street ______. We had a long talk.","o":["some day","one day","someday"],"a":1,"e":"谓语 met / had 是过去时，要用可指过去的 one day；some day / someday 只用于将来。易混的 the other day 也可用于过去，但不在选项中。"}]},
{"id":"p16","t":"pick sb. up","cn":"开车去接某人","s":"ok","tags":["动副短语"],

"confuse":"<span class='en'>pick up <strong>sb.</strong></span> 接人（动副短语，代词居中）vs <span class='en'>pick <strong>sth.</strong></span> 挑选某物（pick 单独作及物动词）。别把 pick you up 写成 pick up you。",
"ex":[{"q":"My father will ______ at the station at six.","o":["pick up me","pick me up","pick me"],"a":1,"e":"动副短语 pick up 中代词宾语必须放在 pick 与 up 中间：pick me up。"}]},
{"id":"p17","t":"drive to work","cn":"开车去上班","s":"ok","tags":["交通表达"],
