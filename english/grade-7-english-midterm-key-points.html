"note":["同义表达：go to work by car","例句：My father drives to work every day."],
"expand":["<span class='en'>by + 交通工具（单数、无冠词）</span>：<span class='en'>by car / by bus / by bike / by train / by plane</span>；换成 <span class='en'>in / on + a/the + 交通工具</span> 时要加冠词：<span class='en'>in a car / on a bus</span>。","<span class='en'>drive sb. to + 地点</span> 开车送某人去：<span class='en'>Mum drives me to school.</span>","同类结构：<span class='en'>walk to school = go to school on foot</span>、<span class='en'>ride a bike to school = go to school by bike</span>。","注意 <span class='en'>work</span> 在这里是<strong>名词</strong>（上班地点 / 工作），不是动词。"],
"confuse":"<span class='en'>by car</span>（无冠词）vs <span class='en'>in a car / in his car</span>（有冠词或物主代词）；<span class='en'>on foot</span> 是固定说法，不能说 by foot。",
"ex":[{"q":"My uncle goes to work ______ every day.","o":["by a car","by car","on car"],"a":1,"e":"by + 交通工具中间不加任何冠词：by car；也可说 in his car，但必须带限定词。"}]},
{"id":"p18","t":"all over the city","cn":"遍及整个城市","s":"ok","tags":["结构复用"],
"core":"<b>all over + 地点</b> 表范围，与短语第 4 条 <b>all over</b> 是<strong>同一结构</strong>。",
"check":"✅ 核对无误：用法与例句正确。<strong>复习建议</strong>：这条与第 4 条重复，合并成一条记即可，把位置留给别的考点。",
"note":["all over + 地点表范围","例句：There are many parks all over the city."],
"expand":["可替换地点构成一串表达：<span class='en'>all over the world / country / city / school / mountain</span>。","<span class='en'>all over the world</span> 常与被动语态连用：<span class='en'>English is spoken all over the world.</span>","<span class='en'>throughout the city</span> 是更正式的同义表达（了解）。"],
"confuse":"<span class='en'>all over the city</span>（遍及整个城市，强调范围）vs <span class='en'>in the city</span>（在城市里，只说位置）。句子强调「到处都有」时用 all over。",
"ex":[{"q":"There are new parks ______ the city now.","o":["all over","all of","over"],"a":0,"e":"「整个城市到处都有」用 all over + 地点；all of the city 表示「城市的全部」，不表达「遍及」的含义。"}]},
{"id":"p19","t":"such as","cn":"例如","s":"warn","tags":["举例表达","标点"],
"core":"<b>such as</b> 用于列举<strong>部分</strong>例子，后接名词 / 短语，<strong>such as 与后面的例子之间不加逗号</strong>；<b>for example</b> 常举<strong>一个</strong>例子，用逗号隔开，位置灵活。",
"check":"🟡 笔记写「不用逗号隔开」容易产生误导：<span class='en'>such as</span> <strong>后面</strong>紧跟例子确实不加逗号，但 <span class='en'>such as</span> <strong>前面</strong>通常有逗号——笔记自己的例句 <span class='en'>I like fruits, such as apples and bananas.</span> 里就有。建议把话说完整，否则孩子可能把例句里的逗号也当成错误。",
"fix":{"bad":"后接名词/短语，<code>不用逗号隔开</code>","good":"<code>such as 后面紧跟例子，中间不加逗号</code>；<code>such as 前通常有逗号</code>：<code>I like fruits, such as apples and bananas.</code>"},
"note":["用于列举多个例子，后接名词/短语，不用逗号隔开 ←（表述需澄清）","辨析：for example 举单个例子，常用逗号隔开，可放句首/句中/句末","例句：I like fruits, such as apples and bananas."],
"expand":["<span class='en'>such as</span> 后<strong>不接句子</strong>，也不与 <span class='en'>and so on</span> 连用（因为它本身已表示不完全列举）。","<span class='en'>for example = for instance</span>，可放句首 / 句中 / 句末，前后常用逗号：<span class='en'>For example, apples are good for you.</span>","要<strong>列举全部</strong>时用 <span class='en'>namely</span> 或 <span class='en'>that is</span>（了解）。","标点对照：<span class='en'>I like fruits, such as apples and bananas.</span> ／ <span class='en'>I like apples, for example.</span>"],
"confuse":"<span class='en'>such as</span>（列举同类中的几个，后面紧跟名词，无逗号）vs <span class='en'>for example</span>（举一个完整例子，用逗号隔开，可独立成句）。空格后是<strong>一串名词</strong>用 such as，空格后是<strong>一个句子</strong>用 for example。",
"ex":[{"q":"I like ball games, ______ basketball and volleyball.","o":["such as","for example","such"],"a":0,"e":"空格后是一串名词短语（多个例子），且紧跟 such as 不加逗号，用 such as；for example 通常举一个例子并用逗号隔开。"},{"q":"He is very helpful. ______, he often helps old people cross the street.","o":["Such as","For example","Such as for"],"a":1,"e":"空格后是一个完整的句子，且用逗号隔开，要用 For example；such as 后面不能接句子。"}]},
{"id":"p20","t":"get home from work","cn":"下班回家","s":"ok","tags":["地点副词"],
"core":"<b>home</b> 在这里是<strong>副词</strong>，前面<em>不加 to / at</em>；<b>from work</b> 表「下班」。",
"check":"✅ 核对无误：home 作副词的判断是关键，例句正确。",
"note":["home 是副词，前面不加 to","例句：He usually gets home from work at 6."],
"expand":["同类零介词搭配：<span class='en'>go home / get home / arrive home / come home / walk home / return home / reach home</span>。","但 home 作<strong>名词</strong>时要加介词或限定词：<span class='en'>at home</span> 在家、<span class='en'>at his home</span>、<span class='en'>in my home</span>、<span class='en'>to his home</span>。","<span class='en'>here / there / home / abroad / downtown</span> 都是地点副词，前面一律不加 to / at / in。呼应短语第 10 条。","<span class='en'>from work</span> 表来源：<span class='en'>on my way home from work</span> 下班回家的路上。"],
"confuse":"<span class='en'>get home ✓ / get to home ✗</span>；<span class='en'>be at home ✓</span>（此时 home 是名词）。判断看动词：表「到达 / 去」用零介词，表「在」用 at。",
"ex":[{"q":"My mother usually gets ______ from work at six.","o":["to home","home","at home"],"a":1,"e":"get 表「到达」时，home 是地点副词，前面不加 to；要说「在家」才是 at home。"}]},
{"id":"p21","t":"sports park","cn":"运动公园","s":"ok","tags":["名词作定语"],
"core":"<b>sports</b> 作定语时常用<strong>复数</strong>形式：<span class='en'>sports park / sports meeting / sports shoes</span>。",
"check":"✅ 核对无误：用法说明与例句都正确。",
"note":["sports 作定语常用复数形式","例句：There is a new sports park near my home."],
"expand":["同类复数名词作定语：<span class='en'>sports meeting</span> 运动会、<span class='en'>sports shoes</span> 运动鞋、<span class='en'>sports news</span> 体育新闻、<span class='en'>a sports star</span> 体育明星、<span class='en'>sales department</span> 销售部。","一般名词作定语用<strong>单数</strong>：<span class='en'>a shoe shop</span>、<span class='en'>apple trees</span>、<span class='en'>a school bus</span>（对比 sports 是特例）。","名词作定语通常用单数，只有 man / woman 随后面名词一起变复数：<span class='en'>two women teachers</span>。"],
"confuse":"<span class='en'>sport</span> 作名词「运动」是可数的（<span class='en'>My favorite sport is swimming.</span>），但作定语时习惯用 <span class='en'>sports</span>。别写成 <span class='en'>sport park</span>。",
"ex":[{"q":"Our school will hold a ______ meeting next week.","o":["sport","sports","sport's"],"a":1,"e":"「运动会」固定说 sports meeting，sports 作定语用复数形式；不是所有格，不加撇号。"}]},
{"id":"p22","t":"feel like","cn":"想要；感觉像","s":"ok","tags":["doing","would like"],
"core":"<b>feel like doing sth.</b> 想要做（后接<strong>动名词</strong>，不接 to do）；<b>feel like + 名词 / 从句</b> 感觉好像。",
"check":"✅ 核对无误：两个用法、「不接 to do」的提醒和例句都准确。",
"note":["feel like doing sth. 想要做某事（高频考点）","feel like + 名词/从句 感觉好像……","易错点：后接 doing，不接 to do","例句：I feel like drinking a cup of tea."],
"expand":["<strong>与 would like 对照（高频）</strong>：<span class='en'>feel like <strong>doing</strong></span> 想做 ≈ <span class='en'>would like <strong>to do</strong></span> 想做。<span class='en'>I feel like a cup of tea. = I'd like a cup of tea.</span>","否定：<span class='en'>I don't feel like eating anything.</span> 我什么都不想吃。","<span class='en'>feel + adj.</span> 是系表结构：<span class='en'>I feel tired / happy.</span>；<span class='en'>feel like + n.</span> 则是「感觉像 / 想要」。","<span class='en'>It feels like rain.</span> 感觉要下雨了；<span class='en'>I feel like a fool.</span> 我感觉自己像个傻瓜。"],
"confuse":"<span class='en'>feel like doing ✓ / feel like to do ✗</span>；<span class='en'>would like to do ✓ / would like doing ✗</span>。两个「想要」后接形式相反，是选择题最爱设的一组。",
"ex":[{"q":"It's so hot. I feel like ______ a glass of cold water.","o":["to drink","drinking","drink"],"a":1,"e":"feel like 后接动名词 doing；若换成 would like，则接 to drink。"}]},
{"id":"p23","t":"get into trouble","cn":"陷入麻烦","s":"ok","tags":["trouble 家族"],
"core":"<b>get into trouble</b> 陷入麻烦 / <b>be in trouble</b> 处于麻烦中 / <b>have trouble (in) doing sth.</b> 做某事有困难。",
"check":"✅ 核对无误：例句正确。这条笔记内容偏薄，而 trouble 的搭配在七上考得很多，建议补下面三组。",
"note":["例句：He often gets into trouble at school."],
"expand":["<span class='en'>trouble</span> 一般作<strong>不可数名词</strong>：<span class='en'>much / a lot of trouble</span>，不说 <span class='en'>a trouble / troubles</span>（泛指时）。","<strong>have trouble / difficulty / problems (in) doing sth.</strong> 做某事有困难，in 常省略：<span class='en'>We had trouble (in) finding his house.</span>","固定问答：<span class='en'>What's the trouble (with you)? = What's the matter? = What's wrong?</span> 怎么了？","其他搭配：<span class='en'>make trouble</span> 惹麻烦、<span class='en'>get sb. into trouble</span> 让某人陷入麻烦、<span class='en'>out of trouble</span> 脱离麻烦。"],
"confuse":"<span class='en'>get into trouble</span>（动作：陷入）vs <span class='en'>be in trouble</span>（状态：处于）。另外 <span class='en'>have trouble <strong>doing</strong></span> 后接动名词，不能接 to do。",
"ex":[{"q":"We had a lot of trouble ______ the way to the museum.","o":["to find","finding","find"],"a":1,"e":"have trouble (in) doing sth. 是固定句型，后接动名词；介词 in 可省略，但动名词不能改成不定式。"}]}

,{"id":"p24","t":"think of","cn":"想起；认为","s":"ok","tags":["think 短语"],
"core":"<b>think of</b> 想起 / 认为；<b>think about</b> 思考、考虑；<b>think over</b> 仔细考虑。",
"check":"✅ 核对无误：与 think about 的辨析和例句都正确。",
"note":["辨析：think about 思考；考虑","例句：This photo makes me think of my grandma."],
"expand":["<strong>问看法的句型</strong>：<span class='en'>What do you think of...? = How do you like...? = How do you find...?</span> 你觉得……怎么样？（不能用 How do you think of）","<span class='en'>think of ... as ...</span> 把……看作……；<span class='en'>think up</span> 想出（主意）。","<strong>否定转移（高频）</strong>：<span class='en'>I don't think he is right.</span> 意为「我认为他不对」，否定词放在主句，不写 <span class='en'>I think he isn't right.</span>","<span class='en'>think of</span> 常与 <span class='en'>make sb. do sth.</span> 连用：<span class='en'>This photo makes me think of my grandma.</span>（易错句第 3 句同理）"],
"confuse":"<span class='en'>think <strong>of</strong></span> 想起 / 认为（一下子想到）vs <span class='en'>think <strong>about</strong></span> 考虑、琢磨（持续思考）vs <span class='en'>think <strong>over</strong></span> 仔细权衡。",
"ex":[{"q":"— ______ do you think of the new film? — It's wonderful.","o":["How","What","Why"],"a":1,"e":"问看法固定用 What do you think of...?（= How do you like...?）；How 与 think of 不能搭配。"}]},
{"id":"p25","t":"turn...into...","cn":"把……变成……","s":"ok","tags":["turn 短语"],
"core":"<b>turn A into B</b> 把 A 变成 B；<b>turn into</b>（不带宾语）变成。",
"check":"✅ 核对无误：搭配与例句都正确。顺手把 turn 短语家族补齐，因为本套笔记里考了好几个。",
"note":["例句：The magician turned the paper into a bird."],
"expand":["同义表达：<span class='en'>change A into B</span>；<span class='en'>Water turns into ice.</span> 水变成冰（不及物用法，无宾语）。","<strong>turn 短语家族</strong>：<span class='en'>turn on / off</span> 打开 / 关掉、<span class='en'>turn up / down</span> 调大 / 调小、<span class='en'>turn left / right</span> 左转 / 右转、<span class='en'>turn around</span> 转身、<span class='en'>turn over</span> 翻过来、<span class='en'>turn out (that...)</span> 结果证明（易错句第 15 句）、<span class='en'>take turns</span> 轮流（短语第 11 条）。","<span class='en'>turn + 颜色 / 形容词</span> 表变化：<span class='en'>The leaves turn yellow.</span>（单词第 14 条）"],
"confuse":"<span class='en'>turn A <strong>into</strong> B</span>（及物，A、B 都出现）vs <span class='en'>A turns <strong>into</strong> B</span>（不及物，A 作主语）。别与 <span class='en'>turn out</span>（结果是）混。",
"ex":[{"q":"The magician ______ the piece of paper ______ a beautiful flower.","o":["turned; into","turned; out","changed; in"],"a":0,"e":"「把纸变成花」用 turn A into B；turn out 意为「结果证明」，change 的搭配是 change A into B。"}]},
{"id":"p26","t":"make sure","cn":"确保；查明","s":"ok","tags":["从句"],
"core":"<b>make sure (that) + 从句</b> 确保……；<b>make sure of sth.</b>；<b>make sure to do</b>。",
"check":"✅ 核对无误：例句 <span class='en'>Make sure you close the window before you leave.</span> 正确，从句用一般现在时表将来也很规范。",
"note":["后可接从句","例句：Make sure you close the window before you leave."],
"expand":["三种结构：<span class='en'>Make sure (that) you lock the door.</span> / <span class='en'>Make sure of the time.</span> / <span class='en'>Make sure to come early.</span>","从句里用<strong>一般现在时表将来</strong>：<span class='en'>Make sure you <b>close</b> the window before you <b>leave</b>.</span>（不说 will close / will leave）。","与 <span class='en'>be sure</span> 对照：<span class='en'>be sure of sth.</span> 对……有把握、<span class='en'>be sure to do</span> 一定会做、<span class='en'>be sure that...</span> 确信。","易错句第 13 句 <span class='en'>Remember to make sure you write your name again...</span> 把三个考点串在一起。"],
"confuse":"<span class='en'>make sure</span> 是「<strong>务必做到</strong>」（动作，后接从句 / to do）；<span class='en'>be sure</span> 是「<strong>有把握</strong>」（心理状态）。祈使句开头用 Make sure。",
"ex":[{"q":"______ sure you write your name before you hand in the paper.","o":["Make","Be","Do"],"a":0,"e":"「务必确保……」是祈使句，用 Make sure (that) 从句；Be sure 表示「确信」，语义不符。"}]},
{"id":"p27","t":"hand in","cn":"上交；提交","s":"ok","tags":["动副短语"],
"core":"动副短语；<strong>代词宾语放中间</strong>：<span class='en'>hand it in ✓ / hand in it ✗</span>；名词两种位置都可以。",
"check":"✅ 核对无误：用法与例句都正确。",
"note":["动副短语，代词放中间","例句：Please hand in your homework on time."],
"expand":["美式同义 <span class='en'>turn in</span>；反义 / 相关 <span class='en'>hand out</span> 分发、<span class='en'>hand back</span> 归还。","<span class='en'>hand</span> 作动词还有「递给」义，可接双宾语：<span class='en'>Hand me the book. = Hand the book to me.</span>","<span class='en'>on time</span> 准时 ≠ <span class='en'>in time</span> 及时，例句里的 on time 别改错。"],
"confuse":"<span class='en'>hand <strong>in</strong></span> 上交（给学生→老师）vs <span class='en'>hand <strong>out</strong></span> 分发（老师→学生）。方向相反，看主语是谁。",
"ex":[{"q":"Here is your test paper. Please ______ before the bell rings.","o":["hand in it","hand it in","hand it out"],"a":1,"e":"代词 it 作宾语必须放在 hand 与 in 中间；hand out 是「分发」，方向不符。"}]},
{"id":"p28","t":"stop sb. from doing sth.","cn":"阻止某人做某事","s":"ok","tags":["stop 句型"],
"core":"<b>stop / prevent sb. (from) doing</b> 阻止某人做；<b>keep sb. from doing</b> 中的 from <em>不能省</em>。<strong>更要紧的一组辨析笔记未写：stop doing vs stop to do</strong>。",
"check":"✅ 核对无误：搭配与例句正确。但这条旁边必须补上 stop doing / stop to do，否则易错句第 17 句的同源考点会漏。",
"note":["例句：We should stop people from cutting down trees."],
"expand":["<strong>stop doing vs stop to do（必考）</strong>：<span class='en'>stop doing</span> 停止正在做的事（<span class='en'>Stop talking, please.</span>）；<span class='en'>stop to do</span> 停下来<strong>去做另一件事</strong>（<span class='en'>He stopped to have a rest.</span> 他停下来去休息）。","同义结构：<span class='en'>stop / prevent sb. (from) doing</span> = <span class='en'>keep sb. from doing</span>。主动语态里 stop / prevent 后的 from 可省，keep 后的 from 不能省。","被动语态中 from 一般保留：<span class='en'>He was stopped from going out.</span>","<span class='en'>cut down trees</span> 砍树，易错句第 17 句 <span class='en'>stop them from doing this</span> 是同一结构。"],
"confuse":"<span class='en'>stop <strong>doing</strong></span>「停下（这件事）」——doing 是被停止的动作；<span class='en'>stop <strong>to do</strong></span>「停下来（为了去做）」——to do 是停下来的目的。看到 <span class='en'>Class began. The students stopped ______</span> 选 talking。",
"ex":[{"q":"The teacher came in, so the students stopped ______ at once.","o":["to talk","talking","talk"],"a":1,"e":"「停止说话」用 stop doing；stop to talk 是「停下来去说话」，意思正好相反。"},{"q":"We should stop people ______ down trees.","o":["from cutting","to cut","cut"],"a":0,"e":"「阻止某人做某事」用 stop sb. from doing sth.，from 后接动名词。"}]},
{"id":"p29","t":"have...on","cn":"穿着；戴着（表状态）","s":"ok","tags":["穿戴表达"],
"core":"<b>have ... on</b> = <b>be wearing</b> 表<strong>穿着的状态</strong>；<b>put on</b> 表<strong>穿的动作</strong>。",
"check":"✅ 核对无误：例句正确，易错句第 18 句 <span class='en'>I don't have my glasses on</span> 正是这个用法。",
"note":["例句：She has a red dress on today."],
"expand":["<strong>穿戴四件套</strong>：<span class='en'>put on</span> 穿上（动作）/ <span class='en'>wear</span> 穿着（状态）/ <span class='en'>have ... on</span> 穿着（状态，无进行时）/ <span class='en'>be in + 颜色 / 衣服</span> 穿着（<span class='en'>The girl in red</span> 穿红衣的女孩）。","<span class='en'>dress</span> 的宾语是<strong>人</strong>：<span class='en'>dress oneself / dress the baby / be dressed in</span>，不能直接接衣服。","<span class='en'>glasses</span> 眼镜恒用复数，代词用 them；<span class='en'>a pair of glasses</span> 一副眼镜。","否定形式 <span class='en'>don't have ... on</span>：说明「没戴着」，呼应易错句第 18 句。"],
"confuse":"<span class='en'>have ... on</span> 是状态，<strong>不能用于进行时</strong>（不说 <span class='en'>is having a hat on</span>）；<span class='en'>put on</span> 是瞬间动作，可与 <span class='en'>now / at that moment</span> 连用。",
"ex":[{"q":"He can't see clearly because he doesn't have his glasses ______.","o":["in","on","up"],"a":1,"e":"have ... on 表「戴着」的状态；这里 on 是副词，不能换成 in / up。"}]},
{"id":"p30","t":"make mistakes","cn":"犯错","s":"ok","tags":["固定搭配"],
"core":"<b>make a mistake / make mistakes</b> 犯错；<b>by mistake</b> 错误地（无意中）；<b>mistake A for B</b> 把 A 错认成 B。",
"check":"✅ 核对无误：搭配与例句都正确。",
"note":["搭配：make a mistake 犯一个错误","例句：Everyone may make mistakes."],
"expand":["<span class='en'>make a mistake <strong>in</strong> sth.</span> 在……方面犯错：<span class='en'>He made a mistake in spelling.</span>","<span class='en'>by mistake</span> 无意中弄错：<span class='en'>I took your umbrella by mistake.</span> 我错拿了你的伞。","<span class='en'>mistake</span> 也可作动词「误认」，不规则变形 <span class='en'>mistake — mistook — mistaken</span>：<span class='en'>I mistook him for his brother.</span>","易错句第 19 句 <span class='en'>make silly mistakes</span> 是同一搭配加了形容词。"],
"confuse":"<span class='en'>make mistakes</span>（犯错，动词短语）vs <span class='en'>by mistake</span>（错误地，副词短语，修饰动作）。<span class='en'>make a mistake</span> 可数，别写成 <span class='en'>do a mistake</span>。",
"ex":[{"q":"Sorry, I took your notebook ______ mistake.","o":["by","in","with"],"a":0,"e":"「无意中拿错」是固定短语 by mistake；make a mistake 才是「犯错」。"}]},
{"id":"p31","t":"pretend to do sth.","cn":"假装做某事","s":"ok","tags":["不定式"],
"core":"<b>pretend to do</b> 假装做；<b>pretend not to do</b> 假装没做；<b>pretend to be doing</b> 假装正在做。",
"check":"✅ 核对无误：否定形式与例句 <span class='en'>He pretended to be sleeping.</span> 都正确，例句正是「假装正在做」的形式。",
"note":["否定形式：pretend not to do","例句：He pretended to be sleeping."],
"expand":["三种形式一次记：<span class='en'>pretend to do</span> 假装做 / <span class='en'>pretend to be doing</span> 假装正在做 / <span class='en'>pretend to have done</span> 假装已经做过（了解）。","也可接从句或名词：<span class='en'>He pretended that he was ill.</span> / <span class='en'>pretend illness</span> 装病。","否定词位置：<span class='en'>pretend <strong>not to</strong> do ✓</span>，不能写成 <span class='en'>pretend to don't</span>。易错句第 20 句 <span class='en'>pretended not to hear me</span> 是同一结构。","pretend 常见于《皇帝的新装》一课，与单词第 8 条 emperor、短语第 8 条 lie 一起复习。"],
"confuse":"<span class='en'>pretend to do</span> 后接<strong>不定式</strong>，不接动名词（<span class='en'>pretend doing ✗</span>）。对比 <span class='en'>feel like / finish / enjoy</span> 后接 doing。",
"ex":[{"q":"When I called his name, he pretended ______ me.","o":["not to hear","to not hear","not hearing"],"a":0,"e":"pretend 后接不定式，否定形式是 pretend not to do；不能接动名词，也不能把 not 放在 to 后面。"}]},
{"id":"p32","t":"say to oneself","cn":"自言自语；心里暗想","s":"ok","tags":["反身代词","四大说"],
"core":"<b>say to oneself</b> 心里想、自言自语；oneself 要随主语<strong>变反身代词</strong>。",
"check":"✅ 核对无误：例句与直接引语用法都正确。补一组「说」的动词辨析，这是七上必考。",
"note":["例句：He said to himself, I can do it."],
"expand":["<strong>say / speak / tell / talk 四词辨析</strong>：<span class='en'>say sth. to sb.</span>（强调内容）/ <span class='en'>speak + 语言 / speak to sb.</span>（强调说话能力或动作）/ <span class='en'>tell sb. sth. = tell sth. to sb.</span>（告诉，可接双宾语；<span class='en'>tell a story / tell the truth / tell a lie</span>）/ <span class='en'>talk to / with sb. about sth.</span>（交谈）。","<strong>反身代词表</strong>：<span class='en'>myself, yourself, himself, herself, itself, ourselves, yourselves, themselves</span>。","直接引语标点：引号内句末用逗号 / 句号放在引号<strong>内</strong>；<span class='en'>Just one more month, he said to himself.</span>（易错句第 21 句）","<span class='en'>say to oneself = think to oneself</span>；<span class='en'>by oneself</span> 独自、<span class='en'>enjoy oneself</span> 玩得开心。"],
"confuse":"<span class='en'>say to oneself</span>（对自己说）vs <span class='en'>say to each other</span>（互相说）vs <span class='en'>talk to sb.</span>（跟别人说）。反身代词必须与主语人称一致：I → myself，he → himself，they → themselves。",
"ex":[{"q":"Just one more month, she said to ______.","o":["her","herself","she"],"a":1,"e":"主语是 she，对自己说话要用对应的反身代词 herself。"},{"q":"Can you ______ it in English?","o":["say","speak","tell"],"a":0,"e":"say sth. in English 强调「说的内容」；speak 后直接接语言（speak English），tell 需要接人作宾语。"}]},
{"id":"p33","t":"to one's surprise","cn":"令某人惊讶的是","s":"ok","tags":["情感名词"],
"core":"放句首、用逗号隔开；<b>to one's + 情感名词</b> 是一整类结构；修饰动作则用 <b>in surprise</b>。",
"check":"✅ 核对无误：用法与例句都正确。三句易错句（第 9、22、25 句）都涉及 surprise 相关结构。",
"note":["放句首，用逗号隔开","例句：To my surprise, he passed the exam."],
"expand":["同结构一串记：<span class='en'>to one's surprise</span> 令……惊讶的是 / <span class='en'>to one's joy / delight</span> 令……高兴的是 / <span class='en'>to one's disappointment</span> 令……失望的是 / <span class='en'>to one's sadness</span> 令……难过的是（呼应单词第 19 条）。","<span class='en'>one's</span> 用<strong>形容词性物主代词</strong>：<span class='en'>to my / his / Tom's / everyone's surprise</span>。","<span class='en'>in surprise</span> 惊讶地（修饰动作）：<span class='en'>She looked at me in surprise.</span>；<span class='en'>be surprised at / by / to do / that 从句</span> 感到惊讶。","<span class='en'>surprising</span>（令人惊讶的，修饰物）vs <span class='en'>surprised</span>（感到惊讶的，修饰人），见单词第 20 条的 -ing/-ed 规律。"],
"confuse":"<span class='en'>to one's surprise</span>（句首评注，用逗号隔开）vs <span class='en'>in surprise</span>（方式状语，修饰动词）vs <span class='en'>be surprised</span>（谓语）。三者在句中的位置完全不同。",
"ex":[{"q":"______, the shy boy won the first prize.","o":["To my surprise","In surprise","To my surprised"],"a":0,"e":"放句首、用逗号隔开、表示「令我惊讶的是」用 to one's surprise；one's 后接名词 surprise，不能用形容词 surprised。"}]},
{"id":"p34","t":"make progress","cn":"取得进步","s":"ok","tags":["不可数名词"],
"core":"<b>progress</b> 是<strong>不可数名词</strong>：<em>不能加 a，也不能加 -s</em>；常说 <b>make great / much / a lot of progress</b>。",
"check":"✅ 核对无误：「progress 不可数、不能加 a」是这条的关键，例句正确，易错句第 30 句也考了。",
"note":["progress 是不可数名词，不能加 a","例句：You will make progress if you keep practicing."],
"expand":["常用修饰语：<span class='en'>make <strong>great / much / a lot of / rapid</strong> progress</span>；<span class='en'>make progress <strong>in</strong> English</span> 在英语上取得进步。","<span class='en'>progress</span> 也可作动词「进展」：<span class='en'>The work is progressing well.</span>（了解）。","<strong>不可数名词家族（一起背）</strong>：<span class='en'>progress, homework, information, advice, news, weather, furniture, money, music, water, milk, experience（经验）</span>——都不加 a / -s。","<span class='en'>keep (on) doing sth.</span> 坚持做，例句里的 keep practicing 后接动名词。"],
"confuse":"<span class='en'>make progress ✓ / make a progress ✗ / make progresses ✗</span>；要表达「很大进步」用 <span class='en'>make great progress</span>，不能在 progress 上加复数。",
"ex":[{"q":"If you keep practicing, you will make ______.","o":["a great progress","great progress","great progresses"],"a":1,"e":"progress 不可数，不能加 a 或 -s；「很大进步」说 make great progress。"},{"q":"He has made much progress ______ English this term.","o":["in","on","at"],"a":0,"e":"表示「在某一方面取得进步」用介词 in：make progress in English。"}]}
]},
    {"key":"sentences","title":"高频易错句子","sub":"考点精讲 / 举一反三","items":[
{"id":"s1","t":"He lost his friends because he lied.","cn":"他因撒谎失去了朋友。","sent":true,"s":"ok","tags":["状语从句","不规则动词"],
"core":"<b>because</b> 引导原因状语从句；lie 作「撒谎」讲时过去式为 <b>lied</b>。",
"check":"✅ 核对无误：句子、翻译与两条考点都准确。",
"note":["because 引导原因状语从句","lie 作「撒谎」讲时过去式为 lied"],
"expand":["<strong>中英文差异（必考）</strong>：英语里 <span class='en'>because</span> 与 <span class='en'>so</span> <strong>不能同时用</strong>。中文说「因为……所以……」，英语只能留一个：<span class='en'>Because he lied, he lost his friends.</span> 或 <span class='en'>He lied, so he lost his friends.</span>","<span class='en'>because + 完整句子</span> vs <span class='en'>because of + 名词 / 代词 / doing</span>：<span class='en'>He was late because of the heavy rain.</span>","<span class='en'>lose — lost — lost</span> 丢失、失去（及物）；<span class='en'>lose one's way</span> 迷路。注意与 <span class='en'>loose</span>（松的）拼写区分。","lie 变形见短语第 8 条与速记卡：<span class='en'>lie(撒谎) — lied — lied</span>。"],
"confuse":"<span class='en'>because / so</span> 二选一；<span class='en'>although / though / but</span> 也二选一（易错句第 15 句的 however 同理，不与 but 连用）。",
"ex":[{"q":"______ he lied, he lost all his friends.","o":["Because; so","Because","So"],"a":1,"e":"because 与 so 不能连用，只能保留一个；选项 A 同时出现两个连词是典型错误。"},{"q":"He didn't go to school ______ the heavy snow.","o":["because","because of","so"],"a":1,"e":"空格后是名词短语 the heavy snow，用介词短语 because of；because 后必须接完整句子。"}]},
{"id":"s2","t":"I used to keep a diary every day.","cn":"过去我每天都写日记。","sent":true,"s":"ok","tags":["used to","固定搭配"],
"core":"<b>used to do</b> 过去常常（<strong>暗含现在不这样了</strong>）；<b>keep a diary</b> 写日记。",
"check":"✅ 核对无误：句子与考点都准确；used to 与 keep a diary 两个考点叠在一句里，是很好的复习句。",
"note":["used to do 过去常常（现在不做了）","keep a diary 写日记"],
"expand":["<span class='en'>used to do</span> 的否定 / 疑问：<span class='en'>I didn't use to keep a diary.</span> / <span class='en'>Did you use to keep a diary?</span>（did 后用 use）","与 <span class='en'>be used to doing</span>（习惯于）、<span class='en'>be used to do</span>（被用来）的三兄弟辨析见短语第 12 条。","<span class='en'>every day</span>（副词短语，每天，分开写）vs <span class='en'>everyday</span>（形容词，日常的，合写）：<span class='en'>everyday English</span> 日常英语。","<span class='en'>keep a diary</span> 也可说 <span class='en'>write in a diary / keep diaries</span>。"],
"confuse":"<span class='en'>used to do</span> 强调「过去 vs 现在」的对比；如果只说过去某段时间反复做、不涉及现在，也可用一般过去时 + <span class='en'>often / every day</span>。看句子有没有「现在不再」的意味。",
"ex":[{"q":"I ______ up late, but now I go to bed early.","o":["used to stay","am used to staying","was used to stay"],"a":0,"e":"后半句 but now 提示「过去常常、现在不这样」，用 used to do + 动词原形。"}]},
{"id":"s3","t":"When I see this photo, I will think of my grandpa.","cn":"当我看到这张照片，我就会想起我的爷爷。","sent":true,"s":"ok","tags":["主将从现"],
"core":"<strong>主将从现</strong>：when 引导的时间状语从句用一般现在时，主句用将来时。",
"check":"✅ 核对无误：主将从现的判断与 think of 的释义都准确。",
"note":["时间状语从句「主将从现」","think of 想起"],
"expand":["<strong>适用连词一整组</strong>：<span class='en'>when, if, as soon as, until, before, after, unless, while</span> 引导的状语从句，都要「主将从现」：<span class='en'>I'll call you as soon as I arrive.</span>","<span class='en'>主句含情态动词（can / must / may）</span> 时，从句同样用一般现在时：<span class='en'>If you make a promise, you must keep it.</span>（易错句第 6 句）。","<span class='en'>主句是祈使句</span> 时也遵循：<span class='en'>Tell him when he comes.</span> / <span class='en'>Walk on, and you'll find it.</span>","<span class='en'>think of</span> 想起（短语第 24 条）；<span class='en'>make sb. do sth.</span> 使某人做（<span class='en'>This photo makes me think of my grandma.</span>）"],
"confuse":"<span class='en'>When I <strong>see</strong>... I <strong>will</strong> think...</span> ✓；<span class='en'>When I <strong>will see</strong>...</span> ✗。从句里绝不能出现 will；判断哪半句是从句看连词。",
"ex":[{"q":"I ______ you as soon as I ______ at the station.","o":["will call; will arrive","call; arrive","will call; arrive"],"a":2,"e":"as soon as 引导时间状语从句，遵循主将从现：主句 will call，从句用一般现在时 arrive。"}]},
{"id":"s4","t":"He got into trouble because he didn't finish his homework yesterday.","cn":"他昨天因为没完成作业而陷入了麻烦。","sent":true,"s":"ok","tags":["一般过去时","状语从句"],
"core":"<b>get into trouble</b> 陷入麻烦；<b>because</b> 引导原因状语从句；<b>yesterday</b> 提示一般过去时。",
"check":"✅ 核对无误：三个考点与句子时态都正确。",
"note":["get into trouble 陷入麻烦","because 引导原因状语从句","一般过去时"],
"expand":["一般过去时的否定：<span class='en'>didn't + 动词原形</span>（<span class='en'>didn't finish ✓ / didn't finished ✗</span>），助动词 did 已承担过去，后面动词必须还原。","时间标志词：<span class='en'>yesterday, last..., ...ago, in 2020, just now, the other day</span>。","<span class='en'>finish doing sth.</span> 完成做某事（finish 后接动名词，不接 to do）：<span class='en'>He finished doing his homework.</span>","<span class='en'>get into trouble</span> 的更多搭配见短语第 23 条。"],
"confuse":"<span class='en'>didn't finish</span> 里 finish 用原形；对比肯定句 <span class='en'>He finished his homework.</span> 才加 -ed。另外 because 与 so 不能连用（见第 1 句）。",
"ex":[{"q":"He ______ his homework yesterday, so he got into trouble.","o":["didn't finished","didn't finish","wasn't finish"],"a":1,"e":"一般过去时否定用 didn't + 动词原形，did 已表过去，finish 不能再加 -ed。"}]},
{"id":"s5","t":"The train arrived late at the station yesterday.","cn":"昨天火车到站晚点了。","sent":true,"s":"ok","tags":["词义辨析","副词"],
"core":"<b>arrive at</b> + 小地点；<b>late</b> 作副词「晚、迟」；注意与 <b>lately</b>（最近）区分。",
"check":"✅ 核对无误：句子、翻译与三个考点都准确。这条最适合把 late 家族一次补齐。",
"note":["arrive at + 小地点","late 副词表「晚地」，注意与 lately（最近）区分"],
"expand":["<strong>late 家族</strong>：<span class='en'>late</span> 迟的 / 晚地（adj. & adv.）｜ <span class='en'>lately</span> 最近（= recently，常与完成时连用）｜ <span class='en'>later</span> 稍后、以后（<span class='en'>two hours later</span>）｜ <span class='en'>latest</span> 最新的（<span class='en'>the latest news</span>）｜ <span class='en'>latter</span> 后者。","<span class='en'>be late for</span> 迟到：<span class='en'>Don't be late for school.</span>","arrive 也可不带介词单独用：<span class='en'>The train arrived late.</span>；四个「到达」的辨析见短语第 10 条。","<span class='en'>A few hours later</span>（易错句第 26 句）里的 later 正是「……之后」，与 late 不同。"],
"confuse":"<span class='en'>late</span> 表「迟」，<span class='en'>lately</span> 表「最近」，只差一个 -ly 意思完全不同。<span class='en'>Have you seen him lately?</span> 你最近见过他吗？",
"ex":[{"q":"Have you read any good books ______?","o":["late","lately","later"],"a":1,"e":"「最近」用 lately（= recently），常与现在完成时连用；late 是「迟的」，later 是「稍后」。"}]},
{"id":"s6","t":"If you make a promise, you must keep it.","cn":"如果你许下诺言，就必须遵守。","sent":true,"s":"ok","tags":["条件状语从句"],
"core":"<b>if</b> 引导条件状语从句，同样遵守<strong>主将从现</strong>；主句含情态动词 must 时，从句用一般现在时。",
"check":"✅ 核对无误：考点与固定搭配都准确。",
"note":["if 引导条件状语从句","make / keep a promise 固定搭配"],
"expand":["主句不一定要用 will，<strong>情态动词或祈使句</strong>也符合「主将从现」：<span class='en'>If you study hard, you will make progress.</span>（易错句第 30 句）/ <span class='en'>If you need help, call me.</span>","<span class='en'>if</span> 还有「是否」义，引导宾语从句时可以用将来时：<span class='en'>I don't know if he <strong>will come</strong> tomorrow.</span> 这是与主将从现最容易混的地方。","三件套 <span class='en'>make / keep / break a promise</span>，见短语第 1 条；<span class='en'>promise</span> 后不接 sb. to do，见单词第 11 条。","<span class='en'>unless</span> = if... not 除非、如果不：<span class='en'>Unless you work hard, you'll fail.</span>"],
"confuse":"<span class='en'>if</span> 表<strong>「如果」</strong>→ 主将从现；表<strong>「是否」</strong>（可换 whether）→ 宾语从句，时态按实际需要。判断看 if 前面有没有 <span class='en'>know / wonder / ask</span> 这类动词。",
"ex":[{"q":"If it ______ tomorrow, we will stay at home.","o":["will rain","rains","rained"],"a":1,"e":"if 表「如果」引导条件状语从句，用一般现在时表将来：rains；主句用 will stay。"}]},
{"id":"s7","t":"There are many white clouds in the sky.","cn":"天空中有很多白云。","sent":true,"s":"ok","tags":["There be","名词复数"],
"core":"<b>cloud</b> 作「云朵」时可数；<b>in the sky</b> 固定搭配；<b>There be</b> 句型遵循就近原则。",
"check":"✅ 核对无误：句子、翻译与考点都正确。",
"note":["cloud 可数名词","in the sky 固定搭配"],
"expand":["<strong>There be 就近原则</strong>：be 动词由<strong>紧跟着它的第一个名词</strong>决定：<span class='en'>There <strong>is</strong> a book and two pens on the desk.</span> / <span class='en'>There <strong>are</strong> two pens and a book...</span>","<span class='en'>cloud</span> 也可泛指「云层」作不可数，但七年级按可数掌握；形容词 <span class='en'>cloudy</span> 多云的：<span class='en'>It's cloudy today.</span>","<span class='en'>in the sky</span> 用定冠词 the；类似 <span class='en'>in the sun / in the rain / in the world</span>。","<span class='en'>There be</span> 的否定与疑问：<span class='en'>There aren't any clouds.</span> / <span class='en'>Are there any clouds?</span>"],
"confuse":"<span class='en'>There be</span> 表「某处有」，<span class='en'>have / has</span> 表「某人拥有」，两者不能混用：<span class='en'>There are many clouds in the sky ✓ / The sky has many clouds ✗</span>（考试按 There be 判）。",
"ex":[{"q":"There ______ a white cloud and some birds in the sky.","o":["are","is","have"],"a":1,"e":"There be 遵循就近原则，紧跟 be 的 a white cloud 是单数，用 is；不能与 have 混用。"}]},
{"id":"s8","t":"It's a good day to climb the mountain.","cn":"今天是爬山的好日子。","sent":true,"s":"fix","tags":["形式主语","已修正"],
"core":"这里的 <b>it</b> 是<strong>非人称 it（指时间 / 天气 / 日子）</strong>，<b>to climb the mountain</b> 是不定式作<strong>后置定语</strong>修饰 day——<em>不是形式主语</em>。",
"check":"🔴 <strong>考点标注有误，需要改</strong>。笔记写「It's + 名词 + to do sth. 句型，it 作形式主语」。检验方法：把不定式提到句首，若能成立才是形式主语。<span class='en'>To climb the mountain is a good day.</span> ✗（爬山不是一个好日子）不成立，说明 it 不是形式主语，而是指「这天 / 天气」的非人称 it，to climb 作 day 的后置定语（「适合爬山的好日子」）。<strong>真正的 It's + adj. + to do 形式主语句是第 11 句</strong>：<span class='en'>It's interesting to have math lessons.</span> → <span class='en'>To have math lessons is interesting.</span> ✓。<strong>但要说清楚</strong>：不少教辅会把 <span class='en'>It is + n. + to do sth.</span> 统一归进「形式主语」来讲（像 <span class='en'>It's a good habit to do morning exercises.</span> 确实能还原），孩子按课堂口径记并不影响做题；本条真正要掌握的是会用 <span class='en'>a good day / place / way to do</span> 这个句型，并能分清第 11 句那种可还原的真正形式主语。",
"fix":{"bad":"考点：<code>It's + 名词 + to do sth. 句型，it 作形式主语</code>","good":"考点：<code>it 为非人称代词，指时间 / 这天；to climb the mountain 作后置定语修饰 day</code>，意为「一个适合爬山的好日子」。"},
"note":["考点：It's + 名词 + to do sth. 句型，it 作形式主语 ←（此处有误）"],
"expand":["<strong>形式主语 it 的标准句式</strong>：<span class='en'>It's + adj. + (for sb.) + to do sth.</span>，如 <span class='en'>It's important to learn English well.</span>（= <span class='en'>To learn English well is important.</span>）","<strong>非人称 it</strong> 常指时间、天气、距离、温度：<span class='en'>It's five o'clock. / It's cold today. / It's a long way.</span> 这些 it 不指代任何具体名词，也不能还原成不定式主语。","<span class='en'>a good day / time / place / way <strong>to do</strong></span> 是「不定式作后置定语」的高频组合：<span class='en'>a good place to visit</span>、<span class='en'>a good way to learn English</span>。","第 15 句 <span class='en'>it was hard to live without electricity</span> 里的 it <strong>才是</strong>形式主语（<span class='en'>To live without electricity was hard.</span> ✓）。三句放一起对比最好记。"],
"confuse":"判断形式主语只需一招：<strong>把 to do 短语挪到句首</strong>，句子仍成立 → 形式主语；不成立 → 非人称 it 或不定式作定语。<span class='en'>It's interesting to have math lessons ✓（形式主语）</span>／<span class='en'>It's a good day to climb...（定语）</span>。",
"ex":[{"q":"Which sentence has a formal subject 'it'?","o":["It's a good day to climb the mountain.","It's interesting to have math lessons.","It's five o'clock now."],"a":1,"e":"只有 B 能把不定式提前：To have math lessons is interesting.（成立）。A 的 to climb 是 day 的后置定语，C 的 it 指时间，都不是形式主语。"}]},

"core":"<b>be surprised that + 从句</b> 对……感到惊讶；<b>neighbor</b> 注意英美拼写；David 是 neighbor 的<strong>同位语</strong>。",

"confuse":"<span class='en'>I was <strong>surprised</strong>.</span>（我感到惊讶）vs <span class='en'>The news was <strong>surprising</strong>.</span>（消息令人惊讶）。另外 <span class='en'>neighbor</span> 与 <span class='en'>neighborhood</span> 一个指人、一个指地方。",
"ex":[{"q":"We were ______ to hear the ______ news.","o":["surprising; surprised","surprised; surprising","surprised; surprised"],"a":1,"e":"人「感到」用 -ed：surprised；消息「令人」用 -ing：surprising。"}]},

"core":"<b>exciting</b> 修饰事物（令人激动的），<b>excited</b> 修饰人（感到激动的）；<b>writer</b> = write + -er。",
"check":"✅ 核对无误：考点与翻译都准确。",

"confuse":"<span class='en'>an exciting novel</span>（小说令人激动）vs <span class='en'>The readers were excited.</span>（读者感到激动）。同一句里可以同时出现两词，先判断修饰对象是人还是物。",

{"id":"s15","t":"However, it turned out that it was hard to live without electricity.","cn":"然而事实证明，没有电很难生活。","sent":true,"s":"ok","tags":["形式主语","转折词"],

"expand":["<strong>时态呼应</strong>：主句过去时，从句一般也要用相应的过去时态（客观真理除外）：<span class='en'>He said he <strong>was</strong> busy.</span>","<span class='en'>clearly</span> 是副词修饰动词 see；对应形容词 <span class='en'>clear</span> 修饰名词（<span class='en'>a clear answer</span>）。","<span class='en'>glasses</span> 眼镜恒用复数，代词用 them；<span class='en'>a pair of glasses</span> 一副眼镜。<span class='en'>have ... on</span> 表状态，见短语第 29 条。","<span class='en'>because</span> 前加逗号仅在「并非因为……」等特殊强调时用，初中阶段按「不加逗号」掌握。"],
"confuse":"<span class='en'>couldn't ... because ... didn't have</span> ✓（同过去）／<span class='en'>can't ... because ... don't have</span> ✓（同现在）／<span class='en'>couldn't ... don't have</span> ✗（时态打架）。",

{"id":"s19","t":"He decided not to make silly mistakes in the math test.","cn":"他决定不在数学测试中犯愚蠢的错误。","sent":true,"s":"ok","tags":["不定式否定"],

"check":"✅ 核对无误：否定结构与搭配判断准确，介词 in 用得也对。",
"note":["decide not to do 否定结构","make mistakes 犯错"],
"expand":["<strong>不定式否定一律是 not to do</strong>：<span class='en'>decide not to do</span>（单词第 6 条）、<span class='en'>pretend not to do</span>（第 20 句）、<span class='en'>tell / ask sb. not to do</span>、<span class='en'>hope not to do</span>。不能写成 <span class='en'>to don't / don't to do</span>。","<span class='en'>make a mistake / make mistakes / make silly mistakes</span> 见短语第 30 条；<span class='en'>by mistake</span> 是「无意中弄错」。","<span class='en'>in the test / in the exam</span> 用介词 in；<span class='en'>on the test</span> 是美式口语，考试按 in 掌握。","<span class='en'>silly = foolish</span> 愚蠢的；<span class='en'>make sure</span> 等含 make 的搭配可一起复习。"],
"confuse":"<span class='en'>decide <strong>not to</strong> make mistakes</span>（决定不犯错）≠ <span class='en'>didn't decide to make mistakes</span>（没决定要犯错）。否定词位置不同，意思完全不同。",
"ex":[{"q":"He decided ______ silly mistakes in the math test again.","o":["to not make","not to make","not making"],"a":1,"e":"decide 后接不定式，否定形式是 decide not to do；不能接动名词，也不能把 not 放到 to 后面。"}]},
{"id":"s20","t":"When I called his name, he pretended not to hear me.","cn":"当我叫他名字的时候，他假装没听见我说话。","sent":true,"s":"ok","tags":["时间状语从句","不定式否定"],
"core":"<b>when</b> 引导时间状语从句；<b>pretend not to do</b> 假装没做；<b>hear sb.</b> 听见某人。",
"check":"✅ 核对无误：句子、翻译与两个考点都准确。",
"note":["when 引导时间状语从句","pretend not to do 否定结构"],
"expand":["<span class='en'>when</span> 引导过去的时间状语从句时，主从句都用过去时：<span class='en'>When I called..., he pretended...</span>；若表将来则遵循主将从现（第 3 句）。","<strong>hear 的宾补</strong>：<span class='en'>hear sb. do</span> 听见某人做了（全过程）/ <span class='en'>hear sb. doing</span> 听见某人正在做（易错句第 29 句 <span class='en'>heard two hunters discussing</span>）。","<span class='en'>hear</span>（听见，结果）vs <span class='en'>listen to</span>（听，动作）：<span class='en'>I listened carefully but heard nothing.</span>","<span class='en'>hear from sb.</span> 收到某人来信 / <span class='en'>hear of / about</span> 听说。"],
"confuse":"<span class='en'>pretend not to hear</span>（假装没听见）与 <span class='en'>pretend to be sleeping</span>（假装正在睡）都是不定式，形式不同：<span class='en'>pretend to be doing</span> 表「假装正在做」。",
"ex":[{"q":"I heard someone ______ in the next room just now.","o":["sing","to sing","sings"],"a":0,"e":"hear sb. do 表听见全过程，宾补用不带 to 的动词原形 sing；若强调「正在唱」则用 singing。"}]}

,{"id":"s21","t":"'Just one more month,' he said to himself.","cn":"「再多一个月。」他心里暗想。","sent":true,"s":"ok","tags":["直接引语","反身代词"],

"note":["say to oneself 自言自语/心里想","直接引语的用法"],
"expand":["<span class='en'>one more month = another month</span> 再一个月；<span class='en'>another + 数词 + 复数名词</span> = <span class='en'>数词 + more + 复数名词</span>：<span class='en'>another two apples = two more apples</span>（单词第 26 条）。","<strong>直接引语标点</strong>：引号内的句末标点放在引号<strong>内</strong>；<span class='en'>'I can do it,' he said to himself.</span> 引语后 <span class='en'>he said</span> 用逗号隔开、said 小写。","转成间接引语：<span class='en'>He said to himself that he only had one more month.</span> 注意人称与时态的变化（了解）。","<span class='en'>say / speak / tell / talk</span> 四词辨析与反身代词表见短语第 32 条。"],

{"id":"s22","t":"To everyone's surprise, he was the winner.","cn":"令所有人惊讶的是，他是获胜者。","sent":true,"s":"ok","tags":["固定短语","构词法"],
"core":"<b>to one's surprise</b> 令某人惊讶的是；<b>winner</b> = win + n + er（<strong>双写 n</strong>）。",
"check":"✅ 核对无误：考点与句子都正确。补一个拼写点：winner 的 n 要双写，很多孩子会写成 winer。",

"expand":["<span class='en'>win — won — winner</span>；重读闭音节结尾、末尾只有一个辅音字母时双写：<span class='en'>win → winner</span>、<span class='en'>run → runner</span>、<span class='en'>swim → swimmer</span>、<span class='en'>begin → beginning</span>（单词第 4 条）。","<span class='en'>to everyone's surprise</span> 中 <span class='en'>everyone's</span> 是不定代词的所有格；同类 <span class='en'>to my / his / Tom's surprise</span>（短语第 33 条）。","<span class='en'>win + 比赛 / 奖品</span>（<span class='en'>win the game / win first prize</span>）vs <span class='en'>beat + 对手</span>（<span class='en'>beat the other team</span>），这是高频辨析。","<span class='en'>the winner</span> 与 <span class='en'>the loser</span>（失败者）成对记。"],
"confuse":"<span class='en'>win</span> 的宾语是「比赛、奖项」，<span class='en'>beat / defeat</span> 的宾语是「人 / 队伍」；<span class='en'>winner</span> 双写 n，别漏。",
"ex":[{"q":"Our team ______ the match and became the ______.","o":["won; winner","beat; winner","won; winer"],"a":0,"e":"宾语 the match 是比赛，用 win（过去式 won）；「获胜者」是 winner，末尾 n 要双写。"}]},
{"id":"s23","t":"The hen laid an egg early this morning.","cn":"这只母鸡今天早上下了一个蛋。","sent":true,"s":"ok","tags":["lie / lay"],

"ex":[{"q":"The hen ______ an egg this morning, and the farmer ______ it in the box.","o":["lay; lay","laid; laid","lied; laid"],"a":1,"e":"两个动作都是「下蛋 / 放置」的过去式，都用 laid；lay 是原形或 lie(躺) 的过去式，lied 是「撒谎」。"}]},
{"id":"s24","t":"It looked everywhere for its glasses, but still couldn't find them.","cn":"它到处找它的眼镜，但还是找不到。","sent":true,"s":"ok","tags":["look for / find"],
"core":"<b>look for</b> 强调<strong>寻找的过程</strong>；<b>find</b> 强调<strong>找到的结果</strong>；<b>everywhere</b> 到处；glasses 复数用 them 指代。",
"check":"✅ 核对无误：三个考点与句子都正确。<span class='en'>looked everywhere for ... but ... couldn't find them</span> 把「过程 vs 结果」对比演示得很到位。",
"note":["look for 强调寻找过程；find 强调结果；everywhere 到处"],

{"id":"s25","t":"To Tom's surprise, his father bought him a brand-new bike as his birthday gift.","cn":"令汤姆惊讶的是，他爸爸给他买了一辆崭新的自行车作为生日礼物。","sent":true,"s":"ok","tags":["双宾语","as"],

"ex":[{"q":"His father bought a new bike ______ him as a birthday gift.","o":["to","for","with"],"a":1,"e":"buy sth. for sb. 是双宾语改写形式，用介词 for；to 用于 give / tell / send 等动词。"}]},
{"id":"s26","t":"A few hours later, he finally succeeded in climbing to the top of the mountain.","cn":"几个小时后，他终于成功爬上了山顶。","sent":true,"s":"ok","tags":["时间表达","固定搭配"],

"tip":"另外三个规则的别记错：<b>lie(撒谎) → lied → lied</b>、<b>lay(放置/下蛋) → laid → laid</b>、<b>promise → promised</b>。搭配速记卡 ① 一起背。"},
{"title":"⑪ 双宾语 & 不可数名词","head":["类别","成员","改写 / 规则"],"rows":[
["可接 sb. sth.","give, tell, show, teach, send, buy, make, cook, get","give sb. sth. = give sth. <b>to</b> sb.；buy sb. sth. = buy sth. <b>for</b> sb."],
["<b>不能</b>接双宾语","explain, describe, introduce, say, suggest, report","必须用 <b>sth. to sb.</b>：explain this word to me ✓ / explain me this word ✗"],
["不可数名词","progress, homework, information, advice, news, weather, furniture, money, music, milk, experience(经验)","不加 a、不加 -s；用 much / a lot of / a little 修饰"],
["常考固定搭配","make progress, take one's temperature, keep a diary, make a mistake, make a promise, have a break","搭配里的冠词 / 物主代词不能随意换"],
["比较级","little → less → least / few → fewer → fewest / much·many → more → most","less + 不可数，fewer + 可数复数"]],
"tip":"注意 <span class='en'>take one's temperature</span> 里 temperature 是<strong>可数</strong>用法——这正是检验报告里「temperature 不可笼统标为不可数」的原因。对应单词第 18 / 22 条、短语第 34 条、易错句第 16 / 25 / 27 / 30 句。"}
]
}
</script>

<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById("DATA").textContent);
  var $ = function(s){ return document.querySelector(s); };
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  }); };
  var store = {
    get: function(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
    set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };
  var SECTIONS = D.sections;
  var ALL = [];
  SECTIONS.forEach(function(s){ s.items.forEach(function(it){ ALL.push(it); }); });
  var ALL_EX = [];
  ALL.forEach(function(it){ (it.ex || []).forEach(function(e, i){
    ALL_EX.push({ q:e.q, o:e.o, a:e.a, e:e.e, from:it.t, id:it.id + "#" + i });
  }); });
  var state = {
    view: "words", q: "", filter: "all",
    open: new Set(),
    mastered: new Set(store.get("eng7_mastered", [])),
    answers: store.get("eng7_answers", {}),
    cheat: 0,
    quiz: null
  };
  var FILTERS = [
    {k:"all",   t:"全部",       c:"var(--brand)"},
    {k:"ok",    t:"✅ 核对无误", c:"var(--ok)"},
    {k:"warn",  t:"🟡 需留意",   c:"var(--warn)"},
    {k:"fix",   t:"🔴 已修正",   c:"var(--fix)"},
    {k:"todo",  t:"⭐ 未掌握",   c:"var(--teal)"},
    {k:"done",  t:"✓ 已掌握",   c:"var(--teal)"}
  ];
  var STATUS = {ok:{t:"✅ 核对无误",c:"ok"}, warn:{t:"🟡 需留意",c:"warn"}, fix:{t:"🔴 已修正",c:"fix"}};

  /* ---------- 顶部统计 ---------- */
  function renderStats(){
    var fixes = ALL.filter(function(i){return i.s === "fix";}).length;
    var warns = ALL.filter(function(i){return i.s === "warn";}).length;
    var arr = [
      [ALL.length, "条考点逐条核对"],
      [fixes, "处表述已修正"],
      [warns, "处表述需澄清"],
      [ALL_EX.length, "道交互例题"]
    ];
    $("#stats").innerHTML = arr.map(function(a){
      return '<div class="stat"><div class="n">' + a[0] + '</div><div class="l">' + a[1] + '</div></div>';
    }).join("");
  }

  function renderChips(){
    $("#chips").innerHTML = FILTERS.map(function(f){
      return '<button class="chip' + (state.filter === f.k ? " on" : "") + '" data-action="filter" data-k="' + f.k + '">' +
        '<span class="dot" style="background:' + f.c + '"></span>' + f.t + '</button>';
    }).join("");
  }

  function renderTabs(){
    var t = SECTIONS.map(function(s){
      return '<button class="tab' + (state.view === s.key ? " on" : "") + '" data-action="view" data-k="' + s.key + '">' +
        s.title + '<small>' + s.items.length + ' 条</small></button>';
    });
    t.push('<button class="tab' + (state.view === "report" ? " on" : "") + '" data-action="view" data-k="report">🔎 检验报告</button>');
    t.push('<button class="tab' + (state.view === "cheats" ? " on" : "") + '" data-action="view" data-k="cheats">🗂️ 速记卡片</button>');
    $("#tabs").innerHTML = t.join("");
  }

  function renderProg(){
    var pct = ALL.length ? Math.round(state.mastered.size / ALL.length * 100) : 0;
    $("#prog").innerHTML = '掌握进度 <b>' + state.mastered.size + ' / ' + ALL.length + '</b>（' + pct + '%）' +
      '<div class="track"><i style="width:' + pct + '%"></i></div>' +
      '<span style="font-size:12px">点击卡片右上角 ★ 标记已掌握</span>';
  }

  /* ---------- 卡片 ---------- */
  function block(cls, icon, title, body){
    return '<div class="block ' + cls + '"><div class="blk-t"><span class="bi">' + icon + '</span>' + title + '</div><div class="blk-body">' + body + '</div></div>';
  }
  function ul(arr){
    return '<ul>' + arr.map(function(x){ return '<li>' + x + '</li>'; }).join("") + '</ul>';
  }
  function renderEx(it){
    if (!it.ex || !it.ex.length) return "";
    var html = '<div class="block b-ex"><div class="blk-t"><span class="bi">✎</span>例题 · 点击选项立即判分</div>';
    html += it.ex.map(function(e, i){
      var key = it.id + "#" + i;
      var picked = state.answers[key];
      var answered = picked !== undefined;
      var opts = e.o.map(function(o, oi){
        var cls = "opt";
        if (answered){
          if (oi === e.a) cls += " right";
          else if (oi === picked) cls += " wrong";
          else cls += " dim";
        }
        return '<button class="' + cls + '" data-action="answer" data-key="' + esc(key) + '" data-oi="' + oi + '">' +
          '<span class="k">' + "ABCD".charAt(oi) + '.</span>' + esc(o) + '</button>';
      }).join("");
      return '<div class="ex"><div class="ex-q"><span class="no">' + (i + 1) + '</span><span class="en">' + esc(e.q) + '</span></div>' +
        '<div class="opts">' + opts + '</div>' +
        '<div class="ex-e' + (answered ? " show" : "") + '">💡 ' + esc(e.e) + '</div></div>';
    }).join("");
    return html + '</div>';
  }
  function renderCard(it, n){
    var st = STATUS[it.s] || STATUS.ok;
    var isOpen = state.open.has(it.id);
    var done = state.mastered.has(it.id);
    var sent = it.sent === true;
    var tags = (it.tags || []).map(function(t){ return '<span class="badge tag">' + esc(t) + '</span>'; }).join("");
    var h = '<article class="card' + (isOpen ? " open" : "") + (done ? " done" : "") + '" data-s="' + it.s + '" data-id="' + esc(it.id) + '">';
    h += '<div class="card-head" data-action="toggle" data-id="' + esc(it.id) + '">' +
      '<div class="idx">' + (n + 1) + '</div>' +
      '<div class="ttl"><h3 class="' + (sent ? "sent" : "") + '">' + esc(it.t) + '</h3><p>' + esc(it.cn) + '</p></div>' +
      '<div class="badges"><span class="badge ' + st.c + '">' + st.t + '</span>' + tags + '</div>' +
      '<div class="acts"><button class="star' + (done ? " on" : "") + '" data-action="master" data-id="' + esc(it.id) + '" title="标记已掌握">' + (done ? "★" : "☆") + '</button><span class="chev">⌄</span></div>' +
      '</div>';
    h += '<div class="core">' + it.core + '</div>';
    h += '<div class="detail' + (isOpen ? "" : " collapsed") + '">';
    var checkCls = it.s === "fix" ? "b-fix" : (it.s === "warn" ? "b-warn" : "b-check");
    var checkIcon = it.s === "fix" ? "!" : (it.s === "warn" ? "?" : "✓");
    h += block(checkCls, checkIcon, "逐条核对结论", it.check);
    if (it.fix) {
      h += '<div class="correction">' +
        '<div class="corr-line bad"><span class="lbl">原表述</span><span>' + it.fix.bad + '</span></div>' +
        '<div class="corr-line good"><span class="lbl">建议改为</span><span>' + it.fix.good + '</span></div>' +
        '</div>';
    }
    if (it.note && it.note.length) h += block("b-note", "≡", "原笔记要点", ul(it.note));
    if (it.expand && it.expand.length) h += block("b-exp", "＋", "拓展用法 / 补充", ul(it.expand));
    if (it.confuse) h += block("b-con", "⇄", "易错易混辨析", it.confuse);
    h += renderEx(it);
    h += '</div></article>';
    return h;
  }

  /* ---------- 主列表 ---------- */
  function matches(it){
    if (state.filter === "todo" && state.mastered.has(it.id)) return false;
    if (state.filter === "done" && !state.mastered.has(it.id)) return false;
    if (["ok","warn","fix"].indexOf(state.filter) >= 0 && it.s !== state.filter) return false;
    if (state.q){
      var hay = [it.t, it.cn, it.core, it.check, it.confuse]
        .concat(it.note || [], it.expand || [], it.tags || [])
        .concat((it.ex || []).map(function(e){ return e.q + e.o.join(""); }))
        .join(" ").toLowerCase();
      if (hay.indexOf(state.q.toLowerCase()) < 0) return false;
    }
    return true;
  }
  function renderList(){
    if (state.view === "report"){ renderReport(); return; }
    if (state.view === "cheats"){ renderCheats(); return; }
    var sec = SECTIONS.filter(function(s){ return s.key === state.view; })[0];
    if (!sec) return;
    var items = sec.items.filter(matches);
    var head = '<div class="sec-head"><h2>' + sec.title + '</h2><span class="desc">' + sec.sub + '</span>' +
      '<span class="count">显示 ' + items.length + ' / ' + sec.items.length + ' 条</span></div>';
    $("#list").innerHTML = head + (items.length
      ? items.map(function(it){ return renderCard(it, sec.items.indexOf(it)); }).join("")
      : '<div class="empty"><div class="big">🔍</div>没有匹配的条目，换个关键词或筛选条件试试。</div>');
  }

  /* ---------- 检验报告 ---------- */
  function revBlock(r, kind){
    return '<div class="rev ' + kind + '"><div class="rh"><b>' + r.title + '</b><span class="pos">' + r.pos + '</span></div>' +
      '<div class="rl bad"><span class="t">原表述</span><span class="c">' + r.bad + '</span></div>' +
      '<div class="rl good"><span class="t">建议改为</span><span class="c">' + r.good + '</span></div>' +
      '<div class="rl why"><span class="t">原因</span><span class="c">' + r.why + '</span></div></div>';
  }
  function renderReport(){
    var R = D.report;
    var h = '<div class="sec-head"><h2>🔎 逐条检验报告</h2><span class="desc">先看结论，再回卡片看细节</span></div>';
    h += '<div class="panel"><h3>整体结论</h3><p class="lead">共核对 <b>' + ALL.length + '</b> 条（核心单词 28 · 重点短语 34 · 易错句子 30）。' +
      '笔记整体质量很高：绝大多数释义、变形、搭配、例句和考点标注都准确。发现 <b style="color:var(--fix)">' + R.fixes.length + '</b> 处需要修正、' +
      '<b style="color:var(--warn)">' + R.clarify.length + '</b> 处表述需要澄清，另补了一批七上期中高频但笔记未覆盖的考点。</p>' +
      '<div class="tip">💡 建议：把下面「已修正」的 3 处直接改到孩子原笔记上，其余条目按卡片里的「拓展 / 例题」过一遍即可。</div></div>';
    h += '<div class="panel"><h3 style="color:var(--fix)">🔴 需要修正（' + R.fixes.length + ' 处）</h3><p class="lead">这几处会直接影响做题判断，优先改。</p>' +
      R.fixes.map(function(r){ return revBlock(r, "fix"); }).join("") + '</div>';
    h += '<div class="panel"><h3 style="color:var(--warn)">🟡 表述需澄清（' + R.clarify.length + ' 处）</h3><p class="lead">不算错，但按原话记容易在考试里丢分，建议补完整。</p>' +
      R.clarify.map(function(r){ return revBlock(r, "warn"); }).join("") + '</div>';
    h += '<div class="panel"><h3>🟢 重要补充清单</h3><p class="lead">笔记未涉及、但同单元高频考查的内容，已写进各条卡片的「拓展用法」与速记卡片。</p>' +
      '<div class="miss-grid">' + R.missing.map(function(m){
        return '<div class="miss"><b>' + m.t + '</b><br>' + m.d + '</div>';
      }).join("") + '</div></div>';
    $("#list").innerHTML = h;
  }

  /* ---------- 速记卡片 ---------- */
  function renderCheats(){
    var C = D.cheats;
    var h = '<div class="sec-head"><h2>🗂️ 速记卡片</h2><span class="desc">把易混点放一起记，考前 5 分钟过一遍</span></div>';
    h += '<div class="panel"><div class="cheat-tabs">' + C.map(function(c, i){
      return '<button class="ctab' + (state.cheat === i ? " on" : "") + '" data-action="cheat" data-i="' + i + '">' + esc(c.title) + '</button>';
    }).join("") + '</div>';
    var c = C[state.cheat] || C[0];
    if (c){
      h += '<h3>' + esc(c.title) + '</h3><div class="tbl-wrap"><table><thead><tr>' +
        c.head.map(function(x){ return '<th>' + esc(x) + '</th>'; }).join("") + '</tr></thead><tbody>' +
        c.rows.map(function(r){ return '<tr>' + r.map(function(x){ return '<td>' + x + '</td>'; }).join("") + '</tr>'; }).join("") +
        '</tbody></table></div>';
      if (c.tip) h += '<div class="tip">💡 ' + c.tip + '</div>';
    }
    h += '</div>';
    $("#list").innerHTML = h;
  }

  /* ---------- 自测 ---------- */
  function shuffle(a){
    var x = a.slice();
    for (var i = x.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = x[i]; x[i] = x[j]; x[j] = t; }
    return x;
  }
  function startQuiz(){
    var qs = shuffle(ALL_EX).slice(0, 10);
    state.quiz = {qs:qs, i:0, right:0, picked:null, wrong:[]};
    $("#quizMask").classList.remove("hidden");
    renderQuiz();
  }
  function renderQuiz(){
    var z = state.quiz;
    if (!z) return;
    $("#quizProg").textContent = (z.i + 1) + " / " + z.qs.length;
    $("#quizBar").style.width = Math.round(z.i / z.qs.length * 100) + "%";
    if (z.i >= z.qs.length){
      var pct = Math.round(z.right / z.qs.length * 100);
      var msg = pct >= 90 ? "太棒了，这些易错点基本拿下了！" : pct >= 70 ? "不错，把错题对应的卡片再过一遍。" : "别急，回卡片把「辨析」和「例题」重做一遍。";
      var h = '<div class="q-score"><div class="big">' + z.right + ' / ' + z.qs.length + '</div><div class="msg">' + msg + '</div></div>';
      if (z.wrong.length){
        h += '<div style="text-align:left"><b>错题回顾</b>' + z.wrong.map(function(w){
          return '<div class="q-wrong"><b>' + esc(w.q) + '</b><br>正确答案：' + "ABCD".charAt(w.a) + '. ' + esc(w.o[w.a]) + '<br>' + esc(w.e) + '<br><span style="color:var(--muted)">来源：' + esc(w.from) + '</span></div>';
        }).join("") + '</div>';
      }
      h += '<div class="q-actions"><button class="btn primary" data-action="quiz-start">🔁 再来一组</button><button class="btn" data-action="quiz-close">返回复习</button></div>';
      $("#quizBody").innerHTML = h;
      $("#quizBar").style.width = "100%";
      $("#quizProg").textContent = "已完成";
      return;
    }
    var e = z.qs[z.i];
    var h = '<div class="q-title"><span class="en">' + esc(e.q) + '</span></div><div class="q-src">来自：' + esc(e.from) + '</div><div class="opts">';
    h += e.o.map(function(o, i){
      var cls = "opt";
      if (z.picked !== null){
        if (i === e.a) cls += " right";
        else if (i === z.picked) cls += " wrong";
        else cls += " dim";
      }
      return '<button class="' + cls + '" data-action="quiz-answer" data-oi="' + i + '"><span class="k">' + "ABCD".charAt(i) + '.</span>' + esc(o) + '</button>';
    }).join("");
    h += '</div>';
    if (z.picked !== null){
      h += '<div class="ex-e show">💡 ' + esc(e.e) + '</div>' +
        '<div class="q-actions"><button class="btn primary" data-action="quiz-next">' + (z.i === z.qs.length - 1 ? "查看结果 →" : "下一题 →") + '</button></div>';
    }
    $("#quizBody").innerHTML = h;
  }

  /* ---------- 事件 ---------- */
  document.addEventListener("click", function(ev){
    var el = ev.target.closest("[data-action]");
    if (!el) return;
    var a = el.getAttribute("data-action"), k, id;
    if (a === "toggle"){
      id = el.getAttribute("data-id");
      if (state.open.has(id)) state.open.delete(id); else state.open.add(id);
      renderList();
    } else if (a === "master"){
      ev.stopPropagation();
      id = el.getAttribute("data-id");
      if (state.mastered.has(id)) state.mastered.delete(id); else state.mastered.add(id);
      store.set("eng7_mastered", Array.from(state.mastered));
      renderList(); renderProg();
    } else if (a === "view"){
      state.view = el.getAttribute("data-k"); renderTabs(); renderList();
      window.scrollTo({top: $("#tabs").offsetTop - 16, behavior:"smooth"});
    } else if (a === "filter"){
      state.filter = el.getAttribute("data-k"); renderChips(); renderList();
    } else if (a === "expand-all"){
      SECTIONS.filter(function(s){ return s.key === state.view; }).forEach(function(s){ s.items.forEach(function(i){ state.open.add(i.id); }); });
      renderList();
    } else if (a === "collapse-all"){
      state.open.clear(); renderList();
    } else if (a === "answer"){
      k = el.getAttribute("data-key");
      state.answers[k] = parseInt(el.getAttribute("data-oi"), 10);
      store.set("eng7_answers", state.answers);
      renderList();
    } else if (a === "theme"){
      var cur = document.documentElement.getAttribute("data-theme");
      var next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      store.set("eng7_theme", next);
    } else if (a === "print"){
      window.print();
    } else if (a === "cheat"){
      state.cheat = parseInt(el.getAttribute("data-i"), 10); renderCheats();
    } else if (a === "quiz-start"){
      startQuiz();
    } else if (a === "quiz-close"){
      $("#quizMask").classList.add("hidden"); state.quiz = null;
    } else if (a === "quiz-answer"){
      var z = state.quiz; if (!z || z.picked !== null) return;
      z.picked = parseInt(el.getAttribute("data-oi"), 10);
      if (z.picked === z.qs[z.i].a) z.right++; else z.wrong.push(z.qs[z.i]);
      renderQuiz();
    } else if (a === "quiz-next"){
      state.quiz.i++; state.quiz.picked = null; renderQuiz();
    }
  });

  $("#q").addEventListener("input", function(e){ state.q = e.target.value.trim(); renderList(); });
  document.addEventListener("keydown", function(e){
    if (e.key === "/" && document.activeElement !== $("#q")){ e.preventDefault(); $("#q").focus(); }
    if (e.key === "Escape"){
      if (!$("#quizMask").classList.contains("hidden")){ $("#quizMask").classList.add("hidden"); state.quiz = null; }
      else { $("#q").value = ""; state.q = ""; renderList(); }
    }
  });
  window.addEventListener("scroll", function(){
    $("#toTop").style.display = window.scrollY > 500 ? "block" : "none";
  });
  $("#toTop").addEventListener("click", function(){ window.scrollTo({top:0, behavior:"smooth"}); });
  window.addEventListener("beforeprint", function(){
    document.documentElement.setAttribute("data-theme", "light");
  });

  /* ---------- init ---------- */
  var theme = store.get("eng7_theme", "light");
  document.documentElement.setAttribute("data-theme", theme);
  (function(){
    var d = $("#dots"), s = "";
    for (var i = 0; i < 22; i++){
      s += '<i style="left:' + (4 + Math.random() * 92).toFixed(1) + '%;top:' + (8 + Math.random() * 78).toFixed(1) + '%;animation-delay:' + (Math.random() * 5).toFixed(1) + 's"></i>';
    }
    d.innerHTML = s;
  })();
  renderStats(); renderChips(); renderTabs(); renderProg(); renderList();
})();
</script>
</body>
</html>
