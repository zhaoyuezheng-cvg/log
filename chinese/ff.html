<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七年级作文范文集</title>
<!---deepseek 网页版生成 -->
<style>
  :root{
    --serif: "Songti SC","STSong","SimSun","Source Han Serif SC","Noto Serif CJK SC","Noto Serif SC",serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;

    --bg:#faf7f2;
    --bg-side:#f3ede4;
    --card:#fffdf9;
    --text:#2b2825;
    --text-soft:#7a7066;
    --line:#e6ded2;
    --accent:#a95f3f;
    --accent-soft:#f2e5da;
    --shadow:0 10px 34px rgba(90,66,44,.10);
  }
  html[data-theme="dark"]{
    --bg:#171614;
    --bg-side:#1e1c19;
    --card:#211f1c;
    --text:#dcd6cc;
    --text-soft:#988e82;
    --line:#302c27;
    --accent:#d59473;
    --accent-soft:#2b2621;
    --shadow:0 10px 34px rgba(0,0,0,.45);
  }

  *,*::before,*::after{box-sizing:border-box;}

  html,body{margin:0;padding:0;height:100%;}

  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    transition:background .3s ease,color .3s ease;
  }

  /* ============ 侧边栏 ============ */
  .sidebar{
    position:fixed;
    top:0;left:0;bottom:0;
    width:296px;
    background:var(--bg-side);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    z-index:60;
    transition:transform .32s cubic-bezier(.4,0,.2,1), background .3s ease;
  }

  .brand{
    padding:24px 22px 16px;
    border-bottom:1px solid transparent;
  }
  .brand h1{
    margin:0;
    font-size:17px;
    font-weight:700;
    letter-spacing:.08em;
    font-family:var(--serif);
  }
  .brand p{
    margin:7px 0 0;
    font-size:11.5px;
    color:var(--text-soft);
    letter-spacing:.06em;
  }

  .search-wrap{padding:14px 16px 10px;}
  .search-box{position:relative;}
  .search-box svg{
    position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;stroke:var(--text-soft);fill:none;stroke-width:2;
    pointer-events:none;
  }
  .search-box input{
    width:100%;
    padding:9px 12px 9px 32px;
    font-size:13px;
    font-family:var(--sans);
    color:var(--text);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    outline:none;
    transition:.18s;
  }
  .search-box input::placeholder{color:var(--text-soft);opacity:.8;}
  .search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

  .toc{
    flex:1;
    overflow-y:auto;
    padding:6px 12px 30px;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  .toc::-webkit-scrollbar{width:6px;}
  .toc::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

  .group-title{
    display:flex;
    align-items:center;
    gap:9px;
    margin:20px 8px 7px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.14em;
    color:var(--text-soft);
  }
  .group-title::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .toc-item{
    display:block;
    padding:8px 12px;
    border-radius:9px;
    text-decoration:none;
    color:var(--text);
    font-size:13.5px;
    line-height:1.45;
    border-left:2.5px solid transparent;
    transition:background .16s,color .16s,border-color .16s;
  }
  .toc-item:hover{background:var(--accent-soft);}
  .toc-item.active{
    background:var(--accent-soft);
    border-left-color:var(--accent);
    color:var(--accent);
    font-weight:600;
  }
  .toc-item .note{
    display:block;
    margin-top:2px;
    font-size:11.5px;
    font-weight:400;
    color:var(--text-soft);
    letter-spacing:.02em;
  }
  .toc-item.active .note{color:var(--accent);opacity:.75;}

  .empty-tip{
    padding:30px 14px;
    font-size:12.5px;
    color:var(--text-soft);
    text-align:center;
    line-height:1.8;
  }

  .sidebar-foot{
    padding:12px 20px;
    border-top:1px solid var(--line);
    font-size:11px;
    letter-spacing:.06em;
    color:var(--text-soft);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  /* ============ 主区域 ============ */
  .main{
    margin-left:296px;
    min-height:100vh;
    transition:margin .32s cubic-bezier(.4,0,.2,1);
  }

  .topbar{
    position:sticky;
    top:0;
    z-index:40;
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 26px;
    background:rgba(250,247,242,.88);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  html[data-theme="dark"] .topbar{background:rgba(23,22,20,.88);}

  .crumb{
    flex:1;
    font-size:12.5px;
    color:var(--text-soft);
    letter-spacing:.04em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .crumb b{color:var(--text);font-weight:600;}

  .icon-btn{
    width:34px;height:34px;
    display:inline-flex;align-items:center;justify-content:center;
    border:1px solid var(--line);
    border-radius:9px;
    background:var(--card);
    color:var(--text-soft);
    font-size:14px;
    cursor:pointer;
    transition:.18s;
    flex:none;
  }
  .icon-btn:hover{color:var(--accent);border-color:var(--accent);}
  .icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  #menuBtn{display:none;}

  .progress{
    position:absolute;
    left:0;bottom:-1px;
    height:2px;
    width:0%;
    background:linear-gradient(90deg,var(--accent),transparent);
    transition:width .1s linear;
  }

  /* ============ 文章 ============ */
  .article{
    max-width:768px;
    margin:0 auto;
    padding:52px 34px 130px;
  }

  .article-head{margin-bottom:34px;}

  .cat-badge{
    display:inline-block;
    padding:4px 11px;
    margin-bottom:16px;
    font-size:11.5px;
    letter-spacing:.1em;
    color:var(--accent);
    background:var(--accent-soft);
    border-radius:20px;
  }

  .article-title{
    margin:0;
    font-family:var(--serif);
    font-size:31px;
    font-weight:700;
    line-height:1.4;
    letter-spacing:.03em;
  }

  .article-note{
    margin-top:10px;
    font-size:13px;
    color:var(--text-soft);
    letter-spacing:.05em;
  }

  .meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px 18px;
    margin-top:20px;
    padding-top:18px;
    border-top:1px solid var(--line);
    font-size:12.5px;
    color:var(--text-soft);
  }
  .meta-label{
    color:var(--text-soft);
    opacity:.7;
    margin-right:5px;
  }
  .meta-label::after{content:"·";margin-left:5px;}

  .article-body p{
    font-family:var(--serif);
    font-size:17.5px;
    line-height:2.05;
    letter-spacing:.015em;
    text-align:justify;
    text-indent:2em;
    margin:0 0 1.05em;
  }

  .subhead{
    margin:2.1em 0 1.1em;
    font-family:var(--sans);
    font-size:14px;
    font-weight:700;
    letter-spacing:.14em;
    color:var(--accent);
    text-align:center;
  }
  .subhead::before,.subhead::after{
    content:"—";
    margin:0 10px;
    opacity:.45;
  }

  .epigraph{
    margin:0 0 1.8em;
    padding:14px 18px;
    font-family:var(--serif);
    font-size:15px;
    line-height:1.95;
    color:var(--text-soft);
    background:var(--accent-soft);
    border-left:3px solid var(--accent);
    border-radius:0 8px 8px 0;
    letter-spacing:.02em;
  }

  /* ============ 翻页 ============ */
  .pager{
    display:flex;
    gap:14px;
    margin-top:60px;
    padding-top:28px;
    border-top:1px solid var(--line);
  }
  .pager-btn{
    flex:1;
    min-width:0;
    display:block;
    padding:14px 16px;
    text-decoration:none;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    transition:.18s;
  }
  .pager-btn:hover{
    border-color:var(--accent);
    transform:translateY(-2px);
    box-shadow:var(--shadow);
  }
  .pager-btn .p-label{
    display:block;
    font-size:11px;
    letter-spacing:.12em;
    color:var(--text-soft);
    margin-bottom:6px;
  }
  .pager-btn .p-title{
    display:block;
    font-family:var(--serif);
    font-size:14.5px;
    font-weight:600;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .pager-btn.next{text-align:right;}
  .pager-btn.disabled{visibility:hidden;}

  /* ============ 返回顶部 ============ */
  .to-top{
    position:fixed;
    right:26px;bottom:26px;
    width:42px;height:42px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--text-soft);
    cursor:pointer;
    box-shadow:var(--shadow);
    opacity:0;
    pointer-events:none;
    transform:translateY(10px);
    transition:.25s;
    z-index:45;
  }
  .to-top.show{opacity:1;pointer-events:auto;transform:translateY(0);}
  .to-top:hover{color:var(--accent);border-color:var(--accent);}
  .to-top svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* ============ 遮罩 ============ */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(30,22,14,.4);
    backdrop-filter:blur(2px);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
    z-index:55;
  }
  .overlay.show{opacity:1;pointer-events:auto;}

  /* ============ 响应式 ============ */
  @media (max-width:960px){
    .sidebar{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.18);}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0;}
    #menuBtn{display:inline-flex;}
    .article{padding:32px 20px 110px;}
    .article-title{font-size:24px;}
    .article-body p{font-size:16.5px;line-height:1.98;}
    .topbar{padding:10px 16px;}
    .epigraph{font-size:14.5px;padding:12px 14px;}
    .pager{flex-direction:column;}
    .pager-btn.next{text-align:left;}
    .to-top{right:16px;bottom:16px;}
  }

  @media (max-width:420px){
    .article-title{font-size:21px;}
    .article-body p{font-size:16px;}
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <h1>七年级作文范文集</h1>
    <p>亲情 · 成长 · 相遇 · 往事 · 遇见</p>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="search" placeholder="搜索标题、作者或正文…" autocomplete="off">
    </div>
  </div>
  <nav class="toc" id="toc"></nav>
  <div class="sidebar-foot">
    <span id="countTip">共 0 篇</span>
    <span>仅供参考</span>
  </div>
</aside>

<div class="overlay" id="overlay"></div>

<main class="main">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="目录">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="crumb" id="crumb"></div>
    <button class="icon-btn" id="themeBtn" aria-label="切换主题">
      <svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
    </button>
    <div class="progress" id="progress"></div>
  </header>

  <article class="article" id="article"></article>
</main>

<button class="to-top" id="toTop" aria-label="返回顶部">
  <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script>
/* =========================================================
   数据区：新增作文只需在 ESSAYS 里追加一个对象即可
   id      唯一标识（不要重复）
   category 所属分类（必须是 CATEGORIES 里的一项）
   title    标题
   note     副标题/辨识语（同名作文用来区分，可留空）
   author   作者（可留空）
   school   学校（可留空）
   body     段落数组：普通段落直接写；
            "# 小标题" 表示小标题；
            "> 题记内容" 表示题记
   ========================================================= */

const CATEGORIES = [
  '我们是一家人',
  '那一次，我真……',
  '难忘的成长经历',
  '相识缘分',
  '亲情绵延',
  '假如',
  '藏在……里的友情',
  '往事依依',
  '这天，我回家晚了',
  '餐桌前的谈话',
  '走出校园',
  '遇见'
];

const ESSAYS = [

/* ═══════════ 我们是一家人 ═══════════ */
{
  id:'e01', category:'我们是一家人', title:'我们是一家人', note:'姥姥的老宅',
  author:'魏之涵', school:'北京师范大学三帆中学朝阳学校',
  body:[
    '“清明时节雨纷纷，路上行人欲断魂。”乌云在空中飘荡，与劲风一同锁住了春日的暖阳。面前的一方矮矮的土丘，飘着青烟的三根香，摆放规整的石榴和柿子，似乎就是现在关于姥姥的全部了。',
    '踏进老宅，斑驳墙壁上的那幅十几年前的大合影的相框已经磨损，照片的边角已微微翘起，却记载着一家人的喜眉笑眼；拐角处的楼梯扶手上还绑着姥姥教我系的大红色蝴蝶结，再看却是室迩人远；餐厅中微微残损的圆木桌和旁边几把略微生锈的铁椅子，也因寂寞而无精打采地耷拉着脑袋。一阵风吹过，门口的风铃叮当作响，姥姥如春风般和煦的笑声仿佛又在我耳边响起。',
    '每逢亲人团聚，姥姥总是笑逐颜开，嘴里不停地向我们几个孙辈念叨着：“回来就好！回来就好！姥姥给你们包饺子吃！”听到这话，我总会小跑进厨房里，跟姥姥一起忙碌起来。“姥姥我帮您择菜！”“姥姥我帮您洗菜！”姥姥总是笑得合不拢嘴，慈祥地对我说：“慢点！别伤着了！”不一会儿，姥姥就会像变戏法般端上来一大盘饺子：“饺子来喽！多吃点！多吃点！”亲人们一起吃着火腾腾的饺子，欢声笑语笼罩着整个房间。',
    '走出老宅，小小的院子里杂草丛生，哀叹着无人打理的愁闷；看似高大的柿子树上只零散地悬着几片残叶，羸弱不堪；一排低矮的石榴树上，没有叶子点缀的枝杈无序地生长，也在叫苦不迭。忆往昔，秋天收水果是一项必不可少的活动。那时我一手拿着盆提着剪子，一手抓着网兜，蹦蹦跳跳地跟在姥姥身后，先在茂密的枝叶中找到结着石榴果的枝条，再拿起剪子“咔嚓”一剪，石榴们就一个一个迫不及待地跑进了小盆子里，笑着向我们诉说丰收的喜悦。不一会儿，姥姥又会攀上树准备摘柿子。“沙沙，沙沙”，柿子骨碌碌掉在我们的网兜里，轻轻一闻，香气扑鼻。',
    '快要回屋时，调皮的我总会悄悄地走向小水池，冷不丁地打开水龙头，用手捧水一点点地泼向姥姥。姥姥像是早有准备，一手挡着脸，一手提着衣裙，咯咯笑着：“别闹了，别闹了，姥姥投降！姥姥投降！”看到姥姥笑了，我也会总捂着肚子咯咯笑起来，与姥姥端起垒得高高的水果盆，欢快地回到屋里去……',
    '“滴滴答，滴滴答”，雨水浇灭了幸福的回忆。墓碑上醒目的白字提醒我，姥姥已经离开了我们。我默默抚摸着姥姥的土坟，如同姥姥曾温柔抚摸我的模样。',
    '眼下院子里的果树上又长出了嫩芽，相信到了今年秋天，它们定会再次开花结果；正如我和姥姥，虽然已天人两隔，但我们之间的亲情早已生根发芽开花结果，我们始终是相亲相爱的一家人啊！'
  ]
},
{
  id:'e02', category:'我们是一家人', title:'我们是一家人', note:'家是圆心',
  body:[
    '家是圆心，爸爸、妈妈和我围着圆心走，一家人始终幸福美满。',
    '# 清风摇曳梧桐树的小时候',
    '月亮又悄悄爬上了窗外的梧桐树，我靠在床头。是该听妈妈讲故事的时候了，可是妈妈又去晚餐班了。妈妈是一名老师，每天兢兢业业，总有忙不完的事情。她每次回家，总是伴着匆匆的脚步声，脸上带着紧张的神情，有时怀里还抱着几本厚厚的书。',
    '“妈妈，你不爱我了吗？为什么不在我身边陪着我呢？”我赶忙拉住妈妈的手，她的手上还有白色的粉笔灰。“孩子……”妈妈哽咽了，转过头去，眼里饱含着透明的泪水。她摸了摸我的头，指了指窗外的月亮说：“月儿圆的时候，妈妈就会回来。”',
    '每到夜晚，我就飞快地跑到窗前，不停地寻找那圆圆的月亮——妈妈回来的希望。在梧桐摇曳，月儿圆圆缺缺的岁月里，充满了等待的苦涩和团聚的欢乐。',
    '# 星星点缀夜空的回家路',
    '读初中时，我有时参加晚上的兴趣活动。为了节约时间，让我尽快回到家，爸爸担起了开车接我的任务，他推掉很多应酬，准时等我。看着熟悉又温暖的笑脸，吃着热乎乎的点心，与爸爸说说今天的烦恼和趣事，那条通往家的路上总是充满温馨欢乐。风里飘来槐花的清香，我望着车窗外，黑色的天幕上闪动着一颗颗明亮的星星，星星沿着它的轨迹运行，我们向着家的方向飞驰。',
    '# 白米粥飘香的寒夜',
    '去年寒假的最后两天，妈妈旅游要回来了，说好晚上十点到的，不知怎么延迟了。爸爸关好我的房门，叮嘱我早点睡觉，他自己就在客厅等着。我在半梦半醒间听到一些细碎的声音，是妈妈回来了？我推开房门，果然，客厅里摆满了大包小包。初春的夜里颇有寒意，黑暗的夜晚，家中客厅里亮着一盏橘红的灯，灯下，有两碗热腾腾的白米粥，桌边是我的爸爸妈妈。',
    '看见我，他们惊讶于我居然醒了，随即，爸爸又盛来一碗白米粥，我们一家三口就在寒夜的灯下，一人捧一碗白米粥吃起来，笑容像灯光一样温暖。这碗白米粥啊，特别香甜，特别温暖，一直暖到心窝里，因为，里面有爱的味道。',
    '一路走来，日月轮回，春秋变换，我们一家一直沿着同一个圆心在走，无论风雨，不管苦乐，因为，我们是一家人。'
  ]
},
{
  id:'e03', category:'我们是一家人', title:'我们是一家人', note:'奶奶的康复路',
  body:[
    '> 家人的意义在于我们可以相互搀扶，共同去经历这丰富多彩的人生。——题记',
    '去年四月中旬，阴影笼罩了我的家。',
    '奶奶突发脑出血，抢救后虽性命无虞，却半瘫在床，失去自理能力。以往可以奔走在田野、厨房的人，如今连独自站立都成问题。从震惊到悲伤，种种情绪伴随着整个治疗过程，我清楚地知道：这是奶奶的不幸，更是我们家要共渡的难关。',
    '奶奶出院后，我们全家决定帮助奶奶重新站起来，让她能够下地走路。奶奶是左半边身体瘫痪，完全使不上力。带她去康复中心的路上，奶奶趴在爸爸的背上，左手只能无力地搭着，身体不自觉地朝一边歪斜。到康复中心后，奶奶会经历一上午的针灸、按摩、协同锻炼。其中协同锻炼最为费力，需要有人在旁边搀扶着她，让她先下地站立，再慢慢从走几步到走一段路。',
    '奶奶第一次下地时，我、妈妈、弟弟三个人在旁边搀扶。我扶着右手，妈妈扶着奶奶最无力的左手，弟弟负责站在奶奶背后，用两只手扶正奶奶的腰。奶奶九十几斤的体重全部由我们三个人承担着。我们紧紧扶着她，心被奶奶那只使不上力的左脚牵绊着。奶奶走得不稳，颤颤巍巍、摇摇晃晃。她咬着牙，只走了几步，汗水就沾湿了额前的白发。“真跟小孩儿学走路一样……”她数次用颇为无奈的口吻这样叹息。',
    '可在我们小时候，她是我们强大的依靠，她用宽厚的手掌握着我们的手，牵着我们一步一步用脚探索这未知的天地。后来我们学会了奔跑，但时常摔倒，奶奶会心疼地扶起我们，边给我们拍土边说要用锄头把这块绊倒我们的土锄平。再后来，我们松开了奶奶的手，一个接一个奔向无边的广阔天地，那是奶奶未曾到过的地方。我们也会经历一些奶奶不曾体会的坎坷。我们回家不语忧愁，她却无声安慰，用一顿顿可口的饭菜，疗愈我们疲惫的身心。',
    '岁月可回首，前路犹可期。经过长时间的康复治疗，渐渐地，奶奶只需一人搀扶便可以行走。我记得那天夕阳正好，初夏的风轻柔拂过，奶奶和我一老一少，互相搀扶着，缓慢前进……',
    '有你同行，相互扶助，莫不静好。我们永远是这样相亲相爱的一家人。'
  ]
},

/* ═══════════ 那一次，我真…… ═══════════ */
{
  id:'e04', category:'那一次，我真……', title:'那一次，我真难忘', note:'馄饨摊前的独臂老人',
  author:'张伊', school:'北京师范大学三帆中学朝阳学校',
  body:[
    '> 人们的品格在时光的沙漏中是不会蒙尘的金。——题记',
    '阳光透过窗帘洒下斑驳的光影，我注视着窗台上的照片，陷入了回忆。',
    '那次我和爸爸妈妈一起出游。我们背着行囊，在黄昏时来到一处山脚下。因为错过了直通宾馆的大巴，而我们在的地方离最近的城镇也有百余里，一时间我们束手无策。',
    '正在着急之际，妈妈看到不远处有个村庄，我们赶过去后，见到一位老人正在张罗着馄饨摊。他那佝偻的身体好似一座俯伏的山丘，大地色的皮肤在村头黄色路灯的照射下现出筋脉的痕迹。虽然满脸的皱纹诉说着他年岁已高的事实，但他那坚实的臂膀却透着一股老当益壮的干劲。他身着白背心，像是刚干完活，额头上有细密的汗珠。他了解到我们的困境，便招呼我们来吃馄饨，并邀请我们到他的家过夜。',
    '我们各点了一碗馄饨，爸爸刚准备掏钱，他却摆摆手，爽快地说道：“没什么的，几碗馄饨而已，饿的话我再盛几碗。”',
    '这时，我看到他左小臂被全部截去。我不由得好奇他到底经历了什么，在这么寒冷的秋日，要一个人出来卖馄饨。',
    '馄饨皮薄馅鲜，入口鲜香无比，热乎的馄饨汤驱走了我们身体里的寒气。吃完馄饨后，爸爸问：“老人家，这么冷的天还出来卖馄饨啊？”老人靠在摊铺前，长舒了一口气，将他的故事娓娓道来。',
    '他干这行三十多年了。某一日，他蹬着三轮车带他的妻儿去县城的餐馆吃饭，不料半路出了车祸，妻儿抢救无效双双离世。说到这里时，他伸出自己的断臂，眼中划过一丝惆怅：“当时左臂伤得很严重，为了不恶化危及整条胳膊，只能截去了小臂。但我其实不在乎这只手，而是想着……既然我都半条腿迈进棺材了，更要用仅剩的力气为他人做些什么。”',
    '听着他的诉说，我心中泛起阵阵酸楚，失去了至亲和左小臂的老人，却依旧顽强地活着。',
    '天彻底黑了，老人带我们回了他家，那是个又矮又小的平屋，他给我们铺好了炕，温暖的炕让我们倍感温馨。',
    '次日临行之际，我们和老人拍了一张合影。他又往我们每人手里塞了一盒打包好的馄饨，而后目送我们离开。我回头看着老人矮小佝偻的身影，不禁热泪盈眶。',
    '回家后，我便将这张合影摆在了窗台上。时隔两年，我再次端详这张照片。我想，他大抵已经用勤劳致富，并在继续帮助那些有困难的人。老人没有沉浸在过去伤痛中，而是勇敢地走向新生。他教会我勇于面对成长中的风雨，不畏艰难，努力取得成功。'
  ]
},
{
  id:'e05', category:'那一次，我真……', title:'那一次，我真感动', note:'公交车上的假肢男孩',
  body:[
    '公交车是社会的一个小窗口，人们匆匆在此相聚，转眼又各奔东西，一切都平平常常。但有一件发生在公交车上的小事却让我难以忘怀。',
    '那是去年暑假的一个下午，正值下班高峰期，路上行人如织。公交车上，人声嘈杂，我不由得抱怨着：“这个时间段车上的人可真够多的。”',
    '到了一个站点，车门刚一打开，一个抱孩子的年轻妈妈就被人们挤进了车厢，踉跄着站到了我和另一个男孩的座位旁边。我本想站起来让座，可又想到站着的难受滋味，于是就把脸扭向窗外。而坐在我旁边的那个男孩，却在这时碰了碰我，微笑着对我说：“往里面挪一下，好吗？”我不满地瞥了他一眼，心想：“你又不起来让出座位，你想干吗？”',
    '那位年轻妈妈抱着胖乎乎的小孩，不方便抓车厢顶上的拉环，只能抓着座椅靠背，费力地稳住身子。就在我犹豫之际，身边的男孩突然伸出瘦瘦的双手，向那位年轻的妈妈说：“阿姨，我帮您抱着孩子吧！”我在心里暗笑：“真虚伪，把座位让出来不就得了？”那位年轻妈妈笑了笑，没说什么。男孩有点尴尬地收回了手。真是自讨没趣。',
    '过了一会儿，男孩再次伸出了双手，说：“阿姨，我帮您抱孩子吧！”那位年轻妈妈又冲他笑了笑，说：“不用了，谢谢你。”又过了一会儿，男孩终于扶着椅背站起身来，说：“来，阿姨，您坐这儿吧。”“不用了，不用了。”“没关系的，坐下吧。”说着，男孩硬是把抱小孩的年轻妈妈让到座位上，然后用手指轻刮了一下孩子的鼻尖，冲着孩子做了一个鬼脸，把孩子逗得咯咯笑。',
    '我暂时松了一口气，心里却越来越难受，虽然坐着，但裤子贴到了腿上，很不舒服，第一次体会到坐着比站着还难受的滋味。终于到站了，我站起来走到男孩旁边，准备逃离这个刺到我良心的地方。忽然，公交车猛地一颠簸，我没站稳，一脚踩在那男孩的脚上。我连忙向他道歉，可他竟没反应，有点茫然地看着我。我暗自纳闷：“这人真怪！”',
    '车停稳了，人们蜂拥而下，男孩缓缓地挪向车门。我忍不住又看了他一眼，突然发现他的一条腿直直地朝前挪动着，还发出了轻微的金属响声。我愣住了：“他，他原来是装着假肢的残疾人啊！”'
  ]
},
{
  id:'e06', category:'那一次，我真……', title:'那一次，我真明白了', note:'绿叶的职责',
  body:[
    '> 正是因为有千万绿色的无私奉献，那红色才显得如此娇美。——题记',
    '“你们两个换一下吧。”那个星期天，二胡老师正为乐团比赛排位置，我被调到了首席座位的旁边，而他却坐在了首席。在这个班，我们明明是一起训练的，我的技巧也不比他差，为什么首席的位置不是我？凭什么让我给他当陪衬？看着他嘴角露出的笑容，我心中愤愤不平。',
    '训练还没结束，我便独自离开了。走在回家的路上，刺眼的阳光毫不留情地烘烤着大地，似乎在以热浪嘲讽着我的遭遇。耐不住这炎热，我走到树荫下歇脚。伞状的树冠遮住了太阳，为大地赢得一片阴凉。在这树荫下，天不再是那样的炎热，微风轻拂，让我感到一丝惬意。不经意抬头，繁茂的绿色映入我的眼帘。',
    '是翠绿的叶子。它们随着风飒飒作响，无休无止地摇曳着，仿佛在向我大声诉说着自己的命运：我们从出生起便附着在这棵大树的枝枝杈杈上，用尽自己的一生，接受着每一份阳光，制造着每一份营养，为大树成长和花朵绽放默默地奉献出自己的力量。红色花朵在绿叶映衬下显得更加娇美，大树在绿色叶片的装饰下也显得格外挺拔。骄阳下的行人都愿意躲到树下纳凉，躲过烈阳的炙烤，在绿叶营造的阴凉环境下欣赏红花的娇艳。',
    '看着看着，我顿悟了！',
    '在乐团中，数种乐器相互配合，才能合奏出和谐的乐章。正如同树干、红花与绿叶相互配合，才会有这样繁茂的景象。坐不坐在首席位上有什么重要的呢？一场成功的表演，首席固然重要，但每一个参与者，不正像绿叶之于大树，又怎能缺得了呢？',
    '想到这里，我没有一丝犹豫，快步走出了阴凉，转身又朝着训练基地跑去。嫉妒与不满早已被我抛在脑后，心中只剩下一个想法：我要履行好自己“绿叶”的职责！',
    '接下来的训练很辛苦，但也很欢乐。我知道，我是一枚小小的“绿叶”，正是你付出，我付出，我们才会奏响一曲曲打动人心的乐章。'
  ]
},

/* ═══════════ 难忘的成长经历 ═══════════ */
{
  id:'e07', category:'难忘的成长经历', title:'花开不如期', note:'迟来的桂花',
  author:'陶宸熠', school:'北京大学附属中学',
  body:[
    '八月到了，桂花没有开。',
    '我徘徊在院子门口，在桂花树的叶片间寻找着米黄色的花苞，想象着它能在一夜间爆出满树的芬芳。然而，今年的桂花树让我失望了。那密密的绿叶间点缀着一些不显眼的花苞，似乎失去了盛放的勇气。发生了什么呢？',
    '回忆翻滚——',
    '春光来临的时候，桂花树像往年一样冒出新芽，然后在时光里摇身一变，让满树的绿意和盛夏撞了个满怀。我满心期待，内心充满无限憧憬。如今，眼前的桂花树却像个还未开战就败下阵来的士兵，空有一身绿色的皮囊。',
    '“桂花不会开了。”',
    '“也许只是时候未到吧。”',
    '“往年的八月，它不都准时开吗？”',
    '“再等等，总会开的。”',
    '这几乎成了我和妈妈每一天的“固定台词”。开或者不开，我们各自坚持着自己的判断。一周过去了，桂花没有动静；半个月过去了，桂花依然没有开放……看着它的模样，我不禁想起了自己：渴望在学习上能“春风得意马蹄疾”，期盼成绩能“扶摇直上九万里”，而新学期开始我的成绩却依然平平……这棵桂花树，不正是我当下的写照吗？',
    '中秋夜，月光如洁白的水袖覆在门前的桂花树上，映出了一地青黛的影子。突然，我的鼻尖捕捉到了一丝淡淡的桂花香。我起先疑惑，旋而惊喜，桂花！我赶紧用眼睛在绿叶间搜寻，果然，在一个不起眼的枝头上，我发现了最先开放的几朵桂花。它们小巧的样子惹人怜爱，我为自己早些时候的怀疑而感到满心愧疚。我轻轻凑近它们，摘下一朵放在手心，细细嗅着，那淡淡的香气从鼻尖流淌到心尖。这迟来的桂花是想告诉我什么吗？',
    '我心神一荡：也许，花开不如期，但美好终将到达。花如此，人亦然。我何必因为当下的平凡而自我怀疑呢？我相信，只要面朝希望的大海，终会有梦想的花开！花开虽不如期，但梦想不会失约——这才是真正的少年心啊！'
  ]
},
{
  id:'e08', category:'难忘的成长经历', title:'一路阳光一路情', note:'妈妈的便利贴',
  body:[
    '> 蓦然回首，才发现，原来我寻找的阳光一直照在我身上……——题记',
    '“要你管？烦不烦啊！”一脸不耐烦的我“砰”的一声摔上了房门，把妈妈关在屋外。',
    '发泄过后，我顿时失去了力气，靠着门滑坐到地上，泪水一颗一颗滑落。我是怎么了？我问自己。屋子里静悄悄的，没有人回答，只有几尾病恹恹的鱼在鱼缸里无力地摆动着尾巴。',
    '看着它们，白天发生的事浮上心头……',
    '我和我最好的朋友吵架了。前几天我借给她几本书，今天她却把涂得乱七八糟的书还给了我。我问她怎么回事，她说是她小表弟画的，不关她的事……就这样，我们吵了起来。',
    '闷闷不乐的我拖着沉重的脚步推开了家门。妈妈看见我，很自然地接过我的书包，关切地问我：“上了一天学，累不累？”本来温暖的话语却让我感到一阵烦躁，我转过身来大声吼她：“要你管？烦不烦啊！”看着妈妈意外的表情，我突然有些内疚。为了掩饰内心的慌乱，我摔上了房门……',
    '刚摔上房门，我就后悔了：我怎么能这样对待生我养我的妈妈？怎么能把怒气发泄在她身上呢？我劝自己：下一秒就去道歉。可是，眼看着时间一分一秒过去了，我还是开不了口……',
    '一夜无眠。',
    '优美的钢琴声响起，在这个寂静的早晨显得有些突兀。睡眼惺忪的我按停了还在响的闹钟，音乐顿时停止了。一阵香气适时地传来，一缕阳光透过窗帘的缝隙射进了房间，床头柜上放着一杯热气腾腾的牛奶，旁边还有一张便利贴：“不管昨天发生了什么不开心的事情，都忘记它吧。希望今天的你是快乐的！——爱你的妈妈。”',
    '看着那仿佛还带着温度的字迹，我的眼睛湿润了……不知从什么时候起，我变得这么爱哭了……我迫不及待地打开房门，对着妈妈的背影喊道：“妈妈，我会的！”',
    '何必苦苦寻觅阳光？在我们成长的道路上，父母的关爱就像阳光一样，一路陪伴，一路呵护，一直暖暖地照在我们身上！'
  ]
},
{
  id:'e09', category:'难忘的成长经历', title:'让我试一试', note:'攀登泰山',
  body:[
    '“岱宗夫如何？齐鲁青未了。”琅琅的书声随风飘向窗外，也激荡起了我内心的波澜，诗歌里泰山的巍峨挺拔和秀丽编织出我对它的憧憬。',
    '“妈，带我去泰山好不好？我好想爬泰山啊……”我抓着妈妈的衣服不断地央求道。“泰山太高了，你还太小，等你长大再爬，好不好？”妈妈蹲下身试图劝服我。“您让我试试好不好？”不知怎的，我好像有一份执念。在我的央求下，妈妈终于答应了，于是我站在了泰山脚下。',
    '我抬头向上看去，泰山只是静静地与我对望。在我眼中，泰山不孤傲，也不是生人勿近的样子，而是像一位整装的将军屹立在此，欢迎着我的到来。依旧是那身绿铠甲，依旧是那条云腰带。我迫不及待地向上爬去，期待这位“将军”带我领略他的“造化钟神秀”。',
    '没过多久，我感受到了“将军”的威严。疲惫替代了激动，我重重地喘着粗气，速度越来越慢，脚底板的疼痛越来越强烈。妈妈看出我体力不支了：“要不我们坐个缆车？”我咬牙：“您让我试一试。”或许是对巍峨泰山的尊重，又或许是给自己的挑战，抱着那一份执念，我选择继续攀登。',
    '山太高了，劳累和疼痛拉扯着我的理智，放弃的念头像气球一样不断膨胀。看着依旧不见尽头的阶梯，我头上的汗珠不断滴落，回头望着走过的阶梯，又何尝不是不见尽头呢？雨果说过：“所谓活着的人，就是不断挑战的人，不断攀登命运峻峰的人。”看到妈妈担忧的眼神，我挤出了一个微笑：“让我试一试，我可以的！”',
    '我试着调整呼吸，尽量找到适合自己的速度，看着越来越多的岩石露出来，我知道“将军”在向我敞开心扉。停留休息的频率不断增加，身边的景物来了又去，但我未曾放弃，依旧选择向上。',
    '我拖着精疲力竭的身体登上山顶，心中满满的自豪。这份成就感成了恢复体力最好的良药。“将军”教给我尝试和坚持的意义，但我知道，我学会的远不止这些。',
    '眺望远方，是“会当凌绝顶，一览众山小”的气魄；注重脚下，是“纸上得来终觉浅，绝知此事要躬行”的顿悟。'
  ]
},

/* ═══════════ 相识缘分 ═══════════ */
{
  id:'e10', category:'相识缘分', title:'那一声怯怯的“姐姐”', note:'夏日午后的阿瑶',
  body:[
    '世间声响万千，喧嚣嘈杂、热烈洪亮，唯独那个夏日午后的一声轻唤，轻轻落于心底，经年不散。那一声怯怯的“姐姐”，温柔了整个盛夏，也成为我岁月里最澄澈的温暖。',
    '去年盛夏，蝉鸣聒噪，我随母亲回到乡下外婆家。老树枝繁叶茂，浓密的绿荫遮盖了大半庭院，细碎的阳光穿过层层枝叶，在地面织出斑驳的光影。我铺一张凉席坐在树下，静静翻看着手中的书，享受夏日独有的慵懒与安宁。',
    '忽然，院门口传来细碎的响动。我抬眸望去，院门缝隙处探出一个小小的脑袋。小女孩睁着一双黑葡萄般澄澈的眼眸，怯生生地打量着我。她发丝微乱，身上的碎花裙子洗得发白，赤着的小脚微微蜷缩，局促又胆怯，像一只小心翼翼、随时会闪躲的林间小鹿。我放缓语调，温柔地朝她招手，邀她过来落座。她犹豫良久，才踏着细碎的步子，慢慢蹭到我身边。',
    '我轻声为她朗读《草房子》，温柔的字句流淌在微凉的风里。读到桑桑卧病的片段时，身旁的小姑娘忽然抬眸，澄澈的眼眸里盛满担忧，用细若蚊蚋的声音轻轻问道：“姐姐，桑桑会好起来吗？”',
    '软糯轻柔的一声“姐姐”，轻飘飘落在我的心上，温柔得让人心头一颤。简单的两个字，盛满了全然的信任与依赖，纯粹又滚烫。我温柔抚摸她的头顶，轻声安抚她，告诉她一切皆会向好。她安心地靠在我的肩头，静静聆听书页间的温柔。',
    '后来我知晓，她叫阿瑶。父母常年在外务工，她留守乡间，少有人陪伴，性格怯懦内向。余下的假期时光里，我常常陪伴着她，教她识字读书，陪她奔赴田埂，追逐蜻蜓、采摘野花。',
    '离别那日，阿瑶将一张皱巴巴的纸条塞到我手中，纸上歪歪扭扭的字迹，藏着最真挚的期许：“姐姐，我会好好读书。”回城之后，我们始终未曾断了联系。她每每取得进步，总会拍下奖状，发来软糯的语音与我分享喜悦。',
    '原来世间最好的相遇，从不是轰轰烈烈的邂逅，而是一场温柔的奔赴，一次纯粹的信任。那声怯怯的“姐姐”，是夏日最温柔的回音，让我明白：一场素未谋面的相识，足以成为温暖余生的珍贵馈赠。'
  ]
},
{
  id:'e11', category:'相识缘分', title:'琴房里的陌生人', note:'喜欢的事，慢慢来',
  body:[
    '人生路上，总有不期而遇的温暖。一次偶然的相逢，一句温柔的宽慰，便能拨开迷雾，治愈迷茫的时光。那个秋日午后，琴房里的相遇，让我读懂：热爱可抵岁月漫长，喜欢的事，慢慢来就好。',
    '那年，我满心期许备战数学竞赛，日夜刷题、反复钻研，熬过无数个挑灯夜读的夜晚。可全力以赴的奔赴，终以落选落幕。失利的挫败感裹挟着我，让我一蹶不振。那段日子，我消沉低落，满心迷茫，对热爱与坚持产生了怀疑。',
    '一个秋日午后，秋风微凉，我漫无目的地徘徊在校园。无意间，艺术楼一间常年紧锁的琴房虚掩着门，断断续续的琴声缓缓传出。我怀着好奇轻轻推门而入。逆光之中，一名身着白衬衫的少年端坐琴前，清瘦安静。见我闯入，他没有不悦，只是眉眼温和地笑了笑，露出浅浅的小虎牙，大方地邀我落座。',
    '他弹奏的是经典的《致爱丽丝》，琴声并不流畅，错音频频，却格外认真。他微微前倾身子，专注地盯着黑白琴键，轻声跟着旋律哼唱，沉浸在属于自己的一方天地里。阳光透过窗棂洒落，细碎的尘埃在光束中轻轻浮动，静谧又温柔。',
    '一曲终了，他坦然坦言，这首曲子他练习了整整两个月，依旧不够完美。他看出我眼底的低落，轻声劝慰：“不用着急，喜欢的事，慢慢来就好。”他温柔耐心地教我识谱、练指法，笨拙的我弹出的旋律断断续续，却在琴声里暂时卸下了所有的焦虑与挫败，久违地展露笑颜。',
    '此后，每周六的琴房，成了我们专属的温柔秘境。我渐渐知晓，他心怀音乐梦想，立志考入音乐学院。纵然起步较晚、天赋平平，他却始终脚踏实地、默默坚持。他从未急于求成，始终相信，时光不负深耕之人。',
    '秋去冬来，时光匆匆。后来他如愿考入心仪的音乐学院，离别前，他在琴房窗台留下一张纸条，依旧是那句温柔的期许：喜欢的事，慢慢来。',
    '如今每当我指尖触碰琴键，弹奏熟悉的旋律，总会想起那个秋日午后的温柔相逢。那场平淡的相遇，没有轰轰烈烈的故事，却治愈了迷茫怯懦的我。',
    '人生从无一蹴而就的成功，所有美好都需要沉淀与等待。那场琴房里的相遇，如一束微光，照亮我前行的路，让我始终笃定：步履缓缓，初心不改，终会奔赴热爱。'
  ]
},
{
  id:'e12', category:'相识缘分', title:'雨夜的伞', note:'墨绿色的长柄伞',
  body:[
    '世间温暖，往往藏在不期而遇的善意里。一场突如其来的夜雨，一把温柔递送的雨伞，一次素昧平生的相逢，让我懂得：陌生人间的温柔，最是治愈人心。',
    '那个夜晚，至今镌刻在我的记忆深处。晚自习结束，白日晴朗的天气骤然变脸，滂沱大雨倾泻而下，豆大的雨点砸落地面，溅起层层水雾，风声呼啸，裹挟着寒意扑面而来。',
    '校门口人潮涌动，同学们陆续被家长接走，喧闹的校园很快归于寂静，只留我孤身一人伫立廊下。我紧紧抱着怀中的书本，生怕雨水打湿，心底满是焦灼与无助。冰冷的晚风夹杂着雨丝拂过脸颊，心底的委屈与凉意层层蔓延。',
    '就在我手足无措、满心茫然之时，一道温柔的声音在身后响起。我蓦然回头，看见一位身着校服、高马尾利落清爽的学姐，手持一把墨绿色长柄伞，眉眼弯弯，笑意温柔，自带让人安心的力量。',
    '得知我没有带伞，她没有丝毫犹豫，径直将伞柄塞进我的手中，语气坚定又温柔：“你拿去用，我家很近，跑几步就到了。”我连忙推辞，她却笑着报出自己的班级姓名，叮嘱我次日归还，随即头顶书包，义无反顾地冲进茫茫雨幕。冰冷的雨水瞬间打湿她的校服与发梢，背影却格外温暖耀眼。',
    '我握着温热的伞柄，撑着那把带着温度的雨伞，安然行走在雨夜之中。夜雨淅沥，伞下一方小小天地，隔绝了风雨寒凉，盛满了陌生人纯粹的善意。',
    '次日清晨，我准时前往初三教学楼归还雨伞。再次相逢，我们褪去陌生，相谈甚欢。意外发现，我们有着相同的爱好，同样痴迷于文学与经典书籍。走廊之上，我们畅聊书籍、畅谈热爱，寥寥数语，便拉近了彼此的距离。',
    '自此，一场雨夜相逢，让两个素不相识的人成为挚友。我们常常相约图书馆，静坐窗边，翻读书卷，静谧相伴，岁岁安然。那把老旧的墨绿色雨伞，我一直悉心珍藏。伞面虽历经风雨、渐渐陈旧，却承载着最纯粹的善意与温柔。',
    '原来人间最美的相遇，从不需要刻意安排。一场雨、一把伞、一份温柔的馈赠，便足以串联起两段平行的青春。那场雨夜的相逢，是青春里最温柔的馈赠，让我始终相信：世间温柔，无处不在，善意长存，温暖如初。'
  ]
},
{
  id:'e13', category:'相识缘分', title:'巷口的旧书摊', note:'一本《城南旧事》',
  body:[
    '烟火寻常的街巷，藏着最动人的温柔；平淡朝夕的相逢，藏着最治愈的美好。我曾日日途经巷口，步履匆匆，从未驻足，直到那个失意黄昏，一场温柔的相遇，治愈了年少所有的委屈与迷茫。',
    '老街巷口，常年摆着一个朴素的旧书摊。一辆生锈的三轮车，满载各式各样的旧书，一位白发苍苍的老爷爷，每日黄昏准时出摊，静坐摊前，翻书度日。岁岁朝朝，平淡寻常，我始终行色匆匆，从未停留。',
    '那个秋日黄昏，我与挚友激烈争执，满心委屈与难过，红着眼眶独自归家。秋风萧瑟，暮色沉沉，昏黄的路灯拉长街巷的影子，也放大了我心底的低落。路过旧书摊时，老爷爷抬眸望向我，眉眼温和，眼底盛满善意，轻轻开口：“小姑娘，过来坐坐吧，我的书能治愈心事。”',
    '温柔的话语，瞬间击溃了我所有的倔强。我缓步上前，蹲在书摊前，指尖轻轻拂过泛黄的书页，淡淡的墨香与旧纸的温润气息萦绕鼻尖。我的目光最终停留在一本老旧的《城南旧事》上，简约的封面，沉淀着岁月的质感。',
    '老爷爷看出我的偏爱，笑着将书赠予我，轻声宽慰：“人与人相处，难免有磕碰，就像书页折角，轻轻抚平，依旧完好如初。不必耿耿于怀。”质朴的话语，温柔又通透，瞬间抚平了我心底的郁结。',
    '当夜，我细细品读《城南旧事》，在英子的故事里读懂聚散随缘、得失坦然。次日，我主动与好友和解，年少的别扭与隔阂，尽数烟消云散。',
    '此后，旧书摊成了我课余最爱的栖息地。每日放学，我总会驻足停留，陪老爷爷闲谈片刻。他曾是人民教师，饱读诗书，温柔通透，常常为我推荐好书，在书页扉页写下温柔寄语，教我读书，教我成长，教我温柔待人、从容处事。',
    '岁月流转，秋风依旧。不知从何时起，巷口的旧书摊悄然消失了。听闻老爷爷身体欠佳，被家人接往他乡安度晚年。如今我依旧日日途经这条老街，步履从容，心怀温柔。旧书摊早已不见踪影，可那段温柔的相遇、温暖的教诲，始终铭记于心。',
    '一场巷口相逢，一本旧书温情，治愈了年少迷茫。原来最珍贵的相遇，从不是轰轰烈烈的邂逅，而是平凡岁月里，一场温柔的救赎，一份岁岁绵长的成长。'
  ]
},
{
  id:'e14', category:'相识缘分', title:'新来的同桌', note:'因为一本《活着》',
  body:[
    '青春漫漫，岁月悠长，无数人途经我的青春，匆匆离去。唯有一场平淡温柔的同桌相逢，如清风入怀、星光落眸，丰盈了我的少年时光，成为青春里最珍贵的温柔印记。',
    '初秋，秋风送爽，崭新的学期悄然开启。安静的教室里，班主任领着一位陌生的女孩缓缓走入。她身形瘦小，低扎马尾，刘海轻垂，眉眼低垂，安静内敛，带着初来乍到的局促与腼腆。朴素干净的白衣，整齐简约的书包，处处透着温柔安静的气质。',
    '她轻轻落座，默默整理书本，全程安静无言，周身萦绕着淡淡的疏离感。起初的数日，我们鲜有交流。她沉默寡言，独来独往，课间静坐看书，从不参与嬉闹。班里同学对这位沉默的转学生颇多议论，而她始终淡然沉默，将自己小心翼翼地包裹起来。',
    '改变始于一节语文课。课堂之上，老师邀请同学分享心爱读物，教室瞬间鸦雀无声，气氛凝滞。就在此时，沉默的沈念缓缓抬手，从容起身。她声音轻柔却坚定，条理清晰地诉说着《活着》带给她的感悟。',
    '她所言的苦难与坚韧、平凡从容，字字动人，句句入心。平淡的话语里，藏着远超同龄人的通透与温柔。话音落幕，教室掌声四起，我心底满是惊艳与动容。下课之后，我主动与她闲谈，惊喜地发现，我亦是《活着》的忠实读者。我们一见如故，畅谈书本感悟，聊聊作者笔下的人间百态。那一刻，她低垂的眼眸骤然亮起，眉眼舒展，露出了温柔浅浅的笑意。',
    '自此，我们慢慢熟络，成为朝夕相伴的同桌。我带她融入班级、嬉笑奔跑，她陪我品读诗书、沉淀心性。在我的陪伴下，她渐渐褪去怯懦，变得开朗明媚；在她的影响下，我学会沉静读书、静心成长。',
    '我曾问她，为何敢于主动举手发言。她温柔浅笑，答道：“我看见你桌上的《活着》，便知道你一定懂我。”原来世间最好的相逢，是灵魂契合，是恰逢知己。',
    '阳光依旧洒满教室，书页翻飞，岁岁安然。那场初秋的温柔相遇，让两个陌生的少年彼此治愈、彼此成长。这场平凡的同桌相逢，是青春赠予我的温柔宝藏，让漫漫少年时光，温暖绵长，岁岁生辉。'
  ]
},

/* ═══════════ 亲情绵延 ═══════════ */
{
  id:'e15', category:'亲情绵延', title:'粥香绵长，亲情未央', note:'奶奶的小米粥',
  body:[
    '真正的亲情，从不在轰轰烈烈的表达里，而藏在日复一日细碎的陪伴中，沉淀成岁月里最温柔的暖意。',
    '清晨的天光还未完全穿透窗帘，整座城市尚陷在沉睡的静谧里，我家的厨房早已亮起一盏温柔的暖灯。那是奶奶又早早起身，为我熬一锅温热的小米粥。寒冬的清晨格外清冷，玻璃窗凝着薄薄的雾气，风从窗缝悄悄钻进屋子，带着刺骨的凉意。可灶台边，永远是温暖安稳的模样。',
    '奶奶佝偻着微微弯曲的脊背，站在灶台前，一手扶着锅沿，一手轻轻搅动锅中翻滚的米粥。银白色的发丝随意贴在额角，被氤氲的水汽濡湿，几缕碎发垂在眼前，她却顾不上整理。柴火温柔地跳动，锅里的米粒慢慢舒展、软糯，淡淡的米香一点点浸满整个房间，驱散了清晨所有的寒凉。',
    '我常常披着外套站在门口静静看着她。她的动作缓慢却娴熟，反复搅动，怕锅底糊掉，怕粥不够绵软，怕我入口不够温热。十几年如一日，无论寒冬酷暑，无论我上学早起或是疲惫低落，清晨的一碗热粥，永远准时等候在餐桌。她从不说挂念，从不讲深情的话语，却把所有的疼爱，都熬进了细细密密的粥粒里。',
    '每当捧起温热的白瓷碗，温热顺着指尖蔓延到心底。软糯的米粥入口清甜，熨帖了晨起的困倦，抚平了学习的焦躁。一碗简简单单的米粥，没有昂贵的滋味，却藏着世间最纯粹、最绵长的爱意。',
    '烟火寻常，粥香岁岁。平凡的朝夕里藏着最动人的亲情，温暖我的成长，温柔我的岁岁年年。'
  ]
},
{
  id:'e16', category:'亲情绵延', title:'雨伞微倾，爱意满盈', note:'倾斜的伞',
  body:[
    '亲情是藏在细微举动里的温柔，无需言说，却在风雨时刻，为我撑起一片永远晴朗的天地。',
    '深秋的午后，天色骤变。原本晴朗的天空瞬间被乌云遮蔽，狂风呼啸而过，树叶簌簌作响，细密的雨丝骤然坠落，转眼化作倾盆大雨。放学铃声响起，我站在教学楼门口，望着漫天雨幕满心焦灼。就在我不知所措时，人群尽头，我看见了撑伞等候的母亲。',
    '她站在风雨里，衣角被风吹得翻飞，眼神却始终紧紧望着教学楼的方向，在涌动的人群中，一眼锁定了我的身影。我快步冲进雨里，扑到伞下，母亲立刻将我揽在身侧，轻声问我冷不冷。',
    '并肩走在回家的路上，雨声淅沥，敲打伞面，发出细碎的声响。我无意间抬头，忽然发现头顶的雨伞始终稳稳向我这边倾斜。母亲的大半肩头暴露在风雨中，深色的外套早已被雨水浸透，贴在单薄的背上，发丝湿漉漉地贴在脸颊，微凉的雨水顺着发梢缓缓滑落。',
    '我心头骤然一酸，伸手轻轻摆正伞柄：“妈妈，伞歪了。”母亲却笑着轻轻推回去，语气温柔又坚定：“我没事，别淋着你。”短短的一句话，温柔地撞进心底。风雨再大，有她偏过来的伞，我便永远安稳无忧。',
    '漫漫归途，雨声未歇，倾斜的雨伞，遮住了所有风雨，留住了全部温柔。原来母爱从不是轰轰烈烈的奉献，只是一次次下意识的偏爱与守护。',
    '一伞微倾，藏尽深情。这无声的亲情，是岁月里最安稳的庇护，永远温暖明亮。'
  ]
},
{
  id:'e17', category:'亲情绵延', title:'掌纹温热，父爱无声', note:'修抽屉的手',
  body:[
    '世间最深沉的亲情，往往沉默无言。父亲笨拙温柔的守护，藏在粗糙的掌纹里，温暖我一路成长。',
    '我的父亲向来不善言辞，他从不会温柔絮叨，很少直白表达牵挂，却总在我需要的时候，默默撑起一片安稳的天地。上个周末，书桌的木质抽屉突然卡住，死死闭合，无论我如何用力推拉，始终纹丝不动。急躁之下，我满脸烦闷，忍不住轻轻叹气。',
    '父亲听见动静，默默走了过来。他没有责备我的毛躁，只是轻轻抬手示意我让开。他微微蹲下身子，宽厚的背影挡在灯光前，专注地打量着卡住的抽屉缝隙。常年劳作的手掌粗糙厚重，指腹布满细碎的薄茧，那是岁月和辛劳留下的痕迹。',
    '他小心翼翼捏住抽屉边缘，轻轻试探、微调力度，一点点调整错位的木板，动作轻柔又耐心。他屏住呼吸，慢慢推拉、调试，反复确认缝隙的位置。原本顽固卡死的抽屉，在他耐心的修整下，一点点恢复顺畅。',
    '修好的那一刻，他轻轻推拉两下确认无误，然后抬手，用粗糙的指尖轻轻拂去桌沿的浮尘，侧过头看向我，眼底是朴素又温柔的安心。他没有多说什么，只低声一句：“遇事别急，慢慢来。”',
    '简简单单的一句话，没有华丽的辞藻，却瞬间抚平了我所有的焦躁。掌心残留的温热，透过空气传递过来，安稳又踏实。原来父爱从不用言语修饰，所有的牵挂、包容与守护，都藏在默默付出的细节里。',
    '父爱无言，温情有度。朴素的掌纹藏着最动人的亲情，成为我成长路上最坚定的力量。'
  ]
},

/* ═══════════ 假如 ═══════════ */
{
  id:'e18', category:'假如', title:'假如我变成了一缕月光', note:'落在你的枕边',
  body:[
    '假如我变成了一缕月光，只是为了让你的夜晚不那么漫长，悄悄地，我从窗的缝隙里溜进来，不惊动你。',
    '妈妈，你会找我吗？你会说：“孩子，你在哪里呀？”我暗笑着，却不回答你。',
    '我要轻轻地，轻轻地落在你的枕边，趁你翻身的时候，吻一吻你疲惫的眼角。当你坐在灯下为我缝补那件磨破了袖口的外套，我会调皮地跃上你的针尖，在你的手指间跳着细碎的舞，让那根银针也闪着柔和的光。你一定会惊讶，今晚的灯怎么格外温柔。',
    '我要爬上你手边那杯渐渐凉去的茶，在杯沿上静静地坐着，看你低头沉思时垂下的发丝。那几根新添的白发，我会用最轻的光去抚摸它们，像小时候你用掌心抚过我的额头。',
    '当你起身去关窗，我就躲在窗帘的背后，看你望向夜空时，眼里有一片安静的湖。我会让湖面上浮起一层薄薄的银色的雾，像小时候你为我哼过的摇篮曲，软软的，远远的，却又一直都在。',
    '夜渐渐深了，你终于躺下。我就穿过窗纱，悄悄地，悄悄地覆在你的被子上，像小时候你为我掖好的那角棉被。我要在你的呼吸里，在你的梦里，安静地待上一整夜。',
    '但是，妈妈，当天边泛起第一丝鱼肚白，我就要变回来。变回那个睡在你身边、会踢被子、会在梦里嘟囔着叫你的孩子。你会早早地醒来，看见我毛茸茸的脑袋歪在枕头上，呼吸均匀得像一只小兽。你会笑着叹一口气，伸手替我把被子拉好。',
    '妈妈，你要是问：“昨晚睡得好吗？”我会揉着眼睛，笑着说：“我梦见自己变成了一缕月光，去看了你好久好久呢。”',
    '那时你或许会轻轻地刮一下我的鼻子，说一句“傻孩子”。而我心里藏着一个秘密，藏着一整夜的温柔，像月光藏在云朵里那样，甜甜的，满满的，不说给你听。'
  ]
},
{
  id:'e19', category:'假如', title:'假如我变成了一阵风', note:'吹过你的夏天',
  body:[
    '假如我变成了一阵风，只是为了让你的夏天不那么燥热，轻轻地，我从半开的窗户外溜进来，不惊动你。',
    '妈妈，你会找我吗？你会说：“孩子，你在哪里呀？”我偷偷地笑着，却不回答你。',
    '我要悄悄地，悄悄地绕过你的背后，趁你低头择菜的时候，把你额前汗湿的碎发撩起来。当你坐在院子里那棵槐树下为我织那件过冬的毛衣，我会顽皮地钻进你的毛线团里，把绒线吹得滚来滚去，让你追着它跑两步，又笑着骂一声“这阵风真淘气”。',
    '我要爬上你晾衣的竹竿，让那些湿漉漉的床单鼓成一面面白帆，在你头顶上飘啊飘。你抬头看的时候，阳光正好穿过我的身体，洒在你微微眯起的眼睛里，碎碎的，暖暖的，像你笑起来时眼角的纹路。',
    '当你端着簸箕去晒谷场上扬麦子，我就等在谷壳和麦粒分开的地方，轻轻一吹——麦子沉甸甸地落回地面，谷壳却飘向远处的夕阳。你一定会眯着眼说：“今天的风，真懂事啊。”',
    '黄昏时分，你坐在门槛上纳鞋底。我就穿过整片稻田，带着稻花的香味和青蛙的叫声，扑进你的怀里，像一个放学晚归的孩子。你把手里的针线搁一搁，自言自语：“是不是要下雨了？”可我只是想亲亲你被日头晒红的脸颊。',
    '夜深了，你摇着蒲扇给我赶蚊子。我就停在蒲扇的边缘，一圈一圈地转，把凉意均匀地送给你。你打着哈欠，渐渐睡去，嘴角还挂着半句话。我便蜷在你的枕头边，做一场没有形状的梦。',
    '但是，妈妈，当天亮的时候，我又会变回来。变回那个会赖床、会把早饭吃得满脸米粒、会缠着你要两毛钱买冰棍的孩子。',
    '你推开门，清晨的风吹了你一脸。你会说：“今天风真凉快。”而我坐在饭桌前，嘴里塞满了馒头，含含糊糊地笑。',
    '妈妈，你不知道，昨晚有一阵风，曾在你耳边说了一整夜“我爱你”。那是我，是我啊。'
  ]
},
{
  id:'e20', category:'假如', title:'假如我变成了一棵桂花树', note:'长在你必经的路口',
  body:[
    '假如我变成了一棵桂花树，就长在你每天经过的路口，安安静静地站着，不惊动你。',
    '妈妈，你会认出我吗？你会说：“这棵树真香啊。”我摇着满枝的花，沙沙地笑，却不回答你。',
    '秋天来的时候，我把小小的黄花一粒一粒地攒在枝头，攒了满满一树。那是你最喜欢的味道啊。每年桂花开，你都要摘一小捧，用白手帕包着，放在枕边，说梦里都是甜的。',
    '现在，我就站在你必经的路口。你每天清早去买菜，蓝布衫子从我身边经过。我就把最香的那一枝，轻轻地，轻轻地垂下来，碰一碰你的发梢。',
    '你一定会停下来，仰起头，眯着眼在花枝间找啊找。阳光透过叶缝，在你脸上洒下细碎的光斑。你伸出手，接住几粒飘落的桂花，放在鼻尖闻了闻，笑得像个小姑娘。那一刻我多想把所有花瓣都撒下来，撒成一场金色的雨，落在你的肩头、发间、菜篮子里。',
    '风起的时候，我抖落一地桂花，铺成薄薄的香毯。你从上面走过，脚步轻轻的，像怕踩疼了什么。你哪里知道，我正偷偷地把香气往上送，让它们爬上你的衣襟，缠着你不肯走。',
    '傍晚你回来，天边绕着晚霞。远远地，你就看见路口那棵桂花树下，满地都是碎金。你说：“今天落了好多花啊。”然后你放下菜篮，蹲下身，一粒一粒地捡。夕阳把你的影子拉得很长，长到我的树根这里。',
    '我多想弯下腰来，像小时候你抱我那样，抱一抱你。可我只是树啊，我只能让叶子轻轻地响，哗啦啦，哗啦啦，替我说那些说不出的话。',
    '你捡了一小捧，用手帕仔细包好，放进口袋。你说：“带回去给丫头闻闻，她最爱这味道。”妈妈，你可知道，你手里捧着的那捧花，就是你那棵会走路的桂花树，喊你回家呢。',
    '月亮升起来的时候，你关了灯。我就让香气从窗缝里钻进去，萦绕在你的枕边。你翻了个身，在梦里笑了一下。是不是梦到了我呢，妈妈？',
    '天亮了，我变回来，还是那个睡在你隔壁、头发乱糟糟的孩子。你推开门进来喊我起床，手里还捏着那块白手帕，桂花香散了一屋子。',
    '你笑着说：“昨晚摘的桂花，香不香？”',
    '我凑过去闻了闻，使劲点头：“香！是妈妈的味道。”',
    '你哪里知道，那棵树，就是我啊。'
  ]
},

/* ═══════════ 藏在……里的友情 ═══════════ */
{
  id:'e21', category:'藏在……里的友情', title:'藏在橘香里的友情', note:'一瓣一瓣的“干杯”',
  body:[
    '指尖轻触，金黄的表皮带着微凉的粗糙感，那是岁月沉淀下的纹理。指甲掐入果皮，“嗤”的一声轻响，清冽的香气瞬间迸发，如雾般弥漫。这熟悉的橘香，是一把钥匙，悄然打开了记忆的闸门，将我拉回那段被阳光浸透的午后时光。',
    '午后的教室静谧而慵懒。窗外的蝉鸣声嘶力竭，屋内却流淌着一种安宁的暖调。我的同桌是个爱笑的女孩，我们之间有个不成文的约定：每天带一个橘子，分享这份酸甜。',
    '一个深秋的午后，阳光透过斑驳的树影，在课桌上投下细碎的光斑。我小心翼翼地从书包里掏出那只圆润的橘子，它像个小太阳，温暖了微凉的空气。剥开果皮，嫩黄的橘瓣紧紧相拥，白色的橘络如丝如缕，缠绕着童年的纯真。我将橘瓣一分为二，一半推向她，一半留给自己。',
    '“干杯！”我们压低声音，举起手中的橘瓣轻轻相碰。那软软的触感，仿佛碰响了心底最清脆的风铃。橘瓣入口，薄皮破裂，汁水在舌尖炸裂，酸甜交织，顺着喉咙滑下，沁人心脾。我们小口咀嚼，细细剔除那些白色的筋络，眼神交汇间，满是无需多言的默契。偶尔抬头，看见老师趴在讲台上小憩，粉笔灰在光束中静静飞舞，空气中弥漫着橘子清香与淡淡书卷气的混合味道。那一刻，时间仿佛凝固，世界只剩下我们两人和这一瓣小小的甜蜜。',
    '如今，超市里的橘子品种繁多，包装精美，却再也找不回当年那份纯粹的甘甜。原来，香甜的从来不是食物本身，而是那份毫无保留的分享，是那段无忧无虑、有人相伴的时光。橘子易得，知音难寻；果味易散，情谊长存。',
    '每当秋风起，橘香再次萦绕鼻尖，我总会想起那个午后，想起那张笑脸，想起我们举着橘瓣“干杯”的模样。那不仅仅是一种味觉的记忆，更是一段关于友情、关于成长的温柔注脚。它在岁月的长河中，化作一抹永不褪色的金黄，温暖着我前行的路。',
    '时光匆匆，我们终将长大，各奔东西。但那份藏在橘子香里的旧时光，如同陈年的酒，愈久愈醇。它提醒我，在忙碌的生活中，别忘了停下脚步，去品味那些简单而真挚的美好，去珍惜身边每一个愿意与你分享“橘子”的人。因为，正是这些微小的瞬间，构成了生命中最动人的风景。'
  ]
},
{
  id:'e22', category:'藏在……里的友情', title:'藏在桂香里的友情', note:'阿恬与桂花书签',
  body:[
    '秋风一过，满城桂花便开了。那香气不浓烈，却密密地、甜甜地漫过来，像一把细小的钥匙，轻轻一转，便打开了记忆深处那扇门。门后，是我和她共度的、浸在桂香里的秋天。',
    '那时，教室窗外有一排桂花树。每到课间，她总拉着我去树下捡桂花。她叫阿恬，笑起来眼睛弯弯的，像两枚刚剥开的橘瓣。地上铺着细细碎碎的金黄，我们蹲在树根旁，把完整的小花一粒粒收进掌心。她的掌心温热，桂花躺在里面，像一捧碎金。',
    '“回去做桂花书签。”她小声说，语气像在密谋一件大事。我们把桂花夹进字典，压在厚厚的作业本下。第二天翻开，花瓣薄而透明，香气却留住了。她把其中一页递给我，上面用铅笔写着：“愿你闻见桂花，就想起我。”我笑她矫情，却把那张纸夹进了最喜欢的书里。',
    '最难忘的是那个午后。她从家里带来一小块桂花糕，用白纸包着，偷偷塞进我抽屉。午托老师趴在讲台上打盹，我们低头分食。糕体松软，桂香清甜，碎屑落在课桌上，像撒了一把小小的星星。她掰下一角，举起来，轻轻碰了碰我手中的那一角：“干杯。”我们不敢笑出声，只把眼睛弯成月牙。窗外蝉声已远，风里全是桂花的甜香。',
    '后来小学毕业，她去了另一座城市。临别时，她送我一只小小的玻璃瓶，里面装着晒干的桂花。瓶身贴着标签：“别忘了我。”我点头，却说不出话。',
    '如今，街边桂花年年开，桂花糕也随处可见，包装精致，味道却总像缺了什么。原来，缺的是那个陪我在树下捡花的人，是那段不必言说便彼此懂得的时光。桂香易散，友情长存。每当秋风再起，我总会在桂香里停一停，仿佛一回头，还能看见她举着桂花糕，笑着对我说：“干杯。”'
  ]
},
{
  id:'e23', category:'藏在……里的友情', title:'藏在薄荷糖里的友情', note:'铁盒里的凉意',
  body:[
    '撕开那层银亮的锡纸，一股清凉的薄荷气便窜了出来，直冲鼻尖。那味道像一道微小的闪电，劈开岁月的幕布，把我带回蝉声轰鸣的夏天。那时，我和薄荷糖，和她，都在。',
    '她是转学来的，坐在我旁边，总爱在数学课上打瞌睡。老师的声音像催眠曲，她的脑袋一点一点，像小鸡啄米。我悄悄从笔袋里摸出一颗薄荷糖，推过“三八线”。她接过去，剥开，含进嘴里，整个人猛地一激灵。她转头看我，眼睛里有感激，也有狡黠。从那以后，薄荷糖成了我们之间的暗号。',
    '夏天午后，教室闷热，风扇吱呀转着，吹不散额角的汗。她总会带一盒薄荷糖，铁盒，圆圆的，摇起来哗啦响。下课铃一响，她就打开盒子，自己拿一颗，再递给我一颗。我们含着糖，走到走廊尽头，趴在栏杆上看操场。薄荷的凉意从舌尖漫到喉咙，像一阵小小的风，把困倦和烦躁都吹走了。',
    '有一次体育课跑完八百米，我瘫在树荫下，喉咙像着了火。她跑过来，蹲下，把一颗薄荷糖塞进我手心。糖纸被她的汗浸得有点潮。她说：“快吃，凉快。”我剥开，放进嘴里，那清凉瞬间炸开，竟比水还解渴。我们肩并肩坐着，看阳光把树叶照得透亮，谁也没说话。',
    '毕业那天，她送我一个同样的铁盒，里面装满薄荷糖。盒底压着一张纸条：“困了，就吃一颗。别忘了我。”我笑她连告别都带着凉意，却在转身时红了眼眶。',
    '如今，超市货架上的薄荷糖五花八门，有夹心的、有果味的，包装一个比一个漂亮。可含在嘴里，总觉得不够凉，也不够甜。原来，最好的味道，不是薄荷本身，而是她递来糖时的那份默契，是那个夏天我们共同含过的清凉。薄荷易化，情谊长存。每当困倦时，我仍会剥一颗薄荷糖，让那熟悉的气味，带我回到有她的教室。'
  ]
},
{
  id:'e24', category:'藏在……里的友情', title:'藏在烤红薯里的友情', note:'冬天校门口那一半',
  body:[
    '冬天的街头，只要闻到那股焦甜的香气，我就走不动路。烤红薯的炉子冒着白烟，红薯皮烤得皱皱的，裂开的地方淌出琥珀色的糖汁。那香气像一把暖烘烘的钥匙，一转，就打开了我小学门口的冬天。',
    '那时，我和阿禾是形影不离的朋友。放学后，我们总要在校门口那个老爷爷的烤红薯摊前站一会儿。零花钱不多，我们常常合买一个。阿禾把钱数了又数，递过去，接过那个滚烫的红薯，在手里倒来倒去，像捧着一只小刺猬。她掰开，金黄的瓤冒着热气，一人一半。她总把最甜、最软的心儿留给我，说自己喜欢挨着皮的那层。',
    '我们捧着红薯往家走，风刮得脸生疼，手心却暖乎乎的。咬一口，甜糯绵软，热气从喉咙一路暖到胃里。我们边走边吃，呼出的白气混在一起，分不清谁是谁的。有时她突然停下来，举起手里的红薯，轻轻碰一下我的：“干杯！”我们笑得前仰后合，连路边的枯树都像在跟着摇晃。',
    '后来，阿禾搬家了。临走前，她跑到我家楼下，塞给我一个烤红薯。红薯还热着，隔着纸袋烫着我的手。她说：“以后冬天，没人跟你分一个了。”我低头咬了一口，甜得发涩。',
    '如今，我依然会在冬天买烤红薯。摊主问要大的还是小的，我总说，一个。可一个人吃，再甜的也像少了点滋味。我这才明白，烤红薯的暖，不只来自炭火，更来自那个愿意和你分食的人。红薯易凉，友情长存。每当寒风再起，我总会想起那个捧着红薯、笑着喊“干杯”的女孩。她像一团小小的火，藏在我记忆的冬天里，暖我至今。'
  ]
},

{
  id:'e25', category:'往事依依', title:'往事依依', note:'祖父的老屋与书',
  body:[
    '年华似流水。十几年过去，不少事情已经模糊，有的搜索枯肠而不可得，但有几件与读书有关的往事，仍历历在目，至今记忆犹新。',
    '小时候，我住在祖父的老屋里。堂屋墙上挂着一幅《溪岸图》，据说是祖父年轻时从旧书摊上淘来的。这只是一幅普通的山水画，清晨看到，傍晚看到，一天少说看三四次，竟百看不厌。有时凝视久了，自己也仿佛走进了画中——群山莽莽，溪水潺潺，山脚下几间茅屋，篱笆外一树杏花开得正盛。“千里莺啼绿映红，水村山郭酒旗风”，画中那面斜挑的酒旗，仿佛正在风中猎猎作响。入了神，自然乐在其中。祖父的书架上还有一部线装《宋词选》，一翻开，就被那些长短句勾住了魂。“大江东去，浪淘尽，千古风流人物”，我仿佛看见浩浩江面上一个青衫身影迎风而立；“昨夜西风凋碧树，独上高楼，望尽天涯路”，又好像自己正站在一座孤楼上，天高地远，满目苍凉。那时读宋词，会不知不觉把眼前的一切都染上了词的颜色。以后年岁增长，也曾重读《宋词选》，虽然理解比小时候深入，但那种初读时“山奔海立”般的震撼，却再也找不回来了。后来才懂得，这就是形象思维的作用，生动的形象可以形成深刻的记忆。',
    '学生时代的生活乐趣，很大程度也来自读书。书，给我以广阔的天地，而其中编织我少年美丽的生活花环的，竟是那一本翻得卷了边的《古文观止》。',
    '老师入情入理的讲课，也在我心上雕镂下深刻的印象。语文老师教古文喜欢大声吟诵。记得一次教范仲淹的《岳阳楼记》，老师吟到“先天下之忧而忧，后天下之乐而乐”时，声音陡然拔高，双目炯炯，仿佛范公就站在讲台之上。此后我每次读到这两句，耳畔就响起老师那苍劲的吟诵声，一股浩然之气油然而生。',
    '老师常对我们说：“多读书，读好书，能丰富知识，增添智慧，成为一个志趣高尚的人。”谆谆教诲铭刻在心，使我一生受用不尽。往事依依，那些与书相伴的日子，唤起我对知识的渴望，催我不断奋进。'
  ]
},
{
  id:'e26', category:'往事依依', title:'往事依依', note:'外婆的纺车与《千家诗》',
  body:[
    '年华似流水。十几年过去，不少事情已经模糊，有的搜索枯肠而不可得，但有几件与外婆有关的往事，仍历历在目，至今记忆犹新。',
    '小时候，外婆家有一架老纺车。枣木的架子，铜制的锭子，外婆摇起来，“嗡嗡嗡”，像一只老蜂在耳边哼唱。这只是一架普通的纺车，清晨摇，傍晚摇，一天少说摇两个时辰，我竟百听不厌。有时趴在炕沿上听久了，自己也仿佛融进了那团棉絮里，跟着纺锤一圈圈转，“唧唧复唧唧，木兰当户织”，仿佛看见了木兰当窗理云鬓的模样。入了神，自然乐在其中。外婆的笆箩里还有一本夹鞋样的《千家诗》，封面早已磨没了，里面的纸被剪得七零八落，可残留的诗句却像种子一样落进了我心里。“春眠不觉晓，处处闻啼鸟”，是外婆家后院杏树上麻雀的叽叽喳喳；“小荷才露尖尖角，早有蜻蜓立上头”，是村口池塘里夏天的模样。那时听外婆念诗，会不知不觉把整个院子都装进了诗里。以后回到城里读书，也曾重读《千家诗》，虽然理解比小时候深入，但那种诗句与泥土、炊烟融在一起的温润，却再也找不回来了。后来才懂得，那是生活与文字在童年里最美的相遇。',
    '中学时代的生活乐趣，很大程度也来自读书。书，给我以广阔的天地，而其中编织我少年美丽的生活花环的，竟是那本从旧书摊上淘来的《边城》。',
    '老师入情入理的讲课，也在我心上雕镂下深刻的印象。语文老师曾讲过一句让我记到今天的话：“文字是有温度的。你写风，风就吹在读者脸上；你写雨，雨就落在读者肩上。”此后我写作文，总想着要让自己笔下的字有温度、有呼吸。',
    '老师常对我们说：“多读书，读好书，能丰富知识，增添智慧，成为一个志趣高尚的人。”谆谆教诲铭刻在心，使我一生受用不尽。往事依依，那些与外婆和书相伴的时光，唤起我对生活的热爱，催我不断奋进。'
  ]
},
{
  id:'e27', category:'往事依依', title:'往事依依', note:'父亲抽屉里的《傅雷家书》',
  body:[
    '年华似流水。十几年过去，不少事情已经模糊，有的搜索枯肠而不可得，但有几件与父亲有关的往事，仍历历在目，至今记忆犹新。',
    '小时候，父亲的书桌抽屉里锁着一本《傅雷家书》。这只是一本普通的书信集，父亲难得打开，可我总见他把钥匙小心翼翼地挂在腰间。一次趁他不在，我偷偷翻出来，就着窗外透进的阳光读了几页。“先做人，次为艺术家，再为音乐家，终为钢琴家”，这句话我半懂不懂，却莫名记在了心里。入了神，自然乐在其中。父亲的床头还放着一本翻旧了的《唐诗选》，每晚睡前他都要读上两页。有时我半夜醒来，还见他倚在床头，“星垂平野阔，月涌大江流”，他读得极慢，仿佛每一个字都要在舌尖上滚过才肯放出来。那声音在静夜里格外清晰，像溪水漫过卵石，像月光铺满大地。以后年龄增长，也曾重读《傅雷家书》，虽然理解比小时候深入，但那种偷偷翻书时心怦怦直跳的紧张与惊喜，却再也找不回来了。后来才懂得，那是一个少年第一次窥见父辈精神世界的悸动，而那份悸动本身就是最深刻的记忆。',
    '学生时代的生活乐趣，很大程度也来自读书。书，给我以广阔的天地，而其中编织我少年美丽的生活花环的，竟是那本从父亲抽屉里“偷”来的《傅雷家书》。',
    '老师入情入理的讲课，也在我心上雕镂下深刻的印象。语文老师教鲁迅的《从百草园到三味书屋》时，忽然放下课本，讲起自己童年捉蟋蟀的趣事，讲着讲着，班上几个男生的眼睛都亮了。那一刻我明白了：好的文字，能唤醒每个人心里的百草园。',
    '老师常对我们说：“多读书，读好书，能丰富知识，增添智慧，成为一个志趣高尚的人。”谆谆教诲铭刻在心，使我一生受用不尽。往事依依，那些与父亲和书相伴的岁月，唤起我对成长的思索，催我不断奋进。'
  ]
},
{
  id:'e28', category:'往事依依', title:'往事依依', note:'巷口的老槐树与《诗经》',
  body:[
    '年华似流水。十几年过去，不少事情已经模糊，有的搜索枯肠而不可得，但有几件与老槐树有关的往事，仍历历在目，至今记忆犹新。',
    '小时候，巷口有一棵要三个孩子才能合抱的老槐树。这只是一棵普通的树，春天看它抽芽，夏天看它浓荫，秋天看它落叶，一天少说路过三四次，竟百看不厌。有时坐在树下发呆，自己也仿佛生了根、长了叶，和它一起呼吸，“绿树村边合，青山郭外斜”，竟品出了几分田园诗的意境。入了神，自然乐在其中。树下的石凳上，常有人留下一两本翻旧的杂志或小人书。有一回我拾到一本《诗经》，封面早没了，前几页也残缺不全，可“蒹葭苍苍，白露为霜”那几行字还在。我坐在石凳上，就着槐叶间漏下的光斑读了一遍又一遍，仿佛看见一条白雾茫茫的河，河对岸站着一个人，怎么也走不到他身边。那种朦朦胧胧的惆怅，至今说不清道不明，却深深印在了心里。以后年岁增长，也曾重读《诗经》全文，虽然理解比小时候深入，但那种初读时如坠云雾、似懂非懂的朦胧美感，却再也找不回来了。后来才懂得，有些文字不需要全懂，那种“在水一方”的怅惘本身，就是最动人的启蒙。',
    '中学时代的生活乐趣，很大程度也来自读书。书，给我以广阔的天地，而其中编织我少年美丽的生活花环的，竟是那本在树下拾到的、残缺的《诗经》。',
    '老师入情入理的讲课，也在我心上雕镂下深刻的印象。语文老师讲《蒹葭》那一课，没有分析段落大意，只让我们全班轻声吟诵。几十个少年的声音叠在一起，像风吹过芦苇，像露水滑过草叶。那堂课结束时，窗外正好起了雾，老师指着窗外说：“看，那就是‘在水一方’。”',
    '老师常对我们说：“多读书，读好书，能丰富知识，增添智慧，成为一个志趣高尚的人。”谆谆教诲铭刻在心，使我一生受用不尽。往事依依，那棵老槐树和树下读诗的日子，唤起我对美的追寻，催我不断奋进。'
  ]
},
{
  id:'e29', category:'往事依依', title:'往事依依', note:'被声音点亮的岁月',
  body:[
    '年华似流水。十几年过去，不少事情已经模糊，有的搜索枯肠而不可得，但有几件与“声音”有关的往事，仍历历在目，至今记忆犹新。',
    '小时候，我家住在一条临街的老巷里。巷子里有一位修鞋的老人，每天清晨，他“笃笃笃”的敲鞋掌声便准时响起。这只是一个普通的声音，天晴响，天阴也响，一天少说听几十下，竟百听不厌。有时躺在床上听久了，自己也仿佛变成了一枚鞋掌，被那“笃笃”声一下一下敲进鞋底，踏踏实实地落在土地上。“长安一片月，万户捣衣声”，我虽没见过捣衣，却觉得那“笃笃”声和诗里的声音一样，都是寻常日子里最安稳的节拍。入了神，自然乐在其中。老人的修鞋摊旁，还常放着一台小收音机，咿咿呀呀地唱戏。有一回放的是《牡丹亭》，“良辰美景奈何天，赏心乐事谁家院”，我一个字也听不懂，却被那婉转的腔调勾住了，站在摊前听了整整一下午。以后年岁增长，也曾再听《牡丹亭》，虽然唱词全懂了，但那种囫囵吞枣却如痴如醉的专注，却再也找不回来了。后来才懂得，那是对声音本身最纯粹的迷恋，比听懂更重要。',
    '中学时代的生活乐趣，很大程度也来自“听”。广播里的评书、电视里的诗词大会、老师讲台上的吟诵，都是我的“书”。而其中最令我沉醉的，竟是语文课上老师用方言念《将进酒》时那种“黄河之水天上来”的气势。',
    '老师入情入理的讲课，也在我心上雕镂下深刻的印象。语文老师有一次用方言朗诵《将进酒》，念到“君不见高堂明镜悲白发”时，声音忽然低下去，像一滴墨落入深水。全班鸦雀无声，窗外的蝉鸣那一刻格外清晰。',
    '老师常对我们说：“多读书，读好书，能丰富知识，增添智慧，成为一个志趣高尚的人。”谆谆教诲铭刻在心，使我一生受用不尽。往事依依，那些被声音点亮的岁月，唤起我对语言的敏感，催我不断奋进。'
  ]
},

/* ═══════════ 这天，我回家晚了 ═══════════ */
{
  id:'e30', category:'这天，我回家晚了', title:'这天，我回家晚了', note:'摔坏的自行车',
  author:'马可扬', school:'北京大学附属中学',
  body:[
    '我忍着疼伸出胳膊，手表上的指针已经指向我平时到家的时间。我双手推着自行车，在车流纵横的马路边缓缓前行，天色逐渐暗下来，我却不想迈向回家的那条路。',
    '冷酷的风刮过胳膊和腿上的伤痕，风吹起的尘土在伤口上作乐，我只能紧锁眉头继续向前走去。看似遥不可及的路途已被我静静走过，我已然出现在家门口，左右徘徊，欲进又止。',
    '我也不明白我为什么不进入家门，只是想到爸爸严厉的眼神和妈妈焦虑的表情，就觉得带着摔坏的自行车回家不太好。我做了一次深呼吸，坐在门口的台阶上，重新梳理事情的脉络，好像是上法庭前的罪犯准备为自己做最后一次辩驳。时间不知不觉过去，黄昏的太阳在朦朦胧胧间沉下。而时间愈是紧迫，家长的训斥必愈是强烈。每次当我鼓起勇气掏出钥匙时，我都会重新退缩，再度考量。夜幕降临，黑暗迫使我从犹豫不决的懦夫变成勇赴沙场的壮士。我踏入了这个我无比向往而又无比畏惧的家。',
    '门打开后，不待家中人讲一句话，我便先开了口：“我有事情，情况特殊，你们都走，离开客厅。”大概是太过于紧张，我嘴里只是磕磕巴巴地蹦出几个词。说完，我悄悄溜进自己的房间，趴在门缝上确定客厅里绝对安全后，才蹑手蹑脚地走到客厅，从柜子中拿出碘酒和棉球，又蹑手蹑脚地回到房间，关紧门。',
    '不过一会儿，妈妈果不出所料地敲开房门，询问事件原委。我虽胆战心惊，却也无可奈何，只好向妈妈如实交代。',
    '“我知道你不想让我知道，摔了车妈妈不怪你，但是你得给我看看你摔哪了，要不然我放心不下……嗯，这得给你消消毒。”',
    '“我已经自己消过毒了，没事了。”',
    '“你这弄得不行，我给你拿酒精再清清创。”',
    '我的心咯噔了一下，预想中的呵斥没有出现，现实中温柔的话语，让我羞愧难当。我为我的犹豫而感到愧疚，为我对母爱的怀疑而感到羞耻。',
    '“我知道你在外面待着不敢回家，没事的。你要记住：我们永远是你可以依靠的避风港，这里永远是你温暖的家。”',
    '“给你把纱布裹上了。准备睡觉吧。”',
    '我躺下，看着那暖黄色的灯光，感觉疼痛在渐渐消失……',
    '这天，我回家晚了；但“家”，永远不嫌我回得晚。'
  ]
},
{
  id:'e31', category:'这天，我回家晚了', title:'这天，我们家晚了', note:'姥姥在灯下等待',
  author:'车', school:'北京大学附属中学',
  body:[
    '夕阳斜斜地挂在天边，把天空染成了金红色。我骑着自行车，穿行在回家的路上，心中满是急切。五点半了，我必须在夜幕降临前赶回家。',
    '此时电话响了：“淘儿啊，几点到家啊？”“我现在就往家骑呢，别急，估计半个小时吧，你们先吃，不用管我。”“那行，路上别贪玩，慢点骑啊。”',
    '挂断电话我就开始往家骑。路过公园时，我抬头望向天空，是风筝，顺着线往下看，便是一群孩子在你追我赶、争先恐后地抢着线轴。那风筝在空中翩翩起舞，仿佛是孩子们心中无忧无虑的梦想。不知不觉，我慢了下来，单脚踩在马路牙子上，心中涌起一阵儿时的回忆——那时的我，也曾如此天真烂漫，追逐着风筝，追逐着快乐。',
    '然而，现实却将我拉回。脚下一滑，我重重地摔在地上。疼痛瞬间传遍全身，我的手掌也被粗糙的地面划破了。我艰难地扶起车，顾不得被粗糙的柏油路面和被锋利树枝划伤的手，简单用纸巾止住血，重新踏上回家的路。',
    '这时，第二通电话来了：“淘儿啊，到哪了？我好看什么时候下面条。”“摔了一跤，估计骑的会慢点，你们真不用等我，先吃吧。”我匆匆挂断电话，继续骑。',
    '夜色渐浓，华灯初上。我拖着疲惫的身体骑过了小区西门，远远地看见姥姥正站在门口焦急地张望。她瘦弱的身影在昏黄的灯光下显得格外单薄，仿佛一座雕塑，在时间的流逝中默默等待着我的归来。我推着车缓缓走近，只见姥姥双手紧握在一起，不时地抬头望向远方，眼神中充满了担忧。她的眉头紧锁，仿佛在思考着我为何迟迟未归。每当有行人经过，她都会急忙抬头查看，希望是她熟悉的模样。',
    '和她隔着一条马路，我拨通姥姥的电话，声音有些颤抖：“姥姥，我回来了，刚才摔了一跤，手划破了，但没事，别担心。”电话那头，姥姥的声音带着责备和关切：“怎么这么不小心啊，摔疼了吧？快点回来吧，我给你准备了热乎乎的饭菜。”',
    '挂断电话，我看到姥姥缓缓转过身来，她的脸上写满了担忧和疲惫，但眼中却闪烁着见到我后的喜悦。她快步走过来，接过我手中的车，又抢过我身上的包。我握着她那双因等待而变得冰凉的手，心中涌起一股暖流。',
    '“怎么骑车这么不小心，让姥姥担心着急。”姥姥虽然责备着，但语气中却满是关心和疼爱。她仔细地检查我的伤口，眼中满是心疼。我望着她，心中涌起一股暖流。',
    '或许就像史铁生说的那样：“儿子的不幸在母亲那里总是加倍的。”外孙的不幸在姥姥那里又加了不知多少倍。那一刻，我再也压制不住我的情感，眼泪不由自主地流下来。',
    '那天，我回家晚了。但姥姥在灯下的等待，让我深刻感受到了家的温暖和家人的牵挂。无论多晚，总有一盏灯为我留着，总有一个人在等我。这份温暖和牵挂，是我前行路上最宝贵的财富。',
    '夜已深，星星点点的灯光在夜色中闪烁。我跟着姥姥的脚步，走进家门。那一刻，我明白了，家，永远是我最温暖的港湾。'
  ]
},
{
  id:'e32', category:'这天，我回家晚了', title:'这天，我回家晚了', note:'陪同桌写作业',
  body:[
    '那一次的经历我至今还牢记在心里，因为那是我回家最晚的一次。我为此感到非常后悔，但是我没有办法改变我已经犯下的错误，我只能让自己以后不再犯这样的错了。',
    '那天下午放学，同桌王×对我说：“今晚我爸妈去加班，我有些害怕，你能陪我一起写作业吗？”接到朋友的邀请，我高兴极了，但仍是很犹豫——我的脑海里闪过爸爸平时叮嘱的话：“放学后不能在外面玩，一定要回家！”但我看到王×那期待的目光，心便软了下来。就陪她写一会儿吧，就一会儿，爸爸要是知道我是为了帮助同学才晚回家，一定不会批评我的。',
    '一进王×的家，那摆设得整整齐齐的书，便映入了我的眼帘。在书架的旁边有个一遇见亮光就会说话的海绵宝宝玩具。她答应我，写完作业就让我玩一会儿。我和她写完作业，一看表，已经8点了。啊！这么晚了爸爸会说我吗？唉，反正都晚了，何不在这里玩个够呢，玩一会儿海绵宝宝再说。就这样，我沉迷玩具，忘记了时间。',
    '当我走出王×家，星星已挂满了天空，道路上一片漆黑，隐隐约约传来怪叫声。那边的草丛中好像有一个东西，会不会是……我不敢再想，脚下的步子不由得加快了，只想赶快到家。',
    '来到了楼下，我的恐惧消失了，但心情却没有半点放松。爸爸会怎么做呢？是一脸愤怒的表情，还是要扬起大手掌打我呢？我真想像孙悟空一样，有七十二变，那样我就会拔下一根毫毛，让它变成我去见爸爸。幻想终究不能成为现实，我必须独自面对自己犯下的错。唉，爸爸要是打就打吧，也算是给自己一个教训。我敲了门，爸爸开门后一怔，随后一下子将我搂在怀里：“宝贝，你上哪去了，担心死爸爸妈妈了。妈妈出去找你，现在还没有回来呢。”我支支吾吾地回答：“我去同学家写作业，又玩了一小会儿。”爸爸说：“以后晚回家一定要告诉我们，不要让家里人为你担心，好吗？”爸爸语气严肃，但并没有严厉批评我，而我心里却无法平静。我只顾着自己玩乐，竟没有顾及家里人的感受，我真是自私啊。',
    '这一次晚回家的经历让我明白了父母对我的爱。对不起，爸爸妈妈，我让你们担心了，我以后再也不会犯这种错误了。'
  ]
},

/* ═══════════ 餐桌前的谈话 ═══════════ */
{
  id:'e33', category:'餐桌前的谈话', title:'餐桌前的谈话', note:'除夕夜的一桌菜',
  author:'李瀚林', school:'北京师范大学三帆中学朝阳学校',
  body:[
    '“老伙计，多吃几块肉。”李奶奶拿起了筷子，夹了一块肉放在对面碗里。',
    '鞭炮声响，除夕夜里，万家灯火，邻里欢声笑语，屋内热气腾腾。',
    '“真是太好了，大家能在这样的日子里一起吃饭。”李奶奶脸上堆满了笑容。饭桌上有好几盘菜，都是老伴和儿子爱吃的，还没怎么动过。',
    '“妈，您放心，我们以后会常这样聚的。”儿子略显疲惫地说道，“您看起来瘦了，也多吃点肉啊。”',
    '李奶奶夹了一根青菜放在自己碗里：“你也辛苦了，在外地工作这么久，也应该吃点好的啊。”',
    '李奶奶出神地回忆道：“还记得从前，我还不怎么会做菜，只是做碗面条，你们就高兴得不行。那时的日子真是艰苦而快乐啊。”',
    '儿子眼眶有些湿润：“我和我爸最爱吃您做的菜。任何一家餐馆也吃不到您做出来的那个味道。”',
    '老伴沉默不语，像是在默许。',
    '李奶奶继续说道：“现在我退休了，慢慢学做菜了。这一大桌子菜都是我从网上学来的。虽然你爸病了，可是我知道他爱吃这些菜，像这盘红烧排骨，我现在也常给他做……”',
    '“妈！您该休息休息了。”儿子有些心疼地说道，“您别老这么辛苦地做菜了，我以后会常回家给您做饭的。”',
    '李奶奶的眼神黯淡了下来，嘟囔了一句：“好吧，我等你以后回来。”',
    '屋子里只剩下碗筷碰撞的声音。',
    '就这样过了几分钟，儿子开口说道：“我想您了，以后肯定会常回家看看的。”',
    '李奶奶慈爱地说道：“你工作太忙了，要多注意休息。我相信你会回来陪我的。”',
    '“我爱您。”',
    '“我们也爱你。”',
    '李奶奶挂断了视频电话，屋子里一点儿声音也没有了，只剩下饭菜腾腾的热气。',
    '“老伙计，你盼望儿子回来吗？”李奶奶轻声问道。',
    '老伴在墙上的照片里看着李奶奶，默不作声。',
    '这世间存在着一种爱——你虽不在我身边，却是我一生一世的想念，我愿为你奉献一切！',
    '鞭炮声更加响了，灿烂的烟火把整个天空点缀得更亮了。“老伙计啊……”李奶奶又夹起一块肉，这次是放到了自己碗里。'
  ]
},
{
  id:'e34', category:'餐桌前的谈话', title:'餐桌前的谈话', note:'悠悠球与旧磁带',
  author:'冯毅远', school:'北京师范大学三帆中学朝阳学校',
  body:[
    '斑驳的瓦片，泛黄的板砖，屋外的米缸。我回望这陪伴我十余载的故土，心中满是不舍。明天，我将踏上前往陌生城市的旅程，那里将有高楼大厦和无数新奇的事物等待着我，但此刻的我，却对这里的一切充满了眷恋。',
    '我低头看着手中紧携的悠悠球，它陪伴了我的整个童年，尽管已经买了很多年，却依然崭新如初，这得益于我的细心呵护。曾经，我凭借着这村里转得最快最久的悠悠球，成了孩子们中的小领袖，它承载了我童年的无数欢乐时光。',
    '我又拾起右手，手中是刚刚从奶奶柜子里悄悄取出的磁带。这是奶奶最珍爱的磁带，她每个下午都会坐在躺椅上，抱着录音机，听着磁带里咿咿呀呀的戏曲。然而，随着时间的流逝，磁带已经老旧，唱出的戏曲也时断时续。',
    '我走在乡间的小路上，心中思绪万千。看着悠悠球，不禁想起前两周我还跟奶奶唠叨悠悠球的轴承生锈了，转不快也转不久了，可惜村里没有卖这种悠悠球的。拐过弯，我来到了村里的旧物品回收站，最后看了一眼我的悠悠球，狠下心问：“老板，这个能卖多少钱？”',
    '出来以后，我攥着手中仅有的二三十块钱，快步走向磁带铺。我想，虽然我可能永远无法理解戏曲的韵味，但奶奶每次听戏时那满足的表情，却深深印在我的心中。我想用这些钱为奶奶买一盘新的磁带，让她能够继续享受她钟爱的戏曲。',
    '夕阳剩下最后一丝余晖，天边火红火红的，我紧紧攥着新买的磁带，生怕它丢失。终于，我回到了家。',
    '“孙子，快来吃饭了！”刚推开院门，奶奶那熟悉的声音便传入耳中。',
    '餐桌上摆满了菜肴，奶奶为我夹了一块肉，温柔地说：“孙子啊，你明天就要走了，要好好学习，不要贪玩。奶奶为你准备了礼物，希望你在外面也能快快乐乐的。”说着，奶奶从口袋中掏出一个小盒子。我打开一看，里面竟是我梦寐以求的悠悠球，是崭新的！我愣住了，泪水在眼眶中打转。',
    '看到我这样，奶奶疑惑道：“怎么了，不喜欢吗？”',
    '我擦了擦鼻子：“没有，奶奶，我真的很喜欢，我只是没想到，我刚把我的旧的悠悠球卖了。”',
    '“你当宝贝的悠悠球，怎么突然就卖了？”',
    '“我想给您买个礼物，我想着反正城里肯定还有各种各样的悠悠球。奶奶，不用担心我了，我给您准备了一个惊喜。”',
    '我掏出了磁带：“奶奶，我给您买了个新的磁带，这里面装的戏就是您最喜欢听的那出，以后您再也不用听断断续续的戏了。”',
    '奶奶什么也没有说，一把把我搂在怀里。',
    '“我的孙儿啊，有了你，奶奶就是全天下最幸福的人啦！”',
    '“奶奶，您快听听吧，肯定跟在现场听一模一样。”我激动地跟奶奶说。',
    '我们坐在餐桌前，奶奶将磁带放入录音机中，悠扬的戏曲声响起。我虽听不懂戏曲的内容，但能感受到奶奶那满足和幸福的神情。这一刻，我觉得自己是世界上最幸福的人。',
    '月亮高高地悬挂在空中，院子里洒满了皎洁的月光，我已经忘了后面和奶奶说了什么，只记得吃了人生中最美味的一次晚餐。'
  ]
},
{
  id:'e35', category:'餐桌前的谈话', title:'餐桌前的谈话', note:'隔壁饭店的善意',
  body:[
    '我家隔壁是家饭店，开了十几年，生意红火。从早到晚，顾客络绎不绝。',
    '因为爸妈下班晚，有时做饭来不及，我放学后便经常去这家店吃饭。这里的价钱不见得比别处便宜多少，生意却是这一带最好的，周围的老人都喜欢上这儿来。难道有专攻老年人的生意套路？我观察许久，也没见店里有对老人的“优惠”。',
    '有一天我刚来店里，便看见一位老人手里捏着一张发皱的五元纸币，颤颤巍巍地走来：“来碗素面。”老板笑吟吟地盛了一大碗面，又留了几大块牛肉，说：“周叔，今天牛肉面不好卖，剩的多了，倒了也可惜，给您来一点儿吧？”老人一脸惊喜地道谢，端着面走了。老板还不忘扶他一把。一旁的我惊得睁大双眼：这家店牛肉面卖得极好，怎么会剩下？我满腹狐疑。',
    '几天后，我跟爸爸妈妈一起吃晚饭，忍不住在餐桌前说起这件事。“这是常有的事，我跟老板认识很久了，他人特别善良。”爸爸语气平淡，“有的老人无儿无女，有的子女不孝顺，吃不上饱饭。老板人厚道，能帮的就帮一把。”',
    '“那生活条件好的老人怎么也常来呢？”',
    '“应该不为别的，就图个舒服。有不少吃饭的地方，口味好，装修得也漂亮，大转桌红木椅，但是不接地气儿，老年人去了肯定不自在，也不好多待。在咱们家隔壁这家店这儿就不一样了，这里装修简单，但是温馨，老板人又客客气气的。老人约上几个老朋友一坐一上午，喝粥聊天。人老了没处去能在这儿打发时间，就够了。”妈妈微笑着告诉我。',
    '我听着妈妈的话，端着饭碗，想起上次在店里吃饭看到的情景：老板一边招待客人，一边时不时插上几句：“是吗，白菜又涨价了？”“考上大学了？好呀，大学生好！”平常寡言木讷的老人都健谈了不少，店里笑声一片。我突然意识到，这哪是一个小店，这分明是一个温暖的家。',
    '此时，饭店老板那瘦小的身形，在我心目中却伟岸起来了。“不求名与利，犹恐身心役……阴功暗心修，善行长日积。”是老板那十几年如一日的善意，让这些孤独的老人们有了欢笑和温暖。',
    '这次餐桌前的谈话，解开了我心中的疑团，也让我知道：一个人小小的善良之举，虽如烛火，但也能给他人带来温暖，也能照亮他人前行的路。'
  ]
},

/* ═══════════ 走出校园 ═══════════ */
{
  id:'e36', category:'走出校园', title:'走出校园', note:'苹果园里的不完美',
  author:'高铭淇', school:'北京市陈经纶中学',
  body:[
    '走出校园，在秋后的苹果园里，我捡起被同学抛弃的一个个苹果，也捡起了自己期中考试后暂时遗落的自信，收获了让我受益一生的道理——成长过程中，我们要学会接纳自己的瑕疵和缺点，接纳独一无二的自己。',
    '进入中学以来，我急切地渴望证明自己。过分地追求完美，让我时常处于焦虑和不安中，害怕自己的不足会被发现，害怕失败带来的嘲笑和否定。然而，尽管我付出了全部的努力，期中考试的成绩却并不如我所愿，我一度在深深的挫败感中沉沦。',
    '期中考试后，学校组织了“攀登·收获”的研学活动，带领我们走出校园，走进挂满苹果的果园。同学们兴高采烈地“开工”了：有的爬上树摘，有的拿着杆子够，有的拿坏苹果打……大家都抬头仰望着枝头完美无瑕的红苹果。我却发现地上有好多还不错的苹果，伴着落叶，凄凉地滚在地上。它们或许有个虫眼儿，或许有些斑点。看着地上那些满是泥土的苹果，我仿佛看到了我自己。人无完人，我想，不能苛求每一个苹果都长成果王。我把这些苹果都收到了我的袋子里。',
    '拎着袋子，我的目光搜索着被同学们“抛弃”的“不完美”苹果。走着走着，我遇到了我的好朋友。他笑着一把拽过我的袋子，瞅了一眼里面的苹果，眼疾手快地挑着捡着，把许多苹果都扔到地上：“你这都是什么苹果呀？都有毛病！”我赶忙摁住袋子：“难道不完美的苹果就一定要被遗弃吗？”他睁大眼睛看着我：“你为什么不在树上摘呢？有那么多好苹果！”我心中涌起一股莫名的情愫，仿佛是要为这些被忽视的苹果鸣不平：“你平时吃的苹果都完美无瑕吗？难道有一处不完美就要扔掉吗？我们只因为看到了一个斑点，就要抛弃一整个苹果吗？”我飞速拿回袋子，捡拾起那些苹果，就像捡拾起对自己的信心。走出校园，一场与“不完美”苹果的邂逅，让我说出了自己真正的心声。',
    '看着这些苹果，我仿佛看到了我自己。每个人都有不完美的地方，我们要学会接纳自己、欣赏自己。真正的自己，或许就藏于一些“斑斑点点”之后。'
  ]
},
{
  id:'e37', category:'走出校园', title:'银杏林的没落', note:'走出校园的遗憾',
  author:'李新怡', school:'莱州程郭学校初中部',
  body:[
    '深秋时节，天气渐冷，其他树叶早早干枯凋零，唯有银杏叶子，明黄透亮，招摇在枝头，随着飒爽的秋风，舞动它美丽的身体。',
    '上午的阳光穿透了银杏林，那叶子金黄金黄的，纯正的黄，黄到蓝天变得更蓝，白云变得更白，于是天底下就只剩下了高天流云和这满树的黄叶。片片叶子随风而落，遍地的黄叶，踩上去有种误入世外桃源、发现金矿的感觉。',
    '只是不巧，当我跟随着家人踩着环绕着小河和银杏林的木栈道，享受松木栈道带来的震颤感和咯吱声时，一个四岁左右的孩子，正把手中的彩色包装袋，随手丢进道边的湖泊中。几条小鱼儿以为来了什么新玩具，绕着包装袋打转、嬉戏。那个年轻的母亲非但没有教育孩子要有公德心、环保意识，反而随手也把手里的食品包装袋丢进了小河里，和孩子说笑着扬长而去。这让我非常不舒服，想制止但已来不及，于是只好愤愤地前行。',
    '往年这个时节，来银杏林观赏美景的游客很多，可是今年除了很多扛着“长枪短炮”的摄影爱好者，银杏林中游客寥寥。走入银杏林，一些老树上结的银杏果掉落在树下，被游客踩踏后，果肉发出阵阵恶臭。可是没有人捡拾，也没有人清扫。银杏林的恶臭让游客望而却步，那些一家人嬉戏踏秋的温馨场面不见了，那些吊床、儿童淘气堡也不见了，那些游客自带的帐篷也不见了，这没落的情景让人看了不免遗憾。',
    '沿着木栈道绕过银杏林再绕回去，就到了宽阔的主路上。主路是一条水泥路，路两边是附近村民摆的小摊，有卖一串串红辣椒、自己雕刻的寓意福禄寿喜的小葫芦等的，也有卖小米、花生、野蘑菇干、茄子干的，还有卖苹果、秋月梨、红山楂等水果的，更有卖气球、爆米花、糖葫芦的……很多年轻的夫妇带着孩子在买糖葫芦等零食，路上漫步的老人少，中年人也不多，我更是另类，在水泥路上来回走了几圈，最终买了糖葫芦和柿饼，算是这次没白来。',
    '往回走的水泥路有些地方开裂了，车行着很颠簸。其实先前挺喜欢这个地方，恰好在小城的边缘，美丽又不浮躁，安闲又不落后，但想想今天看到的一幕幕，却兴味索然，感觉以后不会再来了。究竟是什么原因让银杏林没落了？朋友们，你们能告诉我吗？'
  ]
},
{
  id:'e38', category:'走出校园', title:'让自己勇敢一点', note:'激流勇进',
  body:[
    '走出校园，只要让自己勇敢一点，你会发现外面的世界很精彩。',
    '那是一个绿意浓浓、繁花盛开的盛夏，天空中不时吹来些许微风，让人感觉到游玩的舒爽和惬意。爸爸妈妈带着我，与他们的一些朋友一起去了本市著名的水上世界。',
    '到达水上世界后，曾经来过这里的李叔叔把我们带到一个很热闹的地方。这地方有条河道，河道水流很急，游人坐在河道中的船上，船会被带到非常陡的坡道，然后再快速下降，坐在船上的游人大都发出了惊叫声。一看这种场面，我当时就吓傻了。这时李叔叔说：“谁来玩‘激流勇进’？今天我请客。”王阿姨是个胆大的人，马上就站了出来。我正在进行着激烈的思想斗争：玩还是不玩？船在急流中飞快而去，王阿姨欢呼着：“好刺激啊！”看到我犹豫不决的样子，妈妈在一旁安慰我说：“不敢玩就算了，不要强求自己。”',
    '听了妈妈的话，我想打退堂鼓了，这时爸爸说：“儿子，让自己勇敢一点。”',
    '对，让自己勇敢一点。我暗暗重复着爸爸的话：作为一个男子汉，面对困难应该勇往直前，而不是选择逃避！我暗暗下定决心，于是眼一闭，心一横，登上了小船，小船到达坡道顶端那一刻，时间仿佛都凝固了。我的心提到了嗓子眼儿，牙关咬得紧紧的，呼呼的风声不绝于耳……我惊恐地闭上眼……小船终于停了下来，我长长地舒了一口气，回过头看了一眼，好像也没有那么可怕。',
    '这次“激流勇进”让我明白了一个道理：生活中，遇到困难、挫折时，要有一颗勇敢的心，让自己勇敢一点，你会发现，困难并不可怕，成功其实离你并不遥远。'
  ]
},

/* ═══════════ 遇见 ═══════════ */
{
  id:'e39', category:'遇见', title:'遇见那束温暖的光', note:'卖糖画的老人',
  body:[
    '世间万般，皆是遇见。冷遇见暖，有了雨；春遇见冬，有了岁月；而我遇见了那位卖糖画的老人，便在心底留住了一束温暖的光。',
    '那是去年初冬的傍晚，寒风刺骨，我裹紧了校服，缩着脖子走在放学回家的路上。街角的屋檐下，一盏昏黄的灯亮着，一位头发花白的老爷爷正守着他的糖画摊。铁皮炉子上架着小锅，麦芽糖在里面咕嘟咕嘟地冒着热气，甜丝丝的香味在寒风中飘散。',
    '我忍不住停下脚步。老爷爷正握着长柄铜勺，手腕轻转，金黄色的糖液如丝线般流出，落在光洁的大理石板上。须臾，一只展翅欲飞的“凤凰”便跃然板上。他捏起一根竹签，熟练地一压、一铲，递给了旁边眼巴巴看着的小女孩。',
    '“爷爷，您这手艺真好。”我由衷地赞叹。老爷爷抬起头，脸上的皱纹在灯光下像盛开的菊花：“老咯，做了一辈子，就图个大家高兴。”他笑着，又舀起一勺糖。我买了一只“小兔子”，他特意多绕了几圈，给它画了一个胖乎乎的身体。',
    '在攀谈中，我得知他在这里摆摊已有十几年。无论严寒酷暑，只要不下雨，他总会准时点亮那盏昏黄的灯。他说，现在的孩子零食多，这老手艺快没人学了，但他舍不得丢，他想让这街头巷尾多留一点甜味。',
    '那一刻，我看着他冻得通红的双手和专注的眼神，心中涌起一股莫名的感动。在这个快节奏的时代，这位平凡的老人，用最古朴的方式坚守着一份热爱。',
    '后来，老街改造，糖画摊不见了。但那个寒风中的傍晚，那盏昏黄的灯，那位老人的笑容，却成了我初中岁月里最美的遇见。它让我懂得，平凡的坚守亦能散发温暖的光芒。',
    '遇见您，真好。'
  ]
},
{
  id:'e40', category:'遇见', title:'遇见水墨般的江南', note:'烟雨中的水乡',
  body:[
    '世间万般，皆是遇见。于清风秋月间遇见岁月的静美，而我最难忘的，是在一场烟雨中，遇见了那如诗如画的水墨江南。',
    '初二暑假，我随家人来到南方水乡。那日正逢阴雨，细雨如丝，密密匝匝地织在水面上。我避开喧嚣的人群，独自撑伞走在青石板铺就的小巷中。',
    '脚下的石板被岁月和雨水打磨得光滑温润，踩上去发出清脆的“笃笃”声。两旁是白墙黛瓦的民居，墙根处生着翠绿的青苔。雨水顺着错落有致的马头墙滴落，在檐下汇成一道道晶莹的水帘。',
    '走到一座石拱桥上，我凭栏远眺。河水静静流淌，几只乌篷船在雨中摇曳。船夫戴着斗笠，披着蓑衣，不紧不慢地摇着橹，船桨划过水面，荡起层层涟漪。远处的古塔在水雾中若隐若现，宛如一幅徐徐展开的泼墨山水画。',
    '巷子深处，飘来一阵桂花的清香。我寻香而去，见一位阿婆正坐在门槛上，用竹筛晾晒着刚采下的桂花。她见我看得出神，便笑着招呼：“小姑娘，来避避雨吧。”我坐在阿婆身边，听她讲这水乡的旧事，看雨滴从黑瓦上滑落，时光仿佛在这里放慢了脚步。',
    '在快节奏的现代生活中，我们习惯了步履匆匆。但在这江南的烟雨中，我遇见了另一种生活态度——不急不躁，静谧安然。这里的每一块青砖，每一滴雨水，都在诉说着岁月的从容。',
    '雨渐渐停了，阳光穿透云层，洒在湿漉漉的青石板上。遇见这水墨般的江南，让我在繁忙的学业之余，寻得了一处灵魂的栖息地，懂得了在喧嚣中保持内心的宁静。',
    '这，便是我最美的遇见。'
  ]
},
{
  id:'e41', category:'遇见', title:'遇见千年的墨香', note:'与苏轼相遇',
  body:[
    '世间万般，皆是遇见。于古典诗文中遇见千古的情思，于我而言，最震撼人心的，是在泛黄的书页间，遇见那份跨越千年的孤勇。',
    '初一年，我遭遇了成绩的滑铁卢。看着满是红叉的试卷，我心灰意冷，将自己关在房间里，随手抽出了一本《苏东坡传》。窗外夜雨绵绵，我翻动书页，渐渐走进了那个风雨飘摇的北宋。我仿佛看到，被贬黄州的苏轼，穿着粗布衣裳，在泥泞的沙湖道上艰难前行。没有随从，没有好马，只有满身的疲惫和仕途的失意。',
    '然而，当大雨倾盆而下，同行的人都狼狈躲雨时，他却拄着竹杖，穿着草鞋，在风雨中昂首阔步，吟诵出“竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生”的千古绝唱。那一刻，我仿佛看到了他眼底的豁达与不屈。',
    '我继续读着，读到他被贬惠州，依然能笑着写下“日啖荔枝三百颗，不辞长作岭南人”；读到他被贬儋州（海南），在蛮荒之地仍能开办学堂，教化百姓。他的一生，不是在贬谪之地，就是在前往贬谪之地的路上。但他没有沉沦，而是把苦难熬成了诗，把逆境活成了风景。',
    '合上书，我心中的阴霾早已一扫而空。比起苏轼一生的颠沛流离，我眼前的这点挫折又算得了什么？他那一身蓑衣、一腔孤勇，穿越千年的时光，重重地击中了我的心。',
    '遇见千年的墨香，遇见千古的旷达，让我明白：人生的风雨不可避免，只要心中有光，便能无惧风雨，从容前行。'
  ]
},
{
  id:'e42', category:'遇见', title:'遇见破茧成蝶的自己', note:'长跑及格那天',
  body:[

/* =========================================================
   逻辑区
   ========================================================= */

const $ = sel => document.querySelector(sel);
const tocEl      = $('#toc');
const articleEl  = $('#article');
const crumbEl    = $('#crumb');
const searchEl   = $('#search');
const sidebarEl  = $('#sidebar');
const overlayEl  = $('#overlay');
const progressEl = $('#progress');
const toTopEl    = $('#toTop');
const countTip   = $('#countTip');

let currentId = null;
let query = '';

/* ---------- 工具 ---------- */
function escapeHtml(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function charCount(essay){
  return essay.body.join('').replace(/[^\u4e00-\u9fa5]/g,'').length;
}

function matches(essay, q){
  if(!q) return true;
  const hay = [
    essay.title,
    essay.note || '',
    essay.author || '',
    essay.school || '',
    essay.category,
    essay.body.join('')
  ].join(' ').toLowerCase();
  return hay.includes(q);
}

/* ---------- 渲染目录 ---------- */
function buildTOC(){
  let html = '';
  let total = 0;

  CATEGORIES.forEach(cat => {
    const items = ESSAYS.filter(e => e.category === cat && matches(e, query));
    if(!items.length) return;
    total += items.length;

    html += `<div class="group-title">${escapeHtml(cat)}</div>`;

    items.forEach(e => {
      const active = (e.id === currentId) ? ' active' : '';
      html += `<a class="toc-item${active}" href="#${e.id}" data-id="${e.id}">
        ${escapeHtml(e.title)}
        ${e.note ? `<span class="note">${escapeHtml(e.note)}</span>` : ''}
      </a>`;
    });
  });

  if(!total){
    html = `<div class="empty-tip">没有找到匹配的内容<br>换个关键词试试吧</div>`;
  }

  tocEl.innerHTML = html;
  countTip.textContent = `共 ${total} 篇`;

  scrollActiveIntoView();
}

function scrollActiveIntoView(){
  const el = tocEl.querySelector('.toc-item.active');
  if(!el) return;
  const r = el.getBoundingClientRect();
  const nr = tocEl.getBoundingClientRect();
  if(r.top < nr.top || r.bottom > nr.bottom){
    tocEl.scrollTop += r.top - nr.top - 70;
  }
}

/* ---------- 渲染文章 ---------- */
function renderArticle(e){
  const idx = ESSAYS.findIndex(x => x.id === e.id);
  const prev = idx > 0 ? ESSAYS[idx - 1] : null;
  const next = idx < ESSAYS.length - 1 ? ESSAYS[idx + 1] : null;

  let html = '<div class="article-head">';
  html += `<span class="cat-badge">${escapeHtml(e.category)}</span>`;
  html += `<h1 class="article-title">${escapeHtml(e.title)}</h1>`;
  if(e.note) html += `<div class="article-note">${escapeHtml(e.note)}</div>`;

  html += '<div class="meta">';
  if(e.author) html += `<span><span class="meta-label">作者</span>${escapeHtml(e.author)}</span>`;
  if(e.school) html += `<span><span class="meta-label">学校</span>${escapeHtml(e.school)}</span>`;
  html += `<span><span class="meta-label">全文字数</span>约 ${charCount(e)} 字</span>`;
  html += '</div></div>';

  html += '<div class="article-body">';
  e.body.forEach(p => {
    if(p.startsWith('#')){
      html += `<h3 class="subhead">${escapeHtml(p.slice(1).trim())}</h3>`;
    } else if(p.startsWith('>')){
      html += `<div class="epigraph">${escapeHtml(p.slice(1).trim())}</div>`;
    } else {
      html += `<p>${escapeHtml(p)}</p>`;
    }
  });
  html += '</div>';

  /* 翻页 */
  html += '<nav class="pager">';
  if(prev){
    html += `<a class="pager-btn prev" href="#${prev.id}">
      <span class="p-label">← 上一篇</span>
      <span class="p-title">${escapeHtml(prev.title)}${prev.note ? ' · ' + escapeHtml(prev.note) : ''}</span>
    </a>`;
  } else {
    html += `<a class="pager-btn disabled"></a>`;
  }
  if(next){
    html += `<a class="pager-btn next" href="#${next.id}">
      <span class="p-label">下一篇 →</span>
      <span class="p-title">${escapeHtml(next.title)}${next.note ? ' · ' + escapeHtml(next.note) : ''}</span>
    </a>`;
  } else {
    html += `<a class="pager-btn disabled"></a>`;
  }
  html += '</nav>';

  articleEl.innerHTML = html;

  /* 面包屑 */
  crumbEl.innerHTML = `${escapeHtml(e.category)} <span style="opacity:.5">/</span> <b>${escapeHtml(e.title)}</b>`;

  document.title = `${e.title} · 七年级作文范文集`;
}

/* ---------- 打开某篇 ---------- */
function showEssay(id){
  const e = ESSAYS.find(x => x.id === id);
  if(!e) return;

  currentId = e.id;

  if(location.hash !== '#' + id){
    history.replaceState(null, '', '#' + id);
  }

  renderArticle(e);
  buildTOC();
  window.scrollTo({ top:0, behavior:'auto' });
  closeSidebar();
}

/* ---------- 侧边栏开关 ---------- */
function openSidebar(){
  sidebarEl.classList.add('open');
  overlayEl.classList.add('show');
}
function closeSidebar(){
  sidebarEl.classList.remove('open');
  overlayEl.classList.remove('show');
}

/* ---------- 事件绑定 ---------- */
document.addEventListener('click', ev => {
  const link = ev.target.closest('.toc-item');
  if(link){
    closeSidebar();
  }
});

window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if(id && id !== currentId) showEssay(id);
});

searchEl.addEventListener('input', () => {
  query = searchEl.value.trim().toLowerCase();
  buildTOC();
});

$('#menuBtn').addEventListener('click', openSidebar);
overlayEl.addEventListener('click', closeSidebar);

/* 主题切换 */
const themeBtn = $('#themeBtn');
const themeIcon = $('#themeIcon');

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('essay-theme', t); }catch(e){}

  themeIcon.innerHTML = (t === 'dark')
    ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>'
    : '<path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/>';
}

themeBtn.addEventListener('click', () => {
  const now = document.documentElement.getAttribute('data-theme');
  applyTheme(now === 'dark' ? 'light' : 'dark');
});

/* 滚动进度 & 返回顶部 */
window.addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const p = h > 0 ? (window.scrollY / h) * 100 : 0;
  progressEl.style.width = p + '%';

  if(window.scrollY > 400) toTopEl.classList.add('show');
  else toTopEl.classList.remove('show');
}, { passive:true });

toTopEl.addEventListener('click', () => {
  window.scrollTo({ top:0, behavior:'smooth' });
});

/* 键盘：Esc 关侧栏 */
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape') closeSidebar();
});

/* ---------- 初始化 ---------- */
(function init(){
  let saved = 'light';
  try{ saved = localStorage.getItem('essay-theme') || 'light'; }catch(e){}
  applyTheme(saved);

  const id = location.hash.slice(1);
  showEssay(ESSAYS.some(e => e.id === id) ? id : ESSAYS[0].id);
})();
</script>
</body>
