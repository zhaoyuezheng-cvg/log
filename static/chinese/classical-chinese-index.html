":"a7","t":"汉世老人（阅读）","u":"第 二 单 元","x":"汉世有老人,无子,家富,性俭啬,恶衣蔬食,侵晨而起,侵夜而息，营理产业,聚敛无厌，而不敢自用。或人从之求丐者，不得已而入内取钱十③，自堂而出，随步辄减，比至于外，才余半在，闭目以授乞者。寻复云：\"我倾家赡君，慎勿他说,复相效而来。\"老人俄死，田宅没官，货财充于内帑矣。"},{"id":"a8","t":"酒徒遇蔷鬼","u":"第 二 单 元","x":"襄有嗜酒者,忽遇故人,其故人乃吝之徒。嗜酒者曰：\"望贵府一叙，口渴心烦，或茶或酒，求止渴耳。\"故人曰：\"吾贱寓甚遐，不敢劳烦玉趾。\"嗜酒者，，十三二，好。\"故人曰：\"奈器皿不备,无有杯盏。\"嗜酒者曰：\"吾与尔相知,瓶饮亦好。\"故人曰：\"且待吾半日，吾访友毕即呼尔同归。\"嗜酒者目瞪口呆。"},{"id":"a9","t":"一叶障目","u":"第 二 单 元","x":"楚人居贫,读《淮南方》,得\"螳螂伺蝉叶,可以隐形\"大喜。遂于树下仰望,欲觅螳螂伺蝉自障叶。偶见之，即缘而摘之，然不慎叶落树下。树下先有落叶,不能具分辨,乃扫取数斗归，一一以叶自障，向其妻曰：\"汝见我不？\"妻始时恒答\"见\"，竟日乃厌倦不堪，给云：\"不见。\"楚人默然大喜，明日贲叶人市，对面搜人物。更遂缚而谐官。"},{"id":"a10","t":"州官放火","u":"第 二 单 元","x":"田登作郡守,怒人触其名,犯者必答之,举州皆谓灯为火。值上元放灯，吏揭榜于市，曰：\"本州依例放火三日。\"故语云：\"只许州官放火，不许百姓点灯\",本此。"},{"id":"a11","t":"嗟来之食","u":"第 二 单 元","x":"齐大饥,黔敖为食于路，以待饿者而食之。有饿者蒙袂辑履,贸贸然来。黔敖左奉食,左执饮,曰：\"嗟！来食!\"扬其目而视之,曰：\"予唯不食‘嗟来之食\",以至于斯也。\"从而谢爲。终不食而死。"},{"id":"a12","t":"拔杨容易栽杨难","u":"第 二 单 元","x":"陈贵于魏王。子曰：\"必善事左右。夫杨,横树之即生,倒树之即生，折而树之又生。然使十人树之,而一人拔之,则毋生杨。夫以十人之众,树易生之物,而不胜一人者,何也？树之难而去之易也。子虽工自树于王,而欲去之者众,子必危矣。\""},{"id":"a13","t":"鸟说（阅读）","u":"第 三 单 元","x":"余读书之室,其旁有桂一株焉。桂之上,日有喧喧然者,即而视之,则二鸟巢其枝干之间,去地不五六尺，人手能及之。巢大如盏,精密完固,细草盘结而成。鸟雌一雄一,小不能盈掬,色明洁,娟皎可爱。不知其何鸟也。雏且出矣，雌者覆翼之，雄者往取食，每得食息于屋上不即下。主人戏以手撼其巢，则下瞰而鸣。小撼之小鸣，大撼之即大鸣，手下鸣乃已。他日,余从外来,见巢坠于地，觅二鸟及鷇无有。问之,则某氏僮奴取以去。嗟呼！以此鸟之羽毛洁而音鸣好也，奚不深山之适而茂林之栖？乃托身非所，见辱于人奴以死！彼其以世路为宽也哉！"},{"id":"a14","t":"雁","u":"第 三 单 元","x":"具区之泽,白雁聚焉。夜必择栖,恐人弋己也,设雁奴环巡之;人至则鸣,群雁藉是以膜。泽人熟其故,燃火照之,雁奴嘎然鸣,泽人邃沉其火。群雁皆惊起,视之无物也。如是者三四,群雁以奴给己,共啄之。未几,泽人执火前，雁奴不敢鸣，群雁方痫，一网无遗者。"},{"id":"a15","t":"绳技奇观","u":"第 三 单 元","x":"唐玄宗开元二十四年八月五日,御楼设绳技。技者先引长绳,两端属地,埋轨以系之。又竖数丈之柱以起绳,绳直如弦。技女自绳端足而上,往来忽间,望之如仙。有中路相遇侧身而过者;有着履而行者;有从容俯仰者;或以画竿接腔高五六尺者；或蹋肩蹈顶至三四重者；或翻身掷倒，至绳而住，曾无跌失者：皆应严鼓之节,真奇观也。"},{"id":"a16","t":"蛙与牛斗","u":"第 三 单 元","x":"蛙于草中,视牛渐近,庞然大物也,嫉之。遂吸气鼓腹,欲逾于牛,谓伙曰：\"吾腹稍大，似牛乎？\"伙曰：\"差远矣！\"蛙怒，复吸气鼓腹，曰：\"今如何？\"曰：\"与前无异。蛙暴起，又吸气鼓腹,须史，腹裂而死。牛历其旁，践蛙尸于泥中。此谓不自量力者也。"},{"id":"a17","t":"逼供生冤","u":"第 三 单 元","x":"刘拟山家失金,掠问小女奴,具承卖与打鼓者③。又掠问打鼓者衣服形状,索之不获,仍复掠问。忽尘上似有微声,曰：\"我,狐也,居君家四十年,不露形声,今诚不能忍矣。此非夫人误置漆耶？\"如言求之,果不谬,然小女奴已无完肤。拟山终身悔愧，恒自道之：\"时时不免有此事，安能处处有狐！\"故仕二十余载,狱未尝以刑求。"},{"id":"a18","t":"巴延三毁\"驴香馆\"","u":"第 三 单 元","x":"山西城外有酒肆,所烹驴肉甚香美，遐迩闻名，群呼曰：\"驴香馆\"。其法以草驴一头,养之至肥,先醉以酒,后满身排打。欲割其肉,先钉四柱,将驴足缚住，又以木一横于背,系其头尾，使不得动。后以汤沃其身，去其毛,再以锐刃零割。驴惨号，仁者不忍睹。客欲前后腿，或肚当,或背脊，或头尾，各随其便。当客下箸时,其驴尚未死绝也。乾隆辛丑年,巴延三为山西长，下令毁\"驴香馆\"，为首者斩,其余俱充军戌边，并勒石永禁。"},{"id":"a19","t":"多多益善（阅读）","u":"第 四 单 元","x":"上尝从容与信言诸将能不,各有差。上问曰：\"如我，能将几何？\"信\"多多益善，何为为我禽？\"信曰：\"陛下不能将兵，而善将将，此乃信之所以为陛下禽也。\""},{"id":"a20","t":"韩信钻裤裆","u":"第 四 单 元","x":"韩信者,汉之名将也。少时,好带刀剑。一日,出淮阴屠中,值无赖故辱之，曰：\"若虽长大,好带刀剑,中情怯耳。\"又众辱之曰：\"信敢死,刺我;不敢死,则出过下！\"信熟视之,俯身匍匐,出祷下。一市人皆笑,以为怯。"},{"id":"a21","t":"之乎者也","u":"第 四 单 元","x":"太祖皇帝将展外城,幸朱雀门,亲自规画,独赵韩王普从幸。上指门额问普曰：\"何不祗书朱雀门，须著\"之\"字安用？\"普对曰：\"语助。\"太祖笑曰：\"之乎者也，助得甚事？\""},{"id":"a22","t":"杞人忧天","u":"第 四 单 元","x":"杞国有人，忧天地崩坠,身亡所寄，废寝食者。又有忧彼之所忧者，因往晓之曰：\"天，积气耳，亡处亡气。若屈伸呼吸，终日在天中行止，奈何忧崩坠乎？\"其耀者,只使坠,亦不能有所中伤。\"其人曰：\"奈地坏何？\"晓者曰：\"地,积块耳。充塞四虚,亡处亡块。若踏步毗蹈,终日在地上行止,奈何优其坏?\"其人舍然,晓之者亦舍然大喜。"},{"id":"a23","t":"书生慕名失实","u":"第 四 单 元","x":"有书生以囊萤闻于里。里人高其义,晨谐之。家人谢他往。里人异之,必其囊萤者,令书生白日下惟,敦谐之哉？"},{"id":"a24","t":"王长年智斗倭寇","u":"第 四 单 元","x":"王长年,闽人,嘉靖年间,倭薄省城大掠。长年为贼得,挟人舟。舟中贼可五十人，同执者男女十余人，财物珍奇甚众。贼舟百艘许，同日扬帆泛海去。长年时时伴为好语媚贼，酋长信之。长年乘间谓同执者曰：\"贼还，将抵国，不吾备也。今幸东北风厉,诚能醉贼,得其刀,尽杀之。\"皆曰：\"善！\"会舟夜海中,诸妇为媚歌唱，迭劝酒,饮大醉。妇人收其刀以出，长年手巨,杀人执刀，尽杀之,断缆发舟。旁舟贼觉,追之。舟人持瓷器杂物奋击,毙一酋。长年固善舟，日夜乘风举帆，得脱。"},{"id":"a25","t":"孙叔敖为楚相（阅读）","u":"第 五 单 元","x":"孙叔敖为楚令尹，一国吏民皆来贺。有一老父,衣粗衣,冠白冠,后来吊。孙叔敖正衣冠而见之,谓老人曰：\"楚王不知臣之不肖③,使臣受吏民之诉，人尽来贺，子独后吊，有说乎？\"父曰：\"有说。身已贵而骄人者民去之③，位已高而擅权者君恶之,禄已厚而不足者患处之。\"孙叔敖再拜曰：\"敬受命,愿闻余教。\"父曰：\"位已高而意益下,官益大而心益小,禄已厚而慎不敢取。君谨守此三者，足以治楚矣！\""},{"id":"a26","t":"孙叔敖杀两头蛇","u":"第 五 单 元","x":"孙叔敖为婴儿之时,出游,见两头蛇,杀而埋之,归而泣。其母问其故,叔敖对曰：\"闻见两头之蛇者死。向者吾见之，恐去母而死也。\"其母曰：\"蛇今安在？\"曰：\"恐他人又见，杀而埋之矣。\"其母曰：\"吾闻有阴德者天报之以福，汝不死也。\"及长,为楚令尹,未治而国人信其仁也。"},{"id":"a27","t":"李勉埋金","u":"第 五 单 元","x":"唐时有书生旅宋州。时李勉少年贫苦,与书生同店。不旬日，书生疾作,遂至不治,临绝语勉曰：\"我洪州人也,将于北都求官。于此得疾而死,其命也。\"因出囊金百两遗勉，曰：\"足下为我毕死事，余金奉之。\"勉许为办事，余金乃密置于墓中而同葬爲。后数年，勉任开封尉，书生兄弟寻问至，诘勉余金事,勉携之至墓所，出金為。"},{"id":"a28","t":"季女饮药","u":"第 五 单 元","x":"会稽之东有石氏者,其季女病痞,延良医治之,久而不除,谢医使去。其父思之：\"是良医也，奈何疗之而病不除？\"他日，窃窥之，见其女举药不饮而覆于床下。乃复迎医，强进以前药，三饮之而疾已。"},{"id":"a29","t":"李泰伯改字","u":"第 五 单 元","x":"范文正公守桐庐,始于钓台建严先生祠堂，自为记,其歌词曰：\"云山苍苍，江水決決,先生之德，山高水长。既成，以示李泰伯。泰伯读之三，叹味不已,起而言曰：\"公之文一出,必将名世。某妄意易一字,以成盛美。\"公翟然,握手扣之。答曰：\"云山江水之语,于义甚大，于词甚溥,而‘德’字承之,似局促，拟换作‘风’字如何？\"公凝坐领首,殆欲下拜。"},{"id":"a30","t":"茹太素被杖","u":"第 五 单 元","x":"茹太素陈时务累万言。太祖令中书郎王敏诵而听之。中言才能之士,数年来幸存者百无一二,今所任率迁儒俗吏,言多触。帝怒,召太素面语,杖于朝。次夕复于宫人令人诵之,得其可行者四事，慨然曰：\"为君难,为臣亦不易。朕所以求直言，欲其切于情事。文词太多,便至荧听。太素所陈,五百许言可尽耳,何至万言!\""},{"id":"a31","t":"孔子与弟子言志（阅读）","u":"第 六 单 元","x":"共,之而无憾。\"颜渊曰：\"愿无伐善,无施劳。\"子路曰：\"愿闻子之志。\"子曰：\"老者安之,朋友信之,少者怀之。\""},{"id":"a32","t":"刘敏中之志","u":"第 六 单 元","x":"刘敏中幼卓异不凡，年十三，语其父景石曰：\"昔贤足于学而不求知，丰于功而不自炫,此后人所弗逮也。\"父奇之。乡先生杜仁杰爱其文,呕称之。敏中尝与同侨言其志曰：\"自幼至老相见而无愧色，乃吾志也。\""},{"id":"a33","t":"颜真卿大义凛然","u":"第 六 单 元","x":"李希烈叛，唐德宗遣颜真卿赴汝州召降。朝臣劝其勿行,真卿乃曰：\"君命不可违！\"既见希烈，贼军千余人围而骂之，又欲戮之，真卿色不变，责其背叛朝廷。时希烈欲称帝，希烈知其贤，以宰相之位诱之，真卿斥曰：\"吾年且八十，乃大唐之朝臣，岂受若等诱胁邪！吾守吾节，死而后已！\"贼皆失色。希烈乃囚真卿，于庭中掘坎，扬言坑之，真卿曰：\"死生乃天命，吾何惧之有！\"贼人又积薪于庭，曰：\"不降，当焚之！\"真卿起身赴火，为人所拦。希烈竟缢杀之。"},{"id":"a34","t":"人有四方之志","u":"第 六 单 元","x":"子高游赵。平原君客有邹文、季节者,与子高相善。及将还鲁,诸故人诀，既毕,文节送行三宿；临别,文、节流涕交颐，子高徒拱手而已。分背就路,其徒问曰：\"先生与彼二子善，彼有恋恋之心，未知后会何期，凄枪流涕；而先生唯高,此无乃非亲亲之谓乎？\"子高曰：\"始焉,谓此二子丈夫尔,乃今知其妇人也。人生则有四方之志,岂鹿也哉而常聚乎？\"其徒曰\"若此,二子之泣非邪？\"答曰：\"斯二子,良人也,有不忍之心,若取于断,必不足矣。\""},{"id":"a35","t":"戴胄依法断流","u":"第 六 单 元","x":"有诈伪者事觉,戴胄依法断流。唐太宗曰：\"朕下敕不首者死,今断从流，是示天下以不信。卿欲卖狱乎？\"胃曰：\"陛下当即杀之，非臣所及。既付有司，臣不敢亏法。\"帝曰：\"卿自守法，而令朕失信邪？\"胄曰：\"法者，国家所以布大信于天下也；言者，当时喜怒之所发耳。若顺情而违大信，臣为陛下惜之。\"帝说。"},{"id":"a36","t":"性","u":"第 六 单 元","x":"子子?与友连床,围炉而坐。其友据案阅书,而裳曳于火,甚炽。子子前，拱手作礼致词曰：\"适有一事，欲以奉告。然君天性躁急，恐激君怒；欲以不告，则与人非忠。唯君宽大，能忘其怒，而后敢言。\"友人曰：\"君有何陈，当谨奉教。\"子子复谦谦如初，至再，至三，乃始遂巡言曰：\"是火燃君裳也。友暴起视之，则毁甚矣，作色曰：\"奈何不急以告，而迟缓如是？\"子子曰：\"人谓君性急，今果然耶！\""},{"id":"a37","t":"三人成虎（阅读）","u":"第 七 单 元","x":"庞恭与太子质于邯郸，谓魏王曰\"今一人言市有虎，王信之乎？\"曰：\"不\"寡人信之。\"庞恭曰：\"夫市之无虎也明矣，然而三人言而成虎。今邯郸之去魏也远于市,议臣者过于三人,愿王察之。\"庞恭从邯郸返,竟不得见。"},{"id":"a38","t":"曾母投杼","u":"第 七 单 元","x":"费人有与曾子同名族者而杀人。或告曾子母曰：\"曾参杀人。\"曾子之母曰：\"吾子不杀人。\"织自若。有顷焉，人又曰：\"曾参杀人。\"其母尚织自若也。顷之，一人又告之曰：\"曾参杀人。\"其母惧,投逾墙而走。"},{"id":"a39","t":"卖柴翁殴宦者","u":"第 七 单 元","x":"尝有农夫以驴负柴。宦者称宫市取市,与绢数尺,又就索\"门户\"③,仍须驴送柴之内。农夫涕泣，以所得绢与之。不肯受，曰：\"须得尔驴。\"农夫日；\"我有父母妻子，待此然后食。今以柴与汝，不取直以归，汝尚不肯，我有死而已！\"遂殴宦者。"},{"id":"a40","t":"螳螂捕蝉","u":"第 七 单 元","x":"吴王欲伐荆,告其左右曰：\"敢有谏者死！\"舍人有少孺子②者欲谏不敢，则怀丸操弹于后园,露沾其衣,如是者三旦。吴王曰：\"子来,何苦沾衣如此！\"对曰：\"园中有树，其上有蝉，蝉高居悲鸣，饮露，不知螳螂在其后也；螳螂委身曲附，欲取蝉，而不知黄雀在其傍也；黄雀延颈，欲啄螳螂，而不知弹丸在其下也。此三者皆务欲得其前利，而不顾其后之有患也。\"吴王曰：\"善哉！\"乃罢其兵。"},{"id":"a41","t":"尹绰之爱","u":"第 七 单 元","x":"赵简子有臣尹绰、赦厥。简子曰：\"厥也爱我,谏我必不于众人中；绰也不爱我，谏我必于众人中。\"尹绰曰：\"厥也爱君之丑而不爱君之过；臣爱君之过而不爱君之丑。\"孔子曰：\"君子哉,尹绰！面皆不面誉也。\""},{"id":"a42","t":"楚之南有猎者","u":"第 七 单 元","x":"鹿畏躯,驱畏虎,虎畏黑。黑之状,被发人立,绝有力甚害人焉。楚之南有猎者,能吹竹为百兽之音,为鹿鸣以感其类,伺其至,发火而射之。驱闻鹿鸣，趋而至。猎人恐，因为虎鸣而骇之，驱走而虎至，愈恐；则又为黑，虎亦亡去。黑闻而求其类,至则人也,摔搏撕裂而食之。"},{"id":"a43","t":"姚坦直言\"血山\"（阅读）","u":"第 八 单 元","x":"王,帝第五子元杰也。尝作假山,召僚属置酒,众皆褒美,坦独俯首。王强使视之,坦曰：\"但见血山,安得假山?\"王惊问故,坦曰：\"坦在田舍时，见州县督税，上下相急，父子兄弟鞭答苦楚，血流满身。此假山皆民租所出，非血山而何！\"时帝亦为假山未成，闻之呕毁焉。"},{"id":"a44","t":"王安国直言","u":"第 八 单 元","x":"王安国性亮直，嫉恶太甚。王安石初为参知政事，闲日因阅读晏元献公小词而笑曰：\"为宰相而作小词，可乎？\"平甫曰：\"彼亦偶然自喜而为尔，顾其事业岂止如是耶！\"时吕惠卿为馆职，亦在坐，遵曰：\"为政必先放郑声，况自为之乎？\"平甫正色曰：\"放郑声，不若远人也。\"吕以为议已，自是尤与平甫相失也。"},{"id":"a45","t":"陈章侯拒视显贵","u":"第 八 单 元","x":"陈章侯性诞僻,好游于酒。人所致金钱随手尽。尤喜为贫不得志人作画，周其乏。凡贫士藉其生,数十百家。若豪贵有势力者索之,虽千金不为笔也。一龈显者，诱之人舟，方将鉴定宋元人笔墨。舟既发，乃出绢强之画。章侯科头裸体,馒骂不绝。显者不听。遂欲自沉于水。显者拂然,乃自先去。托他人代求之,终一笔不施。"},{"id":"a46","t":"王翱秉公","u":"第 八 单 元","x":"王翱一女,嫁于畿辅某官为妻。公夫人甚爱女,每迎女,婿固不遣。恚而语女曰：\"而翁长铨,迁我京职,则汝朝夕侍母;且迁我如振落叶耳,而何吝者？\"女寄言于母。夫人一夕置酒,跪白公。公大怒,取案上器击伤夫人,出,驾而宿于朝房，旬乃还第。婿竟不调。"},{"id":"a47","t":"次非斩蛟","u":"第 八 单 元","x":"荆有次非者,得宝剑于干遂。还反涉江,至于中流,有两蛟夹绕其船。臂祛衣,拔宝剑曰\"此江中之腐肉朽骨也。弃剑以全众,余奚爱焉？\"于是赴江刺蛟,杀之而复上船。舟中之人皆得活。"},{"id":"a48","t":"法不赦故人","u":"第 八 单 元","x":"濮州刺史庞相寿坐贪污解任②，自陈尝在秦王④幕府。上怜之。欲听归任。魏徽谏曰：\"秦王左右甚多,恐人人恃私恩，足使为善者惧。\"上欣然纳之，谓相寿曰：\"我昔为秦王,乃一府之王;今居大位,乃四海之主,不得独私故人!\"赐帛遣之,相寿流沸而去。"},{"id":"a49","t":"圯上老人（阅读）","u":"第 九 单 元","x":"良尝闲,从容步游下邳圯上,有一老父,衣褐,至良所,直堕其履圯下，顾谓良曰\"孺子③，下取履！\"良愕然，欲殴之。为其老,强忍，下取履。父曰：\"履我！\"良业为取履,因长跪履之。父以足受,笑而去。良殊大惊,随目之。父去里所,复还,曰：\"孺子可教矣。后五日平明，与我会此。\"良因怪之,跪曰：会。\"五日鸡鸣，良往，父又先在，复怒曰：\"后，何也？\"去，曰：\"后五日复早来。\"五日，良夜未半往。有顷，父亦来，喜曰：\"当如是。\"出一编书，曰：\"读此则为王者师矣。……….\"遂去,无他言,不复见。旦日视其书,乃《太公兵法》也。"},{"id":"a50","t":"张良劝刘邦劳军","u":"第 九 单 元","x":"楚汉久相持未决。丁壮苦军旅,老弱疲转饷。刘邦、项羽相与临广武之间而语。项羽欲与汉王独身挑战。刘邦数项羽。项羽大怒，使伏弩射中刘邦。刘邦伤胸,乃扪足曰：\"虏中吾指！\"刘邦创卧。张良强请刘邦行劳军,以安士卒，毋令楚乘胜击汉。"},{"id":"a51","t":"欧阳修家教","u":"第 九 单 元","x":"欧阳修四岁而孤，家贫无资，母以荻画地，教以书字。多诵古人篇章，使学为诗。及稍长,而家无书读,就间里士人家假而读之。或因而抄录。抄录未毕,而已能诵其书。以至昼夜忘寝食,唯读书是务。自幼所作诗赋文字，下笔已如成人。"},{"id":"a52","t":"唐太宗纳谏","u":"第 九 单 元","x":"贞观三年,太宗谓裴寂曰：\"比有上书奏事,条数甚多。朕总黏之屋壁,出人观省。所以孜孜不倦者，欲尽臣下之情。每一思政理,或三更方寝。亦望公辈用心不倦，以副朕怀也。\""},{"id":"a53","t":"不龟手之药","u":"第 九 单 元","x":"宋人有善为不龟手之药者,世世以漂洗为业。客闻之,请买其方百金。聚族而谋曰：\"我世世为漂洗，不过数金，今一朝而技百金，请与之。\"客得之，以说吴王。越有难,吴使之将。冬与越人水战,大败越人。裂地而封之。能不龟手一也,或以封,或不免于漂洗,则所用之异也。"},{"id":"a54","t":"墨子喻巫马子","u":"第 九 单 元","x":"巫马子谓墨子曰\"子兼爱天下,未云利也；我不爱天下,未云贼也。功皆（）未至，子何独自是而非我哉？\"墨子曰：\"今有燎者于此，一人奉水以灌之，一人操火将益之，功皆未至，子以二人何贵？\"巫马子曰：\"我是彼奉水者之意，而非夫操火者之意。\"墨子曰：\"故吾是吾意而非子之意也。\""},{"id":"a55","t":"顾炎武手不释卷（阅读）","u":"第 十 单 元","x":"凡先生之游,以二马三骤载书自随。所至厄塞，即呼老兵退卒询其曲折;或与平日所闻不合，则即坊肆中发书对勘之。或径行平原大野,无足留意，则于鞍上默诵诸经注释。偶有遗忘,则即坊肆中发书而熟复之。"},{"id":"a56","t":"惜时好学","u":"第 十 单 元","x":"钱思公虽生长富贵，而少所嗜好。在洛阳时，尝与僚属言：\"平生唯好读书，坐则读经史，卧则读小说，上厕则阅小辞③，盖未尝顷刻释卷也。\"谢希深亦言,宋公垂同在史院,每走厕，必挟书以往,讽诵之声,琅然闻于远近,其笃学如此。余因谓希深曰：\"余平生所作文章，多在三上，乃马上、枕上、厕上也。盖唯此尤可以属思尔。\""},{"id":"a57","t":"王冕僧寺夜读","u":"第 十 单 元","x":"王冕者,诸暨人也。七八岁时,父命牧牛陇上,窃入学舍,听诸生诵书。听已,辑默记。暮归,忘其牛。父怒挞之,已而复如初。母曰：\"儿痴如此，不听其所为!\"冕因去家依僧寺而居。夜潜出,坐佛膝上,执策映长明灯读之,琅琅达旦。佛像多土偶,狩恶可怖;冕小儿,恬然若不见。安阳韩性闻而异之,录为弟子。后遂为通儒"},{"id":"a58","t":"宋濂勤学不怠","u":"第 十 单 元","x":"余幼时即嗜学。家贫,无从致书以观,每假于藏书之家,手自笔录,计日以还。天大寒,砚冰坚,手指不可届伸,弗之怠。录毕,走送还之,不敢稍逾约。以是，人多以书假余,余因得观群书。"},{"id":"a59","t":"王桑默记","u":"第 十 单 元","x":"王粲与人共行，读道边碑，人问曰：\"卿能默诵乎？\"曰：\"能。\"因使背而诵之,不失一字。尝观人围棋,局坏,粲为复之。棋者不信,以帕盖局,更以他局为之，以相比较，仍不误一子，众人呀之。其强记默识乃如此。"},{"id":"a60","t":"张溥与七录斋","u":"第 十 单 元","x":"张溥幼嗜学,所读书必手抄,抄已,朗诵一过即焚之;又抄,如是者六七始已。左手握管处指掌成茧。冬日手皱，日沃汤数次。后名读书之斋曰\"七录\"。溥诗文敏捷,四方征索者,不起草,对客挥毫。俄顷立就，以故名高一时。"},{"id":"a61","t":"贤妻桓少君（阅读）","u":"第 十一 单 元","x":"鲍宣妻者,桓氏之女也,字少君。宣尝就少君父学。父奇其清苦,故以女妻之,装送资贿甚盛。宣不悦,谓妻曰：\"少君生富骄，习美饰，而吾实贫贱，不敢当礼。妻曰：\"大人以先生修德守约，故使贱妾侍执巾栉。既奉承君子③，唯命是从。\"宣笑曰：\"能如是，是吾志也。\"妻乃悉归侍御服饰，更著短布裳，与宣共挽鹿车归乡里。拜姑礼毕，提瓮出汲，修行妇道,乡邦称之。"},{"id":"a62","t":"缇萦救父","u":"第 十一 单 元","x":"汉文帝四年中,人上书言淳于意受赂,以刑罪传西之长安。意有五女，随而泣。意怒，骂曰：\"生子不生男，缓急无可使者！\"于是少女缇蒙伤父之言，乃随父西之长安，上书曰：\"妾父为吏，齐中称其廉平，今坐法当刑。妾切痛死者不可复身,而刑者不可复续,虽欲改过自新,其路莫由。妾愿入身为官婢,以赎父刑罪。\"上闻而阀其意，此岁即除刑肉法。"},{"id":"a63","t":"晏子御者之妻","u":"第 十一 单 元","x":"晏子为齐相,出。其御之妻从门间而窥,其夫为相御,拥大盖,策驷马,意气扬扬,甚自得也。既而归,其妻请去。夫问其故，妻曰：\"晏子长不满六尺,身相齐国,名显诸侯。今者,妾观其出,志念深矣,常有以自下者。今子长八尺,乃为人仆御,然子之意,自以为足,妾是以求去也。\"其后夫自抑损。晏子怪而问之，御以实对。晏子荐以为大夫。"},{"id":"a64","t":"李密侍奉祖母","u":"第 十一 单 元","x":"李密,西晋武阳人,字令伯。早孤,母再适,祖母刘氏养之。少仕蜀,蜀亡,晋武帝③征为太子洗马,不受命,或疑其不欲归晋,武帝遣人再三趣之,乃上书,其文曰：臣密今年四十有四,祖母刘今年九十有六,是臣尽节于陛下之日长,报养刘之日短。其言诚而凄。帝阀之。刘氏卒,遂至京师任职。"},{"id":"a65","t":"永泉夫妇事亲","u":"第 十一 单 元","x":"永泉者,扬州人也,年而立而未取。家有母,年且七十,病于床。泉日出而作，日人而息，事母未尝废离。邑有女，年二九②,以泉为孝，欲附之。父母不允，女竭力争，不许，遂私奔。十年后，泉母卒，哀而葬，邻里称之。其时女之亲亦病，其兄嫂弟媳弃之不顾，泉曰：\"尔事吾母若己母，今汝亲有病，吾亦当视尔亲为吾亲。\"即延母归。永泉夫妇事之五年，竟复而得康。女之亲始悟：人之善与非，非钱财可度，皆在乎心焉。"},{"id":"a66","t":"何梅谷之妻","u":"第 十一 单 元","x":"何梅谷,鄱阳人也。其妻垂老,好佛事，自旦至夕,必口念\"观音菩萨\"千遍。何梅谷以儒学闻于时，止之则弗从,勿止又恐贻笑士人,进退狼。一日，呼妻至再三，人夜随呼勿辙。妻怒曰\"何噪若是耶？\"梅谷徐答曰：\"仅呼半日汝即怒我，观音一日被尔呼千遍，安得不汝怒耶？\"妻顿悟，遂止。（）"},{"id":"a67","t":"吕蒙正不记人过（阅读）","u":"第 十二 单 元","x":"吕蒙正相公不喜记人过。初参知政事，入朝堂，有朝士于帘内指之曰：\"是小子亦参政邪？\"蒙正佯为不闻而过之。其同列怒之，令诘其官位姓名,蒙正止之。罢朝,同列犹不能平，悔不穷问。蒙正曰：\"若一知其姓名,则终身不能复忘,固不如毋知也。不问之,何损？\"时皆服其量。"},{"id":"a68","t":"石勒不计前嫌","u":"第 十二 单 元","x":"后赵王勒,悉召武乡耆旧诣襄国,与之共坐欢饮。初,勒微时,与李阳邻居,数争麻池相殿，阳由是独不敢来。勒曰：\"阳，壮士也；麻，布衣之恨。孤方兼容天下，岂仇匹夫乎！\"召与饮，引阳臂曰：\"孤往日養老拳，卿亦饱孤毒手。\"因拜参军都尉"},{"id":"a69","t":"李遥杀人案","u":"第 十二 单 元","x":"随州大洪山李遥杀人亡命,逾年至秭归,过市见售杖者,以数十钱市之。是时秭归适有民为人所杀，求贼甚急。死者之子见李遥所操杖，识之，曰：\"此吾父杖也。遂告官。吏执遥讯之,果死者之杖也，榜掠备至。遥实买杖，而售者已不见，卒无以自明。吏语其行止来历，势不可隐，乃递随州，大洪山杀人案遂败。市人千万而遥适遇之,因缘及其隐情而败,此事亦奇矣。"},{"id":"a70","t":"刘颇当机立断","u":"第 十二 单 元","x":"混池道中,有车载瓦瓮,塞于隘路。属天寒冰雪峻滑,进退不得。日向暮，官私客旅群队,铃铎数千,罗拥在后，无可奈何。有客刘颇者，扬鞭而至，问曰：\"车中瓮直几钱？\"答曰：\"七八千。\"颇遂开囊取嫌，立偿之。命僮仆登车，断其结络,悉推瓮于崖下。须史,车轻得进,群噪而前。"},{"id":"a71","t":"钟弱翁露丑","u":"第 十二 单 元","x":"钟弱翁所至,好贬榜额字画，必除去之,然后自立新意重书之。然书实不工,从者皆苦之。曾过一山寺,有高阁壮丽。弱翁与僚属拥立,望其额,日③\"定惠之阁\"，题者姓名漫灭。弱翁恣意称谬，使僧梯取，拂拭就视,乃鲁国颜真卿书。弱翁顾谓僚属曰：\"如此字，何不刻石？\"即令人刻之。传者以为笑。"},{"id":"a72","t":"龚自珍忘形","u":"第 十二 单 元","x":"山民至扬,多寓予园之秋实轩。秋实轩者,有古桐树数株,相传为李唐旧植。山民暇辑低咏其下。一夕，与客谈甚欢,遂坐桌上，送客，靴不知所在。越数日，山民行，仆辈于帐顶得之。盖谈笑极惬，手舞足蹈,无意之际,不觉靴之飞去耳。"},{"id":"a73","t":"许允之妻（阅读）","u":"第 十三 单 元","x":"许允为吏部郎，多用其乡里，魏明帝遣虎责收之。其妇出诫曰：\"明主可以理夺,难以情求。\"既至，帝核问之，允对曰：\"举尔所知。臣之乡人，臣所知也。陛下检校，为称职与不？若不称职，臣受其罪。\"既检校，皆官得其人，于是乃释。允衣服败坏，诏赐新衣。初允被收，举家号哭。妇自若，云：\"勿忧，寻还。\"作粟粥待。顷之，允至。"},{"id":"a74","t":"班昭续《汉书》","u":"第 十三 单 元","x":"扶风曹世叔妻者，同郡班彪之女也，名昭，字惠班，博学高才。世叔早卒，兄固著《汉书》，其八表及天文志未及竟而卒。和帝?诏昭就东观藏书阁而成之。帝数召入宫,令皇后诸贵人师事焉,号曰\"大家\"。每有贡献异物,则诏大家作赋颂。时《汉书》始出，多未能通者，同郡马融伏于阁下，从昭受读。"},{"id":"a75","t":"浙东愚妇","u":"第 十三 单 元","x":"浙东有妇,育一子。其夫嗜赌,室中财物罄,家徒壁立。妇规之曰：\"室无现粮何以存,愿改邪归正。\"夫怒，拳脚相加。哀告邻里，莫之止。一日，妇携子出，推堕河中,溺死。事觉，系妇。吏曰：\"汝何为溺子？\"妇曰：\"夫毒，吾无以报\"，，，反亏，何苦如此！\""},{"id":"a76","t":"农妇斥神","u":"第 十三 单 元","x":"夏,张氏姑妇同刘麦。方收拾成堆,忽有旋风自西南来,吹之西散。妇（）怒，以镰掷之一一洒血数滴于地。方共复收拾，妇倒地如醉，魂为人缚至一神祠。神怒斥曰：\"悍妇乃敢伤我吏，速受杖！\"妇性素刚，抗声曰：\"贫家种麦数亩，假以活命。烈日中姑妇辛苦刘,方毕，乃为怪风吹散，疑为鬼崇③，故以镰掷之,无意伤大王使者,何罪？且大王之使者往来自有官路,何以横经民田,败人麦？以此受杖，实所不甘！\"神俯首曰：\"尔词直，可反。\"妇顿苏，而旋风复至，仍卷其麦成堆。"},{"id":"a77","t":"孝","u":"第 十三 单 元","x":"丐不如其乡里,明孝宗时,尝行乞于吴。凡所得,多不食,每贮之竹筒中。见者以为异，久之,其故，曰：\"吾有母在，将以遗之。\"有好事者欲窥其究，迹之行。行里许，至河旁，竹树掩映，一澈舟系柳阴下。舟虽蔽，颇洁，有老坐其中。坐地，出所贮饮食整理之,奉以登舟。侯母举杯,乃起唱歌、为儿戏，以娱母。母食尽,然后他求。一日乞道上无所得，惫甚。有沈孟渊者,哀而与之食，宁忍饿，终不先母食也。如是者数年，母死，不知所终。自言沈姓，年可三十。"},{"id":"a78","t":"华隆获救","u":"第 十三 单 元","x":"华隆好猎，畜一犬，号曰\"的尾\"，每出必从。一日，隆至江边，为大蛇围绕周身。犬遂奋而咋蛇,蛇死焉。而隆僵仆于地，不省人事。犬疾走至家,嗪不止。举家怪之,因随犬往,见隆闷绝委地。车载归家，二日乃苏。隆未苏之间，犬终日不食。如此爱怜,如同亲戚爲。"},{"id":"a79","t":"吕僧珍为官（阅读）","u":"第 十四 单 元","x":"僧珍在任，平心率下,不私亲戚。从父兄子先以贩葱为业，僧珍既至，乃弃业欲求州官。僧珍曰：\"吾荷国恩，无以报效，汝等自有常分，可解以益其宅。僧珍怒曰：\"督邮官癖也，置立以来，便在此地，岂可徒之益吾私宅！\"姊适于氏，住在市西,小屋临路,与列肆杂处，僧珍常导从卤薄到其宅，不以为耻。"},{"id":"a80","t":"一钱太守","u":"第 十四 单 元","x":"刘宠尝任会稽太守,简除烦苛,禁察非法,郡中大治;征为将作大匠。山阴县有五六叟，自若邪山谷间出，人资百钱以送宠，曰：\"山谷生，未尝识郡朝，他守时，吏发求民间，至夜不绝，或狗吠竟夕，民不得安。自明府下车以来，狗不夜吠，民不见吏；年老值圣明，今闻当见弃去，故相扶奉送。\"宠曰：\"吾政何能及公言邪！勤苦父老！\"为人选一大钱受之。"},{"id":"a81","t":"牛屋修刺","u":"第 十四 单 元","x":"褚季野以章安令迁太尉记室参军，名已显而位微，人未多识。公东出，乘估客船,送故吏数人投钱塘亭住。尔时吴兴沈充为县令,正送客过浙江。客出，亭吏驱公移牛屋下。潮水至，沈令起，问：\"牛屋下是何人？\"吏云：\"昨有一伦父来寄亭中，有尊贵客，权移之。\"令有酒色，因遥问：\"父欲食饼不？姓敢移公，便于牛屋下修刺谐公。更宰杀为馕，于公前鞭挞亭吏，欲以谢公。公与之酌宴，言色无异,状如不觉。令送公至界。"},{"id":"a82","t":"海瑞清廉","u":"第 十四 单 元","x":"都御史刚峰海公,卒于官舍。同乡宦南京者,唯苏民怀一人。苏检点其宦囊，竹箱中俸金八两，葛布一端，旧衣数件而已。如此都御史那可多得！王凤洲评之云：\"不怕死，不爱钱，不立党。\"此九字断尽海公生平，即千万言诀之，能加于此评乎？"},{"id":"a83","t":"解扁劳民","u":"第 十四 单 元","x":"解扁为东封,上计而人三倍,有司请赏之。文侯曰\"吾土地非益广也，人民非益众也,人何以三倍？\"对曰：\"以冬伐木而积之,于春浮之河而之。\"文侯曰：\"民春以力耕，暑以强耘，秋以收敛，冬闲无事。以伐林而积之，负轭而浮之河,是用民不得休息也。民以蔽矣,虽有三倍之人,将焉用之！\""},{"id":"a84","t":"丧家狗","u":"第 十四 单 元","x":"孔子适郑,与弟子相失，孔子独立郭东门。郑人或谓子贡曰：\"东门有人，其颖似尧,其项类皋陶,其肩类子产③,然自要以下不及禹三寸,累累若丧家之狗。\"子贡以实告孔子。孔子欣然笑曰：\"形状，未也。而谓似丧家之犬，然哉！然哉！\""},{"id":"a85","t":"鲁宗道刚直（阅读）","u":"第 十五 单 元","x":"鲁简肃公宗道,仁宗时参政事。京师富民陈子城殴杀磨工,初有诏立赏追捕，数日，中旨罢之。鲁公争于帘前曰：\"陈某家豪，不宜包庇！\"章献怒曰：\"卿安知其家豪？\"鲁公曰：\"若不家豪，安得关节至禁中？\"章献默然。"},{"id":"a86","t":"赵普力争于帝前","u":"第 十五 单 元","x":"赵普独相凡十年,刚毅果断,以天下事为已任。尝欲除某人为某官,帝不用；明日,复奏之,又不用；明日,更奏之。帝怒，裂其奏投诸地。普颜色自若，徐拾奏归,补缀?，复奏如初。帝悟，卒可其奏，后果以称职闻。又有立功当迁官者，帝素嫌其人，不与。普力请与之，帝怒日；\"朕不与迁官，将奈何？\"普曰：\"刑以惩恶，赏以酬功，刑赏者天下之刑赏，非陛下之刑赏也，岂得以喜怒专之！\"帝弗听,起，普随之。帝人宫，普立于宫门,良久不去。帝竟从其请。"},{"id":"a87","t":"宋濂实对","u":"第 十五 单 元","x":"宋濂尝与客饮，帝密使人侦视。翌日，问濂昨饮酒否？坐客为谁？何物？濂具以实对。笑曰：\"诚然，卿不朕欺。\"间召问群臣臧否。唯举其善者对，曰：\"善者与臣友,其不善者不能知也。\""},{"id":"a88","t":"涂有功秉公执法","u":"第 十五 单 元","x":"皇甫文备,武后时酷吏也，与徐大理论狱，诬徐党逆人,奏成其罪。武后（）特出之。无何,文备为人所告，有功讯之在宽。或曰：\"彼时将陷公于死，今公反欲出之，何也？\"徐曰：\"汝所言者，私念也；我所守者，公法也。安可以私害公？\""},{"id":"a89","t":"范文正正直","u":"第 十五 单 元","x":"范文正公仲淹贫③,依唯阳朱氏家，常与一术者游。会术者病笃，使人呼文正而告曰：\"吾善炼水银为白金，吾儿幼，不足以付，令以付子。\"即以其方与所成白金一斤封志,内文正怀中,文正方辞避,而术者气已绝。后十余年,文正为谏官,术者之子长,呼而告之曰：\"而父有神术，昔之死也，以汝尚幼,故俾我"},{"id":"a90","t":"东施效颦","u":"第 十五 单 元","x":"西施病心而其里。其里之丑人见而美之,归亦捧心而其里。其里之富人见之,坚闭门而不出；贫人之,挚妻子而去之走。彼知聲美，而不知之所以美。"},{"id":"a91","t":"管仲论\"贵天\"（阅读）","u":"第 十六 单 元","x":"桓公问管仲曰：\"王者何贵？\"曰：\"贵天。\"桓公仰而视天。管仲曰：\"所谓天者,非谓苍苍莽莽之天也。君人者以百姓为天，百姓与之则安,辅之则强，非之则危,背之则亡。……·民怨其上,不遂亡者,未之有也。\""},{"id":"a92","t":"唐太宗论\"甲兵\"","u":"第 十六 单 元","x":"房玄龄奏\"阅府库甲兵，远胜隋世。\"上曰：\"甲兵武备，诚不可缺，然炀帝甲兵岂不足邪,卒亡天下。若公等尽力,使百姓义安,此乃朕之甲兵也。\""},{"id":"a93","t":"曹彬攻金陵","u":"第 十六 单 元","x":"宋将曹彬攻金陵?,将克,忽称疾,诸将惊,咸来问疾,冀其早愈。彬曰：\"余之病非药石所能治,唯需诸公共发诚心，自誓于克城之日，不妄杀一人，则自愈。\"诸将许诺,当即焚香为誓,明日称愈。及克金陵,城中安堵如故。又,曹翰克江州,其久不下,城克,屠戮无余。（）"},{"id":"a94","t":"唐太宗论止盗","u":"第 十六 单 元","x":"上与群臣论止盗。或请重法以禁之。上晒之曰：\"民之所以为盗者，由赋繁役重，官吏贪求,饥寒切身,故不暇顾廉耻耳。朕当去奢省费,轻薄赋,选用廉吏,使民衣食有余,则自不为盗,安用重法耶!\"自是数年,海内升平,路不拾遗，外户不闭，商旅野宿爲。"},{"id":"a95","t":"以人为镜","u":"第 十六 单 元","x":"唐太宗谓侍臣\"曰：\"夫以铜为镜,可以正衣冠,以古为镜,可以知兴替,以人为镜,可以明得失。朕常保此三镜，以防己过。今魏徽逝，遂亡一镜。徽亡后,朕遣人至其宅,得一表,始立草,字皆难识,唯前数行稍可分辨,云：天下之事，有善有恶。任善人则国安，用恶人则国乱。情有爱憎，若爱而知其恶，憎而知其善,去邪勿疑,任贤勿贰,则国家可兴。\""},{"id":"a96","t":"骠骑将军霍去病","u":"第 十六 单 元","x":"骠骑将军为人,少言不泄,有气敢往。天子尝欲教之孙、吴兵法,对曰：（）\"顾方略如何耳，不至学古兵法。\"天子为治第，令骠骑视之，对曰：\"匈奴未灭，无以为家也！\"由此，上益重爱之。"},{"id":"a97","t":"陈元方答客（阅读）","u":"第 十七 单 元","x":"陈太丘与友期行,期日中，过中不至，太丘舍去。去后乃至。元方时年七岁，门外戏。客问元方：\"尊君在不？\"答曰：\"待君久不至，已去。\"友人便怒曰：\"非人哉，与人期行相委而去！\"元方曰：\"君与家君期日中，日中不至，则是无信；对子骂父,则是无礼！\"友人惭，下车引之。元方人门不顾。"},{"id":"a98","t":"陈元方遭父丧","u":"第 十七 单 元","x":"陈元方遭父丧，哭泣哀，躯体骨立。其母阀之，窃以锦被蒙之。郭宗林吊而见之，谓曰：\"卿海内之俊才，四方是则，如何当丧而锦被蒙之？孔子曰：‘衣夫锦也，食夫稻也，于汝安乎？'吾不敢也。\"拂衣而去，自后宾客绝百所日。"},{"id":"a99","t":"鲍子难客","u":"第 十七 单 元","x":"齐田氏祖于庭,食客千人。有献鱼、雁者,田氏视之,乃叹曰\"天之于民厚矣！殖五谷,生鱼鸟,以为之用。\"众客和之。有鲍氏之子,年十二,亦在坐,进曰：\"不如君言。天地万物与我并生，类也。类无贵贱，徒以小大智力而相制，彼此相食,非相为而生。人取可食者食之,岂天本为人生之？且蚊嗜肤,虎狼食肉,非天本为蚊生人、虎狼生肉者也！\""},{"id":"a100","t":"陈元方答袁公","u":"第 十七 单 元","x":"陈元方年十一时,谒袁公。袁公问曰：\"贤家君在太丘,远近称之，何以履政？\"元方曰：\"老父在太丘，强者抚之以德，弱者抚之以仁，恣其所为,久而益敬。\"袁公曰：\"吾向为邺令,正行此事。不知家君法吾，抑吾法卿父？\"元方曰：\"周公、孔子，异世而出，然举止如一。周公不师孔子，孔子亦不师周公。\""},{"id":"a101","t":"银工家出宰相","u":"第 十七 单 元","x":"李太宰邦彦家起于银工。既贵,其母尝语贫寒事,诸孙以为耻。母曰：\"女有识乎？宰相家出银工，则可羞；银工家出宰相，正为嘉事，何耻之有!\""},{"id":"a102","t":"请君入瓮","u":"第 十七 单 元","x":"或告周兴与丘神勋谋反。太后命来俊臣审之。俊臣与兴方推事对食，谓兴曰\"囚多不承，当为何法？\"兴曰：\"此甚易耳！取大瓮，以炭四周炙之，令囚人中，何事不承？\"俊臣乃索大瓮，火围如兴法。因起谓兴曰：\"有内状推兄，请兄人此瓮。\"兴惶恐叩头伏罪。（）"},{"id":"a103","t":"董遇论\"三余\"（阅读）","u":"第 十八 单 元","x":"人有从学者,遇不肯教,而云\"必当先读百遍\"。言②：\"读书百遍,其义自见。\"从学者云：\"苦渴无日。\"遇言：\"当以三余。\"或问\"三余\"之意。遇言：\"冬者岁之余,夜者日之余，阴雨者时之余也。\""},{"id":"a104","t":"学者之病","u":"第 十八 单 元","x":"古人云：学者之病,最忌自高自狭。自高者如峭壁,时雨过之,须史溜散，不能分润。自狭者如瓮受水,过其量则溢矣。善学者其如海乎,旱九年而不枯,受九州而不满。"},{"id":"a105","t":"车胤囊萤夜读","u":"第 十八 单 元","x":"车胤勤学不怠，博学多通。家贫,不常得油。夏月，则练囊盛数十萤火以照书，映光自习，夜以继日。"},{"id":"a106","t":"长善而救失","u":"第 十八 单 元","x":"学者有四失,教者必知之。人之学也,或失则多,或失则寡,或失则易,或失则止。此四者，心之莫同也。知其心,然后能救其失也。教也者,长善而救其失者也。"},{"id":"a107","t":"黠狼","u":"第 十八 单 元","x":"有车夫载重登坡，方竭力时，一狼来啮其臀。欲释手，则货蔽压身，故忍痛推之。既止，则狼已片肉而去。乘其无能为力而窃一窝?，狼亦點矣。"},{"id":"a108","t":"方仲永","u":"第 十八 单 元","x":"金溪民方仲永,世耕。仲永生五岁,未尝识书具忽啼求之,父异焉,借旁近与之。即书诗四句,并自为其名。自是,指物作诗,立就,其文理皆有可观者。邑人奇之，稍稍宾客其父，或以钱币与之。父利其然也，日负仲永环谒于邑人，不使学。余闻之也久。明道中,从先人还家，于舅家见之，十二三矣。令作诗，不及前时之闻。又七年,余还自扬州,复到舅家问焉，曰：\"然众人矣！\""},{"id":"a109","t":"何易于挽纤（阅读）","u":"第 十九 单 元","x":"何易于,不详何所人及何所以进。为益昌③令。县距州四十里,刺史崔朴常乘春与宾属泛舟出益昌旁,索民挽纤。易于身引舟。朴惊问状。易于曰：\"方春,百姓耕且蚕，惟令不事,可任其劳。\"朴愧,与宾客疾驱去。"},{"id":"a110","t":"郑板桥爱民","u":"第 十九 单 元","x":"郑燮号板桥,乾隆\"元年进士②。知范县,爱民如子。绝苞苴,案无留牍。公余辑与文士筋咏诗,有忘其为长吏者。调潍县,岁荒,人相食。燮开仓赈贷，或阻之,燮曰：\"此何时？侯转申报，民无子遗矣。有谴我任之。\"发谷若干石,令民具领券借给,活万余人。"},{"id":"a111","t":"苏东坡买房契","u":"第 十九 单 元","x":"东坡自詹北归,择居阳羡。邵民瞻为其购一宅，为钱五十万,东坡倾囊仅能偿之。后择吉日入新第。尝与邵步月,偶至一村落,闻有妇人哭声甚恸，遂推靡而入，一老见东坡泣自若。东坡问何故，姬曰：\"吾有一屋，相传百年，而吾子不肖，售于人。日前吾迁徙来此，百年旧居一旦决别，宁不痛心？\"问其故宅所在,则东坡所买之第也。东坡再三抚慰，曰：\"姬之旧居,乃我所售也,不必深悲，今当以是屋还之。\"即命人取屋券对姬焚之，呼姬子翌日迎母还第，竟不索其直。"},{"id":"a112","t":"孟子对滕文公","u":"第 十九 单 元","x":"滕文公问曰：\"滕，小国也，间于齐、楚。事齐乎？事楚乎？\"孟子对曰：\"是谋非吾所能及也。无已③,则有一焉：凿斯池,筑斯城,与民守之,效死而民弗去,则是可为也。\""},{"id":"a113","t":"用法务在宽简","u":"第 十九 单 元","x":"唐太宗谓侍臣曰：\"死者不可再生，用法务在宽简。古人云，棺者欲岁之疫,非疾于人,利于棺售故耳。今法司核理③一狱,必求深刻,欲成其考课。今作何法,得使平允？\"谏议大夫王曰：\"但选公直良善之人，断狱允当者,增秩赐金，则奸伪自息。\"诏从之。（）"},{"id":"a114","t":"鲁哀侯弃国","u":"第 十九 单 元","x":"鲁哀侯弃国而走齐。齐侯曰：\"君何年之少而弃国之蚤?\"鲁哀侯曰：\"臣始为太子之时，人多谏臣，臣受而不用也；人多爱臣，臣爱而不近也。是则内无闻而外无辅也。是犹秋蓬恶于根而美于枝叶,秋风一起,根且拔矣。\""},{"id":"a115","t":"王沂公避奉迎（阅读）","u":"第 二十 单 元","x":"王沂公状元及第,还青州故郡。府帅闻其归,乃命父老唱乐迎于郊。公乃易服,乘小卫，由他门入,逮谒守。守惊曰：\"闻君来，已遣人奉迎。门司未报,君何为抵此？\"王曰：\"不才幸忝科第,岂敢烦郡守父老致还,是重其过也。故变姓名，诳迎者与门司而上谒。\"守叹曰：\"君所谓真状元矣！\""},{"id":"a116","t":"一行不私情","u":"第 二十 单 元","x":"初，一行幼时家贫，邻有王姥，前后济之约数十万，一行常思报之。至开元②中，一行承玄宗敬遇，言无不可。未几,会王姥儿杀人狱未具,姥谐一行求救。用识此僧！\"一行从谢之,终不顾。"},{"id":"a117","t":"齐威王行赏罚","u":"第 二十 单 元","x":"齐威王召即墨大夫,语之曰：\"自子之居即墨也,毁言日至。然吾使人视即墨,田野辟,人民给,官无事,东方以宁。是子不事吾左右以求助也。\"封之万家。召阿大夫，语之曰：\"自子守阿，誉言日至。吾使人视阿，田野不辟，人民贫铵，昔日赵攻鄄，子不救，卫取薛陵，子不知。是子厚币事吾左右以求誉也。\"是日，烹阿大夫及左右尝誉者。于是群臣耸惧,莫之饰诈,务尽其情。齐国大治,强于天下。"},{"id":"a118","t":"私恩与公法","u":"第 二十 单 元","x":"汉顺帝初,苏章迁冀州刺史。其故人为清河太守,章知其奸藏④,将按其罪。一日，请太守，为设酒肴，陈往日之好甚欢。太守喜曰：\"人皆言若为青天。\"章曰：\"今日苏孺文与故人饮者,私恩也;明日冀州刺史按事者,公法也。\"太守默然。翌日，遂收太守。"},{"id":"a119","t":"张齐贤明察","u":"第 二十 单 元","x":"宋张齐贤,尝为江南转运使。一日家宴，一奴窃银器数件,齐贤于帘下熟视而不问。尔后张齐贤三为宰相，门下奴仆皆得迁，唯此奴不沾禄。奴乘间再拜而告曰：\"吾待相公久矣，门下奴皆已得官相公独遗吾也？\"因泣下不至。齐贤然曰：\"予欲不言，尔则怨我。尔忆当年江南日，盗吾银器数件乎？我怀之三十年,不以告人,尔亦应知也。吾为宰相,进退百官,志在激浊扬清,安敢荐盗贼为官乎？念汝事我久，今予汝钱三十万，去吾门下，自择所安。\"奴震骇，泣拜而去。"},{"id":"a120","t":"受恩不报","u":"第 二十 单 元","x":"献县一令,待吏役至有恩。殁后,卷属尚在署,吏役无一存问者。强呼数人至，皆疗相向，非复囊时。夫人愤患，恸哭枢前，倦而假寐。恍见令语曰：\"此辈无良，是其本分。吾望其感德已大误，汝责其负德，不又误乎？\"霍然③醒,遂无复怨尤"},{"id":"a121","t":"永某氏之鼠（阅读）","u":"第 二十一 单 元","x":"永有某氏者,畏日,拘忌异甚。以为己生岁直子,鼠，子神也,因爱鼠，不畜猫犬,禁僮勿击鼠。仓廪庖厨,悉以恣鼠不问。由是，鼠相告,皆来某氏，饱食而无祸。某氏室无完器，椸无完衣，饮食大率鼠之余也。昼累累与人兼行,夜则窃啮斗暴，其声万状,不可以寝，终不厌。数岁,某氏徙居他州，后人来居,鼠为态如故。其人曰：\"是阴类恶物\"也,盗暴尤甚,且何以至是乎哉？\"假五六猫，阖门,撤瓦灌穴，购僮罗捕之，杀鼠如丘，弃之隐处，臭数月乃已。呜呼！彼以其饱食无祸为恒也哉！"},{"id":"a122","t":"大鼠","u":"第 二十一 单 元","x":"明万历年间,宫中有鼠，大与猫等，为害甚剧。遍求民间佳猫捕之,被食。适异国来贡狮猫,毛白如雪。投之鼠屋,阖其靡,潜窥之。猫良久,鼠巡自穴中出,见猫,怒而奔逐之。猫避登几上，鼠亦登;猫跃下,鼠亦下。如此往复，不止百次。众咸谓猫怯，以为无能为者也。既而鼠跳跃渐迟，硕腹似喘，跨地上少休。猫即疾下,爪其顶毛，口啮首领,辗转争持,猫声鸣鸣，鼠声啾。启靡急视，则鼠首已嚼碎矣。然后知猫之避，非怯也，待其惰也。"},{"id":"a123","t":"越人溺鼠","u":"第 二十一 单 元","x":"鼠好夜窃粟。越人置粟于盎,恣鼠啮不顾。鼠呼群类入焉,必而后反。越人乃易粟以水，浮糠覆水上，而鼠不知也，逮夜复呼群次第入，咸溺死。"},{"id":"a124","t":"商陵君养\"龙\"","u":"第 二十一 单 元","x":"有献陵鲤于商陵君者，以为龙焉。商陵君大说,问其食，曰：\"蚁。\"商陵君蒙而之。或曰\"是陵鲤也,非龙也。商陵君怒而之。于是左右皆惧,莫敢言非龙者，遂从而神之。商陵君观龙，龙卷屈如丸，而伸，左右皆伴惊，称龙之神。夜穴壁而逝，左右走报：\"龙壮，今果穿石而去！\"商陵君悼惜不已，仍养蚁以伺,冀龙复来也。无何，天大雨，震电，真龙出焉。商陵君以为蒙龙来也，持蚁以邀之。龙怒震其宫，商陵君死。"},{"id":"a125","t":"象虎","u":"第 二十一 单 元","x":"楚人有患狐者,多方以捕之,弗获。或教之曰：\"虎,山兽之雄也。天下之兽，见之咸惧而亡其神,伏而侯命。\"乃使作象虎,取虎皮蒙之,出于下。狐入，遇焉,啼而路。他日,豕暴于其田。乃使人被象虎,又使其子持戈守诸衢田者呼，豕逸于莽，遇象虎而反奔衢，获爲。楚人大喜，以象虎为可以服天下之兽矣。于是,野有如马,被象虎以趋之。人或止之曰：\"是驳也,真虎且不能当，往且败。\"弗听，前，为驳搜而噬之。"},{"id":"a126","t":"口蜜腹剑","u":"第 二十一 单 元","x":"李林甫为相,凡才望功业出已右,及为上所厚而势位逼已者，必百计去之。其人尤忌文学之士。或阳与之善,啖以甘言,而阴陷之。世谓李林甫\"口有蜜,腹有剑\"。"},{"id":"a127","t":"木锐者易坏事（阅读）","u":"第 二十二 单 元","x":"后生才锐者\",最易坏事。若有之,父兄当以为忧,不可以为喜也。切须常加简束,令熟读经学,训以宽厚恭谨,勿令与浮薄相处。自此十许年,志趣自成。不然,其可虑之事,盖非一端。吾此言,后人之药石也,各须谨之,毋贻后悔。"},{"id":"a128","t":"王旦教诫子弟","u":"第 二十二 单 元","x":"有货玉带者，子弟以为佳，呈旦,旦命系之，曰\"还见佳否？\"曰：\"系之，安得自见？\"旦曰：\"自负重而使观者称好，无乃劳乎？驱还之！\"旦生平不置田宅。曰：\"子旦曰：\"我尝以大盛为惧，岂可复与寒士争进！\"至其殁也，子素犹未官。"},{"id":"a129","t":"楚王猎于云梦","u":"第 二十二 单 元","x":"楚王猎于云梦,使虞人驱禽兽而射之。禽飞,鹿出于王右,麋逸于王之左。王欲引弓射之,又有鹄掠过。王驻矢于弓,不知何射也。养由基进曰：\"臣之射也,置一叶于百步之外，十发而十中;若置十叶于前,则中与不中非臣所能必也。\""},{"id":"a130","t":"曹操墓传闻","u":"第 二十二 单 元","x":"许城?外有河,水泌涌，近崖深暗，盛夏时有人人浴，忽然若被刀斧，尸断浮出。后一人亦如之,转相惊怪。邑宰闻之,遣多人闸断上流,竭其水。见崖有深洞,中置转轮,轮上排利刃,如霜。去轮攻人,中有小碑,字皆汉篆。细视之,则曹孟德墓也。破棺散骨，所殉金宝尽取之。（）"},{"id":"a131","t":"李离自刑","u":"第 二十二 单 元","x":"李离者,晋文公之理也,因过听杀人。李离悔,自拘求死。文公曰：\"官有贵贱,罚有轻重,下吏有过,非子之罪也。李离曰：\"臣居官为长,不与吏让位;受禄最多,不与下分利。今过听杀人，责下吏有罪,非所闻也。\"辞不受令，遂拔剑自勿。"},{"id":"a132","t":"刘备托孤","u":"第 二十二 单 元","x":"章武三年春,先主于永安病笃,召亮于成都,属以后事,谓亮曰\"君才十倍曹丕,必能安国,终定大事。若嗣子可辅,辅之;如其不才,君可自取\"亮涕泣曰：\"臣敢竭股肱之力,效忠贞之节,继之以死！\"先主又为诏敕后主曰：\"汝与丞相从事,事之如父。\""},{"id":"a133","t":"汉文帝劳军（阅读）","u":"第 二十三 单 元","x":"上自劳军。至霸上及棘门军,直驰入,将以下骑送迎③。已而之细柳军,军士吏被甲,锐兵刃,彀弓弩，持满。天子先驱至,不得入。先驱曰：\"天子且至！\"军门都尉曰；\"将军令曰：\"军中闻将军令,不闻天子之诏。\"居无何，上至，又不得人。于是上乃使使持节诏将军：\"吾欲入劳军。\"亚夫乃传言开壁门。壁门士吏谓从属车骑曰：\"将军约，军中不得驱驰。\"于是天子乃按辔徐行。至营，将军亚夫持兵揖\"曰：\"介胄之士不拜，请以军礼见。\"天子为动，改容式车,使人称谢：\"皇帝敬劳将军。\"成礼而去。既出军门,群臣皆惊。文帝曰：\"嗟乎,此真将军矣！曩者霸上、棘门军,若儿戏耳,其将固可袭而虏也。至于亚夫，可得而犯邪！\""},{"id":"a134","t":"裴行俭粮车伏兵","u":"第 二十三 单 元","x":"唐肃宗时，胡人大人塞，北不得宁。上派大军击之，然为胡骑所围，粮道绝,兵多喽死。上急，以裴行俭率兵援之。行俭曰：\"胡人众，唯智取耳。\"遂伴为粮车三百乘，每车伏壮士五人，各持锐刀劲弓，以赢老驾车，并于前方深谷处伏精兵数百待之。粮车行山道，贼果下山劫之，大喜。时值盛夏，人畜皆渴，欲就泉饮。将临泉，车中壮士齐发，伏兵亦至,杀获几尽，余者遁。自此，粮道复通，官军（）得以重振旗鼓。"},{"id":"a135","t":"李广射虎","u":"第 二十三 单 元","x":"李广出猎,见草中石,以为虎而射之,中石没,视之,乃石也。因更射之,终不能复入石。广所居郡闻有虎，尝自射之。及居右北平射虎，虎腾伤广，广亦竟射杀之。"},{"id":"a136","t":"李广脱险","u":"第 二十三 单 元","x":"李广出雁门击匈奴。匈奴兵多,破败广军,生得广。单于素闻广贤，令曰：\"得李广必生致之。\"胡骑得广，时广伤病，置广两马间，络而盛卧广。行十余里，广伴死,皖其旁有一胡儿骑善马，广暂腾而上胡儿马，因推堕胡儿,取其弓,鞭马南驰数十里，复得其余军,因引而入塞。"},{"id":"a137","t":"吴起求将","u":"第 二十三 单 元","x":"吴起者,卫人也,好用兵。尝学于曾子②,事鲁君。齐人攻鲁,鲁欲将吴起。吴起取齐女为妻，而鲁疑之。吴起于是欲就名,遂杀妻,以明不与齐也。鲁卒以为将。"},{"id":"a138","t":"孔仁临阵解甲","u":"第 二十三 单 元","x":"副总兵马俊公,体貌魁伟,骑射绝伦,威镇广右。一日,报寇至,公与孔仁帅师往讨。进，薄巢穴，部下请装塘，公斥曰：\"此但逐之遁耳，非杀贼也。\"遂与孔仁前。孔仁乃儒臣,不谱战阵,恃公勇,亦不设防。日正午,炎甚，士卒解甲少憩，忽群寇从茂草中突出，以枪剽公臆，竟不得展其勇，孔仁亦被害。"},{"id":"a139","t":"杯酒释兵权（阅读）","u":"第 二十四 单 元","x":"帝因晚朝，与石守信等饮。酒,屏左右谓曰：\"朕非卿等不及此,然天子亦大艰难,殊不若为节度使之乐。朕终夕未尝敢安枕卧也。守信等请其故，帝曰：\"是不难知，此位谁不欲为？\"守信等顿首曰：\"陛下何为出此言？今天下已定，谁复有异心？\"帝曰：\"卿等固然，其如魔下欲富贵何？一此,唯陛下哀,指示可生之途。\"帝曰：\"人生如白驹过隙,所以好富贵者，不过欲多积金钱,厚自娱乐,使子孙无贫乏尔。卿等何不释去兵权，出守大藩，择便好田宅市之，为子孙立永远不可动之业；多置歌儿舞女，日夕饮酒相欢,以终天年。朕且与卿约为婚姻,君臣之间,两无猜疑，上下相安,不亦善乎？\"守信等谢曰：\"陛下念臣等至此，所谓生死而肉骨也！\"明日，皆称疾，乞罢典兵。"},{"id":"a140","t":"宋太祖治军","u":"第 二十四 单 元","x":"太祖朝，常戒禁兵之衣长不得过膝,买鱼肉及酒人营门者皆有罪。又制更成之法，欲其习山川劳苦、远妻撃之恋，兼外成之日多，在营之日少，人人少子而衣食易足。又京师卫兵请粮者，营在城东者，即令赴城西仓取，在城西者，令赴城东仓取，咸不许佣车脚，皆须自负。尝亲登城门观之。盖使之劳力，制其骄情。故士卒衣食无外慕，安辛苦而易使。"},{"id":"a141","t":"宋太祖故意杀人","u":"第 二十四 单 元","x":"宋太宗始嗣位,思有以帖服内外者。一日,萃下市肆有丐者不得乞,因倚门大骂。主人逊谢，久不得解。众方拥观，忽一人跃出，以刀刺丐死，且遗其刀而去。会日已暮，追捕莫获。翌日奏闻，太宗大怒，谓仍五代乱习，乃敢中都白昼杀人。即严索捕,期在必得。有司惧罪，久之,迹其事,乃主人不胜其忿而杀之耳。狱具，太宗曰：\"卿能用心若是。虽然,更为一复，毋枉爲,且携其刀来。\"不数日,尹再登,对以狱词,并刀上。太宗问：\"审乎？\"曰：\"审矣。\"于是顾小内侍：\"取吾鞘来。\"小内侍唯命，即奉刀内鞘中。因拂袖而起，人，曰：\"如此宁不妄杀人！\""},{"id":"a142","t":"陈涉杀故人","u":"第 二十四 单 元","x":"陈胜王陈,其故人尝与佣耕者闻之,之陈,扣宫门曰：\"吾欲见陈涉！\"宫门（）令欲缚之。自数辩,乃置,不肯为之通。陈王出,遮道而呼涉。陈王闻之,乃愈益发舒，言陈王故情。或说陈王曰：\"客愚无知，专妄言,轻威。\"陈王斩之。诸陈王故人皆自引去，由是无亲陈王者。"},{"id":"a143","t":"塞材望伪态","u":"第 二十四 单 元","x":"赛塞材望,蜀人,为湖州伴。北兵之将至也,赛毅然自誓必死。乃作大锡牌，镌其上曰：\"大宋忠臣赛材望。\"且以银二凿窍，并书其上曰\"有人获吾尸者,望为埋葬,仍见祀,题云\"大宋忠臣塞材望’。此银所以为埋瘙之费也。\"日系牌与银于腰间，只伺北军临城，则自投水中，且遍祝乡人及常所往来者。人皆怜之。丙子正月旦日,北军人城，塞已莫知所之，人皆谓之溺死。既而北装乘骑而归,则知先一日出城迎拜矣。遂得本州同知。"},{"id":"a144","t":"墨以陈为贵","u":"第 二十四 单 元","x":"墨以陈为贵,余所蓄二墨,形制古雅,当是佳品。独余不善书,未经磨试;然余唯不善书也,故墨能久存。昔东坡谓：吕行甫好藏墨而不能书,则时磨墨汁小之。余无墨之量,唯手摩香泽,足一赏也。"},{"id":"a145","t":"一举而三役济（阅读）","u":"第 二十五 单 元","x":"祥符中,禁中火,时丁晋公主营复宫室，患取远土。公乃令凿通衢取土,不日皆成巨堑。乃决汴水人堑中,引诸道竹木排筏及船运杂材,尽自堑中计省费以亿万计。"},{"id":"a146","t":"僧荐重元寺阁","u":"第 二十五 单 元","x":"苏州重元寺阁一角忽陷,计其扶荐之功,当用钱数千贯③。有游僧曰：\"不足劳人。请一夫所木为楔,可以正也。\"寺主从之。僧每食,持楔数十,执柯登阁，敲其间。未逾月，阁柱悉正。"},{"id":"a147","t":"喻皓定塔","u":"第 二十五 单 元","x":"吴越王钱于杭州梵天寺命人建一木塔,方二三层,钱即登之,患其塔动。匠师云：\"未布瓦，上轻，故如此。\"乃以瓦布之，而动如初。无可奈何，密使其妻见喻皓,问塔动之因。皓笑曰：\"此易耳，但逐层布板，即以钉钉实，则不动矣。\"匠师如其言,塔遂定。盖既钉板，上下束缚,六幕相联,人履其板，自不能动。人皆伏其巧。"},{"id":"a148","t":"一字师","u":"第 二十五 单 元","x":"郑谷在袁州,齐己因携所为诗往谒焉。有《早梅》诗曰\"前村深雪里，昨夜数枝开。\"谷笑谓曰：\"‘数枝\"非早也，不若‘一枝\"则佳。\"齐已瞿然，不觉兼三衣叩地膜拜。自是,士林以谷为齐己\"一字之师\"。（）"},{"id":"a149","t":"中山窃糟","u":"第 二十五 单 元","x":"昔者鲁人不能为酒,唯中山之人善酿千日之酒。鲁人求其方弗得。有仕于中山者,主酒家。取其糟归,以鲁酒渍之。谓人曰：\"中山之酒也。\"鲁人饮之,皆以为中山之酒也。一日,酒家之主者来,闻有酒,索而饮之,吐而笑曰：\"是予之糟液也。\""},{"id":"a150","t":"犬负米救主人","u":"第 二十五 单 元","x":"杨光远之叛青州也,有孙某居围城中,其田庄在青州西。城闭既久，内外隔绝，食且尽，举族愁叹。有犬傍于侧，似有忧思。孙某曰：\"家无粮，人且死，奈何？尔能为吾至田庄取米耶？\"犬摇尾应之。是夜,置一布囊,并简,系于犬背。犬即由水窦出，至田庄吠。庄人启门，识其犬，取简视之，令负米还，未晓入城。如此数月，孙某举族得不铵。后杨光远败，城开。"},{"id":"a151","t":"娘子军（阅读）","u":"第 二十六 单 元","x":"唐高祖第三女，微时嫁柴绍。高祖起义兵，绍与妻谋曰：\"尊公欲扫清多难,绍欲迎接义旗，同去则不可，独行恐惧后害，为计若何？\"妻曰\"公宜速去。我一妇人，临时别自为计。\"绍即间行赴太原。妻乃归户县，散家资，起兵以应高祖,得兵七万人，与太宗俱围京城,号曰\"娘子军\"。京城平,封平阳公主。葬时特用鼓吹\",以赏军功。"},{"id":"a152","t":"杨氏力守项城","u":"第 二十六 单 元","x":"唐德宗建中年间,李希烈叛,陷汴州,谋袭陈州。李侃为陈州项城令,以城小贼众，欲弃城而逃。其妻杨氏曰：\"贼至当守城，力不足，则死。君弃城而逃，谁守？\"侃犹不决，妻曰：\"请重赏募死士！\"侃乃召吏民议曰：\"尔等生于斯，祖辈坟墓在焉，岂可忍贼人踩蹦！\"众泣，誓与城同死生。遂与贼战于城外，侃中流矢,还家,妻责曰：\"君不在阵,谁肯固守？死于外,犹愈于床也。速往督战！\"侃即登城，士气大振。会贼将中矢死,遂引兵而去。项城卒完。"},{"id":"a153","t":"王孙贾诛淖齿","u":"第 二十六 单 元","x":"王孙贾年十五,事齐闵王。王出走,失王之处。其母曰：\"女朝出而晚来，则吾倚门而望；女暮出而不远，则吾倚间而望。女今事王，王出走，女不知其处，女尚何归？\"王孙贾乃人市中，曰：\"淳齿乱齐国，杀闵王，欲与我诛者，祖右！\"市人从者四百人，与之诛淖齿，刺而杀之。"},{"id":"a154","t":"王广之女","u":"第 二十六 单 元","x":"王广女者,不知何许人也。容质甚美，慷慨有丈夫之节。广为扬州刺史,蛮帅梅芳攻陷扬州，而广被诛。王时年十五。芳纳之。俄于暗室击芳,不中,芳惊起曰：\"何故反邪？\"王吡之曰：\"蛮畜！吾闻父仇不同天，母仇不同地，汝反逆无状，害人父母,而复以无礼凌人,吾所以不死者,欲诛汝耳！\"辞气猛厉,言终乃自杀,芳止之不可。"},{"id":"a155","t":"扛米","u":"第 二十六 单 元","x":"松江某相国之孙某,贫乏不能自存,其故仆富于财者,往而乞岭。适春米,以五斗令佣负之以随。佣不能胜,息于衢。其问佣曰：\"何无力至此？\"佣叹息曰：\"吾非佣工者。先祖为某学士。\"某惊曰：\"如此,则亲戚矣！\"然两人俱弗克负荷,遂为之相抱而泣。曰：\"哀哀父母,生我劭劳！\"市人聚观。一长者予以竹梢,共举以归。两人祖皆崇祯间相也。时人为之语曰：\"五斗米,两公子，扛不起，枉读《诗经》怨‘劭劳，乃祖贻谋岂料此！\""},{"id":"a156","t":"牧童指瑕","u":"第 二十六 单 元","x":"蜀有杜某者,好书画,所宝以百数。有戴嵩斗牛图一轴,尤爱,常以身随。一日曝书画，有牧童见之，抚掌大笑曰：\"此画斗牛也。牛斗力在角，尾夹人两股间。今乃掉尾而斗，谬也。\"杜某笑而然之。古语有云：\"耕当问奴，织当问婢。\"信也。"},{"id":"a157","t":"宋定伯捉鬼（阅读）","u":"第 二十七 单 元","x":"南阳\"宋定伯，年少时，夜行逢鬼，问曰：\"谁？\"鬼曰：\"鬼也。\"鬼曰：\"汝复谁？\"定伯诳之，言：\"我亦鬼。\"鬼问：\"欲至何所？\"答曰：\"欲至宛市。\"鬼言：\"我亦欲至宛市。\"遂行数里。鬼言：\"步行太驱,可共递相担也。\"定伯曰：\"大耳。\"定伯因复担鬼，鬼略无重。如是再三。定伯复言：\"我新死，不知鬼悉何所畏忌？\"鬼答言：\"唯不喜人唾。\"于是共行。道遇水,定伯令鬼先渡,听之，了无声音。定伯自渡，漕灌作声。鬼复言：\"何以作声？\"定伯曰：\"新死不习渡水故耳,勿怪吾也。\"行欲至宛市,定伯便担鬼着肩上,急持\"之。鬼大呼,声咋咋然,索下。不复听之,径至宛市中下,着地化为一羊。便卖之,恐其变化,唾之。得钱千五百,乃去。于时石崇言：\"定伯卖鬼，得钱千五百文。\""},{"id":"a158","t":"鬼避姜三莽","u":"第 二十七 单 元","x":"景城有姜三莽者，勇而。一日，闻人说宋定伯卖鬼得钱事②，大喜曰：\"吾（）今乃知鬼可缚！如每夜缚一鬼，唾使变羊，晓而牵卖于屠市，足供一日酒肉资矣。\"于是夜夜荷挺执绳，潜行墟墓间，如猎者之伺狐兔，竟不能遇。即素称有鬼之处，伴醉寝以诱之,亦寂然无睹。一夕，隔林见数磷火,踊跃奔赴。未至间,已星散去，噢恨而返。如是月余，无所得，乃止。盖鬼之侮人，恒乘人之畏。三莽确信鬼可缚，意中已视鬼如矣，其气焰足以鬼，故鬼反避之也。"},{"id":"a159","t":"未死之鬼","u":"第 二十七 单 元","x":"人之生斯世也，但知已死者为鬼，而未知未死者亦鬼也。酒罂饭囊，或醉或梦,块然泥土者,则其人虽生，与已死之鬼何异？余曾见未死之鬼吊已死之鬼，未之思也,特一间耳。"},{"id":"a160","t":"慈惠而亡","u":"第 二十七 单 元","x":"王，，王欣然曰：\"然则功且安至？\"对曰：\"王之功至于亡。\"王曰：\"慈惠，行善也，行之而亡何也？\"卜皮对曰：\"夫慈者不忍，而惠者好与也。不忍则不诛有过，好予则不待有功而赏。有过不罪，无功受赏，虽亡不亦可乎？\""},{"id":"a161","t":"楚人烹猴","u":"第 二十七 单 元","x":"楚人有烹猴而召其邻人，以为狗葵而甘之。后闻其猴也，据地而吐之,尽泻其食。此未始知味者也。邯郸师有出新曲者,托之李奇。诸人皆争学之。后知其非也,而皆弃其曲。此未始知音者也。鄙人有得玉璞者,喜其状以为宝而藏之。以示人，人以为石也，因而弃之，此未始知玉者也。"},{"id":"a162","t":"魏文侯问李克","u":"第 二十七 单 元","x":"魏文侯问李克曰：\"吴之所以亡者何也？\"李克对曰：\"数战数胜。\"文侯日；\"数战数胜，国之福也，其所以亡者何也？\"李克曰：\"数战则民疲，数胜则主骄；以骄主治疲民，此其所以亡也。是故好战穷兵，不亡者未之有也。\""},{"id":"a163","t":"贾诩论战（阅读）","u":"第 二十八 单 元","x":"太祖比征之，一朝引军退,绣自追之。诩谓绣曰：\"不可追也,追必败。\"绣不从，进兵交战，大败而还。谓绣曰：\"促更追之，更战必胜。\"绣谢曰：\"不用公言，以至于此。今已败，奈何复追？\"诩曰：\"兵势有变，驱往必利。\"绣信之，遂收散卒赴追，大战，果以胜还。问诩：\"绣以精兵追退军，而公言必败；退以败卒击胜兵，而公日必克，悉如公言，何其反而皆验也？\"诩曰：\"此易知耳。将军虽善用兵,非曹公敌也。军虽新退,曹公必自断后;追兵虽精,将既不敌,彼士亦锐，故知必败。曹公攻将军无失策，力未尽而退，必国内有故；已破将军，必轻军速进，纵留诸将断后,诸将虽勇，亦非将军敌，故虽用败兵而战必胜也。\"绣乃服。"},{"id":"a164","t":"岳飞大败\"拐子马\"","u":"第 二十八 单 元","x":"金兀术有劲军,皆重铠②,贯以韦索，三人为联,号\"拐子马\"。官军不敢当。是役也，以万五千骑兵来，飞戒步卒，以麻扎刀人阵，勿仰视，第砍马足。拐子马相连，一马仆，二马不能行。官军奋击,遂大破之。"},{"id":"a165","t":"郑武公伐胡","u":"第 二十八 单 元","x":"昔者郑武公欲伐胡，故先以其女妻胡君，以娱其意。因问于群臣：\"吾欲\"，，国也。子言可伐，何也？\"胡君闻之,以郑为亲已,遂不备郑。郑人袭胡,取之。"},{"id":"a166","t":"割","u":"第 二十八 单 元","x":"夷门之瘦人,头没于脚,而瘦代为之首;口、目、鼻、耳俱不能用。郢人怜而为之割之。人曰：\"瘦不可割也。\"弗听。卒割之。信宿而死。国人尤焉，郢人辞曰\"吾唯知去其害耳。今虽死,瘘亦亡矣。\"国人掩口而退。"},{"id":"a167","t":"林之栋画兰","u":"第 二十八 单 元","x":"林之栋工画兰,好游,闻兰所在，必大寻之。樵者或告：某山大壑中，常闻兰花气特多,茅棘虎豹,不可行。林乃募壮士执刀矢火攻,具裹粮,鸣金人深谷中，若当劲敌者。至则兰叶长丈许，花大如掌。自是所画兰益奇变。"},{"id":"a168","t":"不识姜菱者","u":"第 二十八 单 元","x":"楚人有生而不识姜者，曰：\"此从树上结成。\"或曰：\"从土里生成。\"其人固执已见,曰：\"请与子以十人为质,以所乘驴为赌。\"已而遍问十人,皆曰：\"土里出也。\"其人哑然失色，曰：\"驴则付汝,姜还树生。\"北人生而不识菱者，仕于南方，席上啖菱，并壳人口。或曰：\"啖菱须去壳。\"否？\"答曰：\"前山后山，何地不有！\"夫姜生于土而日树结，菱生于水而日土产，皆坐不知故也。"},{"id":"a169","t":"韩琦大度（阅读）","u":"第 二十九 单 元","x":"韩魏公?知北都，有中外亲献玉盏一只，云耕者入坏家而得，表里无纤瑕覆以绣衣,致玉盏其上,且将用之将酒,遍劝坐客。俄为吏将误触台倒,玉盏俱碎,坐客皆然,吏将伏地待罪。公神色不动,笑谓坐客曰\"物破亦自有时。\"谓吏将曰：\"汝误也，非故也，何罪之有？\"公之量宽大重厚如此。"},{"id":"a170","t":"顾荣施灵","u":"第 二十九 单 元","x":"顾荣在洛阳,尝应人请,觉行炙人有欲炙之色,因已施焉。同座之。荣曰\"岂有终日执之而不知其味者乎？\"后遭乱渡江③,每经危急，常有一人左右。已问其所以,乃受炙人也。"},{"id":"a171","t":"郑牢谏山云","u":"第 二十九 单 元","x":"山云出镇广西,有郑牢者,老隶也,性直敢言。公谓之曰：\"世谓为将者不（）患贪，我亦可贪否？\"牢曰：\"公初谐广西，如一新洁白袍，有一沾污，如白袍点墨不可洗也。\"公又曰：\"人云土夷馈送,却之则疑且念,奈何？\"牢曰：\"居官默货,则朝廷有重法。公不畏朝廷,反畏蛮子。\"公笑而纳之。山云镇广西逾十年,廉操始终不渝。固不由牢，牢亦可尚也。"},{"id":"a172","t":"曲突徙薪","u":"第 二十九 单 元","x":"客有过主人者，见其灶直突，旁有积薪。客谓主人，更为曲突，远徙其薪，不者且有火患。主人默然不应。俄家果失火,邻里共救之,幸而得息。于是杀牛置酒,谢其邻人，灼烂者于上座，其余皆依功次坐，而不录言曲突者。或谓主人曰：\"向听客之言，不费牛酒，终亡火患。今论功而请宾，曲突徙薪无恩泽，焦头烂额为上客耶？\"主人乃悟而请之。"},{"id":"a173","t":"王安期不鞭书生","u":"第 二十九 单 元","x":"王安期为东海郡守,世乱,敕曰：\"夜不得私行。\"吏收得一宵行人。王问：\"自师家受业还,未之知也。\"吏曰：\"鞭乎？\"王曰：\"鞭挞书生以立威名，恐非致治之本。\"释之,并令吏护其反家。"},{"id":"a174","t":"蹶叔为农商","u":"第 二十九 单 元","x":"蹶叔好自信而喜违人言。田于龟山之阴,取其原为稻而为梁。其友谓之曰：\"梁喜亢，稻喜，而子反之,失其性矣，其何能获？\"弗听。累十年而仓无储。乃视其友人之田,莫不如其所言以获。既而商于汶上③,必相货之急于时者趋之,无往而不与人争。比得，而趋者毕至,无所收获。其友人曰：\"善贾者收人所不争，时来必利倍，此所以富也。\"弗听。又十年而大困。"},{"id":"a175","t":"魏徵论“自制”（阅读）","u":"第 三十 单 元","x":"太宗\"问魏徽曰：\"观近古帝王，有传位十代者，有一代两代者，亦有身得身失者，朕所以常怀忧惧，或恐抚养生民不得其所，或恐心生骄逸，喜怒过度，然不自知。卿可为朕言之,当以为楷则。\"徽对曰：\"嗜欲喜怒之情,贤愚皆同。贤者能节之,不使过度,愚者纵之,多至失所。…伏愿陛下常能自制,以保克终之美，则万代永赖。\""},{"id":"a176","t":"唐太宗鉴秦而止","u":"第 三十 单 元","x":"上谓侍臣曰：\"昔禹凿山治水而民无谤者，与人同利故也。秦始皇营宫室而人怨叛者，病人以利已故也。夫靡丽珍奇，固人之所欲，若纵之不已，则危亡立至。朕欲营一殿,材用已具，鉴秦而止。王公以下,宜体朕此意。\"由是二十年间，风俗素朴，衣无锦绣，公私富给。"},{"id":"a177","t":"玄石嗜酒而死","u":"第 三十 单 元","x":"昔者玄石嗜酒。为酒困，五脏熏灼，肌骨蒸煮如裂，百药不得救。三日而后释。谓其人曰：\"吾今而后知酒可以表人也。吾不之饮矣。\"居不竟月，同饮至，曰：\"试尝之。\"始三爵止。明日而五之,又明日而十之,又明日而大爵,忘其故，卒死爲。或曰：性之所耽,不能制也。"},{"id":"a178","t":"曾参全节","u":"第 三十 单 元","x":"曾子衣衣而耕,鲁君使人往致邑焉。曰：\"请以此饰衣。\"曾子不受,使者反，复往，辞不受。使者曰：\"先生非求于人，乃君赐之,奚为不受？\"曾子曰：\"臣闻之：‘受人者畏人，予人者骄人。'纵君有赐,不我骄也,我能勿畏乎？\"终不受。孔子闻之曰：参之言足以全其节也。\""},{"id":"a179","t":"丁谓巧送书信","u":"第 三十 单 元","x":"丁谓既窜崖州，其家属寓洛阳。尝作家书，遣使致洛守刘烨，祈转付家。戒使者曰：\"伺烨会僚众时呈达。\"烨得书，遂不敢隐，即以闻。帝启视，则语多自"},{"id":"a180","t":"田不满怒斥髑髅","u":"第 三十 单 元","x":"田不满夜行失道,误经墟墓间,足踏一麟。作声曰：\"无败我面,否且祸尔！\"不满憨且悍，斥曰：\"谁遣尔当路？\"麟曰：\"人移我于此，非我故当路曰：\"我岂衰耶？畏盛而凌衰，是何理耶？\"麟作泣声，曰\"君运亦盛，我徒以虚词侗吓耳！\"不满竟冲之过，背后唯闻鸣鸣声。（）"},{"id":"a181","t":"蝜蝂之死（阅读）","u":"第 三十一 单 元","x":"頔蛎者,善负小虫也。行遇物，辑持取，昂其首负之。背愈重,虽困剧不止也。其背甚涩,物积因不散,卒仆不能起。人或怜之,为去其负。苟能行，又持取如故。又好上高，极其力不已，至坠地而死。"},{"id":"a182","t":"沈屯子之忧","u":"第 三十一 单 元","x":"沈屯子偕友人市。或曰：\"杨文广围困柳州城中，内匮粮饷,外阻援兵。\"然不已。友曳之归。然日夜念之不置：\"文广围困至此，何由得解？\"从此成疾。姻友来省，慰曰：\"善自宽，病乃愈也。\"沈屯子曰：\"若欲吾宽，须杨文广围解。\"夫世之多忧以自我者，类此也。"},{"id":"a183","t":"涓蜀梁之死","u":"第 三十一 单 元","x":"夏首之南,有人為,日涓蜀梁。其为人也，愚而善畏。明月而宵行,俯见其影,以为伏鬼也；仰视其发，以为立魅也；背而走，比至其家,气绝而亡。岂不哀哉！"},{"id":"a184","t":"张祜好侠","u":"第 三十一 单 元","x":"张枯落第,遂漫游江、淮,自称侠士。一夕,有非常人入门,装饰甚武,腰剑手囊囊中一物，血流于外，曰：\"此非张侠之第邪？\"张枯曰：\"然。\"既坐，客曰：\"有一仇人，十年莫得，今夕杀之,喜不已。\"指其囊曰：\"此其首也。\"张敬之。客曰：\"吾有恩人，义士也，多年未报，去此可三里，能假予钱十万否？旦日即还。后（）为尔赴汤蹈火，无所惮！\"张然之，尽其积与之。客乃留囊而去。旦日，张未见其反，虑囊首为人所知，乃与家人埋之。开囊出示，乃猪首也，方悟为人所诳。呜呼，世之所谓豪侠之士不为人诳也鲜矣！"},{"id":"a185","t":"周厉王止谤","u":"第 三十一 单 元","x":"厉王虐,国人谤王。召公告曰：\"民不堪王命矣！\"王怒,得卫巫,使监谤者，以告，则杀之。国人莫敢言，道路以目。王喜，告召公曰：\"吾能止谤矣，民不敢言。\"召公曰\"是障之也。防民之口甚于防川。川雍而溃,伤人必多；民亦如是。是故治川者决之使导，治民者宣之使言。\"王勿听,于是国人莫敢言。三年,乃流放王。"},{"id":"a186","t":"无赖仗势","u":"第 三十一 单 元","x":"其邑无赖甚多,或窃人牛马,或劫人财货，或当面索直，众患之。尝有人讼于官,令曰：\"无奈何也，以其为首之父为郡守。\"由是,益肆虐,无所不为。众怒而不敢言。无何,郡守坐贿而黜,举乡沸腾,缚其为首者示众,余则闻风鼠窜。或曰：天赞百姓也。"},{"id":"a187","t":"周幽王失信而亡（阅读）","u":"第 三十二 单 元","x":"周宅丰、镐,近戎人，与诸侯约，为高堡于王路,置鼓其上,远近相闻。即戎寇至,传鼓相告,诸侯之兵皆至救天子。戎寇当至，幽王击鼓,诸侯之兵皆至,褒姒大说而笑。幽王欲褒姒之笑也，因数击鼓,诸侯之兵数至而无寇。至于后戎真至,幽王击鼓,诸侯兵不至,幽王之身乃死于骊山之下,为天下笑。"},{"id":"a188","t":"更人立誓","u":"第 三十二 单 元","x":"一吏坐赃致罪,遇赦获免。因立誓若复接人钱财,手当生恶疮。既而，有一人讼者，馈钞求胜。吏念立誓之故，难以手接。顷之，曰：\"若如此殷勤，权放在予靴筒里。或曰：\"此吏固贪,莫之改也。\""},{"id":"a189","t":"锡饧不辨","u":"第 三十二 单 元","x":"明名医戴原礼尝至京,闻一医家术甚高,治病辑效,亲谐窥之。见其迎求溢户,应接不暇。偶一求药者既去,追而告曰：\"临煎加锡一块。\"原礼心异之,叩其故,曰\"此古方耳。\"殊不知古方乃炀?字,场即糯米所煎糖也。乎，今之庸医妄谓熟谱古方，大抵不辨锡场耳！"},{"id":"a190","t":"指鹿为马","u":"第 三十二 单 元","x":"秦末,赵高欲作乱,恐群臣不从,乃先设验,持鹿献于二世③,曰：\"马也。\"（）二世笑曰：\"丞相误邪？此为鹿而非马也。\"赵高问左右，或言马，以阿赵高；或言鹿者，高惩之以法。后群臣皆畏高，高喜。"},{"id":"a191","t":"井中捞月","u":"第 三十二 单 元","x":"昔有五百猕猴,游行林木,俱至大树下。树下有井,井中见月影。时猕猴主见是月影,语诸伴曰：\"月今日死，落于井中，当共出之,莫令世间长夜暗冥。\"众猴云：\"何能出之？\"猕猴主曰：\"我知出法。我捉树枝，汝捉我尾，辗转相连，乃可出之。\"诸猴如主语,辗转相捉。然枝弱而折，一切猕猴堕井中。"},{"id":"a192","t":"张升辨奸","u":"第 三十二 单 元","x":"宋之张升,知润州,有妇人,夫出数日不反,忽闻菜园井中有死人焉,驱往视之,号哭曰：\"是吾夫也。\"遂以闻官。升命属吏会邻里，就其井验是其夫不。邻里临井,咸言深暗不可辨，请出尸验之。升曰：\"众皆不能辨，是妇何以知其为夫？\"收付有司讯问。果妇人为奸杀其夫。"},{"id":"a193","t":"东郊祖朝上书晋献公（阅读）","u":"第 三十三 单 元","x":"《春秋左氏传》：庄公?十年，齐师伐我。公将战。曹刿请见，其乡人曰：\"肉食者谋之，又何间焉。\"曰\"肉食者，未能远谋。\"乃人见。刘向《说苑》：有东郊祖朝者，上书于晋献公，曰：\"愿请闻国家之计。\"献公使人告之曰：\"肉食者已虑之矣，藿食者尚何预為。\"祖朝曰：\"肉食者一旦失之于庙堂之上，若臣等藿食者宁得无肝脑涂地于中原之野，其祸亦及臣之身，安得无预国家之计乎？\""},{"id":"a194","t":"治国与治身","u":"第 三十三 单 元","x":"告子谓墨子曰：\"我能治国为政。\"墨子曰：\"政者，口言之,身必行之。今子口言之而身不行，是子之身乱也。子不能治身，為能治国政？\""},{"id":"a195","t":"治国之本","u":"第 三十三 单 元","x":"坚召见高泰,说之,问以治国之本。对曰\"治本在得人,得人在审举,审举在核真。未有官得其人而国家不治者也。\"坚曰：\"善！是言可谓辞简而理博矣。\""},{"id":"a196","t":"官舟与官民","u":"第 三十三 单 元","x":"里子自吴归粤。国相使人送之,曰：\"使自择官舟以渡。\"送者未至，于是舟泊于浒者以千数。里子欲择之而不能识。送者至，问之曰：\"舟若是多也恶能择？\"对曰：\"甚易也，但视其蔽篷、折橹而破帆者，即官舟也。\"从而得之。铆里子仰天叹曰：\"今之政治，其亦以民为官民歌？则爱之者鲜矣，宜其蔽也。\""},{"id":"a197","t":"一道几何题","u":"第 三十三 单 元","x":"竹原高一丈,末折着地，去本三尺,问竹还高几何？"},{"id":"a198","t":"鬼怕恶人","u":"第 三十三 单 元","x":"艾子行水途,见一庙,矮小而装饰甚严。前有一小沟,有人行至,遇水不可涉。顾庙中,而轭取大王像横于沟上，履之而去。复有一人至，见之,再三叹之曰：\"神像直如此慢！\"乃自扶起，以衣拂拭，奉至座上，再拜而去。须史，艾子闻庙中曰：\"大王居此为神，享乡人祭祀，反为愚民所辱，何不施祸以遣之？\"王曰：\"然则祸当施于后来者。\"小鬼又曰：\"前人以履辱大王,辱莫甚焉，而不施祸；后来者敬大王，反祸之，何也？\"王曰：\"前人已不信矣，又安祸之？\"艾子曰：\"真是鬼怕恶人也。\""},{"id":"a199","t":"永之氓咸善游（阅读）","u":"第 三十四 单 元","x":"一日,水暴甚。有五六氓,乘小船绝湘水。中济船破,皆游。其一氓尽力而不能寻常。其侣曰：\"汝善游最也,今何后为?\"曰：\"吾腰千钱,重,是以后。\"曰：\"何不去之？\"不应，摇其首。有顷，益怠。已济者立岸上,呼且号曰：\"汝愚之甚,蔽之甚！身且死,何以货为？\"又摇其首,遂溺死。"},{"id":"a200","t":"身藏珠","u":"第 三十四 单 元","x":"唐高祖谓侍臣曰：\"吾闻西域贾得美珠，剖身以藏之，有诸？\"侍臣日；\"有之。\"上曰：\"人皆知笑彼之爱珠而不爱其身也；吏受贿抵法，与帝主伺奢欲而亡国者，何以异于胡之可笑邪？\"魏徽曰：\"昔鲁哀公谓孔子曰：‘人有好忘者，宅而忘其妻！孔子曰：‘又有甚于此者,桀、纣乃忘其身！亦犹是也。\"上曰：\"然。朕望公辈力相辅，庶免为人笑也。\""},{"id":"a201","t":"晋人有好利者","u":"第 三十四 单 元","x":"晋人有好利者，人市焉，遇物则搜之，曰：\"此吾可羞也，此吾可服也，此吾可资也，此吾可器也！\"已而去。市伯从而索其直。晋人曰：\"吾利火炽时，目眩头晕，四海之物皆若已所固有，不知为尔物也。尔幸与我，我若富贵当尔偿！\"市伯怒而鞭之。傍有咽晒者。晋人骂曰：\"世人好利有甚于我者，往往百计而阴夺之；吾犹取之白，岂不贤于彼哉？何晒之有！\""},{"id":"a202","t":"古鉴与砚","u":"第 三十四 单 元","x":"有朝士家藏古鉴，自言能照二百里。将以献吕蒙正。吕曰：\"我面不及碟子大,安用二百里之鉴乎？\"不用。又，孙之翰，人与一砚,直三十千③，云：\"此石呵之则水流。\"翰曰：\"一日呵得一担水，只直三文钱，何须此重价？\"二人者语似俗而实。推广此意，则一饱之需，何须八珍；七尺之躯，何用千门万户？"},{"id":"a203","t":"郑有躁人","u":"第 三十四 单 元","x":"囊者郑有躁人。射不中则碎其,奔不胜则啮其子。或曰：\"是非与子之罪也，益亦反而思诸？\"弗喻。久之,益躁,卒病躁而死。"},{"id":"a204","t":"田父得玉","u":"第 三十四 单 元","x":"田父耕于野,得玉径尺,以告邻人。邻人阴欲图之,诈之曰：\"此怪石也，畜之弗利汝家,弗如复之。\"田父虽疑,犹录以归,置于房下。其夜玉明,光照一室。田父举家大怖,复以告邻人。邻人曰：\"此怪之征也，捐之,患可除。\"于是遵弃于远野。无何，邻人盗之，以献魏王。魏王召玉工相之，曰：\"贺大王得此天"},{"id":"a205","t":"临江之麋（阅读）","u":"第 三十五 单 元","x":"临江之人得麋麑,畜之。入门,群犬垂涎,扬尾皆来。其人怒,恒之。自是日抱就犬,习示之,使勿动。稍使与之戏。积久,犬皆如人意。魔稍大,忘已之麋也,以为犬良我友,抵触偃仆,益。犬畏主人,与之俯仰甚善。然时啖其舌。三年,廉出门,见外犬在道甚众,走欲与为戏。外犬见而喜且怒,共杀食之,狼藉道上。麋至死不悟。"},{"id":"a206","t":"王华之犬","u":"第 三十五 单 元","x":"饶州民章华，常樵人山。其年冬，比邻有王华者，偕上山樵，犬亦随之。候有一虎自丛中跃出，搏王华，华立仆，然未伤。虎踞于地，少息。章华且号且走，虎遂舍王华而逐章华。时犬潜莽中，见章华被衔，突出跃上虎头，啮虎之鼻。虎不意其来，惊惧而走。二人皆僵仆如沉醉者。其犬吐涎水救之。如此数次,章稍苏。犬复以此救王。良久，王亦起。犬惫，伏地不能起，是夕即毙。"},{"id":"a207","t":"人虎","u":"第 三十五 单 元","x":"莆田壶山下有路通海，贩者由之。至正丁未春，民以虎皮，锻利铁为爪牙,习其奋跃之态,绝类。乃出伏灌莽中，使侦者缘木而视,有负囊至者则啸以为信。虎跃出，其叽杀之。或裂其肉,如噬啮状；裂其囊,取物之尤者，余则封如故,示人弗疑。人竞传壶山下有虎，不食人，唯其血，且神之。已而，民偶出，其妇守岩穴。妇闻木上啸声急，意必有重货，乃蒙虎皮而搏之。妇人质脆柔,贩者得与抗。妇惧,逸去。贩者微见其人也。归而谋诸邻，课而逐之。抵穴，获金帛无数。民竟逃去。呜呼！世之\"人虎\"，岂独民也哉！"},{"id":"a208","t":"宝石","u":"第 三十五 单 元","x":"云南之产宝石。山高，人不能径至，而猿居遍山，往来如织。人习弩，以丸弹猿。猿患,群拾石掷人。人往来避之。又弹,以触其怒,猿又掷石。石大小不一。人拾归,捐其顽者，而猫睛石、红、祖母绿③,五色斑斓。群得宝已，歌而归。亦有蕴璞中者，磨治成器，售可得重资。"},{"id":"a209","t":"猿子","u":"第 三十五 单 元","x":"武平产猿，猿毛若金丝，闪闪可观。猿子犹奇，性可,然不离母。母點，人不可逮。猎人以毒附矢，伺母间射之。中母，母度不能生，洒乳于树，饮子。洒已，气绝。猎人向猿子鞭母，猿子悲鸣而下，束手就擒。每夕必寝皮乃安，甚者辑抱皮跳跃而毙。嵯夫！猿子且知有母，不爱其身，况人也耶？世之不孝子孙，其于猿子下矣！"},{"id":"a210","t":"曹操败走华容道","u":"第 三十五 单 元","x":"赤壁之战，曹操船舰为备所烧，引军从华容道步归。值泥泞，道不通，天又大风,悉使赢兵负草填之,骑乃得过。赢兵为人马所蹈藉，陷泥中,死者甚众。军既出，操大喜。诸将问之，操曰：\"刘备，吾也，但得计少晚。向使早放火，吾辈无命矣。\"备寻亦放火而无所及。"},{"id":"a211","t":"王昭君出塞（阅读）","u":"第 三十六 单 元","x":"元帝后宫既多,不得常见,乃使画工图形,案图召幸之。诸宫人皆赂画工,多者十万,少者也不减五万。独王不肯,遂不得见。匈奴入朝,求美人为阙氏。于是上案图,以昭君行。及去,召见,貌为后宫第一,善应对,举止闲雅。帝悔之,而名籍已定。帝重信于外国,故不复更人,乃穷案其事,画工皆弃市,籍其家资皆巨万。"},{"id":"a212","t":"文德皇后谏太宗","u":"第 三十六 单 元","x":"\"岂过魏徽，每廷争厚我，使我常不自得！\"皇后退而具朝服立于庭。帝惊曰：\"皇后何为若是？\"对曰：\"妾闻主圣臣忠。今醒下圣明，故魏徽得直言。妾幸备数后宫，安敢不贺？\"（）"},{"id":"a213","t":"张仪受辱","u":"第 三十六 单 元","x":"张仪已学而游说诸侯。尝从楚相饮，已而楚相亡璧。门下意张仪，日；\"仪贫无行③,必此盗相君之璧。\"共执张仪,掠答数百，不服,释之。其妻曰：\"嘻！子毋读书游说，安得此辱乎？\"张仪谓其妻曰：\"视吾舌尚在否？\"其妻笑曰：\"舌在也。\"仪曰：\"足矣。\"张仪既相秦，为文告楚相曰：\"始吾从若饮，我不盗而璧，若答我。若善守汝国，我且盗而城！\""},{"id":"a214","t":"萧何远虑","u":"第 三十六 单 元","x":"刘邦帅军入咸阳,诸将皆竞走入金帛府库而分之。独萧何入秦丞相府，收律令图书车载以藏之。后刘邦被封汉王,以何为丞相。项王入咸阳,未久,屠烧而去。既而刘、项争霸,汉王所以具知天下厄塞、户口多少，及民所疾苦者，以何具得秦图书也。刘邦称帝，首封萧何。"},{"id":"a215","t":"外科医生","u":"第 三十六 单 元","x":"有医者,自称善外科。一裨将阵回,中流矢,深入膜内,延使治。乃持并州剪剪去矢管,跪而请谢。神将曰\"在膜内者须函治。\"医曰：\"此内科事,不意并责我。\""},{"id":"a216","t":"郭舍人救乳母","u":"第 三十六 单 元","x":"汉武帝乳母恃恩，家人纵横。帝怒，诏乳母流于边，人辞帝。郭舍人谓曰：\"母今出时，但屡顾我，我当救母不行。\"母从其言，乃顾舍人。舍人骂曰：\"回顾，何为？帝壮矣，岂假汝乳耶！\"帝于是悦，遂不流乳母。"},{"id":"a217","t":"苏武牧羊（阅读）","u":"第 三十七 单 元","x":"卫律知武终不可胁,白单于。单于愈益欲降之,乃幽武,置大窖中,绝不饮食。天雨雪,武卧啮雪,与毡毛并咽之,数日不死,匈奴以为神。乃徙武北海上无人处,使牧,乳乃得归。别其官属常惠等,各置他所。武既止海上,食不至,掘野鼠去\"草食而食之。杖汉节牧羊,卧起操持，节尽落。"},{"id":"a218","t":"尉迟敬德","u":"第 三十七 单 元","x":"唐太宗尝谓尉迟敬德曰：\"人或言卿反，有诸？\"对曰：\"臣反是实！臣从陛下征伐四方，身历百战，今之存者，皆锋镝之余也。天下已定，乃更疑臣反也！\"因解衣投地，出其瘢痪。上为之流涕，曰：\"卿复服，朕不疑卿，故语卿，何恨邪？\""},{"id":"a219","t":"颜氏父子异志","u":"第 三十七 单 元","x":"颜延之子竣贵重,凡竣所供,延之一无所受,布衣茅屋如故。尝乘赢牛笨车，逢竣侍从，即避道侧。尝语竣曰：\"吾平生不喜见要人，今不幸见汝！\"竣起第，延之谓曰：\"善为之，无令后人笑汝拙也。\"延之尝早竣，见宾客盈门，竣尚未起，延之怒曰：\"汝出粪土之中,升云霞之上，逮骄傲如此，岂能久乎？\"后竟为宋孝武所诛。"},{"id":"a220","t":"身无长物","u":"第 三十七 单 元","x":"王恭从会稽还,王大看之。见其坐六尺算,因语恭：\"卿东来,故应有此物,可以一领及我？\"恭无言。大去后，即举所坐者送之。既无余席，便坐荐上。后大闻之，甚惊，曰：\"吾本谓卿多,故求耳。\"对曰：\"丈人不悉恭，恭作人无长物。\""},{"id":"a221","t":"松柏之志犹存","u":"第 三十七 单 元","x":"南阳宗世林,魏武同时,而甚薄其为人,不与之交。及魏武作司空③，总朝政，从容问宗曰：\"可以交未？\"答曰：\"松柏之志犹存。\"世林既旨见疏，位不配德。文帝兄弟每造其第，皆拜床下。"},{"id":"a222","t":"孔子马逸","u":"第 三十七 单 元","x":"孔子行道而息,马逸，食人之稼,野人取其马。子贡请往说之,毕辞,野人不听。有人始事孔子者，曰：\"请往说之。\"因谓野人曰：\"子不耕于东海，吾不耕于西海也。吾马何得不食子之禾？\"其野人大说，相谓曰：\"说亦皆如此其辩也。独如向之人？\"解马而与之。"},{"id":"a223","t":"赵人养猫（阅读）","u":"第 三十八 单 元","x":"赵人患鼠,乞猫于中山。中山人予之猫,善捕鼠及鸡。月余,鼠尽而其鸡亦尽。其子患之，告其父曰：\"益去诸？\"其父曰：\"是非若所知也。吾之患在鼠,不在乎无鸡。夫有鼠，则窃吾食,毁吾衣,穿吾垣,毁伤吾器用,吾将饥寒焉,不病于无鸡乎？无鸡者，弗食鸡则已耳，去饥寒犹远，若之何去夫，猫也？\""},{"id":"a224","t":"戴渊弃剑","u":"第 三十八 单 元","x":"戴渊少时,游侠?不检,尝在江、准间攻掠商旅。陆机假后赴洛③,辙重甚盛。渊使少年掠劫。渊在岸上，指挥左右，皆得其宜。渊虽为事，神气犹异。机于船上遥谓之曰：\"卿才如此，何为作劫邪？\"渊便泣涕，投剑归机，辞利非常。机弥重之,定交,作书荐焉。后仕征西将军。"},{"id":"a225","t":"病龙报恩","u":"第 三十八 单 元","x":"昔魏郡\"亢阳久旱无雨,农夫祷于龙洞,果得雨,将祭谢之。孙登见而日；\"此病龙之雨，安得苏禾乎？如弗之信，请嗅之。\"农夫嗅雨，果腥秽。龙时背生疽,闻登言,化为一叟,求治,曰：\"疾愈，当有报。\"农夫治之,不数日，果暴雨。见大石中裂开一井,其水湛然。盖龙穿此井以酬也。"},{"id":"a226","t":"罗程有才无德","u":"第 三十八 单 元","x":"乐工罗程,善琵琶,自唐武宗朝已得幸。上素晓音律,尤有宠。程侍恩暴横，以眶毗杀人,系狱。诸乐工为之请,因上幸后苑奏乐,乃设虚坐,置琵琶上，而罗拜于庭,且泣。上问其故,对曰：\"罗程负陛下,万死;然臣等惜其天下绝艺,后不得复奉宴游矣！\"上曰：\"汝曹所惜者罗程艺，朕所惜者高祖、太宗法。\"竟杖杀之。"},{"id":"a227","t":"王经忠孝","u":"第 三十八 单 元","x":"王经\"少贫苦,仕至二千石。母语之曰：\"汝本寒家子,仕至二千石,此可以（）止！\"经不能用。为尚书③，助魏，不忠于晋，被收。涕泣辞母曰：\"不从母教，以至今日！\"母都无戚容，语之曰：\"为子则孝，为臣则忠。有孝有忠，何负之有?\""},{"id":"a228","t":"人琴俱亡","u":"第 三十八 单 元","x":"王子猷、王子敬俱病笃，而子敬先亡。子献问左右：\"何以不闻消息？此已丧矣！\"语时了不悲。便索舆来奔丧,都不哭。子敬素好琴,便径人,坐灵乐上,取子敬琴弹，弦既不调,掷地云：\"子敬、子敬，人琴俱亡！\"因恸绝良久，月余亦卒。"}],"lex":[{"w":"其","m":"代词（他、它、他们的）或语气词。","u":[{"id":"a2","t":"华佗巧治","s":"有一郡守病,佗以为其人盛怒则差,乃多受其货而不加治。无何弃去,留书骂之。郡守果大怒，令人追捉杀佗。郡守子知之，嘱使勿逐。守患既甚，吐墨血数升而愈。"},{"id":"a5","t":"鸡","s":"孟子曰：\"今有人日其邻之鸡者，或告之曰：\"是非君子之道也。曰：请损之，月一鸡，以待来年，然后已。如知其非义，斯速已，何待来年？\""},{"id":"a10","t":"州官放火","s":"田登作郡守,怒人触其名,犯者必答之,举州皆谓灯为火。值上元放灯，吏揭榜于市，曰：\"本州依例放火三日。\"故语云：\"只许州官放火，不许百姓点灯\",本此。"},{"id":"a11","t":"嗟来之食","s":"齐大饥,黔敖为食于路，以待饿者而食之。有饿者蒙袂辑履,贸贸然来。黔敖左奉食,左执饮,曰：\"嗟！来食!\"扬其目而视之,曰：\"予唯不食‘嗟来之食\",以至于斯也。\"从"},{"id":"a14","t":"雁","s":"具区之泽,白雁聚焉。夜必择栖,恐人弋己也,设雁奴环巡之;人至则鸣,群雁藉是以膜。泽人熟其故,燃火照之,雁奴嘎然鸣,泽人邃沉其火。群雁皆惊起,视之无物也。如是者三"},{"id":"a16","t":"蛙与牛斗","s":"蛙于草中,视牛渐近,庞然大物也,嫉之。遂吸气鼓腹,欲逾于牛,谓伙曰：\"吾腹稍大，似牛乎？\"伙曰：\"差远矣！\"蛙怒，复吸气鼓腹，曰：\"今如何？\"曰：\"与前无异。蛙"},{"id":"a18","t":"巴延三毁\"驴香馆\"","s":"山西城外有酒肆,所烹驴肉甚香美，遐迩闻名，群呼曰：\"驴香馆\"。其法以草驴一头,养之至肥,先醉以酒,后满身排打。欲割其肉,先钉四柱,将驴足缚住，又以木一横于背,系"},{"id":"a26","t":"孙叔敖杀两头蛇","s":"孙叔敖为婴儿之时,出游,见两头蛇,杀而埋之,归而泣。其母问其故,叔敖对曰：\"闻见两头之蛇者死。向者吾见之，恐去母而死也。\"其母曰：\"蛇今安在？\"曰：\"恐他人又见"},{"id":"a27","t":"李勉埋金","s":"唐时有书生旅宋州。时李勉少年贫苦,与书生同店。不旬日，书生疾作,遂至不治,临绝语勉曰：\"我洪州人也,将于北都求官。于此得疾而死,其命也。\"因出囊金百两遗勉，曰："},{"id":"a28","t":"季女饮药","s":"会稽之东有石氏者,其季女病痞,延良医治之,久而不除,谢医使去。其父思之：\"是良医也，奈何疗之而病不除？\"他日，窃窥之，见其女举药不饮而覆于床下。乃复迎医，强进以"},{"id":"a29","t":"李泰伯改字","s":"范文正公守桐庐,始于钓台建严先生祠堂，自为记,其歌词曰：\"云山苍苍，江水決決,先生之德，山高水长。既成，以示李泰伯。泰伯读之三，叹味不已,起而言曰：\"公之文一出"},{"id":"a30","t":"茹太素被杖","s":"茹太素陈时务累万言。太祖令中书郎王敏诵而听之。中言才能之士,数年来幸存者百无一二,今所任率迁儒俗吏,言多触。帝怒,召太素面语,杖于朝。次夕复于宫人令人诵之,得其"},{"id":"a38","t":"曾母投杼","s":"费人有与曾子同名族者而杀人。或告曾子母曰：\"曾参杀人。\"曾子之母曰：\"吾子不杀人。\"织自若。有顷焉，人又曰：\"曾参杀人。\"其母尚织自若也。顷之，一人又告之曰：\""},{"id":"a42","t":"楚之南有猎者","s":"鹿畏躯,驱畏虎,虎畏黑。黑之状,被发人立,绝有力甚害人焉。楚之南有猎者,能吹竹为百兽之音,为鹿鸣以感其类,伺其至,发火而射之。驱闻鹿鸣，趋而至。猎人恐，因为虎鸣"},{"id":"a47","t":"次非斩蛟","s":"荆有次非者,得宝剑于干遂。还反涉江,至于中流,有两蛟夹绕其船。臂祛衣,拔宝剑曰\"此江中之腐肉朽骨也。弃剑以全众,余奚爱焉？\"于是赴江刺蛟,杀之而复上船。舟中之人"},{"id":"a51","t":"欧阳修家教","s":"欧阳修四岁而孤，家贫无资，母以荻画地，教以书字。多诵古人篇章，使学为诗。及稍长,而家无书读,就间里士人家假而读之。或因而抄录。抄录未毕,而已能诵其书。以至昼夜忘"},{"id":"a53","t":"不龟手之药","s":"宋人有善为不龟手之药者,世世以漂洗为业。客闻之,请买其方百金。聚族而谋曰：\"我世世为漂洗，不过数金，今一朝而技百金，请与之。\"客得之，以说吴王。越有难,吴使之将"},{"id":"a59","t":"王桑默记","s":"王粲与人共行，读道边碑，人问曰：\"卿能默诵乎？\"曰：\"能。\"因使背而诵之,不失一字。尝观人围棋,局坏,粲为复之。棋者不信,以帕盖局,更以他局为之，以相比较，仍不"},{"id":"a62","t":"缇萦救父","s":"汉文帝四年中,人上书言淳于意受赂,以刑罪传西之长安。意有五女，随而泣。意怒，骂曰：\"生子不生男，缓急无可使者！\"于是少女缇蒙伤父之言，乃随父西之长安，上书曰：\""},{"id":"a70","t":"刘颇当机立断","s":"混池道中,有车载瓦瓮,塞于隘路。属天寒冰雪峻滑,进退不得。日向暮，官私客旅群队,铃铎数千,罗拥在后，无可奈何。有客刘颇者，扬鞭而至，问曰：\"车中瓮直几钱？\"答曰"},{"id":"a74","t":"班昭续《汉书》","s":"扶风曹世叔妻者，同郡班彪之女也，名昭，字惠班，博学高才。世叔早卒，兄固著《汉书》，其八表及天文志未及竟而卒。和帝?诏昭就东观藏书阁而成之。帝数召入宫,令皇后诸贵"},{"id":"a75","t":"浙东愚妇","s":"浙东有妇,育一子。其夫嗜赌,室中财物罄,家徒壁立。妇规之曰：\"室无现粮何以存,愿改邪归正。\"夫怒，拳脚相加。哀告邻里，莫之止。一日，妇携子出，推堕河中,溺死。事"},{"id":"a82","t":"海瑞清廉","s":"都御史刚峰海公,卒于官舍。同乡宦南京者,唯苏民怀一人。苏检点其宦囊，竹箱中俸金八两，葛布一端，旧衣数件而已。如此都御史那可多得！王凤洲评之云：\"不怕死，不爱钱，"},{"id":"a87","t":"宋濂实对","s":"宋濂尝与客饮，帝密使人侦视。翌日，问濂昨饮酒否？坐客为谁？何物？濂具以实对。笑曰：\"诚然，卿不朕欺。\"间召问群臣臧否。唯举其善者对，曰：\"善者与臣友,其不善者不"},{"id":"a89","t":"范文正正直","s":"范文正公仲淹贫③,依唯阳朱氏家，常与一术者游。会术者病笃，使人呼文正而告曰：\"吾善炼水银为白金，吾儿幼，不足以付，令以付子。\"即以其方与所成白金一斤封志,内文正"},{"id":"a90","t":"东施效颦","s":"西施病心而其里。其里之丑人见而美之,归亦捧心而其里。其里之富人见之,坚闭门而不出；贫人之,挚妻子而去之走。彼知聲美，而不知之所以美。"},{"id":"a104","t":"学者之病","s":"古人云：学者之病,最忌自高自狭。自高者如峭壁,时雨过之,须史溜散，不能分润。自狭者如瓮受水,过其量则溢矣。善学者其如海乎,旱九年而不枯,受九州而不满。"},{"id":"a106","t":"长善而救失","s":"学者有四失,教者必知之。人之学也,或失则多,或失则寡,或失则易,或失则止。此四者，心之莫同也。知其心,然后能救其失也。教也者,长善而救其失者也。"},{"id":"a107","t":"黠狼","s":"有车夫载重登坡，方竭力时，一狼来啮其臀。欲释手，则货蔽压身，故忍痛推之。既止，则狼已片肉而去。乘其无能为力而窃一窝?，狼亦點矣。"},{"id":"a110","t":"郑板桥爱民","s":"郑燮号板桥,乾隆\"元年进士②。知范县,爱民如子。绝苞苴,案无留牍。公余辑与文士筋咏诗,有忘其为长吏者。调潍县,岁荒,人相食。燮开仓赈贷，或阻之,燮曰：\"此何时？"},{"id":"a113","t":"用法务在宽简","s":"唐太宗谓侍臣曰：\"死者不可再生，用法务在宽简。古人云，棺者欲岁之疫,非疾于人,利于棺售故耳。今法司核理③一狱,必求深刻,欲成其考课。今作何法,得使平允？\"谏议大"},{"id":"a126","t":"口蜜腹剑","s":"李林甫为相,凡才望功业出已右,及为上所厚而势位逼已者，必百计去之。其人尤忌文学之士。或阳与之善,啖以甘言,而阴陷之。世谓李林甫\"口有蜜,腹有剑\"。"},{"id":"a128","t":"王旦教诫子弟","s":"有货玉带者，子弟以为佳，呈旦,旦命系之，曰\"还见佳否？\"曰：\"系之，安得自见？\"旦曰：\"自负重而使观者称好，无乃劳乎？驱还之！\"旦生平不置田宅。曰：\"子旦曰：\""},{"id":"a132","t":"刘备托孤","s":"章武三年春,先主于永安病笃,召亮于成都,属以后事,谓亮曰\"君才十倍曹丕,必能安国,终定大事。若嗣子可辅,辅之;如其不才,君可自取\"亮涕泣曰：\"臣敢竭股肱之力,效"},{"id":"a136","t":"李广脱险","s":"李广出雁门击匈奴。匈奴兵多,破败广军,生得广。单于素闻广贤，令曰：\"得李广必生致之。\"胡骑得广，时广伤病，置广两马间，络而盛卧广。行十余里，广伴死,皖其旁有一胡"},{"id":"a146","t":"僧荐重元寺阁","s":"苏州重元寺阁一角忽陷,计其扶荐之功,当用钱数千贯③。有游僧曰：\"不足劳人。请一夫所木为楔,可以正也。\"寺主从之。僧每食,持楔数十,执柯登阁，敲其间。未逾月，阁柱"},{"id":"a149","t":"中山窃糟","s":"昔者鲁人不能为酒,唯中山之人善酿千日之酒。鲁人求其方弗得。有仕于中山者,主酒家。取其糟归,以鲁酒渍之。谓人曰：\"中山之酒也。\"鲁人饮之,皆以为中山之酒也。一日,"},{"id":"a153","t":"王孙贾诛淖齿","s":"王孙贾年十五,事齐闵王。王出走,失王之处。其母曰：\"女朝出而晚来，则吾倚门而望；女暮出而不远，则吾倚间而望。女今事王，王出走，女不知其处，女尚何归？\"王孙贾乃人"},{"id":"a161","t":"楚人烹猴","s":"楚人有烹猴而召其邻人，以为狗葵而甘之。后闻其猴也，据地而吐之,尽泻其食。此未始知味者也。邯郸师有出新曲者,托之李奇。诸人皆争学之。后知其非也,而皆弃其曲。此未始"},{"id":"a162","t":"魏文侯问李克","s":"魏文侯问李克曰：\"吴之所以亡者何也？\"李克对曰：\"数战数胜。\"文侯日；\"数战数胜，国之福也，其所以亡者何也？\"李克曰：\"数战则民疲，数胜则主骄；以骄主治疲民，此"},{"id":"a165","t":"郑武公伐胡","s":"昔者郑武公欲伐胡，故先以其女妻胡君，以娱其意。因问于群臣：\"吾欲\"，，国也。子言可伐，何也？\"胡君闻之,以郑为亲已,遂不备郑。郑人袭胡,取之。"},{"id":"a170","t":"顾荣施灵","s":"顾荣在洛阳,尝应人请,觉行炙人有欲炙之色,因已施焉。同座之。荣曰\"岂有终日执之而不知其味者乎？\"后遭乱渡江③,每经危急，常有一人左右。已问其所以,乃受炙人也。"},{"id":"a173","t":"王安期不鞭书生","s":"王安期为东海郡守,世乱,敕曰：\"夜不得私行。\"吏收得一宵行人。王问：\"自师家受业还,未之知也。\"吏曰：\"鞭乎？\"王曰：\"鞭挞书生以立威名，恐非致治之本。\"释之,"},{"id":"a178","t":"曾参全节","s":"曾子衣衣而耕,鲁君使人往致邑焉。曰：\"请以此饰衣。\"曾子不受,使者反，复往，辞不受。使者曰：\"先生非求于人，乃君赐之,奚为不受？\"曾子曰：\"臣闻之：‘受人者畏人"},{"id":"a179","t":"丁谓巧送书信","s":"丁谓既窜崖州，其家属寓洛阳。尝作家书，遣使致洛守刘烨，祈转付家。戒使者曰：\"伺烨会僚众时呈达。\"烨得书，遂不敢隐，即以闻。帝启视，则语多自"},{"id":"a183","t":"涓蜀梁之死","s":"夏首之南,有人為,日涓蜀梁。其为人也，愚而善畏。明月而宵行,俯见其影,以为伏鬼也；仰视其发，以为立魅也；背而走，比至其家,气绝而亡。岂不哀哉！"},{"id":"a195","t":"治国之本","s":"坚召见高泰,说之,问以治国之本。对曰\"治本在得人,得人在审举,审举在核真。未有官得其人而国家不治者也。\"坚曰：\"善！是言可谓辞简而理博矣。\""},{"id":"a196","t":"官舟与官民","s":"里子自吴归粤。国相使人送之,曰：\"使自择官舟以渡。\"送者未至，于是舟泊于浒者以千数。里子欲择之而不能识。送者至，问之曰：\"舟若是多也恶能择？\"对曰：\"甚易也，但"},{"id":"a204","t":"田父得玉","s":"田父耕于野,得玉径尺,以告邻人。邻人阴欲图之,诈之曰：\"此怪石也，畜之弗利汝家,弗如复之。\"田父虽疑,犹录以归,置于房下。其夜玉明,光照一室。田父举家大怖,复以"},{"id":"a208","t":"宝石","s":"云南之产宝石。山高，人不能径至，而猿居遍山，往来如织。人习弩，以丸弹猿。猿患,群拾石掷人。人往来避之。又弹,以触其怒,猿又掷石。石大小不一。人拾归,捐其顽者，而"},{"id":"a216","t":"郭舍人救乳母","s":"汉武帝乳母恃恩，家人纵横。帝怒，诏乳母流于边，人辞帝。郭舍人谓曰：\"母今出时，但屡顾我，我当救母不行。\"母从其言，乃顾舍人。舍人骂曰：\"回顾，何为？帝壮矣，岂假"},{"id":"a221","t":"松柏之志犹存","s":"南阳宗世林,魏武同时,而甚薄其为人,不与之交。及魏武作司空③，总朝政，从容问宗曰：\"可以交未？\"答曰：\"松柏之志犹存。\"世林既旨见疏，位不配德。文帝兄弟每造其第"}]},{"w":"之","m":"代词/助词/动词“到”，随文而释。","u":[{"id":"a2","t":"华佗巧治","s":"有一郡守病,佗以为其人盛怒则差,乃多受其货而不加治。无何弃去,留书骂之。郡守果大怒，令人追捉杀佗。郡守子知之，嘱使勿逐。守患既甚，吐墨血数升而愈。"},{"id":"a4","t":"天雨谷","s":"汉宣帝时,江淮比年旱,大饥,人相食,死者相望。天雨谷三日。寻魏地③奏,亡谷二千顷,人皆异之。（）"},{"id":"a5","t":"鸡","s":"孟子曰：\"今有人日其邻之鸡者，或告之曰：\"是非君子之道也。曰：请损之，月一鸡，以待来年，然后已。如知其非义，斯速已，何待来年？\""},{"id":"a9","t":"一叶障目","s":"楚人居贫,读《淮南方》,得\"螳螂伺蝉叶,可以隐形\"大喜。遂于树下仰望,欲觅螳螂伺蝉自障叶。偶见之，即缘而摘之，然不慎叶落树下。树下先有落叶,不能具分辨,乃扫取数"},{"id":"a10","t":"州官放火","s":"田登作郡守,怒人触其名,犯者必答之,举州皆谓灯为火。值上元放灯，吏揭榜于市，曰：\"本州依例放火三日。\"故语云：\"只许州官放火，不许百姓点灯\",本此。"},{"id":"a11","t":"嗟来之食","s":"齐大饥,黔敖为食于路，以待饿者而食之。有饿者蒙袂辑履,贸贸然来。黔敖左奉食,左执饮,曰：\"嗟！来食!\"扬其目而视之,曰：\"予唯不食‘嗟来之食\",以至于斯也。\"从"},{"id":"a12","t":"拔杨容易栽杨难","s":"陈贵于魏王。子曰：\"必善事左右。夫杨,横树之即生,倒树之即生，折而树之又生。然使十人树之,而一人拔之,则毋生杨。夫以十人之众,树易生之物,而不胜一人者,何也？树"},{"id":"a14","t":"雁","s":"具区之泽,白雁聚焉。夜必择栖,恐人弋己也,设雁奴环巡之;人至则鸣,群雁藉是以膜。泽人熟其故,燃火照之,雁奴嘎然鸣,泽人邃沉其火。群雁皆惊起,视之无物也。如是者三"},{"id":"a15","t":"绳技奇观","s":"唐玄宗开元二十四年八月五日,御楼设绳技。技者先引长绳,两端属地,埋轨以系之。又竖数丈之柱以起绳,绳直如弦。技女自绳端足而上,往来忽间,望之如仙。有中路相遇侧身而"},{"id":"a16","t":"蛙与牛斗","s":"蛙于草中,视牛渐近,庞然大物也,嫉之。遂吸气鼓腹,欲逾于牛,谓伙曰：\"吾腹稍大，似牛乎？\"伙曰：\"差远矣！\"蛙怒，复吸气鼓腹，曰：\"今如何？\"曰：\"与前无异。蛙"},{"id":"a17","t":"逼供生冤","s":"刘拟山家失金,掠问小女奴,具承卖与打鼓者③。又掠问打鼓者衣服形状,索之不获,仍复掠问。忽尘上似有微声,曰：\"我,狐也,居君家四十年,不露形声,今诚不能忍矣。此非"},{"id":"a18","t":"巴延三毁\"驴香馆\"","s":"山西城外有酒肆,所烹驴肉甚香美，遐迩闻名，群呼曰：\"驴香馆\"。其法以草驴一头,养之至肥,先醉以酒,后满身排打。欲割其肉,先钉四柱,将驴足缚住，又以木一横于背,系"},{"id":"a20","t":"韩信钻裤裆","s":"韩信者,汉之名将也。少时,好带刀剑。一日,出淮阴屠中,值无赖故辱之，曰：\"若虽长大,好带刀剑,中情怯耳。\"又众辱之曰：\"信敢死,刺我;不敢死,则出过下！\"信熟视"},{"id":"a22","t":"杞人忧天","s":"杞国有人，忧天地崩坠,身亡所寄，废寝食者。又有忧彼之所忧者，因往晓之曰：\"天，积气耳，亡处亡气。若屈伸呼吸，终日在天中行止，奈何忧崩坠乎？\"其耀者,只使坠,亦不"},{"id":"a26","t":"孙叔敖杀两头蛇","s":"孙叔敖为婴儿之时,出游,见两头蛇,杀而埋之,归而泣。其母问其故,叔敖对曰：\"闻见两头之蛇者死。向者吾见之，恐去母而死也。\"其母曰：\"蛇今安在？\"曰：\"恐他人又见"},{"id":"a28","t":"季女饮药","s":"会稽之东有石氏者,其季女病痞,延良医治之,久而不除,谢医使去。其父思之：\"是良医也，奈何疗之而病不除？\"他日，窃窥之，见其女举药不饮而覆于床下。乃复迎医，强进以"},{"id":"a29","t":"李泰伯改字","s":"范文正公守桐庐,始于钓台建严先生祠堂，自为记,其歌词曰：\"云山苍苍，江水決決,先生之德，山高水长。既成，以示李泰伯。泰伯读之三，叹味不已,起而言曰：\"公之文一出"},{"id":"a30","t":"茹太素被杖","s":"茹太素陈时务累万言。太祖令中书郎王敏诵而听之。中言才能之士,数年来幸存者百无一二,今所任率迁儒俗吏,言多触。帝怒,召太素面语,杖于朝。次夕复于宫人令人诵之,得其"},{"id":"a32","t":"刘敏中之志","s":"刘敏中幼卓异不凡，年十三，语其父景石曰：\"昔贤足于学而不求知，丰于功而不自炫,此后人所弗逮也。\"父奇之。乡先生杜仁杰爱其文,呕称之。敏中尝与同侨言其志曰：\"自幼"},{"id":"a35","t":"戴胄依法断流","s":"有诈伪者事觉,戴胄依法断流。唐太宗曰：\"朕下敕不首者死,今断从流，是示天下以不信。卿欲卖狱乎？\"胃曰：\"陛下当即杀之，非臣所及。既付有司，臣不敢亏法。\"帝曰：\""},{"id":"a36","t":"性","s":"子子?与友连床,围炉而坐。其友据案阅书,而裳曳于火,甚炽。子子前，拱手作礼致词曰：\"适有一事，欲以奉告。然君天性躁急，恐激君怒；欲以不告，则与人非忠。唯君宽大，"},{"id":"a38","t":"曾母投杼","s":"费人有与曾子同名族者而杀人。或告曾子母曰：\"曾参杀人。\"曾子之母曰：\"吾子不杀人。\"织自若。有顷焉，人又曰：\"曾参杀人。\"其母尚织自若也。顷之，一人又告之曰：\""},{"id":"a40","t":"螳螂捕蝉","s":"吴王欲伐荆,告其左右曰：\"敢有谏者死！\"舍人有少孺子②者欲谏不敢，则怀丸操弹于后园,露沾其衣,如是者三旦。吴王曰：\"子来,何苦沾衣如此！\"对曰：\"园中有树，其上"},{"id":"a41","t":"尹绰之爱","s":"赵简子有臣尹绰、赦厥。简子曰：\"厥也爱我,谏我必不于众人中；绰也不爱我，谏我必于众人中。\"尹绰曰：\"厥也爱君之丑而不爱君之过；臣爱君之过而不爱君之丑。\"孔子曰："},{"id":"a42","t":"楚之南有猎者","s":"鹿畏躯,驱畏虎,虎畏黑。黑之状,被发人立,绝有力甚害人焉。楚之南有猎者,能吹竹为百兽之音,为鹿鸣以感其类,伺其至,发火而射之。驱闻鹿鸣，趋而至。猎人恐，因为虎鸣"},{"id":"a47","t":"次非斩蛟","s":"荆有次非者,得宝剑于干遂。还反涉江,至于中流,有两蛟夹绕其船。臂祛衣,拔宝剑曰\"此江中之腐肉朽骨也。弃剑以全众,余奚爱焉？\"于是赴江刺蛟,杀之而复上船。舟中之人"},{"id":"a48","t":"法不赦故人","s":"濮州刺史庞相寿坐贪污解任②，自陈尝在秦王④幕府。上怜之。欲听归任。魏徽谏曰：\"秦王左右甚多,恐人人恃私恩，足使为善者惧。\"上欣然纳之，谓相寿曰：\"我昔为秦王,乃"},{"id":"a51","t":"欧阳修家教","s":"欧阳修四岁而孤，家贫无资，母以荻画地，教以书字。多诵古人篇章，使学为诗。及稍长,而家无书读,就间里士人家假而读之。或因而抄录。抄录未毕,而已能诵其书。以至昼夜忘"},{"id":"a52","t":"唐太宗纳谏","s":"贞观三年,太宗谓裴寂曰：\"比有上书奏事,条数甚多。朕总黏之屋壁,出人观省。所以孜孜不倦者，欲尽臣下之情。每一思政理,或三更方寝。亦望公辈用心不倦，以副朕怀也。\""},{"id":"a58","t":"宋濂勤学不怠","s":"余幼时即嗜学。家贫,无从致书以观,每假于藏书之家,手自笔录,计日以还。天大寒,砚冰坚,手指不可届伸,弗之怠。录毕,走送还之,不敢稍逾约。以是，人多以书假余,余因"},{"id":"a59","t":"王桑默记","s":"王粲与人共行，读道边碑，人问曰：\"卿能默诵乎？\"曰：\"能。\"因使背而诵之,不失一字。尝观人围棋,局坏,粲为复之。棋者不信,以帕盖局,更以他局为之，以相比较，仍不"},{"id":"a60","t":"张溥与七录斋","s":"张溥幼嗜学,所读书必手抄,抄已,朗诵一过即焚之;又抄,如是者六七始已。左手握管处指掌成茧。冬日手皱，日沃汤数次。后名读书之斋曰\"七录\"。溥诗文敏捷,四方征索者,"},{"id":"a62","t":"缇萦救父","s":"汉文帝四年中,人上书言淳于意受赂,以刑罪传西之长安。意有五女，随而泣。意怒，骂曰：\"生子不生男，缓急无可使者！\"于是少女缇蒙伤父之言，乃随父西之长安，上书曰：\""},{"id":"a64","t":"李密侍奉祖母","s":"李密,西晋武阳人,字令伯。早孤,母再适,祖母刘氏养之。少仕蜀,蜀亡,晋武帝③征为太子洗马,不受命,或疑其不欲归晋,武帝遣人再三趣之,乃上书,其文曰：臣密今年四十"},{"id":"a70","t":"刘颇当机立断","s":"混池道中,有车载瓦瓮,塞于隘路。属天寒冰雪峻滑,进退不得。日向暮，官私客旅群队,铃铎数千,罗拥在后，无可奈何。有客刘颇者，扬鞭而至，问曰：\"车中瓮直几钱？\"答曰"},{"id":"a71","t":"钟弱翁露丑","s":"钟弱翁所至,好贬榜额字画，必除去之,然后自立新意重书之。然书实不工,从者皆苦之。曾过一山寺,有高阁壮丽。弱翁与僚属拥立,望其额,日③\"定惠之阁\"，题者姓名漫灭。"},{"id":"a72","t":"龚自珍忘形","s":"山民至扬,多寓予园之秋实轩。秋实轩者,有古桐树数株,相传为李唐旧植。山民暇辑低咏其下。一夕，与客谈甚欢,遂坐桌上，送客，靴不知所在。越数日，山民行，仆辈于帐顶得"},{"id":"a74","t":"班昭续《汉书》","s":"扶风曹世叔妻者，同郡班彪之女也，名昭，字惠班，博学高才。世叔早卒，兄固著《汉书》，其八表及天文志未及竟而卒。和帝?诏昭就东观藏书阁而成之。帝数召入宫,令皇后诸贵"},{"id":"a75","t":"浙东愚妇","s":"浙东有妇,育一子。其夫嗜赌,室中财物罄,家徒壁立。妇规之曰：\"室无现粮何以存,愿改邪归正。\"夫怒，拳脚相加。哀告邻里，莫之止。一日，妇携子出，推堕河中,溺死。事"},{"id":"a78","t":"华隆获救","s":"华隆好猎，畜一犬，号曰\"的尾\"，每出必从。一日，隆至江边，为大蛇围绕周身。犬遂奋而咋蛇,蛇死焉。而隆僵仆于地，不省人事。犬疾走至家,嗪不止。举家怪之,因随犬往,"},{"id":"a81","t":"牛屋修刺","s":"褚季野以章安令迁太尉记室参军，名已显而位微，人未多识。公东出，乘估客船,送故吏数人投钱塘亭住。尔时吴兴沈充为县令,正送客过浙江。客出，亭吏驱公移牛屋下。潮水至，"},{"id":"a82","t":"海瑞清廉","s":"都御史刚峰海公,卒于官舍。同乡宦南京者,唯苏民怀一人。苏检点其宦囊，竹箱中俸金八两，葛布一端，旧衣数件而已。如此都御史那可多得！王凤洲评之云：\"不怕死，不爱钱，"},{"id":"a83","t":"解扁劳民","s":"解扁为东封,上计而人三倍,有司请赏之。文侯曰\"吾土地非益广也，人民非益众也,人何以三倍？\"对曰：\"以冬伐木而积之,于春浮之河而之。\"文侯曰：\"民春以力耕，暑以强"},{"id":"a84","t":"丧家狗","s":"孔子适郑,与弟子相失，孔子独立郭东门。郑人或谓子贡曰：\"东门有人，其颖似尧,其项类皋陶,其肩类子产③,然自要以下不及禹三寸,累累若丧家之狗。\"子贡以实告孔子。孔"},{"id":"a88","t":"涂有功秉公执法","s":"皇甫文备,武后时酷吏也，与徐大理论狱，诬徐党逆人,奏成其罪。武后（）特出之。无何,文备为人所告，有功讯之在宽。或曰：\"彼时将陷公于死，今公反欲出之，何也？\"徐曰"},{"id":"a89","t":"范文正正直","s":"范文正公仲淹贫③,依唯阳朱氏家，常与一术者游。会术者病笃，使人呼文正而告曰：\"吾善炼水银为白金，吾儿幼，不足以付，令以付子。\"即以其方与所成白金一斤封志,内文正"},{"id":"a90","t":"东施效颦","s":"西施病心而其里。其里之丑人见而美之,归亦捧心而其里。其里之富人见之,坚闭门而不出；贫人之,挚妻子而去之走。彼知聲美，而不知之所以美。"},{"id":"a92","t":"唐太宗论\"甲兵\"","s":"房玄龄奏\"阅府库甲兵，远胜隋世。\"上曰：\"甲兵武备，诚不可缺，然炀帝甲兵岂不足邪,卒亡天下。若公等尽力,使百姓义安,此乃朕之甲兵也。\""},{"id":"a96","t":"骠骑将军霍去病","s":"骠骑将军为人,少言不泄,有气敢往。天子尝欲教之孙、吴兵法,对曰：（）\"顾方略如何耳，不至学古兵法。\"天子为治第，令骠骑视之，对曰：\"匈奴未灭，无以为家也！\"由此"},{"id":"a99","t":"鲍子难客","s":"齐田氏祖于庭,食客千人。有献鱼、雁者,田氏视之,乃叹曰\"天之于民厚矣！殖五谷,生鱼鸟,以为之用。\"众客和之。有鲍氏之子,年十二,亦在坐,进曰：\"不如君言。天地万"},{"id":"a100","t":"陈元方答袁公","s":"陈元方年十一时,谒袁公。袁公问曰：\"贤家君在太丘,远近称之，何以履政？\"元方曰：\"老父在太丘，强者抚之以德，弱者抚之以仁，恣其所为,久而益敬。\"袁公曰：\"吾向为"},{"id":"a101","t":"银工家出宰相","s":"李太宰邦彦家起于银工。既贵,其母尝语贫寒事,诸孙以为耻。母曰：\"女有识乎？宰相家出银工，则可羞；银工家出宰相，正为嘉事，何耻之有!\""},{"id":"a104","t":"学者之病","s":"古人云：学者之病,最忌自高自狭。自高者如峭壁,时雨过之,须史溜散，不能分润。自狭者如瓮受水,过其量则溢矣。善学者其如海乎,旱九年而不枯,受九州而不满。"},{"id":"a106","t":"长善而救失","s":"学者有四失,教者必知之。人之学也,或失则多,或失则寡,或失则易,或失则止。此四者，心之莫同也。知其心,然后能救其失也。教也者,长善而救其失者也。"},{"id":"a107","t":"黠狼","s":"有车夫载重登坡，方竭力时，一狼来啮其臀。欲释手，则货蔽压身，故忍痛推之。既止，则狼已片肉而去。乘其无能为力而窃一窝?，狼亦點矣。"},{"id":"a110","t":"郑板桥爱民","s":"郑燮号板桥,乾隆\"元年进士②。知范县,爱民如子。绝苞苴,案无留牍。公余辑与文士筋咏诗,有忘其为长吏者。调潍县,岁荒,人相食。燮开仓赈贷，或阻之,燮曰：\"此何时？"},{"id":"a112","t":"孟子对滕文公","s":"滕文公问曰：\"滕，小国也，间于齐、楚。事齐乎？事楚乎？\"孟子对曰：\"是谋非吾所能及也。无已③,则有一焉：凿斯池,筑斯城,与民守之,效死而民弗去,则是可为也。\""},{"id":"a113","t":"用法务在宽简","s":"唐太宗谓侍臣曰：\"死者不可再生，用法务在宽简。古人云，棺者欲岁之疫,非疾于人,利于棺售故耳。今法司核理③一狱,必求深刻,欲成其考课。今作何法,得使平允？\"谏议大"},{"id":"a114","t":"鲁哀侯弃国","s":"鲁哀侯弃国而走齐。齐侯曰：\"君何年之少而弃国之蚤?\"鲁哀侯曰：\"臣始为太子之时，人多谏臣，臣受而不用也；人多爱臣，臣爱而不近也。是则内无闻而外无辅也。是犹秋蓬恶"},{"id":"a126","t":"口蜜腹剑","s":"李林甫为相,凡才望功业出已右,及为上所厚而势位逼已者，必百计去之。其人尤忌文学之士。或阳与之善,啖以甘言,而阴陷之。世谓李林甫\"口有蜜,腹有剑\"。"}]},{"w":"者","m":"助词：“……的人（事、物）”","u":[{"id":"a4","t":"天雨谷","s":"汉宣帝时,江淮比年旱,大饥,人相食,死者相望。天雨谷三日。寻魏地③奏,亡谷二千顷,人皆异之。（）"},{"id":"a21","t":"之乎者也","s":"太祖皇帝将展外城,幸朱雀门,亲自规画,独赵韩王普从幸。上指门额问普曰：\"何不祗书朱雀门，须著\"之\"字安用？\"普对曰：\"语助。\"太祖笑曰：\"之乎者也，助得甚事？\""},{"id":"a52","t":"唐太宗纳谏","s":"贞观三年,太宗谓裴寂曰：\"比有上书奏事,条数甚多。朕总黏之屋壁,出人观省。所以孜孜不倦者，欲尽臣下之情。每一思政理,或三更方寝。亦望公辈用心不倦，以副朕怀也。\""},{"id":"a60","t":"张溥与七录斋","s":"张溥幼嗜学,所读书必手抄,抄已,朗诵一过即焚之;又抄,如是者六七始已。左手握管处指掌成茧。冬日手皱，日沃汤数次。后名读书之斋曰\"七录\"。溥诗文敏捷,四方征索者,"},{"id":"a215","t":"外科医生","s":"有医者,自称善外科。一裨将阵回,中流矢,深入膜内,延使治。乃持并州剪剪去矢管,跪而请谢。神将曰\"在膜内者须函治。\"医曰：\"此内科事,不意并责我。\""}]},{"w":"及","m":"等到。","u":[{"id":"a6","t":"穿井得一人","s":"宋之丁氏，家无井，而出溉汲，常一人居外。及其家穿井，告人曰：\"吾穿井得一人。\"有闻而传之者：\"丁氏穿井得一人。\"国人道之，闻之于宋君。宋君令人问之于丁氏。丁氏对"},{"id":"a13","t":"鸟说（阅读）","s":"余读书之室,其旁有桂一株焉。桂之上,日有喧喧然者,即而视之,则二鸟巢其枝干之间,去地不五六尺，人手能及之。巢大如盏,精密完固,细草盘结而成。鸟雌一雄一,小不能盈"},{"id":"a112","t":"孟子对滕文公","s":"滕文公问曰：\"滕，小国也，间于齐、楚。事齐乎？事楚乎？\"孟子对曰：\"是谋非吾所能及也。无已③,则有一焉：凿斯池,筑斯城,与民守之,效死而民弗去,则是可为也。\""},{"id":"a193","t":"东郊祖朝上书晋献公（阅读）","s":"《春秋左氏传》：庄公?十年，齐师伐我。公将战。曹刿请见，其乡人曰：\"肉食者谋之，又何间焉。\"曰\"肉食者，未能远谋。\"乃人见。刘向《说苑》：有东郊祖朝者，上书于晋"},{"id":"a223","t":"赵人养猫（阅读）","s":"赵人患鼠,乞猫于中山。中山人予之猫,善捕鼠及鸡。月余,鼠尽而其鸡亦尽。其子患之，告其父曰：\"益去诸？\"其父曰：\"是非若所知也。吾之患在鼠,不在乎无鸡。夫有鼠，则"}]},{"w":"于","m":"介词：在、到、向、比、被","u":[{"id":"a10","t":"州官放火","s":"田登作郡守,怒人触其名,犯者必答之,举州皆谓灯为火。值上元放灯，吏揭榜于市，曰：\"本州依例放火三日。\"故语云：\"只许州官放火，不许百姓点灯\",本此。"},{"id":"a41","t":"尹绰之爱","s":"赵简子有臣尹绰、赦厥。简子曰：\"厥也爱我,谏我必不于众人中；绰也不爱我，谏我必于众人中。\"尹绰曰：\"厥也爱君之丑而不爱君之过；臣爱君之过而不爱君之丑。\"孔子曰："},{"id":"a58","t":"宋濂勤学不怠","s":"余幼时即嗜学。家贫,无从致书以观,每假于藏书之家,手自笔录,计日以还。天大寒,砚冰坚,手指不可届伸,弗之怠。录毕,走送还之,不敢稍逾约。以是，人多以书假余,余因"},{"id":"a112","t":"孟子对滕文公","s":"滕文公问曰：\"滕，小国也，间于齐、楚。事齐乎？事楚乎？\"孟子对曰：\"是谋非吾所能及也。无已③,则有一焉：凿斯池,筑斯城,与民守之,效死而民弗去,则是可为也。\""},{"id":"a212","t":"文德皇后谏太宗","s":"\"岂过魏徽，每廷争厚我，使我常不自得！\"皇后退而具朝服立于庭。帝惊曰：\"皇后何为若是？\"对曰：\"妾闻主圣臣忠。今醒下圣明，故魏徽得直言。妾幸备数后宫，安敢不贺？"},{"id":"a227","t":"王经忠孝","s":"王经\"少贫苦,仕至二千石。母语之曰：\"汝本寒家子,仕至二千石,此可以（）止！\"经不能用。为尚书③，助魏，不忠于晋，被收。涕泣辞母曰：\"不从母教，以至今日！\"母都"}]},{"w":"而","m":"连词：表并列、承接、转折、修饰","u":[{"id":"a11","t":"嗟来之食","s":"齐大饥,黔敖为食于路，以待饿者而食之。有饿者蒙袂辑履,贸贸然来。黔敖左奉食,左执饮,曰：\"嗟！来食!\"扬其目而视之,曰：\"予唯不食‘嗟来之食\",以至于斯也。\"从"},{"id":"a12","t":"拔杨容易栽杨难","s":"陈贵于魏王。子曰：\"必善事左右。夫杨,横树之即生,倒树之即生，折而树之又生。然使十人树之,而一人拔之,则毋生杨。夫以十人之众,树易生之物,而不胜一人者,何也？树"},{"id":"a16","t":"蛙与牛斗","s":"蛙于草中,视牛渐近,庞然大物也,嫉之。遂吸气鼓腹,欲逾于牛,谓伙曰：\"吾腹稍大，似牛乎？\"伙曰：\"差远矣！\"蛙怒，复吸气鼓腹，曰：\"今如何？\"曰：\"与前无异。蛙"},{"id":"a26","t":"孙叔敖杀两头蛇","s":"孙叔敖为婴儿之时,出游,见两头蛇,杀而埋之,归而泣。其母问其故,叔敖对曰：\"闻见两头之蛇者死。向者吾见之，恐去母而死也。\"其母曰：\"蛇今安在？\"曰：\"恐他人又见"},{"id":"a30","t":"茹太素被杖","s":"茹太素陈时务累万言。太祖令中书郎王敏诵而听之。中言才能之士,数年来幸存者百无一二,今所任率迁儒俗吏,言多触。帝怒,召太素面语,杖于朝。次夕复于宫人令人诵之,得其"},{"id":"a35","t":"戴胄依法断流","s":"有诈伪者事觉,戴胄依法断流。唐太宗曰：\"朕下敕不首者死,今断从流，是示天下以不信。卿欲卖狱乎？\"胃曰：\"陛下当即杀之，非臣所及。既付有司，臣不敢亏法。\"帝曰：\""},{"id":"a38","t":"曾母投杼","s":"费人有与曾子同名族者而杀人。或告曾子母曰：\"曾参杀人。\"曾子之母曰：\"吾子不杀人。\"织自若。有顷焉，人又曰：\"曾参杀人。\"其母尚织自若也。顷之，一人又告之曰：\""},{"id":"a41","t":"尹绰之爱","s":"赵简子有臣尹绰、赦厥。简子曰：\"厥也爱我,谏我必不于众人中；绰也不爱我，谏我必于众人中。\"尹绰曰：\"厥也爱君之丑而不爱君之过；臣爱君之过而不爱君之丑。\"孔子曰："},{"id":"a48","t":"法不赦故人","s":"濮州刺史庞相寿坐贪污解任②，自陈尝在秦王④幕府。上怜之。欲听归任。魏徽谏曰：\"秦王左右甚多,恐人人恃私恩，足使为善者惧。\"上欣然纳之，谓相寿曰：\"我昔为秦王,乃"},{"id":"a50","t":"张良劝刘邦劳军","s":"楚汉久相持未决。丁壮苦军旅,老弱疲转饷。刘邦、项羽相与临广武之间而语。项羽欲与汉王独身挑战。刘邦数项羽。项羽大怒，使伏弩射中刘邦。刘邦伤胸,乃扪足曰：\"虏中吾指"},{"id":"a53","t":"不龟手之药","s":"宋人有善为不龟手之药者,世世以漂洗为业。客闻之,请买其方百金。聚族而谋曰：\"我世世为漂洗，不过数金，今一朝而技百金，请与之。\"客得之，以说吴王。越有难,吴使之将"},{"id":"a59","t":"王桑默记","s":"王粲与人共行，读道边碑，人问曰：\"卿能默诵乎？\"曰：\"能。\"因使背而诵之,不失一字。尝观人围棋,局坏,粲为复之。棋者不信,以帕盖局,更以他局为之，以相比较，仍不"},{"id":"a82","t":"海瑞清廉","s":"都御史刚峰海公,卒于官舍。同乡宦南京者,唯苏民怀一人。苏检点其宦囊，竹箱中俸金八两，葛布一端，旧衣数件而已。如此都御史那可多得！王凤洲评之云：\"不怕死，不爱钱，"},{"id":"a83","t":"解扁劳民","s":"解扁为东封,上计而人三倍,有司请赏之。文侯曰\"吾土地非益广也，人民非益众也,人何以三倍？\"对曰：\"以冬伐木而积之,于春浮之河而之。\"文侯曰：\"民春以力耕，暑以强"},{"id":"a89","t":"范文正正直","s":"范文正公仲淹贫③,依唯阳朱氏家，常与一术者游。会术者病笃，使人呼文正而告曰：\"吾善炼水银为白金，吾儿幼，不足以付，令以付子。\"即以其方与所成白金一斤封志,内文正"},{"id":"a90","t":"东施效颦","s":"西施病心而其里。其里之丑人见而美之,归亦捧心而其里。其里之富人见之,坚闭门而不出；贫人之,挚妻子而去之走。彼知聲美，而不知之所以美。"},{"id":"a99","t":"鲍子难客","s":"齐田氏祖于庭,食客千人。有献鱼、雁者,田氏视之,乃叹曰\"天之于民厚矣！殖五谷,生鱼鸟,以为之用。\"众客和之。有鲍氏之子,年十二,亦在坐,进曰：\"不如君言。天地万"},{"id":"a104","t":"学者之病","s":"古人云：学者之病,最忌自高自狭。自高者如峭壁,时雨过之,须史溜散，不能分润。自狭者如瓮受水,过其量则溢矣。善学者其如海乎,旱九年而不枯,受九州而不满。"},{"id":"a106","t":"长善而救失","s":"学者有四失,教者必知之。人之学也,或失则多,或失则寡,或失则易,或失则止。此四者，心之莫同也。知其心,然后能救其失也。教也者,长善而救其失者也。"},{"id":"a107","t":"黠狼","s":"有车夫载重登坡，方竭力时，一狼来啮其臀。欲释手，则货蔽压身，故忍痛推之。既止，则狼已片肉而去。乘其无能为力而窃一窝?，狼亦點矣。"},{"id":"a112","t":"孟子对滕文公","s":"滕文公问曰：\"滕，小国也，间于齐、楚。事齐乎？事楚乎？\"孟子对曰：\"是谋非吾所能及也。无已③,则有一焉：凿斯池,筑斯城,与民守之,效死而民弗去,则是可为也。\""},{"id":"a123","t":"越人溺鼠","s":"鼠好夜窃粟。越人置粟于盎,恣鼠啮不顾。鼠呼群类入焉,必而后反。越人乃易粟以水，浮糠覆水上，而鼠不知也，逮夜复呼群次第入，咸溺死。"},{"id":"a126","t":"口蜜腹剑","s":"李林甫为相,凡才望功业出已右,及为上所厚而势位逼已者，必百计去之。其人尤忌文学之士。或阳与之善,啖以甘言,而阴陷之。世谓李林甫\"口有蜜,腹有剑\"。"},{"id":"a129","t":"楚王猎于云梦","s":"楚王猎于云梦,使虞人驱禽兽而射之。禽飞,鹿出于王右,麋逸于王之左。王欲引弓射之,又有鹄掠过。王驻矢于弓,不知何射也。养由基进曰：\"臣之射也,置一叶于百步之外，十"},{"id":"a135","t":"李广射虎","s":"李广出猎,见草中石,以为虎而射之,中石没,视之,乃石也。因更射之,终不能复入石。广所居郡闻有虎，尝自射之。及居右北平射虎，虎腾伤广，广亦竟射杀之。"},{"id":"a136","t":"李广脱险","s":"李广出雁门击匈奴。匈奴兵多,破败广军,生得广。单于素闻广贤，令曰：\"得李广必生致之。\"胡骑得广，时广伤病，置广两马间，络而盛卧广。行十余里，广伴死,皖其旁有一胡"},{"id":"a149","t":"中山窃糟","s":"昔者鲁人不能为酒,唯中山之人善酿千日之酒。鲁人求其方弗得。有仕于中山者,主酒家。取其糟归,以鲁酒渍之。谓人曰：\"中山之酒也。\"鲁人饮之,皆以为中山之酒也。一日,"},{"id":"a153","t":"王孙贾诛淖齿","s":"王孙贾年十五,事齐闵王。王出走,失王之处。其母曰：\"女朝出而晚来，则吾倚门而望；女暮出而不远，则吾倚间而望。女今事王，王出走，女不知其处，女尚何归？\"王孙贾乃人"},{"id":"a156","t":"牧童指瑕","s":"蜀有杜某者,好书画,所宝以百数。有戴嵩斗牛图一轴,尤爱,常以身随。一日曝书画，有牧童见之，抚掌大笑曰：\"此画斗牛也。牛斗力在角，尾夹人两股间。今乃掉尾而斗，谬也"},{"id":"a161","t":"楚人烹猴","s":"楚人有烹猴而召其邻人，以为狗葵而甘之。后闻其猴也，据地而吐之,尽泻其食。此未始知味者也。邯郸师有出新曲者,托之李奇。诸人皆争学之。后知其非也,而皆弃其曲。此未始"},{"id":"a178","t":"曾参全节","s":"曾子衣衣而耕,鲁君使人往致邑焉。曰：\"请以此饰衣。\"曾子不受,使者反，复往，辞不受。使者曰：\"先生非求于人，乃君赐之,奚为不受？\"曾子曰：\"臣闻之：‘受人者畏人"},{"id":"a183","t":"涓蜀梁之死","s":"夏首之南,有人為,日涓蜀梁。其为人也，愚而善畏。明月而宵行,俯见其影,以为伏鬼也；仰视其发，以为立魅也；背而走，比至其家,气绝而亡。岂不哀哉！"},{"id":"a185","t":"周厉王止谤","s":"厉王虐,国人谤王。召公告曰：\"民不堪王命矣！\"王怒,得卫巫,使监谤者，以告，则杀之。国人莫敢言，道路以目。王喜，告召公曰：\"吾能止谤矣，民不敢言。\"召公曰\"是障"},{"id":"a188","t":"更人立誓","s":"一吏坐赃致罪,遇赦获免。因立誓若复接人钱财,手当生恶疮。既而，有一人讼者，馈钞求胜。吏念立誓之故，难以手接。顷之，曰：\"若如此殷勤，权放在予靴筒里。或曰：\"此吏"},{"id":"a190","t":"指鹿为马","s":"秦末,赵高欲作乱,恐群臣不从,乃先设验,持鹿献于二世③,曰：\"马也。\"（）二世笑曰：\"丞相误邪？此为鹿而非马也。\"赵高问左右，或言马，以阿赵高；或言鹿者，高惩之"},{"id":"a194","t":"治国与治身","s":"告子谓墨子曰：\"我能治国为政。\"墨子曰：\"政者，口言之,身必行之。今子口言之而身不行，是子之身乱也。子不能治身，為能治国政？\""},{"id":"a195","t":"治国之本","s":"坚召见高泰,说之,问以治国之本。对曰\"治本在得人,得人在审举,审举在核真。未有官得其人而国家不治者也。\"坚曰：\"善！是言可谓辞简而理博矣。\""},{"id":"a202","t":"古鉴与砚","s":"有朝士家藏古鉴，自言能照二百里。将以献吕蒙正。吕曰：\"我面不及碟子大,安用二百里之鉴乎？\"不用。又，孙之翰，人与一砚,直三十千③，云：\"此石呵之则水流。\"翰曰："},{"id":"a208","t":"宝石","s":"云南之产宝石。山高，人不能径至，而猿居遍山，往来如织。人习弩，以丸弹猿。猿患,群拾石掷人。人往来避之。又弹,以触其怒,猿又掷石。石大小不一。人拾归,捐其顽者，而"},{"id":"a212","t":"文德皇后谏太宗","s":"\"岂过魏徽，每廷争厚我，使我常不自得！\"皇后退而具朝服立于庭。帝惊曰：\"皇后何为若是？\"对曰：\"妾闻主圣臣忠。今醒下圣明，故魏徽得直言。妾幸备数后宫，安敢不贺？"},{"id":"a213","t":"张仪受辱","s":"张仪已学而游说诸侯。尝从楚相饮，已而楚相亡璧。门下意张仪，日；\"仪贫无行③,必此盗相君之璧。\"共执张仪,掠答数百，不服,释之。其妻曰：\"嘻！子毋读书游说，安得此"},{"id":"a215","t":"外科医生","s":"有医者,自称善外科。一裨将阵回,中流矢,深入膜内,延使治。乃持并州剪剪去矢管,跪而请谢。神将曰\"在膜内者须函治。\"医曰：\"此内科事,不意并责我。\""}]},{"w":"以","m":"介词（用、拿、凭、因为）或连词。","u":[{"id":"a12","t":"拔杨容易栽杨难","s":"陈贵于魏王。子曰：\"必善事左右。夫杨,横树之即生,倒树之即生，折而树之又生。然使十人树之,而一人拔之,则毋生杨。夫以十人之众,树易生之物,而不胜一人者,何也？树"},{"id":"a20","t":"韩信钻裤裆","s":"韩信者,汉之名将也。少时,好带刀剑。一日,出淮阴屠中,值无赖故辱之，曰：\"若虽长大,好带刀剑,中情怯耳。\"又众辱之曰：\"信敢死,刺我;不敢死,则出过下！\"信熟视"},{"id":"a50","t":"张良劝刘邦劳军","s":"楚汉久相持未决。丁壮苦军旅,老弱疲转饷。刘邦、项羽相与临广武之间而语。项羽欲与汉王独身挑战。刘邦数项羽。项羽大怒，使伏弩射中刘邦。刘邦伤胸,乃扪足曰：\"虏中吾指"},{"id":"a52","t":"唐太宗纳谏","s":"贞观三年,太宗谓裴寂曰：\"比有上书奏事,条数甚多。朕总黏之屋壁,出人观省。所以孜孜不倦者，欲尽臣下之情。每一思政理,或三更方寝。亦望公辈用心不倦，以副朕怀也。\""},{"id":"a58","t":"宋濂勤学不怠","s":"余幼时即嗜学。家贫,无从致书以观,每假于藏书之家,手自笔录,计日以还。天大寒,砚冰坚,手指不可届伸,弗之怠。录毕,走送还之,不敢稍逾约。以是，人多以书假余,余因"},{"id":"a60","t":"张溥与七录斋","s":"张溥幼嗜学,所读书必手抄,抄已,朗诵一过即焚之;又抄,如是者六七始已。左手握管处指掌成茧。冬日手皱，日沃汤数次。后名读书之斋曰\"七录\"。溥诗文敏捷,四方征索者,"},{"id":"a87","t":"宋濂实对","s":"宋濂尝与客饮，帝密使人侦视。翌日，问濂昨饮酒否？坐客为谁？何物？濂具以实对。笑曰：\"诚然，卿不朕欺。\"间召问群臣臧否。唯举其善者对，曰：\"善者与臣友,其不善者不"},{"id":"a99","t":"鲍子难客","s":"齐田氏祖于庭,食客千人。有献鱼、雁者,田氏视之,乃叹曰\"天之于民厚矣！殖五谷,生鱼鸟,以为之用。\"众客和之。有鲍氏之子,年十二,亦在坐,进曰：\"不如君言。天地万"},{"id":"a123","t":"越人溺鼠","s":"鼠好夜窃粟。越人置粟于盎,恣鼠啮不顾。鼠呼群类入焉,必而后反。越人乃易粟以水，浮糠覆水上，而鼠不知也，逮夜复呼群次第入，咸溺死。"},{"id":"a132","t":"刘备托孤","s":"章武三年春,先主于永安病笃,召亮于成都,属以后事,谓亮曰\"君才十倍曹丕,必能安国,终定大事。若嗣子可辅,辅之;如其不才,君可自取\"亮涕泣曰：\"臣敢竭股肱之力,效"},{"id":"a146","t":"僧荐重元寺阁","s":"苏州重元寺阁一角忽陷,计其扶荐之功,当用钱数千贯③。有游僧曰：\"不足劳人。请一夫所木为楔,可以正也。\"寺主从之。僧每食,持楔数十,执柯登阁，敲其间。未逾月，阁柱"},{"id":"a156","t":"牧童指瑕","s":"蜀有杜某者,好书画,所宝以百数。有戴嵩斗牛图一轴,尤爱,常以身随。一日曝书画，有牧童见之，抚掌大笑曰：\"此画斗牛也。牛斗力在角，尾夹人两股间。今乃掉尾而斗，谬也"},{"id":"a165","t":"郑武公伐胡","s":"昔者郑武公欲伐胡，故先以其女妻胡君，以娱其意。因问于群臣：\"吾欲\"，，国也。子言可伐，何也？\"胡君闻之,以郑为亲已,遂不备郑。郑人袭胡,取之。"},{"id":"a173","t":"王安期不鞭书生","s":"王安期为东海郡守,世乱,敕曰：\"夜不得私行。\"吏收得一宵行人。王问：\"自师家受业还,未之知也。\"吏曰：\"鞭乎？\"王曰：\"鞭挞书生以立威名，恐非致治之本。\"释之,"},{"id":"a179","t":"丁谓巧送书信","s":"丁谓既窜崖州，其家属寓洛阳。尝作家书，遣使致洛守刘烨，祈转付家。戒使者曰：\"伺烨会僚众时呈达。\"烨得书，遂不敢隐，即以闻。帝启视，则语多自"},{"id":"a185","t":"周厉王止谤","s":"厉王虐,国人谤王。召公告曰：\"民不堪王命矣！\"王怒,得卫巫,使监谤者，以告，则杀之。国人莫敢言，道路以目。王喜，告召公曰：\"吾能止谤矣，民不敢言。\"召公曰\"是障"},{"id":"a190","t":"指鹿为马","s":"秦末,赵高欲作乱,恐群臣不从,乃先设验,持鹿献于二世③,曰：\"马也。\"（）二世笑曰：\"丞相误邪？此为鹿而非马也。\"赵高问左右，或言马，以阿赵高；或言鹿者，高惩之"},{"id":"a202","t":"古鉴与砚","s":"有朝士家藏古鉴，自言能照二百里。将以献吕蒙正。吕曰：\"我面不及碟子大,安用二百里之鉴乎？\"不用。又，孙之翰，人与一砚,直三十千③，云：\"此石呵之则水流。\"翰曰："},{"id":"a204","t":"田父得玉","s":"田父耕于野,得玉径尺,以告邻人。邻人阴欲图之,诈之曰：\"此怪石也，畜之弗利汝家,弗如复之。\"田父虽疑,犹录以归,置于房下。其夜玉明,光照一室。田父举家大怖,复以"},{"id":"a227","t":"王经忠孝","s":"王经\"少贫苦,仕至二千石。母语之曰：\"汝本寒家子,仕至二千石,此可以（）止！\"经不能用。为尚书③，助魏，不忠于晋，被收。涕泣辞母曰：\"不从母教，以至今日！\"母都"}]},{"w":"乃","m":"就是。","u":[{"id":"a19","t":"多多益善（阅读）","s":"上尝从容与信言诸将能不,各有差。上问曰：\"如我，能将几何？\"信\"多多益善，何为为我禽？\"信曰：\"陛下不能将兵，而善将将，此乃信之所以为陛下禽也。\""},{"id":"a92","t":"唐太宗论\"甲兵\"","s":"房玄龄奏\"阅府库甲兵，远胜隋世。\"上曰：\"甲兵武备，诚不可缺，然炀帝甲兵岂不足邪,卒亡天下。若公等尽力,使百姓义安,此乃朕之甲兵也。\""},{"id":"a97","t":"陈元方答客（阅读）","s":"陈太丘与友期行,期日中，过中不至，太丘舍去。去后乃至。元方时年七岁，门外戏。客问元方：\"尊君在不？\"答曰：\"待君久不至，已去。\"友人便怒曰：\"非人哉，与人期行相"},{"id":"a215","t":"外科医生","s":"有医者,自称善外科。一裨将阵回,中流矢,深入膜内,延使治。乃持并州剪剪去矢管,跪而请谢。神将曰\"在膜内者须函治。\"医曰：\"此内科事,不意并责我。\""}]},{"w":"也","m":"语气词：表判断、肯定或停顿","u":[{"id":"a21","t":"之乎者也","s":"太祖皇帝将展外城,幸朱雀门,亲自规画,独赵韩王普从幸。上指门额问普曰：\"何不祗书朱雀门，须著\"之\"字安用？\"普对曰：\"语助。\"太祖笑曰：\"之乎者也，助得甚事？\""},{"id":"a92","t":"唐太宗论\"甲兵\"","s":"房玄龄奏\"阅府库甲兵，远胜隋世。\"上曰：\"甲兵武备，诚不可缺，然炀帝甲兵岂不足邪,卒亡天下。若公等尽力,使百姓义安,此乃朕之甲兵也。\""}]},{"w":"哉","m":"语气词，表反问。","u":[{"id":"a23","t":"书生慕名失实","s":"有书生以囊萤闻于里。里人高其义,晨谐之。家人谢他往。里人异之,必其囊萤者,令书生白日下惟,敦谐之哉？"}]},{"w":"与","m":"跟随。","u":[{"id":"a37","t":"三人成虎（阅读）","s":"庞恭与太子质于邯郸，谓魏王曰\"今一人言市有虎，王信之乎？\"曰：\"不\"寡人信之。\"庞恭曰：\"夫市之无虎也明矣，然而三人言而成虎。今邯郸之去魏也远于市,议臣者过于三"},{"id":"a109","t":"何易于挽纤（阅读）","s":"何易于,不详何所人及何所以进。为益昌③令。县距州四十里,刺史崔朴常乘春与宾属泛舟出益昌旁,索民挽纤。易于身引舟。朴惊问状。易于曰：\"方春,百姓耕且蚕，惟令不事,"},{"id":"a131","t":"李离自刑","s":"李离者,晋文公之理也,因过听杀人。李离悔,自拘求死。文公曰：\"官有贵贱,罚有轻重,下吏有过,非子之罪也。李离曰：\"臣居官为长,不与吏让位;受禄最多,不与下分利。"}]},{"w":"则","m":"相当于\"在于\"。","u":[{"id":"a106","t":"长善而救失","s":"学者有四失,教者必知之。人之学也,或失则多,或失则寡,或失则易,或失则止。此四者，心之莫同也。知其心,然后能救其失也。教也者,长善而救其失者也。"}]},{"w":"为","m":"介词“替、给、被”或动词“做、是”","u":[{"id":"a110","t":"郑板桥爱民","s":"郑燮号板桥,乾隆\"元年进士②。知范县,爱民如子。绝苞苴,案无留牍。公余辑与文士筋咏诗,有忘其为长吏者。调潍县,岁荒,人相食。燮开仓赈贷，或阻之,燮曰：\"此何时？"},{"id":"a131","t":"李离自刑","s":"李离者,晋文公之理也,因过听杀人。李离悔,自拘求死。文公曰：\"官有贵贱,罚有轻重,下吏有过,非子之罪也。李离曰：\"臣居官为长,不与吏让位;受禄最多,不与下分利。"},{"id":"a194","t":"治国与治身","s":"告子谓墨子曰：\"我能治国为政。\"墨子曰：\"政者，口言之,身必行之。今子口言之而身不行，是子之身乱也。子不能治身，為能治国政？\""},{"id":"a216","t":"郭舍人救乳母","s":"汉武帝乳母恃恩，家人纵横。帝怒，诏乳母流于边，人辞帝。郭舍人谓曰：\"母今出时，但屡顾我，我当救母不行。\"母从其言，乃顾舍人。舍人骂曰：\"回顾，何为？帝壮矣，岂假"}]}],"units":[{"name":"第 一 单 元","items":[{"id":"a1","t":"· 华佗治病（阅读）"},{"id":"a2","t":"· 华佗巧治"},{"id":"a3","t":"· 解缙敏对"},{"id":"a4","t":"· 天雨谷"},{"id":"a5","t":"· 鸡"},{"id":"a6","t":"· 穿井得一人"}]},{"name":"第 二 单 元","items":[{"id":"a7","t":"· 汉世老人（阅读）"},{"id":"a8","t":"· 酒徒遇蔷鬼"},{"id":"a9","t":"· 一叶障目"},{"id":"a10","t":"· 州官放火"},{"id":"a11","t":"· 嗟来之食"},{"id":"a12","t":"· 拔杨容易栽杨难"}]},{"name":"第 三 单 元","items":[{"id":"a13","t":"· 鸟说（阅读）"},{"id":"a14","t":"· 雁"},{"id":"a15","t":"· 绳技奇观"},{"id":"a16","t":"· 蛙与牛斗"},{"id":"a17","t":"· 逼供生冤"},{"id":"a18","t":"· 巴延三毁\"驴香馆\""}]},{"name":"第 四 单 元","items":[{"id":"a19","t":"· 多多益善（阅读）"},{"id":"a20","t":"· 韩信钻裤裆"},{"id":"a21","t":"· 之乎者也"},{"id":"a22","t":"· 杞人忧天"},{"id":"a23","t":"· 书生慕名失实"},{"id":"a24","t":"· 王长年智斗倭寇"}]},{"name":"第 五 单 元","items":[{"id":"a25","t":"· 孙叔敖为楚相（阅读）"},{"id":"a26","t":"· 孙叔敖杀两头蛇"},{"id":"a27","t":"· 李勉埋金"},{"id":"a28","t":"· 季女饮药"},{"id":"a29","t":"· 李泰伯改字"},{"id":"a30","t":"· 茹太素被杖"}]},{"name":"第 六 单 元","items":[{"id":"a31","t":"· 孔子与弟子言志（阅读）"},{"id":"a32","t":"· 刘敏中之志"},{"id":"a33","t":"· 颜真卿大义凛然"},{"id":"a34","t":"· 人有四方之志"},{"id":"a35","t":"· 戴胄依法断流"},{"id":"a36","t":"· 性"}]},{"name":"第 七 单 元","items":[{"id":"a37","t":"· 三人成虎（阅读）"},{"id":"a38","t":"· 曾母投杼"},{"id":"a39","t":"· 卖柴翁殴宦者"},{"id":"a40","t":"· 螳螂捕蝉"},{"id":"a41","t":"· 尹绰之爱"},{"id":"a42","t":"· 楚之南有猎者"}]},{"name":"第 八 单 元","items":[{"id":"a43","t":"· 姚坦直言\"血山\"（阅读）"},{"id":"a44","t":"· 王安国直言"},{"id":"a45","t":"· 陈章侯拒视显贵"},{"id":"a46","t":"· 王翱秉公"},{"id":"a47","t":"· 次非斩蛟"},{"id":"a48","t":"· 法不赦故人"}]},{"name":"第 九 单 元","items":[{"id":"a49","t":"· 圯上老人（阅读）"},{"id":"a50","t":"· 张良劝刘邦劳军"},{"id":"a51","t":"· 欧阳修家教"},{"id":"a52","t":"· 唐太宗纳 <script>
(function(){
'use strict';
var B = window.BOOKS;
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ var d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; };

/* 统计 */
var st = $('#stats'), tot = {a:0, lex:0, key:0, q:0};
B.forEach(function(b){
  tot.a += b.stat.articles; tot.lex += b.stat.lex; tot.key += b.stat.key; tot.q += b.stat.q;
  st.insertAdjacentHTML('beforeend',
    '<div class="stat"><b>'+b.stat.articles+' 篇</b>'+esc(b.short)+' · '+b.stat.units+' 单元</div>');
});
st.insertAdjacentHTML('beforeend',
  '<div class="stat"><b>'+tot.lex+'</b>注释词条</div>'+
  '<div class="stat"><b>'+tot.key+'</b>【重点】词</div>'+
  '<div class="stat"><b>'+tot.q+'</b>训练题</div>');

/* 跨册检索 */
var q = $('#q'), res = $('#qres'), qhit = $('#qhit');
function search(){
  var v = q.value.trim();
  res.innerHTML = ''; qhit.textContent = '';
  if (!v) return;
  var hits = [];
  B.forEach(function(b){
    b.arts.forEach(function(a){
      var inT = a.t.indexOf(v) >= 0, i = a.x.indexOf(v);
      if (inT || i >= 0){
        var snip = i >= 0 ? esc(a.x.slice(Math.max(0, i-24), i)) + '<mark>' + esc(v) + '</mark>' +
          esc(a.x.slice(i + v.length, i + v.length + 40)) : esc(a.x.slice(0, 60));
        hits.push({b:b, a:a, snip:snip, inT:inT});
      }
    });
  });
  qhit.textContent = '命中 ' + hits.length + ' 篇' + (hits.length > 200 ? '（仅显示前 200）' : '');
  hits.slice(0, 200).forEach(function(h){
    res.insertAdjacentHTML('beforeend',
      '<div class="hit"><a href="' + h.b.file + '#' + h.a.id + '">《' + esc(h.b.short) + '》 ' + esc(h.a.t) + '</a>' +
      '<div class="meta">' + esc(h.b.name) + ' · ' + esc(h.a.u) + (h.inT ? ' · 篇名命中' : '') + '</div>' +
      '<div class="snip">…' + h.snip + '…</div></div>');
  });
}
var tm = null;
q.addEventListener('input', function(){ clearTimeout(tm); tm = setTimeout(search, 160); });
q.addEventListener('keydown', function(e){
  if (e.key === 'Enter'){
    if (!res.firstChild) search();
    var a = res.querySelector('a');
    if (a) location.href = a.getAttribute('href');
  }
});

/* 虚词索引 */
var xw = $('#xw'), xwres = $('#xwres');
var words = [];
B.forEach(function(b){ b.lex.forEach(function(w){ if (words.indexOf(w.w) < 0) words.push(w.w); }); });
words.forEach(function(w){
  var btn = document.createElement('button');
  btn.type = 'button'; btn.textContent = w;
  btn.addEventListener('click', function(){
    Array.prototype.forEach.call(xw.children, function(c){ c.classList.remove('on'); });
    btn.classList.add('on');
    showWord(w);
  });
  xw.appendChild(btn);
});
function showWord(w){
  var rows = [];
  B.forEach(function(b){
    b.lex.forEach(function(e){
      if (e.w !== w) return;
      e.u.forEach(function(u){
        rows.push('<tr><td class="unit">' + esc(b.short) + '</td>' +
          '<td><a href="' + b.file + '#' + u.id + '">' + esc(u.t) + '</a></td>' +
          '<td>' + esc(u.s) + '</td><td>' + esc(e.m) + '</td></tr>');
      });
    });
  });
  xwres.innerHTML = '<table><tr><th>册</th><th>篇目</th><th>例句</th><th>释义</th></tr>' + rows.join('') + '</table>';
}

/* 目录 */
var tabs = $('#booktabs'), toc = $('#toc');
B.forEach(function(b, i){
  var btn = document.createElement('button');
  btn.type = 'button'; btn.textContent = b.name;
  btn.addEventListener('click', function(){
    Array.prototype.forEach.call(tabs.children, function(c){ c.classList.remove('on'); });
    btn.classList.add('on'); showToc(i);
  });
  tabs.appendChild(btn);
  if (i === 0) btn.classList.add('on');
});
function showToc(i){
  var b = B[i], h = '';
  b.units.forEach(function(u){
    h += '<h3>' + esc(u.name) + '</h3>';
    u.items.forEach(function(it){
      h += '<a href="' + b.file + '#' + it.id + '">' + esc(it.t) + '</a>';
    });
  });
  toc.innerHTML = h;
}
showToc(0);
})();
</script>
