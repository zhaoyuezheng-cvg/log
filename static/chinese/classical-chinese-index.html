:"字期清爽（阅读）","u":"第 二 单 元","x":"有医人工于草书者，医案，人或不识，所系尚无轻重；至于药名，则药铺中人岂能尽识草书乎？孟浪者约略撮之而贻误，小心者往返询问而羁延，可否相约同人，凡书方案，字期清爽，药期共晓。"},{"id":"a8","t":"张丞相好草书","u":"第 二 单 元","x":"张丞相好草书而不工，时人皆笑之，丞相自若也。一日得句，索笔疾书，满纸龙蛇飞动，使侄录之。当波险处，侄罔然而止。执所书问曰：\"此何字也？\"丞相熟视久之，亦不自识，诟其侄曰：\"胡不早问，致余忘之。\""},{"id":"a9","t":"宋太宗学书","u":"第 二 单 元","x":"太宗朝有王著者学右军书，深得其法，侍书翰林。帝听政之余，留心书法，数遣内侍持书示著，著每以为未善，太宗遂刻意临学。又以问著，对如初。或询其意，著曰：\"书固佳矣，若遽称善，恐帝不复用意矣。\"其后，帝笔法精绝，超越前古，世以为由著之规益也。"},{"id":"a10","t":"农夫杀牛","u":"第 二 单 元","x":"华州村，往岁有耕田者，日晡疲甚，乃枕犁而卧。虎自林间出，眈眈相向，欲食之。屡前，牛跨立耕者之上，左右以角抵虎，虎不得近，垂涎至地而去。其人则熟寝，未之知也。虎行已远，耕者觉，见牛跨立其上，恶之，以为妖，因杖牛。牛不能言而奔，逐之，愈觉其怪。归而杀之，解其体，食其肉，而不悔。"},{"id":"a11","t":"欧阳修不喜释氏","u":"第 二 单 元","x":"欧阳文忠公不喜释氏。士有谈佛事者，必正色视之，而公之幼子字\"和尚\"。或问：\"公既不喜佛，而以和尚名子何也？\"公曰：\"所以贱之也，如今人以牛驴名小儿耳。\"问者大笑，且伏公之辨也。"},{"id":"a12","t":"义犬报火警","u":"第 二 单 元","x":"城之东，民家畜一犬，甚羸。一夕，邻火卒发，延及民家。民正熟寝，犬连吠不觉。起曳其被，寝犹如故。复踞床以口附民耳大嗥，民始惊。视烟已满室，急呼妻子出，室尽焚矣。民遂谓所亲曰：\"吾家贫，犬食恒不饱，不谓今日能免我四人于难也。彼日厚享其人之食而不顾其患难者，其视犬为何如耶？\""},{"id":"a13","t":"陶侃惜分阴（阅读）","u":"第 三 单 元","x":"陶侃在广州，无事，朝运百甓②于斋外，暮运于斋内。人问其故，答曰：\"吾方致力中原，过尔优逸，恐不堪事，故自劳耳。\"…常语人云：\"大禹圣人，乃惜寸阴，至于众人，当惜分阴。岂可但逸游荒醉，生无益于时，死无闻于后，是自弃也!\""},{"id":"a14","t":"木屑竹头","u":"第 三 单 元","x":"尝造船，其木屑竹头，侃皆令籍而掌之。人咸不解所以。后正会，积雪始晴，厅事前余雪犹湿，乃以木屑布地。及桓温伐蜀，又以侃所贮竹头作钉装船。"},{"id":"a15","t":"董遇论\"三余\"","u":"第 三 单 元","x":"人有从学者，遇不肯教，云：\"必当先读百遍。\"言\"读书百遍，其义自见。\"从学者云：\"苦于无日。\"遇言：\"当以‘三余’。\"或问\"三余\"之意。遇言：\"冬者岁之余，夜者日之余，阴雨者时之余也。\""},{"id":"a16","t":"桓荣勤学不倦","u":"第 三 单 元","x":"桓荣初值仓卒，与族人桓元卿同饥厄，而荣诵读不辍，元卿哂之曰：\"但自苦尔，何时得施用乎？\"荣笑而不应。及荣为太常③,元卿恨曰：\"我农家子，岂意学之有利若是哉！\""},{"id":"a17","t":"晋平公游于河","u":"第 三 单 元","x":"晋平公游于河而乐曰：\"安得贤士与之乐此也？\"船人盍（hé）胥跪而对曰：\"主君亦不好士耳。夫珠出于江海，玉出于昆山，无足而至者犹主君之好也；士有足而不至者，盖主君无好士之意耳，无患乎无士也。\""},{"id":"a18","t":"黄公好谦卑","u":"第 三 单 元","x":"齐有黄公者，好谦卑。有二女，皆国色。以其美也，常谦辞毁之，以为丑恶。丑恶之名远布。年过而一国无聘者。卫有鳏夫，失时，冒娶之，果国色。然后曰：\"黄公好谦，故毁其子，谓不美。\"于是争相聘之，亦国色也。国色，实也；丑恶，名也。名实相违也。"},{"id":"a19","t":"蓄蝎为戏（阅读）","u":"第 四 单 元","x":"管子客商丘，见逆旅童子有蓄蝎为戏者。问其术，曰：\"吾捕得，去其尾，故彼莫予毒，而供吾玩弄耳。\"索观之，其器中蓄蝎十数，皆甚驯。投以食则竞集;撩之以指，骇然纷起窜。观其态，若甚畏人然。于是童子大乐，笑呼持去。客谓管子曰：\"得是术也，可以御恶人矣。\""},{"id":"a20","t":"人有亡鈇者","u":"第 四 单 元","x":"人有亡鈇者，意其邻之子：视其行步，窃鈇也；颜色，窃鈇也；言语，窃鈇也；动作态度无为而不窃鈇也。俄而掘其谷而得其铁，他日复见邻人之子，动作态度无似窃鈇者。"},{"id":"a21","t":"与狐谋皮","u":"第 四 单 元","x":"周人有爱裘而好珍羞，欲为千金之裘而与狐谋其皮；欲具少牢③之珍而与羊谋其羞。言未卒，狐相率逃于重丘之下，羊相呼藏于深林之中。故周人十年不制一裘，五年不具一牢。何者？周人之谋失之矣!"},{"id":"a22","t":"蝉与鸲鹆","u":"第 四 单 元","x":"鸲鹆之鸟，出于南方。南人罗而调其舌③,久之，能效人言。但能效数声而止，终日所唱，唯数声也。蝉鸣于庭，鸟闻而笑之。蝉谓之曰：\"子能人言，甚善。然子所言者，未尝言也，曷若我自鸣其意哉！\"鸟俯首而惭，终身不复效人言。"},{"id":"a23","t":"朝三暮四","u":"第 四 单 元","x":"宋有狙公者，爱狙，养之成群，能解狙之意，狙亦得公之心。损其家口②,充狙之欲。俄而匮焉，将限其食，恐众狙之不驯于己也，先诳之曰：\"与若芧，朝三而暮四，足乎？\"众狙皆起而怒。俄而曰：\"与若芧，朝四而暮三，足乎？\"众狙皆伏而喜。"},{"id":"a24","t":"钱货入瓶","u":"第 四 单 元","x":"唐扬州有丐者，曰胡媚儿。丐有一瓶，与人言：\"若钱施满此瓶，则永世福矣！\"观者见瓶但容半升，故有施十钱、百钱者，然瓶未见满，人怪之。一富人过，施千钱，仍未见满。有好事者牵一驴，曰：\"施驴。\"丐颔之，驴随变之如细绳而入瓶，一市人皆惊。其时有货车过，货主闻之戏言：\"能令诸货车入瓶否？\"曰：\"可。\"丐微侧瓶口，货车一一入瓶。货主大骇，欲摔④丐，而丐已潜入瓶。货主击碎其瓶，一无所有。"},{"id":"a25","t":"祖逖闻鸡起舞（阅读）","u":"第 五 单 元","x":"范阳祖逖，少有大志，与刘琨俱为司州主簿。同寝，中夜闻鸡鸣，蹴琨觉，曰：\"此非恶声也！\"因起舞。……逖将其部曲百余家渡江，中流击楫而誓曰：\"祖逖不能清中原而复济者，有如大江！\"遂屯淮阴，起冶铸兵，募得二千余人而后进。"},{"id":"a26","t":"宗悫愿乘风破浪","u":"第 五 单 元","x":"宗悫字元幹，南阳涅阳人也。叔父炳，高尚不仕。年少时，炳问其志，悫曰：\"愿乘长风破万里浪。\"兄泌（bi)娶妻，始入门，夜被劫。悫年十四，挺身拒贼，贼十余人皆披散③，不得人室。时天下无事，士人并以文艺为业。炳素高节，诸子群从皆好学，而悫独任气好武，故不为乡里所称。"},{"id":"a27","t":"班超投笔从戎","u":"第 五 单 元","x":"班超家贫，常为官佣书以供养。久劳苦，尝辍业投笔叹曰：\"大丈夫无他志略，犹当效傅介子、张骞立功异域，以取封侯，安能久事笔砚间乎？\"左右皆笑之。超曰：\"小子安知壮士之志哉！\"后超出使西域，竟立功封侯。"},{"id":"a28","t":"二翁登泰山","u":"第 五 单 元","x":"昔有二翁，同里而居。甲翁之妻子去乡，唯叟一人而已。一日，叟携酒至乙翁第，二人对酌，不亦乐乎！乙翁曰：\"向吾远游冀、雍，然未尝登泰山，君有意同行乎？\"甲翁曰：\"是山余亦未登，然老矣，恐力不胜。\"乙翁曰：\"差矣，汝之言！二翁偕往，越钱塘，绝②长江，而至泰阴。夜宿，凌晨上山。乙翁欲扶之，甲翁曰：\"吾力尚可，无需相扶。\"自日出至薄暮，已至半山矣。"},{"id":"a29","t":"虎之力","u":"第 五 单 元","x":"虎之力，于人不畜倍也。虎利其爪牙，而人无之，又倍其力為，则人之食于虎也，无怪矣。然虎之食人不恒见，而虎之皮人常寝处之，何哉？虎用力，人用智;虎自用其爪牙，而人用物③。故力之用一，而智之用百，爪牙之用各一，而物之用百，以一敌百，虽猛必不胜。故人之为虎食者，有智与物而不能用者也。是故天下之用力而不用智，与自用而不用人者，皆虎之类也，其为人获而寝处其皮也，何足怪哉！"},{"id":"a30","t":"不与少年贷资","u":"第 五 单 元","x":"富翁某，商贾多贷其资。一日出，有少年从马后。问之，亦假本者。翁诺之。至家，适几上有钱数十，少年即以手叠钱，高下自如。翁谢去，竟不与贷资。或诘其故，翁曰：\"此人必善博，非端人也。所熟之技，不觉形于手矣。\"访①之果然。"},{"id":"a31","t":"李廙有清德（阅读）","u":"第 六 单 元","x":"李廙为尚书左丞，有清德。其妹，刘晏妻也。晏方秉权，尝造廙宅。延至晏室。见其门帘甚弊，乃令潜度广狭，以粗竹织成，不加缘饰，将以赠廙。三携至门，不敢发言而去。"},{"id":"a32","t":"胡质父子","u":"第 六 单 元","x":"威，字伯虎，少有志尚，厉操清白。质之为荆州也，威自京都省之。家贫，无车马僮仆，威自驱驴单行。拜见父，停厩中十余日，告归。临辞，质赐其绢一匹，为道路粮。威跪问：\"大人清白，不审于何得此绢？\"质曰：\"是吾俸禄之余，故以为汝粮耳。\"威受之，辞归。"},{"id":"a33","t":"铜臭","u":"第 六 单 元","x":"有仕人退朝，诣其友人，见衣褐道人在坐，不怿而去。他日谓友人曰：\"公好衣褐之夫，何也？吾不知其贤愚，且觉其臭。\"友人应曰：\"褐之臭，外也，岂其铜臭？铜臭之臭，并肩而立，接迹而趋。公处其间，曾不嫌耻，反讥余与山野有道之士游？高尚之人以蛙鸣胜鼓吹③,吾视褐衣愈于今之朱紫远矣！\""},{"id":"a34","t":"王安石客","u":"第 六 单 元","x":"王安石在相位，子妇之亲萧氏子至京师，因谒公。公约之饭。翌日，萧氏子盛服而往，意为公必盛馔。日过午，觉饥甚而不敢去。又久之，方命坐，果蔬③皆不具，其人已心怪之。酒三行，初供胡饼两枚，次供猪脔数四，顷即供饭，傍置菜羹而已。萧氏子颇骄纵，不复下箸，唯啖胡饼中间少许，留其四傍。公取自食之。其人愧甚而退。"},{"id":"a35","t":"张乖崖为崇阳令","u":"第 六 单 元","x":"张乖崖为崇阳令，一吏自库中出，视其鬓旁巾②下有一钱。诘之，乃库中钱也。乖崖命杖之。吏勃然曰：\"一钱何足道，乃杖我耶！尔能杖我，不能斩我也！\"乖崖援笔判曰：\"一日一钱，千日千钱，绳锯木断，水滴石穿！\"自仗剑下阶斩其首。"},{"id":"a36","t":"唐伯虎识破术士","u":"第 六 单 元","x":"有术士干唐六如，极言修炼之妙。唐云：\"如此妙术，何不自为，乃贶及人？术士云：\"恨吾福浅！吾阅人多矣，仙风道骨，无如君者。\"唐笑曰：\"吾但出仙福，有空房在城北，甚静，君为修炼，炼成两剖。\"术士犹未悟。日造门，出一扇求诗。唐大书云：\"破布衫中破布裙，逢人便说会烧银。如何不自烧些用？担水河头卖与人。\""},{"id":"a37","t":"何岳两次还金（阅读）","u":"第 七 单 元","x":"秀才何岳，号畏斋。曾夜行拾得银贰百余两，不敢与家人言之，恐劝令留金也。次早携至拾银处，见一人寻至，问其银数与封识皆合，遂以还之。其人欲分数金为谢，畏斋曰：\"拾金而人不知，皆我物也，何利此数金乎？\"其人感谢而去。又尝教书于宦官家，宦官有事入京，寄一箱于畏斋，中有数百金，曰：\"俟他日来取。\"去数年，绝无音信，闻其侄以他事南来，非取箱也。因托以寄去。夫畏斋一穷秀才也，拾金而还，暂犹可勉；寄金数年，略不动心，此其过人也远矣！"},{"id":"a38","t":"甄彬还金","u":"第 七 单 元","x":"甄彬尝以束苎②于长沙西库质钱。后赎苎，于束中得金五两。彬得金，送还西库。库人大惊曰：\"向有人以金质钱，时忽遽未之录，尔乃能见归，恐古今未之有也。\"以金之半酬之，往复十余，坚决不受。彬后为郫令，辞太祖，时同列五人，上诫以廉慎。至于彬，独曰：\"卿昔者有还金之美，故不复以此诫也。\""},{"id":"a39","t":"安重霸货无厌","u":"第 七 单 元","x":"简州刺史安重霸，黩货无厌。民有油客子③,姓邓，能棋。安召与之对敌，但令侍立，每落一子，俾其退立于下，俟我算路，然后可落子竟日不下十数子而已。邓生倦且饥，不可堪。次日又召，或有讽邓生者：\"是人好货，固不为棋，何不献赂而求退。\"邓生然之，以中金十锭获免。"},{"id":"a40","t":"陆元方卖宅","u":"第 七 单 元","x":"陆少保，字元方，曾于东都卖一小宅。家人将受直矣，买者求见。元方因告其人曰：\"此宅子甚好，但无出水处耳。\"买者闻之，遽辞不买。子侄以为言，元方曰：\"不尔，是欺之也。\""},{"id":"a41","t":"张孝基仁爱","u":"第 七 单 元","x":"许昌士人张孝基，娶同里富人女。富人唯一子，不肖，斥逐之。富人病且死，尽以家财付孝基。孝基与治后事如礼。久之，其子丐于途，孝基见之，恻然谓曰：“汝能灌园乎？”答曰：“如得灌园以就食，何幸！”孝基使灌园。其子稍自力，孝基怪之，复谓曰：\"汝能管库乎？\"答曰：\"得灌园，已出望外，况管库乎？又甚幸也。\"孝基使管库。其子颇驯谨，无他过。孝基徐察之，知其能自新，不复有故态，遂以其父所委财产归之。"},{"id":"a42","t":"冻儿","u":"第 七 单 元","x":"艾子有孙，年十许，顽劣不学，每杖而不悛。其子但有是儿，恒恐儿之不胜杖而死，责必涕泣以请。艾子曰：\"吾为若教子不善！\"杖之益峻。其子无奈。一日大雪，孙戏雪于外，艾子见之，去其衣，令跪雪中，寒战之色可掬。其子不敢复言，亦脱其衣跪其旁。艾子惊问曰：\"汝儿有过，应受此罚，汝何罪之有？\"其子泣曰：\"汝冻吾儿，吾亦冻汝儿。\"艾子止。"},{"id":"a43","t":"邴原戒酒（阅读）","u":"第 八 单 元","x":"邴原旧能饮酒，自行之后，八九年间，酒不向口。单步负笈，苦身持力，至陈留则师韩子助，颍川则宗陈仲弓，汝南则交范孟博，涿郡则亲卢子干。临别，师友以原不饮酒，会米肉送原。原曰：\"本能饮酒，但以荒思废业，故断之耳。今当远别，因见贶饯，可一饮宴。\"于是共坐饮酒，终日不醉。"},{"id":"a44","t":"邴原泣学","u":"第 八 单 元","x":"原少孤，数岁时过书舍而泣。师曰：\"童子何泣？\"原曰：\"凡得学者，有亲也。一则羡其不孤，二则羡其得学，中心感伤，故泣耳。\"师恻然曰：\"苟欲学，不须资也。\""},{"id":"a45","t":"崔景偁拜师","u":"第 八 单 元","x":"余始识景偁（chēng）于京师，与为友，偁以兄事余。既数岁，已而北面承贽，请为弟子。余愧谢，不获。且曰：\"偁之从先生，非发策决科之谓也。先生不为世俗之文，又不为世俗之人，某则愿庶几焉。\""},{"id":"a46","t":"田舍翁之子学书","u":"第 八 单 元","x":"有田舍翁，家资殷盛，而累世不识\"之\"、\"乎\"。一岁，聘楚士训其子。楚士始训之握管临朱，书一画，训曰\"一字\"；书二画，训曰\"二字\"；书三画，训曰\"三字\"。其子欣欣然掷笔，告其父曰：\"儿得矣！可无烦先生，重费馆谷③也，请谢去。\"其父喜而从之，具币谢遣楚士。逾时，其父拟召姻友万氏姓者饮。令子晨起书帖。久之不成。父趣之。其子恚曰：\"天下姓氏伙矣，奈何姓万？自晨起至今，才完五百画也。\"呜呼！世之学者偶一解，自有得，不欲更进，类是也。"},{"id":"a47","t":"读书\"五失\"","u":"第 八 单 元","x":"清袁文清尝云\"予少时读书有五失：泛观而无所择，其失博而寡要；好古人言行，意常退缩而不敢望，其失懦而无立；纂录故实，一未终而更端，其失劳而无功；闻人之长，将疾趋而从之，辄出其后，其失欲速而好高；喜学为文，未能蓄其本，其失又甚焉者也！\""},{"id":"a48","t":"宋人疑盗","u":"第 八 单 元","x":"宋有富人，天雨坏墙。其子曰：\"不筑，必将有盗。\"其邻人之父亦云。暮而果大亡其财。其家甚智其子，而疑邻人之父。"},{"id":"a49","t":"武阳君爱鸟（阅读）","u":"第 九 单 元","x":"吾昔少时，所居之室，前有竹柏杂花丛生满庭，众鸟巢其上。武阳君恶杀生，儿童婢仆④皆不得捕取鸟雀。数年间，皆巢于低枝，其鷇可俯而窥也。又有桐花凤四五百，翔集其间，此鸟羽毛至为珍异难见，而能驯扰，殊不畏人。闾里间见之，以为异事。此无他，不忮之诚，信于异类。人既不杀，则自近人者，欲免此患也。由是观之，异时鸟巢不敢近人者，以人甚于蛇鼠之类也。"},{"id":"a50","t":"小儿饲鹊","u":"第 九 单 元","x":"庭有树，鹊巢其上，育二子。后值狂风，树摧巢毁，二雏坠地。一儿见之，不胜喜，怀而归，旦夕饲之，爱甚。稍长而飞，一猫袭来，攫而去，儿逐之，不及，抚膺而泣，曰：\"早知是，吾放汝林间，安得为猫所食？是乃吾之过也。\""},{"id":"a51","t":"雌雉报复","u":"第 九 单 元","x":"有猎于山者，射雄雉而置雌雉，或叩其故，曰：\"置雌者留以招雄也，射雌则雄者飏，并获则绝矣。\"数月后，雌果招一雄雉来，猎者又射之。如是数年，获雄雉无数。一日雌雉随猎者归家，以首触庭前香案而死。后其家人死相继，又为讼累而荡其产，未几，猎者亦死，竟绝后。或曰：\"人莫不爱其伉俪，鸟亦然耶。\"猎者之计虽狡，而雌雉之报更惨矣。"},{"id":"a52","t":"杀生之报应","u":"第 九 单 元","x":"平望人王均，好食蛙，制一铁针，长二尺许。每捕得一蛙，则以针穿其颈。针满，始携之归，以充馔焉。如是者多年矣。一日，至亲戚家，见盘中无蛙，甚恨。日暮，亲戚留其宿。是夜，远处失火，王均登屋望之，其火熊熊。亲戚家临河而居，惧盗贼由水攀援登屋，故于水边植铁条以十数，末端皆锐，如锋刃状。王均遥望火光，幸灾乐祸，失足而坠。铁条适贯其颈，呼号甚惨，救之者无法可施。后竖一长梯水中，众人缘梯而上，始将其解下，而气已绝矣。其死状宛然铁针穿蛙，盖杀生之报应也。"},{"id":"a53","t":"雏燕","u":"第 九 单 元","x":"吾弟爱鸟，日思得一雏。今春，有燕自南来，竟日衔泥，筑室于檐下，劳甚。未几，啾啾之声可闻，盖雏已破壳矣。一日，有坠于堂下，弟拾之，不胜喜，纳于笼而饲之。母闻之，曰：\"是乃益鸟，食虫害，且南飞越冬，尔安得久饲之？\"趣弟遽释之。弟恋恋不舍，然视雏意甚哀，遂出笼释之。雏飞于巢，与其家人熙熙而乐也。"},{"id":"a54","t":"赵简子放生","u":"第 九 单 元","x":"邯郸之民，以正月之旦献鸠于简子。简子大悦，厚赏之。客问其故。简子曰：\"正旦放生，示有恩也。\"客曰：\"民知君之欲放之，竞而捕之，死者众矣。君如欲生之，不若禁民勿捕。捕而放之，恩过不相补矣。\"简子曰：\"然。\""},{"id":"a55","t":"庄有恭巧对（阅读）","u":"第 十 单 元","x":"粤中庄尚书有恭，幼有神童之誉。家邻镇粤将军署③，时为放风筝之戏，适落于将军署之内宅。庄直入索取，诸役以其幼而忽之，未及阻其前进。将军方与客对弈，见其神格非凡，遽诘之曰：\"童子何来？\"庄以实对。将军曰：\"汝曾读书否？曾属对否？\"庄曰：\"对，小事耳，何难之有？\"将军曰：\"能对几字？\"庄曰：\"一字能之，一百字亦能之。\"将军以其言之大而夸也，因指厅事所张画幅而命之对曰：\"旧画一堂，龙不吟，虎不啸，花不闻香鸟不叫，见此小子可笑可笑！\"庄曰：\"即此间一局棋便可对矣。\"应声云：\"残棋半局，车无轮，马无鞍，炮无烟火卒无粮，喝声将军提防提防！\""},{"id":"a56","t":"李东阳巧对","u":"第 十 单 元","x":"东阳四岁能作大书。景泰时，以神童荐。内侍扶过殿阈，曰：\"神童脚短。\"应声曰：\"天子门高。\"既入谒，命书\"龙\"、\"凤\"、\"龟\"、\"麟\"十余字。上喜，抱置膝，赐上林珍果及内府宝。时其父拜起，侍丹陛下。帝曰：\"子坐父立，礼乎？\"应声曰：\"嫂溺叔援，权也。\""},{"id":"a57","t":"杨亿巧对","u":"第 十 单 元","x":"寇莱公在中书，与同事戏作对子：\"水底日为天上日\"，未有对，而会杨大年适来白事，因请其对，大年应声曰：\"眼中人是面前人。\"一坐称为好对。"},{"id":"a58","t":"县令捕蝗","u":"第 十 单 元","x":"钱穆甫为如皋令，会岁旱蝗发，而泰兴④令独给郡将云：\"县界无蝗。\"已而蝗大起。郡将诘之，令辞穷，乃言县本无蝗，盖自如皋飞来，仍请如皋严捕蝗，无使侵邻境。穆甫得檄，辄书其纸尾报之曰：\"蝗虫本是天灾，即非县令不才。既自敝邑飞去，却请贵县押来。\""},{"id":"a59","t":"班门弄斧","u":"第 十 单 元","x":"采石江头，李太白墓在焉。往来诗人，题咏殆遍。有客书一绝云：\"采石江头一抔土，李白诗名耀千古。来的去的写两行，鲁班门前掉大斧。\""},{"id":"a60","t":"曹植早慧","u":"第 十 单 元","x":"曹植年十余岁，诵读《诗》、《论》及辞赋数十万言，善属文。太祖尝视其文，谓植曰：\"汝请人邪？\"植跪曰：\"言出为论，下笔成章，顾当面试。奈何请人？\"时邺铜雀台新成，太祖悉将诸子登台，使各为赋。植援笔立就，可观。太祖甚异之。"},{"id":"a61","t":"义猴（阅读）","u":"第 十一 单 元","x":"某山隅有一老圃，早失偶，唯一女远适他乡。猎者怜其孤，赠以猴。老者爱如赤子④,每出必从，不链不羁，而不离不逸③。如是者五年。一日，老者暴卒，猴掩门，奔其姐，泪如雨。姐曰：\"父死乎？\"猴颔之，乃俱归。老者家徒壁立，无以为葬，猴遍哭于乡，乡人乃资而掩。姐引之去，猴揖谢之，仍牢守故宅，撷果自食。每逢五日必哭祭，似念老父养之五年，哀伤殊甚。未三月而僵卧墦间。乡人怜之，乃葬于老者之侧，勒石其上，曰\"义猴之墓\"。"},{"id":"a62","t":"杨生之狗","u":"第 十一 单 元","x":"晋太和中，广陵人杨生，养一狗，甚爱怜之，行止与俱。后，生饮酒醉，行大泽草中，眠不能动。时方冬月燎原③，风势极盛。狗乃周章号唤，生醉不觉。前有一坑水，狗便走往水中，还，以身洒生左右草上。如此数次，周旋跬步，草皆沾湿，火至，免焚。生醒，方见之。尔后，生因暗行，堕于空井中。狗呻吟彻晓。有人经过，怪此狗向井号，往视，见生。生曰：\"君可出我，当有厚报。\"人曰：\"以此狗见与，便当相出。\"生曰：\"此狗曾活我已死，不得相与。余即无惜。\"人曰：\"若尔，便不相出。\"狗因下头目井。生知其意，乃语路人云：\"以狗相与。\"人即出之，系之而去。却后五日，狗夜走归。"},{"id":"a63","t":"鹦鹉亦有情","u":"第 十一 单 元","x":"宋高宗时，陇山县有人进能言之鹦鹉于宫中。高宗养之，爱甚。一日，高宗问曰：\"尔思乡不？\"曰：\"岂不思乡？然思之何用？\"帝悯之，即遣侍者送还陇山。数年后，宫中有人过其地。鹦鹉问曰：\"皇上安不？\"答曰：\"崩矣。\"鹦鹉悲鸣不已。"},{"id":"a64","t":"张之万之马","u":"第 十一 单 元","x":"张尚书之万，畜一红马，甚神骏，尝日行千里，不喘不吁。有军人见而爱之，遣人来买，公不许。固请，之万无奈，遂引而去。未几，马送回，之万怪之，询其故，曰：\"方乘，遂为掀下，连易数人，皆掀坠。此乃劣马也，故退之。\"之万求之不得，遂退金收马。比公乘之，驯良如故，盖此马愿从主也。"},{"id":"a65","t":"郑韶大难不死","u":"第 十一 单 元","x":"隋炀帝时，闽中太守郑韶养一犬，怜爱过子。韶有仇家，曰薛元周。薛怨恨于心，常怀刃欲刃之，然未得其时。一日，薛候于巷口，知韶欲出。韶且出，犬曳其衣不置。韶怒，令家人缚犬于柱。犬绝绳而走，又曳其衣不使去。韶异之。犬忽吠，腾身咬杀元周。韶索元周衣，果有匕首。"},{"id":"a66","t":"黄耳冢","u":"第 十一 单 元","x":"晋之陆机，畜一犬，曰\"黄耳\"。机官京师，久无家音，疑有不测。一日，戏语犬曰：\"汝能携书驰取消息不？\"犬掉尾喜。机遂作书，盛以竹筒，系犬颈。犬经驿路，昼夜驱驰，家人见书，又反书于机。犬即就路，越岭翻山，驰往京城。其间千里之遥，人行往反五旬，而犬乃二旬余。后犬卒，机葬之，名之曰\"黄耳冢\"。"},{"id":"a67","t":"范式言而有信（阅读）","u":"第 十二 单 元","x":"范式字巨卿，少游太学，为诸生，与汝南张劭为友。劭字元伯。二人并告归乡里。式谓元伯曰：\"后二年当还，将过拜尊亲，见孺子焉。\"乃共克期日。后期方至，元伯具以白母，请设馔以候之。母曰：\"二年之别，千里结言，尔何相信之审耶？\"对曰：\"巨卿信士，必不乖违。\"母曰：\"若然，当为尔酿酒。\"至其日，巨卿果到，升堂拜饮，尽欢而别。"},{"id":"a68","t":"魏文侯期猎","u":"第 十二 单 元","x":"魏文侯与虞人期猎。是日，饮酒乐，天雨。文侯将出，左右谏曰：\"今日饮酒乐，天又雨，公将焉之？\"文侯曰：\"吾与虞人期猎，虽乐，岂可不一会期哉？\"乃往，身自罢之。"},{"id":"a69","t":"季札赠剑","u":"第 十二 单 元","x":"季札将使于晋，持宝剑而行，过徐君。徐君观剑，不言而色欲之。季子为有晋之使，未之献也，然其心许之矣。反，徐君已死矣，悔之，于是解剑致嗣君。嗣君曰：\"先君无命，孤不敢受。\"季子乃至墓，以剑县徐君墓树而去。"},{"id":"a70","t":"华歆与王朗","u":"第 十二 单 元","x":"华歆、王朗俱乘船避难。有一人欲依附，歆难之。朗曰：\"幸尚宽，何为不可？\"后贼追至，王欲舍所携人。歆曰：\"本所以疑，正为此耳。既已纳其自托，宁可以急相弃邪？\"遂携拯如初。世以此定华、王之优劣。"},{"id":"a71","t":"吴起守信","u":"第 十二 单 元","x":"曩吴起出，遇故人，而止之食。故人曰：\"诺。\"起曰：\"待公而食。\"故人至暮不来，起不食待之。明日早，令人求故人。故人来，方与之食。起之不食以俟者，恐其自食其言也。其为信若此，宜其能服三军欤。欲服三军，非信不可也！"},{"id":"a72","t":"杨万里与\"诚斋\"","u":"第 十二 单 元","x":"杨万里字廷秀，吉州吉水人。绍兴二十四年进士第，为赣州司户①，调永州零陵丞。时张浚谪永，杜门谢客，万里三往不得见。浚勉以正心诚意之学，万里服其教终身，乃名读书之斋曰\"诚斋\"。"},{"id":"a73","t":"诸葛亮\"空城计\"（阅读）","u":"第 十三 单 元","x":"亮屯于阳平，，遣魏延诸军并兵东下，亮唯留万人守城。晋宣帝率二十万人拒亮，而与延军错道，径至前，当亮六十里所，侦候白宣帝，说亮在城中兵少力弱。亮亦知宣帝垂至，已与相逼。欲前赴延军，相去又远，回迹反追，势不相及。将士失色，莫知计出。亮意气自若，敕军中皆卧旗息鼓，不得妄出庵幔；又令大开四城门，扫地却洒。宣帝常谓亮持重，而猥见势弱，疑其有伏兵，于是引军北趣山。明日食时，亮谓参佐抚手大笑曰：\"司马懿必谓吾怯，将有强伏，循山走矣。\"候逻还白，如亮所言。宣帝后知，深以为恨。"},{"id":"a74","t":"七擒孟获","u":"第 十三 单 元","x":"建兴三年，诸葛亮率军至南中，所战皆捷。闻有孟获者，为夷汉所服，于是令生致之。既得，亮使观营阵，曰：\"此军如何？\"获对曰：\"向不知虚实，故败。今蒙使观营阵，若止如此，定能胜！\"亮笑，心知获尚不服，纵之使更战。七纵七擒，而亮犹欲释获。获曰：\"公，天威也，南人不复反矣。\"于是亮进军，南中平。"},{"id":"a75","t":"诸葛亮论赏罚","u":"第 十三 单 元","x":"赏罚之政，谓赏善罚恶也。赏以兴功，罚以禁奸;赏不可不平，罚不可不均。赏赐知其所施，则勇士知其所死；刑罚知其所加，则邪恶知其所畏。故赏不可以虚施，罚不可以妄加；赏虚施则劳臣怨，罚妄加则直士恨。"},{"id":"a76","t":"齐景公好妇人而丈夫饰","u":"第 十三 单 元","x":"齐景公好妇人而丈夫饰者，国人尽效之。公使吏禁之，曰\"女子而男子饰者，裂其衣，断其带！\"裂衣断带相望而不止。晏子曰：\"君徒禁之于外，犹悬牛首于门而卖马肉也。公胡不使内勿服，则外莫敢为也。\"公曰：\"善。\"不一月，国人莫之服。"},{"id":"a77","t":"愚人食盐","u":"第 十三 单 元","x":"昔有愚者，适友人家，与主人俱食。嫌淡而无味。主人既闻，乃益盐。食之，甚美，遂自念：\"所以美者，缘有盐故。\"暮归，母已具食。愚人曰：\"有盐乎？有盐乎？\"母出盐而怪之，但见唯食盐而不尝菜。母曰：\"安可如是？\"愚人曰：\"吾知天下之美味咸在盐中。\"食盐不已，味败，反为其患。天下之事尽然，过则非唯不益，乃害之。"},{"id":"a78","t":"燕人赵良","u":"第 十三 单 元","x":"赵良者，燕人也。漂泊江湖，疾恶如仇。一日，途经谢庄，闻有哭声，遂疾步入茅舍，见一少女蓬首垢面，哀甚。良询之，乃知为某村二恶少所凌也。良怒不可遏，径自诣索二恶少，诘之曰\"汝等何故辱无辜少女？\"一恶少眈眈相向，曰：\"何预尔事？\"良瞋目斥之：\"尔非人也，但禽兽耳！\"未及恶少出剑，白刃已入其胸，立仆。一恶少伏地求恕。良割其耳以示众，冀其不得作恶也。"},{"id":"a79","t":"子奇治阿县（阅读）","u":"第 十四 单 元","x":"子奇年十六，齐君使治阿②。既而悔之，遣使追。追者反，曰：\"子奇必能治阿，共载者皆白首也。夫以老者之智，以少者决之，必能治阿！\"子奇至阿，铸库兵以作耕器，出仓以赈贫穷，阿县大治。魏闻童子治邑，库无兵，仓无粟，乃起兵击之。阿人父率子，兄率弟，以私兵战，遂败魏师。"},{"id":"a80","t":"鲁恭治中牟","u":"第 十四 单 元","x":"鲁恭为中牟令，重德化，不任刑罚。袁安闻之，疑其不实，阴使人往视之。其人随恭行阡陌，俱坐桑下。有雉过，止其旁，旁有儿童。其人曰：\"儿何不捕之？\"儿言雉方雏，不得捕。其人瞿然而起，与恭诀曰：\"所以来者，欲察君之政绩也。今蝗不犯境，一异也；爱及鸟兽，二异也；儿童有仁心，三异也。久留徒扰贤者耳，吾将速反，以状白安。\""},{"id":"a81","t":"宓子治单父","u":"第 十四 单 元","x":"宓子治单父。齐人攻鲁，道单父。始，父老请曰：\"麦已熟矣，今齐寇迫，令民自刈而归，可以益食，且不资寇。\"三请，宓子不听。俄而，麦毕资乎齐寇。季孙闻之怒，使人让宓子曰：\"民于寒耕热耘，曾弗得食也。弗知犹可，闻或以告，而夫子弗听！\"宓子曰：\"今年无麦，明年可树。令不耕者得获，是乐有寇也。且一岁之麦，于鲁不加强，丧之不加弱。令民有自取之心，其创必数年不息。\"季孙闻之称善。"},{"id":"a82","t":"商鞅治秦","u":"第 十四 单 元","x":"公孙鞅亡魏入秦，孝公以为相，封之以商，号曰商君。商君治秦，法令至行，公平无私，罚不讳强大，赏不私亲近。法及太子，黥其傅。期年之后，道不拾遗，民不妄取，兵革大强，诸侯畏惧。然刻深寡恩，特以强服耳。"},{"id":"a83","t":"田登为郡守","u":"第 十四 单 元","x":"田登为郡守，怒人触其名，犯者必笞，于是举州皆谓\"灯\"为\"火\"。值上元张灯，吏揭榜于市，曰：\"本州依例放火三日。\"故语云：\"只许州官放火，不许百姓点灯\",本此。"},{"id":"a84","t":"唐临为万泉丞","u":"第 十四 单 元","x":"唐临为万泉丞。县有囚以十数，皆因未纳赋而系。会暮春时，当耕作。唐临白县令：\"囚亦有妻子，无耕作何以活人？请出之。\"令惧其逸，不许。唐临曰：\"明公若有所疑，吾自当其罪。\"令因告假归乡。临悉召囚令归家耕作，并与之约：农事毕，皆归系所。囚感恩，至时毕集县狱。唐临由是知名。"},{"id":"a85","t":"乐工罗程（阅读）","u":"第 十五 单 元","x":"乐工罗程者，善弹琵琶，为第一，能变易新声，得幸于武宗，恃恩自恣。宣宗初亦召供奉。程一日果以睚眦杀人。上大怒，立命斥出，付京兆。他工辈以程艺天下无双，欲以动上意。会幸苑中，乐将作，遂旁设一虚坐，置琵琶于其上。乐工等罗列上前连拜且泣。上曰：\"汝辈何为也？\"进曰：\"罗程负陛下，万死不赦。然臣辈惜程艺天下第一，不得永奉陛下，以是为恨。\"上曰：\"汝辈所惜罗程艺耳，我所重者高祖、太宗之法也。\"卒不赦程。"},{"id":"a86","t":"隋文帝不赦子","u":"第 十五 单 元","x":"隋文帝子秦王俊为并州总管，以奢纵免官。杨素启奏：\"王，陛下爱之，请舍其过。\"文帝曰\"法不可违。若如公意，吾是王儿之父，非兆人之父，何不别制天子儿律乎？我安能亏法？\"卒不许。"},{"id":"a87","t":"董阏于法无赦","u":"第 十五 单 元","x":"董阏于为赵上地守，行石邑山中，见深涧峭如墙，深百仞，因问其旁乡左右曰：\"人尝有入此者乎？\"对曰：\"无有。\"曰：\"婴儿、痴聋、狂悖之人，尝有入此者乎？\"对曰：\"无有。\"\"牛马犬彘尝有入此者乎？\"对曰：\"无有。\"董阏于喟然太息曰：\"吾能治矣！使吾法之无赦，犹入涧之必死也，则人莫之敢犯也，何为不治！\""},{"id":"a88","t":"宋太祖怕史官","u":"第 十五 单 元","x":"宋太祖尝弹雀于后苑。有臣称有急事请见。太祖遽见之。其所奏乃常事耳。上怒，诘其故。对曰：\"臣以为尚急于弹雀。\"上愈怒，举斧柄撞其口，堕两齿。其人徐俯拾齿，置怀中。上骂曰：\"汝怀齿，欲讼我耶？\"对曰：\"臣不能讼陛下，然自有史官③书之。\"上既惧又说（悦），赐金帛慰劳之。"},{"id":"a89","t":"隽不疑之母","u":"第 十五 单 元","x":"隽（juàn）不疑每行县录囚徒，还，其母问不疑：\"有何平反？活几何人？\"即不疑言多有所平反，母喜，笑为饮食，语言异于他时;或亡所出，母怒，为之不食。故不疑为吏，严而不残"},{"id":"a90","t":"蛛与蚕","u":"第 十五 单 元","x":"蛛见蚕吐丝为茧，乃曰：\"汝之吐丝，终日辛劳，自缚，何苦为？蚕妇操汝入沸汤，抽为长丝，遂丧躯。然则其巧也，适以自杀，不亦愚乎？\"蚕对曰：\"吾固自杀。然世人无吾，非寒冻而殁乎？尔口吐经纬，织成罗网，坐伺其间，俟蚊虻而自饱。巧则巧矣，其心何忍！\"噫！世之人为蚕乎，抑为蛛耶？"},{"id":"a91","t":"王荆公旁听文史（阅读）","u":"第 十六 单 元","x":"王荆公介甫，退处金陵。一日，幅巾杖屦，独游山寺，遇数客盛谈文史，词辩纷然。公坐其下，人莫之顾。有一客徐问公曰：\"亦知书否？\"公唯唯而已。复问公何姓，公拱手答曰：\"安石姓王。\"众人惶恐，惭俯而去。"},{"id":"a92","t":"王安石辞妾","u":"第 十六 单 元","x":"王荆公知制诰，吴夫人为买一妾。荆公见之，曰：\"何物也？\"女子曰：\"夫人令执事左右。\"安石曰：\"汝谁氏？\"曰：\"妾之夫为军官，督运粮而失舟，家资尽没犹不足，又卖妾以偿。\"公愀然曰：\"夫人用钱几何得汝？\"曰：\"九十万。\"公遽呼其夫，令为夫妇如初，尽以钱赐之。"},{"id":"a93","t":"\"大树将军\"冯异","u":"第 十六 单 元","x":"冯异为人谦退不伐，行与诸将相逢，引车避道。进止皆有表识，军中②号为整齐。每所止舍，诸将并坐论功，异常独屏树下，军中号\"大树将军\"。及破邯郸，乃更部分诸将，各有配隶。军中皆言愿属大树将军。光武以此多之。"},{"id":"a94","t":"薛奎识范镇","u":"第 十六 单 元","x":"范镇字景仁，成都华阳人。薛奎守蜀，一见爱之，馆于府舍，俾与子弟讲学。镇益自谦退，每行步趋府门。逾年，人不知其为帅客③也。及还朝，载以俱。有问奎入蜀何所得，曰：\"得一伟人，当以文学名世。\""},{"id":"a95","t":"春风风人","u":"第 十六 单 元","x":"孟简子相梁、卫，有罪而走齐。齐相管仲迎而问之曰：\"吾子②相梁、卫时，门下使者几何？\"孟简子曰：\"门下使者三千余人。\"管仲曰：\"今与几何人来？\"对曰：\"臣与三人俱。\"管仲曰：\"何也？\"对曰：\"其一人父死无以葬，我为葬之；一人母死无以葬，亦为葬之；一人兄有狱，我为出之。是以得三人来。\"管仲曰：\"嗟乎！吾不能以春风风人，吾不能以夏雨雨人，吾穷必矣！\""},{"id":"a96","t":"三无赖落阱","u":"第 十六 单 元","x":"村西庭有佳李，苦于窃者，乃设阱墙下，置粪秽其中。有无赖者甲乙丙，欲窃李。天黑，甲先乘垣，坠阱中，秽及其衣领，臭极难闻，犹仰首呼其曹\"来来，此有佳李。\"乙逾墙，又陷阱间，方欲启口，甲掩其口，呼丙入。俄，丙又坠入。乙与丙相与诟甲，甲曰：\"假令二子不入，岂不笑我！\""},{"id":"a97","t":"贾人背诺（阅读）","u":"第 十七 单 元","x":"济阴之贾人，渡河而亡其舟，栖于浮苴之上，号焉。有渔者以舟往救之，未至，贾人急号曰：\"我济上之巨室也，能救我，予尔百金！\"渔者载而升诸陆，则予十金。渔者曰：\"向许百金而予十金，无乃不可乎？\"贾人勃然作色曰：\"若渔者也，一日之获几何？而骤得十金犹为不足乎？\"渔人黯然而退。他日，贾人浮吕梁而下，舟薄于石，又覆，而渔者在焉。人曰：\"救诸？\"渔者曰：\"是许金而不酬者也!\"立而观之，遂没。"},{"id":"a98","t":"萧何追韩信","u":"第 十七 单 元","x":"韩信数与萧何语，何奇之。至南郑，诸将道亡者数十人。信度何已数言上，上不我用，即亡。何闻信亡，不及以闻，自追之。人有言上曰：\"丞相何亡。\"上大怒，如失左右手。"},{"id":"a99","t":"公冶长背诺","u":"第 十七 单 元","x":"世传公冶长能解百禽之语。一日，有鸱来报长，曰：\"冶长，治长！南有死獐！子食其肉，我食其肠！\"公冶长应而往，果得獐，然其无意饲以肠也。是以怨之。居无何，又来报如前。长复往，望见数人围一物而哗。长以为死獐，恐人夺之，遥呼曰：\"我击死也！我击死也！\"至，乃一死人。众人逮长见邑令。令审问，长再三辩，令曰：\"尔自言‘我击死也\"，何为诈？\"冶长无以对。"},{"id":"a100","t":"邵恶奔秦","u":"第 十七 单 元","x":"秦楚交恶，楚左尹邵恶奔秦，极言楚国之非。秦王喜，欲以为五大夫。陈轸曰：\"不可。臣之里，有出妻而再适者，且与其后夫诉前夫之非，意甚相得也。既而又失爱于其后夫，而嫁于郭南之寓人，又言其后夫如昔者。其人为其后夫言之，后夫笑曰：其所以语之者，犹前日之语我也。今左尹自楚来，而极言楚国之非，若他日又得罪于王而之他国，则将以其所以诋楚者诋王矣。\"秦王由是不用恶。"},{"id":"a101","t":"朱文公受骗","u":"第 十七 单 元","x":"朱文公有足疾，曾有道人为施针熨之术，旋觉轻安。公大喜，厚谢之，且赠以诗云：\"几载相扶藉瘦筇，一针还觉有奇功。出门放杖儿童笑，不是以前勃窣翁。\"道人得诗径去。未数日，足疾大作，甚于未针时。亟令人寻逐道人，已莫知其所往矣。公叹息曰：\"某非欲罪之，但欲追索其诗，恐其持此诗误他人尔。\""},{"id":"a102","t":"蛇将徙","u":"第 十七 单 元","x":"泽涸，蛇将徙。有小蛇谓大蛇曰：\"子行而我随之，人以为蛇之出行者也，必有杀子者；不如相衔，负我以行，人以我为神君也。\"乃相衔以越公道。人皆避之，曰：\"神君也。\""},{"id":"a103","t":"米芾狂放（阅读）","u":"第 十八 单 元","x":"宋徽宗闻米元章有字学②。一旦，于瑶林殿设纸砚笔墨，召米书之。上映帘观看，令梁守道相伴，赐酒果。米乃反系③袍袖，升高就上，跳跃便捷，落笔如云，龙蛇飞动。闻上在帘下，回顾抗声曰：\"奇绝，陛下！\"上大喜，尽以砚纸之属赐之。寻除书学博士"},{"id":"a104","t":"李白狂放","u":"第 十八 单 元","x":"白既嗜酒，日与饮徒醉于酒肆。玄宗度曲，欲造乐府新词，遽召白，白已卧于酒肆矣。召入，以水洒面，即令秉笔，顷之成十余章，帝颇嘉之。尝沉醉殿上，引足令高力士脱靴，由是斥去。乃浪迹江湖，终日沉饮。"},{"id":"a105","t":"赵孟頫过扬州","u":"第 十八 单 元","x":"元盛时，扬州有赵氏者，富而好客。其家有明月楼，人作春题，多未当意者。一日，赵子昂过扬，主人知之，迎致楼上，盛馔相款，所用皆银器。酒半，出纸笔求作春题。子昂援笔书云：\"春风阆苑三千客，明月扬州第一楼。\"主人得之，喜甚，尽撤酒器以赠子昂。"},{"id":"a106","t":"宋元君将画图","u":"第 十八 单 元","x":"宋元君将画图。众史皆至，受揖而立，舐笔和墨，在外者半。有史后至者，儃儃然不趋，受揖不立，因之舍。宋元君使人视之，则解衣般礴，裸袖握管。君曰：\"可矣，此真画者也。\""},{"id":"a107","t":"章惇书绝壁","u":"第 十八 单 元","x":"章惇尝与苏轼同游南山，抵仙游潭，潭下临绝壁万仞，岸甚狭。子厚推轼下潭书壁，轼不敢。子厚履险而下，以漆墨笔大书石壁上曰：\"苏轼章某来。\"轼拊其背曰：\"子厚异日必能杀人。\"子厚曰：\"何也？\"轼曰：\"能自拼命者能杀人也。\"子厚大笑。"},{"id":"a108","t":"晏子谏齐景公","u":"第 十八 单 元","x":"齐景公为高台，劳民。台成，又欲为钟③。晏子谏曰：\"君者，不以民之哀为乐。君不胜欲，既筑台矣，今复为钟，是重敛于民也，民必哀矣。夫敛民而以为乐，不祥，非治国之道也。景公乃止。"},{"id":"a109","t":"董永遇仙记（阅读）","u":"第 十九 单 元","x":"汉董永，千乘人，少偏孤，与父居，肆力田亩③,鹿车载自随。父亡，无以葬，乃自卖为奴，以供丧事。主人知其贤，与钱一万，遣之。道逢一妇人，曰：\"愿为子妻。\"遂与之俱。主人谓永曰：\"以钱与君矣。\"永曰：\"蒙君之惠，父丧收藏。永虽小人，必欲服勤致力，以报厚德。\"主曰：\"妇人何能？\"永曰：\"能织。\"主曰：\"必尔者，但令妇为我织百匹。\"于是永妻为主人家织，十日而毕。女出门，谓永曰：\"我，天之织女也，缘君至孝，天帝令我助君偿债耳。\"语毕，凌空而去，不知所在。"},{"id":"a110","t":"田螺姑娘","u":"第 十九 单 元","x":"谢端，晋安侯官人也。少丧父母，为邻人所养。至年十七八，恭谨自守未有妻，乡人共愍之，愿为娶妇，未得。一日，端于田间得一大螺，以为异物，取以归，贮瓮中，畜之数十日。端每早至野，还，见其户中有饭饮汤水，如有人为者。数日如此，遍询诸邻人。邻人皆曰未为也。后，端于鸡鸣而出，平旦潜归，于篱外窃窥，见一少女自瓮中出，至灶下燃火。端遽入门，问曰：\"新妇从何来，而相为炊？\"女大惶惑，欲还瓮中，然已不得入，曰：\"我，天汉中素女也。天帝哀卿少孤，故使我权为汝守舍。十年之中，使卿富且得妇，自当还去。今吾形已露，不宜复留。留此壳，以贮米谷，常可不乏。\"端请留，终不肯。时天忽风雨，倏然而去。"},{"id":"a111","t":"奇鹰","u":"第 十九 单 元","x":"楚文王少时好猎。有人献一鹰。文王见之，爪距利，殊绝常鹰。故文王猎于云梦②，置网云布，烟烧张天。毛群羽族③，争噬竞搏；此鹰轩颈瞪目，无搏噬之志。王曰：\"吾鹰所获以百数，汝鹰曾无奋意，将欺余邪？\"献者曰：\"若效于雉兔，臣岂敢献。\"俄而，云际有物翔，不辨其形。鹰遂竦翮而升，矗若飞电。须臾，羽堕如雪，血下如雨。有大鸟坠地，度其两翅，广数十里。众莫之识。时有博物君子曰：\"此乃大鹏雏也。\"文王乃厚赏之。"},{"id":"a112","t":"物之畏其天","u":"第 十九 单 元","x":"苏辙曰：\"鱼不畏网罟，而畏鹈鹕，畏其天也。\"一村叟见蜈蚣逐一蛇，行甚急，渐近，蛇不复动，张口以待。蜈蚣竟直入其腹，逾时而出，蛇已毙矣。村叟弃蛇于深山中，越旬往视之，小蜈蚣无数食其腐肉。盖蜈蚣产卵于蛇腹中也。又尝见一蜘蛛，逐蜈蚣甚急，蜈蚣逃入篱竹中。蜘蛛不复入，但以足跨竹上，摇腹数四而去。伺蜈蚣久不出，剖竹视之，已节节烂断矣。盖蜘蛛摇腹之时，乃洒溺以杀之也。物之畏其天有如此奇者也。"},{"id":"a113","t":"樵夫毁山神","u":"第 十九 单 元","x":"康熙十五年，余姚有客山行，夜宿山神寺。夜半，有虎跪拜，作人言，乞食，神以邓樵夫许之。明晨，客伺于祠外，果见一樵夫过之，逆谓曰：\"子邓姓乎？\"曰：\"然。\"因告以夜所闻见，戒勿往。邓曰：\"吾有母，仰食于樵。一日不樵，母且饥。死生命也，吾何惧之有？\"遂去不顾，客随而觇之。樵甫采樵，虎突出从竹间。樵手搏数合，持虎尾盘旋久之。虎不胜愤，乃震哮一跃，负痛遁去，樵逐而杀之。客逆劳之。樵曰：\"感君高义，盍导我至庙中。\"既至，指死虎斥神曰：\"今竟如何？\"遂碎其土偶。"},{"id":"a114","t":"二叟钓鱼","u":"第 十九 单 元","x":"有二叟分石而钓。其甲得鱼至多且易取，乙竟日亡所获也，乃投竿问甲曰：\"食饵同，钓之水亦同，何得失之异也？\"甲曰：\"吾方下钓时，但知有我而不知有鱼，目不瞬，神③不变，鱼忘其为我，故易取也。子意乎鱼，目乎鱼，神变则鱼逝矣，奚其获？\"乙如其教，连取数鱼。"},{"id":"a115","t":"赵广誓死不屈（阅读）","u":"第 二十 单 元","x":"赵广，合肥人，本李伯时家小史。伯时作画，每使侍左右，久之遂善画，尤工作马，几能乱真。建炎中陷贼。贼闻其善画，使图所掳妇女。广毅然辞以实不能画，胁以白刃，不从，遂断右手拇指遣去。而广平生实用左手。乱定，唯画观音大士而已。又数年，乃死。今士大夫所藏伯时观音，多广笔也。"},{"id":"a116","t":"钱金玉誓死抗敌","u":"第 二十 单 元","x":"钱金玉为松江千总，道光壬寅鸦片战祸起，钱方告假归省亲。闻讯，即束装起行。其戚友阻之，曰：\"军事方急，祸福叵测，君方在假，又无文檄趣公，何急急为？\"钱不从。既至吴淞③，从守西炮台，与士卒同饮食卧起，以力战相勉。及东炮台陷，弹丸咸集于西炮台。钱奋力督战，喋血数小时，左臂中三弹，曾不少却。其近卒泣陈：\"公有老母在，不可死。\"金玉笑谢曰：\"焉有食国之禄而逃其难者乎？\"未几，一弹来，中左乳，遂仆。弥留之际，犹大呼\"贼奴误国\"不置。"},{"id":"a117","t":"苏武牧羊","u":"第 二十 单 元","x":"卫律知武终不可胁，白单于。单于愈益欲降之，乃幽武，置大窖中，绝不饮食。天雨雪，武卧啮雪，与毡毛并咽之，数日不死，匈奴以为神。乃徙武北海③上无人处，使牧羝，羝乳乃得归。别其官属常惠等，各置他所。武既止海上，食不至，掘野鼠所藏草实而食之。杖汉节牧羊，卧起操持，节旄尽落。"},{"id":"a118","t":"小儿不畏虎","u":"第 二十 单 元","x":"有妇人昼日置二小儿沙上，而浣衣于水者。虎自山上驰来，妇人仓皇沉水避之。二小儿戏沙上自若。虎熟视久之，至以首抵触，庶几其一惧，而儿痴不知怪。虎亦卒去。意虎之食人，必先被之以威；而不惧之人，威无所从施欤！"},{"id":"a119","t":"季文子论\"华国\"","u":"第 二十 单 元","x":"季文子相鲁宣公、鲁成公，无衣帛之妻，无食粟之马。仲孙它谏曰：\"尔为鲁上卿，相二君矣，妻不衣帛，马不食粟，人皆以子为爱，且不华国乎？\"季文子曰：\"吾亦愿之。然吾视国人，其父兄食粗而衣恶，而我美妻与马，无乃非相者乎？且吾闻以德荣为国华，不闻以妻与马。\""},{"id":"a120","t":"郭氏之墟","u":"第 二十 单 元","x":"昔齐桓公出，见一故墟而问之。或对曰：\"郭氏之墟也。\"复问：\"郭氏奚为而墟？\"曰：\"善善而不能用，恶恶而不能去。彼善人知其贵己而不能用，则怨之；恶人见其贼己而不好，则仇之。夫与善人为怨、恶人为仇，欲毋亡得乎？\""},{"id":"a121","t":"魏徵敢谏（阅读）","u":"第 二十一 单 元","x":"魏徵状貌不逾中人，而有胆略，善回人主意，每犯颜苦谏。或逢上怒，徵神色不移，上亦为之霁威。尝言于上曰：\"人言陛下欲幸南山，外皆严装已毕，而竟不行，何也？\"上笑曰：\"初实有此心，畏卿嗔，故中辍耳。\"上尝得佳鹞，自臂之，望见徵来，匿怀中；徵奏事不已，鹞竟死怀中。"},{"id":"a122","t":"唐太宗论\"三镜\"","u":"第 二十一 单 元","x":"太宗谓侍臣曰：\"夫以铜为镜，可以正衣冠；以古为镜，可以知兴替；以人为镜，可以明得失。朕常保此三镜，以防己过。\""},{"id":"a123","t":"宋人有酤酒者","u":"第 二十一 单 元","x":"宋人有酤酒者，量酒公平，遇客甚谨，为酒甚美，悬帜甚高，然贮而不售，酒酸。怪其故，问其所知者杨倩。倩曰：\"汝狗猛邪？\"曰：\"狗猛，则酒何故而不售？\"曰：\"人畏焉。或令孺子怀钱挈壶而往酤，而狗迎而龁之，此酒所以酸而不售也。\"夫国亦有狗。有道之士怀其术而欲以明万乘之主，大臣为猛狗迎而龁之。此人主之所以为蔽，而有道之士所以不用也。"},{"id":"a124","t":"管仲破厚葬","u":"第 二十一 单 元","x":"齐国好厚葬，布帛尽于衣裘，材木尽于棺椁。齐桓公患之，以告管仲，曰：\"布帛尽则无以为蔽，材木尽则无以为守备，而人厚葬之不休，禁之奈何？\"管仲对曰：\"凡人之有为也，非名之则利之也。\"乃下令曰：\"棺椁过度者戮其尸，罪夫当丧者。\"未久，厚葬之风已矣。"},{"id":"a125","t":"邹君好服长缨","u":"第 二十一 单 元","x":"邹君好服长缨，左右皆服长缨。缨甚贵，邹君患之，问左右。左右曰：\"君好服，百姓亦服，是以贵。君因先自断其缨而出③，国中皆不服长缨。\"君不能下令为百姓服度以禁之，唯断缨出以示民，是先戮以莅民也。"},{"id":"a126","t":"犬救幼女","u":"第 二十一 单 元","x":"呈贡县村民畜一犬，甚驯。母未时上山采薪，幼女随之不及，后于母里许。俄大雪，母薄暮负薪归，女与犬俱不见。母惊怖万状，奔走号呼，竟不见女。邻里相助，亦无济。是夜举家悲痛欲绝，以为女或溺水，或坠井，或为狼所食。凌晨，复邀邻里寻之，见女卧大树下，犬倚于旁，乃不死。此雍正③十一年十一月事，邑人无不奇之。"},{"id":"a127","t":"姚坦直言\"血山\"（阅读）","u":"第 二十二 单 元","x":"王，帝第五子元杰也，尝作假山，召僚属置酒，众皆褒美，坦独俯首。王强使视之，坦曰：\"但见血山，安得假山！\"王惊问故，坦曰：\"坦在田舍时，见州县督税，上下相急，父子兄弟鞭笞苦楚，血流满身。此假山皆民租所出，非血山而何？\"时帝亦为假山未成，闻之遽毁之。"},{"id":"a128","t":"何充直言不讳","u":"第 二十二 单 元","x":"王含作庐江郡，贪浊狼藉。王敦护其兄，故于众坐称：\"家兄在郡定佳，庐江人士咸称之。\"时何充为敦主簿，在坐，正色曰：\"充即庐江人，所闻异于此!\"敦默然。旁人为之反侧，充晏然神意自若。"},{"id":"a129","t":"成敬奇探病","u":"第 二十二 单 元","x":"成敬奇有俊才，文章立而可就。为大理正②，与姚崇有姻亲③。崇尝寝疾，敬奇造宅省焉，对崇流涕，怀中置生雀数枚，一一持出，请崇手执而后放之，祝云：\"冀令公速愈。\"崇勉强从之。敬奇既去，崇恶其谗媚，谓其子弟曰：\"此泪从何而来？\"自此不复接遇。"},{"id":"a130","t":"郗雍视盗","u":"第 二十二 单 元","x":"晋国苦盗。有郗雍者，能视盗之貌。晋侯使视盗，千百无一遗焉。晋侯大喜，告赵文子曰：\"吾得一人，而一国盗为尽矣，奚用多为？\"文子曰：\"吾君恃伺察得盗，盗不尽矣！且雍必不得其死。\"俄而群盗果残之。晋侯闻大骇，立召文子而告之，曰：\"果如子言，雍死矣。取盗何方？\"文子曰：\"君欲无盗，莫若举贤而仕之，上明下化③,民有耻心，则何盗之为？\""},{"id":"a131","t":"和氏璧","u":"第 二十二 单 元","x":"楚人卞和，得璞于楚山中，奉而献诸厉王。厉王使玉人相之，玉人曰：\"石也。\"王以和为诳，而刖其左足。及厉王薨，武王即位，和又奉其璞而献诸武王。武王使玉人相之，又曰：\"石也。\"王又以和为诳，而刖其右足。武王薨，文王即位，和乃抱其璞而哭于楚山之下，三日三夜，泣尽而继之以血。王闻之，使人问其故，曰：\"天下之刖者多矣，子奚哭之悲也？\"和曰：\"吾非悲刖也，悲夫宝玉而题之以石，贞士而名之以诳。\"王乃使玉人理其璞，果得宝玉也，遂命名为\"和氏璧\"。"},{"id":"a132","t":"附庸风雅","u":"第 二十二 单 元","x":"明人吴俨，官至尚书，家巨富。其子酷好书画，购藏名笔颇多。一友家有宋宫所藏唐人《十八学士》一卷，每欲得之，而其家非千金不售。吴俨之弟富亦匹兄，唯粟帛是积，然文人常轻之。一日，其弟语画主曰：\"《十八学士》果欲千金耶？\"主曰：\"然。\"遂如数市之。后置酒宴兄与其素交厚者。酒半，特谈画，并出示所购《十八学士》以玩。或曰：\"君何以知其名画？\"其弟顾左右而言他。时人传为笑话。"},{"id":"a133","t":"不学则墙面（阅读）","u":"第 二十三 单 元","x":"唐太宗谓房玄龄曰：\"为人大须学问。朕往为群凶未定，东征西讨，不暇读书。比来四海安静，身处殿堂，不能自执书卷，使人读而听之。君臣父子④,政教之道，共在书内。古人云：‘不学，墙面，莅事唯烦。不徒言也。却思少小时行事，大觉非也。\""},{"id":"a134","t":"颜回好学","u":"第 二十三 单 元","x":"颜回年二十九，发尽白，蚤死。孔子哭之恸，曰：\"自吾有回，门人益亲。\"鲁哀公问：\"弟子孰为好学？\"孔子对曰：\"有颜回者好学，不迁怒，不贰过。不幸短命死矣，今也则亡。\""},{"id":"a135","t":"大才非学不成","u":"第 二十三 单 元","x":"胆欲大，心欲小；智欲圆，行欲方。大志非才不就，大才非学不成。学非记诵云尔，当究事所以然，融于心目，如身亲履之。南阳一出即相，淮阴一出即将，果盖世雄才，皆是平时所学。志士读书当如此。不然，世之能读书能文章不善做官做人者最多也。"},{"id":"a136","t":"约取而实得","u":"第 二十三 单 元","x":"吾性甚钝。每读一书，遇所喜即摘录之，录则朗诵十余遍，粘之壁间。每日必十余段，少则六七段。掩卷闲步，再就壁间观所粘录，日三五次以为常，务期精熟，一字不遗。壁既满，乃取第一日所粘者收入筒中，俟再读有所录，补粘其处。随收随补，岁无旷日。一年之内，约得三千段。数年之后，腹笥渐满。每见泛泛而读略得印象者，稍经时日，便腹中空空，不如予之约取而实得也。"},{"id":"a137","t":"苏秦刺股","u":"第 二十三 单 元","x":"苏秦乃洛阳人也，学纵横之术，游说秦王，书十上而不为用，资用乏绝，去秦而归。至家，妻不下纴，嫂不为炊，父母不以为子。苏秦乃叹曰：\"此皆秦之罪也！\"乃发愤读书。读书欲睡，引锥自刺其股，血流至足。后卒合齐、楚、燕、赵、魏、韩抗秦，为六国相。"},{"id":"a138","t":"读书忌\"二物\"","u":"第 二十三 单 元","x":"予少时读书，一见即能诵。暗疏③之，亦不甚失。然负此自放，喜从饮酒滑稽者游。旬朔之间，把卷无几日，故虽有强记之力，而常废于不勤。比数年来，颇发愤惩艾，悔前所为;而聪明衰耗，殆不如曩时十一二。每阅一事，必寻绎数终，掩卷茫然，复不省。故虽有勤苦之劳，而常废于善忘。嗟夫！败吾业者，常此二物也。"},{"id":"a139","t":"若石之死（阅读）","u":"第 二十四 单 元","x":"若石隐于冥山之阴。有虎恒蹲以窥其藩。若石帅其人昼夜警：日出而殷钲，日入而燎燧，宵则振铎以望，植棘树墉，坎山谷以守。卒岁虎不能有获。一日而虎死。若石大喜，以为虎死无毒己者矣。于是弛其机，撤其备，垣坏而不修，藩决而不理。无何，有貙逐麋来，止其室之隈，闻其牛羊豕之声而入食焉。若石不知其为貙也，叱之不走，投之以块，貙人立而爪之毙。君子谓若石知其一而不知其二，宜其及也。"},{"id":"a140","t":"鸡失雏","u":"第 二十四 单 元","x":"牝鸡引雏于庭，啄残粒，拾虫蚁，栩栩自得。隼过其上。见之，以为搏雏也，张翼覆雏而匿之。隼去乃出雏，饮啄如故。顷之，有乌下集于傍。鸡顾雏且避且就。乌稍狎之，鸡以为无害也，遂恣饮啄不复避。乌伺鸡，攫一雏飞去。"},{"id":"a141","t":"河豚之死","u":"第 二十四 单 元","x":"河之鱼，有豚其名者，游于桥间，而触其柱。不知远去，怒其柱之触己也，则张颊植鬣，怒腹而浮于水，久之莫动。飞鸢过而攫之，磔其腹而食之。"},{"id":"a142","t":"蜘蛛杀蛇","u":"第 二十四 单 元","x":"尝见一蜘蛛布网壁间，去地三尺许。一大蛇过其下，昂首欲吞之，而势稍不及。久之，蛇且行矣，蜘蛛忽悬丝而下垂身半空，若将逐蛇者。蛇怒，复昂首欲吞之，蜘蛛引丝上。久之，蛇又将行，而蜘蛛复悬丝疾下；蛇复昂首待之，蜘蛛乃还守其网。如是者三四。蛇意稍倦，以首俯地。蜘蛛伺其不备，奋身下，踞蛇之首，抵死不动;蛇狂跳颠掷③，以至于死。蜘蛛乃吮其脑，果腹而去。噫！万物并生并育，一相食之机也。余偶见而偶志之，其未为余所见者，固不可以殚述，殆变化无穷矣！夫物之大小强弱有定，而相制之机则无定，得其机则小可以制大，弱可以制强，盖斗智不斗力也。"},{"id":"a143","t":"牧童逮狼","u":"第 二十四 单 元","x":"两牧童入山至狼穴，穴中有小狼二。谋分捉之，各登一树，相去数十步。少顷，大狼至，入穴失子，意甚仓皇。童于树上扭小狼蹄、耳，故令嗥。大狼闻声仰视，怒奔树下，且号且抓。其一童又在彼树致小狼鸣急。狼闻声四顾，始望见之；乃舍此趋彼，号抓如前状。前树又鸣，又转奔之。口无停声，足无停趾，数十往复，奔渐迟，声渐弱；既而奄奄卧，久之不动。童下视之，气已绝矣！"},{"id":"a144","t":"子产告诫游吉","u":"第 二十四 单 元","x":"子产相郑，病将死，谓游吉曰：\"我死后，子必用郑，必以严莅人。夫火形严②,故人鲜灼;水形懦，故人多溺。子必严子之刑，无令溺子之懦。\"及子产死，游吉不肯严刑，郑少年相率为盗，处于萑泽，将遂以为郑祸。游吉率车骑与战，一日一夜仅能克之。游吉喟然叹曰：\"吾蚤行夫子之教，必不悔至于此矣。\""},{"id":"a145","t":"空桑生李（阅读）","u":"第 二十五 单 元","x":"南顿张助于田中种禾，见李核，意欲持归，顾见空桑中有土，因种植，以余浆溉灌。后有人见桑中忽生李，以为神，转相告语。有病目痛者息阴下，言：\"李君令我目愈，谢以一豚。\"目痛小疾，亦行自愈。众犬吠声，因盲者得视，远近翕赫，其下车马常数千百，酒肉滂沱。间一岁余，张助远出来还，见之惊曰：\"此有何神，乃我所种耳。\"因就斫之。"},{"id":"a146","t":"鳝父庙","u":"第 二十五 单 元","x":"会稽石亭埭有大枫树，其中空朽，每雨，水满溢。有估客载生鳝至此，聊放一头于枯树中，以为狡狯。村民见之，以鱼鳝非树中之物，或谓是神，乃依树起屋，宰牲祭祀，未尝虚日，因遂名\"鳝父庙\"。人有祈请及秽慢，则祸福立至。后估客返，见其如此，即取作臛，于是遂绝。"},{"id":"a147","t":"神蛇显\"灵\"","u":"第 二十五 单 元","x":"赣之农夫某，年且七旬，其生肖值蛇。清明前夕，辍耕反室，见几下有蛇，色褐，长二尺许，卷缩不动。念莫非佳节时蛇来显灵？遂奉以为神，焚香点烛，叩拜甚虔。酉时，怀之出户，欲放生。岂知蛇因暖而苏，啮臂。始觉痛，旋少肿，既而剧痛不堪，呼里人救。里人车载就医，断臂乃已。呜呼！蛇未赐福，反为其害，乃由自取也。"},{"id":"a148","t":"点石成金","u":"第 二十五 单 元","x":"一人贫苦特甚，生平虔奉吕祖。吕祖乃吕洞宾也，相传为道教之祖。吕祖感其诚，一日忽降至其家，见其家徒四壁，不胜悯之，因伸一指，指其庭中磐石。俄顷，粲然化为黄金。吕祖曰：\"汝欲之乎？其人再拜，曰：\"不欲也。\"吕祖大喜，谓：\"子诚能如此，无私心也，可授以大道。\"其人曰：\"不然，吾欲汝之指头也。\"吕祖忽不见。"},{"id":"a149","t":"杯弓蛇影","u":"第 二十五 单 元","x":"乐广有客，久阔不复来，广问其故。答曰：\"前在坐，蒙赐酒，方欲饮，见杯中有蛇，意甚恶之，既饮而疾。\"于时，厅事壁上有角弓③,漆画作蛇。广意杯中蛇即角弓之影也。复置酒于前处，谓客曰：\"酒中复有所见不？\"答曰：\"所见如初。\"广乃告其所以。客豁然意解，沈疴顿愈。"},{"id":"a150","t":"慈鸡","u":"第 二十五 单 元","x":"盛氏家畜二母鸡，黄白各一，分棚而栖，各饲数雏。晨夕引雏而出，二雌并行，宛若人之洽比其邻者。一日，黄者为人所窃，失母之雏，悲鸣不已。白者频来相顾，若代为悯恻。然白后得食相呼，而视如己出。鸡虽微禽，而于五德之外，复具一德。盛君之友因呼之为\"慈鸡\"。"},{"id":"a151","t":"赵括纸上谈兵（阅读）","u":"第 二十六 单 元","x":"赵括自少时学兵法，言兵事，以为天下莫能当。尝与其父奢言兵事，奢不能难，然不谓善。括母问奢其故，奢曰：\"兵，死地也，而括易言之。使赵不将括即已，若必将之，破赵军者必括也。\"赵括既代廉颇，悉更约束，易置军吏。秦将白起闻之，纵奇兵，佯败走，而绝其粮道，分断其军为二，士卒离心。四十余日，军饿，赵括出锐卒自搏战，秦军杀赵括。括军败，数十万之众遂降秦，秦悉坑之。"},{"id":"a152","t":"善诵掌船法","u":"第 二十六 单 元","x":"曩有大长者①子，与诸商人入海采宝。此长者子善诵入海掌船方法，语众人曰：\"入海方法，我悉知之。\"众人闻已，深信其语。既至海中，未经几时，船师遇病，忽然便卒。时长者子即代处。至洄洑激流之中，抗言：\"当如是掌，如是正，如是住。\"船盘旋转，不能前进至于宝所。举船商人没水而死。"},{"id":"a153","t":"刘羽冲死读书","u":"第 二十六 单 元","x":"刘羽冲，沧州人也，性孤僻，好讲古制，实迂阔不可行。偶得古兵书，伏读竟年，自谓可将十万。会有土寇，自练乡兵与之角，全队溃覆，几为所禽。又得古水利书，伏读竟年，自谓可使千里成沃壤。绘图列说于州官。州官亦好事，使试于一村，沟甫成，水大至，顺渠灌入，人几为鱼。由是郁郁不自得，恒独步庭院，摇首叹息：\"古人岂欺我哉？\"如是日千百遍，唯此六字。不久发病死。"},{"id":"a154","t":"荆人袭宋","u":"第 二十六 单 元","x":"荆人欲袭宋，使人先表澭水。澭水暴溢，荆人弗知，循表而夜涉，溺死者千有余人，军惊而坏都舍。向其先表之时可导也；今水已变而益多矣，荆人尚犹循表而导之，此其所以败也。"},{"id":"a155","t":"恃胜失备","u":"第 二十六 单 元","x":"有人尝遇强寇斗。矛刃已接，寇先含水满口，噀其面，其人愕然，刃已揕胸。后有一壮士，复与寇遇，已先知水之事。寇复用之，水才出口，矛已洞颈。盖已陈刍狗，其机已泄。恃胜失备，反受其害。"},{"id":"a156","t":"黑驴与白骏","u":"第 二十六 单 元","x":"有一黑驴，负物甚重。路遇一白骏，呼曰：\"骏兄济我，吾背上物重，力不得胜，请与分任之。\"骏哂曰：\"懒驴，此系汝之责任，吾岂能与尔代肩哉！\"驴又哀之，骏竟不应。未几，驴力疲，压毙。驱驴者愤极，强鞭挞其骏，令重物全负而行。骏终恨之，亦无可如何也。天下事大，非一人之力而能任，戮力图之，则重事亦举矣。"},{"id":"a157","t":"师旷撞晋平公（阅读）","u":"第 二十七 单 元","x":"晋平公与群臣饮，饮酣，乃喟然叹曰：\"莫乐为人君，唯其言而莫之违！\"师旷侍坐于前，援琴撞之。公披衽而避，琴坏于壁。公曰：\"太师谁撞？\"师旷曰：\"今者有小人言于侧者，故撞之。\"左右请除之。公曰：\"释之，以为寡人戒。\""},{"id":"a158","t":"田子方诫子击","u":"第 二十七 单 元","x":"子击出，遭田子方②于道，下车伏谒。子方不为礼。子击怒，谓子方曰：\"富贵者骄人乎？贫贱者骄人乎？\"子方曰：\"亦贫贱者骄人耳！富贵者安敢骄人！国君而骄人，则失其国；大夫而骄人则失其家。失其国者未闻有以国待之者也，失其家者未闻有以家待之者也。夫士贫贱，言不用，行不合，则纳履而去耳，安往而不得贫贱哉！\"子击乃谢之。"},{"id":"a159","t":"原谷谏父","u":"第 二十七 单 元","x":"原谷有祖，年老，谷父母厌憎，欲捐之。谷年十有五，谏父曰：\"祖育儿生女，勤俭终身，岂有老而捐之者乎？是负义也。\"父不从，作舆，捐祖于野。谷随，收舆归。父曰：\"汝何以收此凶具？\"谷曰：\"他日父母老，无需更作此具，是以收之。\"父惭，悔之，乃载祖归养。"},{"id":"a160","t":"子产不毁乡校","u":"第 二十七 单 元","x":"郑人游于乡校，以议执政。然明谓子产②曰：\"何不毁乡校？\"子产曰：\"夫人朝夕退而游焉，以议执政之善否。其所善者，吾则行之；其所恶者，吾则改之，是吾师也，若之何毁之？吾闻为忠善以损怨，不闻作威以防怨。民之言，吾闻而药之也。\""},{"id":"a161","t":"陈实与\"梁上君子\"","u":"第 二十七 单 元","x":"陈实，东汉人也，为人仁爱。时岁饥民馁，有盗夜入其室，栖于梁上。实阴见之，乃起整衣，呼儿孙起，正色训之，曰：\"夫人不可不自勉。不善之人未必本恶，习以性成，遂至于此。梁上君子者是矣！\"盗惊，自投于地，叩头归罪。实徐谕之曰：\"视君状貌，不似恶人，宜省己为善。\"实知其贫，乃令人与之绢二匹。自是一县无复盗者。"},{"id":"a162","t":"秦武王偏听","u":"第 二十七 单 元","x":"扁鹊见秦武王，武王示之病。扁鹊请除之。左右曰：\"君之病在耳之前，目之下，除之未必已也，将使耳不聪，目不明。\"君以告扁鹊。扁鹊怒而投其砭石，曰：\"君与知之者谋之，而与不知者败之，使此②知秦国之政也，则君一举而亡国矣。\""},{"id":"a163","t":"王积薪闻棋（阅读）","u":"第 二十八 单 元","x":"王积薪棋术功成，自谓天下无敌。将游京师，宿于逆旅。既灭烛，闻主人媪隔壁呼其妇曰\"良宵难遣，可棋一局乎？\"妇曰：\"诺。\"曰：\"第几道下子矣？\"妇曰：\"第几道下子矣。\"各言数十。曰：\"尔败矣。\"妇曰：\"伏局。\"积薪暗记，明日复其势，意思皆所不及也。"},{"id":"a164","t":"猴弈","u":"第 二十八 单 元","x":"西蕃有二仙，弈于山中树下，一老猴于树上日窥其运子之法，因得其巧。国人闻而往观，仙者遁去，猴即下树与人弈，遍国中莫之胜。国人奇之，献于朝。上诏征能弈者与之较，皆不敌。或言杨靖善弈，时杨靖以事系于狱，诏释出之。靖请以盘盛桃，置于猴前，猴心牵于桃，无心弈，遂败。"},{"id":"a165","t":"裴旻射虎","u":"第 二十八 单 元","x":"北平多虎，裴旻善射，尝一日毙虎三十有一，因憩山下，四顾自若。有一老父曰：\"此皆彪也，似虎而非，将军若遇真虎，无能为也。\"跃马而往，次丛薄中②果有虎出，状小而势猛，据地一吼，山石震裂。马辟易，弓矢皆坠，殆不得免。自此惭惧，不复射虎。"},{"id":"a166","t":"重九登高","u":"第 二十八 单 元","x":"汝南桓景随费长房游学累年。长房谓之曰：\"九月九日，汝家中当有灾，宜急去，令家人各作绛囊，盛茱萸③以系臂，登高饮菊花酒，此祸可除。\"景如其言，举家登山。夕还，见鸡、犬、牛、羊一时暴死。长房闻之，曰：\"此可代也。\"今世人九日登高饮酒，妇人带茱萸囊，盖始于此"},{"id":"a167","t":"宋仁宗忍饿","u":"第 二十八 单 元","x":"宋仁宗一日晨兴，语近臣曰：\"昨夕因不寐而甚饥，思食烧羊。\"侍臣曰：\"何不降旨取索？\"仁宗曰：\"比闻禁中每有索取，外面遂以为例。诚恐自此逐夜宰杀，以备非时供应。则岁月之久，害物多矣。岂不可忍一夕之饥，而启无穷之杀也。\""},{"id":"a168","t":"邓攸弃儿保侄","u":"第 二十八 单 元","x":"邓攸，晋人也。有弟早亡，唯有一儿，曰遗民。时值动乱，胡人入侵京师，掠牛马。邓攸挈妻子亡。食尽，贼又迫，攸谓妻曰：\"吾弟早亡，但有遗民，今担两儿，尽死。莫若弃己儿，怀遗民走。\"妻涕如雨。攸慰之曰：\"毋哭，吾辈尚壮，日后当有儿。\"妻从之。"},{"id":"a169","t":"创业与守成（阅读）","u":"第 二十九 单 元","x":"上问侍臣：\"帝王创业与守成孰难？\"房玄龄曰：\"草昧之初，与群雄并起，角力而后臣之，创业难矣！\"魏徵曰：\"自古帝王，莫不得之于艰难，失之于安逸，守成难矣！\"上曰：\"玄龄与吾共取天下，出百死，得一生，故知创业之难；徵与吾共安天下，常恐骄奢生于富贵，祸乱生于所忽，故知守成之难。然创业之难，既已往矣；守成之难，方当与诸公慎之。\""},{"id":"a170","t":"唐太宗吞蝗","u":"第 二十九 单 元","x":"贞观二年，京师旱，蝗虫大作。太宗人苑视禾，见蝗虫，掇数枚而咒曰：\"人以谷为命，而汝食之，是害于百姓。百姓有过，在予一人。尔其有灵，但当蚀我心，无害百姓。\"将吞之。左右遽谏曰：\"恐成疾，不可！\"太宗曰：\"所冀移灾朕躬，何疾之避！\"遂吞之。"},{"id":"a171","t":"刘宠任会稽守","u":"第 二十九 单 元","x":"刘宠任会稽太守，除苛政，禁非法，郡中大治。朝廷征为将作大匠。山阴县有五六叟，自若耶谷间出，人赍百钱以送宠，曰：\"山谷人，未尝识朝政。他守时，吏索求民间，至夜不绝，或狗吠竟夕，民不得安。自明府来，狗不夜吠，民不见吏；年老值圣明，故相扶而送。\"宠曰：\"吾之政何能及公言邪！父老辛苦！\"叟奉以钱，宠不能辞，遂各选一钱受之。"},{"id":"a172","t":"青文胜为民请命","u":"第 二十九 单 元","x":"青文胜，字质夫，夔州人。仕为龙阳典史。龙阳濒洞庭，岁罹水患，赋数十万，敲扑死者相踵。文胜慨然诣阙上疏，为民请命，再上，皆不报。叹曰：\"何面目归见父老！\"复具疏，击登闻鼓以进，遂自经于鼓下。帝闻大惊，悯其为民杀身，诏宽龙阳租二万四千余石。邑人建祠祀之。"},{"id":"a173","t":"周公安民","u":"第 二十九 单 元","x":"周武王克殷，召邵公而问：\"殷之士众，奈何治之？\"邵公对曰：\"有罪者杀之，无罪者活之。\"武王曰：\"不可。\"邵公出，周公入。武王曰：\"为之奈何？\"周公曰：\"使各居其宅，田其田，无更旧新，唯仁是亲。\"武王曰：\"善哉！\"乃从周公之言。"},{"id":"a174","t":"纥干狐尾","u":"第 二十九 单 元","x":"并州有纥干者，好戏剧。邑传言有狐魅③,人心惶惶。一日，纥干得一狐尾，缀于衣后，至妻旁，侧坐露之。其妻疑为狐魅，遂持斧欲斫之。纥干云：\"吾非魅。\"妻不信。纥干走，至邻家，邻家又以刀杖逐之。纥干叩头谢：\"我纥干也，第戏剧耳。何意专杀我？\""},{"id":"a175","t":"陆游筑\"书巢\"（阅读）","u":"第 三十 单 元","x":"吾室之内，或栖于椟，或陈于前，或枕藉于床，俯仰四顾，无非书者。吾饮食起居，疾痛呻吟，悲忧愤叹，未尝不与书俱。宾客不至，妻子不觌③，而风雨雷电之变，有不知也。间有意欲起，而乱书围之，如积槁枝，或至不得行，则自笑曰：\"此非吾所谓巢者耶？\"乃引客就观之。客始不能入，既入不能出，乃亦大笑曰：\"信乎其似巢也！\""},{"id":"a176","t":"郑板桥读书","u":"第 三十 单 元","x":"板桥幼随父学，无他师也。然读书能自刻苦，自愤激，自竖立，不苟同俗，深自屈曲委蛇，由浅入深，自卑及高，由迩及远，以赴古人之奥区，以自畅其性情才力之所不尽。人咸谓板桥读书善记，不知非善记，乃善诵耳。板桥每读一书，必千百遍。舟中、马上、被底，或当食忘匕箸，或对客不听其语，并自忘其所语，皆记书默诵也。书有弗记者乎？"},{"id":"a177","t":"古今学者","u":"第 三十 单 元","x":"学者，所以求益耳。见人读数十卷书，便自高大，凌忽长者，轻慢同列，人疾之如仇敌，恶之如鸱枭。如此以学自损，不如无学也。古之学者为己，以补不足也;今之学者为人，但能说之也。古之学者为人，行道以利世也；今之学者为己，修身以求进也。"},{"id":"a178","t":"苏洵二十七始发愤","u":"第 三十 单 元","x":"眉山苏洵，少不喜学，壮年犹不知书，年二十七始发愤读书，举进士②，又举茂才，皆不中，曰：\"此未足为我学也。\"焚其文，闭户读书，五六年，乃大究《六经》、百家之说。嘉祐初，与二子轼、辙至京师，欧阳文忠公献其书于朝，士大夫争持其文，二子举进士亦皆在高第。于是，父子名动京师，而苏氏文章擅天下，目其文曰\"三苏\"，盖洵为老苏，轼为大苏，辙为小苏。"},{"id":"a179","t":"晋平公七十欲学","u":"第 三十 单 元","x":"晋平公问于师旷曰：\"吾年七十，欲学，恐已暮矣。\"师旷曰：\"何不炳烛乎？\"平公曰：\"安有为人臣而戏其君乎？\"师旷曰：\"盲臣安敢戏君乎？臣闻之：少而好学，如日出之阳;壮而好学，如日中之光；老而好学，如炳烛之明，炳烛之明孰与昧行乎？\"平公曰：\"善哉！\""},{"id":"a180","t":"欧阳询尝行","u":"第 三十 单 元","x":"欧阳询尝行，见古碑，晋索靖所书。驻马观之，良久乃去。数百步复反，下马伫立，及疲，乃布裘坐观，因宿其旁，三日方去。"},{"id":"a181","t":"晏子谏杀烛邹（阅读）","u":"第 三十一 单 元","x":"景公好弋，使烛邹主鸟而亡之。公怒，诏吏欲杀之。晏子曰：\"烛邹有罪三，请数之以其罪而杀之。\"公曰：\"可。\"于是召而数之公前，曰：\"烛邹！汝为吾君主鸟而亡之，是罪一也；使吾君以鸟之故杀人，是罪二也；使诸侯闻之，以吾君重鸟以轻士，是罪三也。\"数烛邹罪毕，请杀之。公曰：\"勿杀！寡人闻命矣。\""},{"id":"a182","t":"郑龙谏勿伤百姓","u":"第 三十一 单 元","x":"吾先君晋文公伐卫，不戮一人；今君一畋，而欲杀良民，是虎狼也。\"简子曰：\"人得兽，我得士。故缘木愈高者愈惧，人爵愈贵者愈危，可不慎乎！\""},{"id":"a183","t":"晋文公欲伐卫","u":"第 三十一 单 元","x":"晋文公出，适欲伐卫。公子锄仰天而笑。公曰：\"奚笑？\"曰：\"臣笑邻之人有送其妻适私家者，道见桑妇，悦而与言。然顾视其妻，亦有招之者矣。臣窃笑此也。\"公悟其言，乃止，引师而反。未至都，而秦伐其北矣。"},{"id":"a184","t":"魏徵讽谏","u":"第 三十一 单 元","x":"唐太宗得鹞，绝俊异，私自臂之。望见郑公，乃匿于怀。公知之，遂前白事，因语古帝王逸豫，微以讽谏。语久，帝惜鹞且死。而帝素敬徵，欲尽其言。徵语不尽，鹞竟死怀中。"},{"id":"a185","t":"唐俭止太宗逞雄","u":"第 三十一 单 元","x":"唐太宗射猛兽于苑内，有群豕突出林中。太宗引弓射之，四发而四中。有一雄豕，疾来冲马，太宗拔剑断豕，顾而笑曰：\"天策长史，不见上将军击贼耶？何惧之有？\"俭对曰：\"汉高祖于马上得之，不于马上治之。陛下以神武定四方，岂复逞雄心于一兽？\"太宗善其言，因命罢猎。"},{"id":"a186","t":"富不易妻","u":"第 三十一 单 元","x":"帝欲以女妻尉迟敬德，敬德辞曰：\"臣妻虽鄙陋，亦不失夫妻情。臣每闻说古人语：富不易妻，仁也。臣窃慕之，愿停圣恩。\"叩头固让。帝嘉之而止。"},{"id":"a187","t":"猫说（阅读）","u":"第 三十二 单 元","x":"齐奄家畜一猫，自奇之，号于人曰\"虎猫\"。客说之曰：\"虎诚猛，不如龙之神也，请更名曰‘龙猫’。\"又客说之曰：\"龙固神于虎也，龙升天须浮云，云其尚于龙乎？不如名曰‘云’。\"又客说之曰：\"云蔽天，风倏散之，云故不敌风也，请名曰\"风’。\"又客说之曰：\"大风飙起，唯屏以墙，斯足蔽矣，风其如墙何？名之曰‘墙猫\"可。\"又客说之曰：\"唯墙虽固，唯鼠穴之，墙斯圮矣，墙又如鼠何？即名曰‘鼠猫'可也。\"东里丈人嗤之曰：\"嘻！捕鼠者故猫也。猫即猫耳，胡为自失本真哉！\""},{"id":"a188","t":"天下无良猫","u":"第 三十二 单 元","x":"某恶鼠，破家求良猫。餍以腥膏，眠以毡罽。猫既饱且安，率不捕鼠，甚者与鼠嬉戏。鼠以故益暴。某怒，遂不复畜猫，以为天下无良猫也。"},{"id":"a189","t":"南人捕孔雀","u":"第 三十二 单 元","x":"罗州山中多孔雀，群飞者数十为偶。雌者尾短无金翠。雄者生三年有小尾，五年成大尾，方春而生，三四月后复凋，与花萼相荣衰；然自喜其尾而甚妒。凡欲山栖，必先择有置尾之地，然后止焉。南人生捕者，候甚雨往擒之，尾沾而重，不能高翔；人至，且爱其尾，恐有所伤，不复翔也。"},{"id":"a190","t":"富商之鹦鹉","u":"第 三十二 单 元","x":"富商有段姓者，畜一鹦鹉，甚慧，能迎客与诵诗。段系其两翅，置于雕笼。熙宁六年，段忽系狱。及归，问鹦鹉曰：\"吾半年在狱，身不由己，极其怨苦，汝在家有人喂饲，何其乐耶！\"鹦鹉曰：\"君半年在狱，早已不堪；吾多年在笼，何乐可言？\"段大感悟，即日放之。"},{"id":"a191","t":"牛虎相斗","u":"第 三十二 单 元","x":"天长县民戴某，晨出，其妻牧牛于野。平日，其犬时时从之，是日俄入草丛而不出。戴妻怪之，牵牛寻之。未百步，见虎踞丛中啮犬，大骇。虎见人至，弃犬趋人，戴妻奔之不及，为虎所搏。牛见主有难，奋然而前。虎又释人而扑向牛。二物交加咆哮，虎张爪牙，牛以二角抵击。逾时，虎力竭，仓皇逃窜，牛竟胜虎。戴妻乃得免。"},{"id":"a192","t":"绿衣使者","u":"第 三十二 单 元","x":"唐明皇时，长安杨崇义妻刘氏与邻人李氏私通，欲杀崇义。崇义喜鹦鹉，常自喂之。一日，崇义醉归，刘与李谋而杀之，埋枯井中，僮仆皆不之知，唯鹦鹉见之。刘氏故令僮仆觅夫，并告官。官日夜捕贼不得，诣杨家索。架上鹦鹉忽曰：\"杀家主者，刘与李也。\"官收二人拷问，具招实情。遂置二人于法，并奏明皇。明皇称鹦鹉义，遂养于宫中，封为\"绿衣使者\"。"},{"id":"a193","t":"避风行船（阅读）","u":"第 三十三 单 元","x":"江湖间唯畏大风。冬月风作有渐③，船行可以为备，唯盛夏风起于顾盼间，往往罹难。曾闻江国贾人有一术，可免此患。大凡夏月风暴，须作于午后，欲行船者五鼓初起视星月明洁，四际至地，皆无云气，便可行，至于巳时即止。如此无复与暴风遇矣。"},{"id":"a194","t":"曹绍夔捉\"怪\"","u":"第 三十三 单 元","x":"洛阳有僧，房中有磬，日夜自鸣。僧以为怪，惧而成疾。求术士百方禁之，终不能已。绍夔与僧善，来问疾，僧具以告。俄，击斋钟③，磬复作声。绍夔笑曰：\"明日可设盛馔，当为除之。\"僧虽不信绍夔言，然冀其有效，乃具以待之。食讫，出怀中锉，锉磬数处，其响遂绝。僧苦问其所以，绍夔云：\"此磬与钟律合，击彼此应。\"僧大喜，其疾亦愈。"},{"id":"a195","t":"黄怀信巧修龙船","u":"第 三十三 单 元","x":"宋初，两浙献龙船，长二十余丈，上为宫室层楼，设御榻，以备上游。岁久，腹败欲葺，而水中不可施工。时宦官黄怀信献计：于金明池北凿大澳，可容龙船，其下置柱，以大木架其上，乃决水入澳，引船搁梁上。即车出澳中水，船乃架于空中。补讫，复以水浮船，撤去梁柱，以大棚蒙之，遂为藏船之室，且永无暴露之患。"},{"id":"a196","t":"阳谷欲爱反害","u":"第 三十三 单 元","x":"楚恭王与晋人战于鄢陵，战酣，恭王伤而休。司马子反渴而求饮，竖阳谷奉酒而进之。子反之为人也，嗜酒而甘之，不能绝于口，遂醉而卧。恭王欲复战，使人召司马子反，辞以心痛。王驾而往视之，入幄中而闻酒臭。恭王大怒曰：\"今日之战，不谷亲伤，所恃者司马也，而司马又若此，是亡楚国也。不谷无与复战矣!\"于是罢师而去之，斩司马子反以为戮。"},{"id":"a197","t":"陈五计斥女巫","u":"第 三十三 单 元","x":"京城多信女巫。有陈五者，厌其家人信之笃，莫能治。一日含青李于腮，绐家人：\"疮肿甚痛。\"不食而卧终日。其妻患之，召巫治之。巫谓五所患乃疔疮也，以其素不敬神，神不之救。家人再拜，恳祈，然后许之。五佯作呻吟状，语家人云：\"必得神巫入视救我。\"巫人视之。五乃从容吐青李，摔巫，批其颊而叱之。巫疾走亡之。自是家人不复信巫。"},{"id":"a198","t":"知人不易","u":"第 三十三 单 元","x":"孔子穷乎陈、蔡之间，藜羹不斟，七日不食，昼寝。颜回索米，得而炊之。几熟，孔子望见颜回攫甑中而食之。少时，食熟，谒孔子而进食。孔子佯为不见之，曰：\"今者吾梦见先君，食洁而后馈。\"颜回对曰：\"不可！向者煤炱入甑中，弃之不祥，吾攫而食之。\"孔子叹曰：\"所信者目也，而目犹不可信;所恃者心也，而心犹不足恃。弟子志之，知人固不易也！\""},{"id":"a199","t":"君子必慎其所处（阅读）","u":"第 三十四 单 元","x":"与善人居，如入芝兰之室，久而不闻其香，即与之化矣。与不善人居，如入鲍鱼之肆，久而不闻其臭，亦与之化矣。丹之所藏者赤，漆之所藏者黑，是以君子必慎其所处者焉。"},{"id":"a200","t":"一傅众咻","u":"第 三十四 单 元","x":"孟子谓戴不胜曰：\"子欲子之王善与？我明告子：有楚大夫于此，欲其子之齐语也，则使齐人傅诸？使楚人傅诸？\"曰：\"使齐人傅之。\"曰：\"一齐人傅之，众楚人咻之，虽日挞而求其齐也不可得矣;引而置之庄岳之间数年，虽日挞而求其楚亦不可得矣。\""},{"id":"a201","t":"南方多没人","u":"第 三十四 单 元","x":"南方多没人，日与水居也。七岁而能涉，十岁而能浮，十五而能没矣。夫没岂苟然哉？必将有得于水之道者。日与水居，则十五而得其道。生不识水，则虽壮，见舟而畏之。故北方之勇者，问于没人而求其所以没，以其言试之河，未有不溺者也。"},{"id":"a202","t":"逆旅主人无情","u":"第 三十四 单 元","x":"京城之俗，多以逆旅为利。客至，授一室，但可容榻，俯而出入。晓钟响，起为他事，遇夜始归息，盥濯皆自为，然月租以千数，否必斥骂致讼。或疾病，则遣出。其病危者，虽气息尚属，目未瞑，即弃之，而夺其资财。妇孕将产者，以为不祥，拒而不舍。其少恩薄情如此，非其性固然，地在京城，四方人至者众，其势必然也！"},{"id":"a203","t":"释车而走","u":"第 三十四 单 元","x":"齐景公游少海，传骑从中来谒曰：\"晏婴疾甚，且死，恐公后之。\"景公遽起，传骑又至。景公曰：\"趋驾烦且之乘，使驺子、韩枢御之。\"行数百步，以驺为不疾，夺辔代之御；可数百步，以马为不进，尽释车而走。"},{"id":"a204","t":"梁鸿尚节","u":"第 三十四 单 元","x":"梁鸿家贫而尚节，博览无不通。学毕，乃牧豕于上林苑中，尝误遗火，延及他舍。乃寻访烧者，问所失财物，悉以家财偿之。其主犹以为少。鸿曰：\"无他财，愿以身居作。\"主人许。因为执勤不懈。耆老见鸿非恒人，乃共让主人，而称鸿长者。于是，始敬鸿，还其豕，鸿不受。"},{"id":"a205","t":"指不若人（阅读）","u":"第 三十五 单 元","x":"孟子曰：\"今有无名之指，屈而不信，非疾痛害事也。如有能信之者，则不远秦楚之路，为指之不若人也。指不若人，则知恶之；心不若人，则不知恶。此之谓不知类也。"},{"id":"a206","t":"石崇宴客","u":"第 三十五 单 元","x":"石崇每要客燕集，常令美人行酒。客饮酒不尽者，使黄门交斩美人。王丞相与大将军尝共诣崇。丞相素不能饮，辄自勉强，至于沉醉。每至大将军，固不饮，以观其变。已斩三人，颜色如故，尚不肯顾。丞相让之，大将军曰：\"自杀伊家人③，何预卿事？\""},{"id":"a207","t":"晏子逐高缭","u":"第 三十五 单 元","x":"高缭仕于晏子，晏子逐之。左右谏曰：\"高缭之事夫子三年，曾无以爵位而逐之，其义可乎？\"晏子曰：\"婴仄陋之人也，四维之然后能直。\"今此子事吾三年，未尝弼吾过，是以逐之也。"},{"id":"a208","t":"胡岐兄妹","u":"第 三十五 单 元","x":"胡岐兄妹，少孤。母以织席为生。及兄妹长，母病不起。兄妹相约：兄外出营生，妹于家侍母。邻有刘三者，欲图胡妹，妹斥之，遂怀恨于心。刘乃传言于其兄，状其妹诸不孝事。兄遽反乡省之，值母卒，乃责其妹曰：\"吾与汝二人，无母则无以成人，尔何为不孝？\"妹涕曰：\"无有是事，冀兄询诸邻里。\"邻里皆曰：\"汝妹至孝，举乡皆知，必有人诬之。\"胡岐具言实情，众谴刘三。"},{"id":"a209","t":"子贡让金","u":"第 三十五 单 元","x":"鲁国之法：鲁人为臣妾于诸侯，有能赎之者，取金于府。子贡赎鲁人于诸侯而让其金。孔子曰：\"赐失之矣！夫圣人之举事，可以移风易俗，而教导可施于百姓，非独适己之行也。今鲁国富者寡而贫者多，取其金则无损于行，不取其金，则不复赎人矣。\"子路拯溺者，其人拜之以牛。子路受之，孔子喜曰：\"鲁人必多拯溺者矣。\""},{"id":"a210","t":"岑鼎","u":"第 三十五 单 元","x":"昔齐攻鲁，求其岑鼎。鲁侯伪献他鼎而请盟焉。齐侯不信，曰：\"若柳季云是，则请受之。\"鲁欲使柳季。柳季曰：\"君以鼎为国，信者亦臣之国，今欲破臣之国，全君之国，臣所难也。\"鲁侯乃献岑鼎。"},{"id":"a211","t":"甘戊与船夫（阅读）","u":"第 三十六 单 元","x":"甘戊使于齐，渡大河。船人曰：\"河水间耳，君不能自渡，能为王者之说乎？\"甘戊曰：\"不然，汝不知也！物各有短长：谨愿敦厚，可事主，不施用兵;骐骥，足及千里，置之宫室使之捕鼠，曾不如小狸；干将为利，名闻天下，匠人以治木，不如斤斧。今持楫而上下随流，吾不如子；说千乘之君、万乘之主，子亦不如戊矣。\""},{"id":"a212","t":"才罕全","u":"第 三十六 单 元","x":"人之才行，自昔罕全。苟有所长，必有所短。若录长补短，则天下无不用之人；责短舍长，则天下无不弃之士。加以情有憎爱，趣③有异同，假使圣如伊、周，贤如墨、杨，求诸物议，孰免讥嫌？"},{"id":"a213","t":"乐羊食子","u":"第 三十六 单 元","x":"乐羊为魏将而攻中山。其子在中山。中山之君烹其子而遗之羹，乐羊坐于幕下而啜之，尽一杯。魏文侯谓堵师赞曰：\"乐羊以我故而食其子之肉。\"答曰：\"其子而食之，且谁不食？\"乐羊罢中山，文侯赏其功而疑其心。"},{"id":"a214","t":"黎丘丈人","u":"第 三十六 单 元","x":"世传黎丘有奇鬼，喜效人之子侄昆弟之状。邑丈人②有之市而醉归者，黎丘之鬼效其子之状，扶而道苦之。丈人归，酒醒，而诮其子曰\"吾为汝父也，岂谓不慈哉！我醉，汝道苦我，何故？\"其子泣而触地曰：\"孽矣！无此事也。昔也往责于东邑，人可问也。\"其父信之，曰：\"嘻！是必夫奇鬼也。我固尝闻之矣。\"明日，故复饮于市，欲遇而刺杀之。其真子恐其父醉而不能反也，遂迎之。丈人望其真子，以为奇鬼，拔剑而刺杀之。丈人之智惑于似其真子，而杀其真子。"},{"id":"a215","t":"猩猩嗜酒","u":"第 三十六 单 元","x":"猩猩，兽之嗜酒者也。山麓之人，设以醴，陈之饮器，大小具列焉。又织草为履，使相属也，而置之道旁。猩猩见则知其诱之也，又知设者之姓名与其父母祖先，一一数而骂之。已而谓其朋曰：\"盍少尝之？慎勿多饮也。\"相与取小器饮，骂而去之。已而取差大者饮，又骂而去之。如是者数四，不胜其唇吻之甘也，遂大釂而忘其醉。醉则群睨嬉笑，取草履着之。麓人追之，其履相絷，无一得免焉。夫猩猩智，恶其为诱而卒不免于死，贪为之也！"},{"id":"a216","t":"择婿","u":"第 三十六 单 元","x":"唐人榜下择婿，多迫于势而非愿者。一少年中榜而美姿，为贵人所慕，命群仆拥至其第。少年欣然而行，略无避逊。既至，观者如堵。须臾，有衣金紫者②出，曰：\"某有女颇良，愿配君子，何如？\"少年揖而答曰：\"寒微得托高门固幸，然须归家与妻子商量，如何？\"众人大笑而去。"},{"id":"a217","t":"五十步笑百步（阅读）","u":"第 三十七 单 元","x":"梁惠王曰：\"寡人之于国也，尽心焉耳矣。河内凶，则移其民于河东，移其粟于河内。河东凶亦然。察邻国之政，无如寡人之用心者。邻国之民不加少，寡人之民不加多，何也？\"孟子对曰：\"王好战，请以战喻。填然鼓之，兵刃既接，弃甲曳兵而走。或百步而后止，或五十步而后止。以五十步笑百步，则如何？\"曰：\"不可，直不百步耳，是亦走也。\"曰：\"王如知此，则无望民之多于邻国也。\""},{"id":"a218","t":"唐玄宗宠爱安禄山","u":"第 三十七 单 元","x":"唐玄宗宠安禄山，呼禄山为子。尝于便殿与杨贵妃同宴坐，禄山每就见，不拜玄宗而拜杨贵妃。玄宗问曰：\"此胡不拜我而拜妃子，意何在也？\"禄山对曰：\"臣胡人，但知有母，不知有父故也。\"帝笑而舍之。禄山丰肥硕腹，帝尝问曰：\"此胡腹中何物？其大乃尔？\"禄山答曰：\"臣腹中更无他物，唯赤心耳。\"帝以其言诚，而益亲善之。"},{"id":"a219","t":"子贡论孔子","u":"第 三十七 单 元","x":"齐景公谓子贡曰：\"子谁师？\"曰：\"臣师仲尼。\"公曰：\"仲尼贤乎？\"对曰：\"贤。\"公曰：\"其贤若何？\"对曰：\"不知也。\"公曰：\"子知其贤而不知若何，可乎？\"对曰：\"今谓天高，无少长愚智皆知高，高几何，皆曰不知也，是以知仲尼之贤而不知其若何。\""},{"id":"a220","t":"山猫与雄鸽","u":"第 三十七 单 元","x":"叶侯之家，获二鸽，缚其翅而畜之野。狸者知其不能飞也，而食其雌。雄者怒，奋其喙啄狸，狸攫而去。不数日，复获一雌焉。狸又至而食之。然向之为雄所啄，若惮雄。雄因恃其强，不为备。居无何，竟为狸所食。"},{"id":"a221","t":"范仲淹罢宴","u":"第 三十七 单 元","x":"范仲淹守邠州，暇日率僚属登楼置酒。未举觞②，见衣丧服者数人营理葬具，意哀甚。公亟令询之，乃寓居士人卒于邻，将出殡近郊而棺未具。公怃然，即撤宴席，厚赒之，使毕其事。坐客感叹有泣下者。"},{"id":"a222","t":"二鸿情深","u":"第 三十七 单 元","x":"有弋人得一鸿，其雄者随而飞抵其家，哀鸣徘徊，至暮始去。翌日又至，弋人并捉之，见其伸颈俯仰，吐出黄金半锭。弋人悟其意，乃曰：\"是将以赎妇也。\"鸿颔之。遂释二鸿。二鸿遂双飞而去。弋人称金，得二两六钱强。噫！禽兽何知，而钟情若此！悲莫悲于生别离，岂物亦然哉？"},{"id":"a223","t":"魏武见匈奴使（阅读）","u":"第 三十八 单 元","x":"魏武将见匈奴使，自以形陋，不足雄远国，使崔季珪代。帝自捉刀立床头。既毕，令间谍问曰：\"魏王如何？\"匈奴使答曰：\"魏王雅望非常，然床头捉刀人，此乃英雄也。\"魏武闻之，追杀此使。"},{"id":"a224","t":"桥玄论曹操","u":"第 三十八 单 元","x":"太祖少机警，有权数，而任侠放荡，不治行业，故世人未之奇也。唯桥玄、何颙异焉。玄谓太祖曰：\"天下将乱，非命世之才③不能济也，能安之者，其在君乎!\""},{"id":"a225","t":"赵威后问齐使","u":"第 三十八 单 元","x":"齐王使使者问赵威后。书未发，威后问使者曰：\"岁亦无恙耶？民亦无恙耶？王亦无恙耶？\"使者不说，曰：\"臣奉使使威后，今不问王而先问岁与民，岂先贱而后尊贵者乎？\"威后曰：\"不然。苟无岁，何以有民？苟无民，何以有君？故有舍本而问末者耶？\""},{"id":"a226","t":"老农指瑕","u":"第 三十八 单 元","x":"马知节尝珍其所藏戴嵩《斗牛图》。暇日展曝于厅前。有输租氓③见而窃笑。公疑之，问其故。对曰：\"农非知画，乃识真牛。方其斗时，夹尾于髀间，虽壮夫力不能出之。此图皆举其尾，似不类矣。\"公为之叹服。"},{"id":"a227","t":"伊犁凿井","u":"第 三十八 单 元","x":"伊犁城中无井，皆汲水于河。一佐领曰：\"戈壁皆积沙无水，故草木不生。今城中多老树，苟其下无水，树安得活？\"乃拔木就根下凿井，果具得泉，但汲水以修绠耳。古称雍州土厚水深，不谬也。"},{"id":"a228","t":"郑武公伐胡","u":"第 三十八 单 元","x":"昔者郑武公欲伐胡，故先以其女妻胡君，以娱其意。因问于群臣：\"吾欲用兵，谁可伐者？\"大夫关其思对曰\"胡可伐。\"武公怒而戮之，曰：\"胡，兄弟之国也，子言伐之，何也？\"胡君闻之，以郑为亲己，遂不备郑。郑人袭胡，取之。"}],"lex":[{"w":"及","m":"等到。","u":[{"id":"a14","t":"木屑竹头","s":"尝造船，其木屑竹头，侃皆令籍而掌之。人咸不解所以。后正会，积雪始晴，厅事前余雪犹湿，乃以木屑布地。及桓温伐蜀，又以侃所贮竹头作钉装船。"},{"id":"a211","t":"甘戊与船夫（阅读）","s":"甘戊使于齐，渡大河。船人曰：\"河水间耳，君不能自渡，能为王者之说乎？\"甘戊曰：\"不然，汝不知也！物各有短长：谨愿敦厚，可事主，不施用兵;骐骥，足及千里，置之宫室"}]},{"w":"其","m":"指代书舍里的学生。","u":[{"id":"a44","t":"邴原泣学","s":"原少孤，数岁时过书舍而泣。师曰：\"童子何泣？\"原曰：\"凡得学者，有亲也。一则羡其不孤，二则羡其得学，中心感伤，故泣耳。\"师恻然曰：\"苟欲学，不须资也。\""}]},{"w":"为","m":"给，与。","u":[{"id":"a89","t":"隽不疑之母","s":"隽（juàn）不疑每行县录囚徒，还，其母问不疑：\"有何平反？活几何人？\"即不疑言多有所平反，母喜，笑为饮食，语言异于他时;或亡所出，母怒，为之不食。故不疑为吏，"},{"id":"a130","t":"郗雍视盗","s":"晋国苦盗。有郗雍者，能视盗之貌。晋侯使视盗，千百无一遗焉。晋侯大喜，告赵文子曰：\"吾得一人，而一国盗为尽矣，奚用多为？\"文子曰：\"吾君恃伺察得盗，盗不尽矣！且雍"}]},{"w":"耳","m":"拧小狼的蹄子和耳朵。","u":[{"id":"a143","t":"牧童逮狼","s":"两牧童入山至狼穴，穴中有小狼二。谋分捉之，各登一树，相去数十步。少顷，大狼至，入穴失子，意甚仓皇。童于树上扭小狼蹄、耳，故令嗥。大狼闻声仰视，怒奔树下，且号且抓"}]},{"w":"而","m":"若。","u":[{"id":"a158","t":"田子方诫子击","s":"子击出，遭田子方②于道，下车伏谒。子方不为礼。子击怒，谓子方曰：\"富贵者骄人乎？贫贱者骄人乎？\"子方曰：\"亦贫贱者骄人耳！富贵者安敢骄人！国君而骄人，则失其国；"}]},{"w":"以","m":"凭。","u":[{"id":"a217","t":"五十步笑百步（阅读）","s":"梁惠王曰：\"寡人之于国也，尽心焉耳矣。河内凶，则移其民于河东，移其粟于河内。河东凶亦然。察邻国之政，无如寡人之用心者。邻国之民不加少，寡人之民不加多，何也？\"孟"}]}],"units":[{"name":"第 一 单 元","items":[{"id":"a1","t":"· 李存审诫子（阅读）"},{"id":"a2","t":"· 刘裕诫子孙"},{"id":"a3","t":"· 田父遗产"},{"id":"a4","t":"· 包拯家训"},{"id":"a5","t":"· 不肖子有\"三变\""},{"id":"a6","t":"· 蔡京子孙"}]},{"name":"第 二 单 元","items":[{"id":"a7","t":"· 字期清爽（阅读）"},{"id":"a8","t":"· 张丞相好草书"},{"id":"a9","t":"· 宋太宗学书"},{"id":"a10","t":"· 农夫杀牛"},{"id":"a11","t":"· 欧阳修不喜释氏"},{"id":"a12","t":"· 义犬报火警"}]},{"name":"第 三 单 元","items":[{"id":"a13","t":"· 陶侃惜分阴（阅读）"},{"id":"a14","t":"· 木屑竹头"},{"id":"a15","t":"· 董遇论\"三余\""},{"id":"a16","t":"· 桓荣勤学不倦"},{"id":"a17","t":"· 晋平公游于河"},{"id":"a18","t":"· 黄公好谦卑"}]},{"name":"第 四 单 元","items":[{"i
