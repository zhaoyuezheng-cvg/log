<script>
window.BOOKS = [{"name":"走进文言文（六、七年级用）","short":"六、七年级","file":"classical-chinese-grades-6-7.html","stat":{"articles":228,"units":38,"lex":3849,"key":76,"q":534},"arts":[{"id":"a1","t":"黄琬聪慧","u":"第 一 单 元","x":"黄琬①早而辩慧②。祖父琼，初为魏郡③太守。建和元年正月日食④，京师不见而琼以状闻⑤。太后诏⑥问所食多少，琼思其对而未知所况⑦。琬年七岁，在傍，曰：\"何不言日食之余，如月之初？\"琼大惊，即以其言应诏，而深奇爱之。"},{"id":"a2","t":"1．杨修啖酪","u":"第 一 单 元","x":"人饷魏武①一杯酪②。魏武啖少许，盖头上题\"合\"字，以示众。众莫之解。次至杨修③，修便啖，曰：\"公教人啖一口也，复何疑？\""},{"id":"a3","t":"2．王戎识李","u":"第 一 单 元","x":"王戎①七岁，尝与诸小儿游。看道边李树多子折枝，诸儿竞走取之，唯王戎不动。人问之，答曰：\"树在道旁而多子，此必苦李。\"取之，信然。"},{"id":"a4","t":"3．诸葛恪添驴","u":"第 一 单 元","x":"诸葛恪（kè）字元逊，诸葛亮兄瑾①之长子也。恪父瑾面长似驴②。一日，孙权大会群臣，使人牵一驴入，以纸题其面曰：诸葛子瑜。恪跪曰：\"乞请笔益两字。\"因听与笔。恪续其下曰：\"之驴。\"举坐欢笑。权乃以驴赐恪。"},{"id":"a5","t":"4．谢道韫咏絮","u":"第 一 单 元","x":"晋名将谢安，寒雪日内集①，与儿女辈讲论文义。俄而雪骤，公欣然曰：\"白雪纷纷何所似？\"兄子胡儿曰：\"撒盐空中差可拟②。\"兄女道韫（yùn）曰：\"未若柳絮因风起。\"公大笑乐。"},{"id":"a6","t":"5．曹冲称象","u":"第 一 单 元","x":"曹冲①生五六岁，智意②所及，有若成人。时孙权③尝致巨象，太祖④欲知其斤重，访之群下，咸莫能出其理。冲曰：\"置象大船之上，而刻其水痕所至，称物以载之，则校可知。\"太祖悦，即施行焉。"},{"id":"a7","t":"陆绩怀橘","u":"第 二 单 元","x":"绩①年六岁，于九江②见袁术③。术出橘，绩怀三枚；去，拜辞④堕地。术谓曰：\"陆郎作宾客而怀橘乎？\"绩跪答曰：\"欲归遗母。\"术大奇之⑤。"},{"id":"a8","t":"1．黄香温席","u":"第 二 单 元","x":"昔汉时黄香，江夏①人也。年方九岁，知事亲之理。每当夏日炎热，则扇父母之帷帐②，令枕席清凉，蚊蚋③远避，以待亲之安寝；至于冬日严寒，则以身暖其亲之席，以待亲之暖卧。于是名播京师，号曰：\"天下无双，江夏黄香\"。"},{"id":"a9","t":"2．陈遗贮焦饭","u":"第 二 单 元","x":"陈遗至孝。母喜食釜底焦饭。遗作郡主簿①，恒备一囊，每煮食，辄贮焦饭，归而遗母。后值孙恩掠郡，郡守袁山松即日出征。时遗已聚敛得数斗②焦饭，未及归家，遂携而从军。与孙恩战，败，军人溃散，遁入山泽，无以为粮，有饥馁而死者。遗独以焦饭得活，时人以为至孝之报也。"},{"id":"a10","t":"3．哑孝子","u":"第 二 单 元","x":"崔长生，生而哑，性至孝；人呼\"哑孝子\"。孝子既哑，左手复挛，佣工养其父母。后乡里大饥①，孝子行乞于外，人悯之，遗②以糟糠，受而纳诸箪，自掘野草以食。归则扶其跛父病母于茅檐下，尽倾箪中物敬父母，父母赖以活。一日，途见故纸，中有遗金③，守待失者而不得。月余，未见有求者，乃易猪饲之。猪蕃息④，遂为父母备棺。孝子待人，诚而信。父母先后卒，哭之恸，棺葬于野，后不知孝子所之。"},{"id":"a11","t":"4．郑人买履","u":"第 二 单 元","x":"郑①人有欲买履者，先自度其足，而置之其坐，至之市而忘操之。已得履，乃曰：\"吾忘持其度。\"反归取之。及反，市罢，遂不得履。人曰：\"何不试之以足？\"曰：\"宁信度，无自信也。\""},{"id":"a12","t":"5．鲁人锯竿入城","u":"第 二 单 元","x":"鲁①有执长竿入城门者，初竖执之，不可入。横执之，亦不可入。计无所出。俄有老父②至，曰：\"吾非圣人③，但见事多矣，何不以锯中截而入。\"遂依而截之。世之愚，莫之及也。"},{"id":"a13","t":"文徵明习字","u":"第 三 单 元","x":"文徵明临写①《千字文》②，日以十本为率③，书遂大进。平生于书，未尝苟且④，或答人简札⑤，少不当意，必再三易之不厌，故愈老而愈益精妙。"},{"id":"a14","t":"1．智永退笔冢","u":"第 三 单 元","x":"永公①住吴兴②永欣寺，积年学书，后有秃笔头十瓮③，每瓮皆数石④。人来觅书，并请题额者如市，所居户限⑤为之穿穴，乃用铁叶裹之，人谓\"铁门限\"。后取笔头瘗⑥之，号为\"退笔冢\"。"},{"id":"a15","t":"2．一箧磨穴砚","u":"第 三 单 元","x":"古人有学书于人者，自以为艺成，辞而去。师曰：\"吾有一箧①物，不欲付他人，愿托置于某山下。\"其人受之，因其封题②不甚密，乃启而视之，皆磨穴之砚也，数十枚，方知师夙用者。顿觉羞愧，乃反而学，至精其艺。"},{"id":"a16","t":"3．王羲之书六角扇","u":"第 三 单 元","x":"王羲之，东晋之大书法家也。尝在蕺山①见一老姥，持六角扇卖之。羲之书其扇，各为五字。姥初有愠色。羲之因谓姥曰：\"但言王右军②书，以求百钱耳。\"姥如其言，人竞买之。他日，姥复见羲之，求其书之。羲之笑而不答。"},{"id":"a17","t":"4．掩耳盗钟","u":"第 三 单 元","x":"有得钟①者，欲负而走，则钟大不可负，以锤毁之，钟况然②有声。恐人闻之而夺己也，遽掩其耳。"},{"id":"a18","t":"5．红毛毡","u":"第 三 单 元","x":"红毛国①，旧许与中国相贸易。边帅见其众，不许登岸。红毛人固请赐一毡地足矣。帅思一毡所容无几，许之。其人置毡岸上，但容二人，拉之容四五人。且拉且登，顷刻毡大亩许，已数百人矣。短刃并发，出于不意，被掠数里而去。"},{"id":"a19","t":"\"辨钟\"辨盗","u":"第 四 单 元","x":"陈述古密直①，曾知建州浦城县②。富民失物，捕得数人，莫知③的为盗者。述古绐④曰：\"某寺有一钟，至灵，能辨盗。\"使人迎置后阁⑤祠⑥之。引囚立钟前，谕⑦曰：\"不为盗者摸之无声，为盗者则有声。\"述古自率同职祷钟甚肃，祭讫以帷围之。乃阴使人以墨涂钟，良久，引囚逐一以手入帷摸之。出而验其手，皆有墨，一囚独无墨，乃见真盗——恐钟有声，不敢摸者。讯之即服。"},{"id":"a20","t":"1．盲子窃钱案","u":"第 四 单 元","x":"有瞽①者与贩者同宿旅店，窃贩者钱五千，次晨相哄鸣于官。官即提讯，问贩者钱有无记认②，贩者曰：\"此乃日用之物，有何记号！\"问瞽者，对曰：\"有记，吾钱系字③对字、背对背穿成。\"对之良是。贩者不服。官命瞽者伸手，则两掌青黑，铜痕宛然，其为摸索一夕而穿无疑。乃责瞽者，而令贩者取钱去。"},{"id":"a21","t":"2．张佐治遇蛙","u":"第 四 单 元","x":"金华①郡守②张佐治至一处，见蛙无数，夹道鸣噪，皆昂首若有诉。佐治异之，下车步视，而蛙皆踊跃为前导。至田间，三尸叠焉。公有力，手挈二尸起，其下一尸微动，以汤灌之，未几复苏。曰：\"我商也，道见二人肩两筐适市，皆蛙也，购以放生。二人复曰：'此皆浅水，虽放，后必为人所获；前有清渊，乃放生池也。'吾从之至此，不意挥斤，遂被害。二人随我后不远，腰缠百金，必为二人诱至此，并杀而夺金也。\"张佐治至郡，急令捕之，不日人金俱获。一讯即吐实，罪死，所夺之金归商。"},{"id":"a22","t":"3．焚猪见真情","u":"第 四 单 元","x":"张举，吴①人也，为句章②令。邑有妻杀夫者，因放火烧舍，称\"火烧夫死\"。夫家疑之，讼于官。妻不服。举③乃取猪二口：一杀之，一活之，而积薪焚之，活者口中有灰，杀者口中无灰。因验尸，口果无灰也，鞫④之服罪。"},{"id":"a23","t":"4．蜜中鼠屎案","u":"第 四 单 元","x":"孙亮①出②西苑，方食生梅，使黄门③至宫中藏取蜜渍梅。蜜中有鼠屎。召问藏吏，藏吏叩头。亮问吏曰：\"黄门从汝求蜜耶？\"曰：\"向求，实不敢与。\"黄门不服，侍中④刁玄、张邠(bīn)启：\"黄门、藏吏辞语不同，请付狱⑤推尽⑥。\"亮曰：\"此易知耳。\"令破鼠矢⑦，矢里燥。亮大笑谓玄、邠曰：\"若矢先在蜜中，中外当俱湿；今外湿里燥，必是黄门所为。\"黄门首服⑧，左右莫不惊悚。"},{"id":"a24","t":"5．谜语一则","u":"第 四 单 元","x":"王荆公①戏作谜语：\"画时圆，写时方；冬时短，夏时长。\"吉甫②解云：\"东海有一鱼，无头亦无尾，更除脊梁骨，便是这个谜。\""},{"id":"a25","t":"鹦鹉灭火","u":"第 五 单 元","x":"有鹦鹉飞集他山①，山中禽兽辄相贵重②。鹦鹉自念：虽乐，不可久也，便去③。后数日，山中大火，鹦鹉遥见，便入水濡羽④，飞而洒之。天神言：\"汝虽有志⑤，意何足云也⑥？\"对曰：\"虽知不能，然吾侨居⑦是山，禽兽善行⑧，皆为兄弟，不忍见⑨耳！\"天神嘉感，即为灭火。"},{"id":"a26","t":"1．鳝救婢","u":"第 五 单 元","x":"高怀中，业鳝面于扬州①小东门，日杀鳝以千数。一婢②悯之，每夜窃部分缸中鳝从后门投诸河。如是累年。一日面店被焚，婢仓皇出逃，为火所伤，困于河滨。夜深入睡，比醒而痛减，伤尽愈。视之，有河中污泥敷于伤处，而周③有鳝之行迹，始知向所放生之鳝来救也。高怀中感其异，遂为之罢业。及拆锅，下有洞，生鳝无数盘其中，悉纵之于河。"},{"id":"a27","t":"2．二鹊救友","u":"第 五 单 元","x":"某氏园中，有古木，鹊巢其上，孵雏将出。一日，鹊徊翔其上，悲鸣不已。顷之，有群鹊鸣渐近，集古木上，忽有二鹊对鸣，若相语状，俄而扬去。未几，一鹳①横空而来，\"咯咯\"作声，二鹊亦尾其后。群鹊见而噪，若有所诉。鹳又\"咯咯\"作声，似允所请。鹳于古木上盘旋三匝②，遂俯冲鹊巢，衔一赤蛇吞之。群鹊喧舞，似庆且谢也。盖二鹊招鹳援友也。"},{"id":"a28","t":"3．知恩图报","u":"第 五 单 元","x":"秦穆公①尝出而亡其骏马，自往求之，见人已杀其马，方共食其肉。穆公谓曰：\"是吾骏马也。\"诸人皆惧而起。穆公曰：\"吾闻食骏马肉不饮酒者杀人②。\"即饮之酒。杀马者皆惭而去。居三年，晋攻秦穆公，围之。往时食马者相谓曰：\"可以出死报食马得酒之恩矣。\"遂溃围，穆公卒得以解难，胜晋，获惠公③以归。"},{"id":"a29","t":"4．蝙蝠","u":"第 五 单 元","x":"凤凰①寿，百鸟朝贺。唯蝙蝠不至。凤责之曰：\"汝居吾下，何倨傲乎？\"蝠曰：\"吾有足，属于兽，贺汝何以？\"一日，麒麟②诞，蝠亦不至。麟亦责之。蝠曰：\"吾有翼，属于禽，何以贺与？\"麟凤相会，语及蝙蝠之事，互相慨叹曰：\"如今世上恶薄③，偏生此等不禽不兽之徒，真乃无奈他何！\""},{"id":"a30","t":"5．杀驼破瓮","u":"第 五 单 元","x":"曩有一人，先瓮①中盛谷。骆驼入头瓮中食谷，首不得出。既不得出，其人患之。有一老父②来诳之曰：\"女莫愁，吾教女出。女当斩头，自能出之。\"即用其语，以刀斩头。既杀驼，复破瓮。如此痴人，世人所笑。"},{"id":"a31","t":"鼠画逼真","u":"第 六 单 元","x":"东安①一士人善画，作鼠一轴②，献之邑令③。令初不知爱，漫悬于壁。旦而过之，轴必坠地，屡悬屡坠。令怪之，黎明物色④，轴在地而猫蹲其旁。逮举轴，则踉跄⑤逐之。以试群猫，莫不然者。于是始知其画为逼真。"},{"id":"a32","t":"1．虎画","u":"第 六 单 元","x":"予友人工画虎，其庐之四壁咸虎画：或腾或扑，或吼或奔，或挈幼或独行，形态各异，皆毕肖。吾尝乞得一轴①，高二尺奇②，宽二尺许。其二虎，雌雄各一。雄者踞于石，昂首远视，张口若呼啸状；雌者伏于侧，足前伸，神情怡然。旁有奇石三四，似助威也。余县诸东壁，爱甚。"},{"id":"a33","t":"2．正午牡丹","u":"第 六 单 元","x":"欧阳公①尝得一古画牡丹丛，其下有一猫，未识精粗。丞相正肃吴公②与欧阳公姻家，一见曰：\"此正午牡丹也。何以明之？其花披哆③而色燥，此日中之花也；猫眼黑暗如线，此正午猫眼也。有带露花，则房④敛而色泽；猫眼早暮则睛圆，日渐中狭长，正午则如一线。\"此善求古人笔意也。"},{"id":"a34","t":"3．朱元璋画像","u":"第 六 单 元","x":"明太祖朱元璋尝集画工写御容①，多不称旨。有笔意逼真者，自以为必见赏，及进览，亦然。一工探知上意，稍稍于形似之外，加穆穆②之容以进。上览之，甚喜，乃命写数本以赐诸王③。盖上之意早有，而它工不能知也。"},{"id":"a35","t":"4．苏东坡画扇","u":"第 六 单 元","x":"东坡官钱塘①日，有人诉负钱二万不偿者。公②呼而诘之，云：\"吾家以制扇为业，适父死，而又自今春以来，连雨天寒，所制扇不售③，非故负之也。\"公熟视久之，曰：\"姑取汝所制扇来，吾当为汝发市④也。\"须臾扇至，公取二十扇，就判笔⑤行行书草圣⑥及枯木竹石，顷刻而成，即付之曰：\"出外速偿所负资也。\"其人抱扇而涕下。始逾府门，人以千钱竞购一扇，立尽。"},{"id":"a36","t":"5．铁杵磨针","u":"第 六 单 元","x":"磨针溪，在眉州①象耳山下。世传李太白读书山中，未成，弃去。过小溪，逢老媪，方磨铁杵②，问之，曰：\"欲作针。\"太白感其意，还卒业。媪自言姓武。今溪旁有武氏岩。"},{"id":"a37","t":"范仲淹有志于天下（阅读）","u":"第 七 单 元","x":"范仲淹二岁而孤，母贫无依，再适长山朱氏。既长，知其世家，感泣辞母，去之南都入学舍。昼夜苦学，五年未尝解衣就寝。或夜昏怠，辄以水沃面。往往饘粥不充，日昃始食；遂大通六经之旨，慨然有志于天下。常自诵曰：“当先天下之忧而忧，后天下之乐而乐。”"},{"id":"a38","t":"1．食粥心安","u":"第 七 单 元","x":"范仲淹家贫，就学于南都书舍，日煮粥一釜，经夜遂凝，以刀画为四块，早晚取其二，断齑数十茎啖之。留守有子同学，归告其父，馈以佳肴。范置之，既而悉败矣。留守子讶曰：“大人闻汝清苦，遗以食物，何为不食？”范曰：“非不感厚意，盖食粥安之已久，今遽享盛馔，后日岂能复啖此粥乎？”"},{"id":"a39","t":"2．鉴真东渡日本","u":"第 七 单 元","x":"唐高僧鉴真，本姓淳于，扬州江阳人，年十四出家为僧。稍长，遍游长安、洛阳，寻问名师，专研戒律。天宝元年，应日僧普照辈延，东渡日本。然东海风骤浪高，或船覆，或粮匮，或失向，历十二载，五渡未成。其时僧目盲，唯志不渝。天宝十二年，竟至日，翌年于奈良东建戒台，授戒法。"},{"id":"a40","t":"3．年少志存高远","u":"第 七 单 元","x":"昔有一少年，家贫甚，伐薪自食，夜则映月以览。邻村有富者，衣锦食肉，恒炫于众。一日富者出猎，左右持弓，鹰犬罗后，途与少年遇。富者众辱之，曰：“尔贫如此，尚不及吾之鹰犬。”少年不应。富者复曰：“尔随吾后，与鹰犬同逐狐兔，先得者赏尔！”少年作色曰：“吾虽家徒壁立，然志存高远，非若等鼠辈可比！”左右欲殴之，少年目斥之：“尔辈亦鹰犬也！”不顾而去。"},{"id":"a41","t":"4．陈蕃有大志","u":"第 七 单 元","x":"陈蕃年十五，尝闲处一室，而庭宇芜秽。父友同郡薛勤来候之，谓蕃曰：“孺子何不洒扫以待宾客？”蕃曰：“大丈夫处世，当扫除天下，安事一室乎？”勤知其有清世志，甚奇之。"},{"id":"a42","t":"5．画龙点睛","u":"第 七 单 元","x":"张僧繇于金陵安乐寺，画四龙于壁，不点睛。每曰：“点之即飞去。”人以为诞，因点其一。须臾，雷电破壁，一龙乘云上天。不点睛者皆在。"},{"id":"a43","t":"包惊几笃于友谊（阅读）","u":"第 八 单 元","x":"包惊几笃(dǔ)于友谊，与吴东湖善。吴卒，抚其家甚至。后方嫁女，闻吴女将适人，贫不能理装，即以其女之奁(lián)具赠之，己女后一载始嫁。时论称之。（节选自王晫《今世说》）"},{"id":"a44","t":"1. 黄仙裳济友","u":"第 八 单 元","x":"泰州守田雪龛(kān)居官廉，黄仙裳与周旋，绝不干以私。后田落职，在州不得去。黄自汝宁归，囊中但有二十金。乃先至田寓，分其半以赠。后语人曰：\"是日吾先至家，则家中需金甚亟(jí)，不得分以赠田矣。\""},{"id":"a45","t":"2. 刘氏善举","u":"第 八 单 元","x":"刘氏者，某乡寡妇也。育一儿，昼则疾耕于田亩，夜则纺织于烛下，竟年如是。邻有贫乏者，刘氏辄(zhé)以斗升相济。偶有无衣者，刘氏以己之衣遗(wèi)之。乡里咸称其善。然儿不解，心有憾。母诫之，曰：\"与人为善，乃为人之本，谁无缓急之事。\"母卒三年，刘家大火，屋舍衣物殆尽，乡邻给衣物，且为之伐木建第，皆念刘氏之情也。时刘儿方悟母之善举也。"},{"id":"a46","t":"3. 李氏之友","u":"第 八 单 元","x":"黄生，乃李氏少时之友也。越十年，二人遇于途。李氏要(yāo)至其家，杀鸡作食。二鼓许，黄生腹痛，汗大若珠。李氏夫妇恐甚，欲延医治之。黄生固止之，以为旧疾复作，无妨。李不听，即去。时值暴雨，漫天乌黑，山道崎岖，路滑难行。逾半夜，携医归。医灸之，少时即愈。黄生曰：\"汝为吾苦矣，何以报？\"李氏夫妇曰：\"汝为我友，当悉心以待，何报之有？\"翌日天朗，黄生辞行。"},{"id":"a47","t":"4. 田真兄弟","u":"第 八 单 元","x":"京兆田真兄弟三人，共议分财。生资皆平均，唯堂前一株紫荆树，共议欲破三片。翌日就截之，其树即枯死，状如火然。真往见之，大愕，谓诸弟曰：\"树本同株，闻将分斫(zhuó)，故憔悴，是人不如木也。\"因悲不自胜，不复解树。树应声荣茂，兄弟相感，遂和睦如初。"},{"id":"a48","t":"5. 张用良不杀蜂","u":"第 八 单 元","x":"太仓张用良，幼时揭蜂窝，尝为蜂螫(shì)，故恶(wù)之。后见蜂则百计千方扑杀之。一日薄暮，见一飞虫，投于蛛网，竭力而不得去。蛛遽(jù)束缚之，甚急。忽一蜂来螫蛛，蛛避。蜂又数含水湿虫，久之得脱去。张用良因感其义，自是不复杀蜂。"},{"id":"a49","t":"放驴破案（阅读）","u":"第 九 单 元","x":"唐张鹫(zhuó)为河阳①尉。有客驴，缰断，并②鞍失之。三日访③不获，诣县告。鹫推穷④甚急，乃夜放驴出而藏其鞍。鹫曰：\"此可知也。\"遂令不秣饲驴⑤，去辔⑥放之。驴寻向昨夜喂处，乃搜索其家，于草积下得之。人服其智。（节选自《折狱龟鉴》）"},{"id":"a50","t":"1. 赛跑定案","u":"第 九 单 元","x":"有老姥遇劫于路，唱贼。路人为逐禽之。贼反诬路人。时已昏黑，莫知其孰是，乃俱送之。融见而笑曰：\"此易知耳，可二人并走，先出凤阳门者非贼。\"既而还入，融正色谓后出者曰：\"汝真贼也，何诬人乎？\"贼遂服罪。盖因贼若善走，必不被禽，故知不善走者贼也。"},{"id":"a51","t":"2. 拷打羊皮露真相","u":"第 九 单 元","x":"人有负盐与负薪者，二人同释重担，息于树阴下。少时，且行，二人争一羊皮，各言为己藉肩之物。久未果，遂讼于官。时雍州刺史①李惠，谓其群下曰：\"拷此羊皮可知主乎？\"群下咸无对者。惠遣争者出，令人置羊皮席上，以杖击之，见少盐屑，惠曰：\"知其实矣！\"使争者视之，负薪者乃服罪。"},{"id":"a52","t":"3. 钱若赓断鹅","u":"第 九 单 元","x":"明万历中，钱若赓(gēng)守临江，有异政。有乡人持一鹅入市，寄店中后他往。还，索鹅，店主赖之，云：\"群鹅我鹅也。\"乡人不平，讼于官。公令人取店中鹅，计四只，各以一纸，给笔砚，分四处，令其供状。人莫不怪之。食顷，使人问鹅供状不？答曰：\"未。\"又顷，下堂视之，曰：\"状已供矣。\"守指一鹅曰：\"此乡人鹅。\"众人怪之，守曰：\"乡人鹅食草，粪色青；店鹅食谷粟，粪色黄。\"店主服罪。"},{"id":"a53","t":"4. 欧阳晔破案","u":"第 九 单 元","x":"欧阳晔(yè)治鄂州。民有争舟而相殴致死者，狱久不决。晔自临其狱，坐囚于庭中，去其桎梏而饮食之，食讫，悉劳而还之狱。独留一人于庭，留者色变而惶顾。晔曰：\"杀人者汝也！\"囚佯为不知所以。晔曰：\"吾观食者皆以右手持箸，而汝独以左。今死者伤在右肋，非汝而谁？\"囚无以对。"},{"id":"a54","t":"5. 螳螂杀蛇","u":"第 九 单 元","x":"张姓者，偶行溪谷，闻崖上有声甚厉。寻途登觇，见巨蛇粗如碗，摆扑丛树中，以尾击树，树枝崩折，似有物制之。然熟视而无所见，大惑。渐近临视，则一螳螂据顶上，以刺刀攫其首，掉不可去。久之，蛇竟死。视额上革肉，已破裂矣。（选自清·蒲松龄《聊斋志异·螳螂捕蛇》）"},{"id":"a55","t":"伯乐爱马（阅读）","u":"第 十 单 元","x":"骥①服盐车上太行，漉汁洒地，白汗交流，中阪迁延，负不能上。伯乐遭之，下车攀而哭之，解纻衣以幕之。骥于是俯而喷，仰而鸣，声造于天，欣伯乐之知己也。 （节选自《初潭集》）"},{"id":"a56","t":"1. 人有卖骏马者","u":"第 十 单 元","x":"人有卖骏马者，比三旦立市，人莫之知。往见伯乐，曰：\"臣有骏马，欲卖之，比三旦立于市，人莫与言。愿子还而视之，去而顾之，臣请献一朝之贾。\"伯乐乃还而视之，去而顾之，一旦而马价十倍。"},{"id":"a57","t":"2. \"的卢\"救主","u":"第 十 单 元","x":"刘备屯兵樊城①，时荆州②刺史③刘表礼焉，然不甚信用。表尝延备赴宴，其下蔡瑁等欲因取备。备觉之，佯如④厕，潜遁去。其所乘马名\"的卢\"。备骑\"的卢\"走堕城西檀溪水中，溺不能出。备亟曰：\"的卢，的卢！今日危矣，可努力！\"的卢乃一踊三丈，遂得以过水。 （节选自《世说新语》）"},{"id":"a58","t":"3. 马啮盗","u":"第 十 单 元","x":"董熙载应友人延，至其家豪饮。自午及薄暮，已酩醉矣。友人留其宿，熙载曰：\"毋庸①，吾尚可乘马返家。\"时月黑风骤，未几醉而堕马，僵仆道边，马缰持于手。忽有盗过，自喜曰：\"天赞我也！\"遂尽解其衣，又欲盗其马。方俯身执缰，马遽啮其髻②，竭力挣扎而不得去。待熙载醉醒，尽复取所失物，马乃纵盗。"},{"id":"a59","t":"4. 王行思爱马","u":"第 十 单 元","x":"有富民王行思，尝养一马，甚爱之，饲秣甚于他马。一日乘往本郡，值夏潦暴涨。舟子先济马，回舟以迎行思，至中流，风骤起船覆。其马自岸跃入骇浪，接其主，苍茫之中，遽免沉溺。 （节选自《太平广记》）"},{"id":"a60","t":"5. 齐人攫金","u":"第 十 单 元","x":"昔齐人有欲金者，清旦衣冠而之市，适①鬻金者之所，因②攫其金而去。吏捕得之，问曰：\"人皆在焉，子③攫人之金何？\"对曰：\"取金之时，不见人，徒④见金。\" （节选自《列子·说符》）"},{"id":"a61","t":"猱（阅读）","u":"第 十一 单 元","x":"兽有猱①，小而善缘②，利爪。虎首痒，则使猱爬搔之。久而成穴，虎殊快，不觉也。猱徐取其脑啖③之，而以其余奉④虎。虎谓其忠，益爱近之。久之，虎脑空，痛发，迹⑤之，则已走避高木。虎跳跟⑥大吼，乃死。 （节选自《古今谭概》）"},{"id":"a62","t":"1. 乌鸦喜谀","u":"第 十一 单 元","x":"粤西桂林①，近有荒村，多树木，上多栖乌鸦。一犬翘首枝头，乌鸦食其上。犬欲缘木上之，恨无何，伏地喃喃，仰视注目以待，颂曰：\"乌兄，久慕高风，未亲雅教，素仰雅曲，如赐一曲，尤慰平生，心亦足矣。\"鸦听之，喜不自胜，伸腰展翅，喈喈数声，食尽堕犬口中。犬曰：\"雅曲已聆，心愿已足，蒙赐佳味，终身铭德。\"鸦曰：\"非闻曲之为，乃欲吾口中食耶！悔之莫及。\""},{"id":"a63","t":"2. 黠鼠","u":"第 十一 单 元","x":"苏子①夜坐，有鼠方啮，抚床而止之。既而复作。使童子③烛之，有橐④中空，嘐嘐聱聱⑤，声在橐中。曰：\"嘻！此鼠之见闭而不得去者也。\"发而视之，寂无所有，举烛而索，橐中有死鼠。童子惊曰：\"是方啮也，而遽死耶？向为何声，岂有鬼耶？\"覆而出之，堕地乃走。"},{"id":"a64","t":"3. 粤令好谀","u":"第 十一 单 元","x":"粤西有令性悦谀①，每布一政，群下交口赞誉，令乃欢。一隶欲阿②其意，故从旁与人偶语③曰：\"凡居民上者，咸④喜人谀，唯阿主不然，视人誉蔑如⑤耳。\"其令耳之，亟⑥召隶前，抚膺高蹈⑦，嘉赏不已，曰：\"嘻！知余心者唯汝，良隶也！\"自是昵⑧之有加。 （节选自刘元卿《应谐录》）"},{"id":"a65","t":"4. 子产受骗","u":"第 十一 单 元","x":"昔者有馈①生鱼于郑子产，子产使校人②畜③之池。校人烹之，反命④曰：\"始舍⑤之，圉圉⑥焉；少则洋洋⑦焉；攸然⑧而逝。\"子产曰：\"得其所哉！得其所哉！\"校人出，曰：\"孰⑨谓子产智？予既⑩烹而食之，曰'得其所哉！得其所哉！'\"故君子可欺以其方，难罔以非其道。 （节选自《孟子·万章上》）"},{"id":"a66","t":"5. 狮子王与豺","u":"第 十一 单 元","x":"昔有狮子王，于深山搜一豺，将食之。豺曰：\"请为王月送二鹿以自赎。\"狮子王悦。豺以时而进，已亦得狸、兔自存。期年，鹿尽，豺无可送者。狮子王遇豺，曰：\"汝杀众生亦多矣！今次至汝，汝其①图之！\"豺无以对，遂为狮所食。"},{"id":"a67","t":"林逋养鹤（阅读）","u":"第 十二 单 元","x":"林逋①隐居杭州孤山，常畜两鹤，纵之则飞入云霄，盘旋久之，复入笼中。逋常泛小艇游西湖诸寺。有客至逋所居，则一童子出，应门延客坐，为开笼纵鹤。良久，逋必棹小船而归，盖常以鹤飞为验也。 （节选自沈括《梦溪笔谈》）"},{"id":"a68","t":"1. 鹤亦知人意","u":"第 十二 单 元","x":"卢仁畜二鹤，甚驯。后一创死，一哀鸣不食。卢仁勉力饲之，乃食。一旦，鹤鸣绕卢侧。卢曰：\"尔欲去，吾不尔羁也。\"鹤乃振翅云际，再三而去。卢老病无子，后三年，归卧乡间，晚秋萧索，曳杖林间，忽见一鹤盘空，鸣声凄切。卢曰：\"若非我侣也？果是，即下之。\"鹤竟翩翩而下，投于卢怀中，以喙牵衣，旋舞不释。卢遂引之归。卢视之如赤子，鹤亦知人意，侍卢若亲人。后卢仁卒，鹤终不食而死，族人葬之墓左。"},{"id":"a69","t":"2. 明义法师之鸠","u":"第 十二 单 元","x":"浙江盐官县庆善寺明义法师，屏居乡里。一日晨起，行径中，见鸠雏堕地，携而归，躬自哺饲。两月乃能飞。日则纵飞林间，夜则投宿法师屏几间。是岁十月，明义法师之徒惠月主掌庆善寺，迎其师归。至暮鸠返，室寂无人矣，不见法师，旋室而匝，悲鸣不已。守舍者怜之，谓曰：\"吾送汝归法师处。\"明日，笼而行，适法师处。自是不复飞出，日与法师为伴，以手抚摸皆不动，然他人近之，辄惊起。呜呼！孰谓禽兽无情乎？ （节选自《虞初新志》）"},{"id":"a70","t":"3. 鹿亦有智","u":"第 十二 单 元","x":"博山李氏者，以伐薪为生。一日，于山坳得一鹿仔，携家喂养。鹿稍长，甚驯，见人则呦呦鸣。其家户外皆山，鹿出，至暮必归。时值秋祭，例用鹿。官府督猎者急，限期送上，然旬日间无所获，乃向李氏求之，李氏不与。猎者固请。李氏迟疑曰：\"待吾虑之。\"是夜鹿去，遂不归。李氏深悔之。"},{"id":"a71","t":"4. 喜嗔之人","u":"第 十二 单 元","x":"昔有众坐于屋中，赞一外人德行殊好，唯有二过：一者喜嗔，二者作事仓促。尔时，此人适过门外，闻是语，便嗔恚，即入其屋，擒彼道已过恶之人，以手扑打。傍人曰：\"何故打人？\"其人答曰：\"吾何时喜、仓促？此人者道我喜嗔恚、作事仓促，是故打之。\"傍人曰：\"汝今之相即时现验，云何讳之？\""},{"id":"a72","t":"5. 艾子邻人卖犬","u":"第 十二 单 元","x":"艾子晨饭毕，逍遥于门，见其邻肩两犬而西。艾子呼而问之曰：\"子担犬安之？\"邻人曰：\"鬻诸屠。\"艾子曰：\"是吠犬也，乌屠？\"邻人指犬而斥曰：\"此畜生，昨夜贼横行，惧而噤不一声，今日门辟，不能择人而吠，伤及佳客，是以欲杀之。\"艾子曰：\"善！\""},{"id":"a73","t":"道士救虎（阅读）","u":"第 十三 单 元","x":"一夕，山水大出，漂室庐①，塞溪而下。人骑木乘②屋，号呼求救者声相连也。道士具大舟，蓑笠，立水浒，督善水者绳以俟，人至即投木、索引之，所存活者甚众。平旦，有兽身没波涛中，而浮其首左右盼，若求救者。道士曰：\"是亦有生，必速救之。\"舟者应言往，以木接上之，乃虎也。始则朦朦然坐而舐其毛，比及岸，则瞠目视道士，跃而攫之仆地。舟人奔救，道士得不死而重伤。 （节选自刘基《郁离子》）"},{"id":"a74","t":"1. 越人道上遇狗","u":"第 十三 单 元","x":"越人道上遇狗。狗下首掉尾人言曰：\"我善猎，与若中分。\"越人喜，引而俱归，食以粱肉，待之以人礼。狗得盛礼，日益倨，猎得兽，必尽啖乃已。或嗤越人曰：\"尔饮食之，得兽尽啖，将何以狗为？\"越人悟，因与分肉，多自与。狗怒，啮其首，断领足，走而去之。"},{"id":"a75","t":"2. 张五不复猎","u":"第 十三 单 元","x":"休宁县①有村民张五，以猎为生。张尝逐一母鹿。鹿将二仔行，不能速，遂为张五所及。母鹿度不可免，顾旁有浮土，乃引二仔下，拥土覆之，而身投于张五网中。值张母出户，遥望见，遂奔至网所，具以所见告子。即破网出鹿，并二仔亦纵之。张母曰：\"人有母子之情，畜亦有之。吾不忍母死仔孤，故破网纵仔。\"张五闻之，心感动焉。由是焚网，永不复猎。"},{"id":"a76","t":"3. 隋侯救蛇获珠","u":"第 十三 单 元","x":"昔隋侯因使入齐，路行深水沙边，见一小蛇，于热沙中宛转，头上出血。隋侯哀之，下马以鞭拨入水中。一夕，梦见一山儿持珠来，见隋侯，且拜且曰：\"曩蒙大恩，救护得生，今以珠酬，请勿却。\"及旦，见一珠在床侧，璀璨夺目，世称\"隋侯珠\"，乃稀世之珍也。 （节选自《搜神记》）"},{"id":"a77","t":"4. 华隆因犬获救","u":"第 十三 单 元","x":"华隆好猎，畜一犬，号曰\"的尾\"，每出必从。一日，隆至江边，为大蛇围绕周身。犬遂奋而咋①蛇，蛇死。而隆僵仆于地，不省人事。犬疾走至家，吠不止。举家怪之，因随犬往，见隆闷绝委②地。车载归家，二日乃苏。隆未苏之间，犬终日不食。如此爱怜，如同亲戚。"},{"id":"a78","t":"5. 齐人有好猎者","u":"第 十三 单 元","x":"齐人有好猎者，旷日持久，而不得兽。入则愧其家室，出则愧其知友乡里。唯其所以不得之故，则狗恶也。欲得良狗，则家贫无以。于是还疾耕，疾耕则家富，家富则有以求良狗，良狗则数得兽矣。狩猎之获，常逾人矣。非独猎也，百事也尽然。"},{"id":"a79","t":"韩信受辱（阅读）","u":"第 十四 单 元","x":"淮阴①屠中少年有侮信者，曰：\"若虽长大，好带刀剑，中情怯耳。\"众辱之曰：\"信能死，刺我；不能死，出我袴下。\"于是信熟视之，俯出袴下，蒲伏。一市人皆笑信，以为怯。 （节选自《史记·淮阴侯列传》）"},{"id":"a80","t":"1. 韩信始为布衣时","u":"第 十四 单 元","x":"韩信者，淮阴人也。始为布衣时，贫，无行①，不得推择为吏；又不能治生商贾，常从人乞食，人多厌之者。尝从下乡亭长乞食，数月，亭长妻患之，乃晨炊蓐食。食时信往，不为具食。信怒，竟绝去。数年后，信封淮阴侯，见下乡亭长，赐百钱，曰：\"公，小人也，为德不卒。\""},{"id":"a81","t":"2. 天下有大勇者","u":"第 十四 单 元","x":"古之所谓豪杰之士，必有过人之节、人情所不能忍者。匹夫见辱，拔剑而起，挺身而斗，此不足为勇也。天下有大勇者，卒然①临之而不惊，无故加之而不怒，此其所挟持者甚大，而其志甚远也。"},{"id":"a82","t":"3. 韩娥善歌","u":"第 十四 单 元","x":"昔韩娥东之齐，匮粮，过雍门①，鬻歌乞食。既去，而余音绕梁②，三日不绝。左右以其人弗去。过逆旅③，逆旅主人辱之，韩娥因曼声④哀哭，一里老幼悲愁，垂涕相对，三日不食。遽而追之。娥还，复为曼声长歌，一里老幼喜跃抃⑤舞，弗能自禁，忘向之悲也。"},{"id":"a83","t":"4. 冯相与和相","u":"第 十四 单 元","x":"冯相与和相俱为朝中重臣。一日，和相谓冯相曰：\"公靴新买，其直几何？\"冯举其左足示之，曰：\"九百钱②。\"和性急，顾谓小吏云：\"吾靴何以耗一千八百钱？\"因诟小吏，疑其有贪。既而冯徐举其右足曰：\"此亦九百。\"左右哄堂大笑。"},{"id":"a84","t":"5. 南方多没人","u":"第 十四 单 元","x":"南方多没①人，日与水居也，七岁而能涉，十岁而能浮，十五而能没矣。夫没者岂苟然哉？必将有得于水之道者。日与水居，则十五而得其道。生不识水，则虽壮，见舟而畏之。故北方之勇者，问于没人而求其所以没，以其言试之河，未有不溺者也。"},{"id":"a85","t":"子罕弗受玉（阅读）","u":"第 十五 单 元","x":"宋人或得玉，献诸子罕②，子罕弗受。献玉者曰：\"以示玉人③，玉人以为宝也，故敢献之。\"子罕曰：\"我以不贪为宝，尔以玉为宝；若以与我，皆丧宝也，不若人有其宝④。\"（节选自《左传》）"},{"id":"a86","t":"1. 公孙仪不受鱼","u":"第 十五 单 元","x":"公孙仪相鲁而嗜鱼，一国尽争买鱼而献之。公孙仪不受。其弟子②谏曰：\"夫子嗜鱼而不受者，何也？\"对曰：\"夫唯嗜鱼，故不受也。夫即受鱼，必有下人之色；有下人之色，将枉于法；枉于法，则免于相，虽嗜鱼，彼必不能长给我鱼，我又不能自给鱼。既无③受鱼而不免相，虽嗜鱼，我能长自给鱼。\"（节选自《韩非子·外储说右下》）"},{"id":"a87","t":"2. 杨震\"四知\"","u":"第 十五 单 元","x":"杨震①迁东莱太守。当之郡，道经昌邑，故所举③王密为昌邑令，谒见，至夜怀金十斤以遗震。震曰：\"故人知君，君不知故人，何也？\"密曰：\"暮夜无知者。\"震曰：\"天知，神知，我知，子知。何谓无知？\"密愧而出。性公廉，不受私谒。子孙常蔬食步行，故旧长者④或欲令治产业，震不肯，曰：\"使后世称为清白吏子孙，以此遗之，不亦厚乎？\""},{"id":"a88","t":"3. 迁公修屋","u":"第 十五 单 元","x":"有迁氏①者，世称迁公，性吝啬。篱败不修，瓦裂不葺。一日，夜半暴雨，屋漏如注，妻子东藏西匿，仍半身淋漓。妻且号且诟曰：\"吾适尔，因汝家富，不意乃受此累。汝何以为父？何以为夫？\"迁公无奈。旦日，延人治屋。然自后二月，天晴月朗，不见雨兆③。迁公叹曰：\"适葺治，即不雨，岂不徒耗资财！\""},{"id":"a88b","t":"4. 庖夫","u":"第 十五 单 元","x":"昔有庖夫①，甚迂。于市市鸡及肉归，置厨中。适有友人造访，遂入室聚谈。友人去，见犬猫啮鸡、肉。庖夫驱曰：\"尔何不仁？吾何损尔？\"其似不闻，啮之愈甚。庖夫又曰：\"吾素忠厚，向善待汝，今欲欺吾耶？\"移时②，败骨残肉狼藉满地，犬猫掉③尾而去。或曰：\"迂哉，夫！此乃犬猫也，何得视之以人，当责己乃是。\""},{"id":"a88c","t":"5. 治驼","u":"第 十五 单 元","x":"昔有医人，自诩能治背驼，曰：\"如弓者，如虾者，如环者，若延吾治，可朝治而夕如矢矣！\"一人信焉，使治驼。乃索板二，以一置于地，卧驼者其上，又以一压焉，又践之。驼者随直，亦随死。其子欲诉诸官。医人曰：\"我业①治驼，但管人直，不管人死。\"呜呼，今之为官，但管钱粮收，不管百姓死，何异于此医哉？"},{"id":"a89","t":"樊重种梓漆（阅读）","u":"第 十六 单 元","x":"樊重欲作器物，先种梓①漆，时人笑之。然积以岁月，皆得其用。向之笑者，咸来求假焉②。此种植之不可已也。谚曰：\"一年之计，莫如树谷；十年之计，莫如树木。\"此之谓也。（节选自《齐民要术》）"},{"id":"a90","t":"1. 一生之计在于勤","u":"第 十六 单 元","x":"治生①之道，莫尚乎勤。故邵子②云：\"一日之计在于晨，一岁之计在于春，一生之计在于勤。\"言虽近而旨则远。无如③人之常情，恶劳而好逸，甘食愉衣，玩日愒④岁。以之为农，则不能深耕而易耨⑤；以之为工，则不能计日而见功；以之为商，则不能乘时而趋利；以之为士，则不能笃志力行。徒然食息于天地之间，是一蠹耳！夫天地之化，日新则不蠹⑥，流水不腐，诚不欲其常安也。人之心与力，何独不然？劳则思，逸则忘，物情也。大禹之圣，且惜寸阴，陶侃⑦之贤，且惜分阴，又况圣贤不若彼者乎？"},{"id":"a91","t":"2. 张溥与“七录斋”","u":"第 十六 单 元","x":"张溥①幼嗜学，所读书必手抄。抄已②，朗诵一过即焚之；又抄，如是者六七始已。右手握管③处指掌成茧。冬日手皲④，日沃汤⑤数次。后名读书之斋曰“七录”。溥诗文敏捷，四方征索⑥者，不起草，对客挥毫⑦，俄顷⑧立就⑨，以故名高一时。 （节选自《明史·张溥传》）"},{"id":"a92","t":"3. 用力多者收功远","u":"第 十六 单 元","x":"司马温公①幼时，患②记问不若人③。群居讲习，众兄弟既成诵，游息④矣；独下帷绝编⑤，迨⑥能倍讽⑦乃止。用力多者收功远，其所精诵，乃终身不忘也。温公尝言：“书不可不成诵，或在马上，或中夜不寝时，咏其文，思其义，所得多矣。”"},{"id":"a93","t":"4. 为者常成","u":"第 十六 单 元","x":"梁丘据①谓晏子曰：“吾至死不及夫子②矣。”晏子曰：“婴③闻之：为者常成，行者常至。婴非有异于人也④，常为而不置⑤，常行而不休⑥而已矣。”"},{"id":"a94","t":"5. 望梅止渴","u":"第 十六 单 元","x":"魏武①行役②失汲道③，三军④皆渴，乃令曰：“前有大梅林，饶子⑤，甘酸可以解渴。”士卒闻之，口皆出水，乘⑥此得及前源⑦。"},{"id":"a95","t":"刘庭式娶盲女（阅读）","u":"第 十七 单 元","x":"齐人刘庭式未及第①时，议娶其乡人之女，既成约②而未纳币③也。庭式及第，其女以疾，两目皆盲。女家躬耕④，贫甚⑤，不敢复言。或⑥劝纳其幼女。庭式笑曰：“吾心已许之矣⑦。虽盲，岂负⑧吾初心⑨哉！”卒⑩娶盲女，与之偕老⑪。 （节选自《能改斋漫录》）"},{"id":"a96","t":"1. 韩云门与盲女偕老","u":"第 十七 单 元","x":"项城①韩云门，名堳（méi），聘②戚氏女，未几，两目失明。戚谓韩郎年少能文，必成远器，而配以盲女，非偶也，欲毁婚而终女子于家。韩之父母将许之，云门毅然不可，如礼迎娶以归。戚不得已，媵③以美婢。云门曰：“人情见则欲动，不若无见，以全我居室之好。”遂遣婢还。后于壬子④出为教谕⑤。挚妇偕行，伉俪无间。豫人称其笃行，以为宋之刘庭式再现于今。"},{"id":"a97","t":"2. 孙泰","u":"第 十七 单 元","x":"孙泰者，山阳人也，少师皇甫颖，操守颇有古贤之风①。泰妻即姨妹②也。先是，姨老矣，以二子③为托，曰：“其长损一目④，汝可取女弟⑤。”姨卒，泰取其姊。或诘之，泰曰：“其人有废疾，非泰不可适⑥。”众皆服泰之义。泰尝于市遇铁灯台，市之，而命洗刷，却银也，泰亟往还之。"},{"id":"a98","t":"3. 二犬情深","u":"第 十七 单 元","x":"咸溪县①童镛家，畜二犬，一白一花，共出一母。性狡狯②，解人意③。日则嬉戏，夜则守门。后白者倏④目盲，不能进牢⑤自食。主人以草藉⑥檐外卧之。花者衔饭吐而饲之。夜则卧其侧，几⑦二年余。及白者死，埋诸⑧山麓⑨。花犬乃朝夕往，至葬处则默哀，若悼念状，良久乃反⑩。"},{"id":"a99","t":"4. 雁冢","u":"第 十七 单 元","x":"无锡①荡口镇，有人得一雁，将杀而烹之。有书生见而悯焉，买以归，畜之以为玩。惧其逸去，以线联其两翅，使不得飞。雁杂处鸡鹜间，亦颇驯，惟闻长空雁唳②，辄昂首而鸣。一日，有群雁过其上，此雁大鸣。忽有一雁自空而下，集于屋檐，二雁相顾，引吭③奋翅④，若相识者：一欲招之下，一欲引之上。书生悟此二雁必旧偶也，乃断其线，使飞。然此雁久系，不能奋飞，屡飞屡坠。竟不得去。檐上之雁，守之终日，忽自屋飞下，相对哀鸣。越日则俱毙矣。书生感其义，合而葬之，名曰“雁冢”。"},{"id":"a100","t":"5. 义犬报火警","u":"第 十七 单 元","x":"城之东，民家畜一犬，甚羸①。一夕②，邻火卒③发，延④及民家。民正熟寝⑤，犬连吠不觉。起曳⑥其被，寝犹如故⑦。复踞⑧床以口附民耳大嗥⑨，民始惊。视烟已满室，急呼妻女出，室尽烬⑩矣。民遂谓所亲曰：“吾家贫，犬食恒⑪不饱，不谓⑫今日能免我四人于难也。彼日厚享其人之食，而不顾其患难者，其视犬为何如耶？”"},{"id":"a101","t":"曾子杀彘（阅读）","u":"第 十八 单 元","x":"曾子之妻之市①，其子随之而泣。其母曰：“女②还，顾反③为女杀彘④。”妻适⑤市来，曾子欲捕彘杀之。妻止之曰：“特⑥与婴儿戏⑦耳。”曾子曰：“婴儿非与戏也。婴儿非有知也，待父母而学者也，听父母之教。今子⑧欺之，是教子欺也。母欺子，子而不信其母，非所以成教⑨也。”遂烹⑩彘也。 （节选自《韩非子·外储说左上》）"},{"id":"a102","t":"1. 陈谏议教子","u":"第 十八 单 元","x":"宋陈谏议①家有劣马，性暴，不可驭，蹄啮伤人多矣。一日，谏议入厩，不见是马，因诘仆：“彼马何以不见？”仆言为陈尧咨售之贾人矣。尧咨者，陈谏议之子也。谏议遽召子，曰：“汝为贵臣②，家中左右尚不能制，贾人安能畜之？是移祸于人也！”急命人追贾人取马，而偿其直，戒仆养之终老。"},{"id":"a103","t":"2. 陈万年教子","u":"第 十八 单 元","x":"陈万年①乃朝中重臣也，尝病，召其子咸②告诫于床下，语至三更，咸睡，头触屏风③。万年大怒，欲杖之，曰：“乃公④教诫女，女反睡，不听吾言，何也？”咸叩头谢曰：“具晓所言，大要⑤教咸谄也。”万年乃不复言。"},{"id":"a104","t":"3. 卞庄子刺虎","u":"第 十八 单 元","x":"卞庄子欲刺虎，馆竖子①止之，曰：“两虎方且食牛，食甘必斗，斗则大者伤，小者死，从伤而刺之，一举必有双虎之名。”卞庄子以为然，立须②之。有顷，两虎果斗，大者伤，小者死。庄子从伤者而刺之，一举果有双虎之功。"},{"id":"a105","t":"4. 势利鬼吴生","u":"第 十八 单 元","x":"有吴生者，老而趋势①。偶赴广席②，见布衣③者后至，略酬其揖④，意色殊傲⑤。已而⑥见主人恭甚，私询之，乃张伯起⑦也。更欲殷勤致礼，张笑曰：“适⑧已领过半揖，但乞⑨补还，勿复为劳。”"},{"id":"a106","t":"5. 偷鸡贼的托词","u":"第 十八 单 元","x":"今有人日攘（rǎng）①其邻之鸡者，或告之曰：“是非君子②之道。”曰：“请损③之，月攘一鸡，以待来年，然后已④。”如知其非义⑤，斯⑥速已矣，何待来年？"},{"id":"a107","t":"宋濂苦学（阅读）","u":"第 十九 单 元","x":"余①幼时即嗜②学，家贫无以致③书以观。每假借④于藏书之家，手自⑤笔录，计日以还。天大寒，砚冰坚，手指不可屈伸，弗之怠⑥，录毕走⑦送之，不敢稍逾约⑧，是以⑨人多以书假余，余因得遍观群书。 （节选自宋濂《送东阳马生序》）"},{"id":"a108","t":"1. 葛洪苦学","u":"第 十九 单 元","x":"葛洪①，丹阳②人，贫无童仆，篱落③不葺，常披榛④出门，排草入室。遭火，所藏典籍尽。乃负笈徒步，不远千里，假书抄写。卖薪买纸，然火披览。"},{"id":"a109","t":"2. 王冕僧寺夜读","u":"第 十九 单 元","x":"王冕者，诸暨①人。七八岁时，父命牧牛陇②上，窃入学舍，听诸生诵书。听已，辄默记。暮归，忘其牛。父怒挞之，已而复如初。母曰：“儿痴③如此，曷不听其所为？”冕因去，依僧寺以居。夜潜出，坐佛膝上，执策④映长明灯⑤读之，琅琅达旦⑥。佛像多土偶，狞恶可怖，冕小儿，恬若不见。"},{"id":"a110","t":"3. 欧阳修家教","u":"第 十九 单 元","x":"欧阳修四岁而孤①，家贫无资，母以荻②画地，教以书字，多诵古人篇章，使学为诗。及稍长，而家无书读，就闾里③士人家④假而读之，或因而抄录。抄录未毕，而已能诵其文，以至昼夜忘寝食，唯读书是务⑤。自幼所作诗赋⑥文字，下笔已如成人。"},{"id":"a111","t":"4. 司马光幼时","u":"第 十九 单 元","x":"司马光①生七岁，凛然②如成人，闻讲《左氏春秋》③，爱之，退为家人讲，即了其大旨④。自是手不释卷，至不知饥渴寒暑。群儿戏于庭，一儿登瓮⑤，足跌⑥没水中，众皆弃去，光持石击瓮破之，水迸⑦，儿得活。"},{"id":"a112","t":"5. 程门立雪","u":"第 十九 单 元","x":"杨时见程颐①于洛②，时盖③年四十矣。一日见颐，颐偶瞑坐④，时与游酢⑤侍立⑥不去。颐既觉⑦，则门外雪深一尺矣。"},{"id":"a113","t":"项羽不肯竟学（阅读）","u":"第 二十 单 元","x":"项籍少时，学书①不成，去，学剑，又不成。项梁②怒之。籍曰：“书，足以③记名姓而已。剑，一人敌，不足学，学万人敌。”于是项梁乃教籍兵法。籍大喜，略知其意，又不肯竟学④。 （节选自《史记·项羽本纪》）"},{"id":"a114","t":"1. 赵某误子","u":"第 二十 单 元","x":"赵某者，吴①人也。家富多藏，有子三。三子皆不学无术，恃②父多金，朝夕挥霍，不务正业。有一叟善意相劝，曰：“尔之子，俱游手好闲，一旦尔殁，将何以自食？当戒之从学，而后自立！”赵某勿之听，恣③子放荡。寻赵氏卒，其家财竭。三子者，或乞食于街市，或盗窃于邻人，或饿仆于路侧。人曰：“此乃自食恶果也！”然岂非其父之计浅也！"},{"id":"a115","t":"2. 高凤笃学","u":"第 二十 单 元","x":"高凤①，字文通，家以农亩为业。妻常②之田，曝麦于庭，令凤护鸡。时天暴雨，凤持竿诵经③，不觉潦水④流麦。妻还怪问，乃省。"},{"id":"a116","t":"3. 王充市肆博览","u":"第 二十 单 元","x":"王充①少孤，乡里称孝。后至京师，受业太学②，师事班彪③。好博览而不守章句④。家贫无书，常游洛阳市肆，阅所卖书，一见辄能诵忆。日久，遂博通百家之言。"},{"id":"a117","t":"4. 赵伯公肥大","u":"第 二十 单 元","x":"赵伯公肥大，夏日醉卧，孙儿缘其肚上戏，因以李子内其脐中，累七八枚。既醉了①不觉。数日后，乃知痛。李大烂，汁出，以为脐穴，惧死，乃命妻子处分②家事，乃泣谓家人曰：“我肠烂且死。”明日李核出，乃知孙儿所内李子也。"},{"id":"a118","t":"5. 燕人返国","u":"第 二十 单 元","x":"燕人生于燕，长于楚，及老而还本国。过晋国，同行者诳①之。指城曰：“此燕国之城。”其人愀然②变容。指社③曰：“此若④里之社。”乃喟然⑤而叹。指舍⑥曰：“此若先人之庐⑦。”乃涓然⑧而泣。指垅⑨曰：“此若先人之冢⑩。”其人哭不自禁。同行者哑然⑪大笑，曰：“予昔绐⑫若，此晋国耳。”及至燕，真见燕国城社，真见先人之庐冢，悲心更微⑬。 （节选自《列子·周穆王》）"},{"id":"a121","t":"鲁侯养鸟（阅读）","u":"第 二十一 单 元","x":"昔者海鸟止于鲁郊①。鲁侯御而觞②之于庙，奏《九韶》③以为乐，具太牢④以为膳。鸟乃⑤眩视⑥忧悲，不敢食一脔⑦，不敢饮一杯，三日而死。此以己养⑧养鸟也，非以鸟养⑨养鸟也。"},{"id":"a122","t":"1．揠苗助长","u":"第 二十一 单 元","x":"宋人有闵①其苗之不长而揠②之者，芒芒然③归，谓其人曰：“今日病矣！予助苗长矣！”其子趋而视之，苗则槁矣。"},{"id":"a123","t":"2．砚眼","u":"第 二十一 单 元","x":"明有陆庐峰者，于京城待用①。尝于市遇一佳砚，议价未定。既还邸②，使仆往，以一金易归。仆持砚归，公讶其不类。仆坚称其是。公曰：“向观砚有鸲鹆③眼，今何无之？”答曰：“吾嫌其微凸，路值石工，幸有余银，令磨而平之。”公甚惋惜。"},{"id":"a124","t":"3．农夫耕田","u":"第 二十一 单 元","x":"农夫耕于田，数息①而后一锄。行者见而哂之，曰：“甚矣，农之惰也！数息而后一锄，此田竟月不成！”农夫曰：“予莫知所以耕，子可示我以耕之术乎？”行者解衣下田，一息而数锄，一锄尽一身之力。未及移时，气竭汗雨，喘喘焉不能作声，且仆于田。谓农夫曰：“今而后知耕之难也。”农夫曰：“非耕难，乃子之术谬也！人之处事亦然，欲速则不达也。”行者服而退。"},{"id":"a125","t":"4．稚犬","u":"第 二十一 单 元","x":"某村赵氏，犬生三子，甫①二月，随母行。一虎呼啸出林，疾奔母犬。母犬亟召子伏身下。然一子已为虎所噬。赵氏呼邻里壮丁，持矛逐之。二稚犬奔衔虎尾，虎带之走。犬为荆棘挂胸，皮毛殆②尽，终不肯脱。虎因尾为稚犬累，掉③尾不得脱，行渐迟。众人呐喊而前，追及，毙于众人刀下。噫！稚犬亦勇矣。"},{"id":"a126","t":"5．鷧鸟中计","u":"第 二十一 单 元","x":"人有鱼池，苦群鷧①窃啄食之，乃束草为人，披蓑、戴笠、持竿，植之池中以慑之。群鸬鹚初回翔②不敢即下，已渐审视，下啄。久之，时飞止笠上，恬不为惊。人有见者，窃去刍③人，自披蓑、戴笠，而立池中，仍下啄，飞止如故。人随手执其足，鷧不能脱。"},{"id":"a127","t":"镜喻（阅读）","u":"第 二十二 单 元","x":"客①有任目②而恶镜者，曰：“是好苦我。吾自有目，乌用镜为③？”久之，视世称美人，鲜当意者；而不知己④面之黑子，泰然谓美莫己若⑤。左右匿⑥笑，客终不悟。悲夫！"},{"id":"a128","t":"1．枭将东徙","u":"第 二十二 单 元","x":"枭①逢鸠②。鸠曰：“子将安之？”枭曰：“我将东徙。”鸠曰：“何故？”枭曰：“乡人皆恶我鸣，以故东徙。”鸠曰：“子能更鸣，可矣；不能更鸣，东徙犹恶子之声。”"},{"id":"a129","t":"2．世无良猫","u":"第 二十二 单 元","x":"某①恶鼠，破家求良猫。厌②以腥膏，眠以毡罽③。猫既饱且安，率不捕鼠，甚者与鼠嬉戏，鼠以故益暴。某怒，逐之，遂不复畜猫，以为天下无良猫也。"},{"id":"a130","t":"3．河豚之死","u":"第 二十二 单 元","x":"河之鱼，有豚（tún）其名者，游于桥间，而触其柱，不知远去。怒其柱之触己也，则张颊竖鳍①，鼓腹而浮于水，久之莫动。飞鸢②过而攫之，磔③其腹而食之。好游而不知止，因游而触物，不知罪己，妄肆其忿，至于磔腹而死，可悲也夫！"},{"id":"a131","t":"4．刻舟求剑","u":"第 二十二 单 元","x":"楚人有涉①江者，其剑自舟中坠于水，遽契其舟，曰：“是吾剑之所从坠。”舟止，从其所契者入水求之。舟已行矣，而剑不行②，求剑若此，不亦惑乎？"},{"id":"a132","t":"5．鹬蚌相争","u":"第 二十二 单 元","x":"蚌方出曝，而鹬①啄其肉，蚌合而钳②其喙。鹬曰：“今日不雨，明日不雨，即有死蚌。”蚌亦谓鹬曰：“今日不出，明日不出，即有死鹬。”两者不肯相舍，渔者得而并禽之。"},{"id":"a133","t":"陈在衡呼鬼（阅读）","u":"第 二十三 单 元","x":"陈在衡先生，和蔼有风趣，年六十余。暮行郊野间，见二人笼灯①前行，就火②吸烟，久而不爇③。其一人问曰：“君过首七④未耶？”陈讶其语，漫曰：“未也。”其人曰：“宜哉，阳气未尽，故阴火不燃。”陈悟为鬼，佯曰：“世言人畏鬼，信⑤乎？”鬼曰：“非也！鬼实畏人。”陈曰：“人何足畏？”曰：“畏啐⑥。”陈即长吸而吹之。二鬼退至三步外，张目怒陈曰：“汝非鬼耶？”陈笑曰：“实不汝欺，吾乃与鬼相近之人耳！”再吹之，各缩其半；三吹之而灭。"},{"id":"a134","t":"1．曹竹虚族兄遇鬼","u":"第 二十三 单 元","x":"曹竹虚言：其族兄①自歙②往扬州，途经友人家。时盛夏，延坐书屋，甚轩爽，暮欲下榻其中。友人曰：“是有魅，夜不可居。”曹强居之。夜半，有物自门隙蠕蠕③入，薄如夹纸。入室后，渐开展作人形，乃女子也。曹殊不畏。忽披发吐舌，作缢鬼状。曹笑曰：“犹是发，但稍乱；犹是舌，但稍长。亦何足畏！”忽自摘其首置案上。曹又笑曰：“有首尚不足畏，况无首耶？”鬼技穷，倏然灭。及归途再宿。夜半，门隙又蠕动。甫④露其首，辄唾曰：“又此败兴物耶？”竟不入。"},{"id":"a135","t":"2．疑鬼","u":"第 二十三 单 元","x":"毛氏①者，越②人也。值雨夜行，左顾右盼，心悸焉。忽一人自后及，言未具伞，乞假之而同行。毛氏无奈，强应之。二人默然良久。毛氏疑为鬼，至桥上，遂挤堕河中，狂走而去。未几，天微明，有售饼者启门，往投焉。店主问其所以，曰遇鬼。久之，又有一人至肆，浑身淋漓，自言为鬼推堕河中。两人相视，哑然失笑。"},{"id":"a136","t":"3．畏鬼致盗","u":"第 二十三 单 元","x":"荆①人有畏鬼者，闻槁叶之落与蛇鼠之行，莫不以为鬼也。盗知之，于是宵潜其垣②，作鬼音，主人弗敢睨也。若是者四五，然后入其室，空其藏焉。或诳之曰：“鬼实取之也。”中心惑而阴然之。无何，其宅果有鬼。纵物出于盗而以为鬼窃之，弗信有人盗也。《郁离子》③曰：“……谗④不自来，因疑而来；间⑤不自来，乘隙而入。由其明之先蔽也。”"},{"id":"a137","t":"4．畏影恶迹","u":"第 二十三 单 元","x":"人有畏影恶迹而去之走者。举足愈数而迹愈多；走愈疾而影不离身。自以为尚迟，疾走不休，绝力①而死。不知处阴②以休影，处静以息迹，愚亦甚矣。"},{"id":"a138","t":"5．鸲鹆噪虎","u":"第 二十三 单 元","x":"女几之山，鹊所巢。有虎出于朴樕①，鹊集而噪之。鸲鹆②闻之，亦集而噪之。鹎鶋③见而问之曰：“虎，行地者也，其如子何哉而噪之也？”鹊曰：“是啸而生风，吾畏其颠吾巢，故噪而去之。”问于鸲鹆，鸲鹆无以对。鹎鶋笑曰：“鹊之巢木末也，畏风，故忌虎；尔穴居者也，何以噪为？”"},{"id":"a139","t":"孟母三迁（阅读）","u":"第 二十四 单 元","x":"孟子幼时，其舍近墓，常嬉为墓间之事。其母曰：“此非所以处子也。”遂迁居市旁。孟子又嬉为贾人①衒卖②之事。母曰：“此又非所以处吾子也。”复徙居学宫③之旁。孟子乃嬉为俎豆④揖让进退⑤之事。其母曰：“此可以处吾子矣。”遂居焉⑥。"},{"id":"a140","t":"1．孟母戒子","u":"第 二十四 单 元","x":"孟子少时，诵，其母方织。孟子辍①然中止，乃复进。其母知其諠②也，呼而问之：“何为中止？”对曰：“有所失，复得。”其母引刀裂其织，以此戒之。自是之后，孟子不复諠矣。"},{"id":"a141","t":"2．孟母不欺子","u":"第 二十四 单 元","x":"孟子少时，东家杀豚①。孟子问其母曰：“东家杀豚何为？”母曰：“欲啖女。”其母自悔而言曰：“吾怀妊②是子，席不正不坐，割③不正不食，胎教之也。今适有知而欺之，是教之不信也。”乃买东家豚肉以食之，明不欺也。"},{"id":"a142","t":"3．秦西巴纵麑","u":"第 二十四 单 元","x":"鲁①贵人孟孙，猎得麑②，使秦西巴持归。其母随而鸣，秦西巴见其哀，纵而与之。麑随母而去。孟孙怒曰：“吾猎得麑，尔纵之，何也？”秦西巴曰：“但不忍耳。”孟孙逐秦西巴。居一年，召以为太子傅③。左右曰：“夫秦西巴有罪于君，今以为太子傅，何也？”孟孙曰：“夫秦西巴以一麑而不忍，又安能亏④吾子乎？”"},{"id":"a143","t":"4．屠夫杀狼","u":"第 二十四 单 元","x":"一屠暮行，为狼所逼。道旁有夜耕者所遗行室①。奔入伏焉。狼自苫②中探爪入。屠急捉之，令不可去，顾③无计可以死之，唯有小刀不盈寸，遂割破爪下皮，以吹豕之法④吹之。极力吹移时，觉狼不甚动，方缚以带。出视，则狼胀如牛，股⑤直不能屈，口张不得合。遂负之以归。非屠乌⑥能作此谋也。"},{"id":"a144","t":"5．郢书燕说","u":"第 二十四 单 元","x":"郢①人有遗燕相国书者，夜书，火不明，因谓持烛者曰：“举烛。”云②而过书“举烛”。举烛，非书意也。燕相受书而说③之，曰：“举烛者，尚④明也；尚明者，举贤而任之。”燕相白王，王大悦，国以治。治则治矣，非书意也。"},{"id":"a145","t":"陶母责子（阅读）","u":"第 二十五 单 元","x":"陶公①少时作鱼梁吏②，尝以坩鲊③饷④母。母封鲊付使⑤，反书⑥责侃曰：“汝为吏，以官物见饷，非唯不益，乃增吾忧也。”"},{"id":"a146","t":"1．陶侃尝出游","u":"第 二十五 单 元","x":"陶侃尝出游①，见人持一把未熟稻，侃问：“用此何为？”人云：“行道所见，聊取之耳。”侃作色大怒曰：“汝不田，而贼人稻！”执而鞭之。是以百姓勤于农耕，家给人足。"},{"id":"a147","t":"2．木屑竹头","u":"第 二十五 单 元","x":"尝造船，其木屑竹头①，侃②皆令籍③而掌之。人咸不解所以。后正会④，积雪始晴，厅事⑤前余雪犹湿，乃以木屑布地。及桓温⑥伐蜀，又以侃所贮竹头作钉装船。"},{"id":"a148","t":"3．墨子怒耕柱子","u":"第 二十五 单 元","x":"墨子怒耕柱子①。耕柱子曰：“我无愈于人乎？”墨子②曰：“我将上太行③，以骥与牛驾，子将谁策？”耕柱子曰：“将策骥也。”墨子曰：“何故策骥也？”耕柱子曰：“骥足以策。”墨子曰：“我亦以子为足以策，故怒之。”耕柱子悟。"},{"id":"a149","t":"4．李存审诫子","u":"第 二十五 单 元","x":"李存审①出于寒微，常诫诸子曰：“尔父少提一剑去乡里②，四十年间，位至将相，其间万死一生者非一，破骨出镞③者几百余。”因授以所出镞，命藏之，曰：“尔曹生于膏粱，当知尔父起家如此也。”诸子皆诺。"},{"id":"a150","t":"5．芒山盗临刑","u":"第 二十五 单 元","x":"宣和①间，芒山②有盗临刑，母来与之诀。盗谓母曰：“愿如儿时一吮母乳，死且无憾。”母怜之，与之乳。不意盗啮断乳头，流血满地，母死。行刑者曰：“尔何毒耶？”盗因告行刑者曰：“吾少也，盗一菜一薪，吾母见而喜之，以至不检，遂有今日，故恨而杀之。”"},{"id":"a151","t":"欧阳修论作文（阅读）","u":"第 二十六 单 元","x":"顷岁①孙莘老②识欧阳文忠公③，尝乘间以文字问之。云：“无它术，唯勤读书而多为之，自工；世人患④作文字少，又懒读书，每一篇出，即求过人，如此少有至者。疵⑤病不必待人指摘⑥，多作自能见之。”"},{"id":"a152","t":"1．读书与作文","u":"第 二十六 单 元","x":"读书如销铜，聚铜入炉，大鞴①扇之，不销不止，极用费力。作文如铸器，铜既销矣，随模铸器，一冶②即成。只要识模，全不费力。所谓劳于读书、逸于作文者此也。"},{"id":"a153","t":"2．卖瓜减字","u":"第 二十六 单 元","x":"有一田父①，植瓜数亩，遇丰年，担而售之。于板书曰：此瓜出售。一秀才过，曰：“‘此’字重复，宜去，但留‘瓜出售’即可。”田父然之。既而，又一秀才见之，曰：“众皆见尔瓜，‘瓜’字可去。”田父即去“瓜”字。俄顷，又一秀才来，曰：“瓜置于市，非售而何？‘售’字赘②也。”田父愕然。适旁有一老父，曰：“直非书不可。”"},{"id":"a154","t":"3．修改一法","u":"第 二十六 单 元","x":"近闻吾乡朱梅崖①先生，每一文就，必粘之于壁，逐日熟视，去十余字。旬日以后，至万无可去，而后脱稿示人。此皆后学者所法也。"},{"id":"a155","t":"4．歧路亡羊","u":"第 二十六 单 元","x":"杨子①之邻人亡羊，既率其党②，又请杨子之竖③追之。杨子曰：“嘻，亡一羊，何追者之众？”邻人曰：“多歧路。”既反，问：“获羊乎？”曰：“亡之矣。”曰：“奚亡之？”曰：“歧路之中又有歧焉，吾不知所之，所以反也。”杨子戚然变容，不言者移时④，不笑者竟日。"},{"id":"a156","t":"5．二叟钓鱼","u":"第 二十六 单 元","x":"有二叟分石而钓。其甲得鱼至多且易取，乙竟日亡所获也，乃投竿问甲曰：“食饵①同，钓之水亦同，何得失之异耶？”甲曰：“吾方下钓时，但知有我而不知有鱼，目不瞬，神②不变，鱼忘其为我，故易取也。子意乎鱼，目乎鱼，神变则鱼逝矣，奚其获？”乙如其教，连取数鱼。"},{"id":"a157","t":"关羽刮骨疗毒（阅读）","u":"第 二十七 单 元","x":"羽①尝为流矢②所中，贯③其左臂，后创虽愈，每至阴雨，骨常疼痛。医曰：“矢镞④有毒，毒入于骨，当破臂作⑤创，刮骨去毒，然后此患乃除耳。”羽便伸臂令医劈之。时羽适请诸将饮食相对，臂血流离⑥，盈于盘器，而羽割炙引酒，言笑自若。"},{"id":"a158","t":"1．张飞横矛当阳桥","u":"第 二十七 单 元","x":"先主①背曹公②，依刘表。表卒，曹公犯荆州③，先主奔江南④。曹公追之，一日一夜，及于当阳之长阪⑤。先主闻曹公猝至，弃妻子走，使飞将二十骑拒后。飞据水断桥⑥，瞋目横矛曰：“张翼德在此，可来共决死！”敌皆无敢近者。故遂得免。"},{"id":"a159","t":"2．次非斩蛟","u":"第 二十七 单 元","x":"荆①有次非者，得宝剑于干遂②。还反涉江，至于中流，有两蛟③夹绕其船。次非谓舟人⑥曰：“子尝见两蛟绕船能两活者乎？”舟人曰：“未之见也。”次非攘臂④祛衣⑤，拔宝剑曰：“此江中之腐肉朽骨也。弃剑以全众，余奚爱焉？”于是赴江刺蛟，杀之而复上船。舟中之人皆得活。"},{"id":"a160","t":"3．溺鼠","u":"第 二十七 单 元","x":"鼠好夜窃粟。有人置粟于盎①，鼠恣啮，且呼群类入焉。月余，粟且尽，主人患之。人教以术②，乃以糠易粟，浮水面。是夜，鼠复来，欣欣然入，不意咸溺死。"},{"id":"a161","t":"4．鸡感恩","u":"第 二十七 单 元","x":"有旅者夜行值雨，遂赴友人家投宿焉。友人见不速之客，甚喜，将杀鸡待之。旅人怜鸡，佯言茹①素，遂不杀鸡。夜宿至三更②，忽闻鸡鸣甚急，以为黄鼠狼来也，遽起逐之。俄而墙倒，适在客房。主人惊而起，以为客毙矣，举烛而索，客乃在鸡笼旁。盖鸡感恩，促其起床也。"},{"id":"a162","t":"5．猫儿索食","u":"第 二十七 单 元","x":"猫生儿，稍大。猫儿问母：“当何所食？”母曰：“人自教女。”猫儿夜至他家，隐瓮器①间。有人见已，而相约曰：“酥乳②肉等，须覆盖；鸡雏高举，莫之食。”猫儿审听，即知：鸡、酥乳与肉，皆是我食也。"},{"id":"a163","t":"顾况戏白居易（阅读）","u":"第 二十八 单 元","x":"乐天①初举，名未振，以歌诗投顾况②。况戏之曰：“长安③物贵，居大不易④。”及读至《原上草》，云：“野火烧不尽，春风吹又生。”曰：“有句如此，居亦何难？老夫前言戏之耳。”"},{"id":"a164","t":"1．刘道真戏婢","u":"第 二十八 单 元","x":"刘道真遭乱①，于河侧为人牵船，见一老妪操橹②，道真嘲之曰：“女子何不调机弄杼③？因甚傍河操橹？”女答曰：“丈夫何不跨马挥鞭？因甚傍河牵船？”又尝与人共饭素盘草舍中，见一妪将两小儿过，并着青衣，嘲之曰：“青羊引双羔。”妇人曰：“两猪共一槽。”道真无语以对。"},{"id":"a165","t":"2．唐明皇赐名","u":"第 二十八 单 元","x":"贺知章有高名，告老归里，明皇嘉重之。将行泣涕，上问何所欲，曰：“臣有男未有定名①，幸陛下②赐之，以得归乡之荣。”上曰：“为人之道莫胜于信，孚者，信也，卿之子宜名孚。”贺再拜③而受命焉。久而悟之，曰：“上何谑我也，孚乃爪下为子，岂非呼我儿为爪子也？”"},{"id":"a166","t":"3．偷鸭求骂","u":"第 二十八 单 元","x":"邑西①白家庄居民，盗邻鸭烹之。至夜，觉肤痒。天明视之，茸②生鸭毛，触之则痛。大惧，无术可医。夜梦一人告之曰：“汝病乃天罚，须得失者骂，毛乃可落。”而邻翁素雅量，生平失物，未尝征③于声色。某诡告翁曰：“鸭乃某甲所盗，彼深畏骂，骂之亦可警将来。”翁笑曰：“谁有闲气骂恶人！”卒不骂。某盗窘，因实告邻翁。翁乃骂，其病愈。"},{"id":"a167","t":"4．何梅谷之妻","u":"第 二十八 单 元","x":"何梅谷，鄱阳①人也。其妻垂老，好佛事，自旦至夕，必口念“观音菩萨”千遍。何梅谷以儒学闻于时，止之则弗从，弗止又恐贻笑士人②，进退狼狈。一日，呼妻至再三，随夜随呼勿辍。妻怒曰：“何噪若是耶？”梅谷徐答曰：“仅呼半日，汝即怒我，观音一日被尔呼千遍，安得不怒汝耶？”妻顿悟，遂止。"},{"id":"a168","t":"5．庸医","u":"第 二十八 单 元","x":"有医者，自称善外科。一裨将①阵回，中流矢②，深入膜③内，延使治，乃持剪剪去管，跪而请谢。裨将曰：“镞在膜内须亟治。”医曰：“此内科事，不意并责我。”"},{"id":"a169","t":"老马识途（阅读）","u":"第 二十九 单 元","x":"管仲、隰朋①从桓公伐孤竹②，春往冬反，迷惑失道。管仲曰：“老马之智可用也。”乃放老马而随之，遂得道。行山中无水，隰朋曰：“蚁冬居山之阳，夏居山之阴，蚁壤③一寸而仞有水。”乃掘地，遂得水。"},{"id":"a170","t":"1．马诉冤","u":"第 二十九 单 元","x":"刘承节奉命赴任，自浙至赣，但与一子一仆乘马而行。至贵溪①，午驻逆旅②，逢数客亦投宿。刘箧③中银可百两，为客所窥。诸客皆盗也。是夜盗操杖入室。刘本从军，有膂力④，挥刀断其一臂，众惧遁散。刘促子与仆起，速去，然于贵溪城外高冈下，又与盗遇，虽与拒斗，而众寡不敌，并子仆死焉。所乘马踯躅⑤于道。适主簿⑥出，马迎之车前，屈足如拜。主簿怪之，曰：“是必有冤诉。”遂随马行，至高冈，马伫立不前，见满地血迹，三尸仆地，肢体尚暖。主簿督人访捕，不竟日而盗悉擒⑦。"},{"id":"a171","t":"2．楚人有担山鸡者","u":"第 二十九 单 元","x":"楚人有担山鸡者，路人问曰：“何鸟也？”担者欺之曰：“凤凰也。”路人曰：“我闻有凤凰久矣，今真见之，汝卖之乎？”曰：“然。”乃酬千金①，弗与②；请加倍，乃与之。方将献楚王，经宿而鸟死。路人不遑③惜其金，唯怅④不得以献耳。国人传之，咸以为真凤而贵，宜欲献之，遂闻于楚王。王感其欲献己也，召而厚赐之，过买凤之直⑤十倍矣。"},{"id":"a172","t":"3．某甲夜暴疾","u":"第 二十九 单 元","x":"某甲夜暴疾，命门人①钻火②。其夜阴暝，不得火，催之急，门人忿然曰：“君责人亦大无道理，今暗如漆，何以不把火照我？我当得觅钻火具，然后易得耳。”孔文举③闻之曰：“责人当以其方也。”"},{"id":"a173","t":"4．涸泽之蛇","u":"第 二十九 单 元","x":"泽①涸②，蛇将徙③。有小蛇谓大蛇曰：“子行而我随之，人以为蛇之行者④耳，必有杀子者；不如相衔，负我以行，人以我为神君⑤也。”乃相衔以越公道⑥。人皆避之，曰：“神君也。”"},{"id":"a174","t":"5．盗牛者强辩","u":"第 二十九 单 元","x":"有盗牛而被羁①者，熟识者过而问曰：“女②何事？”答云：“晦气③撞出来的。向④在街上闲走，见地上草绳一条，以为有用，拾得之耳。”问曰：“然则⑤罪何以至此？”复对云：“绳头还有一小小牛儿。”旁观者曰：“是盗牛者也，咎由自取，何强辩为⑥？”"},{"id":"a175","t":"王烈义行（阅读）","u":"第 三十 单 元","x":"王烈字彦方，太原人也。少师事①陈寔②，以义行称③。乡里有盗牛者，主得之，盗请罪曰：“刑戮是甘，乞不使王彦方知也。”烈闻而使人谢之，遗布一端④。或问其故，烈曰：“盗惧吾闻其过，是有耻恶之心。既怀耻恶，必能改善，故以此激⑤之。”后有老父遗⑦剑于路，行道一人见而守之，至暮，老父还，寻得剑，怪而问其姓名，以事告烈。烈使推求⑥，乃先盗牛者也。"},{"id":"a176","t":"1．于令仪诲人","u":"第 三十 单 元","x":"于令仪者，市井①人也，长厚②不忤物，晚年家颇丰富。一夕，盗入其家，诸子擒之，乃邻舍之子也。令仪曰：“汝素寡悔③，何苦而为盗耶？”曰：“迫于贫耳。”问其所欲，曰：“得十千④足以衣食。”如其欲与之。既去，复呼之，盗大恐，谓曰：“尔贫甚，夜负十千以归，恐为人所诘⑤，留之，至明使去⑥。”盗大感愧，卒为良民。"},{"id":"a177","t":"2．乡人藏虱","u":"第 三十 单 元","x":"乡人某者①，偶坐树下，扪得一虱②，片纸裹之，塞树孔中而去。后二三年，复经其处，忽忆之，视孔中裹宛然③。发而验之，虱薄如麸④。置掌中审顾之。少顷，掌中奇痒，而虱腹渐盈矣。置之而归。痒处核起，肿数日，死焉。"},{"id":"a178","t":"3．别字秀才","u":"第 三十 单 元","x":"一秀才嗜书，而别字良多。一日，读《水浒》，适友人造访①，见而问之曰：“君②读何书？”答曰：“《水许》。”友人怪之，曰：“书亦多矣，《水许》一书未之见也。”又曰：“书中所载，均为何人？”秀才曰：“有一李达，手持大斧二柄，有万夫不当之勇。”友人又问：“更有何人？”“有和尚鲁智沉。”友人默然，既而哑然失笑。"},{"id":"a179","t":"4．画鬼易","u":"第 三十 单 元","x":"客有为齐王①画者，齐王问曰：“画孰最难者？”曰：“犬马最难。”曰：“孰易者？”曰：“鬼魅②最易。夫犬马，人之所知也，旦暮罄③于前，不可类之；鬼魅无形者，故易之也。”"},{"id":"a180","t":"5．吹牛","u":"第 三十 单 元","x":"京师①选将军，群聚以观。有人出，首如斗②，足如箕③，真力士也。其时山东一人曰：“此辈未足魁伟，吾乡一巨人，立则头顶栋④。”山西一人曰：“吾乡一巨人更在上，坐则头顶梁⑤。”既而一人曰：“此皆未之奇⑥，吾乡有一巨人，开口时上唇抵栋，下唇搭地。”旁有难之者曰：“然则身何居乎⑦？”众咸哂⑧之。"},{"id":"a181","t":"老妪斗辽敌（阅读）","u":"第 三十一 单 元","x":"端拱①中，有妪独止店上②。会一虏③至，系马于门，持弓矢，坐定，呼妪汲水。妪持绠缶④趋井，悬而复止，因胡语呼虏为王，且告虏曰：“绠短，不能及⑤也，妪老力惫，王可自取之。”虏因系绠弓杪⑥，俯而汲焉。妪自后推虏堕井，跨马诣郡⑦。马之介甲⑧具焉，鞍之后复悬一彘首⑨。常山⑩民吏观而壮之。"},{"id":"a182","t":"1．巾帼潘将军","u":"第 三十一 单 元","x":"大眼①妻潘氏，善骑射，自诣军省大眼。至于攻阵游猎之际，大眼令妻潘戎装，或齐镳②战场，或并驱林壑③。及至还营，同坐幕下，对诸僚佐④，言笑自得，时指之谓人曰：“此潘将军也。”"},{"id":"a183","t":"2．擒贼","u":"第 三十一 单 元","x":"周氏夫妇，以渔为生，日出没风波。一日，二豪贼相谓曰：“伺①周之市，但留其妇时，吾可攫其金也。”于是窥周出。周既去，二豪贼持刀近船。周畜一犬，见之，狂吠。妇闻声而出。二贼跃上船，出刃胁之。犬啮贼，以故贼不得脱身。妇乘其无备，推堕一贼河中。一贼为犬所啮，痛甚。妇举刀欲劈之，贼色挠②，跪而谢。是时夫方归，见状，即缚二豪贼至官。"},{"id":"a184","t":"3．吕某刺虎","u":"第 三十一 单 元","x":"吕某自谓勇夫，好带刀剑，扬言万夫莫当。一日，南山有虎驰来，一村皆惊，闭户不敢出。吕某曰：“第一虎耳，何惧之！吾即缚之！”遂持剑而出。俄见虎，距百步许。虎大吼，眈眈相向。吕则两股战栗，顾左右无人，还走，五色无主①。少顷，村民启户出，见其仆地，不省人事。急治之，良久乃醒。人曰：“虎安在？”吕乃曰：“为我所逐矣！”众人相视而嘻。"},{"id":"a185","t":"4．笼中鹦鹉","u":"第 三十一 单 元","x":"富商有段姓者，畜①一鹦鹉，甚慧，能迎客与诵诗。段剪其两翅，置于雕笼中。熙宁②六年，段忽系狱。及归，问鹦鹉曰：“吾半年在狱，身不由己，极其怨苦。女在家有人喂饲，何其乐邪！”鹦鹉曰：“君半年在狱，早已不堪；吾多年在笼，何乐可言？”段大感悟，即日放之。"},{"id":"a186","t":"5．攘痒","u":"第 三十一 单 元","x":"向有人痒，令其子索之，三索而弗中①。又令其妻索之，五索而五弗中。其人勃然而怒曰：“知吾者妻也，而胡难我？”乃自引手，一索而痒绝。何者？痒者，人之所自知也，他人莫之知。犹心患，人何以知之？"},{"id":"a187","t":"子路见孔子（阅读）","u":"第 三十二 单 元","x":"子路见孔子。子曰：“汝何好乐①？”对曰：“好长剑。”孔子曰：“吾非此之问也。徒②请以子之能③，而加之以学问，岂可及乎？”子路曰：“南山有竹，不揉④自直，斩而用之，达于犀革⑤。以此言之，何学之有？”孔子曰：“括⑥而羽之，镞而砺之⑦，其入不亦深乎？”子路再拜曰：“敬受教。”"},{"id":"a188","t":"1．孙权吕蒙读书","u":"第 三十二 单 元","x":"孙权谓吕蒙曰：“卿今当途掌事①，不可不学！”蒙辞以军中多务。权曰：“孤岂欲卿治经②为博士③邪！但当涉猎，见往事耳。卿言多务，孰若孤？孤常读书，自以为大有所益。”蒙乃始就学。及鲁肃过寻阳④，与蒙论议，大惊曰：“卿今者才略，非复吴下阿蒙⑤！”蒙曰：“士别三日，即当刮目相待，大兄何见事之晚乎！”"},{"id":"a189","t":"2．响遏行云","u":"第 三十二 单 元","x":"薛谭学讴于秦青，未穷青之技，自谓尽之，遂辞归。秦青弗止，饯于郊衢，抚节①悲歌②，声振林木，响遏行云。薛谭乃谢求反，终身不敢言归。"},{"id":"a190","t":"3．王元章砍神像","u":"第 三十二 单 元","x":"绍兴①王元章②，国初③名士。所居与一神庙切近，炊缺薪，则斫④神像炊之。一邻家事神甚谨，遇元章毁像，辄⑤刻木补之，如是者三四。然元章家人岁无恙⑥，而邻之妻孥⑦时病。一日，召巫⑧降神，诘⑨神云：“彼屡毁神，神不责；吾辄为新之，神反不我佑，何也？”巫者作怒曰：“汝不置像，像何从而炊？”自是，其人不复补像，而庙遂废。"},{"id":"a191","t":"4．空中楼阁","u":"第 三十二 单 元","x":"昔有富人，痴无所知。至余①富家，见三重楼，高广严丽，心慕之，即念：吾有资，盍②造斯楼？乃召工匠，嘱以如是。翌日，工匠经③地垒砖，日入而息。富人见之，怪而问：“欲作何等？”匠曰：“先作底重。”富人曰：“吾不欲下重之屋。”匠曰：“何有不作下重而为第三重者？”富人固言欲如是。时人闻之，毋不嗤④之。"},{"id":"a192","t":"5．熊与坎中人","u":"第 三十二 单 元","x":"有人入山射鹿，忽堕一坎内，见熊子数头。须臾，有大熊入，以为必害己。良久，大熊出果分与诸子，末后作一份与此人。此人馁久，冒死啖之。每旦，熊母觅食还，辄分果与之，此人赖以支命。后熊子稍大，其母一一负而出。子既出尽，此人自分①必死坎中，而熊母复还，入坐人边。人解其意，便抱熊足，熊即跃出，遂不得死。呜呼，人言禽兽无义，然顾斯熊，安得言无情哉！"},{"id":"a193","t":"任末好学勤记（阅读）","u":"第 三十三 单 元","x":"任末①年十四，学无常师②，负笈③不远④险阻。每言人而⑤不学，则何以成。或依林木之下，编茅为庵⑥，削荆为笔，刻树汁为墨；夜则映星望月⑦，暗则缚⑧麻蒿以自照。观书有合意者，题其衣裳，以记其事。门徒⑨悦其勤学，更以净衣易之。非圣人之言不观。临终诫曰：“夫⑩人好学，虽死若存；不学者虽存，谓之行尸走肉⑪耳。”"},{"id":"a194","t":"1．蛇衔草","u":"第 三十三 单 元","x":"昔有田父①耕地，值见创②蛇焉。顷之，有一蛇衔草着创口上，竟日创蛇走。田父取其余叶治创，皆验。本不知草名，乡人因以“蛇衔”名之。古人云：蛇衔草能续已断之指如故。非妄言也。"},{"id":"a195","t":"2．智犬破案","u":"第 三十三 单 元","x":"去杭州百里许，有一古刹①，香火颇旺。一夕，有盗逾墙而入。犬吠，僧觉。盗劈僧首，立仆。遂越②货而亡。翌日，二小僧入室见之，讶甚。乃诣官讼，其犬亦从。途经一酒肆，见五六徒狂饮，犬伫足不前，僧怪之。俄而犬跃入肆，啮一徒不置。僧疑为盗，缚而送官。吏审之，果然。盖犬亦有智也。"},{"id":"a196","t":"3．神针道人","u":"第 三十三 单 元","x":"凌云①北游太山②，古庙前值病人，气垂绝。云嗟叹久之。一道人忽曰：“汝欲生之乎？”曰：“然。”道人针其左股，立苏。曰：“此人毒气内侵，非死也，毒散自生耳。”因授云针术，治病无不效。"},{"id":"a197","t":"4．杨务廉有巧思","u":"第 三十三 单 元","x":"杨务廉①甚有巧思，尝于沁州②市内刻木作僧，手执一碗，自能行乞。碗中投钱③，关键忽发，自然作声云：“布施④。”市人竞观，欲其作声，施者日盈数千。"},{"id":"a198","t":"5．多言何益","u":"第 三十三 单 元","x":"子禽①问曰：“多言有益乎？”墨子②曰：“虾蟆蛙蝇，日夜恒鸣，口干舌敝，然而莫之听。今观晨鸡，以时而鸣，天下振动。多言何益，唯其言之时也。”"},{"id":"a199","t":"盲人摸象（阅读）","u":"第 三十四 单 元","x":"昔印度有瞽①者四，相友善。然各自命②为智者，人亦因以智者目③之。一日，四瞽者立谈道左，有声跫④然而至，询诸⑤人，知其为象也。其一人曰：“象之形奚⑥若？吾辈向⑦者徒⑧事臆测⑨，今可实验⑩而知矣。”众皆曰：“善。”于是相率而至象前，扪⑪其体以测其形。四瞽者：一长而伟，立于象侧，扪其身，上下左右，摩挲⑫殆⑬遍，觉坦然一片也。一短而小，扪象之足；第三人握象鼻；第四人仅触象齿。既而各举象之形以相告。长而伟者曰：“象之形如墙，广而平，岸然⑭而高者也。”短小者进而斥之曰：“象之体若树干。汝以为墙，不亦谬⑮乎！”第三人曰：“象之形，非墙非树，有类⑯水管。”第四人前致词：“汝三人何其各逞⑰己见，而比拟不伦⑱也！夫象，其润如玉，触手可爱，直⑲一长梃⑳耳。”四瞽争辩，纷呶㉑不已，旁观者皆大笑。"},{"id":"a200","t":"1．盲子道涸溪","u":"第 三十四 单 元","x":"有盲子道涸溪，桥上失坠，两手攀楯①，兢兢②握固，自分③失手必堕深渊已④。过者告曰：“毋怖，第⑤放下即实地也。”盲子不信，握楯长号。久之，力惫，失手坠地。乃自哂⑥曰：“嘻！蚤⑦知为实地，何久自苦耶！”"},{"id":"a201","t":"2．众盲触象","u":"第 三十四 单 元","x":"有王告大臣，汝牵一象来示盲者。时众盲各以手触。大王唤众盲问之：“汝见象类何物？”触其牙者，言象如萝菔①根；触其耳者，言如箕②；触其脚者，言如臼③；触其脊者，言如床；触其腹者，言如瓮；触其尾者，言如绳。"},{"id":"a202","t":"3．木刻钟馗","u":"第 三十四 单 元","x":"宋庆历①中，有一术士②，姓李，多巧思。尝木刻一舞钟馗③，高三尺许，右手持铁简。以香饵置钟馗左手中，鼠缘手取食，则左手扼鼠，右手以简毙之。"},{"id":"a203","t":"4．商鞅立木","u":"第 三十四 单 元","x":"商鞅变法之令既具，未布，恐民之不信己，乃立三丈之木于国都市①之南门，募民有能徙置北门者，予十金②。民怪之，莫敢徙。复曰：“能徙者予五十金。”有一人徙之，辄予五十金，以明不欺。卒下令。"},{"id":"a204","t":"5．阿柴折箭","u":"第 三十四 单 元","x":"吐谷浑①阿柴有子二十人。病笃，命诸子各献一箭。取一箭授其弟慕利延，使折之。利延折之；又取十九箭使折之，利延不能折。阿柴喻之曰：“汝曹知之乎？单者易折，众则难摧。戮力②同心，社稷③可固。”言毕而卒。"},{"id":"a205","t":"匡衡凿壁借光（阅读）","u":"第 三十五 单 元","x":"匡衡①勤学而无烛，邻舍有烛而不逮②。衡乃穿壁以引其光，以书映光而读之。邑人大姓③文不识④，家富多书，衡乃与其佣作⑤而不求偿⑥。主人怪⑦问衡。衡曰：“愿得主人书遍读之。”主人感叹，资给⑧以书，遂成大学⑨。"},{"id":"a206","t":"1．承宫拾薪苦学","u":"第 三十五 单 元","x":"承宫少孤，年八岁，为人牧豕①。乡里徐子盛者，以《春秋经》②授诸生数百人。宫过息庐下，乐其业，因就听经，遂请留门下，为诸生拾薪，执苦数年，勤学不倦。"},{"id":"a207","t":"2．蔡侯纸","u":"第 三十五 单 元","x":"自古书契①，多编以竹简，其用缣②帛者谓之为纸。缣贵而简重，并不便于人。伦③乃造意④，用树肤、麻头及敝布、鱼网以为纸。元兴元年⑤，奏上之。帝善其能，自是莫不从用焉。故天下咸称“蔡侯纸”。"},{"id":"a208","t":"3．牧竖拾金","u":"第 三十五 单 元","x":"有牧竖①，敝衣蓬首赤足，日驱牛羊牧冈间，讴而乐，意惬甚，牧亦善。一日，拾遗金一饼②，内衣领中。自是歌声渐歇，牛羊亦时逸。心患失金，斯乃为金所累也。"},{"id":"a209","t":"4．解铃系铃","u":"第 三十五 单 元","x":"金陵①清凉泰钦法灯禅师②，性豪逸，不事事。众易之。法眼③独器重。眼一日问众：“虎项金铃，是谁解得？”众无对。师④适至，眼举前语问，师曰：“系者解得。”眼曰：“汝辈轻渠不得。”"},{"id":"a210","t":"5．认“真”","u":"第 三十五 单 元","x":"艾子游于郊外，弟子①通、执二人从焉。渴甚，使执子乞浆于田舍。有老父②倚门观书，执子揖而请。老父指卷中“真”字问曰：“识此字，馈尔浆。”执子曰：“‘真’字也。”老父怒，不与。执子返以告。艾子曰：“执也未达，通也当往。”通子见老父，老父如前示之。通子曰：“此‘直’、‘八’两字也。”老父喜，出家酿之美者与之。艾子饮而甘之，曰：“通也智哉！使复如执之认‘真’，一勺水吾且不得吞矣！”"},{"id":"a211","t":"旋风（阅读）","u":"第 三十六 单 元","x":"熙宁九年，恩州武城县①有旋风自东南来，望之插天②如羊角，大木尽拔。俄顷，旋风卷入云霄中。既而③渐近，乃经县城，官舍民居略尽④，悉卷入云中。县令儿女奴婢卷去复坠地，死伤者数人，民间死伤亡失者不可胜⑤计。县城悉为丘墟⑥。"},{"id":"a212","t":"1．地震","u":"第 三十六 单 元","x":"康熙①七年六月十七日戌刻②，地大震。余适客稷下③，方与表兄李笃之对烛饮。忽闻有声如雷，自东南来，向西北去。众骇异，不解其故。俄而几案④摆簸，酒杯倾覆；屋梁椽柱，错折⑤有声。相顾失色。久之，方知地震，各疾趋出。见楼阁房舍，仆而复起；墙倾屋塌之声，与儿啼女号，喧如鼎沸。人眩晕不能立，坐地上，随地转侧。河水倾泼丈余，鸡鸣犬吠满城中。逾一时许，始稍定。视街上，则男女裸聚，竞相告语，并忘其未衣也。后闻某处井倾仄⑥，不可汲；某家楼台南北易向⑦；栖霞山裂；沂水陷穴，广数亩。此真非常之奇变也。"},{"id":"a213","t":"2．多忧者","u":"第 三十六 单 元","x":"沈屯子①偕友入市，闻谈者言：“杨文广②围困柳州城中，内乏粮饷，外阻援兵。”蹙然踊叹不已。友曳之归。日夜念不置，曰：“文广围困至此，何由得解？”从此悒悒成疾。家人劝之徘徊郊外，以纾其意。又忽见道上有负竹入市者，则又念曰：“竹末甚锐，衢上行人必有受戕③者。”归而益忧。夫世之多忧者类此也。"},{"id":"a214","t":"3．穿井得一人","u":"第 三十六 单 元","x":"宋①之丁氏，家无井，而出溉汲，常一人居外。及其家穿②井，告人曰：“吾穿井得一人。”有闻而传之者：“丁氏穿井得一人。”国人道之，闻之于宋君。宋君令人问诸丁氏。丁氏对曰：“得一人之使，非得一人于井中也。”"},{"id":"a215","t":"4．不识自家","u":"第 三十六 单 元","x":"有愚者，常于户外县①履为志。一日出门，及午，忽暴雨，其妻收履。至薄暮，愚者归，不见履，曰：“吾家徙乎？”不进。妻见而怪之，曰：“是汝家，何不入？”愚者曰：“毋②履，非吾室。”妻曰：“汝何以不识吾？”愚者熟视，乃悟。"},{"id":"a216","t":"5．两瞽","u":"第 三十六 单 元","x":"新市①有齐瞽②者，行乞衢中。人弗之避，辄③忿骂曰：“汝眼瞎耶？”市人以其瞽，多不较。嗣④有梁⑤瞽者，性尤戾⑥，亦行乞衢中。遭之，相触而踬⑦。梁瞽固不知彼亦瞽也，乃起而忿骂曰：“汝眼亦瞎耶？”两瞽相诟⑧，市人哂⑨之。噫！己瞽人亦瞽，而诟责无已者，何以异于是？"},{"id":"a217","t":"焚鼠毁庐（阅读）","u":"第 三十七 单 元","x":"越西①有独居男子，结茨②以为庐，力耕以为食，菽③粟盐酪④，具无仰于人。尝⑤患鼠，昼则累累然⑥行，夜则鸣啮至旦。男子积憾⑦久之，目不得瞑。男子怒，持火四焚之，鼠死庐亦毁。次日酒解，怅怅然⑧无所归。龙门子⑨唁之。男子曰：“人不可积憾哉！予初怒鼠甚，见鼠不见庐也，不知祸至于此。”"},{"id":"a218","t":"1．莽汉断棘","u":"第 三十七 单 元","x":"终南之山①有棘满径，骨柔而刺密。触之者恒胶结②不可解，不受伤不已。人畏其刺，咸迂其途避之。一人义形于色，褰③裳而入，欲节节④而断之。孰知左断于指，而右曳于臂，下钩其裾，上牵其袖，惫已甚。君子曰：“斯人之疾恶是矣，疾之而不以其道。苟持斧，求其本而艾⑤之，何棘不去？”"},{"id":"a219","t":"2．宾卑聚自杀","u":"第 三十七 单 元","x":"齐庄公①时，有士②曰宾卑聚。梦有壮士，新素履，墨剑囊，从而斥之，唾其面。宾卑聚惕然而寤，徒梦也，终夜坐不自快。明日，召其友告之曰：“吾少好勇，年且六十而无所挫辱。今夜辱，吾将索其形。期得之，则可；不得，将死之。”每朝与其友俱立乎③衢。三日不得，却而自殁④。"},{"id":"a220","t":"3．齐之好勇者","u":"第 三十七 单 元","x":"齐之好勇者，一人居东郭，一人居西郭。卒①然相遇于途，曰：“盍相饮乎？”饮数行②，曰：“姑③求肉乎？”一人曰：“子，肉也；我，肉也。尚胡求肉为？”于是具染④已，因抽刀割己肉而啖，至死而止。勇若此，不若无勇。"},{"id":"a221","t":"4．引婴儿投江","u":"第 三十七 单 元","x":"有过于江上者，见人方引①婴儿而欲投之江中，婴儿啼。人问其故。曰：“此其父善游。”其父虽善游，其子岂遽②善游哉？以此任物③，亦必悖④矣。"},{"id":"a222","t":"5．楚人不识姜","u":"第 三十七 单 元","x":"楚①人有生而不识姜者，曰：“此从树上结成。”或曰：“从土里生成。”其人固执己见，曰：“请与子以十人为质②，以所乘驴为赌③。”已而遍问十人，皆曰：“土里出也。”其人哑然失色，曰：“驴则付汝，姜还树生。”"},{"id":"a223","t":"南岐人之瘿（阅读）","u":"第 三十八 单 元","x":"南岐在秦蜀①山谷中，其水甘而不良，凡饮之者辄病瘿②，故其地之民无一人无瘿者。及见外方人③至，则群小④妇人聚观而笑之曰：“异哉，人之颈也！焦⑤而不吾类⑥！”外方人曰：“尔之垒然⑦凸出于颈者，瘿病之也，不求善药去尔病，反以吾颈为焦耶？”笑者曰：“吾乡之人皆然，焉用去乎哉！”终莫知其为丑。"},{"id":"a224","t":"1．狂泉","u":"第 三十八 单 元","x":"昔有一国，国中一水，号曰“狂泉”。国人饮此水，无不狂。唯国君穿井而汲，独得无恙。国人既并狂，反谓国主不狂为狂，于是聚谋，共执国主，疗其狂疾，火艾①针药，莫不毕具。国主不任其苦，于是到泉所酌水饮之，饮毕便狂。君臣大小，其狂若一，众乃欢然。"},{"id":"a225","t":"2．鼠技虎名","u":"第 三十八 单 元","x":"楚①人谓虎为“老虫”，姑苏②人谓鼠为“老虫”。余官长洲③，以事至娄东④，灭烛就寝，忽闻碗碟有声。余问故，阍童⑤答曰：“老虫。”余，楚人也，不胜惊错，曰：“城中安得有此兽？”童曰：“非他兽，鼠也。”余曰：“鼠何名老虫？”童谓吴俗相传耳。嗟乎！鼠冒老虫之名，致余惊愕欲走，良足发笑。然今天下冒虚名而骇世俗者，不寡矣！至于挟鼠技、冒虎名，立民上者，皆鼠辈也，天下事不可不大忧耶？"},{"id":"a226","t":"3．北人不识菱者","u":"第 三十八 单 元","x":"北人生而不识菱①者，仕于南方，席上啖菱，并壳入口。或曰：“啖菱须去壳。”其人自护所短，曰：“我非不知，并壳者，欲以清热也。”问者曰：“北土亦有此物否？”答曰：“前山后山，何地不有！”"},{"id":"a227","t":"4．病忘者","u":"第 三十八 单 元","x":"齐①有病忘者，行则忘止，卧则忘起。其妻患之，谓曰：“闻艾子多知，能愈子之疾，盍往治之？”其人曰：“善。”于是乘马挟弓矢而行。未一舍②，内逼③，下马而便焉。矢植于土，马系于树。便讫，左顾而睹其矢，曰：“危乎！流矢奚自？几乎中予！”右顾而睹其马，喜曰：“虽受虚惊，乃得一马。”引马反向而行。须臾抵家，徘徊门外，曰：“此何人居？岂艾子所寓也？”其妻适见之，知其又忘矣，斥之。其人怅然④曰：“娘子素非相识，何故出语伤人？”"},{"id":"a228","t":"5．斗牛而废耕","u":"第 三十八 单 元","x":"卫懿公①好禽兽，见抵牛②而说之，禄其牧人如中士③。宁子谏曰：“岂可！牛之用于耕而不在抵。抵其牛，耕必废。耕，国之本也，其可废乎？臣闻之，君人者不以欲妨民。”弗听。于是卫牛之抵者，贾十倍于耕牛，牧牛者皆释耕而教抵，农官弗能禁。"}],"lex":[{"w":"之","m":"他，指哑孝子。","u":[{"id":"a10","t":"3．哑孝子","s":"崔长生，生而哑，性至孝；人呼\"哑孝子\"。孝子既哑，左手复挛，佣工养其父母。后乡里大饥①，孝子行乞于外，人悯之，遗②以糟糠，受而纳诸箪，自掘野草以食。归则扶其跛父"},{"id":"a37","t":"范仲淹有志于天下（阅读）","s":"范仲淹二岁而孤，母贫无依，再适长山朱氏。既长，知其世家，感泣辞母，去之南都入学舍。昼夜苦学，五年未尝解衣就寝。或夜昏怠，辄以水沃面。往往饘粥不充，日昃始食；遂大"},{"id":"a67","t":"林逋养鹤（阅读）","s":"林逋①隐居杭州孤山，常畜两鹤，纵之则飞入云霄，盘旋久之，复入笼中。逋常泛小艇游西湖诸寺。有客至逋所居，则一童子出，应门延客坐，为开笼纵鹤。良久，逋必棹小船而归，"},{"id":"a82","t":"3. 韩娥善歌","s":"昔韩娥东之齐，匮粮，过雍门①，鬻歌乞食。既去，而余音绕梁②，三日不绝。左右以其人弗去。过逆旅③，逆旅主人辱之，韩娥因曼声④哀哭，一里老幼悲愁，垂涕相对，三日不食"},{"id":"a99","t":"4. 雁冢","s":"无锡①荡口镇，有人得一雁，将杀而烹之。有书生见而悯焉，买以归，畜之以为玩。惧其逸去，以线联其两翅，使不得飞。雁杂处鸡鹜间，亦颇驯，惟闻长空雁唳②，辄昂首而鸣。一"},{"id":"a183","t":"2．擒贼","s":"周氏夫妇，以渔为生，日出没风波。一日，二豪贼相谓曰：“伺①周之市，但留其妇时，吾可攫其金也。”于是窥周出。周既去，二豪贼持刀近船。周畜一犬，见之，狂吠。妇闻声而"},{"id":"a221","t":"4．引婴儿投江","s":"有过于江上者，见人方引①婴儿而欲投之江中，婴儿啼。人问其故。曰：“此其父善游。”其父虽善游，其子岂遽②善游哉？以此任物③，亦必悖④矣。"}]},{"w":"与","m":"给。","u":[{"id":"a23","t":"4．蜜中鼠屎案","s":"孙亮①出②西苑，方食生梅，使黄门③至宫中藏取蜜渍梅。蜜中有鼠屎。召问藏吏，藏吏叩头。亮问吏曰：\"黄门从汝求蜜耶？\"曰：\"向求，实不敢与。\"黄门不服，侍中④刁玄、"},{"id":"a45","t":"2. 刘氏善举","s":"刘氏者，某乡寡妇也。育一儿，昼则疾耕于田亩，夜则纺织于烛下，竟年如是。邻有贫乏者，刘氏辄(zhé)以斗升相济。偶有无衣者，刘氏以己之衣遗(wèi)之。乡里咸称其"},{"id":"a142","t":"3．秦西巴纵麑","s":"鲁①贵人孟孙，猎得麑②，使秦西巴持归。其母随而鸣，秦西巴见其哀，纵而与之。麑随母而去。孟孙怒曰：“吾猎得麑，尔纵之，何也？”秦西巴曰：“但不忍耳。”孟孙逐秦西巴"},{"id":"a205","t":"匡衡凿壁借光（阅读）","s":"匡衡①勤学而无烛，邻舍有烛而不逮②。衡乃穿壁以引其光，以书映光而读之。邑人大姓③文不识④，家富多书，衡乃与其佣作⑤而不求偿⑥。主人怪⑦问衡。衡曰：“愿得主人书遍"},{"id":"a210","t":"5．认“真”","s":"艾子游于郊外，弟子①通、执二人从焉。渴甚，使执子乞浆于田舍。有老父②倚门观书，执子揖而请。老父指卷中“真”字问曰：“识此字，馈尔浆。”执子曰：“‘真’字也。”老"},{"id":"a222","t":"5．楚人不识姜","s":"楚①人有生而不识姜者，曰：“此从树上结成。”或曰：“从土里生成。”其人固执己见，曰：“请与子以十人为质②，以所乘驴为赌③。”已而遍问十人，皆曰：“土里出也。”其"}]},{"w":"为","m":"替，给。","u":[{"id":"a25","t":"鹦鹉灭火","s":"有鹦鹉飞集他山①，山中禽兽辄相贵重②。鹦鹉自念：虽乐，不可久也，便去③。后数日，山中大火，鹦鹉遥见，便入水濡羽④，飞而洒之。天神言：\"汝虽有志⑤，意何足云也⑥？"},{"id":"a49","t":"放驴破案（阅读）","s":"唐张鹫(zhuó)为河阳①尉。有客驴，缰断，并②鞍失之。三日访③不获，诣县告。鹫推穷④甚急，乃夜放驴出而藏其鞍。鹫曰：\"此可知也。\"遂令不秣饲驴⑤，去辔⑥放之。"},{"id":"a93","t":"4. 为者常成","s":"梁丘据①谓晏子曰：“吾至死不及夫子②矣。”晏子曰：“婴③闻之：为者常成，行者常至。婴非有异于人也④，常为而不置⑤，常行而不休⑥而已矣。”"},{"id":"a151","t":"欧阳修论作文（阅读）","s":"顷岁①孙莘老②识欧阳文忠公③，尝乘间以文字问之。云：“无它术，唯勤读书而多为之，自工；世人患④作文字少，又懒读书，每一篇出，即求过人，如此少有至者。疵⑤病不必待"},{"id":"a174","t":"5．盗牛者强辩","s":"有盗牛而被羁①者，熟识者过而问曰：“女②何事？”答云：“晦气③撞出来的。向④在街上闲走，见地上草绳一条，以为有用，拾得之耳。”问曰：“然则⑤罪何以至此？”复对云"},{"id":"a179","t":"4．画鬼易","s":"客有为齐王①画者，齐王问曰：“画孰最难者？”曰：“犬马最难。”曰：“孰易者？”曰：“鬼魅②最易。夫犬马，人之所知也，旦暮罄③于前，不可类之；鬼魅无形者，故易之也"},{"id":"a188","t":"1．孙权吕蒙读书","s":"孙权谓吕蒙曰：“卿今当途掌事①，不可不学！”蒙辞以军中多务。权曰：“孤岂欲卿治经②为博士③邪！但当涉猎，见往事耳。卿言多务，孰若孤？孤常读书，自以为大有所益。”"},{"id":"a190","t":"3．王元章砍神像","s":"绍兴①王元章②，国初③名士。所居与一神庙切近，炊缺薪，则斫④神像炊之。一邻家事神甚谨，遇元章毁像，辄⑤刻木补之，如是者三四。然元章家人岁无恙⑥，而邻之妻孥⑦时病"},{"id":"a206","t":"1．承宫拾薪苦学","s":"承宫少孤，年八岁，为人牧豕①。乡里徐子盛者，以《春秋经》②授诸生数百人。宫过息庐下，乐其业，因就听经，遂请留门下，为诸生拾薪，执苦数年，勤学不倦。"},{"id":"a215","t":"4．不识自家","s":"有愚者，常于户外县①履为志。一日出门，及午，忽暴雨，其妻收履。至薄暮，愚者归，不见履，曰：“吾家徙乎？”不进。妻见而怪之，曰：“是汝家，何不入？”愚者曰：“毋②"},{"id":"a220","t":"3．齐之好勇者","s":"齐之好勇者，一人居东郭，一人居西郭。卒①然相遇于途，曰：“盍相饮乎？”饮数行②，曰：“姑③求肉乎？”一人曰：“子，肉也；我，肉也。尚胡求肉为？”于是具染④已，因"},{"id":"a223","t":"南岐人之瘿（阅读）","s":"南岐在秦蜀①山谷中，其水甘而不良，凡饮之者辄病瘿②，故其地之民无一人无瘿者。及见外方人③至，则群小④妇人聚观而笑之曰：“异哉，人之颈也！焦⑤而不吾类⑥！”外方人"},{"id":"a224","t":"1．狂泉","s":"昔有一国，国中一水，号曰“狂泉”。国人饮此水，无不狂。唯国君穿井而汲，独得无恙。国人既并狂，反谓国主不狂为狂，于是聚谋，共执国主，疗其狂疾，火艾①针药，莫不毕具"},{"id":"a225","t":"2．鼠技虎名","s":"楚①人谓虎为“老虫”，姑苏②人谓鼠为“老虫”。余官长洲③，以事至娄东④，灭烛就寝，忽闻碗碟有声。余问故，阍童⑤答曰：“老虫。”余，楚人也，不胜惊错，曰：“城中安"}]},{"w":"耳","m":"罢了。","u":[{"id":"a25","t":"鹦鹉灭火","s":"有鹦鹉飞集他山①，山中禽兽辄相贵重②。鹦鹉自念：虽乐，不可久也，便去③。后数日，山中大火，鹦鹉遥见，便入水濡羽④，飞而洒之。天神言：\"汝虽有志⑤，意何足云也⑥？"},{"id":"a118","t":"5. 燕人返国","s":"燕人生于燕，长于楚，及老而还本国。过晋国，同行者诳①之。指城曰：“此燕国之城。”其人愀然②变容。指社③曰：“此若④里之社。”乃喟然⑤而叹。指舍⑥曰：“此若先人之"},{"id":"a146","t":"1．陶侃尝出游","s":"陶侃尝出游①，见人持一把未熟稻，侃问：“用此何为？”人云：“行道所见，聊取之耳。”侃作色大怒曰：“汝不田，而贼人稻！”执而鞭之。是以百姓勤于农耕，家给人足。"},{"id":"a157","t":"关羽刮骨疗毒（阅读）","s":"羽①尝为流矢②所中，贯③其左臂，后创虽愈，每至阴雨，骨常疼痛。医曰：“矢镞④有毒，毒入于骨，当破臂作⑤创，刮骨去毒，然后此患乃除耳。”羽便伸臂令医劈之。时羽适请"},{"id":"a163","t":"顾况戏白居易（阅读）","s":"乐天①初举，名未振，以歌诗投顾况②。况戏之曰：“长安③物贵，居大不易④。”及读至《原上草》，云：“野火烧不尽，春风吹又生。”曰：“有句如此，居亦何难？老夫前言戏"},{"id":"a172","t":"3．某甲夜暴疾","s":"某甲夜暴疾，命门人①钻火②。其夜阴暝，不得火，催之急，门人忿然曰：“君责人亦大无道理，今暗如漆，何以不把火照我？我当得觅钻火具，然后易得耳。”孔文举③闻之曰：“"},{"id":"a173","t":"4．涸泽之蛇","s":"泽①涸②，蛇将徙③。有小蛇谓大蛇曰：“子行而我随之，人以为蛇之行者④耳，必有杀子者；不如相衔，负我以行，人以我为神君⑤也。”乃相衔以越公道⑥。人皆避之，曰：“神"},{"id":"a174","t":"5．盗牛者强辩","s":"有盗牛而被羁①者，熟识者过而问曰：“女②何事？”答云：“晦气③撞出来的。向④在街上闲走，见地上草绳一条，以为有用，拾得之耳。”问曰：“然则⑤罪何以至此？”复对云"},{"id":"a184","t":"3．吕某刺虎","s":"吕某自谓勇夫，好带刀剑，扬言万夫莫当。一日，南山有虎驰来，一村皆惊，闭户不敢出。吕某曰：“第一虎耳，何惧之！吾即缚之！”遂持剑而出。俄见虎，距百步许。虎大吼，眈"},{"id":"a188","t":"1．孙权吕蒙读书","s":"孙权谓吕蒙曰：“卿今当途掌事①，不可不学！”蒙辞以军中多务。权曰：“孤岂欲卿治经②为博士③邪！但当涉猎，见往事耳。卿言多务，孰若孤？孤常读书，自以为大有所益。”"},{"id":"a193","t":"任末好学勤记（阅读）","s":"任末①年十四，学无常师②，负笈③不远④险阻。每言人而⑤不学，则何以成。或依林木之下，编茅为庵⑥，削荆为笔，刻树汁为墨；夜则映星望月⑦，暗则缚⑧麻蒿以自照。观书有"},{"id":"a196","t":"3．神针道人","s":"凌云①北游太山②，古庙前值病人，气垂绝。云嗟叹久之。一道人忽曰：“汝欲生之乎？”曰：“然。”道人针其左股，立苏。曰：“此人毒气内侵，非死也，毒散自生耳。”因授云"},{"id":"a201","t":"2．众盲触象","s":"有王告大臣，汝牵一象来示盲者。时众盲各以手触。大王唤众盲问之：“汝见象类何物？”触其牙者，言象如萝菔①根；触其耳者，言如箕②；触其脚者，言如臼③；触其脊者，言如"},{"id":"a225","t":"2．鼠技虎名","s":"楚①人谓虎为“老虫”，姑苏②人谓鼠为“老虫”。余官长洲③，以事至娄东④，灭烛就寝，忽闻碗碟有声。余问故，阍童⑤答曰：“老虫。”余，楚人也，不胜惊错，曰：“城中安"}]},{"w":"以","m":"而，来（表目的）。","u":[{"id":"a44","t":"1. 黄仙裳济友","s":"泰州守田雪龛(kān)居官廉，黄仙裳与周旋，绝不干以私。后田落职，在州不得去。黄自汝宁归，囊中但有二十金。乃先至田寓，分其半以赠。后语人曰：\"是日吾先至家，则家"},{"id":"a167","t":"4．何梅谷之妻","s":"何梅谷，鄱阳①人也。其妻垂老，好佛事，自旦至夕，必口念“观音菩萨”千遍。何梅谷以儒学闻于时，止之则弗从，弗止又恐贻笑士人②，进退狼狈。一日，呼妻至再三，随夜随呼"},{"id":"a183","t":"2．擒贼","s":"周氏夫妇，以渔为生，日出没风波。一日，二豪贼相谓曰：“伺①周之市，但留其妇时，吾可攫其金也。”于是窥周出。周既去，二豪贼持刀近船。周畜一犬，见之，狂吠。妇闻声而"},{"id":"a188","t":"1．孙权吕蒙读书","s":"孙权谓吕蒙曰：“卿今当途掌事①，不可不学！”蒙辞以军中多务。权曰：“孤岂欲卿治经②为博士③邪！但当涉猎，见往事耳。卿言多务，孰若孤？孤常读书，自以为大有所益。”"},{"id":"a191","t":"4．空中楼阁","s":"昔有富人，痴无所知。至余①富家，见三重楼，高广严丽，心慕之，即念：吾有资，盍②造斯楼？乃召工匠，嘱以如是。翌日，工匠经③地垒砖，日入而息。富人见之，怪而问：“欲"},{"id":"a194","t":"1．蛇衔草","s":"昔有田父①耕地，值见创②蛇焉。顷之，有一蛇衔草着创口上，竟日创蛇走。田父取其余叶治创，皆验。本不知草名，乡人因以“蛇衔”名之。古人云：蛇衔草能续已断之指如故。非"},{"id":"a201","t":"2．众盲触象","s":"有王告大臣，汝牵一象来示盲者。时众盲各以手触。大王唤众盲问之：“汝见象类何物？”触其牙者，言象如萝菔①根；触其耳者，言如箕②；触其脚者，言如臼③；触其脊者，言如"},{"id":"a202","t":"3．木刻钟馗","s":"宋庆历①中，有一术士②，姓李，多巧思。尝木刻一舞钟馗③，高三尺许，右手持铁简。以香饵置钟馗左手中，鼠缘手取食，则左手扼鼠，右手以简毙之。"},{"id":"a203","t":"4．商鞅立木","s":"商鞅变法之令既具，未布，恐民之不信己，乃立三丈之木于国都市①之南门，募民有能徙置北门者，予十金②。民怪之，莫敢徙。复曰：“能徙者予五十金。”有一人徙之，辄予五十"},{"id":"a206","t":"1．承宫拾薪苦学","s":"承宫少孤，年八岁，为人牧豕①。乡里徐子盛者，以《春秋经》②授诸生数百人。宫过息庐下，乐其业，因就听经，遂请留门下，为诸生拾薪，执苦数年，勤学不倦。"},{"id":"a207","t":"2．蔡侯纸","s":"自古书契①，多编以竹简，其用缣②帛者谓之为纸。缣贵而简重，并不便于人。伦③乃造意④，用树肤、麻头及敝布、鱼网以为纸。元兴元年⑤，奏上之。帝善其能，自是莫不从用焉"},{"id":"a216","t":"5．两瞽","s":"新市①有齐瞽②者，行乞衢中。人弗之避，辄③忿骂曰：“汝眼瞎耶？”市人以其瞽，多不较。嗣④有梁⑤瞽者，性尤戾⑥，亦行乞衢中。遭之，相触而踬⑦。梁瞽固不知彼亦瞽也，"},{"id":"a218","t":"1．莽汉断棘","s":"终南之山①有棘满径，骨柔而刺密。触之者恒胶结②不可解，不受伤不已。人畏其刺，咸迂其途避之。一人义形于色，褰③裳而入，欲节节④而断之。孰知左断于指，而右曳于臂，下"},{"id":"a222","t":"5．楚人不识姜","s":"楚①人有生而不识姜者，曰：“此从树上结成。”或曰：“从土里生成。”其人固执己见，曰：“请与子以十人为质②，以所乘驴为赌③。”已而遍问十人，皆曰：“土里出也。”其"},{"id":"a225","t":"2．鼠技虎名","s":"楚①人谓虎为“老虫”，姑苏②人谓鼠为“老虫”。余官长洲③，以事至娄东④，灭烛就寝，忽闻碗碟有声。余问故，阍童⑤答曰：“老虫。”余，楚人也，不胜惊错，曰：“城中安"},{"id":"a228","t":"5．斗牛而废耕","s":"卫懿公①好禽兽，见抵牛②而说之，禄其牧人如中士③。宁子谏曰：“岂可！牛之用于耕而不在抵。抵其牛，耕必废。耕，国之本也，其可废乎？臣闻之，君人者不以欲妨民。”弗听"}]},{"w":"乃","m":"于是。","u":[{"id":"a44","t":"1. 黄仙裳济友","s":"泰州守田雪龛(kān)居官廉，黄仙裳与周旋，绝不干以私。后田落职，在州不得去。黄自汝宁归，囊中但有二十金。乃先至田寓，分其半以赠。后语人曰：\"是日吾先至家，则家"},{"id":"a69","t":"2. 明义法师之鸠","s":"浙江盐官县庆善寺明义法师，屏居乡里。一日晨起，行径中，见鸠雏堕地，携而归，躬自哺饲。两月乃能飞。日则纵飞林间，夜则投宿法师屏几间。是岁十月，明义法师之徒惠月主掌"},{"id":"a73","t":"道士救虎（阅读）","s":"一夕，山水大出，漂室庐①，塞溪而下。人骑木乘②屋，号呼求救者声相连也。道士具大舟，蓑笠，立水浒，督善水者绳以俟，人至即投木、索引之，所存活者甚众。平旦，有兽身没"},{"id":"a88b","t":"4. 庖夫","s":"昔有庖夫①，甚迂。于市市鸡及肉归，置厨中。适有友人造访，遂入室聚谈。友人去，见犬猫啮鸡、肉。庖夫驱曰：\"尔何不仁？吾何损尔？\"其似不闻，啮之愈甚。庖夫又曰：\"吾"},{"id":"a99","t":"4. 雁冢","s":"无锡①荡口镇，有人得一雁，将杀而烹之。有书生见而悯焉，买以归，畜之以为玩。惧其逸去，以线联其两翅，使不得飞。雁杂处鸡鹜间，亦颇驯，惟闻长空雁唳②，辄昂首而鸣。一"},{"id":"a114","t":"1. 赵某误子","s":"赵某者，吴①人也。家富多藏，有子三。三子皆不学无术，恃②父多金，朝夕挥霍，不务正业。有一叟善意相劝，曰：“尔之子，俱游手好闲，一旦尔殁，将何以自食？当戒之从学，"},{"id":"a121","t":"鲁侯养鸟（阅读）","s":"昔者海鸟止于鲁郊①。鲁侯御而觞②之于庙，奏《九韶》③以为乐，具太牢④以为膳。鸟乃⑤眩视⑥忧悲，不敢食一脔⑦，不敢饮一杯，三日而死。此以己养⑧养鸟也，非以鸟养⑨养"},{"id":"a145","t":"陶母责子（阅读）","s":"陶公①少时作鱼梁吏②，尝以坩鲊③饷④母。母封鲊付使⑤，反书⑥责侃曰：“汝为吏，以官物见饷，非唯不益，乃增吾忧也。”"},{"id":"a175","t":"王烈义行（阅读）","s":"王烈字彦方，太原人也。少师事①陈寔②，以义行称③。乡里有盗牛者，主得之，盗请罪曰：“刑戮是甘，乞不使王彦方知也。”烈闻而使人谢之，遗布一端④。或问其故，烈曰：“"},{"id":"a176","t":"1．于令仪诲人","s":"于令仪者，市井①人也，长厚②不忤物，晚年家颇丰富。一夕，盗入其家，诸子擒之，乃邻舍之子也。令仪曰：“汝素寡悔③，何苦而为盗耶？”曰：“迫于贫耳。”问其所欲，曰："},{"id":"a188","t":"1．孙权吕蒙读书","s":"孙权谓吕蒙曰：“卿今当途掌事①，不可不学！”蒙辞以军中多务。权曰：“孤岂欲卿治经②为博士③邪！但当涉猎，见往事耳。卿言多务，孰若孤？孤常读书，自以为大有所益。”"},{"id":"a191","t":"4．空中楼阁","s":"昔有富人，痴无所知。至余①富家，见三重楼，高广严丽，心慕之，即念：吾有资，盍②造斯楼？乃召工匠，嘱以如是。翌日，工匠经③地垒砖，日入而息。富人见之，怪而问：“欲"},{"id":"a195","t":"2．智犬破案","s":"去杭州百里许，有一古刹①，香火颇旺。一夕，有盗逾墙而入。犬吠，僧觉。盗劈僧首，立仆。遂越②货而亡。翌日，二小僧入室见之，讶甚。乃诣官讼，其犬亦从。途经一酒肆，见"},{"id":"a200","t":"1．盲子道涸溪","s":"有盲子道涸溪，桥上失坠，两手攀楯①，兢兢②握固，自分③失手必堕深渊已④。过者告曰：“毋怖，第⑤放下即实地也。”盲子不信，握楯长号。久之，力惫，失手坠地。乃自哂⑥"},{"id":"a203","t":"4．商鞅立木","s":"商鞅变法之令既具，未布，恐民之不信己，乃立三丈之木于国都市①之南门，募民有能徙置北门者，予十金②。民怪之，莫敢徙。复曰：“能徙者予五十金。”有一人徙之，辄予五十"},{"id":"a208","t":"3．牧竖拾金","s":"有牧竖①，敝衣蓬首赤足，日驱牛羊牧冈间，讴而乐，意惬甚，牧亦善。一日，拾遗金一饼②，内衣领中。自是歌声渐歇，牛羊亦时逸。心患失金，斯乃为金所累也。"},{"id":"a211","t":"旋风（阅读）","s":"熙宁九年，恩州武城县①有旋风自东南来，望之插天②如羊角，大木尽拔。俄顷，旋风卷入云霄中。既而③渐近，乃经县城，官舍民居略尽④，悉卷入云中。县令儿女奴婢卷去复坠地"},{"id":"a215","t":"4．不识自家","s":"有愚者，常于户外县①履为志。一日出门，及午，忽暴雨，其妻收履。至薄暮，愚者归，不见履，曰：“吾家徙乎？”不进。妻见而怪之，曰：“是汝家，何不入？”愚者曰：“毋②"},{"id":"a224","t":"1．狂泉","s":"昔有一国，国中一水，号曰“狂泉”。国人饮此水，无不狂。唯国君穿井而汲，独得无恙。国人既并狂，反谓国主不狂为狂，于是聚谋，共执国主，疗其狂疾，火艾①针药，莫不毕具"},{"id":"a227","t":"4．病忘者","s":"齐①有病忘者，行则忘止，卧则忘起。其妻患之，谓曰：“闻艾子多知，能愈子之疾，盍往治之？”其人曰：“善。”于是乘马挟弓矢而行。未一舍②，内逼③，下马而便焉。矢植于"}]},{"w":"者","m":"……的人。","u":[{"id":"a45","t":"2. 刘氏善举","s":"刘氏者，某乡寡妇也。育一儿，昼则疾耕于田亩，夜则纺织于烛下，竟年如是。邻有贫乏者，刘氏辄(zhé)以斗升相济。偶有无衣者，刘氏以己之衣遗(wèi)之。乡里咸称其"},{"id":"a168","t":"5．庸医","s":"有医者，自称善外科。一裨将①阵回，中流矢②，深入膜③内，延使治，乃持剪剪去管，跪而请谢。裨将曰：“镞在膜内须亟治。”医曰：“此内科事，不意并责我。”"},{"id":"a221","t":"4．引婴儿投江","s":"有过于江上者，见人方引①婴儿而欲投之江中，婴儿啼。人问其故。曰：“此其父善游。”其父虽善游，其子岂遽②善游哉？以此任物③，亦必悖④矣。"}]},{"w":"其","m":"作语气副词用，相当于\"还是\"。","u":[{"id":"a66","t":"5. 狮子王与豺","s":"昔有狮子王，于深山搜一豺，将食之。豺曰：\"请为王月送二鹿以自赎。\"狮子王悦。豺以时而进，已亦得狸、兔自存。期年，鹿尽，豺无可送者。狮子王遇豺，曰：\"汝杀众生亦多"},{"id":"a216","t":"5．两瞽","s":"新市①有齐瞽②者，行乞衢中。人弗之避，辄③忿骂曰：“汝眼瞎耶？”市人以其瞽，多不较。嗣④有梁⑤瞽者，性尤戾⑥，亦行乞衢中。遭之，相触而踬⑦。梁瞽固不知彼亦瞽也，"},{"id":"a223","t":"南岐人之瘿（阅读）","s":"南岐在秦蜀①山谷中，其水甘而不良，凡饮之者辄病瘿②，故其地之民无一人无瘿者。及见外方人③至，则群小④妇人聚观而笑之曰：“异哉，人之颈也！焦⑤而不吾类⑥！”外方人"},{"id":"a227","t":"4．病忘者","s":"齐①有病忘者，行则忘止，卧则忘起。其妻患之，谓曰：“闻艾子多知，能愈子之疾，盍往治之？”其人曰：“善。”于是乘马挟弓矢而行。未一舍②，内逼③，下马而便焉。矢植于"},{"id":"a228","t":"5．斗牛而废耕","s":"卫懿公①好禽兽，见抵牛②而说之，禄其牧人如中士③。宁子谏曰：“岂可！牛之用于耕而不在抵。抵其牛，耕必废。耕，国之本也，其可废乎？臣闻之，君人者不以欲妨民。”弗听"}]},{"w":"及","m":"赶上。","u":[{"id":"a75","t":"2. 张五不复猎","s":"休宁县①有村民张五，以猎为生。张尝逐一母鹿。鹿将二仔行，不能速，遂为张五所及。母鹿度不可免，顾旁有浮土，乃引二仔下，拥土覆之，而身投于张五网中。值张母出户，遥望"},{"id":"a93","t":"4. 为者常成","s":"梁丘据①谓晏子曰：“吾至死不及夫子②矣。”晏子曰：“婴③闻之：为者常成，行者常至。婴非有异于人也④，常为而不置⑤，常行而不休⑥而已矣。”"},{"id":"a94","t":"5. 望梅止渴","s":"魏武①行役②失汲道③，三军④皆渴，乃令曰：“前有大梅林，饶子⑤，甘酸可以解渴。”士卒闻之，口皆出水，乘⑥此得及前源⑦。"},{"id":"a135","t":"2．疑鬼","s":"毛氏①者，越②人也。值雨夜行，左顾右盼，心悸焉。忽一人自后及，言未具伞，乞假之而同行。毛氏无奈，强应之。二人默然良久。毛氏疑为鬼，至桥上，遂挤堕河中，狂走而去。"},{"id":"a147","t":"2．木屑竹头","s":"尝造船，其木屑竹头①，侃②皆令籍③而掌之。人咸不解所以。后正会④，积雪始晴，厅事⑤前余雪犹湿，乃以木屑布地。及桓温⑥伐蜀，又以侃所贮竹头作钉装船。"},{"id":"a158","t":"1．张飞横矛当阳桥","s":"先主①背曹公②，依刘表。表卒，曹公犯荆州③，先主奔江南④。曹公追之，一日一夜，及于当阳之长阪⑤。先主闻曹公猝至，弃妻子走，使飞将二十骑拒后。飞据水断桥⑥，瞋目横"},{"id":"a163","t":"顾况戏白居易（阅读）","s":"乐天①初举，名未振，以歌诗投顾况②。况戏之曰：“长安③物贵，居大不易④。”及读至《原上草》，云：“野火烧不尽，春风吹又生。”曰：“有句如此，居亦何难？老夫前言戏"},{"id":"a181","t":"老妪斗辽敌（阅读）","s":"端拱①中，有妪独止店上②。会一虏③至，系马于门，持弓矢，坐定，呼妪汲水。妪持绠缶④趋井，悬而复止，因胡语呼虏为王，且告虏曰：“绠短，不能及⑤也，妪老力惫，王可自"},{"id":"a185","t":"4．笼中鹦鹉","s":"富商有段姓者，畜①一鹦鹉，甚慧，能迎客与诵诗。段剪其两翅，置于雕笼中。熙宁②六年，段忽系狱。及归，问鹦鹉曰：“吾半年在狱，身不由己，极其怨苦。女在家有人喂饲，何"},{"id":"a187","t":"子路见孔子（阅读）","s":"子路见孔子。子曰：“汝何好乐①？”对曰：“好长剑。”孔子曰：“吾非此之问也。徒②请以子之能③，而加之以学问，岂可及乎？”子路曰：“南山有竹，不揉④自直，斩而用之"},{"id":"a188","t":"1．孙权吕蒙读书","s":"孙权谓吕蒙曰：“卿今当途掌事①，不可不学！”蒙辞以军中多务。权曰：“孤岂欲卿治经②为博士③邪！但当涉猎，见往事耳。卿言多务，孰若孤？孤常读书，自以为大有所益。”"},{"id":"a214","t":"3．穿井得一人","s":"宋①之丁氏，家无井，而出溉汲，常一人居外。及其家穿②井，告人曰：“吾穿井得一人。”有闻而传之者：“丁氏穿井得一人。”国人道之，闻之于宋君。宋君令人问诸丁氏。丁氏"},{"id":"a215","t":"4．不识自家","s":"有愚者，常于户外县①履为志。一日出门，及午，忽暴雨，其妻收履。至薄暮，愚者归，不见履，曰：“吾家徙乎？”不进。妻见而怪之，曰：“是汝家，何不入？”愚者曰：“毋②"},{"id":"a223","t":"南岐人之瘿（阅读）","s":"南岐在秦蜀①山谷中，其水甘而不良，凡饮之者辄病瘿②，故其地之民无一人无瘿者。及见外方人③至，则群小④妇人聚观而笑之曰：“异哉，人之颈也！焦⑤而不吾类⑥！”外方人"}]},{"w":"于","m":"比。","u":[{"id":"a148","t":"3．墨子怒耕柱子","s":"墨子怒耕柱子①。耕柱子曰：“我无愈于人乎？”墨子②曰：“我将上太行③，以骥与牛驾，子将谁策？”耕柱子曰：“将策骥也。”墨子曰：“何故策骥也？”耕柱子曰：“骥足以"},{"id":"a189","t":"2．响遏行云","s":"薛谭学讴于秦青，未穷青之技，自谓尽之，遂辞归。秦青弗止，饯于郊衢，抚节①悲歌②，声振林木，响遏行云。薛谭乃谢求反，终身不敢言归。"},{"id":"a197","t":"4．杨务廉有巧思","s":"杨务廉①甚有巧思，尝于沁州②市内刻木作僧，手执一碗，自能行乞。碗中投钱③，关键忽发，自然作声云：“布施④。”市人竞观，欲其作声，施者日盈数千。"},{"id":"a203","t":"4．商鞅立木","s":"商鞅变法之令既具，未布，恐民之不信己，乃立三丈之木于国都市①之南门，募民有能徙置北门者，予十金②。民怪之，莫敢徙。复曰：“能徙者予五十金。”有一人徙之，辄予五十"},{"id":"a207","t":"2．蔡侯纸","s":"自古书契①，多编以竹简，其用缣②帛者谓之为纸。缣贵而简重，并不便于人。伦③乃造意④，用树肤、麻头及敝布、鱼网以为纸。元兴元年⑤，奏上之。帝善其能，自是莫不从用焉"},{"id":"a210","t":"5．认“真”","s":"艾子游于郊外，弟子①通、执二人从焉。渴甚，使执子乞浆于田舍。有老父②倚门观书，执子揖而请。老父指卷中“真”字问曰：“识此字，馈尔浆。”执子曰：“‘真’字也。”老"},{"id":"a215","t":"4．不识自家","s":"有愚者，常于户外县①履为志。一日出门，及午，忽暴雨，其妻收履。至薄暮，愚者归，不见履，曰：“吾家徙乎？”不进。妻见而怪之，曰：“是汝家，何不入？”愚者曰：“毋②"},{"id":"a221","t":"4．引婴儿投江","s":"有过于江上者，见人方引①婴儿而欲投之江中，婴儿啼。人问其故。曰：“此其父善游。”其父虽善游，其子岂遽②善游哉？以此任物③，亦必悖④矣。"},{"id":"a226","t":"3．北人不识菱者","s":"北人生而不识菱①者，仕于南方，席上啖菱，并壳入口。或曰：“啖菱须去壳。”其人自护所短，曰：“我非不知，并壳者，欲以清热也。”问者曰：“北土亦有此物否？”答曰：“"}]},{"w":"而","m":"如果。","u":[{"id":"a193","t":"任末好学勤记（阅读）","s":"任末①年十四，学无常师②，负笈③不远④险阻。每言人而⑤不学，则何以成。或依林木之下，编茅为庵⑥，削荆为笔，刻树汁为墨；夜则映星望月⑦，暗则缚⑧麻蒿以自照。观书有"},{"id":"a208","t":"3．牧竖拾金","s":"有牧竖①，敝衣蓬首赤足，日驱牛羊牧冈间，讴而乐，意惬甚，牧亦善。一日，拾遗金一饼②，内衣领中。自是歌声渐歇，牛羊亦时逸。心患失金，斯乃为金所累也。"},{"id":"a219","t":"2．宾卑聚自杀","s":"齐庄公①时，有士②曰宾卑聚。梦有壮士，新素履，墨剑囊，从而斥之，唾其面。宾卑聚惕然而寤，徒梦也，终夜坐不自快。明日，召其友告之曰：“吾少好勇，年且六十而无所挫辱"}]},{"w":"则","m":"就。","u":[{"id":"a202","t":"3．木刻钟馗","s":"宋庆历①中，有一术士②，姓李，多巧思。尝木刻一舞钟馗③，高三尺许，右手持铁简。以香饵置钟馗左手中，鼠缘手取食，则左手扼鼠，右手以简毙之。"},{"id":"a212","t":"1．地震","s":"康熙①七年六月十七日戌刻②，地大震。余适客稷下③，方与表兄李笃之对烛饮。忽闻有声如雷，自东南来，向西北去。众骇异，不解其故。俄而几案④摆簸，酒杯倾覆；屋梁椽柱，"},{"id":"a219","t":"2．宾卑聚自杀","s":"齐庄公①时，有士②曰宾卑聚。梦有壮士，新素履，墨剑囊，从而斥之，唾其面。宾卑聚惕然而寤，徒梦也，终夜坐不自快。明日，召其友告之曰：“吾少好勇，年且六十而无所挫辱"},{"id":"a222","t":"5．楚人不识姜","s":"楚①人有生而不识姜者，曰：“此从树上结成。”或曰：“从土里生成。”其人固执己见，曰：“请与子以十人为质②，以所乘驴为赌③。”已而遍问十人，皆曰：“土里出也。”其"},{"id":"a227","t":"4．病忘者","s":"齐①有病忘者，行则忘止，卧则忘起。其妻患之，谓曰：“闻艾子多知，能愈子之疾，盍往治之？”其人曰：“善。”于是乘马挟弓矢而行。未一舍②，内逼③，下马而便焉。矢植于"}]},{"w":"乎","m":"吗。","u":[{"id":"a215","t":"4．不识自家","s":"有愚者，常于户外县①履为志。一日出门，及午，忽暴雨，其妻收履。至薄暮，愚者归，不见履，曰：“吾家徙乎？”不进。妻见而怪之，曰：“是汝家，何不入？”愚者曰：“毋②"},{"id":"a219","t":"2．宾卑聚自杀","s":"齐庄公①时，有士②曰宾卑聚。梦有壮士，新素履，墨剑囊，从而斥之，唾其面。宾卑聚惕然而寤，徒梦也，终夜坐不自快。明日，召其友告之曰：“吾少好勇，年且六十而无所挫辱"},{"id":"a225","t":"2．鼠技虎名","s":"楚①人谓虎为“老虫”，姑苏②人谓鼠为“老虫”。余官长洲③，以事至娄东④，灭烛就寝，忽闻碗碟有声。余问故，阍童⑤答曰：“老虫。”余，楚人也，不胜惊错，曰：“城中安"}]},{"w":"矣","m":"了。","u":[{"id":"a218","t":"1．莽汉断棘","s":"终南之山①有棘满径，骨柔而刺密。触之者恒胶结②不可解，不受伤不已。人畏其刺，咸迂其途避之。一人义形于色，褰③裳而入，欲节节④而断之。孰知左断于指，而右曳于臂，下"},{"id":"a221","t":"4．引婴儿投江","s":"有过于江上者，见人方引①婴儿而欲投之江中，婴儿啼。人问其故。曰：“此其父善游。”其父虽善游，其子岂遽②善游哉？以此任物③，亦必悖④矣。"}]},{"w":"哉","m":"呢。","u":[{"id":"a221","t":"4．引婴儿投江","s":"有过于江上者，见人方引①婴儿而欲投之江中，婴儿啼。人问其故。曰：“此其父善游。”其父虽善游，其子岂遽②善游哉？以此任物③，亦必悖④矣。"}]}],"units":[{"name":"第 一 单 元","items":[{"id":"a1","t":"· 黄琬聪慧（阅读）"},{"id":"a2","t":"· 1．杨修啖酪"},{"id":"a3","t":"· 2．王戎识李"},{"id":"a4","t":"· 3．诸葛恪添驴"},{"id":"a5","t":"· 4．谢道韫咏絮"},{"id":"a6","t":"· 5．曹冲称象"}]},{"name":"第 二 单 元","items":[{"id":"a7","t":"· 陆绩怀橘（阅读）"},{"id":"a8","t":"· 1．黄香温席"},{"id":"a9","t":"· 2．陈遗贮焦饭"},{"id":"a10","t":"· 3．哑孝子"},{"id":"a11","t":"· 4．郑人买履"},{"id":"a12","t":"· 5．鲁人锯竿入城"}]},{"name":"第 三 单 元","items":[{"id":"a13","t":"· 文徵明习字（阅读）"},{"id":"a14","t":"· 1．智永退笔冢"},{"id":"a15","t":"· 2．一箧磨穴砚"},{"id":"a16","t":"· 3．王羲之书六角扇"},{"id":"a17","t":"· 4．掩耳盗钟"},{"id":"a18","t":"· 5．红毛毡"}]},{"name":"第 四 单 元","items":[{"id":"a19","t":"· \"辨钟\"辨盗（阅读）"},{"id":"a20","t":"· 1．盲子窃钱案"},{"id":"a21","t":"· 2．张佐治遇蛙"},{"id":"a22","t":"· 3．焚猪见真情"},{"id":"a23","t":"· 4．蜜中鼠屎案"},{"id":"a24","t":"· 5．谜语一则"}]},{"name":"第 五 单 元","items":[{"id":"a25","t":"· 鹦鹉灭火（阅读）"},{"id":"a26","t":"· 1．鳝救婢"},{"id":"a27","t":"· 2．二鹊救友"},{"id":"a28","t":"· 3．知恩图报"},{"id":"a29","t":"· 4．蝙蝠"},{"id":"a3
