const KEY = "jxj_all53_v1";
let S = {sel:{}, judged:{}, self:{}, open:{}};
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let filter = 'all';
let fb = 'all';
let tf = 'all';

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 1800);
}

function stateOf(it){
  if(S.judged[it.id]) return S.judged[it.id] === 'ok' ? 'ok' : 'bad';
  if(S.self[it.id] !== undefined) return S.self[it.id] ? 'ok' : 'bad';
  if(S.sel[it.id]) return 'done';
  return '';
}
const isDone = it => !!(S.judged[it.id] || S.self[it.id] !== undefined);

const BATCHES = ["一 字音字形", "二 词语运用与辨析", "三 语法辨析", "四 文学文化常识", "五 名著阅读", "六 古诗文默写", "七 诗词鉴赏", "八 文言文阅读"];
function renderCard(){
  const el=$('#batchprog'); if(!el) return;
  el.innerHTML = BATCHES.map(b=>{
    const arr=DATA.filter(it=>it.batch===b);
    const done=arr.filter(isDone).length;
    const pct=Math.round(done/arr.length*100);
    return `<div data-batch="${b}" style="margin:12px 0;cursor:pointer">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;color:#4b5563;margin-bottom:4px"><span>${b}</span><span>${done}/${arr.length}</span></div>
      <div style="height:5px;background:#ece9e3;border-radius:99px;overflow:hidden"><i style="display:block;height:100%;width:${pct}%;background:linear-gradient(90deg,#b3261e,#d4573f)"></i></div>
    </div>`;
  }).join('');
}

function renderStats(){
  const done = DATA.filter(isDone).length;
  const ok = DATA.filter(it => stateOf(it) === 'ok').length;
  const bad = DATA.filter(it => stateOf(it) === 'bad').length;
  $('#s-done').textContent = done;
  $('#s-ok').textContent = ok;
  $('#s-bad').textContent = bad;
  $('#s-rate').textContent = done ? Math.round(ok / done * 100) + '%' : '—';
  $('#progress').style.width = (done / DATA.length * 100) + '%';
  $('#c-all').textContent = DATA.length;
  $('#c-todo').textContent = DATA.length - done;
  $('#c-wrong').textContent = bad;
  $('#c-flag').textContent = DATA.filter(flagged).length;
}

function flagged(it){ return (it.issues && it.issues.length) || it.confidence < 0.9 || (it.proofread_note && it.proofread_note.indexOf('待核对') > -1); }

function optHTML(it, o){
  const chosen = S.sel[it.id] === o.key;
  const judged = S.judged[it.id];
  let cls = 'opt';
  if(chosen) cls += ' sel';
  if(judged){
    if(it.choice && o.key === it.choice) cls += ' right';
    else if(chosen) cls += ' wrong';
  }
  return `<li class="${cls}" data-opt="${o.key}"><span class="k">${o.key}</span><span class="txt">${o.text}</span></li>`;
}

function cardHTML(it){
  const judged = S.judged[it.id];
  const selfv = S.self[it.id];
  const openExp = S.open[it.id];
  const st = stateOf(it);
  let verdict = '';
  if(judged) verdict = `<span class="verdict ${judged==='ok'?'ok':'bad'}">${judged==='ok'?'✓ 回答正确':'✕ 回答错误'}</span>`;
  else if(selfv !== undefined) verdict = `<span class="verdict ${selfv?'ok':'bad'}">${selfv?'✓ 已标记答对':'✕ 已标记答错'}</span>`;

  let opts = '';
  if(it.options && it.options.length){
    opts = `<ul class="opts">${it.options.map(o=>optHTML(it,o)).join('')}</ul>`;
  }
  let subs = '';
  if(it.sub_questions && it.sub_questions.length){
    subs = it.sub_questions.map(sq=>{
      const so = (sq.options && sq.options.length)
        ? `<ul class="opts sub-opts">${sq.options.map(o=>`<li class="opt"><span class="k">${o.key}</span><span class="txt">${o.text}</span></li>`).join('')}</ul>`
        : '';
      return `<div class="sub">（${sq.no}）${sq.stem}</div>${so}`;
    }).join('');
  }

  const actions = it.choice
    ? `<button class="btn primary" data-act="submit">提交本题</button>
       <button class="btn" data-act="toggle">${openExp?'收起解析':'查看解析'}</button>${verdict}`
    : `<button class="btn primary" data-act="reveal">${openExp?'收起答案':'显示答案'}</button>
       <span class="selfjudge"><button class="btn ghost" data-act="self-ok">我答对了</button><button class="btn ghost" data-act="self-bad">我答错了</button></span>${verdict}`;

  const iss = (it.issues && it.issues.length) ? `<div class="note">⚠ ${esc(it.issues.join('；'))}</div>` : '';

  return `<section class="q ${judged?'locked':''}" id="q-${it.id}" data-id="${it.id}">
    <div class="q-head">
      <span class="q-no">${it.id}</span>
      <span class="q-type" style="color:#2c5f8a;border-color:#bcd">${esc(it.batch)}</span>
      <span class="q-type">${esc(it.type)}</span>
      ${flagged(it)?'<span class="q-type" style="color:#8a5a00;border-color:#e6c169;background:#fff8e6">待核对</span>':''}
      <span class="q-page">第 ${it.print_page} 页 · PDF ${it.source_page}</span>
    </div>
    <div class="stem">${it.stem}</div>
    ${it.image ? `<figure class="qfig"><img src="${it.image}" alt="题目配图">${it.image_caption?`<figcaption>${esc(it.image_caption)}</figcaption>`:""}</figure>` : ''}
    ${opts}${subs}
    <div class="actions">${actions}</div>
    <div class="exp ${openExp?'open':''}" id="e-${it.id}">
      <h4>解析</h4>
      <p class="ans">正确答案：<b>${esc(it.answer)}</b></p>
      <div class="row"><span class="lab">考点</span><span class="val">${esc(it.exam_point)}</span></div>
      <div class="row"><span class="lab">解析</span><span class="val">${esc(it.explanation)}</span></div>
      ${it.wrong_option_analysis ? `<div class="row"><span class="lab">错项分析</span><span class="val">${esc(it.wrong_option_analysis)}</span></div>` : ''}
      <div class="row"><span class="lab">易错提醒</span><span class="val">${esc(it.easy_mistake)}</span></div>
      <div class="row"><span class="lab">来源</span><span class="val">第 ${it.print_page} 页（PDF 第 ${it.source_page} 页）· ${esc(it.answer_source)}</span></div>
      ${it.proofread_note ? `<div class="note">校对备注：${esc(it.proofread_note)}</div>` : ''}${iss}
    </div>
  </section>`;
}

function render(){
  let list = DATA.filter(it=>{
    if(fb!=='all' && it.batch!==fb) return false;
    if(filter==='todo') return !isDone(it);
    if(filter==='wrong') return stateOf(it)==='bad';
    if(filter==='flag') return flagged(it);
    return true;
  });
  if(tf!=='all') list = list.filter(it=>it.type===tf);
  $('#list').innerHTML = list.length ? list.map(cardHTML).join('') : '<div class="empty">这里还没有题目，换个筛选看看。</div>';
  renderCard(); renderStats();
}

function submitOne(it, el){
  if(!it.choice) return;
  const sel = S.sel[it.id];
  if(!sel){ toast('先选一个选项'); return; }
  S.judged[it.id] = sel === it.choice ? 'ok' : 'bad';
  S.open[it.id] = true;
  save(); render();
}

document.addEventListener('click', e=>{
  const q = e.target.closest('.q');
  const opt = e.target.closest('.opt');
  if(opt && q && !q.classList.contains('locked')){
    const it = DATA.find(d=>d.id===q.dataset.id);
    if(it && it.choice && !S.judged[it.id]){
      S.sel[it.id] = opt.dataset.opt; save(); render();
    }
    return;
  }
  const act = e.target.closest('[data-act]');
  if(act && q){
    const it = DATA.find(d=>d.id===q.dataset.id);
    const a = act.dataset.act;
    if(a==='submit') submitOne(it, q);
    else if(a==='toggle' || a==='reveal'){ S.open[it.id] = !S.open[it.id]; save(); render(); }
    else if(a==='self-ok'){ S.self[it.id]=true; S.open[it.id]=true; save(); render(); }
    else if(a==='self-bad'){ S.self[it.id]=false; S.open[it.id]=true; save(); render(); }
    return;
  }
  const goto = e.target.closest('[data-goto]');
  if(goto){
    const id = goto.dataset.goto;
    if(filter!=='all' || fb!=='all'){ filter='all'; fb='all'; document.querySelectorAll('[data-filter]').forEach(c=>c.classList.toggle('on', c.dataset.filter==='all')); document.querySelectorAll('[data-batch]').forEach(c=>c.classList.toggle('on', c.dataset.batch==='all')); render(); }
    const t = document.getElementById('q-'+id);
    if(t){ t.scrollIntoView({behavior:'smooth', block:'start'}); t.style.transition='box-shadow .4s'; t.style.boxShadow='0 0 0 3px #ddd8cf'; setTimeout(()=>t.style.boxShadow='',900); }
    return;
  }
});

document.querySelectorAll('[data-filter]').forEach(c=>c.addEventListener('click', ()=>{
  filter = c.dataset.filter;
  document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on', x===c));
  render();
}));
document.querySelectorAll('[data-batch]').forEach(c=>c.addEventListener('click', ()=>{
  fb = c.dataset.batch;
  document.querySelectorAll('[data-batch]').forEach(x=>x.classList.toggle('on', x===c));
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}));

$('#btn-submit-all').addEventListener('click', ()=>{
  let n=0, blank=0;
  DATA.forEach(it=>{
    if(!it.choice || S.judged[it.id]) return;
    if(!S.sel[it.id]){ blank++; return; }
    S.judged[it.id] = S.sel[it.id]===it.choice ? 'ok':'bad'; n++;
  });
  save(); render();
  toast(n ? `已判 ${n} 题${blank?`，${blank} 题未作答`:''}` : '没有可提交的新作答');
});

// ---------- 学习统计 ----------
document.getElementById('btn-stat')?.addEventListener('click', ()=>{
  const byType = {};
  let okAll=0, badAll=0, ansAll=0;
  DATA.forEach(it=>{
    const t = it.type || '未分类';
    const o = byType[t] || (byType[t]={n:0,ans:0,ok:0,bad:0});
    o.n++;
    const st = stateOf(it);
    if(st==='ok'){o.ok++;okAll++;}
    else if(st==='bad'){o.bad++;badAll++;}
    if(st) {o.ans++;ansAll++;}
  });
  const rows = Object.keys(byType).map(t=>{
    const o = byType[t];
    const judged = o.ok + o.bad;
    return {t, n:o.n, ans:o.ans, ok:o.ok, bad:o.bad,
            rate: judged ? Math.round(o.ok/judged*100) : null};
  }).sort((a,b)=> (a.rate===null?101:a.rate) - (b.rate===null?101:b.rate));

  const judgedAll = okAll + badAll;
  const rateAll = judgedAll ? Math.round(okAll/judgedAll*100) : null;
  const trs = rows.map(r=>{
    const w = r.rate===null ? '' : (r.rate<60 ? ' warn':'');
    const bar = r.rate===null ? '<span style="color:#bbb">—</span>'
      : `<div class="bar2"><i style="width:${r.rate}%"></i></div>`;
    return `<tr>
      <td><a class="lnk" data-stat-filter="${r.t}" title="筛选此题型">${r.t}</a></td>
      <td class="num">${r.n}</td>
      <td class="num">${r.ans}</td>
      <td class="num">${r.ok}</td>
      <td class="num">${r.bad}</td>
      <td class="num${w}">${r.rate===null?'—':r.rate+'%'}${bar}</td>
      <td class="num"><button class="btn ghost" data-stat-paper="${r.t}" title="只练这个题型">专练</button></td>
    </tr>`;
  }).join('');

  const weak = rows.filter(r=>r.rate!==null && r.rate<60);
  const tip = weak.length
    ? `薄弱题型：<b class="warn">${weak.map(r=>r.t).join('、')}</b>（正确率低于 60%），建议先用题型下拉筛选后集中练习，或点「生成试卷」专练这些题型。`
    : (judgedAll ? '各题型正确率均在 60% 以上，可尝试提高抽取题数或挑战综合运用、名著常识等长题。'
                 : '还没有判分记录。做完选择题后点「提交全部」，统计才会有数据。');

  document.getElementById('statBody').innerHTML = `
    <div class="stat-sum">
      <span>题目总数 <b>${DATA.length}</b></span>
      <span>已作答 <b>${ansAll}</b></span>
      <span>已判分 <b>${judgedAll}</b></span>
      <span>正确 <b>${okAll}</b></span>
      <span>错误 <b>${badAll}</b></span>
      <span>总正确率 <b>${rateAll===null?'—':rateAll+'%'}</b></span>
    </div>
    <table class="stab">
      <thead><tr><th>题型</th><th class="num">题数</th><th class="num">已答</th>
        <th class="num">正确</th><th class="num">错误</th><th class="num">正确率</th><th class="num">操作</th></tr></thead>
      <tbody>${trs || '<tr><td colspan="6">暂无数据</td></tr>'}</tbody>
    </table>
    <div class="stat-tip">${tip}</div>`;
  const m = document.getElementById('statModal');
  m.hidden = false;
});
document.getElementById('statClose')?.addEventListener('click', ()=>{
  document.getElementById('statModal').hidden = true;
});
document.getElementById('statModal')?.addEventListener('click', e=>{
  if(e.target.id==='statModal') e.target.hidden = true;
});

document.getElementById('statBody')?.addEventListener('click', e=>{
  const f = e.target.closest('[data-stat-filter]');
  const p = e.target.closest('[data-stat-paper]');
  if(!f && !p) return;
  const t = (f||p).dataset.statFilter || (f||p).dataset.statPaper;
  const sel = document.getElementById('typeSel');
  if(sel) sel.value = t;
  tf = t; filter = 'all';
  document.querySelectorAll('[data-filter]').forEach(c=>c.classList.toggle('on', c.dataset.filter==='all'));
  document.getElementById('statModal').hidden = true;
  render();
  if(p){
    setTimeout(()=>document.getElementById('btn-paper').click(), 60);
  }else{
    toast('已筛选题型：' + t);
  }
});

// ---------- 生成试卷（按当前筛选抽题） ----------
function currentList(){
  let list = DATA.filter(it=>{
    if(typeof fb !== 'undefined' && fb !== 'all' && it.batch !== fb) return false;
    if(filter==='todo') return !isDone(it);
    if(filter==='wrong') return stateOf(it)==='bad';
    if(filter==='flag') return flagged(it);
    return true;
  });
  if(tf!=='all') list = list.filter(it=>it.type===tf);
  return list;
}

document.getElementById('btn-paper')?.addEventListener('click', ()=>{
  const pool = currentList();
  if(!pool.length){ toast('当前筛选没有题目'); return; }
  const def = Math.min(20, pool.length);
  const ans = prompt(`按当前筛选共 ${pool.length} 题。\n请输入要抽取的题数（1-${pool.length}）：`, String(def));
  if(ans===null) return;
  let n = parseInt(ans, 10);
  if(!n || n<1){ toast('请输入有效数字'); return; }
  n = Math.min(n, pool.length);

  const picked = pool.slice();
  for(let i=picked.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [picked[i],picked[j]]=[picked[j],picked[i]]; }
  const list = picked.slice(0, n);

  const e2 = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const qs = list.map((it,idx)=>{
    const opts = (it.options||[]).map(o=>`<div class="o">${o.key}. ${e2(o.plain||o.text)}</div>`).join('');
    const blank = it.choice ? '' : '<div class="lines"><i></i><i></i><i></i></div>';
    return `<section class="q">
      <div class="qh"><b>${idx+1}.</b><span class="meta">${e2(it.batch||'')} · ${e2(it.type)}</span></div>
      <div class="stem">${it.stem}</div>
      ${it.image?`<div class="fig"><img src="${it.image}" alt=""></div>`:''}
      ${opts}${blank}
    </section>`;
  }).join('');

  const keys = list.map((it,idx)=>{
    const opts = (it.options||[]).map(o=>`<div class="${it.choice===o.key?'right':''}">${o.key}. ${e2(o.plain||o.text)}</div>`).join('');
    return `<section class="k">
      <div class="kh"><b>${idx+1}.</b> <span class="ans">答案：${e2(it.answer)}</span></div>
      ${opts}
      <div class="exp">${e2(it.explanation)}</div>
    </section>`;
  }).join('');

  const title = `觉醒卷A · 全 8 专题 327 题总练习`;
  const doc = `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>觉醒卷A · 全 8 专题 327 题总练习</title>
<style>
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;max-width:820px;margin:22px auto;padding:0 18px;color:#222;line-height:1.8;font-size:15px}
h1{font-size:19px;margin:0 0 6px} .sub{color:#777;font-size:13px;margin:0 0 14px}
.info{border:1px solid #ccc;border-radius:6px;padding:10px 14px;font-size:13.5px;color:#555;margin-bottom:18px}
.q{margin:0 0 18px;padding-bottom:12px;border-bottom:1px dashed #ddd;break-inside:avoid;page-break-inside:avoid}
.qh{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.qh b{color:#8a1f1f} .meta{color:#999;font-size:12px}
.stem{white-space:pre-wrap} .o{margin:2px 0 2px 20px}
.fig img{max-width:62%;margin:8px 0;border:1px solid #eee;border-radius:6px}
.lines i{display:block;border-bottom:1px solid #bbb;height:26px;margin:10px 0}
h2{font-size:16px;margin:28px 0 10px;padding-top:14px;border-top:2px solid #333}
.k{margin:0 0 10px;font-size:14px;break-inside:avoid}
.kh b{color:#8a1f1f} .ans{color:#8a1f1f;font-weight:600}
.k .o{margin:2px 0 2px 20px} .k .right{color:#1a7f37;font-weight:600}
.exp{color:#555;font-size:13px;margin-top:2px}
@media print{@page{margin:14mm 12mm} body{margin:0;max-width:none;font-size:11pt} h2{page-break-before:always}}
</style></head><body>
<h1>${title}</h1>
<p class="sub">生成时间：${new Date().toLocaleString('zh-CN')}　·　共 ${n} 题　·　来源：《2027 年中考语文基础百题大过关》</p>
<div class="info">姓名：____________　　班级：____________　　得分：__________</div>
${qs}
<h2>参考答案与解析</h2>
${keys}
</body></html>`;

  const blob = new Blob([doc], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `自组卷_${n}题_${new Date().toISOString().slice(0,10)}.html`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast(`已生成试卷：${n} 题`);
});

// ---------- 打印 ----------
document.getElementById('btn-print')?.addEventListener('click', ()=>{
  const on = !!(document.getElementById('printAns')||{}).checked;
  document.body.classList.toggle('print-exp', on);
  window.print();
});
window.addEventListener('afterprint', ()=>document.body.classList.remove('print-exp'));

// ---------- 题型筛选 ----------
(function(){
  const sel = document.getElementById('typeSel');
  if(!sel) return;
  const types = Array.from(new Set(DATA.map(it=>it.type).filter(Boolean)));
  types.forEach(t=>{
    const o = document.createElement('option');
    o.value = t; o.textContent = t; sel.appendChild(o);
  });
  sel.addEventListener('change', ()=>{ tf = sel.value; render(); });
})();

// ---------- 导出错题 ----------
document.getElementById('btn-export')?.addEventListener('click', ()=>{
  const wrong = DATA.filter(it=>stateOf(it)==='bad');
  if(!wrong.length){ toast('还没有错题，先做几题吧'); return; }
  const e2 = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const items = wrong.map(it=>{
    const opts = (it.options||[]).map(o=>
      `<div class="${it.choice===o.key?'right':''}">${o.key}. ${e2(o.text)}</div>`).join('');
    return `<section class="item">
      <h3>${it.id}　${e2(it.batch||'')}　${e2(it.type)}　（第 ${it.print_page} 页）</h3>
      <div class="stem">${it.stem}</div>
      ${it.image?`<div class="fig"><img src="${it.image}" alt=""></div>`:''}
      ${opts}
      <p class="ans">答案：<b>${e2(it.answer)}</b></p>
      <p class="exp">解析：${e2(it.explanation)}</p>
      <p class="mine">我的作答：${e2(S.sel[it.id]||'（未作答）')}</p>
    </section>`;
  }).join('');
  const doc = `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>觉醒卷A · 全 8 专题 327 题总练习</title>
<style>
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;max-width:820px;margin:24px auto;padding:0 18px;color:#222;line-height:1.85}
h1{font-size:20px;margin:0 0 4px} .meta{color:#888;font-size:13px;margin:0 0 18px}
.item{border-bottom:1px dashed #ccc;padding:16px 0} h3{font-size:15px;color:#8a1f1f;margin:0 0 8px;font-weight:600}
.stem{white-space:pre-wrap} .fig img{max-width:100%;margin:8px 0;border:1px solid #eee;border-radius:6px}
.right{color:#1a7f37;font-weight:600} .ans{color:#8a1f1f;margin:8px 0 4px}
.exp{color:#444;font-size:14px;margin:0} .mine{color:#777;font-size:13px;margin:4px 0 0}


</style></head><body>
<h1>错题本 · 共 ${wrong.length} 题</h1>
<p class="meta">导出于 ${new Date().toLocaleString('zh-CN')}</p>
${items}
</body></html>`;
  const blob = new Blob([doc], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `错题本_${new Date().toISOString().slice(0,10)}.html`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast(`已导出 ${wrong.length} 道错题`);
});

$('#btn-reset').addEventListener('click', ()=>{
  if(!confirm('确定清空全部作答记录？此操作不可撤销。')) return;
  S = {sel:{}, judged:{}, self:{}, open:{}}; save(); render(); toast('已重置');
});

render();
</script>
</body>
</html>
