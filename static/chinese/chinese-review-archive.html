<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>觉醒卷A · 全 8 专题 327 题总练习</title>
<style>
:root{
  --ink:#1f2328; --ink-2:#4b5563; --muted:#8b9199; --line:#e6e3dd;
  --paper:#faf8f4; --card:#ffffff; --accent:#b3261e; --accent-soft:#fdf1ef;
  --ok:#1f7a4d; --ok-soft:#eef7f1; --bad:#b3261e; --bad-soft:#fdf1ef;
  --warn:#8a5a00; --warn-soft:#fff8e6; --blue:#2c5f8a;
  --radius:12px; --shadow:0 1px 2px rgba(31,35,40,.04),0 8px 24px rgba(31,35,40,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font:16px/1.85 "Songti SC","Source Han Serif SC","Noto Serif CJK SC","STSong",serif;
  padding-bottom:80px;
}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- 顶栏 ---------- */
.top{position:sticky;top:0;z-index:50;background:rgba(250,248,244,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px 10px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-size:17px;font-weight:700;letter-spacing:.02em;margin:0}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:.06em;margin-top:2px}
.spacer{flex:1}
.stat{display:flex;gap:18px;font-size:13px;color:var(--ink-2);font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
.stat b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{width:100%;height:4px;background:#ece9e3;border-radius:99px;overflow:hidden;margin-top:2px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b3261e,#d4573f);transition:width .35s ease}

/* ---------- 工具条 ---------- */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:22px 0 16px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:99px;
  padding:6px 14px;font-size:13.5px;transition:.15s;font-family:ui-sans-serif,system-ui,"PingFang SC",sans-serif}
.chip:hover{border-color:#cfcac2}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{opacity:.55;margin-left:5px;font-variant-numeric:tabular-nums}
.sel{padding:7px 11px;border:1px solid #ddd8cf;border-radius:99px;background:#fff;font-size:13px;color:#4b5563;cursor:pointer;outline:none}
.sel:focus{border-color:#b3261e}
.prt{display:flex;align-items:center;gap:6px;font-size:13px;color:#4b5563;cursor:pointer;user-select:none}
.prt input{width:14px;height:14px;accent-color:#b3261e;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(20,18,15,.45);display:flex;align-items:flex-start;
  justify-content:center;padding:44px 16px;z-index:200;overflow:auto}
.modal[hidden]{display:none}
.modal-in{background:#fff;border-radius:14px;max-width:780px;width:100%;padding:20px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.modal-hd h3{margin:0;font-size:17px}
.stat-sum{display:flex;gap:20px;flex-wrap:wrap;margin:4px 0 16px;font-size:13.5px;color:#444}
.stat-sum b{color:#8a1f1f;font-variant-numeric:tabular-nums}
.stab{width:100%;border-collapse:collapse;font-size:13.5px}
.stab th,.stab td{border-bottom:1px solid #eee;padding:7px 9px;text-align:left}
.stab th{color:#666;font-weight:600;background:#faf9f6}
.stab td.num{text-align:right;font-variant-numeric:tabular-nums}
.bar2{height:5px;background:#eee;border-radius:99px;overflow:hidden;margin-top:5px}
.bar2 i{display:block;height:100%;background:#b3261e}
.warn{color:#8a1f1f;font-weight:600}
.stat-tip{color:#888;font-size:12.5px;margin-top:12px;line-height:1.7}
.lnk{color:#2c5f8a;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:#b3261e}
.btn.ghost{padding:3px 10px;font-size:12px}

.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 16px;font-size:14px;
  color:var(--ink);transition:.15s;font-family:ui-sans-serif,system-ui,"PingFang SC",sans-serif}
.btn:hover{border-color:#cfcac2;background:#fcfbf9}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#33383f}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- 布局 ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 248px;gap:28px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}}

/* ---------- 题卡 ---------- */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 26px 18px;margin:0 0 16px;box-shadow:var(--shadow);scroll-margin-top:96px}
@media(max-width:600px){.q{padding:18px 16px 14px}}
.q-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.q-no{font:700 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);
  background:var(--accent-soft);padding:5px 8px;border-radius:6px;letter-spacing:.04em}
.q-type{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.q-page{font-size:12px;color:var(--muted);margin-left:auto;font-family:ui-sans-serif,system-ui,sans-serif}
.stem{font-size:16.5px;line-height:2.05;margin:0 0 12px;white-space:pre-wrap}
.qfig{margin:10px 0 14px;padding:10px;border:1px solid #e6e2da;border-radius:10px;background:#fcfbf8;text-align:center}
.qfig img{max-width:100%;height:auto;border-radius:6px;display:block;margin:0 auto}
.qfig figcaption{font-size:12.5px;color:#8a8577;margin-top:8px}
.stem p{margin:0 0 8px}
.opts{list-style:none;margin:0;padding:0}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid transparent;border-radius:9px;
  padding:7px 10px;margin:2px 0;line-height:1.95;transition:.12s;cursor:pointer}
.opt:hover{background:#fbfaf8}
.opt .k{flex:0 0 22px;font-weight:700;color:var(--ink-2);font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px;
  border:1px solid var(--line);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  margin-top:5px;transition:.12s}
.opt.sel{background:#f6f4ef;border-color:#ddd8cf}
.opt.sel .k{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.right{background:var(--ok-soft);border-color:#bfe0cd}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-soft);border-color:#efc9c4}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt .txt{flex:1;white-space:pre-wrap}
.locked .opt{cursor:default}
.locked .opt:hover{background:transparent}
.locked .opt.sel:hover{background:#f6f4ef}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.verdict{font-size:14px;font-weight:700;font-family:ui-sans-serif,system-ui,"PingFang SC",sans-serif}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}

/* ---------- 解析 ---------- */
.exp{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;display:none}
.exp.open{display:block}
.exp h4{margin:0 0 8px;font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:600;
  font-family:ui-sans-serif,system-ui,"PingFang SC",sans-serif}
.exp .ans{font-size:15px;margin:0 0 10px}
.exp .ans b{color:var(--accent);font-size:17px}
.row{display:flex;gap:10px;margin:7px 0;font-size:15px;line-height:1.9}
.row .lab{flex:0 0 72px;color:var(--muted);font-size:13px;padding-top:2px;
  font-family:ui-sans-serif,system-ui,"PingFang SC",sans-serif}
.row .val{flex:1}
.note{font-size:13.5px;color:var(--warn);background:var(--warn-soft);border-left:3px solid #e6c169;
  padding:7px 11px;border-radius:0 7px 7px 0;margin-top:10px;line-height:1.75}
.selfjudge{display:flex;gap:8px;margin-top:10px}

/* ---------- 标注 ---------- */
.dot{text-emphasis:dot;-webkit-text-emphasis:dot;text-emphasis-position:under;
  -webkit-text-emphasis-position:under;text-emphasis-color:#b3261e;-webkit-text-emphasis-color:#b3261e}
.underline{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--blue)}
.wavy{text-decoration:underline wavy;text-underline-offset:3px;text-decoration-color:var(--blue)}
.sub{margin:14px 0 4px;font-size:15.5px;white-space:pre-wrap}
.sub-opts{margin-left:4px}

/* ---------- 答题卡 ---------- */
.side{position:sticky;top:86px}
.card-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow)}
.card-box h3{margin:0 0 12px;font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:600;
  font-family:ui-sans-serif,system-ui,"PingFang SC",sans-serif}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px;
  color:var(--ink-2);display:flex;align-items:center;justify-content:center;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;transition:.12s}
.cell:hover{border-color:#cfcac2}
.cell.ok{background:var(--ok-soft);border-color:#bfe0cd;color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:#efc9c4;color:var(--bad)}
.cell.done{background:#f2f0ec;border-color:#ddd8cf;color:var(--ink-2)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted);
  font-family:ui-sans-serif,system-ui,"PingFang SC",sans-serif}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* ---------- 空态 ---------- */
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px}

/* ---------- 底部 ---------- */
.foot{max-width:1180px;margin:40px auto 0;padding:18px 20px 0;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--muted);line-height:1.9;font-family:ui-sans-serif,system-ui,"PingFang SC",sans-serif}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;
  padding:10px 20px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;
  font-family:ui-sans-serif,system-ui,"PingFang SC",sans-serif}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 打印 ---------- */
@media print{
  @page{margin:15mm 13mm}
  header.top,.top,.tools,.side,.actions,.selfjudge,.toast,#toast,.bar,.foot{display:none!important}
  body{background:#fff;color:#000;font-size:11pt;line-height:1.7;padding:0}
  .wrap{max-width:none;margin:0;padding:0}
  .layout{display:block}
  #list{display:block}
  .q{break-inside:avoid!important;page-break-inside:avoid!important;box-shadow:none!important;
     border:0!important;border-bottom:1px solid #ddd!important;border-radius:0!important;
     margin:0 0 7mm!important;padding:0 0 5mm!important;background:#fff!important}
  .q-head .q-page{display:none}
  .stem{font-size:11pt;line-height:1.75;margin-bottom:6px}
  .qfig{break-inside:avoid!important;page-break-inside:avoid!important;border:0!important;
        background:#fff!important;padding:0!important;margin:4px 0 6px!important}
  .qfig img{max-width:50%;max-height:62mm}
  .qfig figcaption{color:#555;font-size:9.5pt}
  .opts{break-inside:avoid}
  .opt{background:#fff!important;border-color:#e2ded6!important}
  .exp,.exp.open{display:none!important}
  body.print-exp .exp,body.print-exp .exp.open{display:block!important;break-inside:avoid;
    page-break-inside:avoid;border-top:1px dashed #bbb;margin-top:4px;padding-top:4px}
  body.print-exp .exp h4{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <h1 class="brand">觉醒卷A · 全 8 专题 327 题<small>全部题型 · 单文件总库</small></h1>
    <div class="spacer"></div>
    <div class="stat">
      <span>已答 <b id="s-done">0</b></span>
      <span>正确 <b id="s-ok">0</b></span>
      <span>错误 <b id="s-bad">0</b></span>
      <span>正确率 <b id="s-rate">—</b></span>
    </div>
  </div>
  <div class="bar"><i id="progress"></i></div>
</header>

<main class="wrap">
  <div class="tools" id="batchbar">
    <button class="chip on" data-batch="all">全部 327</button>
<button class="chip" data-batch="一 字音字形">一 字音字形（53）</button>
<button class="chip" data-batch="二 词语运用与辨析">二 词语运用与辨析（53）</button>
<button class="chip" data-batch="三 语法辨析">三 语法辨析（51）</button>
<button class="chip" data-batch="四 文学文化常识">四 文学文化常识（45）</button>
<button class="chip" data-batch="五 名著阅读">五 名著阅读（45）</button>
<button class="chip" data-batch="六 古诗文默写">六 古诗文默写（40）</button>
<button class="chip" data-batch="七 诗词鉴赏">七 诗词鉴赏（24）</button>
<button class="chip" data-batch="八 文言文阅读">八 文言文阅读（16）</button>
  </div>
  <div class="tools">
    <button class="chip on" data-filter="all">全部<span class="n" id="c-all">327</span></button>
    <button class="chip" data-filter="todo">未做<span class="n" id="c-todo">327</span></button>
    <button class="chip" data-filter="wrong">错题<span class="n" id="c-wrong">0</span></button>
    <button class="chip" data-filter="flag">待核对<span class="n" id="c-flag">0</span></button>
    <select id="typeSel" class="sel" title="按题型筛选"><option value="all">全部题型</option></select>
    <div class="spacer"></div>
    <button class="btn primary" id="btn-submit-all">提交全部</button>
    <button class="btn" id="btn-reset">重置</button>
    <button class="btn" id="btn-export">导出错题</button>
    <label class="prt" title="打印时附上答案与解析"><input type="checkbox" id="printAns">含答案</label>
    <button class="btn" id="btn-print">打印</button>
    <button class="btn primary" id="btn-paper">生成试卷</button>
    <button class="btn" id="btn-stat">学习统计</button>
  </div>

  <div class="layout">
    <div id="list"></div>
    <aside class="side">
      <div class="card-box">
        <h3>章节进度</h3>
        <div id="batchprog"></div>
        <div class="legend" style="margin-top:14px">
          <span><i style="background:#eef7f1;border:1px solid #bfe0cd"></i>已答</span>
          <span><i style="background:#f2f0ec;border:1px solid #ddd8cf"></i>待答</span>
        </div>
      </div>
    </aside>
  </div>

  <div class="foot">
    数据来源：《2027年中考语文基础百题大过关》一至2部分（扫描件，逐页图像识别）· 答案：《…提取自2027年中考语文基础百题大过关答案.pdf》<br>
    标注说明：<span class="dot">加点</span>为原卷着重号，<span class="underline">横线</span>为原卷画线，<span class="wavy">波浪线</span>为原卷画线。<br>
    本页可离线打开，答题进度自动保存在本机浏览器。
  </div>
</main>

<div class="modal" id="statModal" hidden>
  <div class="modal-in">
    <div class="modal-hd"><h3>学习统计</h3><button class="btn" id="statClose">关闭</button></div>
    <div id="statBody"></div>
  </div>
</div>

老艺术”。"},{"key":"B","text":"句②是病句，应该把“日益”和“受到”调换位置。","plain":"句②是病句，应该把“日益”和“受到”调换位置。"},{"key":"C","text":"三个加点短语的结构类型各不相同。","plain":"三个加点短语的结构类型各不相同。"},{"key":"D","text":"句⑤中的“不仅……而且……”是一组表示递进关系的关联词语。","plain":"句⑤中的“不仅……而且……”是一组表示递进关系的关联词语。"}],"annotations":[],"sub_questions":[],"raw_text":"（大连市级一模）下列各项中分析正确的一项是（　　）\n①吟诵是中国的一种古老艺术。②在当代中小学语文教育中，吟诵正在日益受到重视。③吟诵对教育的最明显功用是激发学习兴趣、调动学生主动学习的积极性。④很多地方把吟诵叫作“读书歌”“书歌子”“学空调”等。⑤吟诵可以表达自己的理解，抒发自己的感情，不仅声音美妙动听，而且调子各具特色。\nA. 句①的主干是“吟诵是古老艺术”。\nB. 句②是病句，应该把“日益”和“受到”调换位置。\nC. 三个加点短语的结构类型各不相同。\nD. 句⑤中的“不仅……而且……”是一组表示递进关系的关联词语。","confidence":0.95,"issues":[],"answer":"D","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"D","batch":"三 语法辨析","section":"语法辨析（一）"},{"id":"04","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":26,"print_page":22,"type":"语法辨析","stem":"（大连市级二模）下列各项中分析不正确的一项是（　　）\n①在描写春天的古诗中，我最喜欢韩愈的“二月初惊见草芽”。②这是惊人的对春天的发现，写尽了春天的勇气和蓬勃。③春天是生命核子大爆炸的时期，巨大的生命能量无穷无尽地散发出来，勃发之力势不可当。","stem_plain":"（大连市级二模）下列各项中分析不正确的一项是（　　）\n①在描写春天的古诗中，我最喜欢韩愈的“二月初惊见草芽”。②这是惊人的对春天的发现，写尽了春天的勇气和蓬勃。③春天是生命核子大爆炸的时期，巨大的生命能量无穷无尽地散发出来，勃发之力势不可当。","options":[{"key":"A","text":"句①中的标点使用有误，应将句号移至后引号的外面。","plain":"句①中的标点使用有误，应将句号移至后引号的外面。"},{"key":"B","text":"句②中有语病，应将“惊人的”与“对春天的”互换位置。","plain":"句②中有语病，应将“惊人的”与“对春天的”互换位置。"},{"key":"C","text":"“勇气和蓬勃”“势不可当”分别是并列短语和主谓短语。","plain":"“勇气和蓬勃”“势不可当”分别是并列短语和主谓短语。"},{"key":"D","text":"句③中，“巨大的”“无穷无尽地”是定语，“出来”是补语。","plain":"句③中，“巨大的”“无穷无尽地”是定语，“出来”是补语。"}],"annotations":[],"sub_questions":[],"raw_text":"（大连市级二模）下列各项中分析不正确的一项是（　　）\n①在描写春天的古诗中，我最喜欢韩愈的“二月初惊见草芽”。②这是惊人的对春天的发现，写尽了春天的勇气和蓬勃。③春天是生命核子大爆炸的时期，巨大的生命能量无穷无尽地散发出来，勃发之力势不可当。\nA. 句①中的标点使用有误，应将句号移至后引号的外面。\nB. 句②中有语病，应将“惊人的”与“对春天的”互换位置。\nC. “勇气和蓬勃”“势不可当”分别是并列短语和主谓短语。\nD. 句③中，“巨大的”“无穷无尽地”是定语，“出来”是补语。","confidence":0.95,"issues":[],"answer":"D","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒 岛生态公园内，2 000 余组灯光与大型花灯交相辉映，营造出梦幻般的节日氛围。","options":[{"key":"A","text":"句①是复句，由两个分句组成，分句之间是条件关系。","plain":"句①是复句，由两个分句组成，分句之间是条件关系。"},{"key":"B","text":"句③是病句，修改方法是将句子中的词语“打造”换成“注入”一词。","plain":"句③是病句，修改方法是将句子中的词语“打造”换成“注入”一词。"},{"key":"C","text":"“文化风情”“夜幕降临”“节日氛围”三个短语的结构类型完全相同。","plain":"“文化风情”“夜幕降临”“节日氛围”三个短语的结构类型完全相同。"},{"key":"D","text":"把以上四个句子组成一段话，恰当的排序是③④②①。","plain":"把以上四个句子组成一段话，恰当的排序是③④②①。"}],"annotations":[],"sub_questions":[],"raw_text":"（抚顺市级一模）下列各项中分析正确的一项是（　　）\n①在这里，游客不仅能欣赏到绚丽的花灯，还能感受到抚顺独特的文化风情。②秧歌舞的欢快节奏与冰雪电音节的激情旋律交织在一起，让年味儿愈发浓郁。③月牙岛新春夜游季为我市文旅产业发展打造了新动力。④夜幕降临，月牙岛生态公园内，2 000 余组灯光与大型花灯交相辉映，营造出梦幻般的节日氛围。\nA. 句①是复句，由两个分句组成，分句之间是条件关系。\nB. 句③是病句，修改方法是将句子中的词语“打造”换成“注入”一词。\nC. “文化风情”“夜幕降临”“节日氛围”三个短语的结构类型完全相同。\nD. 把以上四个句子组成一段话，恰当的排序是③④②①。","confidence":0.95,"issues":[],"answer":"B","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"B","batch":"三 语法辨析","section":"语法辨析（一）"},{"id":"08","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":27,"print_page":23,"type":"语法辨析","stem":"（本溪市级一模）下列各项中分析正确的一项是（　　）\n①2022 年，我国将“二十四节气”正式列入联合国非遗名录，“谷雨”作为重要组成部分备受关注。②从谷雨开始，进入农田管理的关键时期。③此时气温回升，雨水滋润着每一寸土地，谷物在湿润的土壤中悄然萌发。④在北方，尽管谷雨时节偶有冷空气活动，但万物生长的势头依然强劲。","stem_plain":"（本溪市级一模）下列各项中分析正确的一项是（　　）\n①2022 年，我国将“二十四节气”正式列入联合国非遗名录，“谷雨”作为重要组成部分备受关注。②从谷雨开始，进入农田管理的关键时期。③此时气温回升，雨水滋润着每一寸土地，谷物在湿润的土壤中悄然萌发。④在北方，尽管谷雨时节偶有冷空气活动，但万物生长的势头依然强劲。","options":[{"key":"A","text":"句①中加点的“正式”是形容词，“作为”是动词，“备受关注”是主谓短语。","plain":"句①中加点的“正式”是形容词，“作为”是动词，“备受关注”是主谓短语。"},{"key":"B","text":"句②是病句，修改方法是把句中的“关键”换成“重要”。","plain":"句②是病句，修改方法是把句中的“关键”换成“重要”。"},{"key":"C","text":"句③中的画线部分的句子主干是“谷物在萌发”。","plain":"句③中的画线部分的句子主干是“谷物在萌发”。"},{"key":"D","text":"句④用“尽管”“但”连接两个分句，分句之间是转折关系。","plain":"句④用“尽管”“但”连接两个分句，分句之间是转折关系。"}],"annotations":[],"sub_questions":[],"raw_text":"（本溪市级一模）下列各项中分析正确的一项是（　　）\n①2022 年，我国将“二十四节气”正式列入联合国非遗名录，“谷雨”作为重要组成部分备受关注。②从谷雨开始，进入农田管理的关键时期。③此时气温回升，雨水滋润着每一寸土地，谷物在湿润的土壤中悄然萌发。④在北方，尽管谷雨时节偶有冷空气活动，但万物生长的势头依然强劲。\nA. 句①中加点的“正式”是形容词，“作为”是动词，“备受关注”是主谓短语。\nB. 句②是病句，修改方法是把句中的“关键”换成“重要”。\nC. 句③中的画线部分的句子主干是“谷物在萌发”。\nD. 句④用“尽管”“但”连接两个分句，分句之间是转折关系。","confidence":0.95,"issues":[],"answer":"D","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"D","batch":"三 语法辨析","section":"语法辨析（一）"},{"id":"09","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":27,"print_page":23,"type":"语法辨析","stem":"（本溪市级二模）下列各项中分析正确的一项是（　　）\n①京剧脸谱是京剧演员面部的彩色化妆，是极具中国文化特色的造型艺术，在形式、色彩和类型上都有严格格式。②它一般用夸张、变形的图形展示角色性格。③各色脸谱有不同的象征意义：红色代表忠勇义烈，黑色代表忠烈正直，白色代表阴险狡诈。④其类型多样，有整脸、三块瓦脸等。⑤它不仅承载着深厚的文化内涵，更是京剧的独特标志。","stem_plain":"（本溪市级二模）下列各项中分析正确的一项是（　　）\n①京剧脸谱是京剧演员面部的彩色化妆，是极具中国文化特色的造型艺术，在形式、色彩和类型上都有严格格式。②它一般用夸张、变形的图形展示角色性格。③各色脸谱有不同的象征意义：红色代表忠勇义烈，黑色代表忠烈正直，白色代表阴险狡诈。④其类型多样，有整脸、三块瓦脸等。⑤它不仅承载着深厚的文化内涵，更是京剧的独特标志。","options":[{"key":"A","text":"“造型艺术”“忠勇义烈”“类型多样”三个短语的结构类型相同。","plain":"“造型艺术”“忠勇义烈”“类型多样”三个短语的结构类型相同。"},{"key":"B","text":"句②的主干是“它展示性格”，“用夸张、变形的图形”作状语。","plain":"句②的主干是“它展示性格”，“用夸张、变形的图形”作状语。"},{"key":"C","text":"句③中的冒号运用有误，应该把冒号改为逗号。","plain":"句③中的冒号运用有误，应该把冒号改为逗号。"},{"key":"D","text":"句⑤是病句，修改方法是将“它”和“不仅”互换位置。","plain":"句⑤是病句，修改方法是将“它”和“不仅”互换位置。"}],"annotations":[],"sub_questions":[],"raw_text":"（本溪市级二模）下列各项中分析正确的一项是（　　）\n①京剧脸谱是京剧演员面部的彩色化妆，是极具中国文化特色的造型艺术，在形式、色彩和类型上都有严格格式。②它一般用夸张、变形的图形展示角色性格。③各色脸谱有不同的象征意义：红色代表忠勇义烈，黑色代表忠烈正直，白色代表阴险狡诈。④其类型多样，有整脸、三块瓦脸等。⑤它不仅承载着深厚的文化内涵，更是京剧的独特标志。\nA. “造型艺术”“忠勇义烈”“类型多样”三个短语的结构类型相同。\nB. 句②的主干是“它展示性格”，“用夸张、变形的图形”作状语。\nC. 句③中的冒号运用有误，应该把冒号改为逗号。\nD. 句⑤是病句，修改方法是将“它”和“不仅”互换位置。","confidence":0.95,"issues":[],"answer":"B","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"B","batch":"三 语法辨析","section":"语法辨析（一）"},{"id":"10","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":27,"print_page":23,"type":"语法辨析","stem":"（本溪市级三模）下列各项中分析正确的一项是（　　）\n①中医药文化是中华民族的瑰宝，其理论体系蕴含着深厚的哲学智慧。②近年来，国家颁布了一系列旨在加大对中医药扶持力度的政策法规。③这些措施成效显著，不仅提高了中医药的服务能力，而且促进了中医药的传承和创新。④因此，我们要完善中医药管理体系，推进相关制度建设和人才培养水平。","stem_plain":"（本溪市级三模）下列各项中分析正确的一项是（　　）\n①中医药文化是中华民族的瑰宝，其理论体系蕴含着深厚的哲学智慧。②近年来，国家颁布了一系列旨在加大对中医药扶持力度的政策法规。③这些措施成效显著，不仅提高了中医药的服务能力，而且促进了中医药的传承和创新。④因此，我们要完善中医药管理体系，推进相关制度建设和人才培养水平。","options":[{"key":"A","text":"“哲学智慧”“成效显著”“管理体系”三个短语类型各不相同。","plain":"“哲学智慧”“成效显著”“管理体系”三个短语类型各不相同。"},{"key":"B","text":"句②是一个单句，句子主干是“国家颁布法规”。","plain":"句②是一个单句，句子主干是“国家颁布法规”。"},{"key":"C","text":"句③用“不仅”“而且”连接两个分句，分句之间是转折关系。","plain":"句③用“不仅”“而且”连接两个分句，分句之间是转折关系。"},{"key":"D","text":"句④有语病，修改方法是在“人才培养水平”前加“提高”。","plain":"句④有语病，修改方法是在“人才培养水平”前加“提高”。"}],"annotations":[],"sub_questions":[],"raw_text":"（本溪市级三模）下列各项中分析正确的一项是（　　）\n①中医药文化是中华民族的瑰宝，其理论体系蕴含着深厚的哲学智慧。②近年来，国家颁布了一系列旨在加大对中医药扶持力度的政策法规。③这些措施成效显著，不仅提高了中医药的服务能力，而且促进了中医药的传承和创新。④因此，我们要完善中医药管理体系，推进相关制度建设和人才培养水平。\nA. “哲学智慧”“成效显著”“管理体系”三个短语类型各不相同。\nB. 句②是一个单句，句子主干是“国家颁布法规”。\nC. 句③用“不仅”“而且”连接两个分句，分句之间是转折关系。\nD. 句④有语病，修改方法是在“人才培养水平”前加“提高”。","confidence":0.95,"issues":[],"answer":"D","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"D","batch":"三 语法辨析","section":"语法辨析（一）"},{"id":"11","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":28,"print_page":24,"type":"语法辨析","stem":"（丹东市级一模）下列各项中分析不正确的一项是（　　）\n①读书使人得到一种优雅和风味。②读书多了，会在不知不觉中改变人的容颜、气质和才干，即所谓的“腹有诗书气自华”。③许多时候，自己可能以为许多看过的书籍都成了过眼云烟，不复记忆，但它们仍是潜在的，在气质里，在谈吐上，在胸襟的无涯，当然也可能显露在生活和文字里。④喜欢读书的人，拥有真正的属于自己的美丽和智慧，生成自己独特的内在气质和修养，它是居眼间的淡定从容，举止间的成熟稳重，和内心里的优雅沉静。","stem_plain":"（丹东市级一模）下列各项中分析不正确的一项是（　　）\n①读书使人得到一种优雅和风味。②读书多了，会在不知不觉中改变人的容颜、气质和才干，即所谓的“腹有诗书气自华”。③许多时候，自己可能以为许多看过的书籍都成了过眼云烟，不复记忆，但它们仍是潜在的，在气质里，在谈吐上，在胸襟的无涯，当然也可能显露在生活和文字里。④喜欢读书的人，拥有真正的属于自己的美丽和智慧，生成自己独特的内在气质和修养，它是居眼间的淡定从容，举止间的成熟稳重，和内心里的优雅沉静。","options":[{"key":"A","text":"句①和句④中加点词语“优雅”的词性都是形容词。"," 的笔画间流露出的坚韧不拔的力量感。④这种力量感恰是颜真卿磊落不群的人格修为的显现，与古代士人精神中的“内圣外王”理念高度契合。⑤因此，颜真卿的书法又被誉为“中正之笔”。\nA. 文中加点的“体现”是动词，“一个”是数量词，“上”是名词，“高度契合”是偏正短语。\nB. 句①中加点的“它”具体指代“书品与人品的统一”。\nC. 句②是递进关系的复句。\nD. 句③中“流露”作谓语。","confidence":0.95,"issues":[],"answer":"D","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"D","batch":"三 语法辨析","section":"语法辨析（二）"},{"id":"04","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":30,"print_page":26,"type":"语法辨析","stem":"（沈阳和平零模）下列各项中分析正确的一项是（　　）\n①人生在世，或多或少都会遇到烦恼，但若总是耿耿于怀，最后伤害的往往是自己。②我们给昨日的烦恼按下暂停键，不是逃避问题，而是腾出双手去迎接新的可能。③人生这本书，只有翻过这一页，才能书写下一章。④把心里的垃圾倒一倒，试着把“要是我当时”换成“下次我可以”，多多肯定自己，方能轻装上阵，以全新的姿态迎接新的曙光。","stem_plain":"（沈阳和平零模）下列各项中分析正确的一项是（　　）\n①人生在世，或多或少都会遇到烦恼，但若总是耿耿于怀，最后伤害的往往是自己。②我们给昨日的烦恼按下暂停键，不是逃避问题，而是腾出双手去迎接新的可能。③人生这本书，只有翻过这一页，才能书写下一章。④把心里的垃圾倒一倒，试着把“要是我当时”换成“下次我可以”，多多肯定自己，方能轻装上阵，以全新的姿态迎接新的曙光。","options":[{"key":"A","text":"“遇到烦恼”“逃避问题”和“轻装上阵”三个短语的结构类型完全相同。","plain":"“遇到烦恼”“逃避问题”和“轻装上阵”三个短语的结构类型完全相同。"},{"key":"B","text":"句②中“我们给昨日的烦恼按下暂停键”的主干是“烦恼按下暂停键”。","plain":"句②中“我们给昨日的烦恼按下暂停键”的主干是“烦恼按下暂停键”。"},{"key":"C","text":"句③“只有”和“才”连接的两个分句，分句之间是转折关系。","plain":"句③“只有”和“才”连接的两个分句，分句之间是转折关系。"},{"key":"D","text":"句④标点符号有错误，应将“下次我可以，”中的逗号移到双引号后。","plain":"句④标点符号有错误，应将“下次我可以，”中的逗号移到双引号后。"}],"annotations":[],"sub_questions":[],"raw_text":"（沈阳和平零模）下列各项中分析正确的一项是（　　）\n①人生在世，或多或少都会遇到烦恼，但若总是耿耿于怀，最后伤害的往往是自己。②我们给昨日的烦恼按下暂停键，不是逃避问题，而是腾出双手去迎接新的可能。③人生这本书，只有翻过这一页，才能书写下一章。④把心里的垃圾倒一倒，试着把“要是我当时”换成“下次我可以”，多多肯定自己，方能轻装上阵，以全新的姿态迎接新的曙光。\nA. “遇到烦恼”“逃避问题”和“轻装上阵”三个短语的结构类型完全相同。\nB. 句②中“我们给昨日的烦恼按下暂停键”的主干是“烦恼按下暂停键”。\nC. 句③“只有”和“才”连接的两个分句，分句之间是转折关系。\nD. 句④标点符号有错误，应将“下次我可以，”中的逗号移到双引号后。","confidence":0.95,"issues":[],"answer":"D","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"D","batch":"三 语法辨析","section":"语法辨析（二）"},{"id":"05","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":30,"print_page":26,"type":"语法辨析","stem":"（沈阳皇姑零模）下列各项中分析正确的一项是（　　）\n①“苟有恒，何必三更眠五更起；最无益，莫过一日曝十日寒。”这是明代学者胡居仁撰写的对联，意在勉励自己：做事情贵在持之以恒。②持之以恒，就要坚持不懈，而非一曝十寒。③持之以恒，就要注重平日积累，而非临渴掘井。④古今中外很多事例都告诉我们，做事情有恒心方能成功。⑤我们在求学、成长的路途上，也应持之以恒。","stem_plain":"（沈阳皇姑零模）下列各项中分析正确的一项是（　　）\n①“苟有恒，何必三更眠五更起；最无益，莫过一日曝十日寒。”这是明代学者胡居仁撰写的对联，意在勉励自己：做事情贵在持之以恒。②持之以恒，就要坚持不懈，而非一曝十寒。③持之以恒，就要注重平日积累，而非临渴掘井。④古今中外很多事例都告诉我们，做事情有恒心方能成功。⑤我们在求学、成长的路途上，也应持之以恒。","options":[{"key":"A","text":"文中加点的“自己”和“我们”都是代词，“平日积累”和“古今中外”都是偏正短语。","plain":"文中加点的“自己”和“我们”都是代词，“平日积累”和“古今中外”都是偏正短语。"},{"key":"B","text":"句②是表示选择关系的复句。","plain":"句②是表示选择关系的复句。"},{"key":"C","text":"句⑤中，“持之以恒”作宾语。","plain":"句⑤中，“持之以恒”作宾语。"},{"key":"D","text":"将选文各句组成语意连贯的一段话，最恰当的排列顺序为①③②④⑤。","plain":"将选文各句组成语意连贯的一段话，最恰当的排列顺序为①③②④⑤。"}],"annotations":[],"sub_questions":[],"raw_text":"（沈阳皇姑零模）下列各项中分析正确的一项是（　　）\n①“苟有恒，何必三更眠五更起；最无益，莫过一日曝十日寒。”这是明代学者胡居仁撰写的对联，意在勉励自己：做事情贵在持之以恒。②持之以恒，就要坚持不懈，而非一曝十寒。③持之以恒，就要注重平日积累，而非临渴掘井。④古今中外很多事例都告诉我们，做事情有恒心方能成功。⑤我们在求学、成长的路途上，也应持之以恒。\nA. 文中加点的“自己”和“我们”都是代词，“平日积累”和“古今中外”都是偏正短语。\nB. 句②是表示选择关系的复句。\nC. 句⑤中，“持之以恒”作宾语。\nD. 将选文各句组成语意连贯的一段话，最恰当的排列顺序为①③②④⑤。","confidence":0.95,"issues":[],"answer":"C","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"C","batch":"三 语法辨析","section":"语法辨析（二）"},{"id":"06","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":30,"print_page":26,"type":"语法辨析","stem":"（沈阳浑南零模）下列各项中分析正确的一项是（　　）\n唐宋时期，白蛇传说的雏形开始出现。蛇精的故事逐渐从道教传说中脱颖而出。白蛇的形象在民间传说中初步形成，逐步演变为白娘子这一善良的蛇精角色。明代冯梦龙的《警世通言》收录了《白娘子永镇雷峰塔》的故事，白蛇传说成为中国四大民间传说。白蛇既代表了对爱情的忠贞和坚守，又象征着宽容与善良。这部传说反映了古代先民对超越世俗限制的爱情的向往，也表达了追求自由的愿望。","stem_plain":"（沈阳浑南零模）下列各项中分析正确的一项是（　　）\n唐宋时期，白蛇传说的雏形开始出现。蛇精的故事逐渐从道教传说中脱颖而出。白蛇的形象在民间传说中初步形成，逐步演变为白娘子这一善良的蛇精角色。明代冯梦龙的《警世通言》收录了《白娘子永镇雷峰塔》的故事，白蛇传说成为中国四大民间传说。白蛇既代表了对爱情的忠贞和坚守，又象征着宽容与善良。这部传说反映了古代先民对超越世俗限制的爱情的向往，也表达了追求自由的愿望。","options":[{"key":"A","text":"“白蛇传说”“初步形成”“宽容与善良”“追求自由”四个短语类型各不相同。","plain":"“白蛇传说”“初步形成”“宽容与善良”“追求自由”四个短语类型各不相同。"},{"key":"B","text":"“蛇精的故事逐渐从道教传说中脱颖而出”一句中主语是“故事”，谓语是“逐渐”，宾语是“从道教传说中脱颖而出”。","plain":"“蛇精的故事逐渐从道教传说中脱颖而出”一句中主语是“故事”，谓语是“逐渐”，宾语是“从道教传说中脱颖而出”。"},{"key":"C","text":"画线句子有语病，应该改为“白蛇传说成为中国四大民间传说之一”。","plain":"画线句子有语病，应该改为“白蛇传说成为中国四大民间传说之一”。"},{"key":"D","text":"“白蛇既代表了对爱情的忠贞和坚守，又象征着宽容与善良。”是递进关系复句。","plain":"“白蛇既代表了对爱情的忠贞和坚守，又象征着宽容与善良。”是递进关系复句。"}],"annotations":[],"sub_questions":[],"raw_text":"（沈阳浑南零模）下列各项中分析正确的一项是（　　）\n唐宋时期，白蛇传说的雏形开始出现。蛇精的故事逐渐从道教传说中脱颖而出。白蛇的形象在民间传说中初步形成，逐步演变为白娘子这一善良的蛇精角色。明代冯梦龙的《警世通言》收录了《白娘子永镇雷峰塔》的故事，白蛇传说成为中国四大民间传说。白蛇既代表了对爱情的忠贞和坚守，又象征着宽容与善良。这部传说反映了古代先民对超越世俗限制的爱情的向往，也表达了追求自由的愿望。\nA. “白蛇传说”“初步形成”“宽容与善良”“追求自由”四个短语类型各不相同。\nB. “蛇精的故事逐渐从道教传说中脱颖而出”一句中主语是“故事”，谓语是“逐渐”，宾语是“从道教传说中脱颖而出”。\nC. 画线句子有语病，应该改为“白蛇传说成为中国四大民间传说之一”。\nD. “白蛇既代表了对爱情的忠贞和坚守，又象征着宽容与善良。”是递进关系复句。","confidence":0.95,"issues":[],"answer":"C","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"C","batch":"三 语法辨析","section":"语法辨析（二）"},{"id":"07","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":30,"print_page":26,"type":"语法辨析","stem":"（沈阳铁西零模）下列各项中分析正确的一项是（　　）\n农历的韵味是农谚的韵味。“谷雨前后，栽瓜种豆。”“立夏到小满，种啥也不晚。”先人击壤而歌，让畔而耕，和谐相处，其乐融融，①这种田园牧歌般的情调产生了大量的农谚。②她可触可感的泥土味，有清新宜人的绿草香。一切都是那样闲适、自在和家常，③无不随处体现着农历文化的笃定、恒久和安详。","stem_plain":"（沈阳铁西零模）下列各项中分析正确的一项是（　　）\n农历的韵味是农谚的韵味。“谷雨前后，栽瓜种豆。”“立夏到小满，种啥也不晚。”先人击壤而歌，让畔而耕，和谐相处，其乐融融，①这种田园牧歌般的情调产生了大量的农谚。②她可触可感的泥土味，有清新宜人的绿草香。一切都是那样闲适、自在和家常，③无不随处体现着农历文化的笃定、恒久和安详。","options":[{"key":"A","text":"“谷雨前后”“和谐相处”“自在和家常”三个短语结构各不相同。","plain":"“谷雨前后”“和谐相处”“自在和家常”三个短语结构各不相同。"},{"key":"B","text":"句①的主干是“田园牧歌产生农谚”。","plain":"句①的主干是“田园牧歌产生农谚”。"},{"key":"C","text":"句②画线两个分句间是并列关系，中间的逗号使用有误，应改为顿号。","plain":"句②画线两个分句间是并列关系，中间的逗号使用有误，应改为顿号。"},{"key":"D","text":"句③有语病，应改为“无不随处体现着农历文化的笃定、恒久和安详”。","plain":"句③有语病，应改为“无不随处体现着农历文化的笃定、恒久和安详”。"}],"annotations":[],"sub_questions":[],"raw_text":"（沈阳铁西零模）下列各项中分析正确的一项是（　　）\n农历的韵味是农谚的韵味。“谷雨前后，栽瓜种豆。”“立夏到小满，种啥也不晚。”先人击壤而歌，让畔而耕，和谐相处，其乐融融，①这种田园牧歌般的情调产生了大量的农谚。②她可触可感的泥土味，有清新宜人的绿草香。一切都是那样闲适、自在和家常，③无不随处体现着农历文化的笃定、恒久和安详。\nA. “谷雨前后”“和谐相处”“自在和家常”三个短语结构各不相同。\nB. 句①的主干是“田园牧歌产生农谚”。\nC. 句②画线两个分句间是并列关系，中间的逗号使用有误，应改为顿号。\nD. 句③有语病，应改为“无不随处体现着农历文化的笃定、恒久和安详”。","confidence":0.95,"issues":[],"answer":"D","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"D","batch":"三 语法辨析","section":"语法辨析（二）"},{"id":"08","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":31,"print_page":27,"type":"语法辨析","stem":"（沈阳于洪零模）下列各项中分析正确的一项是（　　）\n北方四季泾渭分明，季节的风吹向大地，让人感受到时令的变迁、植物的荣枯。春风边走边为大地褪去寒衣，然后一点一点着上春色，直至春色满园。燕子按时返回村庄，打扫干净亲手营造的巢房，白天在野外觅食，傍晚在村街上游戏。麦田脱去叶片上的灰白，伸展开蜷缩的腰肢，将深绿色在田野里铺展。紫叶李花团锦簇，红玉兰含苞待放，连翘灿烂，碧桃俏丽，紫荆花争艳……野花就这样装点了乡村的页册。流水潺潺，小河是系在村庄胸前的绸带，更是大地的血脉。这里是鹅鸭的天堂，它们在河中觅食、嬉戏。河边垂柳依依而立，那鹅黄色的芽苞，将河水映绿染黄。","stem_plain":"（沈阳于洪零模）下列各项中分析正确的一项是（　　）\n北方四季泾渭分明，季节的风吹向大地，让人感受到时令的变迁、植物的荣枯。春风边走边为大地褪去寒衣，然后一点一点着上春色，直至春色满园。燕子按时返回村庄，打扫干净亲手营造的巢房，白天在野外觅食，傍晚在村街上游戏。麦田脱去叶片上的灰白，伸展开蜷缩的腰肢，将深绿色在田野里铺展。紫叶李花团锦簇，红玉兰含苞待放，连翘灿烂，碧桃俏丽，紫荆花争艳……野花就这样装点了乡村的页册。流水潺潺，小河是系在村庄胸前的绸带，更是大地的血脉。这里是鹅鸭的天堂，它们在河中觅食、嬉戏。河边垂柳依依而立，那鹅黄色的芽苞，将河水映绿染黄。","options":[{"key":"A","text":"“泾渭分明”“褪去寒衣”“春色满园”三个短语的结构类型各不相同。","plain":"“泾渭分明”“褪去寒衣”“春色满园”三个短语的结构类型各不相同。"},{"key":"B","text":"“野花就这样装点了乡村的页册”一句中，“装点”作谓语，“页册”作宾语。","plain":"“野花就这样装点了乡村的页册”一句中，“装点”作谓语，“页册”作宾语。"},{"key":"C","text":"“流水潺潺，小河是系在村庄胸前的绸带，更是大地的血脉。”用“是……更是……”连接前后两个分句，分句之间是转折关系。","plain":"“流水潺潺，小河是系在村庄胸前的绸带，更是大地的血脉。”用“是……更是……”连接前后两个分句，分句之间是转折关系。"},{"key":"D","text":"画线句有语病，正确改法是把“映绿”和“染黄”调换位置。","plain":"画线句有语病，正确改法是把“映绿”和“染黄”调换位置。"}],"annotations":[],"sub_questions":[],"raw_text":"（沈阳于洪零模）下列各项中分析正确的一项是（　　）\n北方四季泾渭分明，季节的风吹向大地，让人感受到时令的变迁、植物的荣枯。春风边走边为大地褪去寒衣，然后一点一点着上春色，直至春色满园。燕子按时返回村庄，打扫干净亲手营造的巢房，白天在野外觅食，傍晚在村街上游戏。麦田脱去叶片上的灰白，伸展开蜷缩的腰肢，将深绿色在田野里铺展。紫叶李花团锦簇，红玉兰含苞待放，连翘灿烂，碧桃俏丽，紫荆花争艳……野花就这样装点了乡村的页册。流水潺潺，小河是系在村庄胸前的绸带，更是大地的血脉。这里是鹅鸭的天堂，它们在河中觅食、嬉戏。河边垂柳依依而立，那鹅黄色的芽苞，将河水映绿染黄。\nA. “泾渭分明”“褪去寒衣”“春色满园”三个短语的结构类型各不相同。\nB. “野花就这样装点了乡村的页册”一句中，“装点”作谓语，“页册”作宾语。\nC. “流水潺潺，小河是系在村庄胸前的绸带，更是大地的血脉。”用“是……更是……”连接前后两个分句，分句之间是转折关系。\nD. 画线句有语病，正确改法是把“映绿”和“染黄”调换位置。","confidence":0.95,"issues":[],"answer":"B","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"B","batch":"三 语法辨析","section":"语法辨析（二）"},{"id":"09","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":31,"print_page":27,"type":"语法辨析","stem":"（大连甘井子一模）下列各项中分析不正确的一项是（　　）\n①迎春花站在季节的额头，连一件绿色衣衫也来不及穿。②是听到冬的深处萌动的生命跃跃欲试的声音，还是为了践行生命的某种诺言？③它自信而不无骄傲地朝着冬的篱笆那边的春，露出妩媚的笑容。④看它那性急的样子，是不是早在风雪深处，就按捺不住预言的催促，蠢蠢欲动，想要绽放贮藏了一冬的激情啊！","stem_plain":"（大连甘井子一模）下列各项中分析不正确的一项是（　　）\n①迎春花站在季节的额头，连一件绿色衣衫也来不及穿。②是听到冬的深处萌动的生命跃跃欲试的声音，还是为了践行生命的某种诺言？③它自信而不无骄傲地朝着冬的篱笆那边的春，露出妩媚的笑容。④看它那性急的样子，是不是早在风雪深处，就按捺不住预言的催促，蠢蠢欲动，想要绽放贮藏了一冬的激情啊！","options":[{"key":"A","text":"“绿色衣衫”“风雪深处”“按捺不住”三个短语的结构类型各不相同。","plain":"“绿色衣衫”“风雪深处”“按捺不住”三个短语的结构类型各不相同。"},{"key":"B","text":"句②是一个选择关系的复句。","plain":"句②是一个选择关系的复句。"},{"key":"C","text":"句③的主干是“它露出笑容”。","plain":"句③的主干是“它露出笑容”。"},{"key":"D","text":"句④“蠢蠢欲动”贬义褒用，生动地写出了迎春花即将萌发的生命力。","plain":"句④“蠢蠢欲动”贬义褒用，生动地写出了迎春花即将萌发的生命力。"}],"annotations":[],"sub_questions":[],"raw_text":"（大连甘井子一模）下列各项中分析不正确的一项是（　　）\n①迎春花站在季节的额头，连一件绿色衣衫也来不及穿。②是听到冬的深处萌动的生命跃跃欲试的声音，还是为了践行生命的某种诺言？③它自信而不无骄傲地朝着冬的篱笆那边的春，露出妩媚的笑容。④看它那性急的样子，是不是早在风雪深处，就按捺不住预言的催促，蠢蠢欲动，想要绽放贮藏了一冬的激情啊！\nA. “绿色衣衫”“风雪深处”“按捺不住”三个短语的结构类型各不相同。\nB. 句②是一个选择关系的复句。\nC. 句③的主干是“它露出笑容”。\nD. 句④“蠢蠢欲动”贬义褒用，生动地写出了迎春花即将萌发的生命力。","confidence":0.95,"issues":[],"answer":"A","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"A","batch":"三 语法辨析","section":"语法辨析（二）"},{"id":"10","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":31,"print_page":27,"type":"语法辨析","stem":"（大连高新一模）下列各项中分析正确的一项是（　　）\n①人类精神生活的提高，需借助实践活动来完成，而且其中一项重要的活动就是阅读和艺术鉴赏。②通过阅读，我们可以增加知识储备，提升精神境界；借助艺术鉴赏，我们可以陶冶审美情操，培养审美品位。③从广义上讲，艺术鉴赏也并非是一种阅读。","stem_plain":"（大连高新一模）下列各项中分析正确的一项是（　　）\n①人类精神生活的提高，需借助实践活动来完成，而且其中一项重要的活动就是阅读和艺术鉴赏。②通过阅读，我们可以增加知识储备，提升精神境界；借助艺术鉴赏，我们可以陶冶审美情操，培养审美品位。③从广义上讲，艺术鉴赏也并非是一种阅读。","options":[{"key":"A","text":"“艺术鉴赏”“通过阅读”“审美品位”三个短语的结构类型完全相同。","plain":"“艺术鉴赏”“通过阅读”“审美品位”三个短语的结构类型完全相同。"},{"key":"B","text":"句①用“而且”连接前后两个分句，分句之间是转折关系。","plain":"句①用“而且”连接前后两个分句，分句之间是转折关系。"},{"key":"C","text":"句②“提升精神境界”后的分号使用不当，应改为句号。","plain":"句②“提升精神境界”后的分号使用不当，应改为句号。"},{"key":"D","text":"句③语义与上文不连贯，修改方法是删掉“并非”一词。","plain":"句③语义与上文不连贯，修改方法是删掉“并非”一词。"}],"annotations":[],"sub_questions":[],"raw_text":"（大连高新一模）下列各项中分析正确的一项是（　　）\n①人类精神生活的提高，需借助实践活动来完成，而且其中一项重要的活动就是阅读和艺术鉴赏。②通过阅读，我们可以增加知识储备，提升精神境界；借助艺术鉴赏，我们可以陶冶审美情操，培养审美品位。③从广义上讲，艺术鉴赏也并非是一种阅读。\nA. “艺术鉴赏”“通过阅读”“审美品位”三个短语的结构类型完全相同。\nB. 句①用“而且”连接前后两个分句，分句之间是转折关系。\nC. 句②“提升精神境界”后的分号使用不当，应改为句号。\nD. 句③语义与上文不连贯，修改方法是删掉“并非”一词。","confidence":0.95,"issues":[],"answer":"D","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"D","batch":"三 语法辨析","section":"语法辨析（二）"},{"id":"11","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":32,"print_page":28,"type":"语法辨析","stem":"（大连沙河口一模）下列各项中分析不正确的一项是（　　）\n①回望新中国成立以来的不凡征程，无论是白手起家“建设一个新世界”，还是勒紧裤腰带研制“两弹一星”；②无论是修高铁、办奥运，还是实现“神舟”飞天、“嫦娥”探月、“蛟龙”入海；③无论是战洪水、防非典、抗地震，还是抗疫情，面对风险挑战，中国人民总能迸发“比铁还硬、比钢还强”的团结之力，总能创造“人心齐，泰山移”的人间传奇。④在前进的道路上，无论遇到多大的困难，无论遇到什么样的挑战，只要始终坚持团结一心、凝聚众力，14 亿中国人民就没有跨越不了的沟坎、战胜不了的敌人。","stem_plain":"（大连沙河口一模）下列各项中分析不正确的一项是（　　）\n①回望新中国成立以来的不凡征程，无论是白手起家“建设一个新世界”，还是勒紧裤腰带研制“两弹一星”；②无论是修高铁、办奥运，还是实现“神舟”飞天、“嫦娥”探月、“蛟龙”入海；③无论是战洪水、防非典、抗地震，还是抗疫情，面对风险挑战，中国人民总能迸发“比铁还硬、比钢还强”的团结之力，总能创造“人心齐，泰山移”的人间传奇。④在前进的道路上，无论遇到多大的困难，无论遇到什么样的挑战，只要始终坚持团结一心、凝聚众力，14 亿中国人民就没有跨越不了的沟坎、战胜不了的敌人。","options":[{"key":"A","text":"句①中加点的“不”“一个”“世界”分别是副词、数量词和名词。","plain":"句①中加点的“不”“一个”“世界”分别是副词、数量词和名词。"},{"key":"B","text":"句②③中画线的“修高铁”“办奥运”与“人心齐”“泰山移”两组短语结构类型不相同。","plain":"句②③中画线的“修高铁”“办奥运”与“人心齐”“泰山移”两组短语结构类型不相同。"},{"key":"C","text":"句③整体看是条件关系的复句。","plain":"句③整体看是条件关系的复句。"},{"key":"D","text":"句④有语病，应将“14 亿中国人民”调整为“中国 14 亿人民”。","plain":"句④有语病，应将“14 亿中国人民”调整为“中国 14 亿人民”。"}],"annotations":[],"sub_questions":[],"raw_text":"（大连沙河口一模）下列各项中分析不正确的一项是（　　）\n①回望新中国成立以来的不凡征程，无论是白手起家“建设一个新世界”，还是勒紧裤腰带研制“两弹一星”；②无论是修高铁、办奥运，还是实现“神舟”飞天、“嫦娥”探月、“蛟龙”入海；③无论是战洪水、防非典、抗地震，还是抗疫情，面对风险挑战，中国人民总能迸发“比铁还硬、比钢还强”的团结之力，总能创造“人心齐，泰山移”的人间传奇。④在前进的道路上，无论遇到多大的困难，无论遇到什么样的挑战，只要始终坚持团结一心、凝聚众力，14 亿中国人民就没有跨越不了的沟坎、战胜不了的敌人。\nA. 句①中加点的“不”“一个”“世界”分别是副词、数量词和名词。\nB. 句②③中画线的“修高铁”“办奥运”与“人心齐”“泰山移”两组短语结构类型不相同。\nC. 句③整体看是条件关系的复句。\nD. 句④有语病，应将“14 亿中国人民”调整为“中国 14 亿人民”。","confidence":0.95,"issues":[],"answer":"C","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"C","batch":"三 语法辨析","section":"语法辨析（二）"},{"id":"12","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":32,"print_page":28,"type":"语法辨析","stem":"（鞍山海城一模）下列各项中分析正确的一项是（　　）\n人生之路，真的不存在太早也没有太晚，一切都只是刚刚好。每个人生阶段，我们都会有不同的追求，只有在刚刚好的时间，做刚刚好的事情，才能在刚刚好的时间，活出最精彩的自己。所以，我们要以轻松愉快的心情来面对每一天。即使有失败，也并不意味着我们不可以再转换方向，有新作为。","stem_plain":"（鞍山海城一模）下列各项中分析正确的一项是（　　）\n人生之路，真的不存在太早也没有太晚，一切都只是刚刚好。每个人生阶段，我们都会有不同的追求，只有在刚刚好的时间，做刚刚好的事情，才能在刚刚好的时间，活出最精彩的自己。所以，我们要以轻松愉快的心情来面对每一天。即使有失败，也并不意味着我们不可以再转换方向，有新作为。","options":[{"key":"A","text":"文中加点的“一切”“刚刚”“追求”“只有”依次为代词、副词、动词、连词。","plain":"文中加点的“一切”“刚刚”“追求”“只有”依次为代词、副词、动词、连词。"},{"key":"B","text":"“不同的追求”“活出最精彩的自己”“转换方向”“有新作为”短语类型相同。","plain":"“不同的追求”“活出最精彩的自己”“转换方向”“有新作为”短语类型相同。"},{"key":"C","text":"画波浪线的句子中“以轻松愉快的心情”在句中所作的成分是定语。","plain":"画波浪线的句子中“以轻松愉快的心情”在句中所作的成分是定语。"},{"key":"D","text":"画直线句“即使有失败，也并不意味着我们不可以再转换方向，有新作为”是假设关系的复句。","plain":"画直线句“即使有失败，也并不意味着我们不可以再转换方向，有新作为”是假设关系的复句。"}],"annotations":[],"sub_questions":[],"raw_text":"（鞍山海城一模）下列各项中分析正确的一项是（　　）\n人生之路，真的不存在太早也没有太晚，一切都只是刚刚好。每个人生阶段，我们都会有不同的追求，只有在刚刚好的时间，做刚刚好的事情，才能在刚刚好的时间，活出最精彩的自己。所以，我们要以轻松愉快的心情来面对每一天。即使有失败，也并不意味着我们不可以再转换方向，有新作为。\nA. 文中加点的“一切”“刚刚”“追求”“只有”依次为代词、副词、动词、连词。\nB. “不同的追求”“活出最精彩的自己”“转换方向”“有新作为”短语类型相同。\nC. 画波浪线的句子中“以轻松愉快的心情”在句中所作的成分是定语。\nD. 画直线句“即使有失败，也并不意味着我们不可以再转换方向，有新作为”是假设关系的复句。","confidence":0.95,"issues":[],"answer":"D","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"D","batch":"三 语法辨析","section":"语法辨析（二）"},{"id":"13","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":32,"print_page":28,"type":"语法辨析","stem":"（盘锦兴隆台七校零模）下列各项中分析不正确的一项是（　　）\n①如果奇迹有颜色，那一定是逐梦于星辰大海、飘扬在苍穹之上的“中国红”。②“神舟”飞天，“天和”遨游，“嫦娥”奔月，“祝融”探火，一面面鲜艳的五星红旗跟随大国重器奔向深邃而广袤的太空。③从地球到月球，再到火星，“中国红”正成为一抹耀眼的亮色，在太空中熠熠生辉。④它属于每一位志在踏上探索太空新征程的中国人，它将一直在浩瀚的太空中指导着中国人砥砺奋进的方向。","stem_plain":"（盘锦兴隆台七校零模）下列各项中分析不正确的一项是（　　）\n①如果奇迹有颜色，那一定是逐梦于星辰大海、飘扬在苍穹之上的“中国红”。②“神舟”飞天，“天和”遨游，“嫦娥”奔月，“祝融”探火，一面面鲜艳的五星红旗跟随大国重器奔向深邃而广袤的太空。③从地球到月球，再到火星，“中国红”正成为一抹耀眼的亮色，在太空中熠熠生辉。④它属于每一位志在踏上探索太空新征程的中国人，它将一直在浩瀚的太空中指导着中国人砥砺奋进的方向。","options":[{"key":"A","text":"句①“如果奇迹有颜色，那一定是逐梦于星辰大海、飘扬在苍穹之上‘中国红’。”是假设关系复句。","plain":"句①“如果奇迹有颜色，那一定是逐梦于星辰大海、飘扬在苍穹之上‘中国红’。”是假设关系复句。"},{"key":"B","text":"“星辰大海”“熠熠生辉”“探索太空”短语类型各不相同。","plain":"“星辰大海”“熠熠生辉”“探索太空”短语类型各不相同。"},{"key":"C","text":"句②中“一面面鲜艳的五星红旗跟随大国重器奔向深邃而广袤的太空”的主干是“五星红旗跟随大国重器”。","plain":"句②中“一面面鲜艳的五星红旗跟随大国重器奔向深邃而广袤的太空”的主干是“五星红旗跟随大国重器”。"},{"key":"D","text":"句④中画横线的句子有语病，可将“指导”改为“指引”。","plain":"句④中画横线的句子有语病，可将“指导”改为“指引”。"}],"annotations":[],"sub_questions":[],"raw_text":"（盘锦兴隆台七校零模）下列各项中分析不正确的一项是（　　）\n①如果奇迹有颜色，那一定是逐梦于星辰大海、飘扬在苍穹之上的“中国红”。②“神舟”飞天，“天和”遨游，“嫦娥”奔月，“祝融”探火，一面面鲜艳的五星红旗跟随大国重器奔向深邃而广袤的太空。③从地球到月球，再到火星，“中国红”正成为一抹耀眼的亮色，在太空中熠熠生辉。④它属于每一位志在踏上探索太空新征程的中国人，它将一直在浩瀚的太空中指导着中国人砥砺奋进的方向。\nA. 句①“如果奇迹有颜色，那一定是逐梦于星辰大海、飘扬在苍穹之上‘中国红’。”是假设关系复句。\nB. “星辰大海”“熠熠生辉”“探索太空”短语类型各不相同。\nC. 句②中“一面面鲜艳的五星红旗跟随大国重器奔向深邃而广袤的太空”的主干是“五星红旗跟随大国重器”。\nD. 句④中画横线的句子有语病，可将“指导”改为“指引”。","confidence":0.95,"issues":[],"answer":"C","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"C","batch":"三 语法辨析","section":"语法辨析（二）"},{"id":"01","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":33,"print_page":29,"type":"语法辨析","stem":"（葫芦岛连山一模）下列各项中分析不正确的一项是（　　）\n①当来自东方的神话故事《哪吒 2》叩开海外观众的心门时，文化磁场迸发出了超乎想象的吸引力！②影片中的自我认同、命运抗争、亲情友情，这些全人类共同的情感经验超越了观众在文化背景上的差异，中国本土的传统故事最终获得了全球性的情感价值。③《哪吒 2》成功在于既关注全人类共同情感体验，也凸显中华民族自身文化底蕴和审美意趣，自信地展示水墨山川、传统乐器、古典建筑等中国元素。④文化自信是成功的另一关键要素，文化自信，少不了国家的扶持，更离不开创作者的努力。","stem_plain":"（葫芦岛连山一模）下列各项中分析不正确的一项是（　　）\n①当来自东方的神话故事《哪吒 2》叩开海外观众的心门时，文化磁场迸发出了超乎想象的吸引力！②影片中的自我认同、命运抗争、亲情友情，这些全人类共同的情感经验超越了观众在文化背景上的差异，中国本土的传统故事最终获得了全球性的情感价值。③《哪吒 2》成功在于既关注全人类共同情感体验，也凸显中华民族自身文化底蕴和审美意趣，自信地展示水墨山川、传统乐器、古典建筑等中国元素。④文化自信是成功的另一关键要素，文化自信，少不了国家的扶持，更离不开创作者的努力。","options":[{"key":"A","text":"“文化磁场”“亲情友情”和“古典建筑”三个短语的结构类型各不相同。","plain":"“文化磁场”“亲情友情”和“古典建筑”三个短语的结构类型各不相同。"},{"key":"B","text":"句②中“中国本土的传统故事最终获得了全球性的情感价值”的主干是“故事获得价值”。","plain":"句②中“中国本土的传统故事最终获得了全球性的情感价值”的主干是“故事获得价值”。"},{"key":"C","text":"句③用“既……也……”连接前后两个分句，分句之间是并列关系，无主次之分。","plain":"句③用“既……也……”连接前后两个分句，分句之间是并列关系，无主次之分。"},{"key":"D","text":"句④是病句，修改方法是把句子中的“国家的扶持”与“创作者的努力”调换位置。","plain":"句④是病句，修改方法是把句子中的“国家的扶持”与“创作者的努力”调换位置。"}],"annotations":[],"sub_questions":[],"raw_text":"（葫芦岛连山一模）下列各项中分析不正确的一项是（　　）\n①当来自东方的神话故事《哪吒 2》叩开海外观众的心门时，文化磁场迸发出了超乎想象的吸引力！②影片中的自我认同、命运抗争、亲情友情，这些全人类共同的情感经验超越了观众在文化背景上的差异，中国本土的传统故事最终获得了全球性的情感价值。③《哪吒 2》成功在于既关注全人类共同情感体验，也凸显中华民族自身文化底蕴和审美意趣，自信地展示水墨山川、传统乐器、古典建筑等中国元素。④文化自信是成功的另一关键要素，文化自信，少不了国家的扶持，更离不开创作者的努力。\nA. “文化磁场”“亲情友情”和“古典建筑”三个短语的结构类型各不相同。\nB. 句②中“中国本土的传统故事最终获得了全球性的情感价值”的主干是“故事获得价值”。\nC. 句③用“既……也……”连接前后两个分句，分句之间是并列关系，无主次之分。\nD. 句④是病句，修改方法是把句子中的“国家的扶持”与“创作者的努力”调换位置。","confidence":0.95,"issues":[],"answer":"A","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"", 清幽古朴的图画。③一路上，古树擎起的巨伞，遮天蔽日；野花点缀的碧毯，绵延千里。④阵阵山风不仅送来幽幽鸟鸣，更将整个山林的芬芳都沁透在流动的空气中。\nA. “翠青”和“曲折”都是形容词，“历经沧桑”和“遮天蔽日”都是动宾短语。\nB. 句②中画线处的标点符号使用有误，“石桥”和“水榭”之间的顿号应改为逗号。\nC. 句③中“野花点缀的碧毯，绵延千里”这个句子的主语是“野花”，谓语是“绵延”。\nD. 句④中前后两个分句用“不仅……更……”连接，表示二者之间是递进关系。","confidence":0.95,"issues":[],"answer":"D","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"D","batch":"三 语法辨析","section":"语法辨析（三）"},{"id":"06","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":34,"print_page":30,"type":"语法辨析","stem":"（沈阳浑南二模）下列各项中分析正确的一项是（　　）\n①我们常常高估一天之内能完成的事情，也低估了一年的时间可以带来的改变。②那些原地踏步的人，总觉得自己还没有准备好，结果迟迟抓不住机会；而那些走得更远的人，早已迈出行动的第一步。③即使每天只走一小步，经过积累，也能变成向前的一大步。④当你愿意离开舒适圈，主动挑战未知。当你不再害怕失败，能在一次次的反馈中习得经验，改变就已经发生了。","stem_plain":"（沈阳浑南二模）下列各项中分析正确的一项是（　　）\n①我们常常高估一天之内能完成的事情，也低估了一年的时间可以带来的改变。②那些原地踏步的人，总觉得自己还没有准备好，结果迟迟抓不住机会；而那些走得更远的人，早已迈出行动的第一步。③即使每天只走一小步，经过积累，也能变成向前的一大步。④当你愿意离开舒适圈，主动挑战未知。当你不再害怕失败，能在一次次的反馈中习得经验，改变就已经发生了。","options":[{"key":"A","text":"“走得更远”“离开舒适圈”“习得经验”三个短语的结构类型相同。","plain":"“走得更远”“离开舒适圈”“习得经验”三个短语的结构类型相同。"},{"key":"B","text":"句①中加点的“我们”是代词，“常常”和“能”是副词，“低估”是动词。","plain":"句①中加点的“我们”是代词，“常常”和“能”是副词，“低估”是动词。"},{"key":"C","text":"句③是条件关系复句。","plain":"句③是条件关系复句。"},{"key":"D","text":"句④画线句的标点符号使用不当，应将句中的“。”改为“；”。","plain":"句④画线句的标点符号使用不当，应将句中的“。”改为“；”。"}],"annotations":[],"sub_questions":[],"raw_text":"（沈阳浑南二模）下列各项中分析正确的一项是（　　）\n①我们常常高估一天之内能完成的事情，也低估了一年的时间可以带来的改变。②那些原地踏步的人，总觉得自己还没有准备好，结果迟迟抓不住机会；而那些走得更远的人，早已迈出行动的第一步。③即使每天只走一小步，经过积累，也能变成向前的一大步。④当你愿意离开舒适圈，主动挑战未知。当你不再害怕失败，能在一次次的反馈中习得经验，改变就已经发生了。\nA. “走得更远”“离开舒适圈”“习得经验”三个短语的结构类型相同。\nB. 句①中加点的“我们”是代词，“常常”和“能”是副词，“低估”是动词。\nC. 句③是条件关系复句。\nD. 句④画线句的标点符号使用不当，应将句中的“。”改为“；”。","confidence":0.95,"issues":[],"answer":"D","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"D","bat 联、端午赛龙舟，这些习俗在代代传承中焕发着生机。③虽然现代生活方式不断变化，但这些传统活动依然深受人们喜爱。④通过参与这些活动，人们能够深刻感受到中华文化的独特韵味。","options":[{"key":"A","text":"“文化记忆”“生活方式”“独特韵味”三个短语的结构类型各不相同。","plain":"“文化记忆”“生活方式”“独特韵味”三个短语的结构类型各不相同。"},{"key":"B","text":"句②的主干是“春节贴春联、端午赛龙舟焕发生机”。","plain":"句②的主干是“春节贴春联、端午赛龙舟焕发生机”。"},{"key":"C","text":"句③用“但”连接前后分句，分句之间是转折关系，强调后句的重要性。","plain":"句③用“但”连接前后分句，分句之间是转折关系，强调后句的重要性。"},{"key":"D","text":"句④是病句，修改方法是将“通过”删去。","plain":"句④是病句，修改方法是将“通过”删去。"}],"annotations":[],"sub_questions":[],"raw_text":"（沈阳沈河一模）下列各项中分析正确的一项是（　　）\n①传统节日的魅力不仅在于其悠久的历史，更在于它承载的文化记忆与情感共鸣。②春节贴春联、端午赛龙舟，这些习俗在代代传承中焕发着生机。③虽然现代生活方式不断变化，但这些传统活动依然深受人们喜爱。④通过参与这些活动，人们能够深刻感受到中华文化的独特韵味。\nA. “文化记忆”“生活方式”“独特韵味”三个短语的结构类型各不相同。\nB. 句②的主干是“春节贴春联、端午赛龙舟焕发生机”。\nC. 句③用“但”连接前后分句，分句之间是转折关系，强调后句的重要性。\nD. 句④是病句，修改方法是将“通过”删去。","confidence":0.95,"issues":[],"answer":"C","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"C","batch":"三 语法辨析","section":"语法辨析（三）"},{"id":"09","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":35,"print_page":31,"type":"语法辨析","stem":"（沈阳沈河二模）下列各项中分析不正确的一项是（　　）\n①传统手工艺是中华文化的瑰宝，民族智慧的结晶。②匠人们以匠心精神守护技艺，不仅延续了古老的文化血脉，更为现代生活注入独特的美学价值。③每一件手工艺品都需经历选材、雕琢、打磨的漫长过程，唯有耐住寂寞、坚守初心，才能最终呈现令人惊叹的完美艺术形式。④这种精益求精的态度，既是手工艺传承的灵魂，也是当代青年需领悟的精神内核。","stem_plain":"（沈阳沈河二模）下列各项中分析不正确的一项是（　　）\n①传统手工艺是中华文化的瑰宝，民族智慧的结晶。②匠人们以匠心精神守护技艺，不仅延续了古老的文化血脉，更为现代生活注入独特的美学价值。③每一件手工艺品都需经历选材、雕琢、打磨的漫长过程，唯有耐住寂寞、坚守初心，才能最终呈现令人惊叹的完美艺术形式。④这种精益求精的态度，既是手工艺传承的灵魂，也是当代青年需领悟的精神内核。","options":[{"key":"A","text":"“匠心精神”“坚守初心”“传承的灵魂”三个短语的类型各不相同。","plain":"“匠心精神”“坚守初心”“传承的灵魂”三个短语的类型各不相同。"},{"key":"B","text":"句①标点符号使用有错误，修改方法是将“瑰宝”后的逗号换成顿号。","plain":"句①标点符号使用有错误，修改方法是将“瑰宝”后的逗号换成顿号。"},{"key":"C","text":"从句②中的“不仅……更……”可以看出，两个分句之间是递进关系。","plain":"从句②中的“不仅……更……”可以看出，两个分句之间是递进关系。"},{"key":"D","text":"“这一态度，恰是青年传承文化、重塑价值的根基。”这句话适合接在句④后。","plain":"“这一态度，恰是青年传承文化、重塑价值的根基。”这句话适合接在句④后。"}],"annotations":[],"sub_questions":[],"raw_text":"（沈阳沈河二模）下列各项中分析不正确的一项是（　　）\n①传统手工艺是中华文化的瑰宝，民族智慧的结晶。②匠人们以匠心精神守护技艺，不仅延续了古老的文化血脉，更为现代生活注入独特的美学价值。③每一件手工艺品都需经历选材、雕琢、打磨的漫长过程，唯有耐住寂寞、坚守初心，才能最终呈现令人惊叹的完美艺术形式。④这种精益求精的态度，既是手工艺传承的灵魂，也是当代青年需领悟的精神内核。\nA. “匠心精神”“坚守初心”“传承的灵魂”三个短语的类型各不相同。\nB. 句①标点符号使用有错误，修改方法是将“瑰宝”后的逗号换成顿号。\nC. 从句②中的“不仅……更……”可以看出，两个分句之间是递进关系。\nD. “这一态度，恰是青年传承文化、重塑价值的根基。”这句话适合接在句④后。","confidence":0.95,"issues":[],"answer":"A","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"A","batch":"三 语法辨析","section":"语法辨析（三）"},{"id":"10","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":35,"print_page":31,"type":"语法辨析","stem":"（沈阳铁西二模）下列各项中分析正确的一项是（　　）\n①许多人在面对他人的成功时，往往会产生羡慕或嫉妒的情绪。②我们常常忽视了一个事实：成功的背后，是无数个不为人知的努力与付出。③人生的道路上，我们无法控制很多事情，但我们可以掌控自己的态度和行动。④不能决定太阳几点升起，但可以决定自己几点起床□不能控制生命的长度，但可以增加生命的宽度。⑤与其羡慕他人的成功，不如将这份情绪转化为奋斗的动力。","stem_plain":"（沈阳铁西二模）下列各项中分析正确的一项是（　　）\n①许多人在面对他人的成功时，往往会产生羡慕或嫉妒的情绪。②我们常常忽视了一个事实：成功的背后，是无数个不为人知的努力与付出。③人生的道路上，我们无法控制很多事情，但我们可以掌控自己的态度和行动。④不能决定太阳几点升起，但可以决定自己几点起床□不能控制生命的长度，但可以增加生命的宽度。⑤与其羡慕他人的成功，不如将这份情绪转化为奋斗的动力。","options":[{"key":"A","text":"“常常忽视”“态度和行动”“生命的长度”三个短语的结构类型各不相同。","plain":"“常常忽视”“态度和行动”“生命的长度”三个短语的结构类型各不相同。"},{"key":"B","text":"句①是病句，修改方法是将“许多人”和“在面对他人的成功时”调换顺序。","plain":"句①是病句，修改方法是将“许多人”和“在面对他人的成功时”调换顺序。"},{"key":"C","text":"句②中“成功的背后，是无数个不为人知的努力与付出”的主干是“成功是努力与付出”。","plain":"句②中“成功的背后，是无数个不为人知的努力与付出”的主干是“成功是努力与付出”。"},{"key":"D","text":"句④方框处的标点应填分号，句⑤是表示选择关系的复句。","plain":"句④方框处的标点应填分号，句⑤是表示选择关系的复句。"}],"annotations":[],"sub_questions":[],"raw_text":"（沈阳铁西二模）下列各项中分析正确的一项是（　　）\n①许多人在面对他人的成功时，往往会产生羡慕或嫉妒的情绪。②我们常常忽视了一个事实：成功的背后，是无数个不为人知的努力与付出。③人生的道路上，我们无法控制很多事情，但我们可以掌控自己的态度和行动。④不能决定太阳几点升起，但可以决定自己几点起床□不能控制生命的长度，但可以增加生命的宽度。⑤与其羡慕他人的成功，不如将这份情绪转化为奋斗的动力。\nA. “常常忽视”“态度和行动”“生命的长度”三个短语的结构类型各不相同。\nB. 句①是病句，修改方法是将“许多人”和“在面对他人的成功时”调换顺序。\nC. 句②中“成功的背后，是无数个不为人知的努力与付出”的主干是“成功是努力与付出”。\nD. 句④方框处的标点应填分号，句⑤是表示选择关系的复句。","confidence":0.95,"issues":[],"answer":"D","answ ”作定语，“巢房”作宾语。"},{"key":"C","text":"句③是病句，应把“铺展”与“伸展”调换位置。","plain":"句③是病句，应把“铺展”与“伸展”调换位置。"},{"key":"D","text":"“小河是系在村庄胸前的绸带，更是大地的血脉。”是并列关系复句。","plain":"“小河是系在村庄胸前的绸带，更是大地的血脉。”是并列关系复句。"}],"annotations":[],"sub_questions":[],"raw_text":"（铁岭市级三模）下列各项中分析正确的一项是（　　）\n①北方四季分明，春天的风吹向大地，万物复苏。春风边走边为大地褪去寒衣，然后挥画笔，尽情点染，直至春色满园。②白天在野外觅食的燕子傍晚打扫干净亲手营造的巢房。③麦田脱去叶片上的灰白，铺展开蜷缩的腰肢，将深绿色在田野里伸展。④野花就这样装点了乡村的大地。流水潺潺，小河是系在村庄胸前的绸带，更是大地的血脉。\nA. “万物复苏”“褪去寒衣”“春色满园”“挥舞画笔”四个短语的结构类型各不相同。\nB. 句②中，“燕子”作主语，“干净”作定语，“巢房”作宾语。\nC. 句③是病句，应把“铺展”与“伸展”调换位置。\nD. “小河是系在村庄胸前的绸带，更是大地的血脉。”是并列关系复句。","confidence":0.95,"issues":[],"answer":"C","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"C","batch":"三 语法辨析","section":"语法辨析（四）"},{"id":"06","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":38,"print_page":34,"type":"语法辨析","stem":"（朝阳凌源三模）下列各项中分析正确的一项是（　　）\n①据国家卫生健康委统计，超九成老年人倾向选择居家养老。②当前，我国已步入中度老龄化社会，老龄化规模大、程度深、速度快。③扩大社区养老服务有效供给，可以为居家养老提供有力支持。④作为家庭之外的基本社会单元，以及多数老人的日常居住、活动场所，社区是养老的重要一环，与老年人的晚年生活质量紧密关系。","stem_plain":"（朝阳凌源三模）下列各项中分析正确的一项是（　　）\n①据国家卫生健康委统计，超九成老年人倾向选择居家养老。②当前，我国已步入中度老龄化社会，老龄化规模大、程度深、速度快。③扩大社区养老服务有效供给，可以为居家养老提供有力支持。④作为家庭之外的基本社会单元，以及多数老人的日常居住、活动场所，社区是养老的重要一环，与老年人的晚年生活质量紧密关系。","options":[{"key":"A","text":"“程度深”“有效供给”“家庭之外”都是偏正短语。","plain":"“程度深”“有效供给”“家庭之外”都是偏正短语。"},{"key":"B","text":"句③属于单句，句子主干是“供给提供支持”。","plain":"句③属于单句，句子主干是“供给提供支持”。"},{"key":"C","text":"句④有语病，应该把“质量”改为“条件”。","plain":"句④有语病，应该把“质量”改为“条件”。"},{"key":"D","text":"此语段顺序有误，正确排列顺序为②①④③。","plain":"此语段顺序有误，正确排列顺序为②①④③。"}],"annotations":[],"sub_questions":[],"raw_text":"（朝阳凌源三模）下列各项中分析正确的一项是（　　）\n①据国家卫生健康委统计，超九成老年人倾向选择居家养老。②当前，我国已步入中度老龄化社会，老龄化规模大、程度深、速度快。③扩大社区养老服务有效供给，可以为居家养老提供有力支持。④作为家庭之外的基本社会单元，以及多数老人的日常居住、活动场所，社区是养老的重要一环，与老年人的晚年生活质量紧密关系。\nA. “程度深”“有效供给”“家庭之外”都是偏正短语。\nB. 句③属于单句，句子主干是“供给提供支持”。\nC. 句④有语病，应该把“质量”改为“条件”。\nD. 此语段顺序有误，正确排列顺序为②①④③。","confidence":0.95,"issues":[],"answer":"D","ans 风的绵纸，也有用绫、绢的。④“绘”赋予风筝丰富的内涵，而“扎”和“糊”是古人探索机械原理和技术应用。⑤神话故事、花鸟瑞兽是传统风筝最常见的绘画题材。⑥小小的风筝，承载的不仅是飞翔的梦想，还有对五谷丰登的美好祈盼，对亲朋好友平安康泰的真诚祝福。","stem_plain":"（铁岭县一模）下列各项中分析正确的一项是（　　）\n①作为我国非物质文化遗产之一的风筝，其制作工艺有三大环节，即扎、糊、绘。②扎骨架最为关键，骨架扎不好，风筝便无法飞起。③糊风筝多用坚韧受风的绵纸，也有用绫、绢的。④“绘”赋予风筝丰富的内涵，而“扎”和“糊”是古人探索机械原理和技术应用。⑤神话故事、花鸟瑞兽是传统风筝最常见的绘画题材。⑥小小的风筝，承载的不仅是飞翔的梦想，还有对五谷丰登的美好祈盼，对亲朋好友平安康泰的真诚祝福。","options":[{"key":"A","text":"“文化遗产”“五谷丰登”“真诚祝福”三个短语都是偏正短语。","plain":"“文化遗产”“五谷丰登”“真诚祝福”三个短语都是偏正短语。"},{"key":"B","text":"句⑤的句子主干是“故事、瑞兽是常见的题材”。","plain":"句⑤的句子主干是“故事、瑞兽是常见的题材”。"},{"key":"C","text":"句④画线部分的修改方法是在“探索机械原理和技术应用”后加“的体现”。","plain":"句④画线部分的修改方法是在“探索机械原理和技术应用”后加“的体现”。"},{"key":"D","text":"句⑥是表示并列关系的复句。","plain":"句⑥是表示并列关系的复句。"}],"annotations":[],"sub_questions":[],"raw_text":"（铁岭县一模）下列各项中分析正确的一项是（　　）\n①作为我国非物质文化遗产之一的风筝，其制作工艺有三大环节，即扎、糊、绘。②扎骨架最为关键，骨架扎不好，风筝便无法飞起。③糊风筝多用坚韧受风的绵纸，也有用绫、绢的。④“绘”赋予风筝丰富的内涵，而“扎”和“糊”是古人探索机械原理和技术应用。⑤神话故事、花鸟瑞兽是传统风筝最常见的绘画题材。⑥小小的风筝，承载的不仅是飞翔的梦想，还有对五谷丰登的美好祈盼，对亲朋好友平安康泰的真诚祝福。\nA. “文化遗产”“五谷丰登”“真诚祝福”三个短语都是偏正短语。\nB. 句⑤的句子主干是“故事、瑞兽是常见的题材”。\nC. 句④画线部分的修改方法是在“探索机械原理和技术应用”后加“的体现”。\nD. 句⑥是表示并列关系的复句。","confidence":0.95,"issues":[],"answer":"C","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"C","batch":"三 语法辨析","section":"语法辨析（四）"},{"id":"09","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":39,"print_page":35,"type":"语法辨析","stem":"（营口市级二模）下列各项中分析正确的一项是（　　）\n①人类对待自然的正确态度，不是征服与破坏，而是尊重与保护。②随着化学生态学的发展，人类正逐步解码植物王国的“社交密码”。③或许有一天，人类能够精准识别植物间的语言，听懂它们的“悄悄话”，了解它们成长丰产的需求，进而为它们遮风挡雨。④当这些“聊天记录”终于被破译时，我们就会获得打开自然界宝库的“金钥匙”。","stem_plain":"（营口市级二模）下列各项中分析正确的一项是（　　）\n①人类对待自然的正确态度，不是征服与破坏，而是尊重与保护。②随着化学生态学的发展，人类正逐步解码植物王国的“社交密码”。③或许有一天，人类能够精准识别植物间的语言，听懂它们的“悄悄话”，了解它们成长丰产的需求，进而为它们遮风挡雨。④当这些“聊天记录”终于被破译时，我们就会获得打开自然界宝库的“金钥匙”。","options":[{"key":"A","text":"文中加点的“尊重”是动词，“逐步”是副词，“精准识别”“遮风挡雨”短语类型相同。","plain":"文中加点的“尊重”是动词，“逐步”是副词，“精准识别”“遮风挡雨”短语类型相同。"},{"key":"B","text":"句①中前后两个分句用“不是……而是……”连接，表示二者之间是转折关系。","plain":"句①中前后两个分句用“不是……而是……”连接，表示二者之间是转折关系。"},{"key":"C","text":"句③存在语病，应该将“了解它们成长丰产的需求”中的“了解”改为“提升”。","plain":"句③存在语病，应该将“了解它们成长丰产的需求”中的“了解”改为“提升”。"},{"key":"D","text":"句④主干是“我们获得‘金钥匙’”，其中，“打开自然界宝库的”作定语。","plain":"句④主干是“我们获得‘金钥匙’”，其中，“打开自然界宝库的”作定语。"}],"annotations":[],"sub_questions":[],"raw_text":"（营口市级二模）下列各项中分析正确的一项是（　　）\n①人类对待自然的正确态度，不是征服与破坏，而是尊重与保护。②随着化学生态学的发展，人类正逐步解码植物王国的“社交密码”。③或许有一天，人类能够精准识别植物间的语言，听懂它们的“悄悄话”，了解它们成长丰产的需求，进而为它们遮风挡雨。④当这些“聊天记录”终于被破译时，我们就会获得打开自然界宝库的“金钥匙”。\nA. 文中加点的“尊重”是动词，“逐步”是副词，“精准识别”“遮风挡雨”短语类型相同。\nB. 句①中前后两个分句用“不是……而是……”连接，表示二者之间是转折关系。\nC. 句③存在语病，应该将“了解它们成长丰产的需求”中的“了解”改为“提升”。\nD. 句④主干是“我们获得‘金钥匙’”，其中，“打开自然界宝库的”作定语。","confidence":0.95,"issues":[],"answer":"D","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"D","batch":"三 语法辨析","section":"语法辨析（四）"},{"id":"10","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":39,"print_page":35,"type":"语法辨析","stem":"（辽阳市级一模）下列各项中分析正确的一项是（　　）\n①文学世界里的情感流淌，既有蓬勃如夏日的坦荡，也有静默如秋叶的迂回。②少年笔下的文字常似锋芒毕露的剑光，裹挟着对理想的热忱，将喜怒哀乐化作燎原星火；而老练的作家更愿以“庭前花开花落”的淡笔，让思绪在时光的褶皱间徘徊，把汹涌心潮藏进一片落叶的纹路。③人们既推崇《离骚》中原原投江明志的壮烈，也惊叹于苏轼“一蓑烟雨任平生”的含蓄——前者是沥尽心血的呐喊，后者是举重若轻的留白。④可见，文无定法，情感只有如赤子般真挚，文字才能真正穿透岁月的铜墙铁壁。","stem_plain":"（辽阳市级一模）下列各项中分析正确的一项是（　　）\n①文学世界里的情感流淌，既有蓬勃如夏日的坦荡，也有静默如秋叶的迂回。②少年笔下的文字常似锋芒毕露的剑光，裹挟着对理想的热忱，将喜怒哀乐化作燎原星火；而老练的作家更愿以“庭前花开花落”的淡笔，让思绪在时光的褶皱间徘徊，把汹涌心潮藏进一片落叶的纹路。③人们既推崇《离骚》中原原投江明志的壮烈，也惊叹于苏轼“一蓑烟雨任平生”的含蓄——前者是沥尽心血的呐喊，后者是举重若轻的留白。④可见，文无定法，情感只有如赤子般真挚，文字才能真正穿透岁月的铜墙铁壁。","options":[{"key":"A","text":"句①中前后两个分句用“既有……也有……”连接，表示二者之间是递进关系。","plain":"句①中前后两个分句用“既有……也有……”连接，表示二者之间是递进关系。"},{"key":"B","text":"“锋芒毕露”“燎原星火”“沥尽心血”三个短语类型各不相同。","plain":"“锋芒毕露”“燎原星火”“沥尽心血”三个短语类型各不相同。"},{"key":"C","text":"句③中有语病，修改为：前者是举重若轻的留白，后者是沥尽心血的呐喊。","plain":"句③中有语病，修改为：前者是举重若轻的留白，后者是沥尽心血的呐喊。"},{"key":"D","text":"句④中画线部分的句子主干是“文字穿透岁月”。","plain":"句④中画线部分的句子主干是“文字穿透岁月”。"}],"annotations":[],"sub_questions":[],"raw_text":"（辽阳市级一模）下列各项中分析正确的一项是（　　）\n①文学世界里的情感流淌，既有蓬勃如夏日的坦荡，也有静默如秋叶的迂回。②少年笔下的文字常似锋芒毕露的剑光，裹挟着对理想的热忱，将喜怒哀乐化作燎原星火；而老练的作家更愿以“庭前花开花落”的淡笔，让思绪在时光的褶皱间徘徊，把汹涌心潮藏进一片落叶的纹路。③人们既推崇《离骚》中原原投江明志的壮烈，也惊叹于苏轼“一蓑烟雨任平生”的含蓄——前者是沥尽心血的呐喊，后者是举重若轻的留白。④可见，文无定法，情感只有如赤子般真挚，文字才能真正穿透岁月的铜墙铁壁。\nA. 句①中前后两个分句用“既有……也有……”连接，表示二者之间是递进关系。\nB. “锋芒毕露”“燎原星火”“沥尽心血”三个短语类型各不相同。\nC. 句③中有语病，修改为：前者是举重若轻的留白，后者是沥尽心血的呐喊。\nD. 句④中画线部分的句子主干是“文字穿透岁月”。","confidence":0.95,"issues":[],"answer":"B","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"B","batch":"三 语法辨析","section":"语法辨析（四）"},{"id":"11","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":40,"print_page":36,"type":"语法辨析","stem":"（鞍山立山三模）下列各项中分析正确的一项是（　　）\n阅读优秀的文学作品，对了解历史、了解社会、了解自然、了解人生的意义，是一件大有裨益的事情，文学作品对人的影响，是潜移默化的。阅读文学作品，是一种文化的累积，一种知识的累积，一种智慧的累积，一种感情的累积。能否大量地阅读优秀的文学作品，关系到一个人知识的极大丰富，素养的快速提升。如果对文学一无所知，而想成为有文化修养的现代文明人，那是不可想象的。有人说，一个从不阅读文学作品的人，纵然他有“硕士”“博士”或者更高的学位，他也只能是一个“高智慧”的野蛮人。这并不是危言耸听。亲近文学，阅读优秀的文学作品，是一个文明人增长知识、提高修养、丰富情感的极为重要的途径，这已经成为很多人的共识。","stem_plain":"（鞍山立山三模）下列各项中分析正确的一项是（　　）\n阅读优秀的文学作品，对了解历史、了解社会、了解自然、了解人生的意义，是一件大有裨益的事情，文学作品对人的影响，是潜移默化的。阅读文学作品，是一种文化的累积，一种知识的累积，一种智慧的累积，一种感情的累积。能否大量地阅读优秀的文学作品，关系到一个人知识的极大丰富，素养的快速提升。如果对文学一无所知，而想成为有文化修养的现代文明人，那是不可想象的。有人说，一个从不阅读文学作品的人，纵然他有“硕士”“博士”或者更高的学位，他也只能是一个“高智慧”的野蛮人。这并不是危言耸听。亲近文学，阅读优秀的文学作品，是一个文明人增长知识、提高修养、丰富情感的极为重要的途径，这已经成为很多人的共识。","options":[{"key":"A","text":"文中加点的“对”“那”“共识”依次是介词、代词、名词。“潜移默化”是并列短语，“亲近文学”是偏正短语。","plain":"文中加点的“对”“那”“共识”依次是介词、代词、名词。“潜移默化”是并列短语，“亲近文学”是偏正短语。"},{"key":"B","text":"“阅读优秀的文学作品，对了解历史、了解社会、了解自然、了解人生的意义，是一件大有裨益的事情。”该句的谓语是“大有裨益”。","plain":"“阅读优秀的文学作品，对了解历史、了解社会、了解自然、了解人生的意义，是一件大有裨益的事情。”该句的谓语是“大有裨益”。"},{"key":"C","text":"画线句有语病，修改方法是把“能否”去掉。","plain":"画线句有语病，修改方法是把“能否”去掉。"},{"key":"D","text":"“一个从不阅读文学作品的人，即使他有‘硕士’‘博士’或者更高的学位，他也只能是一个‘高智慧’的野蛮人。”这个句子是条件关系的复句。","plain":"“一个从不阅读文学作品的人，即使他有‘硕士’‘博士’或者更高的学位，他也只能是一个‘高智慧’的野蛮人。”这个句子是条件关系的复句。"}],"annotations":[],"sub_questions":[],"raw_text":"（鞍山立山三模）下列各项中分析正确的一项是（　　）\n阅读优秀的文学作品，对了解历史、了解社会、了解自然、了解人生的意义，是一件大有裨益的事情，文学作品对人的影响，是潜移默化的。阅读文学作品，是一种文化的累积，一种知识的累积，一种智慧的累积，一种感情的累积。能否大量地阅读优秀的文学作品，关系到一个人知识的极大丰富，素养的快速提升。如果对文学一无所知，而想成为有文化修养的现代文明人，那是不可想象的。有人说，一个从不阅读文学作品的人，纵然他有“硕士”“博士”或者更高的学位，他也只能是一个“高智慧”的野蛮人。这并不是危言耸听。亲近文学，阅读优秀的文学作品，是一个文明人增长知识、提高修养、丰富情感的极为重要的途径，这已经成为很多人的共识。\nA. 文中加点的“对”“那”“共识”依次是介词、代词、名词。“潜移默化”是并列短语，“亲近文学”是偏正短语。\nB. “阅读优秀的文学作品，对了解历史、了解社会、了解自然、了解人生的意义，是一件大有裨益的事情。”该句的谓语是“大有裨益”。\nC. 画线句有语病，修改方法是把“能否”去掉。\nD. “一个从不阅读文学作品的人，即使他有‘硕士’‘博士’或者更高的学位，他也只能是一个‘高智慧’的野蛮人。”这个句子是条件关系的复句。","confidence":0.95,"issues":[],"answer":"C","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"C","batch":"三 语法辨析","section":"语法辨析（四）"},{"id":"12","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":40,"print_page":36,"type":"语法辨析","stem":"（鞍山铁东三模）下列各项中分析正确的一项是（　　）\n①一个博物馆就是一所学校。②大多数人逛博物馆的目的不仅是“打卡”看热闹，更是要获得知识。③博物馆的文物给人以直观、真实的感受，这是博物馆教育与学校教育不同的地方。④而要真正发挥文物藏品的价值引领，不仅需要考察其历史，还需要深入挖掘蕴含其中的精神内涵。","stem_plain":"（鞍山铁东三模）下列各项中分析正确的一项是（　　）\n①一个博物馆就是一所学校。②大多数人逛博物馆的目的不仅是“打卡”看热闹，更是要获得知识。③博物馆的文物给人以直观、真实的感受，这是博物馆教育与学校教育不同的地方。④而要真正发挥文物藏品的价值引领，不仅需要考察其历史，还需要深入挖掘蕴含其中的精神内涵。","options":[{"key":"A","text":"“一个博物馆”“获得知识”“学校教育”三个短语的结构类型是各不相同的。","plain":"“一个博物馆”“获得知识”“学校教育”三个短语的结构类型是各不相同的。"},{"key":"B","text":"句②中的前后两个分句用“不仅……更……”连接，表示二者之间是转折关系。","plain":"句②中的前后两个分句用“不仅……更……”连接，表示二者之间是转折关系。"},{"key":"C","text":"句③中“这是博物馆教育与学校教育不同的地方”的“这”指代的内容是“博物馆”。","plain":"句③中“这是博物馆教育与学校教育不同的地方”的“这”指代的内容是“博物馆”。"},{"key":"D","text":"句④是病句，修改方法是在“发挥文物藏品的价值引领”后加上“作用”一词。","plain":"句④是病句，修改方法是在“发挥文物藏品的价值引领”后加上“作用”一词。"}],"annotations":[],"sub_questions":[],"raw_text":"（鞍山铁东三模）下列各项中分析正确的一项是（　　）\n①一个博物馆就是一所学校。②大多数人逛博物馆的目的不仅是“打卡”看热闹，更是要获得知识。③博物馆的文物给人以直观、真实的感受，这是博物馆教育与学校教育不同的地方。④而要真正发挥文物藏品的价值引领，不仅需要考察其历史，还需要深入挖掘蕴含其中的精神内涵。\nA. “一个博物馆”“获得知识”“学校教育”三个短语的结构类型是各不相同的。\nB. 句②中的前后两个分句用“不仅……更……”连接，表示二者之间是转折关系。\nC. 句③中“这 _questions":[],"raw_text":"（鞍山市级一模）下列各项中表述不正确的一项是（　　）\nA. 郭沫若，原名郭开贞，作家、诗人、历史学家、古文字学家。代表作有诗集《女神》《星空》，历史剧《屈原》《虎符》《棠棣之花》等。我们学过他的诗《天上的街市》。\nB. 古时男子二十岁举行加冠（束发戴帽）仪式，表示已经成人。后人常用“冠”或“加冠”表示男子年已二十。《送东阳马生序》中的“既加冠”指已成年。\nC. 《骆驼祥子》中，祥子到曹先生家拉包月，想积攒一些钱再买车，但是曹先生因为被学生阮明陷害，被迫离开北平。也因为这件事，祥子被刘四爷勒索，积蓄一空。\nD. 《简·爱》中，简·爱拒绝了圣·约翰要简·爱嫁给他，并一同去印度传教的请求，毅然决定再去看望罗切斯特。回到桑菲尔德庄园后，简·爱不顾庄园已成废墟，罗切斯特受伤致残，最终和罗切斯特结婚，得到了理想的幸福生活。","confidence":0.95,"issues":[],"answer":"C","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"客观题·选项辨析","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"C","batch":"四 文学文化常识","section":"文学文化常识（一）"},{"id":"06","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":42,"print_page":38,"type":"文学文化常识","stem":"（鞍山市级二模）下列各项中表述不正确的一项是（　　）","stem_plain":"（鞍山市级二模）下列各项中表述不正确的一项是（　　）","options":[{"key":"A","text":"茅盾，原名沈德鸿，字雁冰，作家、社会活动家。代表作有小说《蚀》三部曲、《子夜》《林家铺子》《春蚕》等。我们学过他的散文《白杨礼赞》。","plain":"茅盾，原名沈德鸿，字雁冰，作家、社会活动家。代表作有小说《蚀》三部曲、《子夜》《林家铺子》《春蚕》等。我们学过他的散文《白杨礼赞》。"},{"key":"B","text":"稽首是古代的拜礼。行礼时，施礼者屈膝跪地，左手按右手，拱手于地，头至地。稽首礼常在臣拜见君王或皇帝时所用，后来拜天拜神，拜祖拜庙时也常用此大礼。《屈原》中的“稽首”就是古代的一种跪拜礼，叩头至地。","plain":"稽首是古代的拜礼。行礼时，施礼者屈膝跪地，左手按右手，拱手于地，头至地。稽首礼常在臣拜见君王或皇帝时所用，后来拜天拜神，拜祖拜庙时也常用此大礼。《屈原》中的“稽首”就是古代的一种跪拜礼，叩头至地。"},{"key":"C","text":"散文集《朝花夕拾》中，《父亲的病》重点回忆儿时为父亲求医治病的情景，描述了几位“名医”的行医态度、开方等种种表现，揭示了这些人巫医不分、故弄玄虚、勒索钱财、草菅人命的实质。","plain":"散文集《朝花夕拾》中，《父亲的病》重点回忆儿时为父亲求医治病的情景，描述了几位“名医”的行医态度、开方等种种表现，揭示了这些人巫医不分、故弄玄虚、勒索钱财、草菅人命的实质。"},{"key":"D","text":"《格列佛游记》尖锐而深刻地讽刺了 18 世纪上半叶的英国现实。如描写大人国的党派之争，他们以鞋跟高低划分阵营，“高跟党”和“低跟党”尔虞我诈，争权夺利。实际上，这是挖苦英国两个争斗不休的政党。","plain":"《格列佛游记》尖锐而深刻地讽刺了 18 世纪上半叶的英国现实。如描写大人国的党派之争，他们以鞋跟高低划分阵营，“高跟党”和“低跟党”尔虞我诈，争权夺利。实际上，这是挖苦英国两个争斗不休的政党。"}],"annotations":[],"sub_questions":[],"raw_text":"（鞍山市级二模）下列各项中表述不正确的一项是（　　）\nA. 茅盾，原名沈德鸿，字雁冰，作家、社会活动家。代表作有小说《蚀》三部曲、《子夜》《林家铺子》《春蚕》等。我们学过他的散文《白杨礼赞》。\nB. 稽首是古代的拜礼。行礼时，施礼者屈膝跪地，左手按右手，拱手于地，头至地。稽首礼常在臣拜见君王或皇帝时所用，后来拜天拜神，拜祖拜庙时也常用此大礼。《屈原》中的“稽首”就是古代的一种跪拜礼，叩头至地。\nC. 散文集《朝花夕拾》中，《父亲的病》重点回忆儿时为父亲求医治病的情景，描述了几位“名医”的行医态度、开方 。《西游记》中，女儿国一难中，唐僧面临情劫却说出“心生，种种魔生”，这种果断割舍与简·爱的选择异曲同工。简·爱用自尊实现跨越，唐僧以信仰完成超越，共同演绎了伏尔泰名言的真谛。","wrong_option_analysis":"","easy_mistake":"评分时按要点给分，言之成理即可。","proofread_note":"据官方答案册录入（示例式答案）","choice":null,"batch":"五 名著阅读","section":"名著阅读（三）"},{"id":"15","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":64,"print_page":60,"type":"名著阅读","stem":"（鞍山铁东三模）名著阅读。\n英雄不是从未被风雪压弯脊梁，而是每一次踉跄后，都能以更坚定的姿态迈向顶峰。在人类文学的星河中，无数经典作品塑造了直面困境的英雄形象。请选取下面一位英雄，结合相关情节，分析其英雄品质。\n彭德怀（《红星照耀中国》）　保尔（《钢铁是怎样炼成的》）　林冲（《水浒传》）","stem_plain":"（鞍山铁东三模）名著阅读。\n英雄不是从未被风雪压弯脊梁，而是每一次踉跄后，都能以更坚定的姿态迈向顶峰。在人类文学的星河中，无数经典作品塑造了直面困境的英雄形象。请选取下面一位英雄，结合相关情节，分析其英雄品质。\n彭德怀（《红星照耀中国》）　保尔（《钢铁是怎样炼成的》）　林冲（《水浒传》）","options":[],"annotations":[],"sub_questions":[],"raw_text":"（鞍山铁东三模）名著阅读。\n英雄不是从未被风雪压弯脊梁，而是每一次踉跄后，都能以更坚定的姿态迈向顶峰。在人类文学的星河中，无数经典作品塑造了直面困境的英雄形象。请选取下面一位英雄，结合相关情节，分析其英雄品质。\n彭德怀（《红星照耀中国》）　保尔（《钢铁是怎样炼成的》）　林冲（《水浒传》）","confidence":0.95,"issues":[],"answer":"示例答案见解析（开放题，答案不唯一）","answer_source":"《2026年新中考精准分类觉醒卷A（语文）答案》","exam_point":"名著阅读·情节概括与人物分析","explanation":"示例一：彭德怀出身贫苦，却坚定投身革命。反“围剿”战斗中，他带领装备简陋的红军，多次以弱胜强。面对物资匮乏，他与战士同吃野茶、穿草鞋，始终冲锋在前。他以坚定信念和卓越指挥，在困境中坚守革命道路，用行动诠释了不畏艰难、无私奉献的英雄品质。示例二：保尔在战场上浴血奋战身负重伤，在艰苦环境中修筑铁路，饱受饥饿与疾病折磨。即便全身瘫痪、双目失明，他仍以笔为武器坚持创作。他以钢铁般的意志，在一次次打击中奋起，展现了永不言弃、忠于理想的英雄气概。示例三：林冲遭高俅陷害，发配途中受尽屈辱仍隐忍求生。直至草料场被烧，性命难保之际，他终于爆发，手刃仇敌。上梁山后，他又力排众难，火并王伦。林冲从隐忍到反抗，在绝境中觉醒，彰显了逆境中抗争求存的英雄本色。","wrong_option_analysis":"","easy_mistake":"评分时按要点给分，言之成理即可。","proofread_note":"据官方答案册录入（示例式答案）","choice":null,"batch":"五 名著阅读","section":"名著阅读（三）"},{"id":"01","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":65,"print_page":61,"type":"古诗文默写","stem":"（辽宁中考真题）古诗文默写。\n（1）何当共剪西窗烛，________。（李商隐《夜雨寄北》）\n（2）东风不与周郎便，________。（杜牧《赤壁》）\n（3）________，千里共婵娟。（苏轼《水调歌头》）\n（4）一鼓作气，再而衰，________。（《曹刿论战》）\n（5）中国快速发展的交通、通讯事业，用速度重新定义时间，用科技不断改写空间，让王勃《送杜少府之任蜀州》中的“________，________”在生活中得到了越来越生动的诠释。","stem_plain":"（辽宁中考真题）古诗文默写。\n（1）何当共剪西窗烛，________。（李商隐《夜雨寄北》）\n（2）东风不与周郎便，________。（杜牧《赤壁》）\n（3）________，千里共婵娟。（苏轼《水调歌头》）\n（4）一鼓作气，再而衰，________。（《曹刿论战》）\n（5）中国快速发展的交通、通讯事业，用速度重新定义时间，用 ype":"诗词鉴赏","stem":"（本溪市级二模）下列对两首诗（词）的理解和分析不正确的一项是（　　）\n【甲】次北固山下　[唐]王湾\n客路青山外，行舟绿水前。\n潮平两岸阔，风正一帆悬。\n海日生残夜，江春入旧年。\n乡书何处达？归雁洛阳边。\n【乙】咸阳城西楼晚眺　[唐]许浑\n一上高城万里愁，蒹葭杨柳似汀洲。\n溪云初起日沉阁，山雨欲来风满楼。\n鸟下绿芜秦苑夕，蝉鸣黄叶汉宫秋。\n行人莫问当年事，故国东来渭水流。\n【注释】①汀洲：水中小洲。②溪、阁：指磻溪、慈福寺阁。③行人：过客，泛指古往今来征人游子。","stem_plain":"（本溪市级二模）下列对两首诗（词）的理解和分析不正确的一项是（　　）\n【甲】次北固山下　[唐]王湾\n客路青山外，行舟绿水前。\n潮平两岸阔，风正一帆悬。\n海日生残夜，江春入旧年。\n乡书何处达？归雁洛阳边。\n【乙】咸阳城西楼晚眺　[唐]许浑\n一上高城万里愁，蒹葭杨柳似汀洲。\n溪云初起日沉阁，山雨欲来风满楼。\n鸟下绿芜秦苑夕，蝉鸣黄叶汉宫秋。\n行人莫问当年事，故国东来渭水流。\n【注释】①汀洲：水中小洲。②溪、阁：指磻溪、慈福寺阁。③行人：过客，泛指古往今来征人游子。","options":[{"key":"A","text":"【甲】诗首联开篇点题，既交代了作者的行程，“客路”又暗含了旅途奔波之意。","plain":"【甲】诗首联开篇点题，既交代了作者的行程，“客路”又暗含了旅途奔波之意。"},{"key":"B","text":"【乙】诗颈联借助“鸟”“绿芜”“蝉”“黄叶”等景象，营造了荒凉破败的氛围。","plain":"【乙】诗颈联借助“鸟”“绿芜”“蝉”“黄叶”等景象，营造了荒凉破败的氛围。"},{"key":"C","text":"两诗作者的视野都很开阔，而且都采用虚实结合、以动衬静的手法描绘所见之景。","plain":"两诗作者的视野都很开阔，而且都采用虚实结合、以动衬静的手法描绘所见之景。"},{"key":"D","text":"乡愁是两诗的共同主题。【乙】诗还融入吊古之情，比【甲】诗的意境更为高远。","plain":"乡愁是两诗的共同主题。【乙】诗还融入吊古之情，比【甲】诗的意境更为高远。"}],"annotations":[],"sub_questions":[],"raw_text":"（本溪市级二模）下列对两首诗（词）的理解和分析不正确的一项是（　　）\n【甲】次北固山下　[唐]王湾\n客路青山外，行舟绿水前。\n潮平两岸阔，风正一帆悬。\n海日生残夜，江春入旧年。\n乡书何处达？归雁洛阳边。\n【乙】咸阳城西楼晚眺　[唐]许浑\n一上高城万里愁，蒹葭杨柳似汀洲。\n溪云初起日沉阁，山雨欲来风满楼。\n鸟下绿芜秦苑夕，蝉鸣黄叶汉宫秋。\n行人莫问当年事，故国东来渭水流。\n【注释】①汀洲：水中小洲。②溪、阁：指磻溪、慈福寺阁。③行人：过客，泛指古往今来征人游子。\nA. 【甲】诗首联开篇点题，既交代了作者的行程，“客路”又暗含了旅途奔波之意。\nB. 【乙】诗颈联借助“鸟”“绿芜”“蝉”“黄叶”等景象，营造了荒凉破败的氛围。\nC. 两诗作者的视野都很开阔，而且都采用虚实结合、以动衬静的手法描绘所见之景。\nD. 乡愁是两诗的共同主题。【乙】诗还融入吊古之情，比【甲】诗的意境更为高远。","confidence":0.95,"issues":[],"answer":"C","answer_source":"参考答案PDF《（原书未附答案册）》","exam_point":"诗词鉴赏·意象、手法与情感","explanation":"答案据《2026年新中考精准分类觉醒卷A（语文）答案》录入，解析详见原答案册。","wrong_option_analysis":"","easy_mistake":"","proofread_note":"已按官方答案册录入","choice":"C","batch":"七 诗词鉴赏","section":"诗词鉴赏（一）"},{"id":"02","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":73,"print_page":69,"type":"诗词鉴赏","stem":"（营口市级一模）下列对两首诗（词）的理解和分析不正确的一项是（　　）\n【甲】望岳　[唐]杜甫\n岱宗夫如何？齐鲁青未了。\n造化钟神秀，阴阳割昏晓。\n荡胸生曾云，决眦入归鸟。\n会当凌绝顶，一览众山小。\n【乙】行经华阴　[唐]崔颢\n岧峣太华俯咸京，天外三峰削不成。\n武帝祠前云欲散，仙人掌上雨初晴。\n河山北枕秦关险，驿路西连汉畤平。\n借问路旁名利客，何如此处学长 n（2）余谓非尔遐清适，不能受此六种。\n3. 用“/”给【乙】文画波浪线的句子断句（断两处）。\n数椽不饰绿树成林绮蔬盈圃\n4.【甲】【乙】两文的相同点是：内容上都描绘了（1）________、（2）________。不同点是：【甲】文开篇即运用类比手法，点明陋室不陋是因为住屋的人品德高尚；【乙】文则在段尾运用（3）________手法，点明屋主人不被尘世喧嚣所浸染是因为“（4）________”（用原文回答）。","confidence":0.95,"issues":[],"answer":"参考答案见解析","answer_source":"《2026年新中考精准分类觉醒卷A（语文）答案》","exam_point":"文言文阅读·实词、翻译、断句与文意","explanation":"1. D　2.（1）孔子说：有什么简陋的呢？（2）我认为如果不是尔遐内心宁静闲适，是不能欣赏到这六种雅趣的。　3. 数椽不饰/绿树成林/绮蔬盈圃　4.（1）居住环境（2）日常生活（3）对比（4）清虚简远","wrong_option_analysis":"","easy_mistake":"翻译需落实关键词，断句按语意切分。","proofread_note":"据官方答案册录入","choice":null,"batch":"八 文言文阅读","section":"文言文阅读（一）"},{"id":"02","source_pdf":"2026年新中考精准分类觉醒卷A（语文）.pdf","source_page":86,"print_page":82,"type":"文言文阅读","stem":"（盘锦兴隆台八校二模）\n【甲】水陆草木之花，可爱者甚蕃。晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。\n予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。噫！菊之爱，陶后鲜有闻。莲之爱，同予者何人？牡丹之爱，宜乎众矣。\n（选自周敦颐《爱莲说》）\n【乙】花之最不耐开，一开辄尽者，桂与玉兰是也；花之最能持久，愈开愈盛者，山茶、石榴是也。然石榴之久，犹不及山茶；榴叶经霜即脱，山茶戴雪而荣。则是此花也者具松柏之骨挟桃李之姿。历春夏秋冬如一日，殆草木而神仙者乎？又况种类极多，由浅红以至深红，无一不备。其浅也，如粉如脂，如美人之腮，如酒客之面；其深也，如朱如火，如猩猩之血，如鹤顶之珠。可谓极浅深浓淡之致，而无一毫遗憾者矣。得此花一二本，可抵群花数十本。惜乎予园仅同芥子，诸卉种就，不能再纳须弥①，仅取盆中小树，植于怪石之旁。\n（选自李渔《闲情偶寄》）\n【注释】①须弥：佛教指须弥山，后泛指大山。\n1. 下列句中加点词的意思相同的一项是（　　）\nA. 水陆草木之花　　其翼若垂天之云（《北冥有鱼》）\nB. 中通外直　　然则北通巫峡（《岳阳楼记》）\nC. 犹不及山茶　　若有作奸犯科及为忠善者（《出师表》）\nD. 得此花一二本　　既出，得其船（《桃花源记》）\n2. 把选文中画直线的句子翻译成现代汉语。\n（1）予独爱莲之出淤泥而不染，濯清涟而不妖。\n（2）可谓极浅深浓淡之致，而无一毫遗憾者矣。\n3. 用“/”给【乙】文画波浪线的句子断句（断两处）。\n则是此花也者具松柏之骨挟桃李之姿\n4.【甲】文采用（1）________的手法，借莲花表现作者（2）________的生活态度和对追名逐利的厌恶；【乙】文采用（3）________和比喻手法，突出山茶的（4）________的特点。（用自己的话概括回答）","stem_plain":"（盘锦兴隆台八校二模）\n【甲】水陆草木之花，可爱者甚蕃。晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。\n予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。噫！菊之爱，陶后鲜有闻。莲之爱，同予者何人？牡丹之爱，宜乎众矣。\n（选自周敦颐《爱莲说》）\n【乙】花之最不耐开，一开辄尽者，桂与玉兰是也；花之最能持久，愈开愈盛者，山茶、石榴是也。然石榴之久，犹不及山茶；榴叶经霜即脱，山茶戴雪而荣。则是此花也者具松柏之骨挟桃李之姿。历春夏秋冬如一日，殆草木而神仙者乎？又况种类极多，由浅红以至深红，无一不备。其浅也，如粉如脂，如美人之腮，如酒客之面；其深也，如朱如火，如猩猩之血，如鹤顶之珠。可谓极浅深浓淡之致，而无一毫遗憾者矣。得此花一二本，可抵群花数十本。惜乎予园仅同芥子，诸卉种就，不能再纳须弥①，仅取盆中小树，植于怪石之旁。\n（选自李渔《闲情偶寄》）\n【注释】①须弥：佛教指须弥山，后泛指大山。\n1. 下列句中 曰：“不出，火且尽。”遂与之俱出。盖余所至，比好游者尚不能十一②，然视其左右，来而记之者已少。盖其又深，则其至又加少矣。方是时，予之力尚足以入，火尚足以明也。既其出，则或咎其欲出者，而余亦悔其随之，而不得极③夫④游之乐也。\n于是余有叹焉。古人之观于天地、山川、草木、虫鱼、鸟兽，往往有得，以其求思之深而无不在也。夫夷以近，则游者众；险以远，则至者少。而世之奇伟、瑰怪，非常之观，常在于险远而人之所罕至焉故非有志者不能至也。有志矣，不随以止也，然力不足者，亦不能至也。有志与力，而又不随以怠，至于⑤幽暗昏惑⑥而无物以相⑦之，亦不能至也。然力足以至焉，于人为可讥，而在己为有悔；尽吾志也而不能至者，可以无悔矣，其孰能讥之乎？此余之所得也！\n（节选自王安石《游褒禅山记》）\n【注释】①窈（yǎo）然：深远幽暗的样子。②不能十一：不及十分之一。③极：尽，这里有尽情享受的意思。④夫：这。⑤至于：这里是抵达、到达的意思。⑥昏惑：迷乱。⑦相（xiàng）：帮助，辅助。\n1. 下列句中加点词的意思相同的一项是（　　）\nA. 遂至承天寺寻张怀民　　寻病终（《桃花源记》）\nB. 往往有得　　得之心而寓之酒也（《醉翁亭记》）\nC. 非常之观　　此则岳阳楼之大观也（《岳阳楼记》）\nD. 念无与为乐者　　今为宫室之美为之（《鱼我所欲也》）\n2. 把选文中画直线的句子翻译成现代汉语。\n（1）怀民亦未寝，相与步于中庭。\n（2）问其深，则其好游者不能穷也，谓之后洞。\n3. 用“/”给【乙】文画波浪线的句子断句（断两处）。\n常在于险远而人之所罕至焉故非有志者不能至也\n4. 两篇选文从体裁上看都属于（1）________，都蕴含着深刻的哲理思考。其中【甲】文作者通过描写（2）________的情景，表达微妙而复杂的情感；【乙】文通过探险经历，探讨了实现目标的条件是志向、（3）________和（4）________。","stem_plain":"（沈阳大东零模）\n【甲】元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。庭下如积水空明，水中藻、荇交横，盖竹柏影也。何夜无月？何处无竹柏？但少闲人如吾两人者耳。\n（选自苏轼《记承天寺夜游》）\n【乙】其下平旷，有泉侧出，而记游者甚众，所谓前洞也。由山以上五六里，有穴窈然①，入之甚寒，问其深，则其好游者不能穷也，谓之后洞。余与四人拥火以入，入之愈深，其进愈难，而其见愈奇。有怠而欲出者，曰：“不出，火且尽。”遂与之俱出。盖余所至，比好游者尚不能十一②，然视其左右，来而记之者已少。盖其又深，则其至又加少矣。方是时，予之力尚足以入，火尚足以明也。既其出，则或咎其欲出者，而余亦悔其随之，而不得极③夫④游之乐也。\n于是余有叹焉。古人之观于天地、山川、草木、虫鱼、鸟兽，往往有得，以其求思之深而无不在也。夫夷以近，则游者众；险以远，则至者少。而世之奇伟、瑰怪，非常之观，常在于险远而人之所罕至焉故非有志者不能至也。有志矣，不随以止也，然力不足者，亦不能至也。有志与力，而又不随以怠，至于⑤幽暗昏惑⑥而无物以相⑦之，亦不能至也。然力足以至焉，于人为可讥，而在己为有悔；尽吾志也而不能至者，可以无悔矣，其孰能讥之乎？此余之所得也！\n（节选自王安石《游褒禅山记》）\n【注释】①窈（yǎo）然：深远幽暗的样子。②不能十一：不及十分之一。③极：尽，这里有尽情享受的意思。④夫：这。⑤至于：这里是抵达、到达的意思。⑥昏惑：迷乱。⑦相（xiàng）：帮助，辅助。\n1. 下列句中加点词的意思相同的一项是（　　）\nA. 遂至承天寺寻张怀民　　寻病终（《桃花源记》）\nB. 往往有得　　得之心而寓之酒也（《醉翁亭记》）\nC. 非常之观　　此则岳阳楼之大观也（《岳阳楼记》）\nD. 念无与为乐者　　今为宫室之美为之（《鱼我所欲也》）\n2. 把选文中画直线的句子翻译成现代汉语。\n（1）怀民亦未寝，相与步于中庭。\n（2）问其深，则其好游者不能穷也，谓之后洞。\n3. 用“/”给【乙】文画波浪线的句子断句（断两处）。\n常在于险远而人之所罕至焉故非有志者不能至也\n4. 两篇选文从体裁上看都属于（1）________，都蕴含着深刻的哲理思考。其中【甲】文作者通过描写（2）________的情景，表达微妙而复杂的情感；【乙】文通过探险经历，探讨了实现目标的条件是志向、（3）________和（4）________。","options":[],"annotations":[],"sub_questions":[],"raw_text":"（沈阳大东零模）\n【甲】元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭 阳休之书》）\n【注释】①阳生大弟：即阳休之。大弟，对朋辈中年龄小于己者的亲切称呼。下面的“吾”是北朝文学家祖鸿勋。②比：近来。③经始：开始测量营建。④日华云实：此即美称各种花果。⑤葱蒨（qiàn）：草木苍翠、茂盛的样子。\n1. 下列句中加点词的意思相同的一项是（　　）\nA. 渔人甚异之　　览物之情，得无异乎（《岳阳楼记》）\nB. 仿佛若有光　　皆若空游无所依（《小石潭记》）\nC. 吾比以家贫亲老　　无从致书以观（《送东阳马生序》）\nD. 时还故郡　　故渔者歌曰（《三峡》）\n2. 把选文中画直线的句子翻译成现代汉语。\n（1）阡陌交通，鸡犬相闻。\n（2）家先有野舍于斯，而遭乱荒废，今复经始。\n3. 用“/”给【乙】文画波浪线的句子断句（断两处）。\n心悠悠以孤上身飘飘而将逝杳然不复自知在天地间矣\n4.【甲】【乙】两文都是中国古典文学中的美文佳作。请先概括两文“美”在哪里，再谈谈两文思想情感有何不同。","stem_plain":"（抚顺市级一模）\n【甲】晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。\n林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田、美池、桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。\n（节选自《桃花源记》）\n【乙】阳生大弟①：吾比②以家贫亲老，时还故郡。在本县之西界，有雕山焉。其处闲远，水石清丽，高岩四匝，良田数顷。家先有野舍于斯，而遭乱荒废，今复经始③。即石成基，凭林起栋。萝生映宇，泉流绕阶。月松风草，缘庭绮合；日华云实④，旁沼星罗。檐下流烟，共霄气而舒卷；园中桃李，杂松柏而葱蒨⑤。时一牵裳涉涧，负杖登峰。心悠悠以孤上身飘飘而将逝杳然不复自知在天地间矣。\n（节选自祖鸿勋《与阳休之书》）\n【注释】①阳生大弟：即阳休之。大弟，对朋辈中年龄小于己者的亲切称呼。下面的“吾”是北朝文学家祖鸿勋。②比：近来。③经始：开始测量营建。④日华云实：此即美称各种花果。⑤葱蒨（qiàn）：草木苍翠、茂盛的样子。\n1. 下列句中加点词的意思相同的一项是（　　）\nA. 渔人甚异之　　览物之情，得无异乎（《岳阳楼记》）\nB. 仿佛若有光　　皆若空游无所依（《小石潭记》）\nC. 吾比以家贫亲老　　无从致书以观（《送东阳马生序》）\nD. 时还故郡　　故渔者歌曰（《三峡》）\n2. 把选文中画直线的句子翻译成现代汉语。\n（1）阡陌交通，鸡犬相闻。\n（2）家先有野舍于斯，而遭乱荒废，今复经始。\n3. 用“/”给【乙】文画波浪线的句子断句（断两处）。\n心悠悠以孤上身飘飘而将逝杳然不复自知在天地间矣\n4.【甲】【乙】两文都是中国古典文学中的美文佳作。请先概括两文“美”在哪里，再谈谈两文思想情感有何不同。","options":[],"annotations":[],"sub_questions":[],"raw_text":"（抚顺市级一模）\n【甲】晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。\n林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田、美池、桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。\n（节选自《桃花源记》）\n【乙】阳生大弟①：吾比②以家贫亲老，时还故郡。在本县之西界，有雕山焉。其处闲远，水石清丽，高岩四匝，良田数顷。家先有野舍于斯，而遭乱荒废，今复经始③。即石成基，凭林起栋。萝生映宇，泉流绕阶。月松风草，缘庭绮合；日华云实④，旁沼星罗。檐下流烟，共霄气而舒卷；园中桃李，杂松柏而葱蒨⑤。时一牵裳涉涧，负杖登峰。心悠悠以孤上身飘飘而将逝杳然不复自知在天地间矣。\n（节选自祖鸿勋《与阳休之书》）\n【注释】①阳生大弟：即阳休之。大弟，对朋辈中年龄小于己者的亲切称呼。下面的“吾”是北朝文学家祖鸿勋。②比：近来。③经始：开始测量营建。④日华云实：此即美称各种花果。⑤葱蒨（qiàn）：草木苍翠、茂盛的样子。\n1. 下列句中加点词的意思相同的一项是（　　）\nA. 渔人甚异之　　览物之情，得无异乎（《岳阳楼记》）\nB. 仿佛若有光　　皆若空游无所依（《小石潭记》）\nC. 吾比以家贫亲老　　无从致书以观（《送东阳马生序》）\nD. 时还故郡　　故渔者歌曰（《三峡》）\n2. 把选文中画直线的句子翻译成现代汉语。\n（1）阡陌交通，鸡犬相闻。\n（2）家先有野舍于斯，而遭乱荒废，今复经始。\n3. 之叹，予不敢叹。”\n（节选自刘禹锡《说骥》）\n【注释】①唁（yàn）：这里是慰问之意。②微：此处指价格便宜。③翘陆：举足跳跃。④挝：用棍子敲打。⑤籋（niè）：通“蹑”，踏。⑥嘘吸：吐纳。⑦疠（lì）：疾疫。⑧踣（bó）：跌倒。⑨缗：古代计量单位。通常以一千文为一缗。⑩羖（gǔ）：黑色的公羊。⑪谡（sù）：起，起来。⑫矧（shěn）：况且，何况。\n1. 下列句中加点词的意思相同的一项是（　　）\nA. 马之千里者　　其翼若垂天之云（《北冥有鱼》）\nB. 一食或尽粟一石　　或异二者之为（《岳阳楼记》）\nC. 予洒然曰　　然侍卫之臣不懈于内（《出师表》）\nD. 予遂言曰　　遂与外人间隔（《桃花源记》）\n2. 把选文中画直线的句子翻译成现代汉语。\n（1）且欲与常马等不可得，安求其能千里也？\n（2）客有唁予以丧其宝，且讥其贸也微。\n3. 用“/”给【乙】文画波浪线的句子断句（断两处）。\n方之于士则八十其缗也不犹逾于五羖皮乎\n4.【甲】【乙】两文都以“说”为体裁，甲文的观点是（1）________，【乙】文的观点是（2）________，两文运用的共同写法是（3）________，表达的共同情感是（4）________。[（1）（2）处用原文回答，（3）（4）处用自己的话概括]","stem_plain":"（沈阳大东二模）\n【甲】世有伯乐，然后有千里马。千里马常有，而伯乐不常有。故虽有名马，祗辱于奴隶人之手，骈死于槽枥之间，不以千里称也。\n马之千里者，一食或尽粟一石。食马者不知其能千里而食也。是马也，虽有千里之能，食不饱，力不足，才美不外见，且欲与常马等不可得，安求其能千里也？\n策之不以其道，食之不能尽其材，鸣之而不能通其意，执策而临之，曰：“天下无马！”呜呼！其真无马邪？其真不知马也！\n（节选自《杂说》）\n【乙】客有唁①予以丧其宝，且讥其贸也微②。予洒然曰：“始予有是马也，予常马畜之。今予易是马也，彼宝马畜之。宝与常在所遇耳。且夫昔之翘陆③也，谓将蹄将啮，抵以挝④策，不知其籋⑤云耳。昔之嘘吸⑥也，谓为疵为疠⑦，投以药石，不知其喷玉耳。夫如是，则虽旷日历月，将至顿踣⑧，曾何宝之有焉？由是而言，方之于士则八十其缗⑨也不犹逾于五羖⑩皮乎？”客谡⑪而竦。予遂言曰：“马之德也，存乎形者也，可以目取，然犹为之若此。矧⑫德蕴于心者乎？斯从古之叹，予不敢叹。”\n（节选自刘禹锡《说骥》）\n【注释】①唁（yàn）：这里是慰问之意。②微：此处指价格便宜。③翘陆：举足跳跃。④挝：用棍子敲打。⑤籋（niè）：通“蹑”，踏。⑥嘘吸：吐纳。⑦疠（lì）：疾疫。⑧踣（bó）：跌倒。⑨缗：古代计量单位。通常以一千文为一缗。⑩羖（gǔ）：黑色的公羊。⑪谡（sù）：起，起来。⑫矧（shěn）：况且，何况。\n1. 下列句中加点词的意思相同的一项是（　　）\nA. 马之千里者　　其翼若垂天之云（《北冥有鱼》）\nB. 一食或尽粟一石　　或异二者之为（《岳阳楼记》）\nC. 予洒然曰　　然侍卫之臣不懈于内（《出师表》）\nD. 予遂言曰　　遂与外人间隔（《桃花源记》）\n2. 把选文中画直线的句子翻译成现代汉语。\n（1）且欲与常马等不可得，安求其能千里也？\n（2）客有唁予以丧其宝，且讥其贸也微。\n3. 用“/”给【乙】文画波浪线的句子断句（断两处）。\n方之于士则八十其缗也不犹逾于五羖皮乎\n4.【甲】【乙】两文都以“说”为体裁，甲文的观点是（1）________，【乙】文的观点是（2）________，两文运用的共同写法是（3）________，表达的共同情感是（4）________。[（1）（2）处用原文回答，（3）（4）处用自己的话概括]","options":[],"annotations":[],"sub_questions":[],"raw_text":"（沈阳大东二模）\n【甲】世有伯乐，然后有千里马。千里马常有，而伯乐不常有。故虽有名马，祗辱于奴隶人之手，骈死于槽枥之间，不以千里称也。\n马之千里者，一食或尽粟一石。食马者不知其能千里而食也。是马也，虽有千里之能，食不饱，力不足，才美不外见，且欲与常马等不可得，安求其能千里也？\n策之不以其道，食之不能尽其材，鸣之而不能通其意，执策而临之，曰：“天下无马！”呜呼！其真无马邪？其真不知马也！\n（节选自《杂说》）\n【乙】客有唁①予以丧其宝，且讥其贸也微②。予洒然曰：“始予有是马也，予常马畜之。今予易是马也，彼宝马畜之。宝与常在所遇耳。且夫昔之翘陆③也，谓将蹄将啮，抵以挝④策，不知其籋⑤云耳。昔之嘘吸⑥也，谓为疵为疠⑦，投以药石，不知其喷玉耳。夫如是，则虽旷日历月，将至顿踣⑧，曾何宝之有焉？由是而言，方之于士则八十其缗⑨也不犹逾于五羖⑩皮乎？”客谡⑪而竦。予遂言曰：“ ①，景公迎而贺之曰：“甚善矣！子之治东阿也。”晏子对曰：“前臣之治东阿也，属托不行，货赂不至，陂②池之鱼，以利贫民。当此之时，民无饥者，而君反以罪臣；今臣后之东阿也，属托行，货赂至，并曾赋敛，仓库少内③，便事左右，陂池之鱼，入于权家。当此之时，饥者过半矣，君乃反迎而贺。臣愚不能复治东阿，愿乞骸骨④，避贤者之路。”再拜便辟⑤。景公乃下席而谢之曰：“子强复治东阿；东阿者，子之东阿也，寡人无复与焉。”\n（节选自《说苑》）\n【注释】①上计：地方官年终将境内的户口、赋税、盗贼、狱讼等事项编造计簿，逐级上报。②陂（bēi）：池塘。③内：同“纳”，交纳。④乞骸骨：请求使骸骨归葬故乡，指古代官吏自请退职。⑤辟：同“避”，回避，退避。\n1. 下列句中加点词的意思相同的一项是（　　）\nA. 再拜便辟　　再而衰（《曹刿论战》）\nB. 虽欲言　　故虽有名马（《马说》）\nC. 时时而间进　　晏子治东阿三年，景公召而数之\nD. 皆以美于徐公　　吾以子为可\n2. 把选文中画直线的句子翻译成现代汉语。\n（1）令初下，群臣进谏，门庭若市。\n（2）今子治而乱，子退而自察也，寡人将加大诛于子。\n3. 用“/”给【乙】文画波浪线的句子断句（断两处）。\n臣请改道易行而治东阿三年不治臣请死之\n4.【甲】文中邹忌进谏齐王的方式是（1）________，其进谏的主要目的是（2）________；【乙】文中晏子进谏景公的方式是（3）________，其进谏的主要目的是让景公明辨是非，改变错误的评判标准。从【甲】【乙】两文来看，齐威王和齐景公在性格上的共同点是（4）________。","stem_plain":"（本溪市级三模）\n【甲】于是入朝见威王，曰：“臣诚知不如徐公美。臣之妻私臣，臣之妾畏臣，臣之客欲有求于臣，皆以美于徐公。今齐地方千里，百二十城，宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王：由此观之，王之蔽甚矣。”\n王曰：“善。”乃下令：“群臣吏民能面刺寡人之过者，受上赏；上书谏寡人者，受中赏；能谤讥于市朝，闻寡人之耳者，受下赏。”令初下，群臣进谏，门庭若市；数月之后，时时而间进；期年之后，虽欲言，无可进者。燕、赵、韩、魏闻之，皆朝于齐。此所谓战胜于朝廷。\n（节选自《邹忌讽齐王纳谏》）\n【乙】晏子治东阿三年，景公召而数之，曰：“吾以子为可，而使子治东阿，今子治而乱，子退而自察也，寡人将加大诛于子。”晏子对曰：“臣请改道易行而治东阿三年不治臣请死之。”景公许之。于是明年上计①，景公迎而贺之曰：“甚善矣！子之治东阿也。”晏子对曰：“前臣之治东阿也，属托不行，货赂不至，陂②池之鱼，以利贫民。当此之时，民无饥者，而君反以罪臣；今臣后之东阿也，属托行，货赂至，并曾赋敛，仓库少内③，便事左右，陂池之鱼，入于权家。当此之时，饥者过半矣，君乃反迎而贺。臣愚不能复治东阿，愿乞骸骨④，避贤者之路。”再拜便辟⑤。景公乃下席而谢之曰：“子强复治东阿；东阿者，子之东阿也，寡人无复与焉。”\n（节选自《说苑》）\n【注释】①上计：地方官年终将境内的户口、赋税、盗贼、狱讼等事项编造计簿，逐级上报。②陂（bēi）：池塘。③内：同“纳”，交纳。④乞骸骨：请求使骸骨归葬故乡，指古代官吏自请退职。⑤辟：同“避”，回避，退避。\n1. 下列句中加点词的意思相同的一项是（　　）\nA. 再拜便辟　　再而衰（《曹刿论战》）\nB. 虽欲言　　故虽有名马（《马说》）\nC. 时时而间进　　晏子治东阿三年，景公召而数之\nD. 皆以美于徐公　　吾以子为可\n2. 把选文中画直线的句子翻译成现代汉语。\n（1）令初下，群臣进谏，门庭若市。\n（2）今子治而乱，子退而自察也，寡人将加大诛于子。\n3. 用“/”给【乙】文画波浪线的句子断句（断两处）。\n臣请改道易行而治东阿三年不治臣请死之\n4.【甲】文中邹忌进谏齐王的方式是（1）________，其进谏的主要目的是（2）________；【乙】文中晏子进谏景公的方式是（3）________，其进谏的主要目的是让景公明辨是非，改变错误的评判标准。从【甲】【乙】两文来看，齐威王和齐景公在性格上的共同点是（4）________。","options":[],"annotations":[],"sub_questions":[],"raw_text":"（本溪市级三模）\n【甲】于是入朝见威王，曰：“臣诚知不如徐公美。臣之妻私臣，臣之妾畏臣，臣之客欲有求于臣，皆以美于徐公。今齐地方千里，百二十城，宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王：由此观之，王之蔽甚矣。”\n王曰：“善。”乃下令：“群臣吏民能面刺寡人之过者，受上赏；上书谏寡人者，受中赏；能谤讥于市朝，闻寡人之耳者，受下赏。”令初下，群臣进谏，门庭若市；数月
