<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初二历史上学期期中复习题签 · 交互背诵</title>
<style>
  :root{
    --radius:16px;--radius-sm:10px;
    --accent:#e0b155;       /* 琥珀金 */
    --accent2:#7aa2f7;      /* 靛蓝 */
    --accent3:#6cd0a8;      /* 青绿 */
    --danger:#f87171;
    --font-cn:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    --font-en:"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --serif:"Songti SC","SimSun","Noto Serif SC",serif;
    --trans:.28s cubic-bezier(.4,0,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#0f1219;--bg1:#182035;--bg2:#0f1219;
    --panel:#171b25;--panel2:#1e2333;--panel-hover:#242b3d;
    --border:#2a3145;--border-soft:#212736;
    --text:#eaeef7;--text-dim:#9aa5bd;--text-faint:#66718c;
    --shadow:0 12px 44px rgba(0,0,0,.5);--shadow-sm:0 4px 18px rgba(0,0,0,.32);
    --chip:#1e2333;
    --glow:0 0 0 1px rgba(224,177,85,.22),0 8px 30px rgba(224,177,85,.13);
    --gold:rgba(224,177,85,.13);
  }
  html[data-theme="light"]{
    --bg:#f5f3ee;--bg1:#fdfaf3;--bg2:#f6f4ef;
    --panel:#ffffff;--panel2:#faf8f3;--panel-hover:#f4f1e9;
    --border:#e6e1d5;--border-soft:#efeae0;
    --text:#23262e;--text-dim:#5f6474;--text-faint:#93989f;
    --shadow:0 12px 44px rgba(90,74,40,.12);--shadow-sm:0 4px 18px rgba(90,74,40,.08);
    --chip:#faf8f3;
    --glow:0 0 0 1px rgba(180,140,50,.22),0 8px 30px rgba(180,140,50,.12);
    --accent:#a8781f;--accent2:#3f66c4;--accent3:#1f9a72;
    --gold:rgba(200,160,60,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--font-cn);
    background:
      radial-gradient(1200px 680px at 8% -10%,var(--bg1),transparent 58%),
      radial-gradient(900px 560px at 102% 2%,color-mix(in srgb,var(--accent2) 10%,transparent),transparent 52%),
      var(--bg2);
    background-attachment:fixed;color:var(--text);min-height:100vh;
    -webkit-font-smoothing:antialiased;transition:background var(--trans),color var(--trans);
    padding-bottom:80px;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}

  /* Header */
  header{position:sticky;top:0;z-index:50;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    background:color-mix(in srgb,var(--bg) 80%,transparent);border-bottom:1px solid var(--border-soft);transition:var(--trans)}
  .hd{display:flex;align-items:center;gap:14px;padding:13px 0;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:13px;min-width:0}
  .logo{width:46px;height:46px;flex:none;border-radius:13px;display:grid;place-items:center;
    background:linear-gradient(140deg,var(--accent),#a8761f);color:#221a05;font-weight:900;font-size:20px;
    box-shadow:0 6px 20px rgba(200,150,50,.35);font-family:var(--serif)}
  .brand h1{font-size:1.1rem;font-weight:800;letter-spacing:.3px;line-height:1.25}
  .brand .sub{font-size:.7rem;color:var(--text-dim);margin-top:3px;letter-spacing:.3px}
  .hd-tools{margin-left:auto;display:flex;gap:9px}
  .icon-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--border);background:var(--panel);
    color:var(--text-dim);cursor:pointer;display:grid;place-items:center;font-size:17px;transition:var(--trans)}
  .icon-btn:hover{background:var(--panel-hover);color:var(--text);transform:translateY(-1px)}

  /* Hero / stats */
  .hero{padding:32px 0 6px;text-align:center}
  .hero h2{font-family:var(--serif);font-size:clamp(1.5rem,4vw,2.15rem);font-weight:800;letter-spacing:1px;
    background:linear-gradient(100deg,var(--accent),var(--accent2),var(--accent3));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:9px}
  .hero p{color:var(--text-dim);font-size:.88rem}
  .stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 22px;min-width:100px;box-shadow:var(--shadow-sm)}
  .stat b{display:block;font-size:1.35rem;font-weight:800;font-family:var(--font-en);color:var(--accent)}
  .stat span{font-size:.72rem;color:var(--text-dim)}

  /* Controls */
  .controls{margin-top:24px;display:flex;flex-direction:column;gap:13px}
  .search-row{display:flex;gap:10px;flex-wrap:wrap}
  .search-box{position:relative;flex:1;min-width:200px}
  .search-box .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:15px;pointer-events:none}
  #search{width:100%;padding:13px 42px;border-radius:var(--radius-sm);border:1px solid var(--border);
    background:var(--panel);color:var(--text);font-size:.94rem;font-family:var(--font-cn);outline:none;transition:var(--trans)}
  #search::placeholder{color:var(--text-faint)}
  #search:focus{border-color:var(--accent);box-shadow:var(--glow)}
  .clear-s{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--text-faint);cursor:pointer;font-size:15px;padding:6px;display:none}
  .clear-s.show{display:block}
  .view-toggle{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;gap:4px}
  .view-toggle button{border:none;background:none;color:var(--text-dim);cursor:pointer;padding:9px 15px;border-radius:7px;
    font-size:.85rem;font-weight:700;font-family:var(--font-cn);transition:var(--trans);white-space:nowrap}
  .view-toggle button:hover{color:var(--text)}
  .view-toggle button.on{background:linear-gradient(135deg,var(--accent),#c4922c);color:#241b06;box-shadow:0 4px 14px rgba(200,150,50,.3)}
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .mini{border:1px solid var(--border);background:var(--panel);color:var(--text-dim);padding:8px 14px;border-radius:999px;
    font-size:.79rem;font-weight:600;cursor:pointer;transition:var(--trans);font-family:var(--font-cn);white-space:nowrap}
  .mini:hover{color:var(--text);border-color:var(--accent)}
  .mini.on{background:var(--gold);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--border);background:var(--chip);color:var(--text-dim);padding:7px 14px;border-radius:999px;
    font-size:.79rem;font-weight:600;cursor:pointer;transition:var(--trans);white-space:nowrap;font-family:var(--font-cn)}
  .chip:hover{color:var(--text);border-color:var(--accent)}
  .chip.on{background:linear-gradient(135deg,var(--accent),#c4922c);color:#241b06;border-color:transparent}
  .chip small{opacity:.7;font-weight:500;margin-left:3px}

  /* List view */
  .qlist{margin-top:20px;display:flex;flex-direction:column;gap:12px}
  .qi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow-sm);transition:var(--trans);animation:rise .4s both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .qi:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
  .qi.known{border-color:color-mix(in srgb,var(--accent3) 45%,var(--border));background:color-mix(in srgb,var(--accent3) 5%,var(--panel))}
  .qi-head{display:flex;gap:12px;padding:15px 17px;align-items:flex-start}
  .qno{flex:none;min-width:34px;height:34px;padding:0 8px;border-radius:9px;display:grid;place-items:center;
    font-weight:800;font-size:.82rem;font-family:var(--font-en);
    background:linear-gradient(135deg,var(--accent),#b98619);color:#241b06}
  .qi.known .qno{background:linear-gradient(135deg,var(--accent3),#3f9e78);color:#04231a}
  .qi-main{flex:1;min-width:0}
  .qi-cat{display:inline-block;font-size:.66rem;color:var(--accent2);background:color-mix(in srgb,var(--accent2) 14%,transparent);
    padding:2px 9px;border-radius:999px;font-weight:700;margin-bottom:6px}
  .qi-q{font-size:.98rem;font-weight:700;line-height:1.55}
  .qi-ans{margin-top:11px;padding-top:11px;border-top:1px dashed var(--border);font-size:.92rem;line-height:1.75;
    color:var(--text-dim);white-space:pre-wrap;display:none;animation:fade .3s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .qi.open .qi-ans{display:block}
  .qi-ans em{font-style:normal;color:var(--accent);font-weight:700}
  .qi-acts{display:flex;gap:7px;flex:none}
  .act{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--text-faint);
    cursor:pointer;display:grid;place-items:center;font-size:14px;transition:var(--trans)}
  .act:hover{color:var(--text);background:var(--panel-hover)}
  .act.k{border-color:color-mix(in srgb,var(--accent3) 45%,var(--border));color:var(--accent3)}
  .masked .qi-ans{display:block;filter:blur(6px);cursor:pointer;user-select:none;transition:filter .25s}
  .masked .qi-ans.rev{filter:none}

  /* Card view */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px;margin-top:20px}
  .card{perspective:1200px;height:216px;cursor:pointer;animation:rise .4s both}
  .card-in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
  .card.flip .card-in{transform:rotateY(180deg)}
  .card-f,.card-b{position:absolute;inset:0;border-radius:var(--radius);backface-visibility:hidden;-webkit-backface-visibility:hidden;
    padding:18px;border:1px solid var(--border);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;overflow:hidden}
  .card-f{background:linear-gradient(150deg,var(--panel2),var(--panel))}
  .card:hover .card-f{border-color:var(--accent)}
  .card-f .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .card-f .n{font-family:var(--font-en);font-weight:800;color:var(--accent);font-size:.85rem}
  .card-f .tag{font-size:.62rem;color:var(--accent2);font-weight:700}
  .card-f .q{font-size:.9rem;font-weight:700;line-height:1.6;overflow:auto}
  .card-f .hint{position:absolute;bottom:11px;left:18px;font-size:.62rem;color:var(--text-faint)}
  .card-b{transform:rotateY(180deg);background:linear-gradient(150deg,color-mix(in srgb,var(--accent3) 16%,var(--panel)),var(--panel));
    border-color:color-mix(in srgb,var(--accent3) 38%,var(--border))}
  .card-b .lab{font-size:.62rem;color:var(--text-faint);letter-spacing:2px;margin-bottom:8px}
  .card-b .a{font-size:.86rem;line-height:1.7;color:var(--text);overflow:auto;white-space:pre-wrap}
  .card-b .n2{position:absolute;bottom:11px;right:18px;font-family:var(--font-en);font-weight:800;color:var(--accent3);font-size:.8rem}

  /* Quiz view */
  .quiz{max-width:620px;margin:22px auto 0}
  .q-prog{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-bottom:8px}
  .q-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent3));transition:width .35s}
  .q-meta{display:flex;justify-content:space-between;font-size:.76rem;color:var(--text-dim);margin-bottom:16px;font-family:var(--font-en)}
  .q-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:30px 24px;box-shadow:var(--shadow)}
  .q-tag{display:inline-block;font-size:.7rem;color:var(--accent2);background:color-mix(in srgb,var(--accent2) 14%,transparent);
    padding:4px 11px;border-radius:999px;font-weight:700;margin-bottom:14px}
  .q-qt{font-size:1.25rem;font-weight:800;line-height:1.6;text-align:left}
  .q-ans{margin-top:16px;padding:15px 17px;border-radius:var(--radius-sm);background:var(--panel2);border:1px dashed var(--border);
    font-size:.94rem;line-height:1.8;color:var(--text);text-align:left;white-space:pre-wrap;display:none}
  .q-ans.show{display:block;animation:fade .3s}
  .q-actions{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;padding:13px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--panel);color:var(--text);
    font-family:var(--font-cn);font-size:.9rem;font-weight:700;cursor:pointer;transition:var(--trans)}
  .btn:hover{background:var(--panel-hover);transform:translateY(-1px)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#c4922c);color:#241b06;border-color:transparent;box-shadow:0 6px 20px rgba(200,150,50,.3)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.good{background:linear-gradient(135deg,var(--accent3),#3f9e78);color:#04231a;border-color:transparent}
  .btn.warn{background:linear-gradient(135deg,var(--danger),#d64a4a);color:#fff;border-color:transparent}
  .q-result{text-align:center;padding:16px 0}
  .q-result .big{font-family:var(--font-en);font-size:3rem;font-weight:800;color:var(--accent)}
  .q-result .txt{color:var(--text-dim);margin:8px 0 4px}
  .q-result .acc{color:var(--accent3);font-weight:700}
  .scope{text-align:center;font-size:.75rem;color:var(--text-faint);margin-top:13px}

  .empty{text-align:center;padding:64px 20px;color:var(--text-faint)}
  .empty .e{font-size:2.4rem;margin-bottom:12px;opacity:.6}

  footer{text-align:center;color:var(--text-faint);font-size:.75rem;padding:42px 20px 10px;line-height:2}
  .kbd{font-family:var(--font-en);background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:.72rem}

  @media(max-width:640px){
    .wrap{padding:0 14px}
    .brand h1{font-size:.98rem}
    .view-toggle button{padding:8px 11px;font-size:.79rem}
    .stat{padding:9px 16px;min-width:84px}
    .cards{grid-template-columns:1fr}
    .card{height:200px}
    .q-qt{font-size:1.1rem}
    .qi-head{padding:13px}
  }

  /* ---------- 打印：浅色 · 全部展开 · A4 满页 ---------- */
  @media print{
    @page{size:A4;margin:12mm 10mm}
    html{--accent:#9a6b12;--accent2:#2f4f9e;--accent3:#177a5a}
    body{background:#fff!important;color:#111!important;padding:0!important}
    header,.controls,.hero p,.stats,.hd-tools,footer .no-print,.view-toggle,.chips,.search-row,.toolbar{display:none!important}
    .hero{padding:0 0 8px!important}
    .hero h2{font-size:20pt!important;-webkit-text-fill-color:#111!important;background:none!important;color:#111!important;margin:0 0 4px!important}
    .qi,.card,.q-card{box-shadow:none!important;border:1px solid #bbb!important;break-inside:avoid;page-break-inside:avoid;background:#fff!important}
    .qi-ans,.masked .qi-ans{display:block!important;filter:none!important;color:#111!important;border-top-color:#ccc!important}
    .qi-q,.card-f .q,.q-qt{color:#111!important}
    .qi-cat,.q-tag{color:#333!important;background:#eee!important}
    .qno{background:#333!important;color:#fff!important}
    .cards{display:block!important}
    .card{height:auto!important;perspective:none!important;margin-bottom:8px!important}
    .card-in{transform:none!important;position:static!important}
    .card-f,.card-b{position:static!important;transform:none!important;backface-visibility:visible!important;border:none!important;padding:0!important}
    .card-f .hint,.card-b .lab{display:none!important}
    .card-b{margin-top:4px!important}
    .cards .card{display:none}
    body.print-mode .cards .card{display:block}
    .qlist{gap:6px!important}
    .qi-head{padding:6px 8px!important}
    .qi-ans{font-size:9.5pt!important;line-height:1.5!important}
    .qi-q{font-size:10pt!important}
    .banner{display:block!important}
  }
  .banner{display:none;text-align:center;font-weight:800;font-size:13pt;margin-bottom:6px}
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <div class="brand">
      <div class="logo">史</div>
      <div>
        <h1>初二历史上学期 · 期中复习题签</h1>
        <div class="sub">济宁市实验初中 · 整理：初二历史组 · 审核：李媛</div>
      </div>
    </div>
    <div class="hd-tools">
      <button class="icon-btn" id="printBtn" title="打印 / 导出 PDF">🖨</button>
      <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="banner">初二历史上学期期中复习题签</div>
  <section class="hero">
    <h2>期中背诵题签 · 131 题</h2>
    <p>按单元分组 · 支持搜索 / 卡片 / 默写自测 / 掌握标记</p>
    <div class="stats">
      <div class="stat"><b id="sTotal">131</b><span>题目总数</span></div>
      <div class="stat"><b id="sCat">11</b><span>单元板块</span></div>
      <div class="stat"><b id="sKnown">0</b><span>已掌握</span></div>
      <div class="stat"><b id="sShow">131</b><span>当前显示</span></div>
    </div>
  </section>

  <div class="controls">
    <div class="search-row">
      <div class="search-box">
        <span class="ic">🔍</span>
        <input id="search" type="text" placeholder="搜索问题 / 答案关键词，如“马关条约”“孙中山”…" autocomplete="off">
        <button class="clear-s" id="clearBtn">✕</button>
      </div>
      <div class="view-toggle" id="viewToggle">
        <button data-view="list" class="on">📖 列表</button>
        <button data-view="card">🃏 卡片</button>
        <button data-view="quiz">✍️ 自测</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="toolbar" id="toolbar">
      <button class="mini" id="expandAll">展开全部答案</button>
      <button class="mini" id="collapseAll">收起全部</button>
      <button class="mini" id="onlyUnknown">只看未掌握</button>
      <button class="mini" id="resetKnown">重置掌握进度</button>
    </div>
  </div>

  <div id="app"></div>
</main>

<footer>
  <div>资料来源：《济宁市实验初中初二历史上学期期中复习题签》（共 131 题，原题签序号缺 72）</div>
  <div class="no-print">快捷键：<span class="kbd">/</span> 聚焦搜索 · 列表模式点击题号右侧 <span class="kbd">👁</span> 看答案 · <span class="kbd">🖨</span> 打印为 A4 浅色满页</div>
</footer>

<script>
/* ===================== 数据 ===================== */
const CATS = [
  "鸦片战争","第二次鸦片战争","太平天国运动","洋务运动","边疆危机与甲午中日战争",
  "民族危机与戊戌变法","义和团运动与八国联军侵华","辛亥革命","新文化运动","五四运动","中国共产党的诞生"
];
/* [题号, 分类索引, 问题, 答案]  答案中 \n 为换行 */
const DATA = [
[1,0,'英国发动鸦片战争的根本原因和借口？','①英国为了打开中国市场；②林则徐领导虎门销烟。'],
[2,0,'虎门销烟的时间、意义？','1839年；这是中国人民禁烟斗争的伟大胜利，显示了中华民族反抗外来侵略的坚强意志。'],
[3,0,'鸦片战争的起止时间？','1840-1842年'],
[4,0,'鸦片战争期间出现的民族英雄及其牺牲地点？','关天培——虎门炮台；葛云飞、王锡朋、郑国鸿——定海；陈化成——吴淞；海龄——镇江'],

const ITEMS = DATA.map(d=>({n:d[0],cat:d[1],q:d[2],a:d[3]}));
const TOTAL = ITEMS.length;

/* ===================== 状态 ===================== */
const store = {
  get(k,def){ try{ const v=localStorage.getItem(k); return v===null?def:JSON.parse(v); }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const state = {
  view:'list', q:'', cat:'all',
  known:new Set(store.get('his-known',[])),
  onlyUnknown:false,
  quiz:{pool:[],order:[],idx:0,ok:0,revealed:false}
};
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s=>esc(s).replace(/\n/g,'<br>');

/* ===================== 过滤 ===================== */
function filtered(){
  const q = state.q.trim().toLowerCase();
  return ITEMS.filter(it=>{
    if(state.cat!=='all' && it.cat!==state.cat) return false;
    if(state.onlyUnknown && state.known.has(it.n)) return false;
    if(!q) return true;
    return (it.q+' '+it.a+' '+it.n+' '+CATS[it.cat]).toLowerCase().includes(q);
  });
}

/* ===================== 渲染 ===================== */
function render(){
  const list = filtered();
  $('#sShow').textContent = list.length;
  $('#sKnown').textContent = state.known.size;
  const app = $('#app');
  if(!list.length){ app.innerHTML = emptyHTML(); return; }
  if(state.view==='list') renderList(app,list);
  else if(state.view==='card') renderCards(app,list);
  else renderQuiz(app,list);
}

function emptyHTML(){ return `<div class="empty"><div class="e">🔍</div><div>没有找到匹配的题目，换个关键词试试</div></div>`; }

/* ---- 列表 ---- */
function renderList(app,list){
  app.className = 'qlist';
  app.innerHTML = list.map((it,i)=>{
    const k = state.known.has(it.n);
    return `<article class="qi ${k?'known':''}" data-n="${it.n}" style="animation-delay:${Math.min(i*10,300)}ms">
      <div class="qi-head">
        <div class="qno">${it.n}</div>
        <div class="qi-main">
          <span class="qi-cat">${esc(CATS[it.cat])}</span>
          <div class="qi-q">${esc(it.q)}</div>
          <div class="qi-ans">${fmt(it.a)}</div>
        </div>
        <div class="qi-acts">
          <button class="act t" title="显示 / 隐藏答案">👁</button>
          <button class="act k ${k?'k':''}" title="标记已掌握">${k?'✓':'○'}</button>
        </div>
      </div>
    </article>`;
  }).join('');
  app.querySelectorAll('.qi').forEach(el=>{
    const n = +el.dataset.n;
    el.querySelector('.t').onclick = e=>{ e.stopPropagation(); el.classList.toggle('open'); };
    el.querySelector('.qi-q').onclick = ()=> el.classList.toggle('open');
    el.querySelector('.k').onclick = e=>{ e.stopPropagation(); toggleKnown(n); };
  });
  if(app.classList.contains('masked')) app.classList.add('masked');
}

/* ---- 卡片 ---- */
function renderCards(app,list){
  app.className = 'cards';
  app.innerHTML = list.map((it,i)=>`
    <div class="card" data-n="${it.n}" style="animation-delay:${Math.min(i*12,400)}ms">
      <div class="card-in">
        <div class="card-f">
          <div class="top"><span class="n">第 ${it.n} 题</span><span class="tag">${esc(CATS[it.cat])}</span></div>
          <div class="q">${esc(it.q)}</div>
          <div class="hint">点击翻转查看答案 →</div>
        </div>
        <div class="card-b">
          <div class="lab">答案</div>
          <div class="a">${fmt(it.a)}</div>
          <div class="n2">${it.n}</div>
        </div>
      </div>
    </div>`).join('');
  app.querySelectorAll('.card').forEach(c=>c.onclick=()=>c.classList.toggle('flip'));
}

/* ---- 自测 ---- */
function buildQuiz(){
  const pool = filtered();
  const order = pool.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  state.quiz = {pool,order,idx:0,ok:0,revealed:false};
}
function renderQuiz(app,list){
  const z = state.quiz;
  if(!z.pool || z.pool.length!==list.length){ buildQuiz(); }
  const q = state.quiz;
  app.className = 'quiz-wrap';
  if(q.idx >= q.pool.length) return renderResult(app);
  const it = q.pool[q.order[q.idx]];
  app.innerHTML = `<div class="quiz">
    <div class="q-prog"><i style="width:${(q.idx/q.pool.length)*100}%"></i></div>
    <div class="q-meta"><span>第 ${q.idx+1} / ${q.pool.length} 题</span><span>已会 ${q.ok}</span></div>
    <div class="q-card">
      <div class="q-tag">${esc(CATS[it.cat])} · 第 ${it.n} 题</div>
      <div class="q-qt">${esc(it.q)}</div>
      <div class="q-ans ${q.revealed?'show':''}">${fmt(it.a)}</div>
      <div class="q-actions" id="qa1">
        <button class="btn" id="reveal">显示答案</button>
        ${q.revealed?`
          <button class="btn good" id="yes">✅ 会了</button>
          <button class="btn warn" id="no">❌ 再练</button>`
        :`<button class="btn primary" id="skip">想不出，看答案 →</button>`}
      </div>
    </div>
    <div class="scope">范围：${state.cat==='all'?'全部题目':esc(CATS[state.cat])}${state.q?(' · 搜索“'+esc(state.q)+'”'):''}</div>
  </div>`;
  const reveal = ()=>{ state.quiz.revealed=true; renderQuiz($('#app'),filtered()); };
  $('#reveal').onclick = reveal;
  const skip = $('#skip'); if(skip) skip.onclick = reveal;
  const yes = $('#yes'); if(yes) yes.onclick = ()=>{ state.known.add(it.n); persistKnown(); state.quiz.ok++; nextQ(); };
  const no = $('#no'); if(no) no.onclick = ()=>{ state.known.delete(it.n); persistKnown(); nextQ(); };
}
function nextQ(){ state.quiz.idx++; state.quiz.revealed=false; window.scrollTo({top:0,behavior:'smooth'}); renderQuiz($('#app'),filtered()); }
function renderResult(app){
  const q = state.quiz;
  const pct = q.pool.length? Math.round(q.ok/q.pool.length*100):0;
  const label = pct>=90?'非常熟练！🏆':pct>=75?'掌握不错，继续保持 👍':pct>=60?'基本掌握，再复习一遍 💪':'需要加强背诵 📚';
  app.innerHTML = `<div class="quiz"><div class="q-card q-result">
    <div class="big">${pct}%</div>
    <div class="txt">本轮“会了” ${q.ok} / ${q.pool.length} 题</div>
    <div class="acc">${label}</div>
    <div class="q-actions">
      <button class="btn" id="again">🔁 再来一轮</button>
      <button class="btn primary" id="back">📖 回到列表</button>
    </div>
  </div></div>`;
  $('#again').onclick = ()=>{ buildQuiz(); renderQuiz($('#app'),filtered()); };
  $('#back').onclick = ()=> setView('list');
}

/* ===================== 掌握标记 ===================== */
function toggleKnown(n){
  if(state.known.has(n)) state.known.delete(n); else state.known.add(n);
  persistKnown();
  const el = document.querySelector(`.qi[data-n="${n}"]`);
  if(el){
    const k = state.known.has(n);
    el.classList.toggle('known',k);
    const btn = el.querySelector('.k'); btn.classList.toggle('k',k); btn.textContent = k?'✓':'○';
  }
  $('#sKnown').textContent = state.known.size;
  if(state.onlyUnknown) renderList($('#app'),filtered());
}
function persistKnown(){ store.set('his-known',[...state.known]); }

/* ===================== 控制 ===================== */
function setView(v){
  state.view = v;
  document.querySelectorAll('#viewToggle button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  $('#app').classList.toggle('masked', false);
  if(v==='quiz') buildQuiz();
  render();
}
document.querySelectorAll('#viewToggle button').forEach(b=>b.onclick=()=>setView(b.dataset.view));

let t=null;
$('#search').addEventListener('input',e=>{
  state.q = e.target.value;
  $('#clearBtn').classList.toggle('show',!!state.q);
  clearTimeout(t); t=setTimeout(()=>{ if(state.view==='quiz') buildQuiz(); render(); },150);
});
$('#clearBtn').onclick = ()=>{ $('#search').value=''; state.q=''; $('#clearBtn').classList.remove('show'); render(); $('#search').focus(); };

$('#expandAll').onclick = ()=>{ document.querySelectorAll('.qi').forEach(el=>el.classList.add('open')); };
$('#collapseAll').onclick = ()=>{ document.querySelectorAll('.qi').forEach(el=>el.classList.remove('open')); };
$('#onlyUnknown').onclick = ()=>{
  state.onlyUnknown = !state.onlyUnknown;
  $('#onlyUnknown').classList.toggle('on',state.onlyUnknown);
  $('#onlyUnknown').textContent = state.onlyUnknown?'显示全部':'只看未掌握';
  render();
};
$('#resetKnown').onclick = ()=>{
  if(!confirm('确定清空所有“已掌握”标记吗？')) return;
  state.known.clear(); persistKnown(); render();
};
$('#printBtn').onclick = ()=> window.print();

/* 主题 */
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  $('#themeBtn').textContent = t==='dark'?'🌙':'☀️';
  store.set('his-theme',t);
}
$('#themeBtn').onclick = ()=> applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* 快捷键 / */
document.addEventListener('keydown',e=>{
  if(e.key==='/' && document.activeElement!==$('#search')){ e.preventDefault(); $('#search').focus(); }
  if(e.key==='Escape' && document.activeElement===$('#search')){ $('#search').blur(); }
});

/* 打印时列表全展开 */
window.addEventListener('beforeprint',()=>{
  if(state.view==='list') document.querySelectorAll('.qi').forEach(el=>el.classList.add('open'));
  document.body.classList.add('print-mode');
});
window.addEventListener('afterprint',()=>{ document.body.classList.remove('print-mode'); });

/* ===================== 初始化 ===================== */
(function init(){
  applyTheme(store.get('his-theme','dark'));
  $('#sTotal').textContent = TOTAL;
  $('#sCat').textContent = CATS.length;
  // chips
  const c = $('#chips');
  c.innerHTML = `<button class="chip on" data-cat="all">全部<small>${TOTAL}</small></button>` +
    CATS.map((name,i)=>{
      const n = ITEMS.filter(x=>x.cat===i).length;
      return `<button class="chip" data-cat="${i}">${esc(name)}<small>${n}</small></button>`;
    }).join('');
  c.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    state.cat = b.dataset.cat==='all'?'all':+b.dataset.cat;
    c.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));
    if(state.view==='quiz') buildQuiz();
    render();
  });
  render();
})();
</script>
</body>
</html>
