 {

  "section": "积累与运用",
  "score": "8分",
  "stem": "<p>为了引导同学们深入领略自然的美好，品味生活中蕴含的诗意与哲理，邹鲁中学计划制作一期以“自然·生活”为主题的电子刊物，请你参与。</p>\n<p>小邹为电子刊物拟写了一段引言，请你帮他修改完善。</p>\n<blockquote>在大自然的怀抱中，我们找到了心灵的<mark>着落</mark>①，仿佛漂泊的船只找到了港口。这里，我们可以学会与浮躁<mark>决别</mark>，让心灵得到真正的休息。春日，我们可以（徜徉/徘徊）在花海之中，让身心都沉浸在这<mark>沁凉</mark>②的自然之美中，感受生命的<mark>篷勃</mark>，偶遇一片未曾预料的野芳，更令人（喜出望外/欣喜若狂）；夏日，（生生不息/绵延不绝）的万物，即便在狂风暴雨的席卷下，也依然倔强地向上拔节生长；秋夜，月色如水，无声地（覆盖/笼罩）着山林，洒下一地细碎的银白；冬日，天地一片苍茫，在这<mark>静秘</mark>的世界里，我们可以尽情感受带给自然的宁静与力量。</blockquote>\n<p class=\"sub\">(1) 请将加点字注音。①着落 _________　②沁凉 ________</p>\n<p class=\"sub\">(2) 引言中画横线的词语，没有错别字的一项是 _____</p>\n<p class=\"opts\">A.漂泊　B.决别　C.篷勃　D.静秘</p>\n<p class=\"sub\">(3) 请你帮助小邹从括号内选出恰当的词语 _____</p>\n<p class=\"sub\">(4) 画波浪线的句子有一处语病，请你改成一个正确的句子。</p>",
  "sol": "<p><b>(1)</b> ①“着落”的“着”读作 <b>zhuó</b>。　②“沁凉”的“沁”读作 <b>qìn</b>。</p>\n<p><b>(2)</b> 选 <b>A</b>。<br>解析：B.有误，决别→<b>诀别</b>；C.有误，篷勃→<b>蓬勃</b>；D.有误，静秘→<b>静谧</b>。</p>\n<p><b>(3)</b> 依次选：<b>徜徉</b>；<b>喜出望外</b>；<b>生生不息</b>；<b>笼罩</b>。<br>\n解析：徜徉=悠闲自在地漫步，花海游玩用“徜徉”；喜出望外=意外遇见好事而惊喜（欣喜若狂程度过重），偶遇野花选“喜出望外”；生生不息=生命不断繁衍生长，形容万物；绵延不绝多形容山川河流；笼罩=从上方大范围罩住，月色笼罩山林是固定搭配。</p>\n<p><b>(4)</b> 修改：<b>我们可以尽情感受自然带给我们的宁静与力量。</b><br>\n解析：原句“感受带给自然的宁静与力量”语序颠倒、逻辑错误，应是自然带给我们，而非我们带给自然。</p>"
 },
 {

  "section": "积累与运用",
  "score": "6分",
  "stem": "<p>【素材集锦】小鲁为电子刊物收集了一些文学素材，请你帮她补充完整。</p>\n<p class=\"note\">注：原题填空处以横线呈现，文档中未提取到具体上句/下句提示，以下按答案文档列出参考答案（均为七上古诗文默写常见句）。</p>",
  "sol": "<p>① <b>百草丰茂</b>（曹操《观沧海》）</p>\n<p>② <b>回乐烽前沙似雪</b>（李益《夜上受降城闻笛》，注意“烽”的书写）</p>\n<p>③ <b>潮平两岸阔</b>（王湾《次北固山下》）</p>\n<p>④ <b>风正一帆悬</b>（王湾《次北固山下》）</p>\n<p>⑤ <b>闻道龙标过五溪</b>（李白《闻王昌龄左迁龙标遥有此寄》）</p>\n<p>⑥ <b>吹面不寒杨柳风</b>（志南《绝句》）</p>"
 },
 {
  "no": "3",
  "section": "积累与运用",
  "score": "8分",
  "stem": "<p>【读书展示】电子刊物中有“品朝花·忆鲁迅”的主题读书专栏，请你调动阅读积累，完成下列任务。</p>\n<p class=\"sub\">(1)【任务一：图文对对碰】小语想给《朝花夕拾》中的篇目配上插图，请你判断下面两幅图片分别适合作为哪篇文章的插图。</p>\n<p class=\"note\">（原题含插图1、插图2两幅图，文字说明：图一为雪地里捕鸟的场景；图二为老莱子彩衣娱亲的故事。）</p>\n<p class=\"sub\">插图1、插图2对应的篇名分别是《______________ 》《__________ 》</p>\n<p class=\"sub\">(2)【任务二：发一条“朋友圈”】小文以“迅哥儿”为网名，为童年鲁迅发了一条“朋友圈”（①阿长 ②寿镜吾先生 ③鲁迅的父亲，三处人物待判断）。</p>\n<p class=\"sub\">(3)【任务三：参与一次跟帖】主帖认为鲁迅在逆境中成长；请完善“跟帖”：我认为鲁迅先生也是在充满爱的顺境中成长的。我的理由是 ____________________（结合阅读体会，仿照主帖内容）。</p>",
  "sol": "<p><b>(1)</b> 图一：《<b>从百草园到三味书屋</b>》（雪地捕鸟场景）；图二：《<b>二十四孝图</b>》（老莱子彩衣娱亲）。</p>\n<p><b>(2)</b> ① <b>阿长（长妈妈）</b>——《阿长与&lt;山海经&gt;》中她不识字却买来“三哼经”（《山海经》）；② <b>寿镜吾先生</b>——《从百草园到三味书屋》中三味书屋老师，认为“刑天”“帝江”是“怪哉”之流；③ <b>鲁迅的父亲</b>——《五猖会》中强令“我”背《鉴略》。</p>\n<p><b>(3)</b> 示例：年幼时，阿长关怀他，给他讲美女蛇的故事，又千方百计买来他心心念念的《山海经》。在日本求学遭遇困境时，藤野先生给予他悉心的指导和真诚的关心，使他终生难忘。</p>"
 },

  "score": "4分",
  "stem": "<p>【诗文赏读】阅读下面两首古诗，完成问题。</p>\n<blockquote class=\"poem\"><b>【甲】天净沙·秋思</b>　马致远<br>枯藤老树昏鸦，小桥流水人家，古道西风瘦马。夕阳西下，断肠人在天涯。<br><br>\n<b>【乙】秋凉晚步</b>　杨万里<br>秋气堪悲未必然，轻寒正是可人天。<br>绿池落尽红蕖却，荷叶犹开最小钱。</blockquote>\n<p class=\"sub\">(1) 对下列两首诗歌的理解，不正确的一项是 _____</p>\n<p class=\"opts\">A.【甲】中枯藤、老树、昏鸦、西风等具有秋天色彩的景物，引发了诗人的情思。<br>\nB.【甲】语言凝练，内容丰富，结构精巧，意蕴深远，被后人誉为“秋思之祖”。<br>\nC.【乙】选取了绿池、荷叶等意象，以清丽的语言，描绘出了生动的秋日画卷。<br>\nD.【乙】观察细致深入，肯定了前人李秋的观点，同时也抒写了自己的独特感悟。</p>\n<p class=\"sub\">(2) 两首诗歌都描写了秋天，但情感各有不同，请结合内容分析。</p>",
  "sol": "<p><b>(1)</b> 选 <b>D</b>。解析：《秋凉晚步》首句“秋气堪悲未必然”表明诗人<b>并不认同</b>前人悲秋的观点，而非“肯定”。</p>\n<p><b>(2)</b> 示例：【甲】“枯藤、老树、昏鸦、西风”等意象营造悲凉氛围，“断肠”凸显情感，表现长期漂泊他乡游子的孤独、悲哀与思乡；【乙】“可人天”及对池塘、荷叶的描写，表现诗人对秋天的喜爱与<b>乐观豁达</b>的人生态度。</p>",

   "translation": "人们以为秋气使人悲哀，其实未必如此；轻微的寒意，正好是令人舒适的天气。绿色池塘里的红色荷花虽然都落尽了，但荷叶还有新长出来的如铜钱那么圆的小荷叶。",

  $("#stats").innerHTML=`共 <b>${total}</b> 道大题　|　含课外拓展 <b>${withExp}</b> 篇（古诗/文言文）`;
}

function haystack(e){let h=e.no+e.section+e.stem+e.sol;if(e.expand)h+=(e.expand.title+e.expand.translation+e.expand.original+e.expand.appreciation.join("")+e.expand.notes.map(n=>n[0]+n[1]).join(""));return h.toLowerCase();}

function renderList(){
  const q=state.q.trim().toLowerCase();
  const list=QUESTIONS.filter(e=>{
    if(state.section!=="all"&&e.section!==state.section)return false;
    if(q&&!haystack(e).includes(q))return false;
    return true;
  });
  const box=$("#list"); box.innerHTML="";
  if(!list.length){box.innerHTML='<div class="empty">没有匹配的题目，换个关键词试试～</div>';return;}
  list.forEach((e,idx)=>{
    const art=document.createElement("article"); art.className="q"; art.dataset.idx=idx;
    let html=`<div class="q-head"><span class="q-no">${e.no}</span><span class="q-score">${e.score}</span><span class="q-sec">${e.section}</span></div>`;
    html+=`<div class="q-stem">${e.stem}</div>`;
    if(e.expand){
      html+=`<button class="toggle expand" data-t="exp">📚 课外拓展：${e.expand.kind} ▾</button>`;
      html+=`<div class="panel expand-panel" data-p="exp">${expandHTML(e.expand)}</div>`;
    }
    html+=`<button class="toggle" data-t="sol">显示答案与解析 ▾</button>`;
    html+=`<div class="panel sol" data-p="sol">${e.sol}</div>`;
    art.innerHTML=html;
    box.appendChild(art);
  });
  bindToggles();
}

function expandHTML(x){
  let h=`<h4>${x.title}（${x.kind}）</h4>`;
  h+=`<div class="orig">${x.original}</div>`;
  h+=`<table class="notes"><tr><th>词语</th><th>注释</th></tr>`;
  x.notes.forEach(n=>{h+=`<tr><td class="w">${n[0]}</td><td>${n[1]}</td></tr>`;});
  h+=`</table>`;
  h+=`<div class="tran"><b>【译文】</b>${x.translation}</div>`;
  h+=`<div class="app"><b>【赏析 / 背景】</b>`;
  x.appreciation.forEach(p=>h+=`<p>${p}</p>`);
  h+=`</div>`;
  return h;
}

function bindToggles(){
  document.querySelectorAll(".q").forEach(art=>{
    art.querySelectorAll(".toggle").forEach(btn=>{
      btn.onclick=()=>{
        const p=art.querySelector(`.panel[data-p="${btn.dataset.t}"]`);
        const open=p.classList.toggle("show");
        btn.textContent = open ? btn.textContent.replace("▾","▲") : btn.textContent.replace("▲","▾");
      };
    });
  });
}

function setAll(open){
  document.querySelectorAll('.panel[data-p="sol"]').forEach(p=>p.classList.toggle("show",open));
  document.querySelectorAll('.toggle[data-t="sol"]').forEach(b=>{b.textContent=open?"收起答案与解析 ▲":"显示答案与解析 ▾";});
}

applyTheme(); renderNav(); renderStats(); renderList();
$("#search").addEventListener("input",e=>{state.q=e.target.value;renderList();});
$("#theme-toggle").addEventListener("click",()=>{state.dark=!state.dark;ls.set("paper_dark",state.dark);applyTheme();});
$("#print-btn").addEventListener("click",()=>window.print());
$("#expand-all").addEventListener("click",()=>setAll(true));
$("#collapse-all").addEventListener("click",()=>setAll(false));
</script>
</body>
</html>
