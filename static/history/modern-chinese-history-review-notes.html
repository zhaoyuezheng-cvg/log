<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国近现代史纲要 · 复习笔记（校订版）</title>
<style>
:root{
  --red:#a3232b; --red-deep:#7c151d; --red-soft:rgba(163,35,43,.08);
  --gold:#b08d3e; --gold-soft:rgba(176,141,62,.12);
  --cream:#f4eee2; --paper:#fffdf7; --ink:#282320; --muted:#7a6e60; --line:#e4dac6;
  --shadow:0 2px 16px rgba(96,66,32,.10); --radius:14px; --content-size:16.5px;
}
html[data-theme="dark"]{
  --red:#d9584f; --red-deep:#b8443c; --red-soft:rgba(217,88,79,.12);
  --gold:#cfa85c; --gold-soft:rgba(207,168,92,.14);
  --cream:#171512; --paper:#211e19; --ink:#ece3d3; --muted:#a3947f; --line:#3a332a;
  --shadow:0 2px 18px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  line-height:1.85; transition:background .3s,color .3s;
}
h1,h2,h3,h4,h5,.serif{font-family:"Noto Serif CJK SC","Songti SC","STSong","SimSun",serif;}
button{font-family:inherit;}
::selection{background:var(--red-soft); color:var(--red-deep);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--gold) 45%,transparent);border-radius:9px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- top bar ---------- */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:60; height:60px;
  display:flex; align-items:center; gap:12px; padding:0 18px;
  background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none;}
.brand .seal{
  width:34px;height:34px;border-radius:8px;flex:none;
  background:linear-gradient(135deg,var(--red),var(--red-deep));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:"Noto Serif CJK SC","Songti SC",serif;font-size:17px;font-weight:700;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35);
}
.brand b{font-size:16px;letter-spacing:1px;}
.brand span{color:var(--muted);font-size:11.5px;display:block;line-height:1.2;letter-spacing:.5px;}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px;}
.search-wrap{position:relative;}
#searchInput{
  width:230px; padding:7px 12px 7px 32px; font-size:13.5px; color:var(--ink);
  border:1px solid var(--line); border-radius:999px; background:var(--cream); outline:none;
  transition:width .25s,border-color .2s,box-shadow .2s;
}
#searchInput:focus{width:300px;border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft);}
.search-wrap .s-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);}
.btn{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
  border-radius:10px; padding:7px 12px; font-size:13px; transition:all .18s;
}
.btn:hover{border-color:var(--red);color:var(--red);transform:translateY(-1px);}
.btn.icon{width:36px;height:36px;padding:0;justify-content:center;border-radius:10px;}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;}
.btn.primary:hover{background:var(--red-deep);color:#fff;}
#progressBar{position:fixed;top:60px;left:0;height:3px;width:0;z-index:70;
  background:linear-gradient(90deg,var(--red),var(--gold));transition:width .1s;}
#menuBtn{display:none;}

/* ---------- sidebar ---------- */
.sidebar{
  position:fixed;top:60px;bottom:0;left:0;width:288px;z-index:50;
  background:var(--paper);border-right:1px solid var(--line);
  overflow-y:auto;padding:16px 12px 80px;
}
.side-head{display:flex;align-items:center;gap:8px;padding:4px 8px 12px;}
.side-head .ring{position:relative;width:44px;height:44px;flex:none;}
.side-head .ring svg{transform:rotate(-90deg);}
.side-head .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;}
.side-title{font-size:12px;letter-spacing:2px;color:var(--muted);margin:10px 8px 6px;}
.side-item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;
  border:none;background:none;color:var(--ink);padding:7px 10px;border-radius:9px;
  font-size:13.5px;line-height:1.45;transition:background .15s,color .15s;
}
.side-item:hover{background:var(--red-soft);color:var(--red);}
.side-item.active{background:var(--red-soft);color:var(--red);font-weight:700;}
.side-item .idx{width:22px;height:22px;flex:none;border-radius:6px;background:var(--gold-soft);
  color:var(--gold);font-size:11px;display:flex;align-items:center;justify-content:center;}
.side-sec{padding:3px 8px 3px 40px;font-size:12.5px;color:var(--muted);cursor:pointer;
  border-left:2px solid transparent;margin-left:14px;transition:all .15s;}
.side-sec:hover{color:var(--red);border-left-color:var(--gold);}
.side-sec.active{color:var(--red);border-left-color:var(--red);font-weight:700;}
.side-done{width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:auto;flex:none;}
.side-foot{margin:16px 6px 0;padding:12px;border:1px dashed var(--line);border-radius:12px;font-size:12px;color:var(--muted);}
.side-foot .bar-track{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px;}
.side-foot .bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .35s;}

/* ---------- main ---------- */
.main{margin-left:288px;padding:84px 34px 110px;max-width:1180px;}
.view{display:none;}
.view.active{display:block;}
.fade-in{animation:fadeUp .45s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

/* home */
.hero{
  position:relative;overflow:hidden;border-radius:20px;padding:52px 48px;
  background:linear-gradient(135deg,var(--red-deep),var(--red) 55%,#c0453a);
  color:#fff8ef;box-shadow:var(--shadow);
}
.hero:after{
  content:"史";position:absolute;right:26px;top:50%;transform:translateY(-52%);
  font-family:"Noto Serif CJK SC","Songti SC",serif;font-size:200px;font-weight:700;
  color:rgba(255,255,255,.12);pointer-events:none;line-height:1;
}
.hero h1{font-size:38px;margin:0 0 10px;letter-spacing:3px;}
.hero .sub{font-size:15px;opacity:.92;letter-spacing:1.5px;}
.hero .desc{max-width:640px;margin:18px 0 24px;font-size:14.5px;line-height:2;opacity:.95;}
.hero .meta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px;}
.hero .chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);
  padding:5px 14px;border-radius:999px;font-size:12.5px;letter-spacing:.5px;}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;}
.hero .cta .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.45);color:#fff;}
.hero .cta .btn:hover{background:#fff;color:var(--red-deep);}
.hero .cta .btn.solid{background:#fff;color:var(--red-deep);border-color:#fff;}

.grid{display:grid;gap:20px;}
.grid.chapters{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));margin-top:26px;}
.home-stats{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-top:26px;}
.stat{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow);
}
.stat .num{font-family:"Noto Serif CJK SC","Songti SC",serif;font-size:30px;color:var(--red);line-height:1.2;}
.stat .lab{font-size:12.5px;color:var(--muted);letter-spacing:1px;margin-top:4px;}
.stat .bar-track{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px;}
.stat .bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .4s;}

.sec-label{display:flex;align-items:center;gap:12px;margin:38px 0 6px;}
.sec-label h2{font-size:21px;margin:0;letter-spacing:2px;}
.sec-label .line{flex:1;height:1px;background:var(--line);}
.sec-label .hint{font-size:12px;color:var(--muted);}

.ch-card{
  position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 24px;cursor:pointer;box-shadow:var(--shadow);transition:all .22s;overflow:hidden;
}
.ch-card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--red) 45%,var(--line));box-shadow:0 10px 26px rgba(120,60,30,.16);}
.ch-card .no{
  font-family:"Noto Serif CJK SC","Songti SC",serif;font-size:15px;letter-spacing:2px;
  color:var(--red);display:inline-flex;align-items:center;gap:6px;
}
.ch-card h3{font-size:18.5px;margin:8px 0 10px;letter-spacing:.5px;}
.ch-card .secs{font-size:12.5px;color:var(--muted);line-height:1.9;}
.ch-card .foot{display:flex;align-items:center;gap:8px;margin-top:14px;}
.ch-card .corner{
  position:absolute;right:-18px;top:-18px;width:78px;height:78px;border-radius:50%;
  background:var(--gold-soft);
}
.tag{
  display:inline-block;font-size:11px;letter-spacing:.5px;padding:2.5px 10px;border-radius:999px;
  background:var(--gold-soft);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);
  margin:2px 4px 2px 0;cursor:pointer;transition:all .15s;user-select:none;
}
.tag:hover,.tag.on{background:var(--red);color:#fff;border-color:var(--red);}
.tl-entry{
  margin-top:26px;display:flex;align-items:center;gap:22px;cursor:pointer;
  background:linear-gradient(120deg,var(--paper),color-mix(in srgb,var(--gold) 10%,var(--paper)));
  border:1px solid var(--line);border-radius:var(--radius);padding:24px 28px;box-shadow:var(--shadow);
  transition:all .22s;
}
.tl-entry:hover{transform:translateY(-3px);border-color:var(--gold);}
.tl-entry .ico{width:52px;height:52px;flex:none;border-radius:14px;background:var(--red-soft);
  display:flex;align-items:center;justify-content:center;color:var(--red);}
.tl-entry h3{margin:0 0 4px;font-size:18px;}
.tl-entry p{margin:0;font-size:13px;color:var(--muted);}
.tl-entry .arrow{margin-left:auto;color:var(--muted);}

/* chapter view */
.ch-head{
  background:var(--paper);border:1px solid var(--line);border-radius:18px;
  padding:30px 34px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.ch-head:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
  background:linear-gradient(180deg,var(--red),var(--gold));}
.ch-head .no{color:var(--red);letter-spacing:3px;font-size:14px;font-weight:700;}
.ch-head h1{font-size:29px;margin:8px 0 12px;letter-spacing:1.5px;}
.ch-head .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px;}
.ch-head .nav-btns{margin-left:auto;display:flex;gap:8px;}
.crumbs{font-size:12.5px;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:8px;}
.crumbs a{color:var(--muted);cursor:pointer;text-decoration:none;}
.crumbs a:hover{color:var(--red);}

.sec-block{margin-top:30px;}
.sec-head{
  display:flex;align-items:center;gap:12px;margin:0 0 14px;
}
.sec-head h2{font-size:19px;margin:0;letter-spacing:1px;}
.sec-head .badge{
  font-size:11px;color:#fff;background:var(--red);border-radius:999px;padding:2.5px 11px;letter-spacing:1.5px;
}
.sec-head .line{flex:1;height:1px;background:var(--line);}

.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  margin:14px 0;box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .2s,border-color .2s;
}
.card:hover{border-color:color-mix(in srgb,var(--gold) 40%,var(--line));}
.card-head{
  display:flex;align-items:flex-start;gap:12px;padding:16px 20px;cursor:pointer;user-select:none;
}
.card-head h4{margin:0;font-size:16.5px;letter-spacing:.5px;line-height:1.6;}
.card-head .tagrow{margin-top:6px;}
.card-head .tools{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none;}
.pill-btn{
  border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;
  font-size:11px;padding:3px 11px;cursor:pointer;transition:all .15s;letter-spacing:1px;
}
.pill-btn:hover{border-color:var(--red);color:var(--red);}
.pill-btn.done{background:var(--red);border-color:var(--red);color:#fff;}
.chev{transition:transform .25s;color:var(--muted);}
.card.collapsed .chev{transform:rotate(-90deg);}
.card-body{padding:2px 24px 20px;border-top:1px dashed var(--line);}
.card.collapsed .card-body{display:none;}
.card-body p{margin:10px 0;font-size:var(--content-size);}
.card-body h5{font-size:15.5px;margin:20px 0 8px;color:var(--red-deep);}
html[data-theme="dark"] .card-body h5{color:var(--gold);}
.card-body ul.md-list,.card-body ol.md-list{margin:8px 0;padding-left:22px;}
.card-body li{margin:5px 0;font-size:var(--content-size);}
.card-body li::marker{color:var(--gold);}
.card-body .li-cont{margin:4px 0;font-size:var(--content-size);}
.card-body strong{color:var(--red-deep);}
html[data-theme="dark"] .card-body strong{color:var(--gold);}
.card-body em{font-style:normal;background:linear-gradient(transparent 62%,var(--gold-soft) 62%);}
.card-body code{background:var(--gold-soft);padding:1px 6px;border-radius:5px;font-size:.92em;}
.card-body hr{border:none;border-top:1px dashed var(--line);margin:22px 0;}
.card-body blockquote{
  margin:14px 0;padding:14px 20px;border-left:4px solid var(--red);
  background:var(--red-soft);border-radius:0 12px 12px 0;
}
.card-body blockquote p{margin:6px 0;}
.table-wrap{overflow-x:auto;margin:14px 0;}
table{border-collapse:collapse;width:100%;font-size:13.5px;}
th,td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top;}
th{background:var(--gold-soft);white-space:nowrap;font-weight:700;}
tr:nth-child(even) td{background:color-mix(in srgb,var(--gold) 5%,transparent);}
mark.hit{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 2px;}
mark.hit.current{background:var(--red);color:#fff;}

.ch-foot-nav{display:flex;justify-content:space-between;gap:14px;margin-top:34px;}
.ch-foot-nav .btn{flex:1;max-width:46%;}

/* timeline view */
.tl-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:18px 0 6px;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--paper);}
.seg button{border:none;background:none;padding:8px 16px;font-size:13px;color:var(--muted);cursor:pointer;transition:all .15s;}
.seg button.on{background:var(--red);color:#fff;}
.tl-wrap{margin-top:22px;}
.tl-vertical{position:relative;padding-left:26px;}
.tl-vertical:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg,var(--red),var(--gold));opacity:.55;}
.tl-node{position:relative;margin:0 0 14px;}
.tl-node .dot{position:absolute;left:-26px;top:16px;width:13px;height:13px;border-radius:50%;
  background:var(--paper);border:3px solid var(--red);}
.tl-node .head{
  display:flex;align-items:center;gap:12px;cursor:pointer;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 18px;
  transition:all .18s;
}
.tl-node .head:hover{border-color:var(--red);transform:translateX(3px);}
.tl-node .year{font-family:"Noto Serif CJK SC","Songti SC",serif;color:var(--red);font-size:15px;font-weight:700;min-width:96px;}
.tl-node .t{font-size:15px;font-weight:600;}
.tl-node .chev{margin-left:auto;}
.tl-node .detail{display:none;margin:8px 0 4px 22px;padding:14px 18px;
  background:var(--red-soft);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;font-size:13.5px;}
.tl-node.open .detail{display:block;animation:fadeUp .3s ease both;}
.tl-node.open .chev{transform:rotate(180deg);}
.tl-horizontal{overflow-x:auto;padding:12px 4px 22px;}
.tl-track{display:flex;gap:0;min-width:max-content;position:relative;padding-top:44px;}
.tl-track:before{content:"";position:absolute;left:0;right:0;top:28px;height:3px;
  background:linear-gradient(90deg,var(--red),var(--gold));opacity:.5;}
.tl-h-node{position:relative;width:172px;flex:none;text-align:center;cursor:pointer;padding:0 8px;}
.tl-h-node .dot{width:14px;height:14px;border-radius:50%;margin:6px auto 10px;position:relative;z-index:1;
  background:var(--paper);border:3px solid var(--red);transition:transform .18s;}
.tl-h-node:hover .dot{transform:scale(1.35);}
.tl-h-node .y{font-family:"Noto Serif CJK SC","Songti SC",serif;color:var(--red);font-size:13.5px;font-weight:700;}
.tl-h-node .t{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:3px;}
.tl-h-node.on .t{color:var(--red);font-weight:700;}
.tl-detail-panel{
  margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 24px;box-shadow:var(--shadow);
}
.tl-detail-panel h3{margin:0 0 8px;font-size:18px;}
.tl-cards{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin-top:18px;}
.tl-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;
  box-shadow:var(--shadow);transition:all .2s;}
.tl-card:hover{transform:translateY(-3px);border-color:var(--gold);}
.tl-card .y{font-family:"Noto Serif CJK SC","Songti SC",serif;color:var(--red);font-weight:700;font-size:15px;}
.tl-card h4{margin:6px 0 8px;font-size:16px;}
.tl-card p{margin:0;font-size:13px;color:var(--muted);line-height:1.9;}

/* search results */
#searchPanel{
  display:none;position:absolute;top:46px;right:0;width:420px;max-height:60vh;overflow-y:auto;
  background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:10px;z-index:80;
}
#searchPanel.show{display:block;}
.s-res{padding:10px 12px;border-radius:10px;cursor:pointer;}
.s-res:hover{background:var(--red-soft);}
.s-res .t{font-size:13.5px;font-weight:700;}
.s-res .s{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.7;}
.s-empty{padding:14px;color:var(--muted);font-size:13px;text-align:center;}
.filter-note{display:none;align-items:center;gap:10px;margin:16px 0 0;padding:10px 16px;
  background:var(--gold-soft);border:1px dashed var(--gold);border-radius:11px;font-size:12.5px;}
.filter-note.show{display:flex;}

/* back to top */
#topBtn{position:fixed;right:26px;bottom:26px;z-index:65;width:46px;height:46px;border-radius:50%;
  border:1px solid var(--line);background:var(--paper);color:var(--red);font-size:18px;cursor:pointer;
  box-shadow:var(--shadow);display:none;transition:all .2s;}
#topBtn:hover{background:var(--red);color:#fff;}

/* sidebar drawer for mobile */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45;}
.overlay.show{display:block;}

/* print */
@media print{
  .topbar,.sidebar,#progressBar,#topBtn,.overlay,.ch-head .nav-btns,.card-head .tools,
  .tl-toolbar,.ch-foot-nav,.crumbs .btn{display:none !important;}
  body{background:#fff;color:#000;}
  .main{margin:0;padding:0;max-width:none;}
  .card{box-shadow:none;break-inside:avoid;border:1px solid #ccc;}
  .card-body{display:block !important;}
  .hero{background:#fff;color:#000;border:1px solid #ccc;}
  .hero:after{display:none;}
  a{text-decoration:none;color:#000;}
}

/* responsive */
@media (max-width:1020px){
  .sidebar{transform:translateX(-100%);transition:transform .28s;box-shadow:var(--shadow);}
  .sidebar.open{transform:none;}
  .main{margin-left:0;padding:78px 16px 100px;}
  #menuBtn{display:inline-flex;}
  .hero{padding:34px 24px;}
  .hero h1{font-size:27px;}
  .hero:after{font-size:120px;right:6px;}
  #searchInput{width:130px;}
  #searchInput:focus{width:170px;}
  #searchPanel{width:min(88vw,420px);right:-6px;}
  .brand span{display:none;}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none !important;transition:none !important;}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="btn icon" id="menuBtn" title="目录">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

。<\/span>\n<\/li>\n<li><span class=\"li-text\">19 世纪末资本主义进入帝国主义阶段后，资本输出成为殖民剥削的重要形式。<\/span>\n<\/li><\/ul>"}, {"title": "三、鸦片战争的爆发", "tags": ["会议", "条约文献", "战争战役", "土地问题"], "text": "\n- 1840 年，英国发动鸦片战争。\n- 1842 年，签订中英《南京条约》。\n- 1856 年，英、法发动第二次鸦片战争（1860 年英法联军火烧圆明园）；1895 年，日本强迫清政府签订《马关条约》，割去台湾全岛及所有附属各岛屿和澎湖列岛，并允许日本在中国设厂，此后列强开始大规模对华资本输出；1900 年，八国联军侵华，战后签订《辛丑条约》。\n\n （一）鸦片战争是中国近代史的起点\n\n 论述题：为什么说鸦片战争是中国近代史的起点？\n\n 随着外国资本主义的入侵，中国的封建社会逐步变为半殖民地半封建社会。中国人民逐渐开始了反帝反封建的资产阶级民主革命。鸦片战争成为中国近代史的起点。\n\n 鸦片战争后五口通商和西方商品的倾销，促使中国自给自足的自然经济开始解体、主权独立受到侵犯，这也是鸦片战争成为近代史起点的重要依据。\n\n （二）近代中国的半殖民地半封建性质\n\n中国半殖民地半封建社会的特点：\n\n政治方面：\n\n1. 资本—帝国主义不但操纵中国的财政和经济命脉，而且控制了中国的政治，日益成为支配中国的决定性力量；\n2. 中国的封建势力同外国侵略势力相勾结，成为外国列强奴役中国人民的社会基础和统治支柱（中外反动势力对中国人民实行联合专政）。\n\n经济方面：\n\n1. 中国自然经济的基础虽然遭到破坏，但封建剥削制度的根基即封建地主的土地所有制依然存在，成为中国发展进步的严重障碍；\n2. 中国资本主义经济有所发展，在中国政治、文化生活中有一定作用，但发展很缓慢，力量很软弱。\n\n社会方面：\n\n1. 在列强争夺和间接统治下，加之地方性农业经济所形成的地方割据势力的存在，造成了近代中国经济、政治和文化发展的极不平衡性；\n2. 在资本—帝国主义和封建主义的双重压迫下（后来还加上官僚资本主义的压迫），人民群众毫无政治权利，生活极端贫困化。\n\n （三）近代中国社会阶级关系的变化\n\n1. 旧的被统治阶级是农民阶级，仍是近代中国社会人数最多的被剥削阶级。近代中国的农民是中国革命的主力军。\n2. 旧的封建统治阶级即地主阶级继续占有大量土地，掌握着国家政权，对人民实行专制统治。\n3. 新兴的被压迫阶级是工人阶级。它的来源主要是城乡破产失业的农民、手工业者和城市贫民。\n4. 近代中国新产生的阶级是资产阶级，是在外国资本主义入侵的影响和刺激下，主要由一些买办、商人、地主、官僚投资新式企业转化而来。分为官僚资产阶级和民族资产阶级（民族资产阶级具有革命性和软弱性的两面性特征）。\n\n中国工人阶级的特点：\n\n1. 深受帝国主义、封建势力和资产阶级的三重压迫和剥削，革命性最强；\n2. 人数虽少，但相对集中，便于形成革命的力量和传播先进思想；\n3. 与农民有天然的联系，便于结成工农联盟；\n4. 因此，中国工人阶级是近代中国社会中最先进、最革命、最有力量的阶级。\n\n （四）近代中国的社会主要矛盾和两大历史任务\n\n- 在诸多矛盾中，占支配地位的主要矛盾是帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾。这两对主要矛盾及其斗争贯穿中国半殖民地半封建社会的始终，并对中国近代社会的发展变化起决定性作用。\n- 两对主要矛盾互相交织，其中帝国主义和中华民族的矛盾是最主要的矛盾。\n  1. 当外国列强向中国发动侵略战争时，民族矛盾上升为主要矛盾；\n  2. 当外国列强同封建政权勾结、共同镇压中国革命时，阶级矛盾上升为主要矛盾；\n  3. 当国内战争威胁帝国主义和封建主义的统治时，帝国主义和封建主义完全勾结。\n\n近代中国社会的主要矛盾决定了两大历史任务：\n\n1. 争得民族独立和人民解放；\n2. 实现国家富强和人民幸福。\n\n 两大历史任务的区别与联系：二者既相互区别，又相互联系。区别在于：前者要改变民族遭压迫、人民受剥削的地位和状况，是要从根本上解决生产关系问题；后者是要改变近代中国经济、文化和社会落后的地位和状况，是要解决生产力问题。联系在于：只有完成第一大任务，才能为第二大任务的完成创造条件。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">1840 年，英国发动鸦片战争。<\/span>\n<\/li>\n<li><span class=\"li-text\">1842 年，签订中英《南京条约》。<\/span>\n<\/li>\n<li><span class=\"li-text\">1856 年，英、法发动第二次鸦片战争（1860 年英法联军火烧圆明园）；1895 年，日本强迫清政府签订《马关条约》，割去台湾全岛及所有附属各岛屿和澎湖列岛，并允许日本在中国设厂，此后列强开始大规模对华资本输出；1900 年，八国联军侵华，战后签订《辛丑条约》。<\/span>\n<\/li><\/ul>\n<section class=\"lvl-5\">\n<h5>（一）鸦片战争是中国近代史的起点<\/h5>\n<blockquote><p><strong>论述题：为什么说鸦片战争是中国近代史的起点？<\/strong><\/p>\n<p>随着外国资本主义的入侵，中国的封建社会逐步变为半殖民地半封建社会。中国人民逐渐开始了反帝反封建的资产阶级民主革命。鸦片战争成为中国近代史的起点。<\/p>\n<p>鸦片战争后五口通商和西方商品的倾销，促使中国自给自足的自然经济开始解体、主权独立受到侵犯，这也是鸦片战争成为近代史起点的重要依据。<\/p><\/blockquote>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）近代中国的半殖民地半封建性质<\/h5>\n<p><strong>中国半殖民地半封建社会的特点：<\/strong><\/p>\n<p><em>政治方面：<\/em><\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">资本—帝国主义不但操纵中国的财政和经济命脉，而且控制了中国的政治，日益成为支配中国的决定性力量；<\/span>\n<\/li>\n<li><span class=\"li-text\">中国的封建势力同外国侵略势力相勾结，成为外国列强奴役中国人民的社会基础和统治支柱（中外反动势力对中国人民实行联合专政）。<\/span>\n<\/li><\/ol>\n<p><em>经济方面：<\/em><\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">中国自然经济的基础虽然遭到破坏，但封建剥削制度的根基即封建地主的土地所有制依然存在，成为中国发展进步的严重障碍；<\/span>\n<\/li>\n<li><span class=\"li-text\">中国资本主义经济有所发展，在中国政治、文化生活中有一定作用，但发展很缓慢，力量很软弱。<\/span>\n<\/li><\/ol>\n<p><em>社会方面：<\/em><\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">在列强争夺和间接统治下，加之地方性农业经济所形成的地方割据势力的存在，造成了近代中国经济、政治和文化发展的极不平衡性；<\/span>\n<\/li>\n<li><span class=\"li-text\">在资本—帝国主义和封建主义的双重压迫下（后来还加上官僚资本主义的压迫），人民群众毫无政治权利，生活极端贫困化。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）近代中国社会阶级关系的变化<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">旧的被统治阶级是农民阶级，仍是近代中国社会人数最多的被剥削阶级。近代中国的农民是中国革命的主力军。<\/span>\n<\/li>\n<li><span class=\"li-text\">旧的封建统治阶级即地主阶级继续占有大量土地，掌握着国家政权，对人民实行专制统治。<\/span>\n<\/li>\n<li><span class=\"li-text\">新兴的被压迫阶级是工人阶级。它的来源主要是城乡破产失业的农民、手工业者和城市贫民。<\/span>\n<\/li>\n<li><span class=\"li-text\">近代中国新产生的阶级是资产阶级，是在外国资本主义入侵的影响和刺激下，主要由一些买办、商人、地主、官僚投资新式企业转化而来。分为官僚资产阶级和民族资产阶级（民族资产阶级具有革命性和软弱性的两面性特征）。<\/span>\n<\/li><\/ol>\n<p><strong>中国工人阶级的特点：<\/strong><\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">深受帝国主义、封建势力和资产阶级的三重压迫和剥削，革命性最强；<\/span>\n<\/li>\n<li><span class=\"li-text\">人数虽少，但相对集中，便于形成革命的力量和传播先进思想；<\/span>\n<\/li>\n<li><span class=\"li-text\">与农民有天然的联系，便于结成工农联盟；<\/span>\n<\/li>\n<li><span class=\"li-text\">因此，中国工人阶级是近代中国社会中最先进、最革命、最有力量的阶级。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（四）近代中国的社会主要矛盾和两大历史任务<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">在诸多矛盾中，占支配地位的主要矛盾是帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾。这两对主要矛盾及其斗争贯穿中国半殖民地半封建社会的始终，并对中国近代社会的发展变化起决定性作用。<\/span>\n<\/li>\n<li><span class=\"li-text\">两对主要矛盾互相交织，其中帝国主义和中华民族的矛盾是最主要的矛盾。<\/span>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">当外国列强向中国发动侵略战争时，民族矛盾上升为主要矛盾；<\/span>\n<\/li>\n<li><span class=\"li-text\">当外国列强同封建政权勾结、共同镇压中国革命时，阶级矛盾上升为主要矛盾；<\/span>\n<\/li>\n<li><span class=\"li-text\">当国内战争威胁帝国主义和封建主义的统治时，帝国主义和封建主义完全勾结。<\/span>\n<\/li><\/ol>\n<\/li><\/ul>\n<p><strong>近代中国社会的主要矛盾决定了两大历史任务：<\/strong><\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">争得民族独立和人民解放；<\/span>\n<\/li>\n<li><span class=\"li-text\">实现国家富强和人民幸福。<\/span>\n<\/li><\/ol>\n<blockquote><p><strong>两大历史任务的区别与联系<\/strong>：二者既相互区别，又相互联系。区别在于：前者要改变民族遭压迫、人民受剥削的地位和状况，是要从根本上解决生产关系问题；后者是要改变近代中国经济、文化和社会落后的地位和状况，是要解决生产力问题。联系在于：只有完成第一大任务，才能为第二大任务的完成创造条件。<\/p><\/blockquote>\n<\/section>"}]}, {"title": "第二节 西方列强对中国的侵略", "blocks": [{"title": "一、军事侵略", "tags": ["条约文献", "战争战役"], "text": "\n- 发动侵略战争，屠杀中国人民（如甲午战争中的旅顺大屠杀、八国联军侵华期间的北京大屠杀等）；\n- 侵占中国领土，划分势力范围（《南京条约》割香港岛，《北京条约》割九龙司地方一区，《马关条约》割台湾全岛及所有附属各岛屿、澎湖列岛；19 世纪末列强掀起瓜分狂潮，纷纷划分势力范围）；近代史上侵占我国领土最多的国家是俄国；19 世纪末，美国提出\"门户开放\"政策，要求利益均沾；\n- 勒索赔款，抢掠财富（《南京条约》赔款 2100 万银元，《马关条约》赔款 2 亿两白银，《辛丑条约》赔款 4.5 亿两白银，本息合计约 9.8 亿两）。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">发动侵略战争，屠杀中国人民（如甲午战争中的旅顺大屠杀、八国联军侵华期间的北京大屠杀等）；<\/span>\n<\/li>\n<li><span class=\"li-text\">侵占中国领土，划分势力范围（《南京条约》割香港岛，《北京条约》割九龙司地方一区，《马关条约》割台湾全岛及所有附属各岛屿、澎湖列岛；19 世纪末列强掀起瓜分狂潮，纷纷划分势力范围）；<strong>近代史上侵占我国领土最多的国家是俄国<\/strong>；19 世纪末，美国提出\"门户开放\"政策，要求利益均沾；<\/span>\n<\/li>\n<li><span class=\"li-text\">勒索赔款，抢掠财富（《南京条约》赔款 2100 万银元，《马关条约》赔款 2 亿两白银，《辛丑条约》赔款 4.5 亿两白银，本息合计约 9.8 亿两）。<\/span>\n<\/li><\/ul>"}, {"title": "二、政治控制", "tags": ["条约文献", "时间节点"], "text": "\n- 控制中国的内政、外交（破坏司法主权，攫取领事裁判权、片面最惠国待遇，控制中国海关）；\n- 镇压中国人民的反抗（镇压太平天国运动、义和团运动等）；\n- 1901 年《辛丑条约》还强迫清政府承诺永远禁止中国人成立或加入任何反对列强的组织，规定清政府各级官员如对人民反抗斗争\"弹压惩办\"不力，\"即行革职，永不叙用\"；\n- 扶植、收买代理人（先后扶植清政府、北洋军阀势力作为统治中国的工具）。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">控制中国的内政、外交（破坏司法主权，攫取领事裁判权、片面最惠国待遇，控制中国海关）；<\/span>\n<\/li>\n<li><span class=\"li-text\">镇压中国人民的反抗（镇压太平天国运动、义和团运动等）；<\/span>\n<\/li>\n<li><span class=\"li-text\">1901 年《辛丑条约》还强迫清政府承诺永远禁止中国人成立或加入任何反对列强的组织，规定清政府各级官员如对人民反抗斗争\"弹压惩办\"不力，\"即行革职，永不叙用\"；<\/span>\n<\/li>\n<li><span class=\"li-text\">扶植、收买代理人（先后扶植清政府、北洋军阀势力作为统治中国的工具）。<\/span>\n<\/li><\/ul>"}, {"title": "三、经济掠夺", "tags": ["战争战役", "经济建设"], "text": "\n- 控制中国的通商口岸；\n- 剥夺中国的关税自主权；\n- 实行商品倾销和资本输出（甲午战争后，资本输出成为主要形式：设立银行、争夺铁路修筑权和矿山开采权、开设工厂）；\n- 操纵中国的经济命脉。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">控制中国的通商口岸；<\/span>\n<\/li>\n<li><span class=\"li-text\">剥夺中国的关税自主权；<\/span>\n<\/li>\n<li><span class=\"li-text\">实行商品倾销和资本输出（甲午战争后，资本输出成为主要形式：设立银行、争夺铁路修筑权和矿山开采权、开设工厂）；<\/span>\n<\/li>\n<li><span class=\"li-text\">操纵中国的经济命脉。<\/span>\n<\/li><\/ul>"}, {"title": "四、文化渗透", "tags": ["思想理论"], "text": "\n- 披着宗教外衣进行侵略活动（传教）；\n- 为侵略中国制造舆论（创办报刊、开设学堂、吸引留学生）。\n- 目的：宣扬殖民主义奴化思想，麻醉中国人民的精神，摧毁中国人的民族自尊心和自信心。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">披着宗教外衣进行侵略活动（传教）；<\/span>\n<\/li>\n<li><span class=\"li-text\">为侵略中国制造舆论（创办报刊、开设学堂、吸引留学生）。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>目的<\/strong>：宣扬殖民主义奴化思想，麻醉中国人民的精神，摧毁中国人的民族自尊心和自信心。<\/span>\n<\/li><\/ul>"}]}, {"title": "第三节 反抗外国武装侵略的斗争", "blocks": [{"title": "一、抵御外来侵略的斗争历程", "tags": ["战争战役", "抗日战争", "时间节点"], "text": "\n- 人民群众的反侵略斗争：1841 年 5 月，三元里抗英（近代史上中国人民第一次大规模的反侵略武装斗争）；太平军抗击外国侵略者；台湾人民反抗日本、法国侵略的斗争；义和团抗击八国联军。\n- 爱国官兵的反侵略斗争：关天培战死虎门（鸦片战争）；左宗棠收复新疆；冯子材取得镇南关大捷；黄海海战中邓世昌、林永升等官兵壮烈殉国，丁汝昌、刘步蟾等将领以身殉国。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>人民群众的反侵略斗争<\/strong>：1841 年 5 月，三元里抗英（近代史上中国人民第一次大规模的反侵略武装斗争）；太平军抗击外国侵略者；台湾人民反抗日本、法国侵略的斗争；义和团抗击八国联军。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>爱国官兵的反侵略斗争<\/strong>：关天培战死虎门（鸦片战争）；左宗棠收复新疆；冯子材取得镇南关大捷；黄海海战中邓世昌、林永升等官兵壮烈殉国，丁汝昌、刘步蟾等将领以身殉国。<\/span>\n<\/li><\/ul>"}, {"title": "二、义和团运动与列强瓜分中国图谋的破产", "tags": ["战争战役", "思想理论", "时间节点"], "text": "\n- 边疆危机和瓜分危机：19 世纪 70 至 80 年代，列强从侵占中国周边邻国发展到蚕食中国边疆地区，使中国陷入\"边疆危机\"。帝国主义瓜分中国的图谋，在 1894 年中日甲午战争爆发后达到高潮。\n\n 列强瓜分中国图谋破产的原因是什么？\n\n 1. 帝国主义列强之间的矛盾和相互制约，是重要原因；\n 2. 中国人民进行了不屈不挠的反侵略斗争，是根本原因。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>边疆危机和瓜分危机<\/strong>：19 世纪 70 至 80 年代，列强从侵占中国周边邻国发展到蚕食中国边疆地区，使中国陷入\"边疆危机\"。帝国主义瓜分中国的图谋，在 1894 年中日甲午战争爆发后达到高潮。<\/span>\n<\/li><\/ul>\n<blockquote><p><strong>列强瓜分中国图谋破产的原因是什么？<\/strong><\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">帝国主义列强之间的矛盾和相互制约，是重要原因；<\/span>\n<\/li>\n<li><span class=\"li-text\">中国人民进行了不屈不挠的反侵略斗争，是根本原因。<\/span>\n<\/li><\/ol><\/blockquote>"}]}, {"title": "第四节 反侵略战争的失败与民族意识的觉醒", "blocks": [{"title": "一、反侵略战争的失败及其原因", "tags": ["战争战役", "经济建设"], "text": "\n1. 社会制度的腐败——根本原因；\n2. 经济技术的落后——重要原因（中国近代史上落后挨打的根子就是经济技术的落后）。\n", "html": "<ol class=\"md-list\">\n<li><span class=\"li-text\">社会制度的腐败——<strong>根本原因<\/strong>；<\/span>\n<\/li>\n<li><span class=\"li-text\">经济技术的落后——重要原因（中国近代史上落后挨打的根子就是经济技术的落后）。<\/span>\n<\/li><\/ol>"}, {"title": "二、民族意识的觉醒", "tags": ["人物", "战争战役", "思想理论", "时间节点"], "text": "\n- 鸦片战争以后，先进的中国人开始睁眼看世界；中日甲午战争以后，中国人民的民族意识开始普遍觉醒。\n- 林则徐是近代中国睁眼看世界的第一人（主持编译《四洲志》等）。\n- 魏源编撰《海国图志》，提出\"师夷长技以制夷\"的思想，开创了中国近代向西方学习的新风。\n- 1895 年，严复在《救亡决论》中响亮喊出\"救亡\"的口号；他翻译的《天演论》（1898 年正式出版），用物竞天择、适者生存的社会进化论思想，激发人们的危机意识和民族意识。\n\n---\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">鸦片战争以后，先进的中国人开始睁眼看世界；中日甲午战争以后，中国人民的民族意识开始普遍觉醒。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>林则徐<\/strong>是近代中国睁眼看世界的第一人（主持编译《四洲志》等）。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>魏源<\/strong>编撰《海国图志》，提出\"师夷长技以制夷\"的思想，开创了中国近代向西方学习的新风。<\/span>\n<\/li>\n<li><span class=\"li-text\">1895 年，<strong>严复<\/strong>在《救亡决论》中响亮喊出\"救亡\"的口号；他翻译的《天演论》（1898 年正式出版），用物竞天择、适者生存的社会进化论思想，激发人们的危机意识和民族意识。<\/span>\n<\/li><\/ul>\n<hr/>"}]}]}, {"num": "第二章", "title": "第二章 不同社会力量对国家出路的早期探索", "name": "不同社会力量对国家出路的早期探索", "sections": [{"title": "第一节 太平天国运动的起落", "blocks": [{"title": "一、太平天国农民战争", "tags": ["人物", "战争战役", "土地问题", "思想理论"], "text": "\n太平天国农民战争爆发的根本原因：一是封建专制政权和地主阶级对农民的政治压迫和经济剥削（根本原因）；二是鸦片战争带来的恶果，使中国社会的阶级矛盾普遍激化。\n\n （一）金田起义\n\n- 1851 年 1 月，洪秀全率领拜上帝教教众在广西桂平县金田村发动起义，建号太平天国。\n- 1853 年 3 月，占领南京，改名天京，定为首都，正式宣告太平天国农民政权的建立。\n- 太平军所进行的战争，是一次反对清政府腐朽统治和地主阶级压迫剥削的正义战争。\n\n （二）《天朝田亩制度》\n\n- 1853 年颁布，是最能体现太平天国理想和这次农民起义特色的纲领性文件，实际上是一个以解决土地问题为中心的比较完整的社会改革方案。\n- 其所要建立的理想社会是\"有田同耕、有饭同食、有衣同穿、有钱同使，无处不均匀，无人不饱暖\"。\n- 积极性：代表了农民要求平均分配土地的强烈愿望，反映了农民反对封建土地所有制的普遍要求；与以往农民起义相比，有更完备的内容，深刻触及了封建社会矛盾的核心。\n- 局限性：没有超出农民小生产者的狭隘眼界，它所追求的理想天国，是不切实际的空想。\n\n （三）《资政新篇》\n\n- 1859 年，洪仁玕的《资政新篇》是一个具有资本主义色彩的方案，反映出太平天国具有不同于以往农民战争的历史特点。\n- 局限性：未涉及农民问题和土地问题，缺乏实施的阶级基础和社会条件。\n\n （四）从天京事变到太平天国败亡\n\n- 1856 年，发生了太平天国内部自相残杀的天京事变，成为太平天国由盛转衰的转折点。\n- 1864 年 7 月，天京陷落，太平天国运动失败。\n", "html": "<p><strong>太平天国农民战争爆发的根本原因<\/strong>：一是封建专制政权和地主阶级对农民的政治压迫和经济剥削（根本原因）；二是鸦片战争带来的恶果，使中国社会的阶级矛盾普遍激化。<\/p>\n<section class=\"lvl-5\">\n<h5>（一）金田起义<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1851 年 1 月，洪秀全率领拜上帝教教众在广西桂平县金田村发动起义，建号太平天国。<\/span>\n<\/li>\n<li><span class=\"li-text\">1853 年 3 月，占领南京，改名天京，定为首都，正式宣告太平天国农民政权的建立。<\/span>\n<\/li>\n<li><span class=\"li-text\">太平军所进行的战争，是一次反对清政府腐朽统治和地主阶级压迫剥削的正义战争。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）《天朝田亩制度》<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1853 年颁布，是<strong>最能体现太平天国理想和这次农民起义特色的纲领性文件<\/strong>，实际上是一个以解决土地问题为中心的比较完整的社会改革方案。<\/span>\n<\/li>\n<li><span class=\"li-text\">其所要建立的理想社会是\"有田同耕、有饭同食、有衣同穿、有钱同使，无处不均匀，无人不饱暖\"。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>积极性<\/strong>：代表了农民要求平均分配土地的强烈愿望，反映了农民反对封建土地所有制的普遍要求；与以往农民起义相比，有更完备的内容，深刻触及了封建社会矛盾的核心。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>局限性<\/strong>：没有超出农民小生产者的狭隘眼界，它所追求的理想天国，是不切实际的空想。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）《资政新篇》<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1859 年，洪仁玕的《资政新篇》是一个具有资本主义色彩的方案，反映出太平天国具有不同于以往农民战争的历史特点。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>局限性<\/strong>：未涉及农民问题和土地问题，缺乏实施的阶级基础和社会条件。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（四）从天京事变到太平天国败亡<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1856 年，发生了太平天国内部自相残杀的<strong>天京事变<\/strong>，成为太平天国由盛转衰的转折点。<\/span>\n<\/li>\n<li><span class=\"li-text\">1864 年 7 月，天京陷落，太平天国运动失败。<\/span>\n<\/li><\/ul>\n<\/section>"}, {"title": "二、农民斗争的意义和局限", "tags": ["战争战役", "土地问题", "思想理论"], "text": "\n （一）历史意义\n\n1. 太平天国起义沉重打击了封建统治，强烈撼动了清政府的统治根基；\n2. 太平天国起义是中国旧式农民战争的最高峰；\n3. 太平天国起义冲击了孔子和儒家经典的正统权威，在一定程度上削弱了封建统治的精神支柱；\n4. 太平天国起义有力打击了外国侵略势力；\n5. 与其他亚洲国家的民族解放运动一起，冲击了西方殖民主义者在亚洲的统治。\n\n （二）失败原因\n\n主观原因——农民阶级的阶级局限性：\n\n1. 农民阶级不是新的生产力和生产关系的代表，无法克服小生产者所固有的阶级局限性，缺乏科学思想理论的指导，没有先进阶级的领导，因而无法从根本上提出完整的、正确的政治纲领和社会改革方案；\n2. 太平天国后期无法制止和克服领导集团自身腐败现象的滋生；\n3. 太平天国军事战略上出现了重大失误（如未能与捻军结成同盟，以致北伐失败）；\n4. 以宗教来发动组织群众，但拜上帝教教义不仅没能正确指导斗争，反而给农民战争带来了危害；\n5. 未能正确对待儒学；\n6. 对西方资本主义侵略者缺乏理性认识。\n\n客观原因：中外反动势力强大。\n\n 结论：太平天国起义及其失败表明，在半殖民地半封建的中国，农民具有伟大的革命潜力，但他们自身不能担负起领导反帝反封建的斗争取得胜利的重任；单纯的农民战争不能完成争取民族独立和人民解放的历史任务。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）历史意义<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">太平天国起义沉重打击了封建统治，强烈撼动了清政府的统治根基；<\/span>\n<\/li>\n<li><span class=\"li-text\">太平天国起义是中国旧式农民战争的最高峰；<\/span>\n<\/li>\n<li><span class=\"li-text\">太平天国起义冲击了孔子和儒家经典的正统权威，在一定程度上削弱了封建统治的精神支柱；<\/span>\n<\/li>\n<li><span class=\"li-text\">太平天国起义有力打击了外国侵略势力；<\/span>\n<\/li>\n<li><span class=\"li-text\">与其他亚洲国家的民族解放运动一起，冲击了西方殖民主义者在亚洲的统治。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）失败原因<\/h5>\n<p><em>主观原因——农民阶级的阶级局限性：<\/em><\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">农民阶级不是新的生产力和生产关系的代表，无法克服小生产者所固有的阶级局限性，缺乏科学思想理论的指导，没有先进阶级的领导，因而无法从根本上提出完整的、正确的政治纲领和社会改革方案；<\/span>\n<\/li>\n<li><span class=\"li-text\">太平天国后期无法制止和克服领导集团自身腐败现象的滋生；<\/span>\n<\/li>\n<li><span class=\"li-text\">太平天国军事战略上出现了重大失误（如未能与捻军结成同盟，以致北伐失败）；<\/span>\n<\/li>\n<li><span class=\"li-text\">以宗教来发动组织群众，但拜上帝教教义不仅没能正确指导斗争，反而给农民战争带来了危害；<\/span>\n<\/li>\n<li><span class=\"li-text\">未能正确对待儒学；<\/span>\n<\/li>\n<li><span class=\"li-text\">对西方资本主义侵略者缺乏理性认识。<\/span>\n<\/li><\/ol>\n<p><em>客观原因<\/em>：中外反动势力强大。<\/p>\n<blockquote><p><strong>结论<\/strong>：太平天国起义及其失败表明，在半殖民地半封建的中国，农民具有伟大的革命潜力，但他们自身不能担负起领导反帝反封建的斗争取得胜利的重任；单纯的农民战争不能完成争取民族独立和人民解放的历史任务。<\/p><\/blockquote>\n<\/section>"}]}, {"title": "第二节 洋务运动的兴衰", "blocks": [{"title": "一、洋务事业的兴办", "tags": ["人物", "战争战役", "土地问题", "思想理论"], "text": "\n- 洋务运动是在 19 世纪 60 年代初第二次鸦片战争以后，在清政府镇压太平天国起义和捻军起义的过程中兴起的。\n- 根本目的：挽救清政府的统治危机。洋务派举办洋务事业，首先是为了购买和制造洋枪洋炮以镇压国内农民起义，同时也有借此加强海防边防、并趁机发展本集团政治、经济、军事实力的意图。\n- 指导思想：\"中体西用\"。最先作出比较完整表述的是冯桂芬（《校邠庐抗议》），后在张之洞的《劝学篇》中被进一步概括为\"中学为体，西学为用\"。所谓\"中体西用\"，指以中国的封建伦理纲常所维护的统治秩序为主体，用西方的近代技术和工业为辅助，并以前者来支配后者。\n\n （一）兴办近代企业\n\n- 军用工业（官办）：主要有安庆内军械所（1861 年，最早）、上海江南制造总局、福州船政局、天津机器局等。\n- 民用企业：主要有轮船招商局、开平矿务局、上海机器织布局等。\n- 形式：除少数采取官办和官商合办的形式外，多数采取官督商办。\n- 性质：基本上属于资本主义性质的近代企业。\n\n （二）建立新式海军\n\n- 19 世纪 70—90 年代，分别建成福建水师、广东水师、南洋水师和北洋水师，其中北洋水师是清军主力。\n\n （三）创办新式学堂，派遣留学生\n\n- 新式学堂三种类型：翻译学堂（如京师同文馆，培养翻译人才）、工艺学堂（培养电报、铁路、矿务、西医等专门人才）、军事学堂（如船政学堂，培养新式海军人才）。\n- 派遣赴美幼童和官费赴欧留学生 200 多人。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">洋务运动是在 19 世纪 60 年代初第二次鸦片战争以后，在清政府镇压太平天国起义和捻军起义的过程中兴起的。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>根本目的<\/strong>：挽救清政府的统治危机。洋务派举办洋务事业，首先是为了购买和制造洋枪洋炮以镇压国内农民起义，同时也有借此加强海防边防、并趁机发展本集团政治、经济、军事实力的意图。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>指导思想<\/strong>：\"中体西用\"。最先作出比较完整表述的是冯桂芬（《校邠庐抗议》），后在张之洞的《劝学篇》中被进一步概括为\"中学为体，西学为用\"。所谓\"中体西用\"，指以中国的封建伦理纲常所维护的统治秩序为主体，用西方的近代技术和工业为辅助，并以前者来支配后者。<\/span>\n<\/li><\/ul>\n<section class=\"lvl-5\">\n<h5>（一）兴办近代企业<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>军用工业<\/strong>（官办）：主要有安庆内军械所（1861 年，最早）、上海江南制造总局、福州船政局、天津机器局等。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>民用企业<\/strong>：主要有轮船招商局、开平矿务局、上海机器织布局等。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>形式<\/strong>：除少数采取官办和官商合办的形式外，多数采取官督商办。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>性质<\/strong>：基本上属于资本主义性质的近代企业。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）建立新式海军<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">19 世纪 70—90 年代，分别建成福建水师、广东水师、南洋水师和北洋水师，其中<strong>北洋水师是清军主力<\/strong>。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）创办新式学堂，派遣留学生<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">新式学堂三种类型：翻译学堂（如京师同文馆，培养翻译人才）、工艺学堂（培养电报、铁路、矿务、西医等专门人才）、军事学堂（如船政学堂，培养新式海军人才）。<\/span>\n<\/li>\n<li><span class=\"li-text\">派遣赴美幼童和官费赴欧留学生 200 多人。<\/span>\n<\/li><\/ul>\n<\/section>"}, {"title": "二、洋务运动的历史作用及其失败", "tags": ["战争战役", "思想理论", "经济建设", "时间节点"], "text": "\n （一）历史作用\n\n1. 对外国资本主义侵略具有抵制作用，但又有妥协和勾结；\n2. 对中国民族资本主义的发展有促进作用，但也有阻碍；\n3. 冲击了封建思想和观念，但没能突破封建体制的束缚；\n4. 是近代中国人探索国家出路的一次尝试，给中国带来了新的知识、开阔了人们的眼界，也是中国近代教育的开端，有利于社会风气和价值观念的变化。\n\n （二）失败标志与原因\n\n- 失败标志：1894 年中日甲午战争中北洋水师全军覆没。\n- 失败原因：\n  1. 洋务运动具有封建性；\n  2. 洋务运动对列强有依赖性；\n  3. 洋务企业的管理具有腐朽性。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）历史作用<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">对外国资本主义侵略具有抵制作用，但又有妥协和勾结；<\/span>\n<\/li>\n<li><span class=\"li-text\">对中国民族资本主义的发展有促进作用，但也有阻碍；<\/span>\n<\/li>\n<li><span class=\"li-text\">冲击了封建思想和观念，但没能突破封建体制的束缚；<\/span>\n<\/li>\n<li><span class=\"li-text\">是近代中国人探索国家出路的一次尝试，给中国带来了新的知识、开阔了人们的眼界，也是中国近代教育的开端，有利于社会风气和价值观念的变化。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）失败标志与原因<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>失败标志<\/strong>：1894 年中日甲午战争中北洋水师全军覆没。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>失败原因<\/strong>：<\/span>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">洋务运动具有封建性；<\/span>\n<\/li>\n<li><span class=\"li-text\">洋务运动对列强有依赖性；<\/span>\n<\/li>\n<li><span class=\"li-text\">洋务企业的管理具有腐朽性。<\/span>\n<\/li><\/ol>\n<\/li><\/ul>\n<\/section>"}]}, {"title": "第三节 维新运动的兴起和夭折", "blocks": [{"title": "一、戊戌维新运动的开展", "tags": ["人物", "战争战役", "思想理论", "经济建设"], "text": "\n （一）背景\n\n1. 19 世纪 90 年代后，中国民族资本主义有了初步发展；\n2. 甲午战争惨败，造成了新的民族危机，激发了新的民族觉醒；\n3. 日本向西方学习成效显著，中国人也想向日本学习。\n\n （二）维新派的宣传活动\n\n以康有为、梁启超、谭嗣同、严复等为主要代表人物的资产阶级维新派，采取了下列行动宣传维新主张：\n\n1. 向皇帝上书：如康有为发起\"公车上书\"；\n2. 著书立说：康有为《新学伪经考》《孔子改制考》《人类公理》，梁启超《变法通议》，谭嗣同《仁学》，严复翻译赫胥黎的《天演论》等；\n3. 介绍外国变法的经验教训；\n4. 办学会：如强学会、南学会、保国会等；\n5. 设学堂；\n6. 办报纸：如上海《时务报》、天津《国闻报》、湖南《湘报》等。\n\n （三）维新派与守旧派的论战\n\n- 论战的问题：要不要变法；要不要兴民权、设议院、实行君主立宪；要不要废八股、改科举和兴学堂。\n- 守旧派的代表作是湖广总督张之洞的《劝学篇》。\n- 实质：资产阶级思想与封建主义思想在中国的第一次正面交锋。\n\n （四）百日维新\n\n- 1898 年 6 月 11 日，光绪皇帝颁布《明定国是诏》，是百日维新开始的标志；\n- 1898 年 9 月 21 日，慈禧太后发动戊戌政变，是百日维新结束的标志。\n- 主要内容：政治上，改革行政机构；经济上，保护、奖励农工商业；军事上，裁撤绿营，改练新式陆军；文教上，改革科举制度，废八股，提倡西学。这些新政内容，对中国民族资本主义的发展和资产阶级先进文化科学的传播都是有利的。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）背景<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">19 世纪 90 年代后，中国民族资本主义有了初步发展；<\/span>\n<\/li>\n<li><span class=\"li-text\">甲午战争惨败，造成了新的民族危机，激发了新的民族觉醒；<\/span>\n<\/li>\n<li><span class=\"li-text\">日本向西方学习成效显著，中国人也想向日本学习。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）维新派的宣传活动<\/h5>\n<p>以康有为、梁启超、谭嗣同、严复等为主要代表人物的资产阶级维新派，采取了下列行动宣传维新主张：<\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\"><strong>向皇帝上书<\/strong>：如康有为发起\"公车上书\"；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>著书立说<\/strong>：康有为《新学伪经考》《孔子改制考》《人类公理》，梁启超《变法通议》，谭嗣同《仁学》，严复翻译赫胥黎的《天演论》等；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>介绍外国变法的经验教训<\/strong>；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>办学会<\/strong>：如强学会、南学会、保国会等；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>设学堂<\/strong>；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>办报纸<\/strong>：如上海《时务报》、天津《国闻报》、湖南《湘报》等。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）维新派与守旧派的论战<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>论战的问题<\/strong>：要不要变法；要不要兴民权、设议院、实行君主立宪；要不要废八股、改科举和兴学堂。<\/span>\n<\/li>\n<li><span class=\"li-text\">守旧派的代表作是湖广总督张之洞的《劝学篇》。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>实质<\/strong>：资产阶级思想与封建主义思想在中国的第一次正面交锋。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（四）百日维新<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1898 年 6 月 11 日，光绪皇帝颁布《明定国是诏》，是百日维新开始的标志；<\/span>\n<\/li>\n<li><span class=\"li-text\">1898 年 9 月 21 日，慈禧太后发动戊戌政变，是百日维新结束的标志。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>主要内容<\/strong>：政治上，改革行政机构；经济上，保护、奖励农工商业；军事上，裁撤绿营，改练新式陆军；文教上，改革科举制度，废八股，提倡西学。这些新政内容，对中国民族资本主义的发展和资产阶级先进文化科学的传播都是有利的。<\/span>\n<\/li><\/ul>\n<\/section>"}, {"title": "二、维新运动的意义和教训", "tags": ["人物", "思想理论", "时间节点"], "text": "\n （一）意义\n\n1. 戊戌维新运动是一次爱国救亡运动；\n2. 是一场资产阶级性质的政治改良运动；\n3. 是一场思想启蒙运动；\n4. 在改革社会风习方面也提出了许多主张。\n\n （二）失败原因\n\n维新派自身的局限和以慈禧太后为首的强大的守旧势力的反对。维新派自身局限性表现在：\n\n1. 不敢否定封建主义；\n2. 对帝国主义抱有幻想；\n3. 惧怕人民群众。\n\n （三）历史教训\n\n 在半殖民地半封建的中国，企图通过统治者进行自上而下的改良，是根本行不通的。要想争取国家的独立、民主、富强，必须用革命的手段，推翻帝国主义、封建主义联合统治的半殖民地半封建的社会制度。\n\n 注意：戊戌维新运动改科举（废八股、改科举）；清末新政时期废科举（1906 年）。\n\n---\n", "html": "<section class=\"lvl-5\">\n<h5>（一）意义<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">戊戌维新运动是一次爱国救亡运动；<\/span>\n<\/li>\n<li><span class=\"li-text\">是一场资产阶级性质的政治改良运动；<\/span>\n<\/li>\n<li><span class=\"li-text\">是一场思想启蒙运动；<\/span>\n<\/li>\n<li><span class=\"li-text\">在改革社会风习方面也提出了许多主张。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）失败原因<\/h5>\n<p>维新派自身的局限和以慈禧太后为首的强大的守旧势力的反对。维新派自身局限性表现在：<\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">不敢否定封建主义；<\/span>\n<\/li>\n<li><span class=\"li-text\">对帝国主义抱有幻想；<\/span>\n<\/li>\n<li><span class=\"li-text\">惧怕人民群众。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）历史教训<\/h5>\n<blockquote><p>在半殖民地半封建的中国，企图通过统治者进行自上而下的改良，是根本行不通的。要想争取国家的独立、民主、富强，必须用革命的手段，推翻帝国主义、封建主义联合统治的半殖民地半封建的社会制度。<\/p>\n<p><strong>注意<\/strong>：戊戌维新运动改科举（废八股、改科举）；清末新政时期废科举（1906 年）。<\/p><\/blockquote>\n<hr/>\n<\/section>"}]}]}, {"num": "第三章", "title": "第三章 辛亥革命与君主专制制度的终结", "name": "辛亥革命与君主专制制度的终结", "sections": [{"title": "第一节 举起近代民族民主革命的旗帜", "blocks": [{"title": "一、辛亥革命爆发的历史条件", "tags": ["人物", "条约文献", "思想理论", "时间节点"], "text": "\n （一）民族危机加深，社会矛盾激化\n\n （二）清末新政及其破产\n\n- 1901 年《辛丑条约》的签订，标志着以慈禧太后为首的清政府已经彻底放弃了抵抗外国侵略者的念头，甘当\"洋人的朝廷\"。\n- 1901 年 4 月成立督办政务处，宣布实行新政；1906 年废除科举制度，宣布\"预备仿行宪政\"；1908 年颁布《钦定宪法大纲》。\n- 清末新政的主要内容：改革官制、整顿吏治；改革兵制、训练新军；改革学制、提倡新学；奖励工商、兴办实业。\n- 预备立宪失败的主要原因：清政府改革的根本目的是为了延续其反动统治。\n\n （三）资产阶级革命派的阶级基础和骨干力量\n\n- 19 世纪末 20 世纪初，中国民族资本主义得到初步发展。\n- 骨干是一批资产阶级、小资产阶级知识分子。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）民族危机加深，社会矛盾激化<\/h5>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）清末新政及其破产<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1901 年《辛丑条约》的签订，标志着以慈禧太后为首的清政府已经彻底放弃了抵抗外国侵略者的念头，甘当\"洋人的朝廷\"。<\/span>\n<\/li>\n<li><span class=\"li-text\">1901 年 4 月成立督办政务处，宣布实行新政；1906 年废除科举制度，宣布\"预备仿行宪政\"；1908 年颁布《钦定宪法大纲》。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>清末新政的主要内容<\/strong>：改革官制、整顿吏治；改革兵制、训练新军；改革学制、提倡新学；奖励工商、兴办实业。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>预备立宪失败的主要原因<\/strong>：清政府改革的根本目的是为了延续其反动统治。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）资产阶级革命派的阶级基础和骨干力量<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">19 世纪末 20 世纪初，中国民族资本主义得到初步发展。<\/span>\n<\/li>\n<li><span class=\"li-text\">骨干是一批资产阶级、小资产阶级知识分子。<\/span>\n<\/li><\/ul>\n<\/section>"}, {"title": "二、资产阶级革命派的活动", "tags": ["人物", "战争战役", "时间节点"], "text": "\n- 宣传工作：1903 年，章炳麟发表《驳康有为论革命书》，邹容写《革命军》，陈天华写《警世钟》《猛回头》两本小册子。\n- 革命团体：从 1904 年开始，出现了十多个革命团体，其中重要的有华兴会、科学补习所、光复会、岳王会等。\n- 政党建设：1894 年 11 月，孙中山在檀香山成立第一个资产阶级革命团体兴中会，立誓\"驱除鞑虏，恢复中国，创立合众政府\"，喊出了\"振兴中华\"的时代最强音；1895 年策划在广州举行武装起义，失败后流亡海外。1905 年 8 月 20 日，孙中山和黄兴、宋教仁等以兴中会和华兴会为基础，在日本东京成立中国同盟会（孙中山任总理，黄兴任执行部庶务），以《民报》为机关报。这是近代中国第一个领导资产阶级革命的全国性政党，它的成立标志着中国资产阶级民主革命进入了一个新的阶段。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>宣传工作<\/strong>：1903 年，章炳麟发表《驳康有为论革命书》，邹容写《革命军》，陈天华写《警世钟》《猛回头》两本小册子。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>革命团体<\/strong>：从 1904 年开始，出现了十多个革命团体，其中重要的有华兴会、科学补习所、光复会、岳王会等。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>政党建设<\/strong>：1894 年 11 月，孙中山在檀香山成立第一个资产阶级革命团体兴中会，立誓\"驱除鞑虏，恢复中国，创立合众政府\"，喊出了\"振兴中华\"的时代最强音；1895 年策划在广州举行武装起义，失败后流亡海外。1905 年 8 月 20 日，孙中山和黄兴、宋教仁等以兴中会和华兴会为基础，在日本东京成立中国同盟会（孙中山任总理，黄兴任执行部庶务），以《民报》为机关报。这是近代中国第一个领导资产阶级革命的全国性政党，它的成立标志着中国资产阶级民主革命进入了一个新的阶段。<\/span>\n<\/li><\/ul>"}, {"title": "三、三民主义的提出", "tags": ["人物", "会议", "土地问题", "思想理论"], "text": "\n- 1905 年 11 月，孙中山在《民报》发刊词中，将同盟会纲领\"驱除鞑虏，恢复中华，创立民国，平均地权\"概括为民族主义、民权主义、民生主义三大主义，后被称为三民主义。\n\n （一）民族主义\n\n- 内容：\"驱除鞑虏，恢复中华\"。一是要以革命手段推翻清政府，改变它一贯推行的民族歧视和民族压迫政策；二是追求独立，建立\"民族独立的国家\"。\n- 局限：一方面没有明确的反帝纲领，对帝国主义的本质认识不清，害怕帝国主义干涉，甚至幻想以承认不平等条约\"继续有效\"为条件来换取列强对自己的支持；另一方面，革命派强调了对满族封建势力的清除而放松了对汉族封建势力的警惕，结果保留了大量封建势力，导致了辛亥革命后封建势力的反扑。\n\n （二）民权主义\n\n- 内容：\"创立民国\"，即推翻封建君主专制制度，建立资产阶级民主共和国。\n- 局限：归根到底是建立资产阶级专政的国家，广大人民群众的民主权利很难得到真正的保证。\n\n （三）民生主义\n\n- 内容：\"平均地权\"。核定全国土地的地价，其现有之地价仍属原主；革命后的增价则归国家，为国民共享。即\"核定地价、按价征税、涨价归公、按价收买\"。\n- 局限：没有正面触及封建土地所有制，不能满足广大农民的土地要求，在革命中难以成为发动工农群众的理论武器。不能将民生主义概括为\"耕者有其田\"。\n\n 意义：三民主义初步描绘出中国还不曾有过的资产阶级共和国方案，是一个比较完整而明确的资产阶级革命纲领，对推动革命的发生产生了重大作用。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">1905 年 11 月，孙中山在《民报》发刊词中，将同盟会纲领\"驱除鞑虏，恢复中华，创立民国，平均地权\"概括为民族主义、民权主义、民生主义三大主义，后被称为三民主义。<\/span>\n<\/li><\/ul>\n<section class=\"lvl-5\">\n<h5>（一）民族主义<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>内容<\/strong>：\"驱除鞑虏，恢复中华\"。一是要以革命手段推翻清政府，改变它一贯推行的民族歧视和民族压迫政策；二是追求独立，建立\"民族独立的国家\"。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>局限<\/strong>：一方面没有明确的反帝纲领，对帝国主义的本质认识不清，害怕帝国主义干涉，甚至幻想以承认不平等条约\"继续有效\"为条件来换取列强对自己的支持；另一方面，革命派强调了对满族封建势力的清除而放松了对汉族封建势力的警惕，结果保留了大量封建势力，导致了辛亥革命后封建势力的反扑。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）民权主义<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>内容<\/strong>：\"创立民国\"，即推翻封建君主专制制度，建立资产阶级民主共和国。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>局限<\/strong>：归根到底是建立资产阶级专政的国家，广大人民群众的民主权利很难得到真正的保证。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）民生主义<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>内容<\/strong>：\"平均地权\"。核定全国土地的地价，其现有之地价仍属原主；革命后的增价则归国家，为国民共享。即\"核定地价、按价征税、涨价归公、按价收买\"。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>局限<\/strong>：没有正面触及封建土地所有制，不能满足广大农民的土地要求，在革命中难以成为发动工农群众的理论武器。不能将民生主义概括为\"耕者有其田\"。<\/span>\n<\/li><\/ul>\n<blockquote><p><strong>意义<\/strong>：三民主义初步描绘出中国还不曾有过的资产阶级共和国方案，是一个比较完整而明确的资产阶级革命纲领，对推动革命的发生产生了重大作用。<\/p><\/blockquote>\n<\/section>"}, {"title": "四、关于革命与改良的辩论", "tags": ["思想理论", "时间节点"], "text": "\n1. 时间：1905 至 1907 年。革命派以《民报》、改良派以《新民丛报》为主要舆论阵地。\n2. 论战内容：要不要以革命手段推翻清王朝；要不要推翻帝制、实行共和；要不要进行社会革命。\n3. 论战的意义：划清了革命与改良的界限；使资产阶级民主思想和三民主义思想得到更广泛传播，促进了革命形势的发展。但这场论战也暴露了革命派在思想理论方面的弱点。\n", "html": "<ol class=\"md-list\">\n<li><span class=\"li-text\"><strong>时间<\/strong>：1905 至 1907 年。革命派以《民报》、改良派以《新民丛报》为主要舆论阵地。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>论战内容<\/strong>：要不要以革命手段推翻清王朝；要不要推翻帝制、实行共和；要不要进行社会革命。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>论战的意义<\/strong>：划清了革命与改良的界限；使资产阶级民主思想和三民主义思想得到更广泛传播，促进了革命形势的发展。但这场论战也暴露了革命派在思想理论方面的弱点。<\/span>\n<\/li><\/ol>"}]}, {"title": "第二节 辛亥革命与中华民国的建立", "blocks": [{"title": "一、辛亥革命的爆发与清王朝覆灭", "tags": ["战争战役", "时间节点"], "text": "\n （一）武装起义与保路风潮\n\n- 1911 年 4 月 27 日，黄兴率敢死队 120 余人在广州举行起义，大部在激战中牺牲，其中 72 位烈士的遗骸葬于黄花岗，史称\"黄花岗起义\"，影响最大。\n- 四川保路运动。\n\n （二）武昌首义与各地响应\n\n- 湖北新军中的共进会和文学社两个革命团体联合行动，在武昌举行武装起义。\n- 1911 年 10 月 10 日，驻武昌的新军工程第八营的革命党人打响了起义第一枪。\n- 1912 年 2 月 12 日，清帝被迫退位。在中国延续了两千多年的封建帝制终于覆灭。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）武装起义与保路风潮<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1911 年 4 月 27 日，黄兴率敢死队 120 余人在广州举行起义，大部在激战中牺牲，其中 72 位烈士的遗骸葬于黄花岗，史称\"黄花岗起义\"，影响最大。<\/span>\n<\/li>\n<li><span class=\"li-text\">四川保路运动。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）武昌首义与各地响应<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">湖北新军中的共进会和文学社两个革命团体联合行动，在武昌举行武装起义。<\/span>\n<\/li>\n<li><span class=\"li-text\">1911 年 10 月 10 日，驻武昌的新军工程第八营的革命党人打响了起义第一枪。<\/span>\n<\/li>\n<li><span class=\"li-text\">1912 年 2 月 12 日，清帝被迫退位。在中国延续了两千多年的封建帝制终于覆灭。<\/span>\n<\/li><\/ul>\n<\/section>"}, {"title": "二、中华民国的建立", "tags": ["人物", "条约文献", "土地问题", "思想理论"], "text": "\n （一）南京临时政府\n\n- 1912 年 1 月 1 日，孙中山在南京宣誓就职，改国号为中华民国，定 1912 年为民国元年，成立中华民国临时政府。\n- 性质：南京临时政府是一个资产阶级共和国性质的革命政权。资产阶级革命派在这个政权中占有领导和主体地位；其各项政策措施，集中代表和反映了中国民族资产阶级的愿望和利益，在相当程度上也符合广大中国人民的利益。\n- 局限性：如在《告友邦书》中，试图以承认清政府与列强所订的一切不平等条约和清政府所欠的一切外债，来换取列强承认中华民国；也没有提出任何可以满足农民土地要求的政策和措施，反而以保护私有财产为借口，维护封建土地制度以及官僚、地主所占有的土地和财产。\n\n革命派的阶级性和历史局限性：\n\n1. 未能认清帝国主义本质（没有明确提出反帝纲领）；\n2. 对民主制度的理解流于形式（民权未回归人民）；\n3. 未能把土地改革和反对封建主义联系起来（未正面触及封建土地所有制）。\n\n （二）《中华民国临时约法》\n\n- 时间：1912 年 3 月，临时参议院颁布。\n- 内容：规定\"中华民国之主权属于国民全体\"；国民一律平等，享有人身、财产、结社、出版、集会、信教等自由和权利；规定国家体制，参议院行使立法权，临时大总统代表临时政府总揽政务，国务员辅佐临时大总统并负其责任，法院行使司法权；为限制袁世凯，改总统制为责任内阁制，规定国务员于临时大总统提出法律案、公布法律及发布命令时须副署之。\n- 地位：中国历史上第一部具有资产阶级共和国宪法性质的法典。\n- 意义：以根本法的形式废除了两千多年的封建君主专制，确认了资产阶级共和国的政治制度。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）南京临时政府<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1912 年 1 月 1 日，孙中山在南京宣誓就职，改国号为中华民国，定 1912 年为民国元年，成立中华民国临时政府。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>性质<\/strong>：南京临时政府是一个资产阶级共和国性质的革命政权。资产阶级革命派在这个政权中占有领导和主体地位；其各项政策措施，集中代表和反映了中国民族资产阶级的愿望和利益，在相当程度上也符合广大中国人民的利益。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>局限性<\/strong>：如在《告友邦书》中，试图以承认清政府与列强所订的一切不平等条约和清政府所欠的一切外债，来换取列强承认中华民国；也没有提出任何可以满足农民土地要求的政策和措施，反而以保护私有财产为借口，维护封建土地制度以及官僚、地主所占有的土地和财产。<\/span>\n<\/li><\/ul>\n<p><strong>革命派的阶级性和历史局限性：<\/strong><\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">未能认清帝国主义本质（没有明确提出反帝纲领）；<\/span>\n<\/li>\n<li><span class=\"li-text\">对民主制度的理解流于形式（民权未回归人民）；<\/span>\n<\/li>\n<li><span class=\"li-text\">未能把土地改革和反对封建主义联系起来（未正面触及封建土地所有制）。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）《中华民国临时约法》<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>时间<\/strong>：1912 年 3 月，临时参议院颁布。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>内容<\/strong>：规定\"中华民国之主权属于国民全体\"；国民一律平等，享有人身、财产、结社、出版、集会、信教等自由和权利；规定国家体制，参议院行使立法权，临时大总统代表临时政府总揽政务，国务员辅佐临时大总统并负其责任，法院行使司法权；为限制袁世凯，改总统制为责任内阁制，规定国务员于临时大总统提出法律案、公布法律及发布命令时须副署之。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>地位<\/strong>：中国历史上第一部具有资产阶级共和国宪法性质的法典。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>意义<\/strong>：以根本法的形式废除了两千多年的封建君主专制，确认了资产阶级共和国的政治制度。<\/span>\n<\/li><\/ul>\n<\/section>"}, {"title": "三、辛亥革命的历史意义", "tags": ["思想理论", "经济建设"], "text": "\n （一）性质\n\n辛亥革命是资产阶级领导的、以反对封建君主专制制度、建立资产阶级共和国为目的的革命，是一次比较完全意义上的资产阶级民主革命。\n\n （二）历史意义\n\n1. 清：推翻了封建势力的政治代表、帝国主义在中国的代理人——清王朝的统治，沉重打击了中外反动势力；\n2. 国：结束了中国延续两千多年的封建君主专制制度，建立了中国历史上第一个资产阶级共和政府；\n3. 思：使民主共和的观念开始深入人心，推动了思想解放，并形成了\"敢有帝制自为者，天下共击之\"的民主主义观念；\n4. 变：推动了中国的社会变革，促使社会经济、思想习惯和社会风俗等方面发生了新的积极变化；\n5. 帝：在一定程度上打击了帝国主义的侵略势力，推动了亚洲各国民族解放运动的高涨。\n\n （三）局限性\n\n1. 没有提出彻底的反对帝国主义和反对封建主义的革命纲领；\n2. 没有充分发动和依靠民众；\n3. 没有建立坚强的革命政党，作为团结一切革命力量的强有力的核心。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）性质<\/h5>\n<p>辛亥革命是资产阶级领导的、以反对封建君主专制制度、建立资产阶级共和国为目的的革命，是一次比较完全意义上的资产阶级民主革命。<\/p>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）历史意义<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\"><strong>清<\/strong>：推翻了封建势力的政治代表、帝国主义在中国的代理人——清王朝的统治，沉重打击了中外反动势力；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>国<\/strong>：结束了中国延续两千多年的封建君主专制制度，建立了中国历史上第一个资产阶级共和政府；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>思<\/strong>：使民主共和的观念开始深入人心，推动了思想解放，并形成了\"敢有帝制自为者，天下共击之\"的民主主义观念；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>变<\/strong>：推动了中国的社会变革，促使社会经济、思想习惯和社会风俗等方面发生了新的积极变化；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>帝<\/strong>：在一定程度上打击了帝国主义的侵略势力，推动了亚洲各国民族解放运动的高涨。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）局限性<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">没有提出彻底的反对帝国主义和反对封建主义的革命纲领；<\/span>\n<\/li>\n<li><span class=\"li-text\">没有充分发动和依靠民众；<\/span>\n<\/li>\n<li><span class=\"li-text\">没有建立坚强的革命政党，作为团结一切革命力量的强有力的核心。<\/span>\n<\/li><\/ol>\n<\/section>"}]}, {"title": "第三节 北洋军阀的统治和旧民主主义革命的失败", "blocks": [{"title": "一、封建军阀专制统治的形成", "tags": ["人物", "战争战役", "土地问题", "思想理论"], "text": "\n （一）袁世凯窃国，辛亥革命流产\n\n- 1912 年 3 月 10 日，袁世凯在北京就任临时大总统；4 月 1 日，孙中山正式卸去临时大总统职务。\n\n （二）北洋军阀的专制统治\n\n袁世凯窃取革命胜利果实后，建立了代表大地主和买办资产阶级利益的北洋军阀反动政权。\n\n1. 政治上，北洋政府实行军阀官僚的专制统治。军阀们为了实行专制统治，不惜投靠帝国主义；为达到专制独裁目的，袁世凯公然实行帝制复辟活动。\n2. 经济上，北洋政府竭力维护帝国主义、地主阶级、买办资产阶级的利益。\n3. 文化思想上，尊孔复古思潮猖獗一时。\n- 1916 年袁世凯称帝败亡后，中国陷入了军阀割据局面。\n- 1915 年，袁世凯接受日本提出的\"二十一条\"；1915 年 12 月 25 日，蔡锷等在云南组织\"护国军\"，发动护国运动，次年 3 月袁世凯被迫取消帝制，不久忧惧而死。\n- 以孙中山为首的革命派与北洋军阀的斗争：1913 年\"二次革命\"、1915—1916 年护国运动、1917 年第一次护法运动、1919 年第二次护法运动。1914 年孙中山成立中华革命党，1919 年 10 月将其改组为中国国民党；第二次护法战争的失败，标志着中国旧民主主义革命的终结。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）袁世凯窃国，辛亥革命流产<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1912 年 3 月 10 日，袁世凯在北京就任临时大总统；4 月 1 日，孙中山正式卸去临时大总统职务。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）北洋军阀的专制统治<\/h5>\n<p>袁世凯窃取革命胜利果实后，建立了代表大地主和买办资产阶级利益的北洋军阀反动政权。<\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\"><strong>政治上<\/strong>，北洋政府实行军阀官僚的专制统治。军阀们为了实行专制统治，不惜投靠帝国主义；为达到专制独裁目的，袁世凯公然实行帝制复辟活动。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>经济上<\/strong>，北洋政府竭力维护帝国主义、地主阶级、买办资产阶级的利益。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>文化思想上<\/strong>，尊孔复古思潮猖獗一时。<\/span>\n<\/li><\/ol>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1916 年袁世凯称帝败亡后，中国陷入了军阀割据局面。<\/span>\n<\/li>\n<li><span class=\"li-text\">1915 年，袁世凯接受日本提出的\"二十一条\"；1915 年 12 月 25 日，蔡锷等在云南组织\"护国军\"，发动护国运动，次年 3 月袁世凯被迫取消帝制，不久忧惧而死。<\/span>\n<\/li>\n<li><span class=\"li-text\">以孙中山为首的革命派与北洋军阀的斗争：1913 年\"二次革命\"、1915—1916 年护国运动、1917 年第一次护法运动、1919 年第二次护法运动。1914 年孙中山成立中华革命党，1919 年 10 月将其改组为中国国民党；第二次护法战争的失败，标志着中国旧民主主义革命的终结。<\/span>\n<\/li><\/ul>\n<\/section>"}, {"title": "二、旧民主主义革命的失败", "tags": ["思想理论"], "text": "\n- 根本原因：在帝国主义时代，在半殖民地半封建的中国，资本主义的建国方案是行不通的。\n- 主观原因：\n  1. 没有提出彻底的反对帝国主义和反对封建主义的革命纲领；\n  2. 没有充分发动和依靠民众；\n  3. 没有建立坚强的革命政党，作为团结一切革命力量的强有力的核心。\n- 资产阶级革命派的这些弱点、错误，根源于中国民族资产阶级的软弱性和妥协性。\n\n---\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>根本原因<\/strong>：在帝国主义时代，在半殖民地半封建的中国，资本主义的建国方案是行不通的。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>主观原因<\/strong>：<\/span>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">没有提出彻底的反对帝国主义和反对封建主义的革命纲领；<\/span>\n<\/li>\n<li><span class=\"li-text\">没有充分发动和依靠民众；<\/span>\n<\/li>\n<li><span class=\"li-text\">没有建立坚强的革命政党，作为团结一切革命力量的强有力的核心。<\/span>\n<\/li><\/ol>\n<\/li>\n<li><span class=\"li-text\">资产阶级革命派的这些弱点、错误，根源于中国民族资产阶级的<strong>软弱性和妥协性<\/strong>。<\/span>\n<\/li><\/ul>\n<hr/>"}]}]}, {"num": "第四章", "title": "第四章 中国共产党成立和中国革命新局面", "name": "中国共产党成立和中国革命新局面", "sections": [{"title": "第一节 新文化运动和五四运动", "blocks": [{"title": "一、新文化运动与思想解放的潮流", "tags": ["人物", "思想理论", "时间节点"], "text": "\n- 1915 年 9 月，陈独秀在上海创办《青年杂志》（后改名《新青年》），成为新文化运动兴起的标志。\n- 主要代表人物：陈独秀、李大钊、鲁迅、胡适等。\n- 主要阵地：《新青年》杂志和北京大学。\n- 主要内容：提倡民主和科学。民主，既是指资产阶级民主主义制度，也是指资产阶级民主主义思想；科学，则有广狭二义：狭义指自然科学，广义指社会科学。\n- 1918 年 5 月，鲁迅发表《狂人日记》，这是新文学运动的第一篇白话文小说。\n- 性质：资产阶级民主主义性质的思想启蒙运动。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">1915 年 9 月，陈独秀在上海创办《青年杂志》（后改名《新青年》），成为新文化运动兴起的标志。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>主要代表人物<\/strong>：陈独秀、李大钊、鲁迅、胡适等。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>主要阵地<\/strong>：《新青年》杂志和北京大学。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>主要内容<\/strong>：提倡民主和科学。民主，既是指资产阶级民主主义制度，也是指资产阶级民主主义思想；科学，则有广狭二义：狭义指自然科学，广义指社会科学。<\/span>\n<\/li>\n<li><span class=\"li-text\">1918 年 5 月，鲁迅发表《狂人日记》，这是新文学运动的第一篇白话文小说。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>性质<\/strong>：资产阶级民主主义性质的思想启蒙运动。<\/span>\n<\/li><\/ul>"}, {"title": "二、十月革命对中国先进知识分子的影响", "tags": ["人物", "土地问题", "思想理论", "经济建设"], "text": "\n- 十月革命揭开了人类历史的新纪元，建立了世界上第一个社会主义国家，促进了世界革命的进程。\n\n （一）十月革命能够在中国产生强烈影响的原因\n\n1. 十月革命发生在其国情与中国相同（封建压迫严重）或近似（经济文化落后）的俄国，因而对中国先进分子具有特殊吸引力；\n2. 十月革命诞生的社会主义俄国号召反对帝国主义，并以新的平等的态度对待中国，有力推动了社会主义思想在中国的传播；\n3. 十月革命中俄国工人、农民和士兵群众的广泛发动并由此赢得胜利的事实，给予中国先进分子新的革命方法的启示，推动他们去研究这个革命所遵循的主义。\n\n （二）率先举起马克思主义旗帜\n\n最先由民主主义者转变为共产主义者的先进分子是李大钊，他在中国大地上率先举起马克思主义旗帜。著作：《法俄革命之比较观》《庶民的胜利》《布尔什维主义的胜利》。\n\n （三）新文化运动的历史意义与局限\n\n历史意义：\n\n1. 是资产阶级民主主义新文化同封建主义旧文化的斗争，是辛亥革命在思想文化领域的延续，沉重打击了封建专制主义；\n2. 大力宣传了民主和科学，将人们从封建专制所造成的蒙昧中解放出来，开启了思想解放的潮流；\n3. 为中国先进分子接受马克思主义准备了适宜的土壤，为以五四运动为开端的中国新民主主义革命创造了思想文化上的条件。\n\n（新文化运动的倡导者虽然批判孔学，但并没有否定中国的全部传统文化。）\n\n局限：\n\n1. 提倡资产阶级民主主义已经不能改造中国；\n2. 新文化运动的倡导者把改造国民性置于优先地位，但少数人的呐喊不可能根本改造封建社会环境中的国民性；\n3. 那时的许多领导人物还没有马克思主义的批判精神，他们使用的方法一般还是资产阶级的方法，存在形式主义、片面性、绝对化的局限。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">十月革命揭开了人类历史的新纪元，建立了世界上第一个社会主义国家，促进了世界革命的进程。<\/span>\n<\/li><\/ul>\n<section class=\"lvl-5\">\n<h5>（一）十月革命能够在中国产生强烈影响的原因<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">十月革命发生在其国情与中国相同（封建压迫严重）或近似（经济文化落后）的俄国，因而对中国先进分子具有特殊吸引力；<\/span>\n<\/li>\n<li><span class=\"li-text\">十月革命诞生的社会主义俄国号召反对帝国主义，并以新的平等的态度对待中国，有力推动了社会主义思想在中国的传播；<\/span>\n<\/li>\n<li><span class=\"li-text\">十月革命中俄国工人、农民和士兵群众的广泛发动并由此赢得胜利的事实，给予中国先进分子新的革命方法的启示，推动他们去研究这个革命所遵循的主义。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）率先举起马克思主义旗帜<\/h5>\n<p>最先由民主主义者转变为共产主义者的先进分子是<strong>李大钊<\/strong>，他在中国大地上率先举起马克思主义旗帜。著作：《法俄革命之比较观》《庶民的胜利》《布尔什维主义的胜利》。<\/p>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）新文化运动的历史意义与局限<\/h5>\n<p><strong>历史意义：<\/strong><\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">是资产阶级民主主义新文化同封建主义旧文化的斗争，是辛亥革命在思想文化领域的延续，沉重打击了封建专制主义；<\/span>\n<\/li>\n<li><span class=\"li-text\">大力宣传了民主和科学，将人们从封建专制所造成的蒙昧中解放出来，开启了思想解放的潮流；<\/span>\n<\/li>\n<li><span class=\"li-text\">为中国先进分子接受马克思主义准备了适宜的土壤，为以五四运动为开端的中国新民主主义革命创造了思想文化上的条件。<\/span>\n<\/li><\/ol>\n<p>（新文化运动的倡导者虽然批判孔学，但并没有否定中国的全部传统文化。）<\/p>\n<p><strong>局限：<\/strong><\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">提倡资产阶级民主主义已经不能改造中国；<\/span>\n<\/li>\n<li><span class=\"li-text\">新文化运动的倡导者把改造国民性置于优先地位，但少数人的呐喊不可能根本改造封建社会环境中的国民性；<\/span>\n<\/li>\n<li><span class=\"li-text\">那时的许多领导人物还没有马克思主义的批判精神，他们使用的方法一般还是资产阶级的方法，存在形式主义、片面性、绝对化的局限。<\/span>\n<\/li><\/ol>\n<\/section>"}, {"title": "三、五四运动：新民主主义革命的开端", "tags": ["战争战役", "思想理论"], "text": "\n- 直接导火线：巴黎和会上中国外交的失败。五四运动中喊出了\"外争主权，内除国贼\"等口号。\n- 五四运动中，中国工人阶级开始以独立姿态登上历史舞台；五四运动是中国新民主主义革命的开端。\n\n （一）五四运动发生的时代条件\n\n1. 新的社会力量（工人阶级等）的成长、壮大；\n2. 新文化运动掀起的思想解放的潮流；\n3. 俄国十月革命对中国的影响。\n\n （二）历史特点\n\n1. 是一场以先进青年知识分子为先锋、广大人民群众参加的彻底反帝反封建的伟大爱国革命运动；\n2. 是一场中国人民为拯救民族危亡、捍卫民族尊严、凝聚民族力量而掀起的伟大社会革命运动；\n3. 是一场传播新思想新文化新知识的伟大思想启蒙运动和新文化运动，以磅礴之力鼓动了中国人民和中华民族实现民族复兴的志向和信心。\n\n （三）历史意义\n\n1. 五四运动是中国旧民主主义革命走向新民主主义革命的转折点，成为中国新民主主义革命的开端；\n2. 以全民族的力量高举起爱国主义的伟大旗帜，孕育了以爱国、进步、民主、科学为主要内容的伟大五四精神，其核心是爱国主义；\n3. 以全民族的行动激发了追求真理、追求进步的伟大觉醒，改变了以往只有觉悟的革命者而缺少觉醒的人民大众的斗争状况，实现了中国人民和中华民族自鸦片战争以来的第一次全面觉醒；\n4. 以全民族的搏击培育了永久奋斗的伟大传统；\n5. 促进了马克思主义在中国的传播及其与中国工人运动的结合，为中国共产党的成立作了思想上和干部上的准备。\n\n 为什么说五四运动是中国新民主主义革命的开端？\n\n 1. 五四运动发生在俄国十月革命之后，中国革命逐渐成为世界无产阶级社会主义革命的一部分；\n 2. 五四运动以后，无产阶级逐渐代替资产阶级成为近代中国民族民主革命的领导者。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>直接导火线<\/strong>：巴黎和会上中国外交的失败。五四运动中喊出了\"外争主权，内除国贼\"等口号。<\/span>\n<\/li>\n<li><span class=\"li-text\">五四运动中，中国工人阶级开始以独立姿态登上历史舞台；<strong>五四运动是中国新民主主义革命的开端<\/strong>。<\/span>\n<\/li><\/ul>\n<section class=\"lvl-5\">\n<h5>（一）五四运动发生的时代条件<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">新的社会力量（工人阶级等）的成长、壮大；<\/span>\n<\/li>\n<li><span class=\"li-text\">新文化运动掀起的思想解放的潮流；<\/span>\n<\/li>\n<li><span class=\"li-text\">俄国十月革命对中国的影响。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）历史特点<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">是一场以先进青年知识分子为先锋、广大人民群众参加的彻底反帝反封建的伟大爱国革命运动；<\/span>\n<\/li>\n<li><span class=\"li-text\">是一场中国人民为拯救民族危亡、捍卫民族尊严、凝聚民族力量而掀起的伟大社会革命运动；<\/span>\n<\/li>\n<li><span class=\"li-text\">是一场传播新思想新文化新知识的伟大思想启蒙运动和新文化运动，以磅礴之力鼓动了中国人民和中华民族实现民族复兴的志向和信心。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）历史意义<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">五四运动是中国旧民主主义革命走向新民主主义革命的转折点，成为中国新民主主义革命的开端；<\/span>\n<\/li>\n<li><span class=\"li-text\">以全民族的力量高举起爱国主义的伟大旗帜，孕育了以爱国、进步、民主、科学为主要内容的伟大五四精神，其核心是爱国主义；<\/span>\n<\/li>\n<li><span class=\"li-text\">以全民族的行动激发了追求真理、追求进步的伟大觉醒，改变了以往只有觉悟的革命者而缺少觉醒的人民大众的斗争状况，实现了中国人民和中华民族自鸦片战争以来的第一次全面觉醒；<\/span>\n<\/li>\n<li><span class=\"li-text\">以全民族的搏击培育了永久奋斗的伟大传统；<\/span>\n<\/li>\n<li><span class=\"li-text\">促进了马克思主义在中国的传播及其与中国工人运动的结合，为中国共产党的成立作了思想上和干部上的准备。<\/span>\n<\/li><\/ol>\n<blockquote><p><strong>为什么说五四运动是中国新民主主义革命的开端？<\/strong><\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">五四运动发生在俄国十月革命之后，中国革命逐渐成为世界无产阶级社会主义革命的一部分；<\/span>\n<\/li>\n<li><span class=\"li-text\">五四运动以后，无产阶级逐渐代替资产阶级成为近代中国民族民主革命的领导者。<\/span>\n<\/li><\/ol><\/blockquote>\n<\/section>"}]}, {"title": "第二节 马克思主义广泛传播与中国共产党的诞生", "blocks": [{"title": "一、中国早期马克思主义者的队伍", "tags": ["人物", "思想理论"], "text": "\n1. 新文化运动的精神领袖：如李大钊、陈独秀（先驱者和擎旗者）；\n2. 五四爱国运动的左翼骨干：如毛泽东、杨匏安、蔡和森、周恩来（主体部分）；\n3. 一部分中国同盟会成员、辛亥革命时期的活动家：如董必武。\n\n早期马克思主义思想运动的特点：\n\n1. 重视对马克思主义基本理论的学习；\n2. 注意从中国的实际出发，学习、运用马克思主义；\n3. 开始提出知识分子应当同劳动群众相结合的思想。\n\n新文化运动的发展：五四以后的新文化运动发展到一个新阶段，马克思主义开始逐步在思想文化领域发挥指导作用。\n", "html": "<ol class=\"md-list\">\n<li><span class=\"li-text\"><strong>新文化运动的精神领袖<\/strong>：如李大钊、陈独秀（先驱者和擎旗者）；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>五四爱国运动的左翼骨干<\/strong>：如毛泽东、杨匏安、蔡和森、周恩来（主体部分）；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>一部分中国同盟会成员、辛亥革命时期的活动家<\/strong>：如董必武。<\/span>\n<\/li><\/ol>\n<p><strong>早期马克思主义思想运动的特点：<\/strong><\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">重视对马克思主义基本理论的学习；<\/span>\n<\/li>\n<li><span class=\"li-text\">注意从中国的实际出发，学习、运用马克思主义；<\/span>\n<\/li>\n<li><span class=\"li-text\">开始提出知识分子应当同劳动群众相结合的思想。<\/span>\n<\/li><\/ol>\n<p><strong>新文化运动的发展<\/strong>：五四以后的新文化运动发展到一个新阶段，马克思主义开始逐步在思想文化领域发挥指导作用。<\/p>"}, {"title": "二、马克思主义与中国工人运动的结合", "tags": ["人物", "条约文献", "思想理论", "时间节点"], "text": "\n1. 1920 年 8 月，陈望道翻译的《共产党宣言》第一个中文全译本在上海出版。\n2. 1920 年 2 月，\"南陈北李，相约建党\"：陈独秀（上海）、李大钊（北京）。各地早期共产党组织成立后，大力组织和开展工人运动。\n3. 1920 年 3 月，李大钊在北京大学组织成立马克思学说研究会，这是中国最早学习和研究马克思主义的团体。\n4. 1920 年 11 月，共产党早期组织领导的第一个工会——上海机器工会成立。\n5. 李大钊发表的《我的马克思主义观》，比较全面系统地介绍了马克思主义的学说。\n\n中国共产党早期组织的活动：①研究和宣传马克思主义；②到工人中去进行宣传和组织工作；③进行关于建党问题的讨论和实际组织工作。早期共产党组织的成员还同反马克思主义的思潮进行了三次论战：同胡适围绕\"问题与主义\"的论战；关于社会主义的论战（强调资本主义道路在中国走不通，中国的出路只能是社会主义）；同无政府主义的论战（指出必须以革命的手段夺取政权，建立无产阶级政权）。\n", "html": "<ol class=\"md-list\">\n<li><span class=\"li-text\">1920 年 8 月，陈望道翻译的《共产党宣言》第一个中文全译本在上海出版。<\/span>\n<\/li>\n<li><span class=\"li-text\">1920 年 2 月，\"南陈北李，相约建党\"：陈独秀（上海）、李大钊（北京）。各地早期共产党组织成立后，大力组织和开展工人运动。<\/span>\n<\/li>\n<li><span class=\"li-text\">1920 年 3 月，李大钊在北京大学组织成立马克思学说研究会，这是中国最早学习和研究马克思主义的团体。<\/span>\n<\/li>\n<li><span class=\"li-text\">1920 年 11 月，共产党早期组织领导的第一个工会——上海机器工会成立。<\/span>\n<\/li>\n<li><span class=\"li-text\">李大钊发表的《我的马克思主义观》，比较全面系统地介绍了马克思主义的学说。<\/span>\n<\/li><\/ol>\n<p><strong>中国共产党早期组织的活动<\/strong>：①研究和宣传马克思主义；②到工人中去进行宣传和组织工作；③进行关于建党问题的讨论和实际组织工作。早期共产党组织的成员还同反马克思主义的思潮进行了三次论战：同胡适围绕\"问题与主义\"的论战；关于社会主义的论战（强调资本主义道路在中国走不通，中国的出路只能是社会主义）；同无政府主义的论战（指出必须以革命的手段夺取政权，建立无产阶级政权）。<\/p>"}, {"title": "三、中国共产党第一次全国代表大会的召开与中国共产党的成立", "tags": ["会议", "战争战役", "土地问题", "思想理论"], "text": "\n1. 1921 年 7 月 23 日，中国共产党第一次全国代表大会在上海召开（由于会场受到暗探注意和巡捕搜查，最后一天的会议改在浙江嘉兴南湖的游船上举行，即\"红船\"），大会确定党的名称为中国共产党，宣告中国共产党的成立。它从一开始就坚持以马克思主义为行动指南，把为中国人民谋幸福、为中华民族谋复兴确立为自己的初心使命。\n2. 中国共产党成立的历史特点：中国共产党是在特定的社会历史条件下成立的。一方面，它成立于俄国十月革命取得胜利、第二国际社会民主主义和修正主义破产之后，它所接受的是具有完整的科学世界观和社会革命论的马克思主义；另一方面，它是在半殖民地半封建中国的工人运动基础上产生的。\n\n 中国共产党成立的历史意义\n\n1. 领导：标志着中国人民的反帝反封建斗争有了先进的政党作为凝聚力量的领导核心；\n2. 思想：中国共产党的先驱们创建了中国共产党，形成了坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民的伟大建党精神，这是中国共产党的精神之源。正是对这一精神的坚守与践行、光大与发扬，构建起中国共产党人的精神谱系，激励中国共产党和中国人民创造了人间奇迹；\n3. 中国共产党的成立，深刻改变了近代以后中华民族发展的方向和进程，深刻改变了中国人民和中华民族的前途和命运，深刻改变了世界发展的趋势和格局。自从有了中国共产党，中国革命的面目就焕然一新了。\n\n总之，中国共产党的成立，是中华民族发展史上开天辟地的大事变。\n\n 简答题：中国共产党成立后，中国革命出现了哪些新面貌？\n\n 1. 第一次提出了反帝反封建的民主革命纲领，为中国人民指出了明确的斗争目标；\n 2. 发动工农群众开展革命斗争，在中国掀起了第一次工人运动高潮；同时，中国共产党也开始从事发动农民的工作，农民运动蓬勃发展；\n 3. 实行国共合作，并在合作中发挥主导作用，掀起大革命高潮，推翻了北洋军阀的统治。\n", "html": "<ol class=\"md-list\">\n<li><span class=\"li-text\">1921 年 7 月 23 日，中国共产党第一次全国代表大会在上海召开（由于会场受到暗探注意和巡捕搜查，最后一天的会议改在浙江嘉兴南湖的游船上举行，即\"红船\"），大会确定党的名称为中国共产党，宣告中国共产党的成立。它从一开始就坚持以马克思主义为行动指南，把为中国人民谋幸福、为中华民族谋复兴确立为自己的初心使命。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>中国共产党成立的历史特点<\/strong>：中国共产党是在特定的社会历史条件下成立的。一方面，它成立于俄国十月革命取得胜利、第二国际社会民主主义和修正主义破产之后，它所接受的是具有完整的科学世界观和社会革命论的马克思主义；另一方面，它是在半殖民地半封建中国的工人运动基础上产生的。<\/span>\n<\/li><\/ol>\n<section class=\"lvl-5\">\n<h5>中国共产党成立的历史意义<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\"><strong>领导<\/strong>：标志着中国人民的反帝反封建斗争有了先进的政党作为凝聚力量的领导核心；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>思想<\/strong>：中国共产党的先驱们创建了中国共产党，形成了坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民的<strong>伟大建党精神<\/strong>，这是中国共产党的精神之源。正是对这一精神的坚守与践行、光大与发扬，构建起中国共产党人的精神谱系，激励中国共产党和中国人民创造了人间奇迹；<\/span>\n<\/li>\n<li><span class=\"li-text\">中国共产党的成立，深刻改变了近代以后中华民族发展的方向和进程，深刻改变了中国人民和中华民族的前途和命运，深刻改变了世界发展的趋势和格局。自从有了中国共产党，中国革命的面目就焕然一新了。<\/span>\n<\/li><\/ol>\n<p>总之，中国共产党的成立，是中华民族发展史上开天辟地的大事变。<\/p>\n<blockquote><p><strong>简答题：中国共产党成立后，中国革命出现了哪些新面貌？<\/strong><\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">第一次提出了反帝反封建的民主革命纲领，为中国人民指出了明确的斗争目标；<\/span>\n<\/li>\n<li><span class=\"li-text\">发动工农群众开展革命斗争，在中国掀起了第一次工人运动高潮；同时，中国共产党也开始从事发动农民的工作，农民运动蓬勃发展；<\/span>\n<\/li>\n<li><span class=\"li-text\">实行国共合作，并在合作中发挥主导作用，掀起大革命高潮，推翻了北洋军阀的统治。<\/span>\n<\/li><\/ol><\/blockquote>\n<\/section>"}]}, {"title": "第三节 中国革命新局面", "blocks": [{"title": "一、民主革命纲领的制定和工农运动的发展", "tags": ["会议", "战争战役", "土地问题", "思想理论"], "text": "\n1. 1922 年 7 月，中共二大第一次明确提出了反帝反封建的民主革命纲领。党的最高纲领是实现社会主义、共产主义；最低纲领是打倒军阀、推翻国际帝国主义的压迫、统一中国为真正的民主共和国。\n2. 工人运动：从 1922 年 1 月香港海员罢工到 1923 年 2 月京汉铁路工人罢工，掀起了中国工人运动的第一个高潮。\n3. 1921 年 9 月，在浙江省萧山县衙前村成立了第一个农民协会，开展反抗地主压迫与剥削的斗争。\n4. 1922 年 5 月 5 日至 10 日，青年团第一次代表大会在广州召开，中国社会主义青年团宣告成立。\n", "html": "<ol class=\"md-list\">\n<li><span class=\"li-text\">1922 年 7 月，中共二大第一次明确提出了反帝反封建的民主革命纲领。党的最高纲领是实现社会主义、共产主义；最低纲领是打倒军阀、推翻国际帝国主义的压迫、统一中国为真正的民主共和国。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>工人运动<\/strong>：从 1922 年 1 月香港海员罢工到 1923 年 2 月京汉铁路工人罢工，掀起了中国工人运动的第一个高潮。<\/span>\n<\/li>\n<li><span class=\"li-text\">1921 年 9 月，在浙江省萧山县衙前村成立了第一个农民协会，开展反抗地主压迫与剥削的斗争。<\/span>\n<\/li>\n<li><span class=\"li-text\">1922 年 5 月 5 日至 10 日，青年团第一次代表大会在广州召开，中国社会主义青年团宣告成立。<\/span>\n<\/li><\/ol>"}, {"title": "二、国共合作和大革命的进行", "tags": ["人物", "会议", "条约文献", "战争战役"], "text": "\n （一）国共合作形成的原因\n\n1. 1923 年 2 月 7 日，京汉铁路罢工遭到反动军阀的血腥镇压，造成二七惨案。此后，中国工人运动暂时转入低潮。中国共产党从中看到，这时的中国革命力量远不如帝国主义和封建势力强大，认识到结成最广泛统一战线的重要性；\n2. 孙中山因依靠军阀打军阀屡遭挫折，认识到中国共产党是一支新兴的、生机勃勃的革命力量，愿意与之合作；\n3. 共产国际的推动。\n\n （二）第一次国共合作的形成\n\n- 1923 年 6 月，中共三大推动了第一次国共合作的形成。\n- 1924 年 1 月，国民党一大召开，标志着以第一次国共合作为基础的革命统一战线正式形成。\n- 第一次国共合作的政治基础：以三大政策（联俄、联共、扶助农工）为灵魂的新三民主义。\n- 1924 年 5 月，黄埔军校开学。\n- 1925 年 1 月，中共四大在上海召开，提出了无产阶级在民主革命中的领导权问题和工农联盟问题，对民主革命的内容作了更加完整的规定，这是对中国革命问题认识的重大进展。\n- 中国共产党还进行了创建直接领导的革命武装的尝试：1925 年 11 月，在广东肇庆建立由共产党员叶挺指挥的国民革命军第四军独立团（1926 年 1 月改称），成为北伐先锋。\n- 1925 年，英日等国军警在上海制造枪杀中国民众的\"五卅惨案\"，导致五卅运动爆发。以此为起点，掀起了全国范围内的大革命高潮。1925 年 6 月起，省港大罢工（中国工人运动史上持续时间最长的一次政治大罢工）坚持了 16 个月。\n- 1926 年 7 月，以推翻北洋军阀统治为目标的北伐战争开始。\n\n 北伐战争胜利进军的原因：①国共合作的实现、革命统一战线的建立，特别是共产党员和共青团员的先锋模范作用；②北伐军得到广大工农群众的大力支持；③得到了苏联政府的多方面援助。\n- 大革命时间：1924—1927 年。\n- 在大革命紧急关头，1927 年 4 月 27 日至 5 月 9 日，中共五大在武汉举行。大会提出争取无产阶级对革命的领导权、建立革命民主政权和实行土地革命等正确原则，但对无产阶级如何争取革命领导权、如何领导农民实行土地革命，特别是如何建立党领导的革命武装等问题，没有提出有效的具体措施，难以承担起挽救革命的任务。\n\n （三）国民党右派发动的反共政变\n\n1. 1926 年 3 月，蒋介石制造中山舰事件；5 月，提出《整理党务决议案》，打击共产党员和工农革命力量。\n2. 1927 年 4 月 12 日，蒋介石在上海发动\"四一二政变\"，以\"清党\"名义捕杀共产党员和革命群众。\n3. 1927 年 4 月 28 日，中国共产党主要创始人李大钊在北京被奉系军阀张作霖杀害。\n4. 1927 年 7 月 15 日，汪精卫召开\"分共\"会议，宣布同共产党决裂，开始大屠杀（七一五政变），标志着第一次国共合作全面破裂，大革命最终失败。\n\n （四）中国共产党在大革命中的贡献\n\n1. 提出反对帝国主义、反对军阀的政治口号；\n2. 是国共合作的倡导者和统一战线的组织者；\n3. 是人民群众的主要发动者和组织者；\n4. 共产党人不仅帮助和推动了国民革命军的建立，而且在军队中进行了卓有成效的政治工作，提高了国民革命军的素质；共产党员在战斗中身先士卒，起着先锋作用和表率作用。\n\n （五）国民革命失败的原因\n\n- 客观原因：帝国主义和中国封建主义势力的联合力量大大超过刚刚兴起的革命联合力量，敌我力量悬殊；革命统一战线内部出现剧烈分化。\n- 主观原因：\n  1. 以陈独秀为首的中共中央领导机关在大革命后期犯了右倾机会主义错误；\n  2. 总体上讲，中国共产党处于幼年时期，共产国际的错误指导对酿成陈独秀右倾机会主义错误有直接影响。\n\n （六）大革命的经验教训\n\n1. 中国共产党能否将马克思主义同中国革命的具体实际相结合，对中国革命至关重要；\n2. 中国共产党不但要建立革命的统一战线，而且要始终保持自身的独立性，实行\"又团结又斗争\"的方针，争取无产阶级在革命中的领导权；\n3. 要取得革命胜利，必须坚持武装斗争，组建由党直接统率和指挥的军队；\n4. 必须解决农民的土地问题，以充分发动农民参加革命，扩大革命力量；\n5. 党必须加强自身建设，加强党的民主集中制，既要发展党的组织和注重党员数量，更要巩固党的组织和注重党员质量。\n\n （七）国民革命的历史意义\n\n1. 正是在这个时期，中国共产党人进行了轰轰烈烈的革命工作，领导了全国反帝反封建的伟大斗争，在中国革命史上写下了光荣的一页；\n2. 开始探索马克思主义中国化的途径，初步提出了新民主主义革命的基本思想；\n3. 从大革命的失败中汲取深刻历史教训，开始懂得进行土地革命和掌握革命武装的重要性；\n4. 经历了这场大革命，中国人民的觉悟程度和组织程度有了明显提高，中国共产党开始掌握了一部分革命武装。所有这些，为把中国革命推进到一个新的阶段——土地革命战争阶段，准备了必要的条件；\n5. 沉重打击了帝国主义和封建主义的统治势力，扩大了中国共产党在中国人民中的政治影响。\n\n---\n", "html": "<section class=\"lvl-5\">\n<h5>（一）国共合作形成的原因<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">1923 年 2 月 7 日，京汉铁路罢工遭到反动军阀的血腥镇压，造成二七惨案。此后，中国工人运动暂时转入低潮。中国共产党从中看到，这时的中国革命力量远不如帝国主义和封建势力强大，认识到结成最广泛统一战线的重要性；<\/span>\n<\/li>\n<li><span class=\"li-text\">孙中山因依靠军阀打军阀屡遭挫折，认识到中国共产党是一支新兴的、生机勃勃的革命力量，愿意与之合作；<\/span>\n<\/li>\n<li><span class=\"li-text\">共产国际的推动。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）第一次国共合作的形成<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1923 年 6 月，中共三大推动了第一次国共合作的形成。<\/span>\n<\/li>\n<li><span class=\"li-text\">1924 年 1 月，国民党一大召开，标志着以第一次国共合作为基础的革命统一战线正式形成。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>第一次国共合作的政治基础<\/strong>：以三大政策（联俄、联共、扶助农工）为灵魂的新三民主义。<\/span>\n<\/li>\n<li><span class=\"li-text\">1924 年 5 月，黄埔军校开学。<\/span>\n<\/li>\n<li><span class=\"li-text\">1925 年 1 月，中共四大在上海召开，提出了无产阶级在民主革命中的领导权问题和工农联盟问题，对民主革命的内容作了更加完整的规定，这是对中国革命问题认识的重大进展。<\/span>\n<\/li>\n<li><span class=\"li-text\">中国共产党还进行了创建直接领导的革命武装的尝试：1925 年 11 月，在广东肇庆建立由共产党员叶挺指挥的国民革命军第四军独立团（1926 年 1 月改称），成为北伐先锋。<\/span>\n<\/li>\n<li><span class=\"li-text\">1925 年，英日等国军警在上海制造枪杀中国民众的\"五卅惨案\"，导致五卅运动爆发。以此为起点，掀起了全国范围内的大革命高潮。1925 年 6 月起，省港大罢工（中国工人运动史上持续时间最长的一次政治大罢工）坚持了 16 个月。<\/span>\n<\/li>\n<li><span class=\"li-text\">1926 年 7 月，以推翻北洋军阀统治为目标的北伐战争开始。<\/span>\n<\/li><\/ul>\n<blockquote><p><strong>北伐战争胜利进军的原因<\/strong>：①国共合作的实现、革命统一战线的建立，特别是共产党员和共青团员的先锋模范作用；②北伐军得到广大工农群众的大力支持；③得到了苏联政府的多方面援助。<\/p><\/blockquote>\n<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>大革命时间<\/strong>：1924—1927 年。<\/span>\n<\/li>\n<li><span class=\"li-text\">在大革命紧急关头，1927 年 4 月 27 日至 5 月 9 日，中共五大在武汉举行。大会提出争取无产阶级对革命的领导权、建立革命民主政权和实行土地革命等正确原则，但对无产阶级如何争取革命领导权、如何领导农民实行土地革命，特别是如何建立党领导的革命武装等问题，没有提出有效的具体措施，难以承担起挽救革命的任务。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）国民党右派发动的反共政变<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">1926 年 3 月，蒋介石制造中山舰事件；5 月，提出《整理党务决议案》，打击共产党员和工农革命力量。<\/span>\n<\/li>\n<li><span class=\"li-text\">1927 年 4 月 12 日，蒋介石在上海发动\"四一二政变\"，以\"清党\"名义捕杀共产党员和革命群众。<\/span>\n<\/li>\n<li><span class=\"li-text\">1927 年 4 月 28 日，中国共产党主要创始人李大钊在北京被奉系军阀张作霖杀害。<\/span>\n<\/li>\n<li><span class=\"li-text\">1927 年 7 月 15 日，汪精卫召开\"分共\"会议，宣布同共产党决裂，开始大屠杀（七一五政变），标志着第一次国共合作全面破裂，大革命最终失败。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（四）中国共产党在大革命中的贡献<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">提出反对帝国主义、反对军阀的政治口号；<\/span>\n<\/li>\n<li><span class=\"li-text\">是国共合作的倡导者和统一战线的组织者；<\/span>\n<\/li>\n<li><span class=\"li-text\">是人民群众的主要发动者和组织者；<\/span>\n<\/li>\n<li><span class=\"li-text\">共产党人不仅帮助和推动了国民革命军的建立，而且在军队中进行了卓有成效的政治工作，提高了国民革命军的素质；共产党员在战斗中身先士卒，起着先锋作用和表率作用。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（五）国民革命失败的原因<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>客观原因<\/strong>：帝国主义和中国封建主义势力的联合力量大大超过刚刚兴起的革命联合力量，敌我力量悬殊；革命统一战线内部出现剧烈分化。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>主观原因<\/strong>：<\/span>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">以陈独秀为首的中共中央领导机关在大革命后期犯了右倾机会主义错误；<\/span>\n<\/li>\n<li><span class=\"li-text\">总体上讲，中国共产党处于幼年时期，共产国际的错误指导对酿成陈独秀右倾机会主义错误有直接影响。<\/span>\n<\/li><\/ol>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（六）大革命的经验教训<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">中国共产党能否将马克思主义同中国革命的具体实际相结合，对中国革命至关重要；<\/span>\n<\/li>\n<li><span class=\"li-text\">中国共产党不但要建立革命的统一战线，而且要始终保持自身的独立性，实行\"又团结又斗争\"的方针，争取无产阶级在革命中的领导权；<\/span>\n<\/li>\n<li><span class=\"li-text\">要取得革命胜利，必须坚持武装斗争，组建由党直接统率和指挥的军队；<\/span>\n<\/li>\n<li><span class=\"li-text\">必须解决农民的土地问题，以充分发动农民参加革命，扩大革命力量；<\/span>\n<\/li>\n<li><span class=\"li-text\">党必须加强自身建设，加强党的民主集中制，既要发展党的组织和注重党员数量，更要巩固党的组织和注重党员质量。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（七）国民革命的历史意义<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">正是在这个时期，中国共产党人进行了轰轰烈烈的革命工作，领导了全国反帝反封建的伟大斗争，在中国革命史上写下了光荣的一页；<\/span>\n<\/li>\n<li><span class=\"li-text\">开始探索马克思主义中国化的途径，初步提出了新民主主义革命的基本思想；<\/span>\n<\/li>\n<li><span class=\"li-text\">从大革命的失败中汲取深刻历史教训，开始懂得进行土地革命和掌握革命武装的重要性；<\/span>\n<\/li>\n<li><span class=\"li-text\">经历了这场大革命，中国人民的觉悟程度和组织程度有了明显提高，中国共产党开始掌握了一部分革命武装。所有这些，为把中国革命推进到一个新的阶段——土地革命战争阶段，准备了必要的条件；<\/span>\n<\/li>\n<li><span class=\"li-text\">沉重打击了帝国主义和封建主义的统治势力，扩大了中国共产党在中国人民中的政治影响。<\/span>\n<\/li><\/ol>\n<hr/>\n<\/section>"}]}]}, {"num": "第五章", "title": "第五章 中国革命的新道路", "name": "中国革命的新道路", "sections": [{"title": "第一节 中国共产党对革命新道路的探索", "blocks": [{"title": "一、国民党在全国统治的建立", "tags": ["人物", "战争战役", "土地问题", "思想理论"], "text": "\n1. 1927 年汪精卫七一五反革命政变后，南京和武汉两个\"国民政府\"实行宁汉合流；1928 年 2 月，南京国民政府改组，武汉国民政府不复存在。\n2. 1928 年 12 月 29 日，张学良从东北发布通告，宣布\"遵守三民主义，服从国民政府，改易旗帜\"（东北易帜）。\n\n一党专政的独裁统治：\n\n大革命失败后，国民党已不再是工人、农民、城市小资产阶级和民族资产阶级的革命联盟，而是一个由代表地主阶级、买办性大资产阶级利益的反动集团所控制的政党；国民党所实行的是代表地主阶级、买办性大资产阶级利益的一党专政。\n\n表现：\n\n1. 建立庞大的军队；\n2. 建立全国性的特务系统（中统和军统），主要任务是反对共产党、破坏革命运动，绑架或暗杀革命者和异己分子；\n3. 推行保甲制度：目的是控制人民、禁止革命活动，保甲内各户要互相监视和互相告发；\n4. 厉行文化专制主义：目的是控制舆论，剥夺人民的言论和出版自由。\n\n通过以上手段来维护帝国主义、封建主义、官僚资本主义的利益，巩固自身的统治。\n", "html": "<ol class=\"md-list\">\n<li><span class=\"li-text\">1927 年汪精卫七一五反革命政变后，南京和武汉两个\"国民政府\"实行宁汉合流；1928 年 2 月，南京国民政府改组，武汉国民政府不复存在。<\/span>\n<\/li>\n<li><span class=\"li-text\">1928 年 12 月 29 日，张学良从东北发布通告，宣布\"遵守三民主义，服从国民政府，改易旗帜\"（东北易帜）。<\/span>\n<\/li><\/ol>\n<p><strong>一党专政的独裁统治：<\/strong><\/p>\n<p>大革命失败后，国民党已不再是工人、农民、城市小资产阶级和民族资产阶级的革命联盟，而是一个由代表地主阶级、买办性大资产阶级利益的反动集团所控制的政党；国民党所实行的是代表地主阶级、买办性大资产阶级利益的一党专政。<\/p>\n<p>表现：<\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">建立庞大的军队；<\/span>\n<\/li>\n<li><span class=\"li-text\">建立全国性的特务系统（中统和军统），主要任务是反对共产党、破坏革命运动，绑架或暗杀革命者和异己分子；<\/span>\n<\/li>\n<li><span class=\"li-text\">推行保甲制度：目的是控制人民、禁止革命活动，保甲内各户要互相监视和互相告发；<\/span>\n<\/li>\n<li><span class=\"li-text\">厉行文化专制主义：目的是控制舆论，剥夺人民的言论和出版自由。<\/span>\n<\/li><\/ol>\n<p>通过以上手段来维护帝国主义、封建主义、官僚资本主义的利益，巩固自身的统治。<\/p>"}, {"title": "二、土地革命战争的兴起", "tags": ["人物", "会议", "战争战役", "土地问题"], "text": "\n （一）大革命失败后的艰难条件\n\n1. 国民党统治下的半殖民地半封建社会性质没有改变；\n2. 国民党反共，全国陷入白色恐怖；\n3. 工农运动走向低潮，反革命力量大大超过了有组织的革命力量。\n\n1927 年大革命失败到 1928 年初，中国革命发展到一个新阶段——土地革命战争阶段。\n\n （二）开展武装反抗国民党反动统治的斗争\n\n1. 1927 年 7 月中旬，中共中央决定三件大事：\n   1. 将党所掌握和影响的部队向南昌集中，准备发动起义；\n   2. 组织湘、赣、鄂、粤四省农民，在秋收季节准备暴动；\n   3. 召集中央会议，讨论和决定新时期的方针和政策。\n2. 八七会议：1927 年 8 月 7 日，中共中央在汉口秘密召开紧急会议，彻底清算了大革命后期的陈独秀右倾机会主义错误，选出了以程秋白为首的中央临时政治局，确定了土地革命和武装起义的方针。出席此次会议的毛泽东突出强调了\"枪杆子里出政权\"和\"找着新的道路\"的任务。意义：给正处在思想混乱和组织涣散中的中国共产党指明了新的出路，实现了由大革命失败到土地革命战争兴起的历史性转变。\n3. 南昌起义：1927 年 8 月 1 日，在以周恩来为书记的中共前敌委员会领导下，贺龙、叶挺、朱德、刘伯承等在南昌打响了武装反抗国民党反动派的第一枪。南昌起义是中国共产党独立领导革命战争、创建人民军队和武装夺取政权的开端。\n4. 秋收起义：1927 年 9 月 9 日，毛泽东等领导的湘赣边界秋收起义爆发，起义军公开打出\"工农革命军\"的旗帜。在攻打中心城市长沙失败后，毛泽东改变计划，决定向敌人控制比较薄弱的农村转移。\n5. 三湾改编：1927 年 9 月 29 日，毛泽东领导了三湾改编，从组织上确立了党对军队的领导。三湾改编是建设无产阶级领导的新型人民军队的重要开端。\n6. 广州起义：1927 年 12 月 11 日，张太雷、叶挺和叶剑英等领导了广州起义。该起义证明，面对国民党在中心城市拥有强大武装的形势，想通过城市武装起义或攻占大城市来取得革命胜利是不可能的。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）大革命失败后的艰难条件<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">国民党统治下的半殖民地半封建社会性质没有改变；<\/span>\n<\/li>\n<li><span class=\"li-text\">国民党反共，全国陷入白色恐怖；<\/span>\n<\/li>\n<li><span class=\"li-text\">工农运动走向低潮，反革命力量大大超过了有组织的革命力量。<\/span>\n<\/li><\/ol>\n<p>1927 年大革命失败到 1928 年初，中国革命发展到一个新阶段——土地革命战争阶段。<\/p>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）开展武装反抗国民党反动统治的斗争<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\"><strong>1927 年 7 月中旬，中共中央决定三件大事<\/strong>：<\/span>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">将党所掌握和影响的部队向南昌集中，准备发动起义；<\/span>\n<\/li>\n<li><span class=\"li-text\">组织湘、赣、鄂、粤四省农民，在秋收季节准备暴动；<\/span>\n<\/li>\n<li><span class=\"li-text\">召集中央会议，讨论和决定新时期的方针和政策。<\/span>\n<\/li><\/ol>\n<\/li>\n<li><span class=\"li-text\"><strong>八七会议<\/strong>：1927 年 8 月 7 日，中共中央在汉口秘密召开紧急会议，彻底清算了大革命后期的陈独秀右倾机会主义错误，选出了以程秋白为首的中央临时政治局，确定了土地革命和武装起义的方针。出席此次会议的毛泽东突出强调了\"枪杆子里出政权\"和\"找着新的道路\"的任务。<strong>意义<\/strong>：给正处在思想混乱和组织涣散中的中国共产党指明了新的出路，实现了由大革命失败到土地革命战争兴起的历史性转变。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>南昌起义<\/strong>：1927 年 8 月 1 日，在以周恩来为书记的中共前敌委员会领导下，贺龙、叶挺、朱德、刘伯承等在南昌打响了武装反抗国民党反动派的第一枪。南昌起义是中国共产党独立领导革命战争、创建人民军队和武装夺取政权的开端。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>秋收起义<\/strong>：1927 年 9 月 9 日，毛泽东等领导的湘赣边界秋收起义爆发，起义军公开打出\"工农革命军\"的旗帜。在攻打中心城市长沙失败后，毛泽东改变计划，决定向敌人控制比较薄弱的农村转移。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>三湾改编<\/strong>：1927 年 9 月 29 日，毛泽东领导了三湾改编，从组织上确立了党对军队的领导。三湾改编是建设无产阶级领导的新型人民军队的重要开端。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>广州起义<\/strong>：1927 年 12 月 11 日，张太雷、叶挺和叶剑英等领导了广州起义。该起义证明，面对国民党在中心城市拥有强大武装的形势，想通过城市武装起义或攻占大城市来取得革命胜利是不可能的。<\/span>\n<\/li><\/ol>\n<\/section>"}, {"title": "三、农村包围城市、武装夺取政权道路的开辟", "tags": ["人物", "会议", "战争战役", "土地问题"], "text": "\n （一）对中国革命新道路的探索\n\n1. 只有遵循马克思列宁主义与中国革命实际相结合的原则，依靠革命实践的积累，才能回答中国革命发展问题。\n2. 大革命失败后，集中体现中国革命正确方向的是毛泽东、朱德领导的井冈山革命根据地的斗争。\n   - 1927 年 11 月，成立了湘赣边界第一个红色政权——茶陵县工农兵政府。至 1928 年，打败江西国民党军队对井冈山地区的进攻，井冈山根据地初步建立起来。\n   - 1928 年 4 月下旬，朱德、陈毅率领南昌起义保留下来的部队和湘南起义农军陆续转移到井冈山地区，与毛泽东领导的部队会师，成立工农革命军第四军（后改称\"工农红军第四军\"），从此他们领导的军队被称为\"朱毛红军\"。\n   - 井冈山革命根据地（第一个农村革命根据地）的建立，点燃了工农武装割据的星星之火，为中国革命开辟出了农村包围城市、武装夺取政权这样一条前人没有走过的正确道路。\n\n\"工农武装割据\"思想的内容：①武装斗争是中国革命的主要斗争形式；②土地革命是中国革命的中心内容（农民土地问题是新民主主义革命的基本问题）；③农村革命根据地是中国民主革命的战略阵地。三者相辅相成、缺一不可，是有机的统一体。\n\n 论述：红色政权存在和发展的原因和条件：①中国是一个几个帝国主义国家间接统治的政治经济发展极端不平衡的半殖民地半封建的大国（根本原因）；②国民革命的影响；③全国革命形势的继续向前发展；④相当力量的正式红军的存在；⑤共产党组织的坚强有力和各项政策的正确贯彻执行。\n3. 1928 年在苏联莫斯科举行的中共六大，确定了以争取群众作为党的首要任务，把\"左\"倾作为主要危险来反对。\n4. 毛泽东不仅在实践中首先提出农村包围城市、武装夺取政权的方针，而且从理论上作了详细的阐明。\n\n 补充：毛泽东思想的发展过程\n\n 1. 萌芽（第一次国内革命战争时期，1924—1927）：《中国社会各阶级的分析》《湖南农民运动考察报告》；\n 2. 初步形成（土地革命战争时期，1927—1935）：《中国的红色政权为什么能够存在？》《井冈山的斗争》《星星之火，可以燎原》《反对本本主义》；\n 3. 走向成熟（遵义会议至抗日战争时期，1935—1945）：《〈共产党人〉发刊词》《中国革命和中国共产党》《新民主主义论》《论联合政府》；\n 4. 继续发展（解放战争时期至中华人民共和国成立后，1945—1949 年及以后）：《论人民民主专政》《论十大关系》。\n\n 农村包围城市、武装夺取政权理论的提出，标志着中国化的马克思主义即毛泽东思想的初步形成，是马克思主义在中国的创造性运用和发展。\n\n5. 古田会议：1929 年 12 月，红四军党的第九次代表大会（古田会议）在福建上杭古田召开，通过了关于纠正党内错误思想的决议案，确立了思想建党、政治建军的原则。意义：古田会议决议是党和人民军队建设史上的重要里程碑，确立了马克思主义建党建军原则，创造性地解决了在农村环境中、在党组织和军队以农民为主要成分的条件下，如何保持党的无产阶级先锋队性质和建设党领导的新型人民军队的重大问题。党对军队的绝对领导，是人民军队永远不变的军魂，是人民军队区别于一切旧军队的政治特质和根本优势，对于中国革命新道路的开辟和坚持有重要意义。\n6. 随着革命新道路的开辟，中国革命走向复兴。红军游击战争在事实上成为了中国革命的主要形式，农村根据地成为积蓄和锻炼革命力量的主要战略阵地。\n\n （二）反\"围剿\"战争与土地革命\n\n1. 从 1930 年 10 月起，蒋介石集重兵向南方各根据地的红军发动大规模\"围剿\"。\n2. 红一方面军在毛泽东、朱德的带领下，实行积极防御的方针，采取\"诱敌深入\"\"避敌主力\"\"打其虚弱\"等战术。\n3. 红军反\"围剿\"战争的胜利和革命根据地的发展，与土地革命的开展密切相关。\n   - 毛泽东和邓子恢等一起制定了土地革命中的阶级路线和土地分配方法，开展\"打土豪，分田地\"的斗争；\n   - 坚定依靠贫农、雇农，联合中农，限制富农，保护中小工商业者，消灭地主阶级；\n   - 以乡为单位，按人口平分土地，在原耕地的基础上实行抽多补少、抽肥补瘦。\n   - 在大革命失败、白色恐怖的情况下，中国革命还能坚持和发展的根本原因，在于中国共产党紧紧依靠农民，领导农民进行了土地制度的革命。\n4. 文化战线上也开启了反\"围剿\"的左翼文化运动斗争：鲁迅的杂文、瞿秋白的评论、茅盾的小说《子夜》等。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）对中国革命新道路的探索<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">只有遵循马克思列宁主义与中国革命实际相结合的原则，依靠革命实践的积累，才能回答中国革命发展问题。<\/span>\n<\/li>\n<li><span class=\"li-text\">大革命失败后，集中体现中国革命正确方向的是毛泽东、朱德领导的井冈山革命根据地的斗争。<\/span>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1927 年 11 月，成立了湘赣边界第一个红色政权——茶陵县工农兵政府。至 1928 年，打败江西国民党军队对井冈山地区的进攻，井冈山根据地初步建立起来。<\/span>\n<\/li>\n<li><span class=\"li-text\">1928 年 4 月下旬，朱德、陈毅率领南昌起义保留下来的部队和湘南起义农军陆续转移到井冈山地区，与毛泽东领导的部队会师，成立工农革命军第四军（后改称\"工农红军第四军\"），从此他们领导的军队被称为\"朱毛红军\"。<\/span>\n<\/li>\n<li><span class=\"li-text\">井冈山革命根据地（第一个农村革命根据地）的建立，点燃了工农武装割据的星星之火，为中国革命开辟出了农村包围城市、武装夺取政权这样一条前人没有走过的正确道路。<\/span>\n<\/li><\/ul>\n<\/li><\/ol>\n<p><strong>\"工农武装割据\"思想的内容<\/strong>：①武装斗争是中国革命的主要斗争形式；②土地革命是中国革命的中心内容（农民土地问题是新民主主义革命的基本问题）；③农村革命根据地是中国民主革命的战略阵地。三者相辅相成、缺一不可，是有机的统一体。<\/p>\n<blockquote><p><strong>论述：红色政权存在和发展的原因和条件<\/strong>：①中国是一个几个帝国主义国家间接统治的政治经济发展极端不平衡的半殖民地半封建的大国（根本原因）；②国民革命的影响；③全国革命形势的继续向前发展；④相当力量的正式红军的存在；⑤共产党组织的坚强有力和各项政策的正确贯彻执行。<\/p><\/blockquote>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">1928 年在苏联莫斯科举行的中共六大，确定了以争取群众作为党的首要任务，把\"左\"倾作为主要危险来反对。<\/span>\n<\/li>\n<li><span class=\"li-text\">毛泽东不仅在实践中首先提出农村包围城市、武装夺取政权的方针，而且从理论上作了详细的阐明。<\/span>\n<\/li><\/ol>\n<blockquote><p><strong>补充：毛泽东思想的发展过程<\/strong><\/p>\n<ol class=\"md-list\">\n<l
