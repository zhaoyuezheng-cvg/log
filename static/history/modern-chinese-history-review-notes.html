n\n （二）以革命战争反对反革命战争\n\n中国共产党清醒估计国内外形势，坚决认定：我们必须打败蒋介石，而且能够打败他。毛泽东指出：\n\n- 我们必须打败蒋介石，是因为蒋介石发动的战争，是一个在美帝国主义指挥之下的反对中国民族独立和中国人民解放的反革命的战争；\n- 我们能够打败蒋介石，是因为蒋介石军事力量的优势和美国的援助只是临时起作用的因素，而蒋介石发动的反人民战争的性质、人心的向背，则是经常起作用的因素，在这方面，我们占优势；\n- 人民解放军的战争所具有的爱国的、正义的、革命的性质，必然要获得全国人民的拥护，这就是战胜蒋介石的政治基础。\n\n为打退国民党对解放区的军事进攻，中共中央指出：政治上，必须和人民群众亲密合作，争取一切可以争取的人，在党的领导下建立最广泛的人民民主统一战线；军事上，必须采取集中优势兵力、各个歼灭敌人的作战原则。\n\n 思考题：中国共产党为什么能以少胜多战胜国民党？（结合上述\"人心向背\"\"战争性质\"及下文土地改革、第二条战线、统一战线等内容作答。）\n\n- 1946 年 6 月至 1947 年 6 月，人民军队处于战略防御阶段，战争主要在解放区进行。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）全面内战爆发<\/h5>\n<p>1946 年 6 月 26 日，国民党军队以进攻中原解放区为起点，发动全面内战。<\/p>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）以革命战争反对反革命战争<\/h5>\n<p>中国共产党清醒估计国内外形势，坚决认定：我们必须打败蒋介石，而且能够打败他。毛泽东指出：<\/p>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">我们必须打败蒋介石，是因为蒋介石发动的战争，是一个在美帝国主义指挥之下的反对中国民族独立和中国人民解放的反革命的战争；<\/span>\n<\/li>\n<li><span class=\"li-text\">我们能够打败蒋介石，是因为蒋介石军事力量的优势和美国的援助只是临时起作用的因素，而蒋介石发动的反人民战争的性质、人心的向背，则是经常起作用的因素，在这方面，我们占优势；<\/span>\n<\/li>\n<li><span class=\"li-text\">人民解放军的战争所具有的爱国的、正义的、革命的性质，必然要获得全国人民的拥护，这就是战胜蒋介石的政治基础。<\/span>\n<\/li><\/ul>\n<p>为打退国民党对解放区的军事进攻，中共中央指出：政治上，必须和人民群众亲密合作，争取一切可以争取的人，在党的领导下建立最广泛的人民民主统一战线；军事上，必须采取<strong>集中优势兵力、各个歼灭敌人<\/strong>的作战原则。<\/p>\n<blockquote><p><strong>思考题：中国共产党为什么能以少胜多战胜国民党？<\/strong>（结合上述\"人心向背\"\"战争性质\"及下文土地改革、第二条战线、统一战线等内容作答。）<\/p><\/blockquote>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1946 年 6 月至 1947 年 6 月，人民军队处于战略防御阶段，战争主要在解放区进行。<\/span>\n<\/li><\/ul>\n<\/section>"}]}, {"title": "第二节 全国解放战争的发展和第二条战线的形成", "blocks": [{"title": "一、解放战争的胜利发展", "tags": ["人物", "会议", "战争战役", "思想理论"], "text": "\n （一）人民解放军转入战略进攻\n\n1947 年 6 月，刘伯承、邓小平率领的晋冀鲁豫野战军主力强渡黄河，千里跃进大别山。刘邓、陈谢、陈粟三路大军相互策应、机动歼敌，主动打到外线，国民党军处于被动地位，人民解放战争战略进攻的序幕由此揭开。同年 12 月，中共中央在陕北米脂县杨家沟召开会议，制定了夺取全国胜利的行动纲领，中国革命发展到了一个历史的转折点。\n\n （二）提出\"打倒蒋介石，解放全中国\"的口号\n\n1947 年 10 月 10 日，中国人民解放军总部发表宣言，提出\"打倒蒋介石，解放全中国\"的口号。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）人民解放军转入战略进攻<\/h5>\n<p>1947 年 6 月，刘伯承、邓小平率领的晋冀鲁豫野战军主力强渡黄河，千里跃进大别山。刘邓、陈谢、陈粟三路大军相互策应、机动歼敌，主动打到外线，国民党军处于被动地位，人民解放战争战略进攻的序幕由此揭开。同年 12 月，中共中央在陕北米脂县杨家沟召开会议，制定了夺取全国胜利的行动纲领，中国革命发展到了一个历史的转折点。<\/p>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）提出\"打倒蒋介石，解放全中国\"的口号<\/h5>\n<p>1947 年 10 月 10 日，中国人民解放军总部发表宣言，提出\"打倒蒋介石，解放全中国\"的口号。<\/p>\n<\/section>"}, {"title": "二、解放区的土地改革运动与农民的广泛发动", "tags": ["人物", "会议", "条约文献", "战争战役"], "text": "\n （一）从《五四指示》到《中国土地法大纲》\n\n- 1946 年 5 月 4 日，中共中央发出《关于土地问题的指示》（史称《五四指示》），决定将党在抗日战争时期实行的减租减息政策改变为实行\"耕者有其田\"的政策。\n- 1947 年 7 月至 9 月，中国共产党在西柏坡召开全国土地会议，制定《中国土地法大纲》，明确规定：废除封建性及半封建性剥削的土地制度，实现耕者有其田的土地制度。《中国土地法大纲》是一个彻底反封建的土地革命纲领。\n- 新民主主义革命的三大经济纲领：没收封建阶级的土地归农民所有；没收垄断资本（官僚资本）归新民主主义的国家所有；保护民族工商业。\n- 土地改革总路线：依靠贫农，团结中农，有步骤地、有分别地消灭封建剥削制度，发展农业生产。\n\n （二）土地改革运动的高潮\n\n- 全国土地会议后，解放区广大农村迅速掀起土地制度改革运动的热潮。经过土改运动，到 1948 年秋，1 亿人口的解放区消灭了封建生产关系。\n- 土地制度改革是中国共产党领导广大农民从根本上摧毁封建制度根基的社会大变革。它使占中国人口绝大多数的农民进一步认识到，中国共产党是他们自身利益的坚决维护者，因而自觉地在党的周围团结起来。这就为打败蒋介石、建立新中国奠定了深厚的群众基础。\n- 土改后解放区出现新面貌：①广大农民更加信任和拥护中国共产党，人民民主政权进一步巩固和加强；②农民从封建生产关系中解放出来，生产积极性空前提高；③大批青壮年农民踊跃参军参战，人民解放战争有了巩固的后方和最基本的人力、物力保证。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）从《五四指示》到《中国土地法大纲》<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1946 年 5 月 4 日，中共中央发出《关于土地问题的指示》（史称《五四指示》），决定将党在抗日战争时期实行的减租减息政策改变为实行\"耕者有其田\"的政策。<\/span>\n<\/li>\n<li><span class=\"li-text\">1947 年 7 月至 9 月，中国共产党在西柏坡召开全国土地会议，制定《中国土地法大纲》，明确规定：废除封建性及半封建性剥削的土地制度，实现耕者有其田的土地制度。《中国土地法大纲》是一个彻底反封建的土地革命纲领。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>新民主主义革命的三大经济纲领<\/strong>：没收封建阶级的土地归农民所有；没收垄断资本（官僚资本）归新民主主义的国家所有；保护民族工商业。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>土地改革总路线<\/strong>：依靠贫农，团结中农，有步骤地、有分别地消灭封建剥削制度，发展农业生产。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）土地改革运动的高潮<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">全国土地会议后，解放区广大农村迅速掀起土地制度改革运动的热潮。经过土改运动，到 1948 年秋，1 亿人口的解放区消灭了封建生产关系。<\/span>\n<\/li>\n<li><span class=\"li-text\">土地制度改革是中国共产党领导广大农民从根本上摧毁封建制度根基的社会大变革。它使占中国人口绝大多数的农民进一步认识到，中国共产党是他们自身利益的坚决维护者，因而自觉地在党的周围团结起来。这就为打败蒋介石、建立新中国奠定了深厚的群众基础。<\/span>\n<\/li>\n<li><span class=\"li-text\">土改后解放区出现新面貌：①广大农民更加信任和拥护中国共产党，人民民主政权进一步巩固和加强；②农民从封建生产关系中解放出来，生产积极性空前提高；③大批青壮年农民踊跃参军参战，人民解放战争有了巩固的后方和最基本的人力、物力保证。<\/span>\n<\/li><\/ul>\n<\/section>"}, {"title": "三、第二条战线的形成和发展", "tags": ["战争战役", "经济建设", "时间节点"], "text": "\n （一）国民党统治区的政治经济危机\n\n在国统区，以学生运动为先导的人民民主运动迅速发展起来，成为配合人民解放战争的第二条战线。\n\n国民党统治区政治经济危机的原因：派往原沦陷区的接收大员将接收日伪资产变为\"劫收\"，民众期望破灭；为进行内战而使田赋征收猛增、滥发纸币，民族工商业日益走向破产，公教人员和学生的生活陷入困境。\n\n （二）学生运动的高涨\n\n- 1945 年底，昆明学生发动了以\"反对内战，争取自由\"为主要口号的一二·一运动。\n- 随着解放战争的胜利推进，国民党统治区的人民民主运动有了新发展。广大学生越来越把中国的希望寄托于人民解放战争的胜利，因而不再提\"反内战\"的口号，而是在\"反迫害\"的旗帜下展开斗争。\n- 国统区人民民主运动的高潮包括：昆明\"一二·一\"运动、抗议美军暴行运动（抗暴运动）、\"反饥饿、反内战、反迫害\"运动（五·二〇运动）等。\n- 少数民族人民的民主运动：1945 年新疆\"三区革命\"；1947 年台湾\"二·二八\"起义；1947 年 5 月 1 日，内蒙古自治政府成立——内蒙古自治区是中国最早宣告成立的省级民族自治区。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）国民党统治区的政治经济危机<\/h5>\n<p>在国统区，以学生运动为先导的人民民主运动迅速发展起来，成为配合人民解放战争的<strong>第二条战线<\/strong>。<\/p>\n<p>国民党统治区政治经济危机的原因：派往原沦陷区的接收大员将接收日伪资产变为\"劫收\"，民众期望破灭；为进行内战而使田赋征收猛增、滥发纸币，民族工商业日益走向破产，公教人员和学生的生活陷入困境。<\/p>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）学生运动的高涨<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1945 年底，昆明学生发动了以\"反对内战，争取自由\"为主要口号的一二·一运动。<\/span>\n<\/li>\n<li><span class=\"li-text\">随着解放战争的胜利推进，国民党统治区的人民民主运动有了新发展。广大学生越来越把中国的希望寄托于人民解放战争的胜利，因而不再提\"反内战\"的口号，而是在\"反迫害\"的旗帜下展开斗争。<\/span>\n<\/li>\n<li><span class=\"li-text\">国统区人民民主运动的高潮包括：昆明\"一二·一\"运动、抗议美军暴行运动（抗暴运动）、\"反饥饿、反内战、反迫害\"运动（五·二〇运动）等。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>少数民族人民的民主运动<\/strong>：1945 年新疆\"三区革命\"；1947 年台湾\"二·二八\"起义；1947 年 5 月 1 日，内蒙古自治政府成立——内蒙古自治区是中国最早宣告成立的省级民族自治区。<\/span>\n<\/li><\/ul>\n<\/section>"}]}, {"title": "第三节 中国共产党与民主党派的团结合作", "blocks": [{"title": "一、各民主党派的历史发展", "tags": ["人物", "战争战役", "土地问题", "抗日战争"], "text": "\n- 中国民主党派，少数成立于大革命时期和土地革命时期（如 1930 年 8 月邓演达成立的中国国民党临时行动委员会，即\"第三党\"），多数成立于抗日战争和全国解放战争时期。主要有：中国国民党革命委员会（民革）、中国民主同盟（民盟）、中国民主建国会（民建）、中国民主促进会（民进）、中国农工民主党（农工党）、中国致公党（致公党）、九三学社、台湾民主自治同盟（台盟）。\n- 在中国政治生活中，各民主党派和无党派民主人士是一支重要的力量。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">中国民主党派，少数成立于大革命时期和土地革命时期（如 1930 年 8 月邓演达成立的中国国民党临时行动委员会，即\"第三党\"），多数成立于抗日战争和全国解放战争时期。主要有：中国国民党革命委员会（民革）、中国民主同盟（民盟）、中国民主建国会（民建）、中国民主促进会（民进）、中国农工民主党（农工党）、中国致公党（致公党）、九三学社、台湾民主自治同盟（台盟）。<\/span>\n<\/li>\n<li><span class=\"li-text\">在中国政治生活中，各民主党派和无党派民主人士是一支重要的力量。<\/span>\n<\/li><\/ul>"}, {"title": "二、中国共产党与民主党派的合作", "tags": ["抗日战争"], "text": "\n- 抗战胜利后民主党派的政治态度：在战后进行国共谈判和召开政协时，民主党派作为\"第三方面\"，主要同中国共产党站在一起。\n- 中国共产党对各民主党派采取了积极争取和团结的政策。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">抗战胜利后民主党派的政治态度：在战后进行国共谈判和召开政协时，民主党派作为\"第三方面\"，主要同中国共产党站在一起。<\/span>\n<\/li>\n<li><span class=\"li-text\">中国共产党对各民主党派采取了积极争取和团结的政策。<\/span>\n<\/li><\/ul>"}, {"title": "三、中国共产党领导的多党合作和政治协商格局的形成", "tags": ["会议", "土地问题", "思想理论", "经济建设"], "text": "\n- 第三条道路的幻灭：即资产阶级共和国方案，实质上是旧民主主义道路。\n- 中间路线（第三条道路）的主张：政治上\"实现英美式的民主政治\"，但不准地主官僚资本家操纵；经济上\"实行改良的资本主义\"，但不容官僚买办资本横行；方法上走和平的改良道路。其实质是旧民主主义的道路。1947 年 10 月，民盟总部被国民党当局解散，标志着\"第三条道路\"的幻想彻底破灭。\n\n 简答：抗战胜利后的三种政治力量、三种建国方案：①地主阶级与买办性大资产阶级的建国方案，维护其根本利益，坚持国民党一党专政；②民族资产阶级的建国方案，即资产阶级共和国方案，在中国行不通（帝国主义不容许；民族资产阶级在经济上、政治上的软弱性，使其没有勇气和能力领导人民进行彻底的反帝反封建斗争）；③工人阶级、农民阶级和城市小资产阶级的建国方案，即中国共产党的方案，主张建立工人阶级领导的、以工农联盟为基础的人民民主专政的人民共和国。事实证明，这条道路在中国行不通。\n- 1948 年 4 月 30 日，中共中央在纪念国际劳动节的\"五一口号\"中，提出召开政治协商会议、成立民主联合政府的主张，揭开了中国共产党与各民主党派、各团体、各族各界人士协商建国的序幕。\n- 1949 年 1 月 22 日，民主党派领导人和无党派人士联合发表《对时局的意见》，表示中国各民主党派和无党派民主人士公开接受中国共产党的领导，决心走人民革命道路，拥护建立人民民主的新中国。\n- 人民政协会议的召开，标志着中国的新型政党制度——中国共产党领导的多党合作和政治协商制度的确立。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>第三条道路的幻灭<\/strong>：即资产阶级共和国方案，实质上是旧民主主义道路。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>中间路线（第三条道路）的主张<\/strong>：政治上\"实现英美式的民主政治\"，但不准地主官僚资本家操纵；经济上\"实行改良的资本主义\"，但不容官僚买办资本横行；方法上走和平的改良道路。其实质是旧民主主义的道路。1947 年 10 月，民盟总部被国民党当局解散，标志着\"第三条道路\"的幻想彻底破灭。<\/span>\n<\/li><\/ul>\n<blockquote><p><strong>简答：抗战胜利后的三种政治力量、三种建国方案<\/strong>：①地主阶级与买办性大资产阶级的建国方案，维护其根本利益，坚持国民党一党专政；②民族资产阶级的建国方案，即资产阶级共和国方案，在中国行不通（帝国主义不容许；民族资产阶级在经济上、政治上的软弱性，使其没有勇气和能力领导人民进行彻底的反帝反封建斗争）；③工人阶级、农民阶级和城市小资产阶级的建国方案，即中国共产党的方案，主张建立工人阶级领导的、以工农联盟为基础的人民民主专政的人民共和国。事实证明，这条道路在中国行不通。<\/p><\/blockquote>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1948 年 4 月 30 日，中共中央在纪念国际劳动节的\"五一口号\"中，提出召开政治协商会议、成立民主联合政府的主张，揭开了中国共产党与各民主党派、各团体、各族各界人士协商建国的序幕。<\/span>\n<\/li>\n<li><span class=\"li-text\">1949 年 1 月 22 日，民主党派领导人和无党派人士联合发表《对时局的意见》，表示中国各民主党派和无党派民主人士公开接受中国共产党的领导，决心走人民革命道路，拥护建立人民民主的新中国。<\/span>\n<\/li>\n<li><span class=\"li-text\">人民政协会议的召开，标志着中国的新型政党制度——中国共产党领导的多党合作和政治协商制度的确立。<\/span>\n<\/li><\/ul>"}]}, {"title": "第四节 建立人民民主专政的新中国", "blocks": [{"title": "一、南京国民党政权的覆灭", "tags": ["人物", "会议", "战争战役", "时间节点"], "text": "\n- 1948 年 9 月 12 日至 1949 年 1 月 31 日，人民解放军先后进行辽沈、淮海、平津三大战役。意义：标志着国民党军队的主要军事力量基本被摧毁。\n- 1949 年元旦，蒋介石发表\"求和\"声明，企图借\"和平谈判\"争取喘息时间。毛泽东、朱德发布《向全国进军的命令》，人民解放军发起渡江战役。4 月 23 日，人民解放军占领南京，延续 22 年的国民党反动统治宣告覆灭。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">1948 年 9 月 12 日至 1949 年 1 月 31 日，人民解放军先后进行辽沈、淮海、平津三大战役。<strong>意义<\/strong>：标志着国民党军队的主要军事力量基本被摧毁。<\/span>\n<\/li>\n<li><span class=\"li-text\">1949 年元旦，蒋介石发表\"求和\"声明，企图借\"和平谈判\"争取喘息时间。毛泽东、朱德发布《向全国进军的命令》，人民解放军发起渡江战役。4 月 23 日，人民解放军占领南京，延续 22 年的国民党反动统治宣告覆灭。<\/span>\n<\/li><\/ul>"}, {"title": "二、人民政协与《共同纲领》", "tags": ["人物", "会议", "条约文献", "土地问题"], "text": "\n （一）中共七届二中全会\n\n- 1949 年 3 月在西柏坡召开的中共七届二中全会，规定了全国胜利后中国共产党在政治、经济、外交方面应当采取的基本政策，指出了中国由农业国转变为工业国、由新民主主义社会转变为社会主义社会的发展方向。\n- 在中国共产党自身建设问题上，提出\"两个务必\"的思想，即\"务必使同志们继续保持谦虚谨慎、不骄不躁的作风，务必使同志们继续保持艰苦奋斗的作风\"，向全党警告，防止腐败。\n- 3 月 23 日上午，中共中央离开西柏坡向北平进发。3 月 25 日，毛泽东等中央领导人与中央机关、人民解放军总部进驻北平香山，标志着中国革命重心从农村转向城市。\n\n （二）《论人民民主专政》\n\n1949 年 6 月 30 日，毛泽东发表《论人民民主专政》一文。中共七届二中全会的决议和《论人民民主专政》，构成了《中国人民政治协商会议共同纲领》的基础。\n\n- 《论人民民主专政》的主要内容：人民民主专政的基础是工农联盟；主要依靠工人阶级和农民阶级；为建立新中国，必须团结民族资产阶级；建立工人阶级领导的、以工农联盟为基础的人民民主专政。\n\n （三）中国人民政治协商会议的召开\n\n- 完成创建新中国的任务，是由中国人民政治协商会议第一届全体会议来承担的。\n- 1949 年 9 月 21 日，中国人民政治协商会议第一届全体会议在北平中南海怀仁堂隆重开幕，通过了《中国人民政治协商会议共同纲领》。这个纲领成为中国人民的大宪章，在一个时期内起着新中国临时宪法的作用。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）中共七届二中全会<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1949 年 3 月在西柏坡召开的中共七届二中全会，规定了全国胜利后中国共产党在政治、经济、外交方面应当采取的基本政策，指出了中国由农业国转变为工业国、由新民主主义社会转变为社会主义社会的发展方向。<\/span>\n<\/li>\n<li><span class=\"li-text\">在中国共产党自身建设问题上，提出\"两个务必\"的思想，即\"务必使同志们继续保持谦虚谨慎、不骄不躁的作风，务必使同志们继续保持艰苦奋斗的作风\"，向全党警告，防止腐败。<\/span>\n<\/li>\n<li><span class=\"li-text\">3 月 23 日上午，中共中央离开西柏坡向北平进发。3 月 25 日，毛泽东等中央领导人与中央机关、人民解放军总部进驻北平香山，标志着中国革命重心从农村转向城市。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）《论人民民主专政》<\/h5>\n<p>1949 年 6 月 30 日，毛泽东发表《论人民民主专政》一文。中共七届二中全会的决议和《论人民民主专政》，构成了《中国人民政治协商会议共同纲领》的基础。<\/p>\n<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>《论人民民主专政》的主要内容<\/strong>：人民民主专政的基础是工农联盟；主要依靠工人阶级和农民阶级；为建立新中国，必须团结民族资产阶级；建立工人阶级领导的、以工农联盟为基础的人民民主专政。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）中国人民政治协商会议的召开<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">完成创建新中国的任务，是由中国人民政治协商会议第一届全体会议来承担的。<\/span>\n<\/li>\n<li><span class=\"li-text\">1949 年 9 月 21 日，中国人民政治协商会议第一届全体会议在北平中南海怀仁堂隆重开幕，通过了《中国人民政治协商会议共同纲领》。这个纲领成为中国人民的大宪章，在一个时期内起着新中国临时宪法的作用。<\/span>\n<\/li><\/ul>\n<\/section>"}, {"title": "三、中国革命胜利的伟大意义与基本经验", "tags": ["人物", "会议", "战争战役", "土地问题"], "text": "\n （一）中国革命胜利的原因\n\n1. 有深刻的社会根源和雄厚的群众基础（由于帝国主义、封建主义、官僚资本主义的残酷压迫，中国人民走上了反帝反封建反官僚资本主义斗争的伟大道路）；\n2. 根本：有中国共产党的领导，没有共产党就没有新中国（中国共产党不仅代表中国工人阶级的利益，而且代表整个中华民族和全中国人民的利益；能够制定出适合中国情况、符合中国人民利益的纲领、路线、方针和政策，为中国人民的斗争指明正确的方向）；\n3. 国际无产阶级和人民群众的支持。\n\n （二）中国革命胜利的意义\n\n1. 结束了中华民族遭受资本—帝国主义侵略和中国各族人民遭受资本—帝国主义、封建统治阶级联合压迫与剥削的历史，结束了国家战乱频仍、四分五裂的局面，实现了中国人民梦寐以求的民族独立和人民解放；\n2. 从根本上改变了中国社会的发展方向，为实现新民主主义向社会主义过渡创造了条件，为实现国家富强和人民幸福、实现中华民族伟大复兴开辟了广阔道路；\n3. 极大改变了世界的政治格局，壮大了世界和平、民主和社会主义的力量，鼓舞了世界被压迫民族和被压迫人民争取解放的斗争；\n4. 形成了伟大的毛泽东思想，找到了夺取中国革命胜利的正确道路。\n\n （三）中国革命胜利的基本经验\n\n1. 没有无产阶级及其政党——中国共产党的坚强领导，中国革命是不可能取得胜利的；\n2. 必须坚持把马克思列宁主义基本原理和中国具体实际结合起来，必须不断推进马克思主义中国化的事业；\n3. 统一战线、武装斗争、党的建设，是中国共产党在中国革命中战胜敌人的\"三大法宝\"；\n4. 革命的根本问题是国家政权问题，必须建立以工农联盟为基础的人民民主专政。\n\n 补充：革命统一战线中存在两个联盟：一个是劳动者的联盟，即工农联盟；一个是劳动者与非劳动者的联盟，主要是同民族资产阶级的联盟。必须坚决依靠第一个联盟，争取建立和扩大第二个联盟。中国的武装斗争，实质上是工人阶级领导的农民战争。\n\n---\n", "html": "<section class=\"lvl-5\">\n<h5>（一）中国革命胜利的原因<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">有深刻的社会根源和雄厚的群众基础（由于帝国主义、封建主义、官僚资本主义的残酷压迫，中国人民走上了反帝反封建反官僚资本主义斗争的伟大道路）；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>根本<\/strong>：有中国共产党的领导，没有共产党就没有新中国（中国共产党不仅代表中国工人阶级的利益，而且代表整个中华民族和全中国人民的利益；能够制定出适合中国情况、符合中国人民利益的纲领、路线、方针和政策，为中国人民的斗争指明正确的方向）；<\/span>\n<\/li>\n<li><span class=\"li-text\">国际无产阶级和人民群众的支持。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）中国革命胜利的意义<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">结束了中华民族遭受资本—帝国主义侵略和中国各族人民遭受资本—帝国主义、封建统治阶级联合压迫与剥削的历史，结束了国家战乱频仍、四分五裂的局面，实现了中国人民梦寐以求的民族独立和人民解放；<\/span>\n<\/li>\n<li><span class=\"li-text\">从根本上改变了中国社会的发展方向，为实现新民主主义向社会主义过渡创造了条件，为实现国家富强和人民幸福、实现中华民族伟大复兴开辟了广阔道路；<\/span>\n<\/li>\n<li><span class=\"li-text\">极大改变了世界的政治格局，壮大了世界和平、民主和社会主义的力量，鼓舞了世界被压迫民族和被压迫人民争取解放的斗争；<\/span>\n<\/li>\n<li><span class=\"li-text\">形成了伟大的毛泽东思想，找到了夺取中国革命胜利的正确道路。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）中国革命胜利的基本经验<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">没有无产阶级及其政党——中国共产党的坚强领导，中国革命是不可能取得胜利的；<\/span>\n<\/li>\n<li><span class=\"li-text\">必须坚持把马克思列宁主义基本原理和中国具体实际结合起来，必须不断推进马克思主义中国化的事业；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>统一战线、武装斗争、党的建设<\/strong>，是中国共产党在中国革命中战胜敌人的\"三大法宝\"；<\/span>\n<\/li>\n<li><span class=\"li-text\">革命的根本问题是国家政权问题，必须建立以工农联盟为基础的人民民主专政。<\/span>\n<\/li><\/ol>\n<blockquote><p><strong>补充<\/strong>：革命统一战线中存在两个联盟：一个是劳动者的联盟，即工农联盟；一个是劳动者与非劳动者的联盟，主要是同民族资产阶级的联盟。必须坚决依靠第一个联盟，争取建立和扩大第二个联盟。中国的武装斗争，实质上是工人阶级领导的农民战争。<\/p><\/blockquote>\n<hr/>\n<\/section>"}]}]}, {"num": "第八章", "title": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "name": "中华人民共和国的成立与中国社会主义建设道路的探索", "sections": [{"title": "第一节 中华人民共和国的成立和新生人民政权的巩固", "blocks": [{"title": "一、中国人民站起来了", "tags": ["人物", "思想理论", "时间节点"], "text": "\n1. 1949 年 10 月 1 日下午，在北京举行开国大典。\n2. 新中国成立的意义：\n   - 新民主主义革命的胜利、中华人民共和国的成立，彻底结束了旧中国半殖民地半封建社会的历史，彻底结束了极少数剥削者统治广大劳动人民的历史，彻底结束了旧中国一盘散沙的局面，彻底废除了列强强加给中国的不平等条约和帝国主义在中国的一切特权，实现了中国从几千年封建专制政治向人民民主的伟大飞跃，实现了中国高度统一和各民族空前团结。中国人从此站立起来了！中国人民从此把命运牢牢掌握在自己手中，成为国家、社会和自己命运的主人！中华民族发展进步从此开启了新纪元！\n   - 中华人民共和国的成立，是具有世界意义的大胜利，是马克思列宁主义在中国的胜利，是马克思列宁主义基本原理同中国革命具体实际相结合的思想——毛泽东思想的胜利。这个胜利，使马克思列宁主义、毛泽东思想在中国人民中获得很高的威信，被接受为人民共和国各项事业的指导思想，在世界范围内扩大了影响。\n", "html": "<ol class=\"md-list\">\n<li><span class=\"li-text\">1949 年 10 月 1 日下午，在北京举行开国大典。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>新中国成立的意义<\/strong>：<\/span>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">新民主主义革命的胜利、中华人民共和国的成立，彻底结束了旧中国半殖民地半封建社会的历史，彻底结束了极少数剥削者统治广大劳动人民的历史，彻底结束了旧中国一盘散沙的局面，彻底废除了列强强加给中国的不平等条约和帝国主义在中国的一切特权，实现了中国从几千年封建专制政治向人民民主的伟大飞跃，实现了中国高度统一和各民族空前团结。中国人从此站立起来了！中国人民从此把命运牢牢掌握在自己手中，成为国家、社会和自己命运的主人！中华民族发展进步从此开启了新纪元！<\/span>\n<\/li>\n<li><span class=\"li-text\">中华人民共和国的成立，是具有世界意义的大胜利，是马克思列宁主义在中国的胜利，是马克思列宁主义基本原理同中国革命具体实际相结合的思想——毛泽东思想的胜利。这个胜利，使马克思列宁主义、毛泽东思想在中国人民中获得很高的威信，被接受为人民共和国各项事业的指导思想，在世界范围内扩大了影响。<\/span>\n<\/li><\/ul>\n<\/li><\/ol>"}, {"title": "二、捍卫和巩固新生人民政权的斗争", "tags": ["人物", "会议", "战争战役", "土地问题"], "text": "\n （一）新中国成立初期面临的考验\n\n1. 能不能保卫住革命胜利果实、巩固新生人民政权；\n2. 能不能战胜经济困难，迅速恢复和发展国民经济；\n3. 能不能巩固民族独立，维护国家主权与安全；\n4. 能不能经受住全国执政的新考验，继续保持优良传统和作风。\n\n （二）巩固新政权的斗争措施\n\n1. 完成民主革命的遗留任务；\n2. 巩固民族独立，维护国家安全与主权（1949 年 10 月 2 日，苏联成为第一个同新中国建立外交关系的国家；1951 年西藏和平解放，标志着中国大陆实现了和平统一）；\n3. 抗美援朝，保家卫国：\n   - 时间：1950 年 10 月—1953 年 7 月 27 日签署停战协定（中国人民志愿军司令员兼政治委员为彭德怀）。\n   - 意义：抗美援朝战争打出了国威军威，打出了中国人民的精气神，捍卫了新中国安全，彰显了新中国大国地位，让新中国在错综复杂的国内国际环境中站稳了脚跟。在抗美援朝战争中，英雄的中国人民志愿军始终发扬祖国和人民利益高于一切、为了祖国和民族的尊严而奋不顾身的爱国主义精神，为了人类和平与正义事业而奋斗的国际主义精神，锻造了伟大抗美援朝精神。\n4. 恢复国民经济，为社会主义改造创造条件：没收官僚资本、建立国营经济，对私营经济进行调整改造以及发展农村合作互助组织；\n5. 教育科学文化卫生事业除旧布新；\n6. 加强中国共产党自身建设。\n\n- 新中国成立初期，社会经济中存在着五种成分：社会主义性质的国营经济、半社会主义性质的合作社经济、农民和手工业者的个体经济、私人资本主义经济和国家资本主义经济。新民主主义社会不是一个独立的社会形态，在经济上既有社会主义因素、又有资本主义因素，其性质具有过渡性。\n- 新中国成立后最初三年（1949—1952），在完成民主革命遗留任务的同时，社会主义革命的任务也已开始实行，主要表现在：①没收官僚资本，确立社会主义性质的国营经济的领导地位；②开始将资本主义工商业纳入国家资本主义轨道；③引导个体农民在土地改革后逐步走上互助合作的道路。\n- 1950 年 6 月，中共七届三中全会提出，争取国家财政经济状况的根本好转需要创造三个条件：土地改革的完成、现有工商业的调整、国家机构所需经费的大量节减。\n- 1951 年底至 1952 年，在党政机关内开展\"三反\"运动（反贪污、反浪费、反官僚主义），在私营工商业中开展\"五反\"运动（反行贿、反偷税漏税、反盗窃国家资财、反偷工减料、反盗窃国家经济情报）。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）新中国成立初期面临的考验<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">能不能保卫住革命胜利果实、巩固新生人民政权；<\/span>\n<\/li>\n<li><span class=\"li-text\">能不能战胜经济困难，迅速恢复和发展国民经济；<\/span>\n<\/li>\n<li><span class=\"li-text\">能不能巩固民族独立，维护国家主权与安全；<\/span>\n<\/li>\n<li><span class=\"li-text\">能不能经受住全国执政的新考验，继续保持优良传统和作风。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）巩固新政权的斗争措施<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">完成民主革命的遗留任务；<\/span>\n<\/li>\n<li><span class=\"li-text\">巩固民族独立，维护国家安全与主权（1949 年 10 月 2 日，苏联成为第一个同新中国建立外交关系的国家；1951 年西藏和平解放，标志着中国大陆实现了和平统一）；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>抗美援朝，保家卫国<\/strong>：<\/span>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">时间：1950 年 10 月—1953 年 7 月 27 日签署停战协定（中国人民志愿军司令员兼政治委员为彭德怀）。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>意义<\/strong>：抗美援朝战争打出了国威军威，打出了中国人民的精气神，捍卫了新中国安全，彰显了新中国大国地位，让新中国在错综复杂的国内国际环境中站稳了脚跟。在抗美援朝战争中，英雄的中国人民志愿军始终发扬祖国和人民利益高于一切、为了祖国和民族的尊严而奋不顾身的爱国主义精神，为了人类和平与正义事业而奋斗的国际主义精神，锻造了伟大抗美援朝精神。<\/span>\n<\/li><\/ul>\n<\/li>\n<li><span class=\"li-text\">恢复国民经济，为社会主义改造创造条件：没收官僚资本、建立国营经济，对私营经济进行调整改造以及发展农村合作互助组织；<\/span>\n<\/li>\n<li><span class=\"li-text\">教育科学文化卫生事业除旧布新；<\/span>\n<\/li>\n<li><span class=\"li-text\">加强中国共产党自身建设。<\/span>\n<\/li><\/ol>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">新中国成立初期，社会经济中存在着五种成分：社会主义性质的国营经济、半社会主义性质的合作社经济、农民和手工业者的个体经济、私人资本主义经济和国家资本主义经济。新民主主义社会不是一个独立的社会形态，在经济上既有社会主义因素、又有资本主义因素，其性质具有<strong>过渡性<\/strong>。<\/span>\n<\/li>\n<li><span class=\"li-text\">新中国成立后最初三年（1949—1952），在完成民主革命遗留任务的同时，社会主义革命的任务也已开始实行，主要表现在：①没收官僚资本，确立社会主义性质的国营经济的领导地位；②开始将资本主义工商业纳入国家资本主义轨道；③引导个体农民在土地改革后逐步走上互助合作的道路。<\/span>\n<\/li>\n<li><span class=\"li-text\">1950 年 6 月，中共七届三中全会提出，争取国家财政经济状况的根本好转需要创造三个条件：土地改革的完成、现有工商业的调整、国家机构所需经费的大量节减。<\/span>\n<\/li>\n<li><span class=\"li-text\">1951 年底至 1952 年，在党政机关内开展\"三反\"运动（反贪污、反浪费、反官僚主义），在私营工商业中开展\"五反\"运动（反行贿、反偷税漏税、反盗窃国家资财、反偷工减料、反盗窃国家经济情报）。<\/span>\n<\/li><\/ul>\n<\/section>"}]}, {"title": "第二节 党在过渡时期总路线及其实施", "blocks": [{"title": "一、党提出过渡时期总路线", "tags": ["思想理论", "经济建设", "时间节点"], "text": "\n- 中共中央在 1952 年底开始酝酿并于 1953 年正式提出党在过渡时期的总路线，明确规定：\"从中华人民共和国成立，到社会主义改造基本完成，这是一个过渡时期。党在这个过渡时期的总路线和总任务，是要在一个相当长的时期内，逐步实现国家的社会主义工业化，并逐步实现国家对农业、对手工业和对资本主义工商业的社会主义改造。\"\n- 这条总路线的主要内容概括为\"一化三改\"，又称\"一体两翼\"。\"一化\"是\"主体\"，\"三改\"是\"两翼\"，两者相辅相成、相互促进。\n- 过渡时期总路线体现了社会主义工业化与社会主义改造的紧密结合，体现了解放生产力与发展生产力、变革生产关系与发展生产力的有机统一。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">中共中央在 1952 年底开始酝酿并于 1953 年正式提出党在过渡时期的总路线，明确规定：\"从中华人民共和国成立，到社会主义改造基本完成，这是一个过渡时期。党在这个过渡时期的总路线和总任务，是要在一个相当长的时期内，逐步实现国家的社会主义工业化，并逐步实现国家对农业、对手工业和对资本主义工商业的社会主义改造。\"<\/span>\n<\/li>\n<li><span class=\"li-text\">这条总路线的主要内容概括为\"<strong>一化三改<\/strong>\"，又称\"一体两翼\"。\"一化\"是\"主体\"，\"三改\"是\"两翼\"，两者相辅相成、相互促进。<\/span>\n<\/li>\n<li><span class=\"li-text\">过渡时期总路线体现了社会主义工业化与社会主义改造的紧密结合，体现了解放生产力与发展生产力、变革生产关系与发展生产力的有机统一。<\/span>\n<\/li><\/ul>"}, {"title": "二、社会主义工业化的起步", "tags": ["会议", "思想理论", "经济建设", "时间节点"], "text": "\n- 制定\"一五\"计划：我国从 1951 年着手编制第一个五年计划，1955 年 7 月召开的一届全国人大二次会议通过了这个计划。\n- \"一五\"计划确定的经济建设指导方针，突出了集中主要力量发展重工业、建立国家工业化和国防现代化的初步基础这一核心要点，同时要求相应地发展交通运输业、轻工业、农业和商业，相应地培养建设人才，保证国民经济中社会主义成分的比重稳步增长，保证在发展生产的基础上逐步提高人民的物质生活和文化生活水平等。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>制定\"一五\"计划<\/strong>：我国从 1951 年着手编制第一个五年计划，1955 年 7 月召开的一届全国人大二次会议通过了这个计划。<\/span>\n<\/li>\n<li><span class=\"li-text\">\"一五\"计划确定的经济建设指导方针，突出了集中主要力量发展重工业、建立国家工业化和国防现代化的初步基础这一核心要点，同时要求相应地发展交通运输业、轻工业、农业和商业，相应地培养建设人才，保证国民经济中社会主义成分的比重稳步增长，保证在发展生产的基础上逐步提高人民的物质生活和文化生活水平等。<\/span>\n<\/li><\/ul>"}, {"title": "三、改造个体农业和手工业", "tags": ["土地问题", "经济建设", "时间节点"], "text": "\n1. 1953 年开始农业合作化，建立农业生产合作社；1956 年底，农业合作化基本完成。\n2. 1956 年底，手工业合作化基本完成。\n\n有中国特点的农业合作化道路：①在中国的条件下，可以走先合作化、后机械化的道路；②通过互助组、初级社、高级社逐步过渡；③坚持自愿和互利的原则；④把增产作为衡量合作社是否办好的标准；⑤把社会改造同技术改造相结合。\n", "html": "<ol class=\"md-list\">\n<li><span class=\"li-text\">1953 年开始农业合作化，建立农业生产合作社；1956 年底，农业合作化基本完成。<\/span>\n<\/li>\n<li><span class=\"li-text\">1956 年底，手工业合作化基本完成。<\/span>\n<\/li><\/ol>\n<p><strong>有中国特点的农业合作化道路<\/strong>：①在中国的条件下，可以走先合作化、后机械化的道路；②通过互助组、初级社、高级社逐步过渡；③坚持自愿和互利的原则；④把增产作为衡量合作社是否办好的标准；⑤把社会改造同技术改造相结合。<\/p>"}, {"title": "四、改造资本主义工商业", "tags": ["思想理论", "经济建设"], "text": "\n- 经过国家资本主义走向社会主义：对民族资本主义工商业采取和平赎买政策，通过国家资本主义的初级形式（加工订货、统购包销、经销代销等）和高级形式（个别企业公私合营、全行业公私合营），逐步过渡为社会主义性质的企业。企业利润采取\"四马分肥\"的办法，即国家所得税、企业公积金、工人福利费、股金红利。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">经过国家资本主义走向社会主义：对民族资本主义工商业采取和平赎买政策，通过国家资本主义的初级形式（加工订货、统购包销、经销代销等）和高级形式（个别企业公私合营、全行业公私合营），逐步过渡为社会主义性质的企业。企业利润采取\"四马分肥\"的办法，即国家所得税、企业公积金、工人福利费、股金红利。<\/span>\n<\/li><\/ul>"}]}, {"title": "第三节 初步确立社会主义基本制度", "blocks": [{"title": "一、建立社会主义经济制度", "tags": ["思想理论", "经济建设"], "text": "\n随着社会主义改造的完成，以生产资料公有制、按劳分配和计划经济体制为特征的社会主义经济制度建立起来，这是中国进入社会主义社会最主要的标志。\n", "html": "<p>随着社会主义改造的完成，以生产资料公有制、按劳分配和计划经济体制为特征的社会主义经济制度建立起来，这是中国进入社会主义社会最主要的标志。<\/p>"}, {"title": "二、确立社会主义政治制度", "tags": ["会议", "条约文献", "思想理论", "经济建设"], "text": "\n人民代表大会制度这一根本政治制度，中国共产党领导的多党合作和政治协商制度、民族区域自治制度等基本政治制度的建立，构成了我国社会主义的政治制度体系，为我国社会主义经济基础和相应的经济制度的确立提供了政治保障。\n\n- 1954 年 9 月，第一届全国人民代表大会第一次会议在北京召开，通过了《中华人民共和国宪法》，人民代表大会制度这一新中国的根本政治制度从此建立。\n\n 社会主义改造基本完成的意义：①社会主义改造的基本完成，使社会主义的基本经济制度建立起来，这是中国进入社会主义社会的最主要标志；②社会主义改造是由私有制到公有制的一场伟大变革，使生产力从旧的生产关系束缚中解放出来，对生产力的发展直接起到了促进作用；③中国共产党创造性地完成了由新民主主义到社会主义的过渡，实现了中国历史上最伟大最深刻的社会变革，开始了中华民族伟大复兴的历史征程。\n", "html": "<p>人民代表大会制度这一根本政治制度，中国共产党领导的多党合作和政治协商制度、民族区域自治制度等基本政治制度的建立，构成了我国社会主义的政治制度体系，为我国社会主义经济基础和相应的经济制度的确立提供了政治保障。<\/p>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1954 年 9 月，第一届全国人民代表大会第一次会议在北京召开，通过了《中华人民共和国宪法》，人民代表大会制度这一新中国的根本政治制度从此建立。<\/span>\n<\/li><\/ul>\n<blockquote><p><strong>社会主义改造基本完成的意义<\/strong>：①社会主义改造的基本完成，使社会主义的基本经济制度建立起来，这是中国进入社会主义社会的最主要标志；②社会主义改造是由私有制到公有制的一场伟大变革，使生产力从旧的生产关系束缚中解放出来，对生产力的发展直接起到了促进作用；③中国共产党创造性地完成了由新民主主义到社会主义的过渡，实现了中国历史上最伟大最深刻的社会变革，开始了中华民族伟大复兴的历史征程。<\/p><\/blockquote>"}]}, {"title": "第四节 全面建设社会主义的良好开端", "blocks": [{"title": "要点", "tags": ["人物", "会议", "条约文献", "思想理论"], "text": "\n1. 1956 年，毛泽东提出把马克思列宁主义基本原理同中国具体实际进行\"第二次结合\"的任务，为探索适合中国情况的社会主义建设道路提供了基本的指导。\n2. 1956 年，毛泽东作《论十大关系》的报告。《论十大关系》是以毛泽东为主要代表的中国共产党人开始探索适合中国国情的社会主义建设道路的标志。报告围绕一个基本方针：\"一定要努力把党内党外、国内国外的一切积极的因素，直接的、间接的积极因素，全部调动起来，把我国建设成为一个强大的社会主义国家。\"\n3. 中共八大路线的制定：1956 年 9 月，中国共产党第八次全国代表大会在北京举行。\n    八大正确分析了国内形势和主要矛盾的变化，明确提出新形势下党和人民的主要任务。大会宣布：社会主义制度在我国已经基本上建立起来；国内主要矛盾已经是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾；全国人民的主要任务是集中力量发展社会生产力，实现国家工业化，逐步满足人民日益增长的物质和文化需要；还要加强人民民主专政，但根本任务已经是在新的生产关系下面保护和发展生产力。\n    大会肯定\"三个主体、三个补充\"的思想，即以国家经营和集体经营、计划生产、国家市场三者为主体，以个体经营、自由生产、自由市场三者为补充。这是在理论上突破苏联计划经济模式、探索经济体制改革的重要尝试。\n    八大通过的新党章是中国共产党在全国执政以后制定的第一部党章。\n4. 1957 年，毛泽东发表《关于正确处理人民内部矛盾的问题》的讲话。\n    主要内容：①提出要把正确处理人民内部矛盾作为国家政治生活的主题；②指出社会主义社会的基本矛盾仍然是生产关系和生产力之间、上层建筑和经济基础之间的矛盾，可以通过社会主义制度本身的自我调整和自我完善不断得到解决；③社会主义社会存在敌我矛盾和人民内部矛盾两类不同性质的矛盾，前者用专政的方法解决，后者只能用民主的、说服的、教育的（\"团结—批评—团结\"）方法解决。\n5. 1957 年 4 月 27 日，中共中央下发《关于整风运动的指示》，决定在全党进行一次反对官僚主义、宗派主义和主观主义的整风运动；同年开展的反右派斗争，对极少数右派分子的进攻进行坚决反击是完全正确和必要的，但反右派斗争被严重地扩大化了。\n6. 毛泽东还指出：社会主义这个阶段又可能分为两个阶段，第一个阶段是不发达的社会主义，第二个阶段是比较发达的社会主义，后一阶段可能比前一阶段需要更长的时间。\n", "html": "<ol class=\"md-list\">\n<li><span class=\"li-text\">1956 年，毛泽东提出把马克思列宁主义基本原理同中国具体实际进行\"<strong>第二次结合<\/strong>\"的任务，为探索适合中国情况的社会主义建设道路提供了基本的指导。<\/span>\n<\/li>\n<li><span class=\"li-text\">1956 年，毛泽东作《论十大关系》的报告。《论十大关系》是以毛泽东为主要代表的中国共产党人开始探索适合中国国情的社会主义建设道路的标志。报告围绕一个基本方针：\"一定要努力把党内党外、国内国外的一切积极的因素，直接的、间接的积极因素，全部调动起来，把我国建设成为一个强大的社会主义国家。\"<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>中共八大路线的制定<\/strong>：1956 年 9 月，中国共产党第八次全国代表大会在北京举行。<\/span>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">八大正确分析了国内形势和主要矛盾的变化，明确提出新形势下党和人民的主要任务。大会宣布：社会主义制度在我国已经基本上建立起来；国内主要矛盾已经是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾；全国人民的主要任务是集中力量发展社会生产力，实现国家工业化，逐步满足人民日益增长的物质和文化需要；还要加强人民民主专政，但根本任务已经是在新的生产关系下面保护和发展生产力。<\/span>\n<\/li>\n<li><span class=\"li-text\">大会肯定\"三个主体、三个补充\"的思想，即以国家经营和集体经营、计划生产、国家市场三者为主体，以个体经营、自由生产、自由市场三者为补充。这是在理论上突破苏联计划经济模式、探索经济体制改革的重要尝试。<\/span>\n<\/li>\n<li><span class=\"li-text\">八大通过的新党章是中国共产党在全国执政以后制定的第一部党章。<\/span>\n<\/li><\/ul>\n<\/li>\n<li><span class=\"li-text\">1957 年，毛泽东发表《关于正确处理人民内部矛盾的问题》的讲话。<\/span>\n<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>主要内容<\/strong>：①提出要把正确处理人民内部矛盾作为国家政治生活的主题；②指出社会主义社会的基本矛盾仍然是生产关系和生产力之间、上层建筑和经济基础之间的矛盾，可以通过社会主义制度本身的自我调整和自我完善不断得到解决；③社会主义社会存在敌我矛盾和人民内部矛盾两类不同性质的矛盾，前者用专政的方法解决，后者只能用民主的、说服的、教育的（\"团结—批评—团结\"）方法解决。<\/span>\n<\/li><\/ul>\n<\/li>\n<li><span class=\"li-text\">1957 年 4 月 27 日，中共中央下发《关于整风运动的指示》，决定在全党进行一次反对官僚主义、宗派主义和主观主义的整风运动；同年开展的反右派斗争，对极少数右派分子的进攻进行坚决反击是完全正确和必要的，但反右派斗争被严重地扩大化了。<\/span>\n<\/li>\n<li><span class=\"li-text\">毛泽东还指出：社会主义这个阶段又可能分为两个阶段，第一个阶段是不发达的社会主义，第二个阶段是比较发达的社会主义，后一阶段可能比前一阶段需要更长的时间。<\/span>\n<\/li><\/ol>"}]}, {"title": "第五节 社会主义道路的艰辛探索和曲折发展", "blocks": [{"title": "一、\"大跃进\"和初步纠正\"左\"倾错误的努力", "tags": ["人物", "会议", "土地问题", "思想理论"], "text": "\n （一）\"大跃进\"和人民公社化运动\n\n- 1958 年 5 月，党的八大二次会议通过\"鼓足干劲、力争上游、多快好省地建设社会主义\"的社会主义建设总路线，反映了广大人民群众迫切要求改变国家经济文化落后状况的普遍愿望，但忽视了客观的经济规律。会后，\"大跃进\"运动在全国范围内开展起来。农业方面提出\"以粮为纲\"口号，工业方面提出\"以钢为纲\"口号，掀起大炼钢铁的群众运动。\n- 在\"大跃进\"迅猛发展的同时，农村掀起人民公社化运动高潮。\"大跃进\"初期建立的人民公社实行\"政社合一\"的体制，其基本特点被概括为\"一大二公\"。实际上，这是刮\"一平二调\"的\"共产风\"，搞平均主义，无偿调拨生产队包括社员个人的财物和劳动力，严重损害了农民的生产积极性。\n\n （二）初步纠正\"左\"倾错误的努力\n\n毛泽东是中共中央领导集体中较早觉察并实际纠正\"左\"倾错误的领导人。从 1958 年 11 月第一次郑州会议到 1959 年 7 月庐山会议前期，党中央领导整顿人民公社、调整高指标，作了初步纠正\"左\"倾错误的努力，使\"共产风\"、浮夸风、高指标和瞎指挥得到初步遏制，形势开始有所好转。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）\"大跃进\"和人民公社化运动<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1958 年 5 月，党的八大二次会议通过\"鼓足干劲、力争上游、多快好省地建设社会主义\"的社会主义建设总路线，反映了广大人民群众迫切要求改变国家经济文化落后状况的普遍愿望，但忽视了客观的经济规律。会后，\"大跃进\"运动在全国范围内开展起来。农业方面提出\"以粮为纲\"口号，工业方面提出\"以钢为纲\"口号，掀起大炼钢铁的群众运动。<\/span>\n<\/li>\n<li><span class=\"li-text\">在\"大跃进\"迅猛发展的同时，农村掀起人民公社化运动高潮。\"大跃进\"初期建立的人民公社实行\"政社合一\"的体制，其基本特点被概括为\"一大二公\"。实际上，这是刮\"一平二调\"的\"共产风\"，搞平均主义，无偿调拨生产队包括社员个人的财物和劳动力，严重损害了农民的生产积极性。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）初步纠正\"左\"倾错误的努力<\/h5>\n<p>毛泽东是中共中央领导集体中较早觉察并实际纠正\"左\"倾错误的领导人。从 1958 年 11 月第一次郑州会议到 1959 年 7 月庐山会议前期，党中央领导整顿人民公社、调整高指标，作了初步纠正\"左\"倾错误的努力，使\"共产风\"、浮夸风、高指标和瞎指挥得到初步遏制，形势开始有所好转。<\/p>\n<\/section>"}, {"title": "二、国民经济的调整", "tags": ["会议", "条约文献", "思想理论", "经济建设"], "text": "\n1960 年 11 月，中共中央发出《关于农村人民公社当前政策问题的紧急指示信》，着手解决当时最为突出的农业和农村问题。1961 年 1 月，党的八届九中全会决定对国民经济实行\"调整、巩固、充实、提高\"的八字方针。以这两件事为标志，\"大跃进\"运动实际上已被停止，国民经济开始转入调整的新轨道。\n", "html": "<p>1960 年 11 月，中共中央发出《关于农村人民公社当前政策问题的紧急指示信》，着手解决当时最为突出的农业和农村问题。1961 年 1 月，党的八届九中全会决定对国民经济实行\"调整、巩固、充实、提高\"的八字方针。以这两件事为标志，\"大跃进\"运动实际上已被停止，国民经济开始转入调整的新轨道。<\/p>"}, {"title": "三、\"文化大革命\"内乱及其历史教训", "tags": ["人物", "会议", "条约文献", "思想理论"], "text": "\n- 性质：\"文化大革命\"是一场由领导者错误发动、被反革命集团利用，给党、国家和各族人民带来严重灾难的内乱。\n\n1. 发动：1966 年 5 月，中共中央政治局扩大会议通过《中国共产党中央委员会通知》（简称\"五一六通知\"）；8 月，党的八届十一中全会通过《中国共产党中央委员会关于无产阶级文化大革命的决定》（简称\"十六条\"），提出\"这次运动的重点，是整党内那些走资本主义道路的当权派\"。这两次会议的召开，标志着\"文化大革命\"运动的全面发动。\n2. 结束：1971 年 9 月，林彪反革命集团覆灭（九一三事件）；1976 年 10 月，中共中央粉碎\"四人帮\"，结束了\"文化大革命\"，中国社会正常秩序得以恢复，党和国家的工作开始重新走上健康发展的轨道。\n3. \"文化大革命\"的历史教训：\n   1. 必须科学对待马克思列宁主义，准确把握中国基本国情，从实际出发认识\"什么是社会主义\"和\"如何建设社会主义\"的问题，探索自己的建设社会主义道路；\n   2. 必须正确认识社会主义社会的主要矛盾和党和国家的主要任务，集中力量发展生产力；\n   3. 必须改革和完善党和国家的领导制度，健全民主集中制和集体领导原则；\n   4. 必须发展社会主义民主，加强社会主义法制；\n   5. 必须制定正确的党的建设的方针和政策，不断加强执政党的建设。\n\n 如何认识党在社会主义建设时期所犯的严重错误（包括\"文化大革命\"）的性质与原因？ 性质：是探索中的错误，不是由社会主义制度本身造成的。原因：①对于什么是社会主义、怎样建设社会主义的问题，还没有完全搞清楚；②把不属于阶级斗争的问题看作阶级斗争，导致阶级斗争扩大化；③党的民主集中制和集体领导制度遭到严重破坏，致使党无法依靠制度和集体的力量及时发现并纠正错误。\n\n 毛泽东等老一代革命家探索中国社会主义建设道路的理论贡献：①论述了必须实行马克思主义与中国实际\"第二次结合\"的基本思想；②提出了社会主义社会矛盾的学说；③阐明了建设社会主义的基本方针。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>性质<\/strong>：\"文化大革命\"是一场由领导者错误发动、被反革命集团利用，给党、国家和各族人民带来严重灾难的内乱。<\/span>\n<\/li><\/ul>\n<ol class=\"md-list\">\n<li><span class=\"li-text\"><strong>发动<\/strong>：1966 年 5 月，中共中央政治局扩大会议通过《中国共产党中央委员会通知》（简称\"五一六通知\"）；8 月，党的八届十一中全会通过《中国共产党中央委员会关于无产阶级文化大革命的决定》（简称\"十六条\"），提出\"这次运动的重点，是整党内那些走资本主义道路的当权派\"。这两次会议的召开，标志着\"文化大革命\"运动的全面发动。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>结束<\/strong>：1971 年 9 月，林彪反革命集团覆灭（九一三事件）；1976 年 10 月，中共中央粉碎\"四人帮\"，结束了\"文化大革命\"，中国社会正常秩序得以恢复，党和国家的工作开始重新走上健康发展的轨道。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>\"文化大革命\"的历史教训<\/strong>：<\/span>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">必须科学对待马克思列宁主义，准确把握中国基本国情，从实际出发认识\"什么是社会主义\"和\"如何建设社会主义\"的问题，探索自己的建设社会主义道路；<\/span>\n<\/li>\n<li><span class=\"li-text\">必须正确认识社会主义社会的主要矛盾和党和国家的主要任务，集中力量发展生产力；<\/span>\n<\/li>\n<li><span class=\"li-text\">必须改革和完善党和国家的领导制度，健全民主集中制和集体领导原则；<\/span>\n<\/li>\n<li><span class=\"li-text\">必须发展社会主义民主，加强社会主义法制；<\/span>\n<\/li>\n<li><span class=\"li-text\">必须制定正确的党的建设的方针和政策，不断加强执政党的建设。<\/span>\n<\/li><\/ol>\n<\/li><\/ol>\n<blockquote><p><strong>如何认识党在社会主义建设时期所犯的严重错误（包括\"文化大革命\"）的性质与原因？<\/strong> 性质：是探索中的错误，不是由社会主义制度本身造成的。原因：①对于什么是社会主义、怎样建设社会主义的问题，还没有完全搞清楚；②把不属于阶级斗争的问题看作阶级斗争，导致阶级斗争扩大化；③党的民主集中制和集体领导制度遭到严重破坏，致使党无法依靠制度和集体的力量及时发现并纠正错误。<\/p>\n<p><strong>毛泽东等老一代革命家探索中国社会主义建设道路的理论贡献<\/strong>：①论述了必须实行马克思主义与中国实际\"第二次结合\"的基本思想；②提出了社会主义社会矛盾的学说；③阐明了建设社会主义的基本方针。<\/p><\/blockquote>"}]}, {"title": "高频主观题", "blocks": [{"title": "要点", "tags": ["会议", "思想理论", "经济建设", "时间节点"], "text": "\n 辨析题：社会主义三大改造完成后，我国国内的主要矛盾是无产阶级和资产阶级的矛盾。\n\n 错误。社会主义改造完成后，资本主义工商业已经被改造成为社会主义全民所有制企业，作为剥削阶级的民族资产阶级已经被消灭，资产阶级分子已经被改造或者正在被改造成为自食其力的劳动者，无产阶级与资产阶级的矛盾、社会主义道路与资本主义道路的矛盾，已经不是我国社会的主要矛盾。此时我国国内的主要矛盾是人民日益增长的物质文化需要同落后的社会生产之间的矛盾。\n\n 论述题：为什么说 20 世纪 50 年代中国选择社会主义具有历史必然性（为什么说过渡时期总路线反映了历史的必然性）？\n\n 1. 社会主义工业化是国家实现独立富强的首要条件。要改变落后面貌、巩固国家政权，就必须通过社会主义道路实现国家工业化；\n 2. 社会主义性质的国营经济力量相对来说比较强大，它是实现国家工业化的主要基础；\n 3. 资本主义经济力量弱小、发展困难，它不可能成为中国工业起飞的基地；\n 4. 对个体农业进行社会主义改造，是保证工业发展、实现国家工业化的一个必要条件；\n 5. 当时的国际环境也促使中国选择社会主义。\n\n 简答题：全面建设社会主义时期取得的历史性成就？\n\n 1. 建立了独立的、比较完整的工业体系和国民经济体系；\n 2. 人民生活水平提高；\n 3. 文化、教育、医疗和科技事业普遍发展（\"两弹一星\"等国防尖端科技取得重大突破：1964 年第一颗原子弹爆炸成功、1967 年第一颗氢弹爆炸成功、1970 年第一颗人造地球卫星发射成功）；\n 4. 形成历久弥新的时代精神；\n 5. 国际地位提高和国际环境改善（1971 年中国恢复在联合国的合法席位；1972 年尼克松访华，中美关系开始走向正常化，1979 年中美正式建交）。\n\n\n", "html": "<blockquote><p><strong>辨析题：社会主义三大改造完成后，我国国内的主要矛盾是无产阶级和资产阶级的矛盾。<\/strong><\/p>\n<p><strong>错误<\/strong>。社会主义改造完成后，资本主义工商业已经被改造成为社会主义全民所有制企业，作为剥削阶级的民族资产阶级已经被消灭，资产阶级分子已经被改造或者正在被改造成为自食其力的劳动者，无产阶级与资产阶级的矛盾、社会主义道路与资本主义道路的矛盾，已经不是我国社会的主要矛盾。此时我国国内的主要矛盾是人民日益增长的物质文化需要同落后的社会生产之间的矛盾。<\/p>\n<p><strong>论述题：为什么说 20 世纪 50 年代中国选择社会主义具有历史必然性（为什么说过渡时期总路线反映了历史的必然性）？<\/strong><\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">社会主义工业化是国家实现独立富强的首要条件。要改变落后面貌、巩固国家政权，就必须通过社会主义道路实现国家工业化；<\/span>\n<\/li>\n<li><span class=\"li-text\">社会主义性质的国营经济力量相对来说比较强大，它是实现国家工业化的主要基础；<\/span>\n<\/li>\n<li><span class=\"li-text\">资本主义经济力量弱小、发展困难，它不可能成为中国工业起飞的基地；<\/span>\n<\/li>\n<li><span class=\"li-text\">对个体农业进行社会主义改造，是保证工业发展、实现国家工业化的一个必要条件；<\/span>\n<\/li>\n<li><span class=\"li-text\">当时的国际环境也促使中国选择社会主义。<\/span>\n<\/li><\/ol>\n<p><strong>简答题：全面建设社会主义时期取得的历史性成就？<\/strong><\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">建立了独立的、比较完整的工业体系和国民经济体系；<\/span>\n<\/li>\n<li><span class=\"li-text\">人民生活水平提高；<\/span>\n<\/li>\n<li><span class=\"li-text\">文化、教育、医疗和科技事业普遍发展（\"两弹一星\"等国防尖端科技取得重大突破：1964 年第一颗原子弹爆炸成功、1967 年第一颗氢弹爆炸成功、1970 年第一颗人造地球卫星发射成功）；<\/span>\n<\/li>\n<li><span class=\"li-text\">形成历久弥新的时代精神；<\/span>\n<\/li>\n<li><span class=\"li-text\">国际地位提高和国际环境改善（1971 年中国恢复在联合国的合法席位；1972 年尼克松访华，中美关系开始走向正常化，1979 年中美正式建交）。<\/span>\n<\/li><\/ol><\/blockquote>\n<hr/>"}]}]}, {"num": "第九章", "title": "第九章 改革开放与中国特色社会主义的开创和发展", "name": "改革开放与中国特色社会主义的开创和发展", "sections": [{"title": "第一节 历史性的伟大转折和改革开放的起步", "blocks": [{"title": "一、伟大的历史转折", "tags": ["人物", "会议", "思想理论", "党的建设"], "text": "\n （一）\"两个凡是\"与思想先导\n\n- \"两个凡是\"：\"凡是毛主席作出的决策，我们都坚决拥护；凡是毛主席的指示，我们都始终不渝地遵循。\"\n- \"两个凡是\"在理论上违背了马克思主义基本原理和党的实事求是的思想路线，在实践上给坚持真理、修正错误造成了阻碍。冲破\"两个凡是\"的思想束缚，成为拨乱反正和改革开放的思想先导。\n\n （二）关于真理标准问题的讨论\n\n1. 时间：1978 年 5 月 11 日。\n2. 事件：《光明日报》发表《实践是检验真理的唯一标准》一文，在全国展开了关于真理标准问题的讨论。\n3. 影响：\n   1. 是继延安整风后的一场马克思主义思想解放运动；\n   2. 为党重新确立实事求是的思想路线；\n   3. 纠正长期以来\"左\"倾错误；\n   4. 为实现历史性转折作了思想理论准备。\n\n （三）中共十一届三中全会的召开\n\n- 1978 年 12 月 13 日，邓小平在中央工作会议闭幕式上作了题为《解放思想，实事求是，团结一致向前看》的讲话。意义：这个讲话是解放思想、开辟新时期新道路的宣言书，实际上成为随后召开的党的十一届三中全会的主题报告，为全会实现具有划时代意义的伟大转折奠定了重要基础。\n- 时间：1978 年 12 月 18 日至 22 日。\n- 内容：\n  1. 冲破长期\"左\"的错误的严重束缚，彻底否定\"两个凡是\"的错误方针；\n  2. 高度评价了关于真理标准问题的讨论，果断停止使用\"以阶级斗争为纲\"的口号，把全党的工作重心转移到社会主义现代化建设上来；\n  3. 提出改革开放的任务，强调要充分发扬民主，提出要健全党的民主集中制，健全党规党法，严肃党纪；\n  4. 要正确对待毛泽东的历史地位和毛泽东思想的科学体系；\n  5. 增选了中央领导机构成员，选举产生中共中央纪律检查委员会。\n- 全会实际上形成了以邓小平为核心的党的中央领导集体。\n- 意义：党的十一届三中全会的胜利召开，结束了粉碎\"四人帮\"后党和国家工作在徘徊中前进的局面，标志着中国共产党重新确立了马克思主义的思想路线、政治路线、组织路线，开启了我国改革开放和社会主义现代化建设新时期，实现了历史性的伟大转折。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）\"两个凡是\"与思想先导<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">\"两个凡是\"：\"凡是毛主席作出的决策，我们都坚决拥护；凡是毛主席的指示，我们都始终不渝地遵循。\"<\/span>\n<\/li>\n<li><span class=\"li-text\">\"两个凡是\"在理论上违背了马克思主义基本原理和党的实事求是的思想路线，在实践上给坚持真理、修正错误造成了阻碍。冲破\"两个凡是\"的思想束缚，成为拨乱反正和改革开放的思想先导。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）关于真理标准问题的讨论<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\"><strong>时间<\/strong>：1978 年 5 月 11 日。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>事件<\/strong>：《光明日报》发表《实践是检验真理的唯一标准》一文，在全国展开了关于真理标准问题的讨论。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>影响<\/strong>：<\/span>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">是继延安整风后的一场马克思主义思想解放运动；<\/span>\n<\/li>\n<li><span class=\"li-text\">为党重新确立实事求是的思想路线；<\/span>\n<\/li>\n<li><span class=\"li-text\">纠正长期以来\"左\"倾错误；<\/span>\n<\/li>\n<li><span class=\"li-text\">为实现历史性转折作了思想理论准备。<\/span>\n<\/li><\/ol>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）中共十一届三中全会的召开<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1978 年 12 月 13 日，邓小平在中央工作会议闭幕式上作了题为《解放思想，实事求是，团结一致向前看》的讲话。<strong>意义<\/strong>：这个讲话是解放思想、开辟新时期新道路的宣言书，实际上成为随后召开的党的十一届三中全会的主题报告，为全会实现具有划时代意义的伟大转折奠定了重要基础。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>时间<\/strong>：1978 年 12 月 18 日至 22 日。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>内容<\/strong>：<\/span>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">冲破长期\"左\"的错误的严重束缚，彻底否定\"两个凡是\"的错误方针；<\/span>\n<\/li>\n<li><span class=\"li-text\">高度评价了关于真理标准问题的讨论，果断停止使用\"以阶级斗争为纲\"的口号，把全党的工作重心转移到社会主义现代化建设上来；<\/span>\n<\/li>\n<li><span class=\"li-text\">提出改革开放的任务，强调要充分发扬民主，提出要健全党的民主集中制，健全党规党法，严肃党纪；<\/span>\n<\/li>\n<li><span class=\"li-text\">要正确对待毛泽东的历史地位和毛泽东思想的科学体系；<\/span>\n<\/li>\n<li><span class=\"li-text\">增选了中央领导机构成员，选举产生中共中央纪律检查委员会。<\/span>\n<\/li><\/ol>\n<\/li>\n<li><span class=\"li-text\">全会实际上形成了以邓小平为核心的党的中央领导集体。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>意义<\/strong>：党的十一届三中全会的胜利召开，结束了粉碎\"四人帮\"后党和国家工作在徘徊中前进的局面，标志着中国共产党重新确立了马克思主义的思想路线、政治路线、组织路线，开启了我国改革开放和社会主义现代化建设新时期，实现了历史性的伟大转折。<\/span>\n<\/li><\/ul>\n<\/section>"}, {"title": "二、拨乱反正任务的基本完成", "tags": ["人物", "会议", "条约文献", "思想理论"], "text": "\n （一）大规模平反冤假错案和调整社会关系\n\n （二）发表《坚持四项基本原则》\n\n1. 时间：1979 年 3 月 30 日；\n2. 人物：邓小平；\n3. 会议：理论工作务虚会；\n4. 四项基本原则的内容：坚持社会主义道路、坚持人民民主专政、坚持共产党的领导、坚持马列主义、毛泽东思想；\n5. 重要性：这是实现四个现代化的根本前提。如果动摇了其中的任何一项，那就动摇了整个社会主义现代化建设事业。\n\n （三）制定《关于建国以来党的若干历史问题的决议》和明确新时期我国社会主要矛盾\n\n- 时间：1981 年 6 月，党的十一届六中全会通过了这个决议。\n- 内容：\n  1. 从根本上否定了\"文化大革命\"的错误理论和实践，对新中国成立以来的重大历史事件和重要历史人物作出了基本结论；\n  2. 科学地评价了毛泽东和毛泽东思想的历史地位（评价毛泽东同志是伟大的马克思主义者，是伟大的无产阶级革命家、战略家和理论家，他的功绩是第一位的、错误是第二位的；毛泽东思想是马克思列宁主义在中国的运用和发展，是被实践证明了的关于中国革命和建设的正确的理论原则和经验总结，是中国共产党集体智慧的结晶），对毛泽东思想的科学体系和活的灵魂（实事求是、群众路线、独立自主）作了概括，强调毛泽东思想是我们党的宝贵精神财富，它将长期指导我们的行动；\n  3. 对党的十一届三中全会以来逐步确立的适合中国情况的建设社会主义现代化强国的道路，从十个方面作了概括。\n- 意义：党制定《决议》，标志着党在指导思想上的拨乱反正胜利完成。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）大规模平反冤假错案和调整社会关系<\/h5>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）发表《坚持四项基本原则》<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\"><strong>时间<\/strong>：1979 年 3 月 30 日；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>人物<\/strong>：邓小平；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>会议<\/strong>：理论工作务虚会；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>四项基本原则的内容<\/strong>：坚持社会主义道路、坚持人民民主专政、坚持共产党的领导、坚持马列主义、毛泽东思想；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>重要性<\/strong>：这是实现四个现代化的根本前提。如果动摇了其中的任何一项，那就动摇了整个社会主义现代化建设事业。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）制定《关于建国以来党的若干历史问题的决议》和明确新时期我国社会主要矛盾<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>时间<\/strong>：1981 年 6 月，党的十一届六中全会通过了这个决议。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>内容<\/strong>：<\/span>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">从根本上否定了\"文化大革命\"的错误理论和实践，对新中国成立以来的重大历史事件和重要历史人物作出了基本结论；<\/span>\n<\/li>\n<li><span class=\"li-text\">科学地评价了毛泽东和毛泽东思想的历史地位（评价毛泽东同志是伟大的马克思主义者，是伟大的无产阶级革命家、战略家和理论家，他的功绩是第一位的、错误是第二位的；毛泽东思想是马克思列宁主义在中国的运用和发展，是被实践证明了的关于中国革命和建设的正确的理论原则和经验总结，是中国共产党集体智慧的结晶），对毛泽东思想的科学体系和活的灵魂（实事求是、群众路线、独立自主）作了概括，强调毛泽东思想是我们党的宝贵精神财富，它将长期指导我们的行动；<\/span>\n<\/li>\n<li><span class=\"li-text\">对党的十一届三中全会以来逐步确立的适合中国情况的建设社会主义现代化强国的道路，从十个方面作了概括。<\/span>\n<\/li><\/ol>\n<\/li>\n<li><span class=\"li-text\"><strong>意义<\/strong>：党制定《决议》，标志着党在指导思想上的拨乱反正胜利完成。<\/span>\n<\/li><\/ul>\n<\/section>"}, {"title": "三、改革开放的起步", "tags": ["会议", "思想理论", "经济建设", "时间节点"], "text": "\n1. 国民经济的调整：1979 年召开的中共中央工作会议，提出对国民经济实行\"调整、改革、整顿、提高\"的方针。\n2. 农村改革：家庭联产承包责任制在全国推广，包产到户、包干到户。\n3. 逐步转向城市经济体制改革：以扩大企业自主权为主要内容的城市经济体制改革逐步在全国展开。\n4. 对外开放和兴办经济特区：吸引和利用外资，兴办中外合资经营企业和中外合作经营企业；1980 年 5 月，中央决定在深圳、珠海、汕头和厦门设立经济特区。\n5. 政治体制改革的启动：改革党和国家领导制度，使民主制度化、法律化。\n", "html": "<ol class=\"md-list\">\n<li><span class=\"li-text\"><strong>国民经济的调整<\/strong>：1979 年召开的中共中央工作会议，提出对国民经济实行\"调整、改革、整顿、提高\"的方针。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>农村改革<\/strong>：家庭联产承包责任制在全国推广，包产到户、包干到户。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>逐步转向城市经济体制改革<\/strong>：以扩大企业自主权为主要内容的城市经济体制改革逐步在全国展开。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>对外开放和兴办经济特区<\/strong>：吸引和利用外资，兴办中外合资经营企业和中外合作经营企业；1980 年 5 月，中央决定在深圳、珠海、汕头和厦门设立经济特区。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>政治体制改革的启动<\/strong>：改革党和国家领导制度，使民主制度化、法律化。<\/span>\n<\/li><\/ol>"}]}, {"title": "第二节 改革开放和社会主义现代化建设新局面", "blocks": [{"title": "一、改革开放的全面展开", "tags": ["人物", "会议", "思想理论", "经济建设"], "text": "\n1. \"建设有中国特色的社会主义\"重大命题的提出：1982 年，中国共产党十二大，邓小平提出建设有中国特色的社会主义。\n2. 1984 年底，全国基本完成政社分开，改革以城市为重点全面展开。改革的中心环节是增强全民所有制企业活力。\n3. 1985 年底，国民经济和社会发展第六个五年计划胜利完成。\"六五\"计划的一个鲜明特点，是在重视经济发展的同时，把社会发展摆到突出位置。计划生育、环境保护被确立为基本国策。\n4. 对外开放确立为基本国策，逐步形成新格局。\n", "html": "<ol class=\"md-list\">\n<li><span class=\"li-text\"><strong>\"建设有中国特色的社会主义\"重大命题的提出<\/strong>：1982 年，中国共产党十二大，邓小平提出建设有中国特色的社会主义。<\/span>\n<\/li>\n<li><span class=\"li-text\">1984 年底，全国基本完成政社分开，改革以城市为重点全面展开。改革的中心环节是增强全民所有制企业活力。<\/span>\n<\/li>\n<li><span class=\"li-text\">1985 年底，国民经济和社会发展第六个五年计划胜利完成。\"六五\"计划的一个鲜明特点，是在重视经济发展的同时，把社会发展摆到突出位置。计划生育、环境保护被确立为基本国策。<\/span>\n<\/li>\n<li><span class=\"li-text\">对外开放确立为基本国策，逐步形成新格局。<\/span>\n<\/li><\/ol>"}, {"title": "二、加强和改善党的领导", "tags": ["会议", "思想理论", "时间节点"], "text": "\n1. 1980 年制定《关于党内政治生活的若干准则》；\n2. 干部队伍\"四化\"建设（革命化、年轻化、知识化、专业化），党的十二大把实现干部的\"四化\"写入党章；\n3. 整党和社会主义精神文明建设。\n   - 社会主义精神文明建设的根本任务：培养有理想、有道德、有文化、有纪律的社会主义公民。\n", "html": "<ol class=\"md-list\">\n<li><span class=\"li-text\">1980 年制定《关于党内政治生活的若干准则》；<\/span>\n<\/li>\n<li><span class=\"li-text\">干部队伍\"四化\"建设（革命化、年轻化、知识化、专业化），党的十二大把实现干部的\"四化\"写入党章；<\/span>\n<\/li>\n<li><span class=\"li-text\">整党和社会主义精神文明建设。<\/span>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">社会主义精神文明建设的根本任务：培养<strong>有理想、有道德、有文化、有纪律<\/strong>的社会主义公民。<\/span>\n<\/li><\/ul>\n<\/li><\/ol>"}, {"title": "三、改革开放和现代化建设的深入推进", "tags": ["人物", "会议", "条约文献", "思想理论"], "text": "\n （一）社会主义初级阶段理论和党的基本路线的提出\n\n- 1987 年，中共十三大系统阐述了社会主义初级阶段理论，明确概括了党在社会主义初级阶段的基本路线：领导和团结全国各族人民，以经济建设为中心，坚持四项基本原则，坚持改革开放，自力更生、艰苦创业，为把我国建设成为富强民主文明的社会主义现代化国家而奋斗。\n- 社会主义初级阶段的两层含义：①我国社会已经是社会主义社会；②我国的社会主义社会还处在初级阶段。\n- 概括起来说，其主要内容就是\"一个中心、两个基本点\"。\n- 实践证明，以经济建设为中心是兴国之要；四项基本原则是立国之本；改革开放是强国之路。这条基本路线是党和国家的生命线、人民的幸福线。\n- 改革、发展、稳定的关系：稳定是前提，改革是动力，发展是目的，三者相互促进。\n\n （二）改革开放与现代化发展的新阶段\n\n- 1992 年邓小平南方谈话与中共十四大社会主义市场经济理论的提出；\n- 1997 年中共十五大提出跨世纪发展战略。\n\n （三）重要会议与政策脉络\n\n1. 1982 年，十二大：邓小平提出建设有中国特色的社会主义；\n2. 1984 年，十二届三中全会：《中共中央关于经济体制改革的决定》；\n3. 1987 年，十三大：系统阐述社会主义初级阶段理论；\n4. 1992 年，十四大：明确我国经济体制改革的目标是建立社会主义市场经济体制；\n5. 2002 年，十六大：把\"三个代表\"重要思想确立为党必须长期坚持的指导思想，提出全面建设小康社会的奋斗目标；\n6. 2004 年，十六届四中全会：提出构建社会主义和谐社会（和谐社会的特征：民主法治、公平正义、诚信友爱、充满活力、安定有序、人与自然和谐相处）。\n\n （四）\"三步走\"发展战略\n\n1. 1981—1990 年，实现国民生产总值比 1980 年翻一番，解决人民的温饱问题；\n2. 到 20 世纪末，使国民生产总值再增加一倍，人民生活达到小康水平；\n3. 到 21 世纪中叶，人均国民生产总值达到中等发达国家水平，人民生活比较富裕，基本实现现代化。\n\n （五）改革开放以来的经济成就\n\n1. 1988 年 4 月，七届全国人大第一次会议通过建立海南经济特区的决定；\n2. 1990 年，邓小平提出关于中国农业改革与发展\"两个飞跃\"的思想：第一个飞跃是废除人民公社、实行家庭联产承包为主的责任制；第二个飞跃是发展集体经济；\n3. 2001 年 12 月 11 日，中国正式加入世界贸易组织，标志着对外开放进入一个新阶段。\n\n （六）南方谈话\n\n- 时间：1992 年 1 月 18 日至 2 月 21 日。\n- 内容：\n  1. 革命是解放生产力，改革也是解放生产力。基本路线要管一百年，动摇不得；\n  2. 提出\"三个有利于\"的判断标准：是否有利于发展社会主义社会的生产力，是否有利于增强社会主义国家的综合国力，是否有利于提高人民的生活水平；\n  3. 社会主义的本质：解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕；\n  4. 计划多一点还是市场多一点，不是社会主义与资本主义的本质区别。计划和市场都是经济手段；\n  5. 发展才是硬道理；\n  6. 坚持两手抓，一手抓改革开放，一手抓打击各种犯罪活动。\n- 意义：从理论上回答了长期困扰和束缚人们思想的许多重大问题，是把改革开放和社会主义现代化建设推向新阶段的又一个解放思想、实事求是的宣言书，对党的十四大和中国整个社会主义现代化建设事业具有十分重要而深远的指导意义。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）社会主义初级阶段理论和党的基本路线的提出<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1987 年，中共十三大系统阐述了社会主义初级阶段理论，明确概括了党在社会主义初级阶段的基本路线：领导和团结全国各族人民，以经济建设为中心，坚持四项基本原则，坚持改革开放，自力更生、艰苦创业，为把我国建设成为富强民主文明的社会主义现代化国家而奋斗。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>社会主义初级阶段的两层含义<\/strong>：①我国社会已经是社会主义社会；②我国的社会主义社会还处在初级阶段。<\/span>\n<\/li>\n<li><span class=\"li-text\">概括起来说，其主要内容就是\"<strong>一个中心、两个基本点<\/strong>\"。<\/span>\n<\/li>\n<li><span class=\"li-text\">实践证明，以经济建设为中心是兴国之要；四项基本原则是立国之本；改革开放是强国之路。这条基本路线是党和国家的生命线、人民的幸福线。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>改革、发展、稳定的关系<\/strong>：稳定是前提，改革是动力，发展是目的，三者相互促进。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）改革开放与现代化发展的新阶段<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1992 年邓小平南方谈话与中共十四大社会主义市场经济理论的提出；<\/span>\n<\/li>\n<li><span class=\"li-text\">1997 年中共十五大提出跨世纪发展战略。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）重要会议与政策脉络<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">1982 年，十二大：邓小平提出建设有中国特色的社会主义；<\/span>\n<\/li>\n<li><span class=\"li-text\">1984 年，十二届三中全会：《中共中央关于经济体制改革的决定》；<\/span>\n<\/li>\n<li><span class=\"li-text\">1987 年，十三大：系统阐述社会主义初级阶段理论；<\/span>\n<\/li>\n<li><span class=\"li-text\">1992 年，十四大：明确我国经济体制改革的目标是建立社会主义市场经济体制；<\/span>\n<\/li>\n<li><span class=\"li-text\">2002 年，十六大：把\"三个代表\"重要思想确立为党必须长期坚持的指导思想，提出全面建设小康社会的奋斗目标；<\/span>\n<\/li>\n<li><span class=\"li-text\">2004 年，十六届四中全会：提出构建社会主义和谐社会（和谐社会的特征：民主法治、公平正义、诚信友爱、充满活力、安定有序、人与自然和谐相处）。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（四）\"三步走\"发展战略<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">1981—1990 年，实现国民生产总值比 1980 年翻一番，解决人民的温饱问题；<\/span>\n<\/li>\n<li><span class=\"li-text\">到 20 世纪末，使国民生产总值再增加一倍，人民生活达到小康水平；<\/span>\n<\/li>\n<li><span class=\"li-text\">到 21 世纪中叶，人均国民生产总值达到中等发达国家水平，人民生活比较富裕，基本实现现代化。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（五）改革开放以来的经济成就<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">1988 年 4 月，七届全国人大第一次会议通过建立海南经济特区的决定；<\/span>\n<\/li>\n<li><span class=\"li-text\">1990 年，邓小平提出关于中国农业改革与发展\"两个飞跃\"的思想：第一个飞跃是废除人民公社、实行家庭联产承包为主的责任制；第二个飞跃是发展集体经济；<\/span>\n<\/li>\n<li><span class=\"li-text\">2001 年 12 月 11 日，中国正式加入世界贸易组织，标志着对外开放进入一个新阶段。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（六）南方谈话<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>时间<\/strong>：1992 年 1 月 18 日至 2 月 21 日。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>内容<\/strong>：<\/span>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">革命是解放生产力，改革也是解放生产力。基本路线要管一百年，动摇不得；<\/span>\n<\/li>\n<li><span class=\"li-text\">提出\"三个有利于\"的判断标准：是否有利于发展社会主义社会的生产力，是否有利于增强社会主义国家的综合国力，是否有利于提高人民的生活水平；<\/span>\n<\/li>\n<li><span class=\"li-text\">社会主义的本质：解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕；<\/span>\n<\/li>\n<li><span class=\"li-text\">计划多一点还是市场多一点，不是社会主义与资本主义的本质区别。计划和市场都是经济手段；<\/span>\n<\/li>\n<li><span class=\"li-text\">发展才是硬道理；<\/span>\n<\/li>\n<li><span class=\"li-text\">坚持两手抓，一手抓改革开放，一手抓打击各种犯罪活动。<\/span>\n<\/li><\/ol>\n<\/li>\n<li><span class=\"li-text\"><strong>意义<\/strong>：从理论上回答了长期困扰和束缚人们思想的许多重大问题，是把改革开放和社会主义现代化建设推向新阶段的又一个解放思想、实事求是的宣言书，对党的十四大和中国整个社会主义现代化建设事业具有十分重要而深远的指导意义。<\/span>\n<\/li><\/ul>\n<\/section>"}, {"title": "四、国防战略的转变、\"一国两制\"方针的形成和外交方针政策的调整", "tags": ["人物", "会议", "思想理论", "时间节点"], "text": "\n1. 党的十一届三中全会后，军事战略方针由\"积极防御、诱敌深入\"改为\"积极防御\"；\n2. 1979 年元旦，全国人大常委会发表《告台湾同胞书》，宣示了争取祖国和平统一的大政方针。20 世纪 70 年代后期，台湾问题被提上党和国家重要议事日程，\"一国两制\"科学构想逐步形成，开辟了以和平方式实现祖国统一的新途径；\n3. 1982 年 1 月，邓小平首次提出\"一个国家，两种制度\"的概念。\n   - \"一国两制\"构想：在一个中国的前提下，国家的主体坚持社会主义制度，港澳台作为特别行政区保持原有的资本主义制度长期不变。\n", "html": "<ol class=\"md-list\">\n<li><span class=\"li-text\">党的十一届三中全会后，军事战略方针由\"积极防御、诱敌深入\"改为\"积极防御\"；<\/span>\n<\/li>\n<li><span class=\"li-text\">1979 年元旦，全国人大常委会发表《告台湾同胞书》，宣示了争取祖国和平统一的大政方针。20 世纪 70 年代后期，台湾问题被提上党和国家重要议事日程，\"一国两制\"科学构想逐步形成，开辟了以和平方式实现祖国统一的新途径；<\/span>\n<\/li>\n<li><span class=\"li-text\">1982 年 1 月，邓小平首次提出\"一个国家，两种制度\"的概念。<\/span>\n<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>\"一国两制\"构想<\/strong>：在一个中国的前提下，国家的主体坚持社会主义制度，港澳台作为特别行政区保持原有的资本主义制度长期不变。<\/span>\n<\/li><\/ul>\n<\/li><\/ol>"}]}, {"title": "第三节 把中国特色社会主义推向 21 世纪", "blocks": [{"title": "一、新的中央领导集体与捍卫中国特色社会主义", "tags": ["人物", "会议", "思想理论", "时间节点"], "text": "\n- 新的中央领导集体的形成：经过党的十三届四中（1989 年）、五中（1989 年）全会，形成了以江泽民同志为核心的党的第三代中央领导集体。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>新的中央领导集体的形成<\/strong>：经过党的十三届四中（1989 年）、五中（1989 年）全会，形成了以江泽民同志为核心的党的第三代中央领导集体。<\/span>\n<\/li><\/ul>"}, {"title": "二、社会主义市场经济体制改革目标和基本框架的确立", "tags": ["人物", "会议", "条约文献", "思想理论"], "text": "\n- 1992 年，中共十四大召开，大会作出三项具有深远意义的决策：\n  1. 抓住机遇、加快发展，集中精力把经济建设搞上去；\n  2. 确定我国经济体制改革的目标是建立社会主义市场经济体制，使市场在社会主义国家宏观调控下对资源配置起基础性作用，使经济活动遵循价值规律的要求，适应供求关系的变化；\n  3. 提出用邓小平建设有中国特色社会主义理论武装全党的任务。\n- 意义：以邓小平南方谈话和党的十四大为标志，改革开放和现代化建设事业进入从计划经济体制向社会主义市场经济体制转变的新阶段，由此打开了中国经济、政治、文化发展的崭新局面。\n- 1993 年 11 月召开的党的十四届三中全会，通过《中共中央关于建立社会主义市场经济体制若干问题的决定》，将党的十四大提出的社会主义市场经济体制改革的目标和基本原则具体化，进一步勾画了建立社会主义市场经济体制的基本框架。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">1992 年，中共十四大召开，大会作出三项具有深远意义的决策：<\/span>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">抓住机遇、加快发展，集中精力把经济建设搞上去；<\/span>\n<\/li>\n<li><span class=\"li-text\">确定我国经济体制改革的目标是建立社会主义市场经济体制，使市场在社会主义国家宏观调控下对资源配置起基础性作用，使经济活动遵循价值规律的要求，适应供求关系的变化；<\/span>\n<\/li>\n<li><span class=\"li-text\">提出用邓小平建设有中国特色社会主义理论武装全党的任务。<\/span>\n<\/li><\/ol>\n<\/li>\n<li><span class=\"li-text\"><strong>意义<\/strong>：以邓小平南方谈话和党的十四大为标志，改革开放和现代化建设事业进入从计划经济体制向社会主义市场经济体制转变的新阶段，由此打开了中国经济、政治、文化发展的崭新局面。<\/span>\n<\/li>\n<li><span class=\"li-text\">1993 年 11 月召开的党的十四届三中全会，通过《中共中央关于建立社会主义市场经济体制若干问题的决定》，将党的十四大提出的社会主义市场经济体制改革的目标和基本原则具体化，进一步勾画了建立社会主义市场经济体制的基本框架。<\/span>\n<\/li><\/ul>"}, {"title": "三、改革开放和现代化建设的跨世纪发展", "tags": ["人物", "会议", "思想理论", "经济建设"], "text": "\n1. 精神文明建设与民主法制建设不断加强：为进一步坚持\"为人民服务、为社会主义服务\"的\"二为\"方向，贯彻\"百花齐放、百家争鸣\"的\"双百\"方针，弘扬主旋律、繁荣社会主义文化，1991 年起，精神文明建设\"五个一工程\"奖评选活动开始实施。\n2. 中共十五大：1997 年召开，大会的主题是：高举邓小平理论伟大旗帜，把建设有中国特色社会主义事业全面推向 21 世纪。大会首次使用\"邓小平理论\"这个概念，把这一理论同马克思列宁主义、毛泽东思想一道确立为中国共产党的指导思想，并写入修改后的《中国共产党章程》。大会指出，邓小平理论围绕\"什么是社会主义、怎样建设社会主义\"这个根本问题，第一次比较系统地回答了建设有中国特色社会主义的一系列基本问题。\n3. 跨世纪发展战略的制定与实施：\n   - 1995 年，确定实施科教兴国战略；1995 年 9 月，《中华人民共和国教育法》正式实施。国家在 1995 年、1999 年先后启动\"211 工程\"和\"985 工程\"，以加强高校建设；\n   - 西部大开发战略：1999 年，党的十五届四中全会作出实施西部大开发战略的决定；\n   - 实施\"引进来\"和\"走出去\"相结合的开放战略。\n4. 推动构建全方位多层次对外关系新格局：20 世纪 90 年代，我国向国际社会提出发展以不结盟、不对抗、不针对第三方为主要特征的新型大国关系。\n5. \"三个代表\"重要思想的形成：\n   - 回答了：进一步回答了什么是社会主义、怎样建设社会主义的问题，创造性回答了建设什么样的党、怎样建设党的问题；\n   - 主要内容：中国共产党总是代表着中国先进生产力的发展要求，代表着中国先进文化的前进方向，代表着中国最广大人民的根本利益；\n   - 地位：始终做到\"三个代表\"，是我们党的立党之本、执政之基、力量之源。\n   - 1998 年，在县级以上党政领导班子和领导干部中开展\"三讲\"教育，即讲学习、讲政治、讲正气。\n", "html": "<ol class=\"md-list\">\n<li><span class=\"li-text\"><strong>精神文明建设与民主法制建设不断加强<\/strong>：为进一步坚持\"为人民服务、为社会主义服务\"的\"二为\"方向，贯彻\"百花齐放、百家争鸣\"的\"双百\"方针，弘扬主旋律、繁荣社会主义文化，1991 年起，精神文明建设\"五个一工程\"奖评选活动开始实施。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>中共十五大<\/strong>：1997 年召开，大会的主题是：高举邓小平理论伟大旗帜，把建设有中国特色社会主义事业全面推向 21 世纪。大会首次使用\"邓小平理论\"这个概念，把这一理论同马克思列宁主义、毛泽东思想一道确立为中国共产党的指导思想，并写入修改后的《中国共产党章程》。大会指出，邓小平理论围绕\"什么是社会主义、怎样建设社会主义\"这个根本问题，第一次比较系统地回答了建设有中国特色社会主义的一系列基本问题。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>跨世纪发展战略的制定与实施<\/strong>：<\/span>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1995 年，确定实施科教兴国战略；1995 年 9 月，《中华人民共和国教育法》正式实施。国家在 1995 年、1999 年先后启动\"211 工程\"和\"985 工程\"，以加强高校建设；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>西部大开发战略<\/strong>：1999 年，党的十五届四中全会作出实施西部大开发战略的决定；<\/span>\n<\/li>\n<li><span class=\"li-text\">实施\"引进来\"和\"走出去\"相结合的开放战略。<\/span>\n<\/li><\/ul>\n<\/li>\n<li><span class=\"li-text\"><strong>推动构建全方位多层次对外关系新格局<\/strong>：20 世纪 90 年代，我国向国际社会提出发展以不结盟、不对抗、不针对第三方为主要特征的新型大国关系。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>\"三个代表\"重要思想的形成<\/strong>：<\/span>\n<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>回答了<\/strong>：进一步回答了什么是社会主义、怎样建设社会主义的问题，创造性回答了建设什么样的党、怎样建设党的问题；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>主要内容<\/strong>：中国共产党总是代表着中国先进生产力的发展要求，代表着中国先进文化的前进方向，代表着中国最广大人民的根本利益；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>地位<\/strong>：始终做到\"三个代表\"，是我们党的立党之本、执政之基、力量之源。<\/span>\n<\/li>\n<li><span class=\"li-text\">1998 年，在县级以上党政领导班子和领导干部中开展\"三讲\"教育，即讲学习、讲政治、讲正气。<\/span>\n<\/li><\/ul>\n<\/li><\/ol>"}, {"title": "四、香港、澳门回归祖国与两岸交流扩大", "tags": ["会议", "经济建设", "时间节点"], "text": "\n- 1997 年 6 月 30 日午夜至 7 月 1 日凌晨，中英两国政府举行香港政权交接仪式，宣告中国政府对香港恢复行使主权，中华人民共和国香港特别行政区正式成立。\n- 1999 年 12 月 20 日，澳门回归祖国，中华人民共和国澳门特别行政区正式成立。香港、澳门的回归，使\"一国两制\"从科学构想变为现实，标志着祖国统一大业向前迈出了重要一步。\n- 海峡两岸交流的扩大：进入 20 世纪 90 年代后，党和政府推进同台湾的经济技术合作与交流，促进双方人员往来。1992 年 3 月，海峡两岸关系协会与台湾海峡交流基金会开始进行事务性商谈；11 月，双方就如何表述坚持一个中国原则的问题，达成\"海峡两岸同属一个中国，共同努力谋求国家统一\"的共识，后被称为\"九二共识\"。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">1997 年 6 月 30 日午夜至 7 月 1 日凌晨，中英两国政府举行香港政权交接仪式，宣告中国政府对香港恢复行使主权，中华人民共和国香港特别行政区正式成立。<\/span>\n<\/li>\n<li><span class=\"li-text\">1999 年 12 月 20 日，澳门回归祖国，中华人民共和国澳门特别行政区正式成立。香港、澳门的回归，使\"一国两制\"从科学构想变为现实，标志着祖国统一大业向前迈出了重要一步。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>海峡两岸交流的扩大<\/strong>：进入 20 世纪 90 年代后，党和政府推进同台湾的经济技术合作与交流，促进双方人员往来。1992 年 3 月，海峡两岸关系协会与台湾海峡交流基金会开始进行事务性商谈；11 月，双方就如何表述坚持一个中国原则的问题，达成\"海峡两岸同属一个中国，共同努力谋求国家统一\"的共识，后被称为\"九二共识\"。<\/span>\n<\/li><\/ul>"}, {"title": "五、推进党的建设新的伟大工程", "tags": ["会议", "党的建设"], "text": "\n- 党的十五大以后，党中央持续推进党的建设新的伟大工程，强调从严治党，加强党风廉政建设和反腐败斗争，不断提高党的领导水平和执政水平、提高拒腐防变和抵御风险的能力。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">党的十五大以后，党中央持续推进党的建设新的伟大工程，强调从严治党，加强党风廉政建设和反腐败斗争，不断提高党的领导水平和执政水平、提高拒腐防变和抵御风险的能力。<\/span>\n<\/li><\/ul>"}]}, {"title": "第四节 在新形势下坚持和发展中国特色社会主义", "blocks": [{"title": "一、全面建设小康社会宏伟目标的提出", "tags": ["会议", "时间节点"], "text": "\n- 2002 年，党的十六大提出在本世纪头 20 年全面建设惠及十几亿人口的更高水平的小康社会的奋斗目标。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">2002 年，党的十六大提出在本世纪头 20 年全面建设惠及十几亿人口的更高水平的小康社会的奋斗目标。<\/span>\n<\/li><\/ul>"}, {"title": "二、科学发展观的形成与贯彻", "tags": ["人物", "会议", "思想理论", "经济建设"], "text": "\n- 2007 年，中共十七大全面阐述了科学发展观的科学内涵、精神实质和根本要求，明确：科学发展观第一要义是发展，核心是以人为本，基本要求是全面协调可持续，根本方法是统筹兼顾。\n- 2012 年，党的十八大把科学发展观确立为党必须长期坚持的指导思想。\n\n- 中国特色社会主义理论体系：包括邓小平理论、\"三个代表\"重要思想和科学发展观。\n- 新时期最鲜明的特点是改革开放，最显著的成就是快速发展，最突出的标志是与时俱进。\n\n 20 世纪以来中国的三次历史性巨变：①辛亥革命，推翻了统治中国几千年的君主专制制度（孙中山）；②中华人民共和国的成立和社会主义制度的建立（毛泽东）；③改革开放（邓小平）。\n\n---\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">2007 年，中共十七大全面阐述了科学发展观的科学内涵、精神实质和根本要求，明确：科学发展观<strong>第一要义是发展，核心是以人为本，基本要求是全面协调可持续，根本方法是统筹兼顾<\/strong>。<\/span>\n<\/li>\n<li><span class=\"li-text\">2012 年，党的十八大把科学发展观确立为党必须长期坚持的指导思想。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>中国特色社会主义理论体系<\/strong>：包括邓小平理论、\"三个代表\"重要思想和科学发展观。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>新时期最鲜明的特点是改革开放，最显著的成就是快速发展，最突出的标志是与时俱进。<\/strong><\/span>\n<\/li><\/ul>\n<blockquote><p><strong>20 世纪以来中国的三次历史性巨变<\/strong>：①辛亥革命，推翻了统治中国几千年的君主专制制度（孙中山）；②中华人民共和国的成立和社会主义制度的建立（毛泽东）；③改革开放（邓小平）。<\/p><\/blockquote>\n<hr/>"}]}]}, {"num": "第十章", "title": "第十章 中国特色社会主义进入新时代", "name": "中国特色社会主义进入新时代", "sections": [{"title": "第一节 开拓中国特色社会主义更为广阔的发展前景", "blocks": [{"title": "一、中国特色社会主义进入新时代", "tags": ["会议", "思想理论", "经济建设", "时间节点"], "text": "\n （一）党的十八大召开\n\n- 2012 年，党的十八大召开。这是在我国进入全面建成小康社会决定性阶段召开的一次十分重要的大会。大会贯穿始终的一条主线是坚持和发展中国特色社会主义；大会阐明了中国特色社会主义道路、理论体系、制度的科学内涵及其相互关系。\n  - 建设中国特色社会主义总依据：社会主义初级阶段；\n  - 总布局：经济建设、政治建设、文化建设、社会建设、生态文明建设\"五位一体\"；\n  - 总任务：实现社会主义现代化和中华民族伟大复兴。\n- 大会提出夺取中国特色社会主义新胜利必须牢牢把握的八项基本要求，要求全党坚定道路自信、理论自信、制度自信。\n\n （二）新的历史方位\n\n党的十八大以来，中国特色社会主义进入新时代，这是我国发展新的历史方位。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）党的十八大召开<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">2012 年，党的十八大召开。这是在我国进入全面建成小康社会决定性阶段召开的一次十分重要的大会。大会贯穿始终的一条主线是坚持和发展中国特色社会主义；大会阐明了中国特色社会主义道路、理论体系、制度的科学内涵及其相互关系。<\/span>\n<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>建设中国特色社会主义总依据<\/strong>：社会主义初级阶段；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>总布局<\/strong>：经济建设、政治建设、文化建设、社会建设、生态文明建设\"五位一体\"；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>总任务<\/strong>：实现社会主义现代化和中华民族伟大复兴。<\/span>\n<\/li><\/ul>\n<\/li>\n<li><span class=\"li-text\">大会提出夺取中国特色社会主义新胜利必须牢牢把握的八项基本要求，要求全党坚定道路自信、理论自信、制度自信。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）新的历史方位<\/h5>\n<p>党的十八大以来，中国特色社会主义进入新时代，这是我国发展新的历史方位。<\/p>\n<\/section>"}, {"title": "二、习近平同志党中央的核心、全党的核心地位的确立", "tags": ["人物", "会议", "思想理论", "经济建设"], "text": "\n （一）提出实现中华民族伟大复兴的中国梦\n\n- 时间：2012 年。\n- 中国梦的基本内涵、实践途径和依靠力量：\n  - 实现中华民族伟大复兴的中国梦，就是要实现国家富强、民族振兴、人民幸福；\n  - 实现中国梦必须走中国道路，这就是中国特色社会主义道路；必须弘扬中国精神，就是以爱国主义为核心的民族精神和以改革创新为核心的时代精神；必须凝聚中国力量，就是中国各族人民大团结的力量。\n  - 中国梦归根到底是人民的梦，必须紧紧依靠人民来实现，必须不断为人民造福。\n\n （二）坚持和发展中国特色社会主义的战略部署\n\n党的十八大明确了中国特色社会主义经济建设、政治建设、文化建设、社会建设、生态文明建设\"五位一体\"的总体布局（总体布局经历了从\"三位一体\"（经济、政治、文化）到\"四位一体\"（加入社会建设），再到\"五位一体\"（加入生态文明建设）的发展过程）。\n\n （三）确立习近平同志党中央的核心、全党的核心地位\n\n- 2016 年 10 月，党的十八届六中全会正式提出\"以习近平同志为核心的党中央\"，并郑重写入全会文件，正式明确了习近平同志党中央的核心、全党的核心地位；\n- 2017 年 10 月，党的十九大把\"坚定维护以习近平同志为核心的党中央权威和集中统一领导\"写入党章。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）提出实现中华民族伟大复兴的中国梦<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>时间<\/strong>：2012 年。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>中国梦的基本内涵、实践途径和依靠力量<\/strong>：<\/span>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">实现中华民族伟大复兴的中国梦，就是要实现国家富强、民族振兴、人民幸福；<\/span>\n<\/li>\n<li><span class=\"li-text\">实现中国梦必须走中国道路，这就是中国特色社会主义道路；必须弘扬中国精神，就是以爱国主义为核心的民族精神和以改革创新为核心的时代精神；必须凝聚中国力量，就是中国各族人民大团结的力量。<\/span>\n<\/li>\n<li><span class=\"li-text\">中国梦归根到底是人民的梦，必须紧紧依靠人民来实现，必须不断为人民造福。<\/span>\n<\/li><\/ul>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）坚持和发展中国特色社会主义的战略部署<\/h5>\n<p>党的十八大明确了中国特色社会主义经济建设、政治建设、文化建设、社会建设、生态文明建设\"五位一体\"的总体布局（总体布局经历了从\"三位一体\"（经济、政治、文化）到\"四位一体\"（加入社会建设），再到\"五位一体\"（加入生态文明建设）的发展过程）。<\/p>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）确立习近平同志党中央的核心、全党的核心地位<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">2016 年 10 月，党的十八届六中全会正式提出\"以习近平同志为核心的党中央\"，并郑重写入全会文件，正式明确了习近平同志党中央的核心、全党的核心地位；<\/span>\n<\/li>\n<li><span class=\"li-text\">2017 年 10 月，党的十九大把\"坚定维护以习近平同志为核心的党中央权威和集中统一领导\"写入党章。<\/span>\n<\/li><\/ul>\n<\/section>"}, {"title": "三、统筹推进\"五位一体\"总体布局", "tags": ["人物", "思想理论", "党的建设", "经济建设"], "text": "\n （一）经济建设取得重大成就\n\n- 能不能保持经济社会持续健康发展，根本上取决于党的领导核心作用发挥得好不好。\n- 中国经济发展的一个重大变化是进入新常态。推进供给侧结构性改革，是适应和引领经济发展新常态的重大创新。\n\n （二）民主政治建设迈出重大步伐\n\n- 社会主义民主政治建设稳步推进的主要表现：①人民代表大会制度、中国共产党领导的多党合作和政治协商制度进一步健全和完善，广泛的爱国统一战线继续得到巩固和发展；②基层民主建设取得重大进展；③社会主义法制建设取得显著成就，以宪法为基础的中国特色社会主义法律体系逐步完备。\n\n- 2012 年 12 月 4 日，在首都各界纪念现行宪法公布施行 30 周年大会上，习近平概括了中国特色社会主义政治发展道路的核心内涵，强调坚持中国特色社会主义政治发展道路，关键是要坚持党的领导、人民当家作主、依法治国有机统一，以保证人民当家作主为根本，以增强党和国家活力、调动人民积极性为目标，扩大社会主义民主，发展社会主义政治文明。\n\n （三）思想文化建设取得重大进展\n\n- 社会主义核心价值体系的基本内容：马克思主义指导思想、中国特色社会主义共同理想、以爱国主义为核心的民族精神、以改革创新为核心的时代精神、社会主义荣辱观。\n\n- 文化是一个国家、一个民族的灵魂。2016 年 6 月 28 日，习近平在十八届中央政治局第三十三次集体学习时提出坚定\"四个自信\"，即中国特色社会主义道路自信、理论自信、制度自信、文化自信，明确把文化自信纳入\"四个自信\"之中。党中央强调坚定文化自信，就是坚持中国特色社会主义文化发展道路，激发全民族文化创新创造活力。\n- 如何加强意识形态工作的领导？\n  1. 坚持和加强党对意识形态工作的全面领导，推动媒体融合发展，加强网络空间治理，建设具有强大凝聚力和引领力的社会主义意识形态；\n  2. 培养和践行社会主义核心价值观；\n  3. 推动中华优秀传统文化创造性转化、创新性发展。文化事业和文化产业蓬勃发展，坚持把社会效益放在首位、社会效益和经济效益相统一。\n\n （四）人民生活不断改善\n\n1. 收入是民生之源；\n2. 就业是最基本的民生；\n3. 社会保障是安全网和稳定器；\n4. 健康中国战略全面实施；\n5. 社会治理创新：有效预防和化解社会矛盾体制，激发社会组织活力，加快构建全方位立体化的公共安全网，完善城乡社区治理。\n\n （五）生态文明建设成效显著\n\n坚持\"绿水青山就是金山银山\"理念，加强生态文明建设顶层设计，推动形成绿色发展方式和生活方式。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）经济建设取得重大成就<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">能不能保持经济社会持续健康发展，根本上取决于党的领导核心作用发挥得好不好。<\/span>\n<\/li>\n<li><span class=\"li-text\">中国经济发展的一个重大变化是进入<strong>新常态<\/strong>。推进供给侧结构性改革，是适应和引领经济发展新常态的重大创新。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）民主政治建设迈出重大步伐<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">社会主义民主政治建设稳步推进的主要表现：①人民代表大会制度、中国共产党领导的多党合作和政治协商制度进一步健全和完善，广泛的爱国统一战线继续得到巩固和发展；②基层民主建设取得重大进展；③社会主义法制建设取得显著成就，以宪法为基础的中国特色社会主义法律体系逐步完备。<\/span>\n<\/li>\n<li><span class=\"li-text\">2012 年 12 月 4 日，在首都各界纪念现行宪法公布施行 30 周年大会上，习近平概括了中国特色社会主义政治发展道路的核心内涵，强调坚持中国特色社会主义政治发展道路，关键是要坚持党的领导、人民当家作主、依法治国有机统一，以保证人民当家作主为根本，以增强党和国家活力、调动人民积极性为目标，扩大社会主义民主，发展社会主义政治文明。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）思想文化建设取得重大进展<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>社会主义核心价值体系的基本内容<\/strong>：马克思主义指导思想、中国特色社会主义共同理想、以爱国主义为核心的民族精神、以改革创新为核心的时代精神、社会主义荣辱观。<\/span>\n<\/li>\n<li><span class=\"li-text\">文化是一个国家、一个民族的灵魂。2016 年 6 月 28 日，习近平在十八届中央政治局第三十三次集体学习时提出坚定\"四个自信\"，即中国特色社会主义道路自信、理论自信、制度自信、文化自信，明确把文化自信纳入\"四个自信\"之中。党中央强调坚定文化自信，就是坚持中国特色社会主义文化发展道路，激发全民族文化创新创造活力。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>如何加强意识形态工作的领导？<\/strong><\/span>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">坚持和加强党对意识形态工作的全面领导，推动媒体融合发展，加强网络空间治理，建设具有强大凝聚力和引领力的社会主义意识形态；<\/span>\n<\/li>\n<li><span class=\"li-text\">培养和践行社会主义核心价值观；<\/span>\n<\/li>\n<li><span class=\"li-text\">推动中华优秀传统文化创造性转化、创新性发展。文化事业和文化产业蓬勃发展，坚持把社会效益放在首位、社会效益和经济效益相统一。<\/span>\n<\/li><\/ol>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（四）人民生活不断改善<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">收入是民生之源；<\/span>\n<\/li>\n<li><span class=\"li-text\">就业是最基本的民生；<\/span>\n<\/li>\n<li><span class=\"li-text\">社会保障是安全网和稳定器；<\/span>\n<\/li>\n<li><span class=\"li-text\">健康中国战略全面实施；<\/span>\n<\/li>\n<li><span class=\"li-text\">社会治理创新：有效预防和化解社会矛盾体制，激发社会组织活力，加快构建全方位立体化的公共安全网，完善城乡社区治理。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（五）生态文明建设成效显著<\/h5>\n<p>坚持\"绿水青山就是金山银山\"理念，加强生态文明建设顶层设计，推动形成绿色发展方式和生活方式。<\/p>\n<\/section>"}, {"title": "四、协调推进\"四个全面\"战略布局", "tags": ["人物", "思想理论", "时间节点"], "text": "\n- 2014 年，习近平提出\"四个全面\"战略布局：全面建成小康社会、全面深化改革、全面依法治国、全面从严治党。（\"四个全面\"战略布局后来发展为：全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。）\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">2014 年，习近平提出\"四个全面\"战略布局：<strong>全面建成小康社会、全面深化改革、全面依法治国、全面从严治党<\/strong>。（\"四个全面\"战略布局后来发展为：全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。）<\/span>\n<\/li><\/ul>"}, {"title": "五、全面推进国防和军队现代化", "tags": ["会议", "战争战役", "思想理论", "时间节点"], "text": "\n1. 确立新时代强军目标：听党指挥是灵魂，决定军队建设的政治方向；能打胜仗是核心，反映军队的根本职能和军队建设的根本指向；作风优良是保证，关系军队的性质、宗旨、本色。强军目标是从全局上对国防和军队建设作出的战略筹划和顶层设计，是党在新时代建军治军的总方略。\n2. 贯彻新时代政治建军方略：2014 年，新世纪第一次全军政治工作会议（古田会议）开启了思想建党、政治建军的新征程。\n3. 深化国防和军队改革：科技是现代战争的核心战斗力；依法治军、从严治军是强军之基。深化国防和军队改革，贯彻军民融合发展战略，推进跨军地重大改革任务，加快构建一体化的国家战略体系和能力。\n4. 聚焦能打胜仗强化练兵备战。\n", "html": "<ol class=\"md-list\">\n<li><span class=\"li-text\"><strong>确立新时代强军目标<\/strong>：听党指挥是灵魂，决定军队建设的政治方向；能打胜仗是核心，反映军队的根本职能和军队建设的根本指向；作风优良是保证，关系军队的性质、宗旨、本色。强军目标是从全局上对国防和军队建设作出的战略筹划和顶层设计，是党在新时代建军治军的总方略。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>贯彻新时代政治建军方略<\/strong>：2014 年，新世纪第一次全军政治工作会议（古田会议）开启了思想建党、政治建军的新征程。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>深化国防和军队改革<\/strong>：科技是现代战争的核心战斗力；依法治军、从严治军是强军之基。深化国防和军队改革，贯彻军民融合发展战略，推进跨军地重大改革任务，加快构建一体化的国家战略体系和能力。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>聚焦能打胜仗强化练兵备战<\/strong>。<\/span>\n<\/li><\/ol>"}, {"title": "六、全面加强国家安全", "tags": ["经济建设"], "text": "\n- 国家安全是安邦定国的重要基石。\n1. 总体国家安全观的提出：必须坚持总体国家安全观，以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事、科技、文化、社会安全为保障，以促进国际安全为依托。\n2. 推进国家安全体系和能力建设：加快国家安全法治建设，实施国家安全战略。\n3. 把安全发展贯穿国家发展各领域全过程：政治安全是根本，国土安全是立国之基，经济安全是基础，坚持以军事、科技、文化、社会安全为保障，国防和军队建设是国家安全的坚强后盾。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">国家安全是安邦定国的重要基石。<\/span>\n<\/li><\/ul>\n<ol class=\"md-list\">\n<li><span class=\"li-text\"><strong>总体国家安全观的提出<\/strong>：必须坚持总体国家安全观，以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事、科技、文化、社会安全为保障，以促进国际安全为依托。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>推进国家安全体系和能力建设<\/strong>：加快国家安全法治建设，实施国家安全战略。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>把安全发展贯穿国家发展各领域全过程<\/strong>：政治安全是根本，国土安全是立国之基，经济安全是基础，坚持以军事、科技、文化、社会安全为保障，国防和军队建设是国家安全的坚强后盾。<\/span>\n<\/li><\/ol>"}]}, {"title": "第二节 把新时代中国特色社会主义不断推向前进", "blocks": [{"title": "一、习近平新时代中国特色社会主义思想指导地位的确立", "tags": ["人物", "会议", "思想理论", "时间节点"], "text": "\n （一）党的十九大的召开\n\n- 2017 年 10 月 18 日至 24 日，大会的主题是：不忘初心，牢记使命，高举中国特色社会主义伟大旗帜，决胜全面建成小康社会，夺取新时代中国特色社会主义伟大胜利，为实现中华民族伟大复兴的中国梦不懈奋斗。\n- 大会把习近平新时代中国特色社会主义思想同马克思列宁主义、毛泽东思想、邓小平理论、\"三个代表\"重要思想、科学发展观一道，确立为党的行动指南。\n\n （二）明确我国发展新的历史方位和新时代我国社会主要矛盾\n\n- 中国特色社会主义进入了新时代，这是我国发展新的历史方位。\n- 我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。\n\n （三）确立习近平新时代中国特色社会主义思想的指导地位\n\n党的十九大把习近平新时代中国特色社会主义思想确立为党必须长期坚持的指导思想，并庄严地写入党章。习近平是习近平新时代中国特色社会主义思想的主要创立者。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）党的十九大的召开<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">2017 年 10 月 18 日至 24 日，大会的主题是：不忘初心，牢记使命，高举中国特色社会主义伟大旗帜，决胜全面建成小康社会，夺取新时代中国特色社会主义伟大胜利，为实现中华民族伟大复兴的中国梦不懈奋斗。<\/span>\n<\/li>\n<li><span class=\"li-text\">大会把习近平新时代中国特色社会主义思想同马克思列宁主义、毛泽东思想、邓小平理论、\"三个代表\"重要思想、科学发展观一道，确立为党的行动指南。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）明确我国发展新的历史方位和新时代我国社会主要矛盾<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">中国特色社会主义进入了新时代，这是我国发展新的历史方位。<\/span>\n<\/li>\n<li><span class=\"li-text\">我国社会主要矛盾已经转化为<strong>人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾<\/strong>。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）确立习近平新时代中国特色社会主义思想的指导地位<\/h5>\n<p>党的十九大把习近平新时代中国特色社会主义思想确立为党必须长期坚持的指导思想，并庄严地写入党章。习近平是习近平新时代中国特色社会主义思想的主要创立者。<\/p>\n<\/section>"}, {"title": "二、坚持党的全面领导与推进党的自我革命", "tags": ["人物", "会议", "思想理论", "党的建设"], "text": "\n （一）坚决维护党中央权威和集中统一领导\n\n党的十九大将\"中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导，党是最高政治领导力量\"确立为习近平新时代中国特色社会主义思想的重要内容。\n\n （二）把党的政治建设摆在首位\n\n- 加强党的政治建设是马克思主义政党的鲜明特征和政治优势。党的政治建设决定党的建设方向和效果，是党的建设的\"灵魂\"和\"根基\"。党的十九大以来，党中央坚持以政治建设为统领，坚守自我革命根本政治方向，把讲政治的要求贯穿全面从严治党全过程。\n- 作为贯彻党的十九大精神的重大举措，中共中央印发《关于加强党的政治建设的意见》。《意见》通篇贯彻和体现\"两个维护\"这一根本要求，将其作为加强党的政治建设的首要任务，强调坚持和加强党的全面领导，最重要的是坚决维护党中央权威和集中统一领导，最关键的是坚决维护习近平同志党中央的核心、全党的核心地位。\n\n （三）党的领导制度体系不断完善\n\n党的十九大以来，中国共产党坚持依规治党，以党章为根本、以民主集中制为核心，完善党内法规制度体系，增强党内法规的权威性和执行力。党的领导制度是我国的根本领导制度，党的领导是全面的、系统的、整体的。\n\n （四）深入推进党的自我革命\n\n思想建设是党的基础性建设。党的作风是党的形象，是观察党群干群关系、人心向背的晴雨表。要让纪律真正成为带电的高压线。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）坚决维护党中央权威和集中统一领导<\/h5>\n<p>党的十九大将\"中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导，党是最高政治领导力量\"确立为习近平新时代中国特色社会主义思想的重要内容。<\/p>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）把党的政治建设摆在首位<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">加强党的政治建设是马克思主义政党的鲜明特征和政治优势。党的政治建设决定党的建设方向和效果，是党的建设的\"灵魂\"和\"根基\"。党的十九大以来，党中央坚持以政治建设为统领，坚守自我革命根本政治方向，把讲政治的要求贯穿全面从严治党全过程。<\/span>\n<\/li>\n<li><span class=\"li-text\">作为贯彻党的十九大精神的重大举措，中共中央印发《关于加强党的政治建设的意见》。《意见》通篇贯彻和体现\"两个维护\"这一根本要求，将其作为加强党的政治建设的首要任务，强调坚持和加强党的全面领导，最重要的是坚决维护党中央权威和集中统一领导，最关键的是坚决维护习近平同志党中央的核心、全党的核心地位。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）党的领导制度体系不断完善<\/h5>\n<p>党的十九大以来，中国共产党坚持依规治党，以党章为根本、以民主集中制为核心，完善党内法规制度体系，增强党内法规的权威性和执行力。党的领导制度是我国的根本领导制度，党的领导是全面的、系统的、整体的。<\/p>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（四）深入推进党的自我革命<\/h5>\n<p>思想建设是党的基础性建设。党的作风是党的形象，是观察党群干群关系、人心向背的晴雨表。要让纪律真正成为带电的高压线。<\/p>\n<\/section>"}, {"title": "三、国家制度和治理体系建设迈出新步伐", "tags": ["思想理论"], "text": "\n1. 党和国家机构职能系统性、整体性重构；\n2. 坚持和完善中国特色社会主义制度，推进国家治理体系和治理能力现代化；\n3. 全面深化改革向纵深发展。\n", "html": "<ol class=\"md-list\">\n<li><span class=\"li-text\">党和国家机构职能系统性、整体性重构；<\/span>\n<\/li>\n<li><span class=\"li-text\">坚持和完善中国特色社会主义制度，推进国家治理体系和治理能力现代化；<\/span>\n<\/li>\n<li><span class=\"li-text\">全面深化改革向纵深发展。<\/span>\n<\/li><\/ol>"}, {"title": "四、在应对风险挑战中推进各项事业", "tags": ["综合"], "text": "\n统筹国内国际两个大局，统筹发展和安全两件大事，稳妥应对各种风险挑战，推进各项事业迈出新步伐。\n", "html": "<p>统筹国内国际两个大局，统筹发展和安全两件大事，稳妥应对各种风险挑战，推进各项事业迈出新步伐。<\/p>"}, {"title": "五、坚持\"一国两制\"和推进祖国统一", "tags": ["综合"], "text": "\n保持香港、澳门长期繁荣稳定，推进两岸关系和平发展，坚决反对\"台独\"分裂行径和外部势力干涉。\n", "html": "<p>保持香港、澳门长期繁荣稳定，推进两岸关系和平发展，坚决反对\"台独\"分裂行径和外部势力干涉。<\/p>"}, {"title": "六、全面推进中国特色大国外交和推动构建人类命运共同体", "tags": ["综合"], "text": "\n- 和平发展的内涵：中国既通过争取和平的国际环境来发展自己，又通过自己的发展来促进世界和平。\n\n打造全球伙伴关系，积极参与全球治理体系改革和建设，推动构建人类命运共同体。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>和平发展的内涵<\/strong>：中国既通过争取和平的国际环境来发展自己，又通过自己的发展来促进世界和平。<\/span>\n<\/li><\/ul>\n<p>打造全球伙伴关系，积极参与全球治理体系改革和建设，推动构建人类命运共同体。<\/p>"}]}, {"title": "第三节 开启全面建设社会主义现代化国家新征程", "blocks": [{"title": "一、完成脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标", "tags": ["综合"], "text": "\n- 打赢脱贫攻坚战是全面建成小康社会的底线任务。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">打赢脱贫攻坚战是全面建成小康社会的底线任务。<\/span>\n<\/li><\/ul>"}, {"title": "二、把握新发展阶段、贯彻新发展理念、构建新发展格局、推动高质量发展", "tags": ["综合"], "text": "", "html": ""}, {"title": "三、隆重庆祝中国共产党成立一百周年", "tags": ["综合"], "text": "\n开展党史学习教育，举办系列庆祝活动，隆重召开庆祝大会。\n", "html": "<p>开展党史学习教育，举办系列庆祝活动，隆重召开庆祝大会。<\/p>"}, {"title": "四、全面总结党的百年奋斗重大成就和历史经验", "tags": ["条约文献", "思想理论", "经济建设"], "text": "\n- 通过《关于党的百年奋斗重大成就和历史经验的决议》，总结党的百年奋斗重大成就和历史经验，是在建党百年历史条件下开启全面建设社会主义现代化国家新征程的需要。\n- 回顾党的百年奋斗历史进程：\n  1. 新民主主义革命时期，党面临的主要任务是反帝反封建反官僚资本主义，争取民族独立、人民解放；\n  2. 社会主义革命和建设时期，实现从新民主主义到社会主义的转变，进行社会主义革命，推进社会主义建设；\n  3. 改革开放和社会主义现代化建设新时期，继续探索中国建设社会主义的正确道路，解放和发展社会生产力，使人民摆脱贫困、尽快富裕起来，为实现中华民族伟大复兴提供充满新的活力的体制保证和快速发展的物质条件；\n  4. 中国特色社会主义新时代，实现全面建成小康社会第一个百年奋斗目标，开启全面建成社会主义现代化强国第二个百年奋斗目标新征程。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">通过《关于党的百年奋斗重大成就和历史经验的决议》，总结党的百年奋斗重大成就和历史经验，是在建党百年历史条件下开启全面建设社会主义现代化国家新征程的需要。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>回顾党的百年奋斗历史进程<\/strong>：<\/span>\n<ol class=\"md-list\">\n<li><span class=\"li-text\"><strong>新民主主义革命时期<\/strong>，党面临的主要任务是反帝反封建反官僚资本主义，争取民族独立、人民解放；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>社会主义革命和建设时期<\/strong>，实现从新民主主义到社会主义的转变，进行社会主义革命，推进社会主义建设；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>改革开放和社会主义现代化建设新时期<\/strong>，继续探索中国建设社会主义的正确道路，解放和发展社会生产力，使人民摆脱贫困、尽快富裕起来，为实现中华民族伟大复兴提供充满新的活力的体制保证和快速发展的物质条件；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>中国特色社会主义新时代<\/strong>，实现全面建成小康社会第一个百年奋斗目标，开启全面建成社会主义现代化强国第二个百年奋斗目标新征程。<\/span>\n<\/li><\/ol>\n<\/li><\/ul>"}, {"title": "五、党的二十大的召开和以中国式现代化全面推进中华民族伟大复兴", "tags": ["会议", "思想理论"], "text": "\n （一）大会内容\n\n1. 总结过去五年的工作和新时代十年的伟大变革；\n2. 提出开辟马克思主义中国化时代化新境界。党的二十大强调，马克思主义是我们立党立国、兴党兴国的根本指导思想。中国共产党为什么能，中国特色社会主义为什么好，归根到底是马克思主义行，是中国化时代化的马克思主义行；\n3. 明确新时代新征程中国共产党的使命任务。党的二十大强调，新时代新征程，中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴；\n4. 全面部署新时代新征程党和国家各项事业。党的二十大强调，坚持党的全面领导是坚持和发展中国特色社会主义的必由之路，中国特色社会主义是实现中华民族伟大复兴的必由之路。\n\n （二）中国式现代化\n\n中国式现代化的内涵：\n\n1. 人口规模巨大的现代化；\n2. 全体人民共同富裕的现代化；\n3. 物质文明和精神文明相协调的现代化；\n4. 人与自然和谐共生的现代化；\n5. 走和平发展道路的现代化。\n\n中国式现代化的本质要求：坚持中国共产党领导，坚持中国特色社会主义，实现高质量发展，发展全过程人民民主，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态。\n\n---\n", "html": "<section class=\"lvl-5\">\n<h5>（一）大会内容<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">总结过去五年的工作和新时代十年的伟大变革；<\/span>\n<\/li>\n<li><span class=\"li-text\">提出开辟马克思主义中国化时代化新境界。党的二十大强调，马克思主义是我们立党立国、兴党兴国的根本指导思想。中国共产党为什么能，中国特色社会主义为什么好，归根到底是马克思主义行，是中国化时代化的马克思主义行；<\/span>\n<\/li>\n<li><span class=\"li-text\">明确新时代新征程中国共产党的使命任务。党的二十大强调，新时代新征程，中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴；<\/span>\n<\/li>\n<li><span class=\"li-text\">全面部署新时代新征程党和国家各项事业。党的二十大强调，坚持党的全面领导是坚持和发展中国特色社会主义的必由之路，中国特色社会主义是实现中华民族伟大复兴的必由之路。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）中国式现代化<\/h5>\n<p><strong>中国式现代化的内涵：<\/strong><\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">人口规模巨大的现代化；<\/span>\n<\/li>\n<li><span class=\"li-text\">全体人民共同富裕的现代化；<\/span>\n<\/li>\n<li><span class=\"li-text\">物质文明和精神文明相协调的现代化；<\/span>\n<\/li>\n<li><span class=\"li-text\">人与自然和谐共生的现代化；<\/span>\n<\/li>\n<li><span class=\"li-text\">走和平发展道路的现代化。<\/span>\n<\/li><\/ol>\n<p><strong>中国式现代化的本质要求<\/strong>：坚持中国共产党领导，坚持中国特色社会主义，实现高质量发展，发展全过程人民民主，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态。<\/p>\n<hr/>\n<\/section>"}]}]}], "appendices": [{"num": "附录", "title": "附：主要校订记录", "name": "附：主要校订记录", "sections": [{"title": "正文", "blocks": []}]}, {"num": "附录", "title": "附二：两份 PDF 笔记补充要点对照", "name": "附二：两份 PDF 笔记补充要点对照", "sections": [{"title": "正文", "blocks": [{"title": "要点", "tags": ["战争战役",
