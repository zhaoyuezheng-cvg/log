, {"year": "1936", "title": "西安事变", "desc": "张学良、杨虎城发动兵谏，和平解决成为时局转换的枢纽。", "ch": 6}, {"year": "1937", "title": "全民族抗战爆发", "desc": "七七事变爆发，日本全面侵华；平型关大捷；抗日民族统一战线正式形成。", "ch": 6}, {"year": "1938", "title": "《论持久战》与战略相持", "desc": "毛泽东发表《论持久战》，抗战进入战略相持阶段，敌后游击战成为主要作战方式。", "ch": 6}, {"year": "1945", "title": "抗日战争胜利", "desc": "近代以来中国抗击外敌入侵第一次完全胜利；重庆谈判与《双十协定》。", "ch": 6}, {"year": "1946", "title": "全面内战爆发", "desc": "国民党军队进攻中原解放区，解放区军民坚决反击。", "ch": 7}, {"year": "1947", "title": "战略进攻与《中国土地法大纲》", "desc": "千里跃进大别山揭开战略进攻序幕；全国土地会议召开。", "ch": 7}, {"year": "1948—1949", "title": "三大战役", "desc": "辽沈、淮海、平津三大战役，国民党主要军事力量基本被摧毁。", "ch": 7}, {"year": "1949", "title": "中华人民共和国成立", "desc": "人民政协召开、《共同纲领》通过；10 月 1 日开国大典，中国人从此站立起来。", "ch": 8}, {"year": "1950—1953", "title": "抗美援朝", "desc": "保家卫国，锻造伟大抗美援朝精神，新中国站稳脚跟。", "ch": 8}, {"year": "1953—1956", "title": "社会主义改造", "desc": "\"一化三改\"过渡时期总路线，1956 年社会主义基本制度确立。", "ch": 8}, {"year": "1956", "title": "《论十大关系》与中共八大", "desc": "开始探索适合中国国情的社会主义建设道路，正确分析国内主要矛盾。", "ch": 8}, {"year": "1966—1976", "title": "\"文化大革命\"", "desc": "一场由领导者错误发动、被反革命集团利用的内乱，留下深刻历史教训。", "ch": 8}, {"year": "1978", "title": "十一届三中全会", "desc": "实现伟大历史转折，开启改革开放和社会主义现代化建设新时期。", "ch": 9}, {"year": "1992", "title": "南方谈话与中共十四大", "desc": "明确建立社会主义市场经济体制的目标，改革开放进入新阶段。", "ch": 9}, {"year": "1997 / 1999", "title": "香港、澳门回归", "desc": "\"一国两制\"从科学构想变为现实，祖国统一大业迈出重要一步。", "ch": 9}, {"year": "2001", "title": "加入世界贸易组织", "desc": "中国正式加入 WTO，对外开放进入新阶段。", "ch": 9}, {"year": "2012", "title": "中共十八大", "desc": "中国特色社会主义进入新时代，确立\"五位一体\"总体布局。", "ch": 10}, {"year": "2017", "title": "中共十九大", "desc": "确立习近平新时代中国特色社会主义思想的指导地位，明确社会主要矛盾转化。", "ch": 10}, {"year": "2022", "title": "中共二十大", "desc": "以中国式现代化全面推进中华民族伟大复兴。", "ch": 10}]}</script>
<script>
(function(){
'use strict';
var DATA = JSON.parse(document.getElementById('app-data').textContent);
var ALL_CH = DATA.chapters.concat(DATA.appendices || []);
var $ = function(s,r){return (r||document).querySelector(s);};
var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};

/* ---------- persistence ---------- */
var STORE_KEY = 'sg2-progress';
var store = {cards:{}, chapters:{}};
try{ var s = JSON.parse(localStorage.getItem(STORE_KEY)||'null'); if(s&&s.cards) store=s; }catch(e){}
function saveStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }
function setTheme(t){
  document.documentElement.dataset.theme = t;
  try{ localStorage.setItem('sg2-theme', t); }catch(e){}
  $('#themeToggle').style.color = t==='dark' ? 'var(--gold)' : '';
}
setTheme((function(){ try{ return localStorage.getItem('sg2-theme')||'light'; }catch(e){ return 'light'; } })());
var sizes=[15,16,16.5,18,20]; var sizeIdx=2;
try{ var fz=parseInt(localStorage.getItem('sg2-font')||'-1',10); if(fz>=0&&fz<sizes.length) sizeIdx=fz; }catch(e){}
function applySize(){ document.documentElement.style.setProperty('--content-size', sizes[sizeIdx]+'px');
  try{ localStorage.setItem('sg2-font', String(sizeIdx)); }catch(e){} }
applySize();

/* ---------- helpers ---------- */
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function chapterCardId(ci,si,bi){ return 'c'+ci+'-'+si+'-'+bi; }
function allBlocks(){
  var out=[];
  ALL_CH.forEach(function(ch,ci){
    (ch.sections||[]).forEach(function(sec,si){
      (sec.blocks||[]).forEach(function(b,bi){
        out.push({id:chapterCardId(ci,si,bi), ci:ci, si:si, bi:bi, title:b.title, tags:b.tags, text:b.text, chapter:ch});
      });
    });
  });
  return out;
}
var BLOCKS = allBlocks();
var TOTAL_CARDS = BLOCKS.length;

function updateProgress(){
  var done = Object.keys(store.cards).filter(function(k){return store.cards[k];}).length;
  var pct = TOTAL_CARDS ? Math.round(done/TOTAL_CARDS*100) : 0;
  var rc = $('#ringFill'); if(rc){ rc.style.strokeDashoffset = String(113 - 113*pct/100); }
  $('#ringText').textContent = pct+'%';
  $('#sideProgressText').textContent = done+' / '+TOTAL_CARDS+' 知识点';
  $('#masteryCount').textContent = done+' / '+TOTAL_CARDS;
  $('#masteryFill').style.width = pct+'%';
}

/* ---------- sidebar TOC ---------- */
function buildTOC(){
  var box = $('#tocBody'); box.innerHTML='';
  ALL_CH.forEach(function(ch,ci){
    var item = document.createElement('div');
    var btn = document.createElement('button');
    btn.className='side-item'; btn.dataset.ch=ci;
    btn.innerHTML = '<span class="idx">'+esc((ch.num||'').replace('第','').replace('章','')||(ci+1))+'</span><span>'+esc(ch.title)+'</span>'+
      (store.chapters['ch'+ci]?'<span class="side-done"></span>':'');
    btn.addEventListener('click', function(){ go('#/ch/'+ci); closeDrawer(); });
    item.appendChild(btn);
    (ch.sections||[]).forEach(function(sec,si){
      var sb = document.createElement('div');
      sb.className='side-sec'; sb.dataset.ch=ci; sb.dataset.sec=si;
      sb.textContent = sec.title;
      sb.addEventListener('click', function(){
        if(location.hash === '#/ch/'+ci){ scrollToSection(si); }
        else { pendingSection = si; go('#/ch/'+ci); }
        closeDrawer();
      });
      item.appendChild(sb);
    });
    box.appendChild(item);
  });
}
function highlightTOC(){
  $$('.side-item').forEach(function(b){ b.classList.toggle('active', b.dataset.route===currentView || (currentView==='chapter' && Number(b.dataset.ch)===currentChapter)); });
}
function scrollToSection(si){
  var el = document.getElementById('sec-'+si);
  if(el){ window.scrollTo({top: el.getBoundingClientRect().top+window.scrollY-80, behavior:'smooth'}); }
}
var pendingSection = null;

/* ---------- router ---------- */
var currentView='home', currentChapter=0;
function go(hash){ if(location.hash===hash){ render(); } else { location.hash=hash; } }
function render(){
  var h = location.hash||'#/home';
  var m = h.match(/^#\/ch\/(\d+)/);
  currentView = 'home';
  if(m){ currentView='chapter'; currentChapter=parseInt(m[1],10)||0; }
  else if(h.indexOf('#/timeline')===0){ currentView='timeline'; }
  $$('.view').forEach(function(v){ v.classList.remove('active'); });
  if(currentView==='chapter'){ renderChapter(currentChapter); $('#viewChapter').classList.add('active'); }
  else if(currentView==='timeline'){ renderTimeline(); $('#viewTimeline').classList.add('active'); }
  else { renderHome(); $('#viewHome').classList.add('active'); }
  highlightTOC();
  if(pendingSection!==null){ var si=pendingSection; pendingSection=null; setTimeout(function(){ scrollToSection(si); },80); }
  else { window.scrollTo({top:0,behavior:'auto'}); }
}
window.addEventListener('hashchange', render);

/* ---------- home ---------- */
function renderHome(){
  var chCards = ALL_CH.map(function(ch,ci){
    var blocks = (ch.sections||[]).reduce(function(a,s){return a+(s.blocks||[]).length;},0);
    var done = BLOCKS.filter(function(b){return b.ci===ci && store.cards[b.id];}).length;
    var tags = {};
    (ch.sections||[]).forEach(function(s){ (s.blocks||[]).forEach(function(b){ (b.tags||[]).forEach(function(t){ tags[t]=1; }); }); });
    var tagHtml = Object.keys(tags).slice(0,4).map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }).join('');
    var secList = (ch.sections||[]).slice(0,4).map(function(s){ return esc(s.title); }).join(' · ');
    return '<div class="ch-card fade-in" data-ch="'+ci+'">'+
      '<div class="corner"></div>'+
      '<div class="no">'+esc(ch.num||('附录 '+(ci+1)))+'</div>'+
      '<h3>'+esc(ch.name||ch.title)+'</h3>'+
      '<div class="secs">'+secList+((ch.sections||[]).length>4?' …':'')+'</div>'+
      '<div class="foot">'+tagHtml+'</div>'+
      '<div class="foot" style="margin-top:10px;font-size:11.5px;color:var(--muted);">'+blocks+' 个知识点 · 已掌握 '+done+'</div>'+
      '</div>';
  }).join('');
  var doneAll = Object.keys(store.cards).filter(function(k){return store.cards[k];}).length;
  var chDone = Object.keys(store.chapters).filter(function(k){return store.chapters[k];}).length;
  $('#viewHome').innerHTML =
    '<div class="hero fade-in">'+
      '<h1>'+esc(DATA.title)+'</h1>'+
      '<div class="sub">'+esc(DATA.subtitle)+'</div>'+
      '<div class="desc">本笔记以《中国近现代史纲要》（高等教育出版社 2023 年版）章节体例为骨架，整合 Word 版复习笔记与两份 PDF 考试笔记，完成错别字订正、史实核校、层级重组与内容补全。可按章节系统复习，也可沿历史时间轴纵览近代以来的重大事件。</div>'+
      '<div class="meta">'+
        '<div class="chip">10 章 · 37 节 · '+TOTAL_CARDS+' 个知识点</div>'+
        '<div class="chip">三稿比对 · 去重合并</div>'+
        '<div class="chip">校订 23 + 10 类讹误</div>'+
        '<div class="chip">离线可用 · 打印友好</div>'+
      '</div>'+
      '<div class="cta">'+
        '<button class="btn solid" id="ctaStart">开始学习</button>'+
        '<button class="btn" id="ctaTimeline">浏览历史时间轴</button>'+
      '</div>'+
    '</div>'+
    '<div class="grid home-stats">'+
      '<div class="stat fade-in"><div class="num">'+doneAll+' <span style="font-size:15px;color:var(--muted);">/ '+TOTAL_CARDS+'</span></div><div class="lab">知识点掌握</div><div class="bar-track"><div class="bar-fill" style="width:'+(TOTAL_CARDS?doneAll/TOTAL_CARDS*100:0)+'%"></div></div></div>'+
      '<div class="stat fade-in"><div class="num">'+chDone+' <span style="font-size:15px;color:var(--muted);">/ '+ALL_CH.length+'</span></div><div class="lab">章节完成</div><div class="bar-track"><div class="bar-fill" style="width:'+(ALL_CH.length?chDone/ALL_CH.length*100:0)+'%"></div></div></div>'+
      '<div class="stat fade-in"><div class="num">'+DATA.timeline.length+'</div><div class="lab">时间轴节点</div></div>'+
      '<div class="stat fade-in"><div class="num">2023</div><div class="lab">教材版本基准</div></div>'+
    '</div>'+
    '<div class="sec-label"><h2>章 节 入 口</h2><div class="line"></div><div class="hint">点击卡片进入章节学习</div></div>'+
    '<div class="grid chapters">'+chCards+'</div>'+
    '<div class="tl-entry fade-in" id="tlEntry">'+
      '<div class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>'+
      '<div><h3>历史时间轴</h3><p>1840—2022 · '+DATA.timeline.length+' 个关键节点 · 支持时间轴 / 卡片双视图</p></div>'+
      '<div class="arrow"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>'+
    '</div>';
  $$('#viewHome .ch-card').forEach(function(el){
    el.addEventListener('click', function(){ go('#/ch/'+el.dataset.ch); });
  });
  $('#ctaStart').addEventListener('click', function(){ go('#/ch/0'); });
  $('#ctaTimeline').addEventListener('click', function(){ go('#/timeline'); });
  $('#tlEntry').addEventListener('click', function(){ go('#/timeline'); });
  // section-level tag clicks on home: jump to timeline? keep passive
}

/* ---------- chapter view ---------- */
function renderChapter(ci){
  var ch = ALL_CH[ci] || ALL_CH[0];
  currentChapter = ci;
  var tags = {};
  (ch.sections||[]).forEach(function(s){ (s.blocks||[]).forEach(function(b){ (b.tags||[]).forEach(function(t){ tags[t]=(tags[t]||0)+1; }); }); });
  var tagBar = Object.keys(tags).sort(function(a,b){return tags[b]-tags[a];}).map(function(t){
    return '<span class="tag" data-tag="'+esc(t)+'">'+esc(t)+' <small>'+tags[t]+'</small></span>';
  }).join('');
  var done = BLOCKS.filter(function(b){return b.ci===ci && store.cards[b.id];}).length;
  var total = BLOCKS.filter(function(b){return b.ci===ci;}).length;

  var secHtml = (ch.sections||[]).map(function(sec,si){
    var cards = (sec.blocks||[]).map(function(b,bi){
      var id = chapterCardId(ci,si,bi);
      var tagHtml = (b.tags||[]).map(function(t){ return '<span class="tag" data-tag="'+esc(t)+'">'+esc(t)+'</span>'; }).join('');
      return '<article class="card fade-in" id="card-'+id+'" data-id="'+id+'" data-tags="'+esc((b.tags||[]).join(','))+'">'+
        '<div class="card-head">'+
          '<div><h4>'+esc(b.title)+'</h4><div class="tagrow">'+tagHtml+'</div></div>'+
          '<div class="tools">'+
            '<button class="pill-btn mastery'+(store.cards[id]?' done':'')+'" data-id="'+id+'">'+(store.cards[id]?'已掌握':'掌握')+'</button>'+
            '<button class="pill-btn fold-btn">收起</button>'+
          '</div>'+
        '</div>'+
        '<div class="card-body">'+b.html+'</div>'+
      '</article>';
    }).join('');
    return '<div class="sec-block" id="sec-'+si+'">'+
      '<div class="sec-head"><span class="badge">'+esc((sec.title.match(/^第[一二三四五六七八九十]+节/)||['节'])[0])+'</span>'+
      '<h2>'+esc(sec.title.replace(/^第[一二三四五六七八九十]+节\s*/,''))+'</h2><div class="line"></div></div>'+
      cards+'</div>';
  }).join('');

  $('#viewChapter').innerHTML =
    '<div class="crumbs"><a data-route="home">首页</a><span>›</span><span>'+esc(ch.title)+'</span></div>'+
    '<div class="ch-head fade-in">'+
      '<div class="no">'+esc(ch.num||('附录'))+'</div>'+
      '<h1>'+esc(ch.name||ch.title)+'</h1>'+
      '<div class="row">'+
        '<button class="btn '+(store.chapters['ch'+ci]?'primary':'')+'" id="chDoneBtn">'+
          (store.chapters['ch'+ci]?'✓ 本章已完成':'标记本章已完成')+'</button>'+
        '<span style="font-size:12.5px;color:var(--muted);">已掌握 '+done+' / '+total+' 个知识点</span>'+
        '<div class="nav-btns">'+
          (ci>0?'<button class="btn" id="prevCh">← 上一章</button>':'')+
          (ci<ALL_CH.length-1?'<button class="btn" id="nextCh">下一章 →</button>':'')+
        '</div>'+
      '</div>'+
      '<div class="row"><span style="font-size:12px;color:var(--muted);letter-spacing:1px;">关键词筛选：</span>'+tagBar+'</div>'+
    '</div>'+
    '<div class="filter-note" id="filterNote"><span>当前筛选：<b id="filterTag"></b></span><button class="pill-btn" id="clearFilter">清除筛选</button></div>'+
    secHtml+
    '<div class="ch-foot-nav">'+
      (ci>0?'<button class="btn" id="prevCh2">← '+esc(ALL_CH[ci-1].title)+'</button>':'<span></span>')+
      (ci<ALL_CH.length-1?'<button class="btn" id="nextCh2">'+esc(ALL_CH[ci+1].title)+' →</button>':'<span></span>')+
    '</div>';

  $$('#viewChapter .crumbs a').forEach(function(a){ a.addEventListener('click', function(){ go('#/home'); }); });
  var p1=$('#prevCh'),p2=$('#prevCh2'),n1=$('#nextCh'),n2=$('#nextCh2');
  if(p1) p1.addEventListener('click',function(){go('#/ch/'+(ci-1));});
  if(p2) p2.addEventListener('click',function(){go('#/ch/'+(ci-1));});
  if(n1) n1.addEventListener('click',function(){go('#/ch/'+(ci+1));});
  if(n2) n2.addEventListener('click',function(){go('#/ch/'+(ci+1));});
  $('#chDoneBtn').addEventListener('click', function(){
    store.chapters['ch'+ci] = !store.chapters['ch'+ci];
    saveStore(); renderChapter(ci); buildTOC(); updateProgress();
  });
  $$('#viewChapter .mastery').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var id=btn.dataset.id; store.cards[id]=!store.cards[id];
      btn.classList.toggle('done', store.cards[id]);
      btn.textContent = store.cards[id]?'已掌握':'掌握';
      saveStore(); updateProgress();
    });
  });
  $$('#viewChapter .card-head').forEach(function(head){
    head.addEventListener('click', function(e){
      if(e.target.closest('.pill-btn')) return;
      var card = head.closest('.card');
      card.classList.toggle('collapsed');
      var fb = head.querySelector('.fold-btn');
      if(fb) fb.textContent = card.classList.contains('collapsed')?'展开':'收起';
    });
  });
  // tag filter
  $$('#viewChapter .tag[data-tag]').forEach(function(t){
    t.addEventListener('click', function(e){
      e.stopPropagation();
      applyTagFilter(t.dataset.tag);
    });
  });
  $('#clearFilter').addEventListener('click', function(){ applyTagFilter(null); });
  if(activeTag) applyTagFilter(activeTag);
}
var activeTag = null;
function applyTagFilter(tag){
  activeTag = tag;
  var note = $('#filterNote');
  if(!note) return;
  if(!tag){ note.classList.remove('show'); $$('#viewChapter .card').forEach(function(c){ c.style.display=''; }); return; }
  note.classList.add('show');
  $('#filterTag').textContent = tag;
  $$('#viewChapter .card').forEach(function(c){
    var tags = (c.dataset.tags||'').split(',');
    c.style.display = tags.indexOf(tag)>=0 ? '' : 'none';
  });
  $$('#viewChapter .tag[data-tag]').forEach(function(t){ t.classList.toggle('on', t.dataset.tag===tag); });
}

/* ---------- timeline ---------- */
var tlMode='vertical';
function renderTimeline(){
  $('#viewTimeline').innerHTML =
    '<div class="crumbs"><a data-route="home">首页</a><span>›</span><span>历史时间轴</span></div>'+
    '<div class="ch-head fade-in"><div class="no">TIMELINE</div><h1>中国近现代史时间轴</h1>'+
    '<div class="desc" style="margin:6px 0 0;font-size:13.5px;color:var(--muted);">1840—2022 · '+DATA.timeline.length+' 个关键节点 · 点击节点展开详情，详情可跳转对应章节。</div></div>'+
    '<div class="tl-toolbar">'+
      '<div class="seg" id="tlViewSeg">'+
        '<button data-mode="vertical" class="on">时间轴 · 纵向</button>'+
        '<button data-mode="horizontal">时间轴 · 横向</button>'+
        '<button data-mode="cards">卡片视图</button>'+
      '</div>'+
    '</div>'+
    '<div class="tl-wrap" id="tlWrap"></div>'+
    '<div id="tlDetail"></div>';
  $$('#viewTimeline .crumbs a').forEach(function(a){ a.addEventListener('click', function(){ go('#/home'); }); });
  $$('#tlViewSeg button').forEach(function(b){
    b.addEventListener('click', function(){
      $$('#tlViewSeg button').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on'); tlMode=b.dataset.mode; drawTimeline();
    });
  });
  drawTimeline();
}
function drawTimeline(){
  var wrap = $('#tlWrap'); wrap.innerHTML='';
  if(tlMode==='cards'){
    wrap.innerHTML = '<div class="grid tl-cards">'+DATA.timeline.map(function(n,i){
      return '<div class="tl-card fade-in" data-i="'+i+'"><div class="y">'+esc(n.year)+'</div><h4>'+esc(n.title)+'</h4><p>'+esc(n.desc)+'</p>'+
        '<div style="margin-top:10px;"><span class="tag" data-jump="'+n.ch+'">第'+['一','二','三','四','五','六','七','八','九','十'][Math.min(9,n.ch-1)]+'章</span></div></div>';
    }).join('')+'</div>';
    $$('#tlWrap .tag[data-jump]').forEach(function(t){
      t.addEventListener('click', function(){ go('#/ch/'+(Number(t.dataset.jump)-1)); });
    });
    $('#tlDetail').innerHTML='';
    return;
  }
  if(tlMode==='horizontal'){
    wrap.innerHTML = '<div class="tl-horizontal"><div class="tl-track">'+DATA.timeline.map(function(n,i){
      return '<div class="tl-h-node" data-i="'+i+'"><div class="dot"></div><div class="y">'+esc(n.year)+'</div><div class="t">'+esc(n.title)+'</div></div>';
    }).join('')+'</div></div><div class="tl-detail-panel" id="tlHDetail"><h3>点击上方节点查看详情</h3><p style="color:var(--muted);font-size:13.5px;margin:0;">时间轴支持横向浏览，节点与详情联动。</p></div>';
    $$('#tlWrap .tl-h-node').forEach(function(node){
      node.addEventListener('click', function(){
        $$('#tlWrap .tl-h-node').forEach(function(x){x.classList.remove('on');});
        node.classList.add('on');
        var n = DATA.timeline[Number(node.dataset.i)];
        $('#tlHDetail').innerHTML = '<h3>'+esc(n.year)+' · '+esc(n.title)+'</h3><p style="margin:6px 0 12px;">'+esc(n.desc)+'</p>'+
          '<button class="btn primary" data-goto="'+n.ch+'">前往对应章节 →</button>';
        $('#tlHDetail [data-goto]').addEventListener('click', function(){ go('#/ch/'+(Number(n.ch)-1)); });
      });
    });
    return;
  }
  wrap.innerHTML = '<div class="tl-vertical">'+DATA.timeline.map(function(n,i){
    return '<div class="tl-node" data-i="'+i+'"><div class="dot"></div>'+
      '<div class="head"><div class="year">'+esc(n.year)+'</div><div class="t">'+esc(n.title)+'</div>'+
      '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></div>'+
      '<div class="detail">'+esc(n.desc)+'<div style="margin-top:10px;"><button class="btn primary" data-goto="'+n.ch+'">前往对应章节 →</button></div></div></div>';
  }).join('')+'</div>';
  $$('#tlWrap .tl-node').forEach(function(node){
    node.querySelector('.head').addEventListener('click', function(){ node.classList.toggle('open'); });
    var g = node.querySelector('[data-goto]');
    if(g) g.addEventListener('click', function(){ go('#/ch/'+(Number(g.dataset.goto)-1)); });
  });
}

/* ---------- search ---------- */
var searchTimer=null;
function clearMarks(root){
  $$('mark.hit', root||document).forEach(function(m){
    var t=document.createTextNode(m.textContent); m.parentNode.replaceChild(t,m);
  });
  (root||document).normalize && (root||document).normalize();
}
function highlightIn(root, q){
  if(!q) return 0;
  var count=0;
  var walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    if(!n.nodeValue || n.nodeValue.indexOf(q)<0) return NodeFilter.FILTER_REJECT;
    if(n.parentNode && n.parentNode.closest('mark')) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  var nodes=[],n; while((n=walker.nextNode())) nodes.push(n);
  nodes.forEach(function(node){
    var parts=node.nodeValue.split(q); if(parts.length<2) return;
    var frag=document.createDocumentFragment();
    parts.forEach(function(p,i){
      if(i>0){ var mk=document.createElement('mark'); mk.className='hit'; mk.textContent=q; frag.appendChild(mk); count++; }
      if(p) frag.appendChild(document.createTextNode(p));
    });
    node.parentNode.replaceChild(frag,node);
  });
  return count;
}
function runSearch(q){
  q=(q||'').trim();
  var panel=$('#searchPanel');
  // in-view filtering + highlight
  clearMarks(document.querySelector('.main'));
  if(currentView==='chapter'){
    $$('#viewChapter .card').forEach(function(c){ c.style.display=''; });
    if(activeTag) applyTagFilter(activeTag);
  }
  if(!q){ panel.classList.remove('show'); panel.innerHTML=''; return; }
  if(currentView==='chapter'){
    $$('#viewChapter .card').forEach(function(c){
      if(c.textContent.indexOf(q)<0) c.style.display='none';
    });
    highlightIn($('#viewChapter'), q);
  }
  // global result list
  var results=[];
  BLOCKS.forEach(function(b){
    if((b.title+' '+b.text).indexOf(q)>=0 && results.length<30){
      var idx=(b.text||'').indexOf(q);
      var snip = idx>=0 ? b.text.slice(Math.max(0,idx-24), idx+60) : (b.text||'').slice(0,80);
      results.push({b:b, snip:snip});
    }
  });
  panel.innerHTML = results.length ?
    ('<div style="padding:6px 10px;font-size:11.5px;color:var(--muted);letter-spacing:1px;">全局结果 · '+results.length+' 条</div>'+
     results.map(function(r){
       return '<div class="s-res" data-id="'+r.b.id+'"><div class="t">'+esc(r.b.title)+' <small style="color:var(--muted);font-weight:400;">· '+esc(r.b.chapter.title)+'</small></div>'+
       '<div class="s">'+esc(r.snip).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'), '<mark class="hit">'+esc(q)+'</mark>')+'</div></div>';
     }).join(''))
    : '<div class="s-empty">未找到相关内容</div>';
  panel.classList.add('show');
  $$('#searchPanel .s-res').forEach(function(el){
    el.addEventListener('click', function(){
      var id=el.dataset.id; var parts=id.split('-');
      panel.classList.remove('show');
      activeTag=null;
      go('#/ch/'+parts[0].slice(1));
      setTimeout(function(){
        var card=document.getElementById('card-'+id);
        if(card){ card.style.display=''; card.scrollIntoView({behavior:'smooth',block:'center'});
          clearMarks(card); highlightIn(card, q);
          card.style.borderColor='var(--red)';
          setTimeout(function(){ card.style.borderColor=''; },1800);
        }
      },160);
    });
  });
}
$('#searchInput').addEventListener('input', function(){
  clearTimeout(searchTimer);
  var v=this.value; searchTimer=setTimeout(function(){ runSearch(v); },200);
});
$('#searchInput').addEventListener('keydown', function(e){
  if(e.key==='Escape'){ this.value=''; runSearch(''); this.blur(); }
});
document.addEventListener('click', function(e){
  if(!e.target.closest('.search-wrap')) $('#searchPanel').classList.remove('show');
});

/* ---------- misc controls ---------- */
$('#themeToggle').addEventListener('click', function(){
  setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
});
$('#fontPlus').addEventListener('click', function(){ if(sizeIdx<sizes.length-1){ sizeIdx++; applySize(); } });
$('#fontMinus').addEventListener('click', function(){ if(sizeIdx>0){ sizeIdx--; applySize(); } });
$('#printBtn').addEventListener('click', function(){ window.print(); });
$('#brandHome').addEventListener('click', function(){ go('#/home'); });
$$('.side-item[data-route]').forEach(function(b){
  b.addEventListener('click', function(){ go('#/'+b.dataset.route); closeDrawer(); });
});
window.addEventListener('beforeprint', function(){
  $$('.card').forEach(function(c){ c.classList.remove('collapsed'); });
});
var topBtn=$('#topBtn');
function onScroll(){
  var h=document.documentElement.scrollHeight-window.innerHeight;
  $('#progressBar').style.width=(h>0?window.scrollY/h*100:0)+'%';
  topBtn.style.display=window.scrollY>600?'block':'none';
  // scrollspy for chapter sections
  if(currentView==='chapter'){
    var current=null;
    $$('#viewChapter .sec-block').forEach(function(s){
      if(s.getBoundingClientRect().top<=120) current=s;
    });
    $$('.side-sec').forEach(function(x){ x.classList.remove('active'); });
    if(current){
      var si=current.id.split('-')[1];
      var link=document.querySelector('.side-sec[data-ch="'+currentChapter+'"][data-sec="'+si+'"]');
      if(link) link.classList.add('active');
    }
  }
}
window.addEventListener('scroll', onScroll, {passive:true});
topBtn.addEventListener('click', function(){ window.scrollTo({top:0,behavior:'smooth'}); });

/* mobile drawer */
function closeDrawer(){ $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); }
$('#menuBtn').addEventListener('click', function(){
  $('#sidebar').classList.toggle('open'); $('#overlay').classList.toggle('show');
});
$('#overlay').addEventListener('click', closeDrawer);

/* init */
buildTOC();
updateProgress();
render();
onScroll();
})();
