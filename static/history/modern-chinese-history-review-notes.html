i><span class=\"li-text\"><strong>萌芽<\/strong>（第一次国内革命战争时期，1924—1927）：《中国社会各阶级的分析》《湖南农民运动考察报告》；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>初步形成<\/strong>（土地革命战争时期，1927—1935）：《中国的红色政权为什么能够存在？》《井冈山的斗争》《星星之火，可以燎原》《反对本本主义》；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>走向成熟<\/strong>（遵义会议至抗日战争时期，1935—1945）：《〈共产党人〉发刊词》《中国革命和中国共产党》《新民主主义论》《论联合政府》；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>继续发展<\/strong>（解放战争时期至中华人民共和国成立后，1945—1949 年及以后）：《论人民民主专政》《论十大关系》。<\/span>\n<\/li><\/ol>\n<p>农村包围城市、武装夺取政权理论的提出，标志着中国化的马克思主义即毛泽东思想的初步形成，是马克思主义在中国的创造性运用和发展。<\/p><\/blockquote>\n<ol class=\"md-list\">\n<li><span class=\"li-text\"><strong>古田会议<\/strong>：1929 年 12 月，红四军党的第九次代表大会（古田会议）在福建上杭古田召开，通过了关于纠正党内错误思想的决议案，确立了<strong>思想建党、政治建军<\/strong>的原则。<strong>意义<\/strong>：古田会议决议是党和人民军队建设史上的重要里程碑，确立了马克思主义建党建军原则，创造性地解决了在农村环境中、在党组织和军队以农民为主要成分的条件下，如何保持党的无产阶级先锋队性质和建设党领导的新型人民军队的重大问题。党对军队的绝对领导，是人民军队永远不变的军魂，是人民军队区别于一切旧军队的政治特质和根本优势，对于中国革命新道路的开辟和坚持有重要意义。<\/span>\n<\/li>\n<li><span class=\"li-text\">随着革命新道路的开辟，中国革命走向复兴。红军游击战争在事实上成为了中国革命的主要形式，农村根据地成为积蓄和锻炼革命力量的主要战略阵地。<\/span>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）反\"围剿\"战争与土地革命<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">从 1930 年 10 月起，蒋介石集重兵向南方各根据地的红军发动大规模\"围剿\"。<\/span>\n<\/li>\n<li><span class=\"li-text\">红一方面军在毛泽东、朱德的带领下，实行积极防御的方针，采取\"诱敌深入\"\"避敌主力\"\"打其虚弱\"等战术。<\/span>\n<\/li>\n<li><span class=\"li-text\">红军反\"围剿\"战争的胜利和革命根据地的发展，与土地革命的开展密切相关。<\/span>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">毛泽东和邓子恢等一起制定了土地革命中的阶级路线和土地分配方法，开展\"打土豪，分田地\"的斗争；<\/span>\n<\/li>\n<li><span class=\"li-text\">坚定依靠贫农、雇农，联合中农，限制富农，保护中小工商业者，消灭地主阶级；<\/span>\n<\/li>\n<li><span class=\"li-text\">以乡为单位，按人口平分土地，在原耕地的基础上实行抽多补少、抽肥补瘦。<\/span>\n<\/li>\n<li><span class=\"li-text\">在大革命失败、白色恐怖的情况下，中国革命还能坚持和发展的根本原因，在于中国共产党紧紧依靠农民，领导农民进行了土地制度的革命。<\/span>\n<\/li><\/ul>\n<\/li>\n<li><span class=\"li-text\">文化战线上也开启了反\"围剿\"的左翼文化运动斗争：鲁迅的杂文、瞿秋白的评论、茅盾的小说《子夜》等。<\/span>\n<\/li><\/ol>\n<\/section>"}]}, {"title": "第二节 中国革命在曲折中前进", "blocks": [{"title": "一、土地革命战争的发展及其挫折", "tags": ["人物", "会议", "战争战役", "土地问题"], "text": "\n （一）农村革命根据地的建设\n\n1. 红一方面军第一、二、三次反\"围剿\"作战的胜利，使得赣南、闽西连成一片，形成中央革命根据地。\n2. 1931 年 11 月，中华苏维埃第一次全国代表大会在江西瑞金召开，产生了中华苏维埃共和国中央执行委员会，成立了中华苏维埃共和国临时中央政府，毛泽东当选为主席。\n   - 中华苏维埃共和国是中国历史上第一个全国性的工农民主政权，是中国共产党在局部地区执政的重要尝试；\n   - 苏维埃政府实行工农兵代表大会制度，同时注重发展文化教育事业和廉政建设、司法建设，使得苏维埃政府成为中国历史上从未有过的真正廉洁的政府。\n\n （二）土地革命战争的严重挫折\n\n（1）\"左\"倾错误的三次统治：从 1927 年 7 月大革命失败开始，到 1935 年 1 月遵义会议召开前，\"左\"倾错误先后三次在党中央领导机关中取得统治地位：\n\n1. 瞿秋白\"左\"倾盲动主义：1927.11—1928.4；\n2. 李立三\"左\"倾冒险主义：1930.6—1930.9；\n3. 王明\"左\"倾教条主义：1931.1—1935.1（最严重，导致红军和根据地损失了 90%，国民党统治区党的力量几乎损失了 100%，导致红军第五次反\"围剿\"失败、被迫进行长征）。\n\n（2）党内连续出现\"左\"倾错误的原因：\n\n   1. 八七会议后党内存在的\"左\"倾情绪始终没有认真清理；\n   2. 共产国际对中国革命的错误指导；\n   3. 主要在于全党马克思主义理论准备不足、实践经验缺乏，不善于把马克思列宁主义与中国实际全面地、正确地结合起来。\n\n王明\"左\"倾教条主义的主要错误：①在统一战线问题上一味排斥和打击中间势力；②在革命道路问题上坚持以城市为中心；③在军事问题上实行消极防御的方针；④在党内斗争和组织问题上，推行\"残酷斗争、无情打击\"的方针。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）农村革命根据地的建设<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">红一方面军第一、二、三次反\"围剿\"作战的胜利，使得赣南、闽西连成一片，形成中央革命根据地。<\/span>\n<\/li>\n<li><span class=\"li-text\">1931 年 11 月，中华苏维埃第一次全国代表大会在<strong>江西瑞金<\/strong>召开，产生了中华苏维埃共和国中央执行委员会，成立了中华苏维埃共和国临时中央政府，毛泽东当选为主席。<\/span>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">中华苏维埃共和国是中国历史上第一个全国性的工农民主政权，是中国共产党在局部地区执政的重要尝试；<\/span>\n<\/li>\n<li><span class=\"li-text\">苏维埃政府实行工农兵代表大会制度，同时注重发展文化教育事业和廉政建设、司法建设，使得苏维埃政府成为中国历史上从未有过的真正廉洁的政府。<\/span>\n<\/li><\/ul>\n<\/li><\/ol>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）土地革命战争的严重挫折<\/h5>\n<p><strong>（1）\"左\"倾错误的三次统治<\/strong>：从 1927 年 7 月大革命失败开始，到 1935 年 1 月遵义会议召开前，\"左\"倾错误先后三次在党中央领导机关中取得统治地位：<\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">瞿秋白\"左\"倾盲动主义：1927.11—1928.4；<\/span>\n<\/li>\n<li><span class=\"li-text\">李立三\"左\"倾冒险主义：1930.6—1930.9；<\/span>\n<\/li>\n<li><span class=\"li-text\">王明\"左\"倾教条主义：1931.1—1935.1（最严重，导致红军和根据地损失了 90%，国民党统治区党的力量几乎损失了 100%，导致红军第五次反\"围剿\"失败、被迫进行长征）。<\/span>\n<\/li><\/ol>\n<p><strong>（2）党内连续出现\"左\"倾错误的原因<\/strong>：<\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">八七会议后党内存在的\"左\"倾情绪始终没有认真清理；<\/span>\n<\/li>\n<li><span class=\"li-text\">共产国际对中国革命的错误指导；<\/span>\n<\/li>\n<li><span class=\"li-text\">主要在于全党马克思主义理论准备不足、实践经验缺乏，不善于把马克思列宁主义与中国实际全面地、正确地结合起来。<\/span>\n<\/li><\/ol>\n<p><strong>王明\"左\"倾教条主义的主要错误<\/strong>：①在统一战线问题上一味排斥和打击中间势力；②在革命道路问题上坚持以城市为中心；③在军事问题上实行消极防御的方针；④在党内斗争和组织问题上，推行\"残酷斗争、无情打击\"的方针。<\/p>\n<\/section>"}, {"title": "二、遵义会议实现伟大的历史转折", "tags": ["人物", "会议", "思想理论", "时间节点"], "text": "\n- 时间：1935 年 1 月。\n- 集中解决的主要问题：当时具有决定意义的军事和组织问题。会议增选毛泽东为中央政治局常委；中央政治局常委决定由张闻天代替博古负总的责任；不久成立由毛泽东、周恩来、王稼祥组成的三人小组，负责全军的军事行动。\n\n 遵义会议的历史意义\n\n1. 事实上确立了毛泽东在党中央和红军的领导地位，开始确立了以毛泽东为主要代表的马克思主义正确路线在党中央的领导地位，开始形成以毛泽东同志为核心的第一代中央领导集体，挽救了党、挽救了红军、挽救了中国革命，是中国共产党历史上一个生死攸关的转折点，标志着中国共产党在政治上开始走向成熟。\n2. ★遵义会议的鲜明特点是坚持真理、修正错误，确立党中央的正确领导，创造性地制定和实施符合中国革命特点的战略策略。遵义会议开启了中国共产党独立自主解决中国革命实际问题的新阶段。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>时间<\/strong>：1935 年 1 月。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>集中解决的主要问题<\/strong>：当时具有决定意义的军事和组织问题。会议增选毛泽东为中央政治局常委；中央政治局常委决定由张闻天代替博古负总的责任；不久成立由毛泽东、周恩来、王稼祥组成的三人小组，负责全军的军事行动。<\/span>\n<\/li><\/ul>\n<section class=\"lvl-5\">\n<h5>遵义会议的历史意义<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">事实上确立了毛泽东在党中央和红军的领导地位，开始确立了以毛泽东为主要代表的马克思主义正确路线在党中央的领导地位，开始形成以毛泽东同志为核心的第一代中央领导集体，挽救了党、挽救了红军、挽救了中国革命，是中国共产党历史上一个生死攸关的转折点，标志着中国共产党在政治上开始走向成熟。<\/span>\n<\/li>\n<li><span class=\"li-text\">★遵义会议的鲜明特点是坚持真理、修正错误，确立党中央的正确领导，创造性地制定和实施符合中国革命特点的战略策略。遵义会议开启了中国共产党独立自主解决中国革命实际问题的新阶段。<\/span>\n<\/li><\/ol>\n<\/section>"}, {"title": "三、红军长征胜利和迎接全民族抗战", "tags": ["会议", "战争战役", "思想理论", "抗日战争"], "text": "\n （一）长征的过程\n\n- 1934 年 10 月，中央红军主力等 8.6 万余人踏上了战略转移的漫漫征程，开始长征。\n- 1935 年 6 月，中央红军抵达四川懋功（今小金）地区，与红四方面军会师。党中央同红四方面军领导人张国焘分裂中央、分裂红军的严重错误进行了斗争。\n- 1936 年 10 月 9 日，红四方面军同红一方面军在甘肃会宁会师；10 月 22 日，红二方面军同红一方面军在将台堡（今宁夏西吉）会师。至此，三大主力红军（红一、红二、红四方面军）的长征胜利结束。\n\n （二）长征的意义\n\n1. 是中国革命转危为安的关键；\n2. 极大地促进了党在思想上和政治上的成熟；\n3. 宣告了国民党反动派消灭中国共产党和红军的图谋彻底失败，宣告了中国共产党和红军肩负着民族希望胜利实现了北上抗日的战略转移，实现了中国共产党和中国革命事业从挫折走向胜利的伟大转折，开启了中国共产党为实现民族独立、人民解放而斗争的伟大进军；\n4. 铸就了伟大的长征精神；\n5. 保存并锤炼了中国革命的骨干力量，播撒了革命的火种，为迎接中国人民抗日救亡的新高潮准备了条件。\n\n---\n", "html": "<section class=\"lvl-5\">\n<h5>（一）长征的过程<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1934 年 10 月，中央红军主力等 8.6 万余人踏上了战略转移的漫漫征程，开始长征。<\/span>\n<\/li>\n<li><span class=\"li-text\">1935 年 6 月，中央红军抵达四川懋功（今小金）地区，与红四方面军会师。党中央同红四方面军领导人张国焘分裂中央、分裂红军的严重错误进行了斗争。<\/span>\n<\/li>\n<li><span class=\"li-text\">1936 年 10 月 9 日，红四方面军同红一方面军在甘肃会宁会师；10 月 22 日，红二方面军同红一方面军在将台堡（今宁夏西吉）会师。至此，三大主力红军（红一、红二、红四方面军）的长征胜利结束。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）长征的意义<\/h5>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">是中国革命转危为安的关键；<\/span>\n<\/li>\n<li><span class=\"li-text\">极大地促进了党在思想上和政治上的成熟；<\/span>\n<\/li>\n<li><span class=\"li-text\">宣告了国民党反动派消灭中国共产党和红军的图谋彻底失败，宣告了中国共产党和红军肩负着民族希望胜利实现了北上抗日的战略转移，实现了中国共产党和中国革命事业从挫折走向胜利的伟大转折，开启了中国共产党为实现民族独立、人民解放而斗争的伟大进军；<\/span>\n<\/li>\n<li><span class=\"li-text\">铸就了伟大的长征精神；<\/span>\n<\/li>\n<li><span class=\"li-text\">保存并锤炼了中国革命的骨干力量，播撒了革命的火种，为迎接中国人民抗日救亡的新高潮准备了条件。<\/span>\n<\/li><\/ol>\n<hr/>\n<\/section>"}]}]}, {"num": "第六章", "title": "第六章 中华民族的抗日战争", "name": "中华民族的抗日战争", "sections": [{"title": "第一节 日本发动企图灭亡中国的侵略战争", "blocks": [{"title": "一、日本侵华战略方针的制定", "tags": ["会议", "战争战役", "思想理论", "时间节点"], "text": "\n- 1927 年，日本首相田中义一召开\"东方会议\"，制定侵华战略方针。\n- 九一八事变：1931 年 9 月 18 日，日本变中国为其独占殖民地的侵略战争由此开始。\n- 华北事变：1935 年，日本策动华北五省两市\"防共自治运动\"，制造傀儡政权。\n- 七七事变：1937 年 7 月 7 日，日本全面侵华战争由此开始。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">1927 年，日本首相田中义一召开\"东方会议\"，制定侵华战略方针。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>九一八事变<\/strong>：1931 年 9 月 18 日，日本变中国为其独占殖民地的侵略战争由此开始。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>华北事变<\/strong>：1935 年，日本策动华北五省两市\"防共自治运动\"，制造傀儡政权。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>七七事变<\/strong>：1937 年 7 月 7 日，日本全面侵华战争由此开始。<\/span>\n<\/li><\/ul>"}, {"title": "二、日本帝国主义的残暴统治", "tags": ["思想理论", "抗日战争"], "text": "\n1. 制造惨绝人寰的大屠杀，残害中国人民；\n2. 疯狂掠夺中国的资源和财富；\n3. 强制推行奴化教育，肆意摧残中国文化。\n", "html": "<ol class=\"md-list\">\n<li><span class=\"li-text\">制造惨绝人寰的大屠杀，残害中国人民；<\/span>\n<\/li>\n<li><span class=\"li-text\">疯狂掠夺中国的资源和财富；<\/span>\n<\/li>\n<li><span class=\"li-text\">强制推行奴化教育，肆意摧残中国文化。<\/span>\n<\/li><\/ol>"}]}, {"title": "第二节 中国人民奋起抗击日本侵略者", "blocks": [{"title": "一、一二·九运动与中共的抗日民族统一战线新政策", "tags": ["会议", "条约文献", "思想理论", "党的建设"], "text": "\n- 1935 年 12 月 9 日，北平学生举行声势浩大的抗日游行，喊出\"反华北自治\"\"打倒日本帝国主义\"\"停止内战，一致对外\"等口号，遭到国民党军警镇压。12 月 16 日，北平学生和市民 1 万多人召开市民大会，会后举行了更大规模的示威游行。由此开始的一二·九运动迅速波及全国。它促进了中华民族觉醒，标志着中国人民抗日救亡运动新高潮的到来。\n- 1935 年 8 月 1 日，发表《为抗日救国告全体同胞书》（\"八一宣言\"），号召停止内战、一致抗日。\n- 1935 年 12 月，瓦窑堡会议提出建立抗日民族统一战线的新政策。\n- 1936 年 5 月，发布《停战议和一致抗日通电》，放弃\"反蒋\"口号。\n- 1936 年 9 月 1 日，明确提出党的总方针是\"逼蒋抗日\"。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">1935 年 12 月 9 日，北平学生举行声势浩大的抗日游行，喊出\"反华北自治\"\"打倒日本帝国主义\"\"停止内战，一致对外\"等口号，遭到国民党军警镇压。12 月 16 日，北平学生和市民 1 万多人召开市民大会，会后举行了更大规模的示威游行。由此开始的一二·九运动迅速波及全国。它促进了中华民族觉醒，标志着中国人民抗日救亡运动新高潮的到来。<\/span>\n<\/li>\n<li><span class=\"li-text\">1935 年 8 月 1 日，发表《为抗日救国告全体同胞书》（\"八一宣言\"），号召停止内战、一致抗日。<\/span>\n<\/li>\n<li><span class=\"li-text\">1935 年 12 月，瓦窑堡会议提出建立抗日民族统一战线的新政策。<\/span>\n<\/li>\n<li><span class=\"li-text\">1936 年 5 月，发布《停战议和一致抗日通电》，放弃\"反蒋\"口号。<\/span>\n<\/li>\n<li><span class=\"li-text\">1936 年 9 月 1 日，明确提出党的总方针是\"逼蒋抗日\"。<\/span>\n<\/li><\/ul>"}, {"title": "二、西安事变及其和平解决", "tags": ["人物", "战争战役", "时间节点"], "text": "\n- 1936 年 12 月 12 日凌晨，爱国将领张学良、杨虎城对蒋介石实行\"兵谏\"，扣留了蒋介石，这就是西安事变。西安事变的和平解决成为时局转换的枢纽，十年内战局面基本结束。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">1936 年 12 月 12 日凌晨，爱国将领张学良、杨虎城对蒋介石实行\"兵谏\"，扣留了蒋介石，这就是西安事变。西安事变的和平解决成为时局转换的枢纽，十年内战局面基本结束。<\/span>\n<\/li><\/ul>"}, {"title": "三、国共合作，共赴国难", "tags": ["人物", "条约文献", "党的建设", "抗日战争"], "text": "\n- 1937 年 7 月 8 日，中共发表通电，号召全中国同胞团结起来。\n- 1937 年 8 月，红军改编为国民革命军第八路军；9 月，陕甘宁根据地改称陕甘宁边区；接着，南方八省的红军游击队改编为新四军。\n- 1937 年 9 月 22 日，国民党中央通讯社发表《中共中央为公布国共合作宣言》。\n- 1937 年 9 月 23 日，蒋介石发表实际上承认共产党合法地位的谈话，抗日民族统一战线正式形成。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">1937 年 7 月 8 日，中共发表通电，号召全中国同胞团结起来。<\/span>\n<\/li>\n<li><span class=\"li-text\">1937 年 8 月，红军改编为国民革命军第八路军；9 月，陕甘宁根据地改称陕甘宁边区；接着，南方八省的红军游击队改编为新四军。<\/span>\n<\/li>\n<li><span class=\"li-text\">1937 年 9 月 22 日，国民党中央通讯社发表《中共中央为公布国共合作宣言》。<\/span>\n<\/li>\n<li><span class=\"li-text\">1937 年 9 月 23 日，蒋介石发表实际上承认共产党合法地位的谈话，抗日民族统一战线正式形成。<\/span>\n<\/li><\/ul>"}, {"title": "四、全民族同仇敌忾，奋起抗战", "tags": ["战争战役", "土地问题", "党的建设", "抗日战争"], "text": "\n- 工人、农民、知识分子、民族资产阶级、海外华侨、港澳台同胞等以不同形式参加抗日民族统一战线；国民党爱国官兵在正面战场英勇作战，国民党爱国将领佟麟阁、赵登禹、谢晋元、张自忠、戴安澜等为国捐躯，各界民众纷纷组织抗日救亡团体，形成了全民族抗战的局面。\n- 1932 年一·二八事变后，国民党第十九路军奋起抗击进攻上海的日军，中共中央号召各界民众组织义勇军，并发动沪西日商纱厂工人罢工，以支援十九路军的抗日作战。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">工人、农民、知识分子、民族资产阶级、海外华侨、港澳台同胞等以不同形式参加抗日民族统一战线；国民党爱国官兵在正面战场英勇作战，国民党爱国将领佟麟阁、赵登禹、谢晋元、张自忠、戴安澜等为国捐躯，各界民众纷纷组织抗日救亡团体，形成了全民族抗战的局面。<\/span>\n<\/li>\n<li><span class=\"li-text\">1932 年一·二八事变后，国民党第十九路军奋起抗击进攻上海的日军，中共中央号召各界民众组织义勇军，并发动沪西日商纱厂工人罢工，以支援十九路军的抗日作战。<\/span>\n<\/li><\/ul>"}]}, {"title": "第三节 抗日战争的正面战场", "blocks": [{"title": "一、战略防御阶段的正面战场", "tags": ["战争战役", "思想理论", "经济建设", "抗日战争"], "text": "\n （一）抗日战争的三个阶段\n\n- 战略防御阶段：1937.7—1938.10；\n- 战略相持阶段：1938.10—1943.12；\n- 战略反攻阶段：1944.1—1945.8。\n\n （二）国民党正面战场的作战及败退原因\n\n- 战略防御阶段，以国民军队为主体的正面战场担负了抗击日军进攻的主要任务，组织了淞沪、忻口、徐州、武汉会战等一系列大战役。1938 年 3 月，李宗仁等部进行台儿庄战役，取得大捷。\n\n 为什么国民党正面战场的战役几乎都以退却、失败结束？\n\n 1. 客观原因：军事实力、经济实力、政治组织能力都不如日本；\n 2. 主观原因：实行片面抗战路线，不敢放手发动和武装民众，在战略战术上进行单纯的阵地防御战。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）抗日战争的三个阶段<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">战略防御阶段：1937.7—1938.10；<\/span>\n<\/li>\n<li><span class=\"li-text\">战略相持阶段：1938.10—1943.12；<\/span>\n<\/li>\n<li><span class=\"li-text\">战略反攻阶段：1944.1—1945.8。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）国民党正面战场的作战及败退原因<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">战略防御阶段，以国民军队为主体的正面战场担负了抗击日军进攻的主要任务，组织了淞沪、忻口、徐州、武汉会战等一系列大战役。1938 年 3 月，李宗仁等部进行台儿庄战役，取得大捷。<\/span>\n<\/li><\/ul>\n<blockquote><p><strong>为什么国民党正面战场的战役几乎都以退却、失败结束？<\/strong><\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\"><strong>客观原因<\/strong>：军事实力、经济实力、政治组织能力都不如日本；<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>主观原因<\/strong>：实行片面抗战路线，不敢放手发动和武装民众，在战略战术上进行单纯的阵地防御战。<\/span>\n<\/li><\/ol><\/blockquote>\n<\/section>"}, {"title": "二、战略相持阶段的正面战场", "tags": ["人物", "会议", "战争战役", "思想理论"], "text": "\n- 1938 年武汉失守，标志着中国抗日战争进入战略相持阶段。1939 年 1 月，国民党五届五中全会把对付共产党作为主要议题，确定了\"防共、限共、溶共、反共\"的方针，蒋介石还将\"抗战到底\"的含义解释为\"恢复到卢沟桥事变以前的状态\"。这标志着国民党政府逐步转变为消极抗战。\n- 豫湘桂大溃败：1944 年 4 月至 1945 年 1 月，成为大后方人心变动的重要转折点，国民党陷入深刻统治危机。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">1938 年武汉失守，标志着中国抗日战争进入战略相持阶段。1939 年 1 月，国民党五届五中全会把对付共产党作为主要议题，确定了\"防共、限共、溶共、反共\"的方针，蒋介石还将\"抗战到底\"的含义解释为\"恢复到卢沟桥事变以前的状态\"。这标志着国民党政府逐步转变为消极抗战。<\/span>\n<\/li>\n<li><span class=\"li-text\"><strong>豫湘桂大溃败<\/strong>：1944 年 4 月至 1945 年 1 月，成为大后方人心变动的重要转折点，国民党陷入深刻统治危机。<\/span>\n<\/li><\/ul>"}]}, {"title": "第四节 抗日战争的中流砥柱", "blocks": [{"title": "一、全面抗战路线和持久战的战略总方针", "tags": ["人物", "会议", "战争战役", "思想理论"], "text": "\n- 1937 年 8 月，洛川会议，制定全面抗战路线。\n- 1938 年，毛泽东发表《论持久战》，强调\"兵民是胜利之本\"，必须进行人民战争；科学预见了抗战的发展历程，即战略防御、战略相持、战略反攻三个阶段。中日双方存在相互矛盾的四个基本特点：敌强我弱、敌小我大、敌退步我进步、敌寡助我多助，这决定了抗日战争只能是持久战，最后胜利属于中国。战略相持阶段，是中国抗日战争取得最后胜利的最关键的阶段。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">1937 年 8 月，洛川会议，制定全面抗战路线。<\/span>\n<\/li>\n<li><span class=\"li-text\">1938 年，毛泽东发表《论持久战》，强调\"兵民是胜利之本\"，必须进行人民战争；科学预见了抗战的发展历程，即战略防御、战略相持、战略反攻三个阶段。中日双方存在相互矛盾的四个基本特点：敌强我弱、敌小我大、敌退步我进步、敌寡助我多助，这决定了抗日战争只能是持久战，最后胜利属于中国。<strong>战略相持阶段，是中国抗日战争取得最后胜利的最关键的阶段。<\/strong><\/span>\n<\/li><\/ul>"}, {"title": "二、敌后战场的开辟与游击战争的发展", "tags": ["战争战役", "抗日战争", "时间节点"], "text": "\n- 1937 年 9 月，平型关大捷，取得全民族抗战以来中国军队的第一次重大胜利，粉碎了日军不可战胜的神话。\n\n 游击战争的战略地位和作用\n\n- 在全民族抗战中，游击战争被提到战略地位，具有全局性意义。\n- 在战略防御阶段，从全局看，国民党正面战场的正规战是主要的，敌后游击战是辅助的；但是游击战对阻止日军进攻、减轻正面战场压力、使战争转入相持阶段起了关键性作用。\n- 在战略相持阶段，敌后游击战争成为主要的抗日作战方式（如 1940 年的百团大战）。人民军队在大部分时间里所进行的主要是游击战，削弱敌人、壮大自己，逐步改变敌强我弱态势，为实行战略反攻准备条件，这个任务主要是由人民军队进行的游击战来完成的。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">1937 年 9 月，平型关大捷，取得全民族抗战以来中国军队的第一次重大胜利，粉碎了日军不可战胜的神话。<\/span>\n<\/li><\/ul>\n<section class=\"lvl-5\">\n<h5>游击战争的战略地位和作用<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">在全民族抗战中，游击战争被提到战略地位，具有全局性意义。<\/span>\n<\/li>\n<li><span class=\"li-text\">在战略防御阶段，从全局看，国民党正面战场的正规战是主要的，敌后游击战是辅助的；但是游击战对阻止日军进攻、减轻正面战场压力、使战争转入相持阶段起了关键性作用。<\/span>\n<\/li>\n<li><span class=\"li-text\">在战略相持阶段，敌后游击战争成为主要的抗日作战方式（如 1940 年的百团大战）。人民军队在大部分时间里所进行的主要是游击战，削弱敌人、壮大自己，逐步改变敌强我弱态势，为实行战略反攻准备条件，这个任务主要是由人民军队进行的游击战来完成的。<\/span>\n<\/li><\/ul>\n<\/section>"}, {"title": "三、坚持抗战、团结、进步的方针", "tags": ["人物", "会议", "战争战役", "土地问题"], "text": "\n （一）统一战线中的独立自主原则\n\n全民族抗战伊始，中共中央就提出必须在统一战线中坚持独立自主原则。为此，共产党必须保持在思想上、政治上和组织上的独立性，放手发动群众，壮大人民力量；必须坚持对人民军队的绝对领导，冲破国民党的限制和束缚，努力发展人民武装和抗日根据地；必须对国民党采取又团结又斗争、以斗争求团结的方针。这样做的目的，就是力争中国共产党对抗日战争的领导权，使自己成为团结全民族抗战的中坚力量。这是把抗日战争引向胜利的中心一环。\n\n （二）坚持抗战、团结、进步，反对妥协、分裂、倒退\n\n1939 年 7 月，中国共产党明确提出\"坚持抗战到底——反对中途妥协\"\"巩固国内团结——反对内部分裂\"\"力求全国进步——反对向后倒退\"三大口号，坚决揭露打击汪精卫集团的卖国投降活动，继续争取同蒋介石集团合作抗日。\n\n- 1941 年 1 月，国民党顽固派发动第二次反共高潮，制造皖南事变，诬称新四军\"叛变\"，宣布取消新四军番号。中国共产党对此进行了坚决斗争。\n\n （三）巩固抗日民族统一战线的策略总方针\n\n- 策略总方针：发展进步势力，争取中间势力，孤立顽固势力。\n- 进步势力主要是指工人、农民和城市小资产阶级；中间势力主要是指民族资产阶级、开明绅士和地方实力派；顽固势力主要是指大地主大资产阶级的抗日派，即以蒋介石集团为代表的国民党亲英美派。\n- 对顽固派实行又联合又斗争的政策，同顽固派斗争时坚持有理、有利、有节的原则。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）统一战线中的独立自主原则<\/h5>\n<p>全民族抗战伊始，中共中央就提出必须在统一战线中坚持独立自主原则。为此，共产党必须保持在思想上、政治上和组织上的独立性，放手发动群众，壮大人民力量；必须坚持对人民军队的绝对领导，冲破国民党的限制和束缚，努力发展人民武装和抗日根据地；必须对国民党采取又团结又斗争、以斗争求团结的方针。这样做的目的，就是力争中国共产党对抗日战争的领导权，使自己成为团结全民族抗战的中坚力量。这是把抗日战争引向胜利的中心一环。<\/p>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）坚持抗战、团结、进步，反对妥协、分裂、倒退<\/h5>\n<p>1939 年 7 月，中国共产党明确提出\"坚持抗战到底——反对中途妥协\"\"巩固国内团结——反对内部分裂\"\"力求全国进步——反对向后倒退\"三大口号，坚决揭露打击汪精卫集团的卖国投降活动，继续争取同蒋介石集团合作抗日。<\/p>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1941 年 1 月，国民党顽固派发动第二次反共高潮，制造<strong>皖南事变<\/strong>，诬称新四军\"叛变\"，宣布取消新四军番号。中国共产党对此进行了坚决斗争。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）巩固抗日民族统一战线的策略总方针<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\"><strong>策略总方针<\/strong>：发展进步势力，争取中间势力，孤立顽固势力。<\/span>\n<\/li>\n<li><span class=\"li-text\">进步势力主要是指工人、农民和城市小资产阶级；中间势力主要是指民族资产阶级、开明绅士和地方实力派；顽固势力主要是指大地主大资产阶级的抗日派，即以蒋介石集团为代表的国民党亲英美派。<\/span>\n<\/li>\n<li><span class=\"li-text\">对顽固派实行又联合又斗争的政策，同顽固派斗争时坚持<strong>有理、有利、有节<\/strong>的原则。<\/span>\n<\/li><\/ul>\n<\/section>"}, {"title": "四、抗日民主根据地的建设", "tags": ["土地问题", "党的建设", "经济建设", "抗日战争"], "text": "\n （一）\"三三制\"的民主政权建设\n\n- 加强政权建设，是抗日根据地建设的首要的、根本的任务。根据地政权是共产党领导的抗日民族统一战线性质的政权，在工作人员分配上实行\"三三制\"原则，即共产党员、党外进步人士和中间派各占 1/3。这样做，可以容纳各方面的代表，团结一切赞成抗日又赞成民主的各阶级、阶层。\n- 抗日民主政权普遍采取民主集中制，各级抗日民主政权机构的领导人都经过人民选举产生。\n\n （二）减租减息，发展生产\n\n抗日民主政权十分重视根据地的经济建设。停止实行没收地主土地的政策，普遍实行减租减息政策，以减轻农民所受的封建剥削，提高他们的抗日和生产的积极性；同时实行交租交息，以利于联合地主阶级抗日。\n\n （三）文化建设与干部教育\n\n- 根据地大力发展文化教育事业，创办各类学校（如中国人民抗日军事政治大学等），培养大批革命干部；1940 年 8 月创办的延安自然科学院，是中国共产党历史上第一个开展自然科学教学与研究的专门机构；\n- 开展冬学、夜校等群众性扫盲教育，发展抗日文艺，鼓舞军民斗志。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）\"三三制\"的民主政权建设<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">加强政权建设，是抗日根据地建设的首要的、根本的任务。根据地政权是共产党领导的抗日民族统一战线性质的政权，在工作人员分配上实行\"三三制\"原则，即共产党员、党外进步人士和中间派各占 1/3。这样做，可以容纳各方面的代表，团结一切赞成抗日又赞成民主的各阶级、阶层。<\/span>\n<\/li>\n<li><span class=\"li-text\">抗日民主政权普遍采取民主集中制，各级抗日民主政权机构的领导人都经过人民选举产生。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）减租减息，发展生产<\/h5>\n<p>抗日民主政权十分重视根据地的经济建设。停止实行没收地主土地的政策，普遍实行减租减息政策，以减轻农民所受的封建剥削，提高他们的抗日和生产的积极性；同时实行交租交息，以利于联合地主阶级抗日。<\/p>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）文化建设与干部教育<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">根据地大力发展文化教育事业，创办各类学校（如中国人民抗日军事政治大学等），培养大批革命干部；1940 年 8 月创办的延安自然科学院，是中国共产党历史上第一个开展自然科学教学与研究的专门机构；<\/span>\n<\/li>\n<li><span class=\"li-text\">开展冬学、夜校等群众性扫盲教育，发展抗日文艺，鼓舞军民斗志。<\/span>\n<\/li><\/ul>\n<\/section>"}, {"title": "五、大后方的抗日民主运动和进步文化工作", "tags": ["抗日战争"], "text": "\n- 国民党统治区（大后方）的抗日民主运动和进步文化工作，是全民族抗战的重要组成部分。中国共产党积极引导和支持大后方的民主运动，推动宪政运动，团结民主党派和无党派人士；\n- 进步文化界开展抗战文化宣传（如郭沫若主持的国民政府军事委员会政治部第三厅等），鼓舞了全国人民的抗战信心。\n", "html": "<ul class=\"md-list\">\n<li><span class=\"li-text\">国民党统治区（大后方）的抗日民主运动和进步文化工作，是全民族抗战的重要组成部分。中国共产党积极引导和支持大后方的民主运动，推动宪政运动，团结民主党派和无党派人士；<\/span>\n<\/li>\n<li><span class=\"li-text\">进步文化界开展抗战文化宣传（如郭沫若主持的国民政府军事委员会政治部第三厅等），鼓舞了全国人民的抗战信心。<\/span>\n<\/li><\/ul>"}, {"title": "六、中国共产党的自身建设", "tags": ["人物", "会议", "条约文献", "战争战役"], "text": "\n （一）\"马克思主义的中国化\"命题的提出\n\n1938 年，在党的六届六中全会上，毛泽东提出\"马克思主义的中国化\"的命题。\n\n （二）新民主主义理论的系统阐明\n\n- 为了将丰富的中国革命实际经验马克思主义化，以更好地指导抗日战争和中国革命，1939 年、1940 年之交，毛泽东撰写了《〈共产党人〉发刊词》《中国革命和中国共产党》《新民主主义论》等一批重要理论著作。\n- 毛泽东总结中国共产党成立以来的历史经验，指出统一战线、武装斗争、党的建设是中国共产党在中国革命中战胜敌人的三个主要法宝。\n- 新民主主义理论是马克思主义中国化的重大理论成果。它的提出和系统阐明，标志着毛泽东思想得到多方面展开而趋于成熟。这个理论从思想上武装了中国共产党人，使他们极大地增强了参加和领导抗日战争以及整个新民主主义革命的自觉性。\n\n （三）整风运动和《关于若干历史问题的决议》\n\n- 1942 年 2 月，毛泽东先后作了《整顿党的作风》和《反对党八股》的讲演，整风运动在全党普遍展开（1941 年 5 月，毛泽东已作《改造我们的学习》的报告）。整风运动的主要内容是：反对主观主义以整顿学风（最主要的任务）、反对宗派主义以整顿党风、反对党八股以整顿文风；主观主义的主要表现形式是教条主义和经验主义。整风运动是一场伟大的思想解放运动，一切从实际出发、理论联系实际、实事求是的马克思主义思想路线在全党范围确立了起来。\n- 1944 年 5 月 21 日至 1945 年 4 月 20 日，中共扩大的六届七中全会在延安召开。会议原则通过了《关于若干历史问题的决议》，对建党以后特别是党的六届四中全会至遵义会议前这一段党的历史及其经验教训进行了总结，对党的若干重大历史问题作出结论。\n\n （四）中共七大和毛泽东思想指导地位的确立\n\n- 1945 年 4 月 23 日至 6 月 11 日，中国共产党第七次全国代表大会在延安召开。\n- 中共七大在党的历史上具有重要里程碑意义，标志着党在政治上、思想上、组织上走向成熟。它为建立新民主主义的新中国制定了正确路线方针政策，确立了毛泽东在党中央和全党的领导核心地位、毛泽东思想在全党的指导地位，形成了一支高举毛泽东旗帜的久经考验的政治家集团。大会把马克思列宁主义基本原理同中国具体实际相结合的理论成果正式命名为毛泽东思想，并将其规定为党的一切工作的指针。\n\n 论述题：中国共产党为什么是抗日战争的中流砥柱？（参见习近平在纪念中国人民抗日战争暨世界反法西斯战争胜利 75 周年座谈会上的讲话，2020 年 9 月 3 日）\n\n 1. 最早举起武装抗日旗帜，率先开展抗日行动（如东北抗日联军等）；\n 2. 倡导、巩固、发展抗日民族统一战线（促成西安事变和平解决等）；\n 3. 提出并坚持全面抗战路线和持久战的战略总方针；\n 4. 开辟敌后战场，发展壮大人民武装；\n 5. 加强党的建设，弘扬伟大抗战精神。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）\"马克思主义的中国化\"命题的提出<\/h5>\n<p>1938 年，在党的六届六中全会上，毛泽东提出\"马克思主义的中国化\"的命题。<\/p>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）新民主主义理论的系统阐明<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">为了将丰富的中国革命实际经验马克思主义化，以更好地指导抗日战争和中国革命，1939 年、1940 年之交，毛泽东撰写了《〈共产党人〉发刊词》《中国革命和中国共产党》《新民主主义论》等一批重要理论著作。<\/span>\n<\/li>\n<li><span class=\"li-text\">毛泽东总结中国共产党成立以来的历史经验，指出<strong>统一战线、武装斗争、党的建设<\/strong>是中国共产党在中国革命中战胜敌人的三个主要法宝。<\/span>\n<\/li>\n<li><span class=\"li-text\">新民主主义理论是马克思主义中国化的重大理论成果。它的提出和系统阐明，标志着毛泽东思想得到多方面展开而趋于成熟。这个理论从思想上武装了中国共产党人，使他们极大地增强了参加和领导抗日战争以及整个新民主主义革命的自觉性。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（三）整风运动和《关于若干历史问题的决议》<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1942 年 2 月，毛泽东先后作了《整顿党的作风》和《反对党八股》的讲演，整风运动在全党普遍展开（1941 年 5 月，毛泽东已作《改造我们的学习》的报告）。整风运动的<strong>主要内容<\/strong>是：反对主观主义以整顿学风（最主要的任务）、反对宗派主义以整顿党风、反对党八股以整顿文风；主观主义的主要表现形式是教条主义和经验主义。整风运动是一场伟大的思想解放运动，一切从实际出发、理论联系实际、实事求是的马克思主义思想路线在全党范围确立了起来。<\/span>\n<\/li>\n<li><span class=\"li-text\">1944 年 5 月 21 日至 1945 年 4 月 20 日，中共扩大的六届七中全会在延安召开。会议原则通过了《关于若干历史问题的决议》，对建党以后特别是党的六届四中全会至遵义会议前这一段党的历史及其经验教训进行了总结，对党的若干重大历史问题作出结论。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（四）中共七大和毛泽东思想指导地位的确立<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1945 年 4 月 23 日至 6 月 11 日，中国共产党第七次全国代表大会在延安召开。<\/span>\n<\/li>\n<li><span class=\"li-text\">中共七大在党的历史上具有重要里程碑意义，标志着党在政治上、思想上、组织上走向成熟。它为建立新民主主义的新中国制定了正确路线方针政策，确立了毛泽东在党中央和全党的领导核心地位、毛泽东思想在全党的指导地位，形成了一支高举毛泽东旗帜的久经考验的政治家集团。大会把马克思列宁主义基本原理同中国具体实际相结合的理论成果正式命名为<strong>毛泽东思想<\/strong>，并将其规定为党的一切工作的指针。<\/span>\n<\/li><\/ul>\n<blockquote><p><strong>论述题：中国共产党为什么是抗日战争的中流砥柱？<\/strong>（参见习近平在纪念中国人民抗日战争暨世界反法西斯战争胜利 75 周年座谈会上的讲话，2020 年 9 月 3 日）<\/p>\n<ol class=\"md-list\">\n<li><span class=\"li-text\">最早举起武装抗日旗帜，率先开展抗日行动（如东北抗日联军等）；<\/span>\n<\/li>\n<li><span class=\"li-text\">倡导、巩固、发展抗日民族统一战线（促成西安事变和平解决等）；<\/span>\n<\/li>\n<li><span class=\"li-text\">提出并坚持全面抗战路线和持久战的战略总方针；<\/span>\n<\/li>\n<li><span class=\"li-text\">开辟敌后战场，发展壮大人民武装；<\/span>\n<\/li>\n<li><span class=\"li-text\">加强党的建设，弘扬伟大抗战精神。<\/span>\n<\/li><\/ol><\/blockquote>\n<\/section>"}]}, {"title": "第五节 抗日战争的胜利及其意义", "blocks": [{"title": "一、抗日战争的胜利", "tags": ["战争战役", "抗日战争", "时间节点"], "text": "\n （一）解放区战场的全面反攻\n\n （二）日本投降和台湾光复\n\n- 1945 年 8 月 15 日，日本天皇裕仁以广播\"终战诏书\"的形式宣布接受波茨坦公告，日本宣布无条件投降。\n- 9 月 2 日，在东京湾美国军舰\"密苏里号\"上举行日本向同盟国投降的签字仪式。\n- 9 月 9 日，中国战区日军投降签字仪式在南京举行，侵华日军 128 万余人向中国投降。\n- 9 月 3 日，中国人民抗日战争胜利纪念日。\n- 10 月 25 日，中国政府在台湾举行受降仪式，被日本占领 50 年之久的台湾及澎湖列岛重归中国主权管辖，这是抗日战争取得完全胜利的重要标志。\n", "html": "<section class=\"lvl-5\">\n<h5>（一）解放区战场的全面反攻<\/h5>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）日本投降和台湾光复<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">1945 年 8 月 15 日，日本天皇裕仁以广播\"终战诏书\"的形式宣布接受波茨坦公告，日本宣布无条件投降。<\/span>\n<\/li>\n<li><span class=\"li-text\">9 月 2 日，在东京湾美国军舰\"密苏里号\"上举行日本向同盟国投降的签字仪式。<\/span>\n<\/li>\n<li><span class=\"li-text\">9 月 9 日，中国战区日军投降签字仪式在南京举行，侵华日军 128 万余人向中国投降。<\/span>\n<\/li>\n<li><span class=\"li-text\">9 月 3 日，中国人民抗日战争胜利纪念日。<\/span>\n<\/li>\n<li><span class=\"li-text\">10 月 25 日，中国政府在台湾举行受降仪式，被日本占领 50 年之久的台湾及澎湖列岛重归中国主权管辖，这是抗日战争取得完全胜利的重要标志。<\/span>\n<\/li><\/ul>\n<\/section>"}, {"title": "二、中国人民抗日战争在世界反法西斯战争中的地位", "tags": ["人物", "会议", "战争战役", "抗日战争"], "text": "\n （一）世界反法西斯战争的东方主战场\n\n- 中国人民抗日战争是近代以来中国抗击外敌入侵第一次取得完全胜利的民族解放战争，从一开始就具有拯救人类文明、保卫世界和平的重大意义，是世界反法西斯战争的重要组成部分；中国战场是世界反法西斯战争的东方主战场，中国人民的持久抗战为同盟国完成太平洋战争的战略转折和实施战略反攻创造了有利条件。\n- 1945 年 4 月，联合国制宪会议在美国旧金山举行，包括中国解放区代表董必武在内的中国代表团出席了会议。中国成为联合国的创始国和安理会五个常任理事国之一。\n\n （二）世界反法西斯力量对中国的援助\n", "html": "<section class=\"lvl-5\">\n<h5>（一）世界反法西斯战争的东方主战场<\/h5>\n<ul class=\"md-list\">\n<li><span class=\"li-text\">中国人民抗日战争是近代以来中国抗击外敌入侵第一次取得完全胜利的民族解放战争，从一开始就具有拯救人类文明、保卫世界和平的重大意义，是世界反法西斯战争的重要组成部分；中国战场是世界反法西斯战争的东方主战场，中国人民的持久抗战为同盟国完成太平洋战争的战略转折和实施战略反攻创造了有利条件。<\/span>\n<\/li>\n<li><span class=\"li-text\">1945 年 4 月，联合国制宪会议在美国旧金山举行，包括中国解放区代表董必武在内的中国代表团出席了会议。中国成为联合国的创始国和安理会五个常任理事国之一。<\/span>\n<\/li><\/ul>\n<\/section>\n<section class=\"lvl-5\">\n<h5>（二）世界反法西斯力量对中国的援助<\/h5>\n<\/section>"}, {"title": "三、抗战胜利的原因和意义", "tags": ["战争战役", "思想理论", "抗日战争"], "text": "\n （一）抗日战争胜利的原因\n\n1. 以爱国主义为核心的民族精神——决定因素；\n2. 中国共产党的中流砥柱作用——关键；\n3. 全民族抗战——重要法宝；\n4. 世界所有爱好和平和正义的国家和人民、国际组织以及各种反法西斯力量的同情和支持——外部条件。\n\n 辨析题：日本投降主要因为美国的原子弹。\n\n 错误。美国向日本投放原子弹，是促使日本投降的因素之一，但不是决定因素。中国人民抗日战争是世界反法西斯战争的东方主战场，长期抗击和牵制日本陆军主力，为世界反法西斯战争的胜利作出了巨大贡献和牺牲
